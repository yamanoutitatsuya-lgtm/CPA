      <div class="qside"><div class="sheet"><div class="sheet-l">マークシート　問題${q.no}</div><div class="choices">${q.choices.map((c,i)=>`<button class="ch${m===i?' sel':''}" data-act="x-mark" data-i="${i}" aria-pressed="${m===i}"><span class="ov">${i+1}</span><span class="tx">${c}</span></button>`).join('')}</div></div>
      <div class="qnav"><button class="btn" data-act="x-go" data-d="-1" ${X.qi?'':'disabled'}>← 前の問題</button><button class="btn ${s.flags[X.qi]?'on':''}" data-act="x-flag" aria-pressed="${s.flags[X.qi]}">${s.flags[X.qi]?'★ 見直し':'☆ 見直し'}</button><button class="btn pri" data-act="x-go" data-d="1" ${X.qi<s.qs.length-1?'':'disabled'}>次の問題 →</button></div>
      <p class="kbd-hint"><kbd>1</kbd>〜<kbd>6</kbd> マーク　<kbd>←</kbd><kbd>→</kbd> 問題移動　<kbd>F</kbd> 見直し印</p></div></div></article>`;
    h+=`<div class="xmap"><div class="xmap-h">解答状況　<span>未解答 ${left}問</span></div><div class="xcells">${s.qs.map((x,i)=>`<button data-act="x-jump" data-i="${i}" class="${i===X.qi?'cur':''} ${s.marks[i]!==null?'done':''} ${s.flags[i]?'flag':''}" aria-label="問題${x.no}">${x.no}<small>${s.marks[i]!==null?s.marks[i]+1:''}</small></button>`).join('')}</div></div>`;
    return h;
  },
  vRonbun(){
    const X=this.X, s=this.sub(), b=s.blocks[X.qi];
    const links=XLAW[s.id]; const full=b.subs.reduce((a,t)=>a+t.pts,0);
    let h=this.bar()+`<div class="xtabs">${s.blocks.map((x,i)=>`<button data-act="x-jump" data-i="${i}" aria-pressed="${i===X.qi}">${XKAN[i]}</button>`).join('')}${links?`<span class="xlaw">法令：${links.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('')}</span>`:''}</div>`;
    h+=`<article class="qcard xq"><div class="qno">${XKAN[X.qi]}<span class="xpts">（配点 ${full}点）</span></div><div class="qtext">${b.q}</div>`;
    b.subs.forEach((t,j)=>{ const v=s.ans[X.qi][j]||''; h+=`<div class="xsub"><div class="xsq">${t.q}<span class="xpts">（${t.pts}点）</span></div><textarea data-xa="${X.qi},${j}" aria-label="${esc(plain(t.q).slice(0,12))} 解答欄" placeholder="答案を記入（計算問題は計算過程も）">${esc(v)}</textarea><div class="xcnt" data-cnt="${X.qi},${j}">${v.length}字</div></div>`; });
    h+=`<div class="qnav"><button class="btn" data-act="x-go" data-d="-1" ${X.qi?'':'disabled'}>← 前の大問</button><button class="btn pri" data-act="x-go" data-d="1" ${X.qi<s.blocks.length-1?'':'disabled'}>次の大問 →</button></div></article>`;
    return h;
  },
  vModal(){
    const X=this.X; if(!X.modal) return ''; const s=this.sub();
    if(X.modal==='submit'){
      const left= X.type==='tanto' ? s.marks.filter(x=>x===null).length : s.ans.flat().filter(a=>!a.trim()).length;
      return `<div class="xmodal" role="dialog" aria-modal="true"><div><h3>${s.name}の解答を終了しますか？</h3><p>${left?`<b class="ng">未解答が ${left}${X.type==='tanto'?'問':'設問'}あります。</b>`:'すべて解答済みです。'}終了すると，この科目には戻れません。</p><div class="row"><button class="btn pri" data-act="x-submit-ok">終了して次へ</button><button class="btn" data-act="x-modal-close">解答に戻る</button></div></div></div>`;
    }
    if(X.modal==='quit') return `<div class="xmodal" role="dialog" aria-modal="true"><div><h3>模擬試験を中断しますか？</h3><p>中断すると${X.type==='ronbun'?'この回は':''}最初からやり直しとなり，${X.type==='ronbun'?'この回の答案は':'結果は'}保存されません。</p><div class="row"><button class="btn danger" data-act="x-quit-ok">中断する</button><button class="btn" data-act="x-modal-close">続ける</button></div></div></div>`;
    return '';
  },
  vResult(){
    const X=this.X, S=X.summary, typ=S.type==='tanto'?'短答式':'論文式';
    const pct=v=>Math.round(v*10)/10;
    let h=`<div class="xres"><button class="btn ghost" data-act="x-home">← ホーム</button><div class="xk" style="margin-top:8px">${typ} 模擬試験の結果　<span>${fmtD(S.date)}</span></div>
      <div class="xjudge"><div class="xprob"><span>合格可能性</span><b class="tnum">${Math.round(S.p*100)}<small>%</small></b><em class="rk rk-${S.rank}">${S.rank}判定・${S.label}</em></div>
      <div class="xtot"><span>総合点</span><b class="tnum">${pct(S.tot)}<small> / ${S.max}</small></b><em>得点率 ${pct(S.ratio*100)}%</em></div></div>
      ${S.cut?`<p class="warn">40%に届かない科目があります（足切りの対象となるおそれ）。</p>`:''}
      <table class="d xtbl"><tr><th>科目</th><th class="r">得点</th><th class="r">得点率</th>${S.type==='tanto'?'<th class="r">正答</th>':''}<th>時間</th></tr>${S.subs.map(s=>`<tr class="${s.score<s.max*0.4?'cut':''}"><td>${s.name}</td><td class="r">${pct(s.score)} / ${s.max}</td><td class="r">${pct(s.score/s.max*100)}%</td>${S.type==='tanto'?`<td class="r">${s.ok} / ${s.n}</td>`:''}<td>${s.used?Math.ceil(s.used/60000)+'分':''}${s.timeUp?'（時間切れ）':''}</td></tr>`).join('')}</table>
      <p class="xsmall">判定の目安：${S.type==='tanto'?'総点数の70%を合格ラインの基準とし，1科目でも40%未満は不合格となるおそれがあります（本試験の合格基準に準拠した推定）。':'得点比率52%を合格ラインの基準とし，1科目でも40%未満は不合格となるおそれがあります。本試験は偏差値による得点調整後の比率で判定されるため，この判定は素点からの推定です。'}${S.type==='ronbun'&&S.subs.some(s=>s.mode==='kw')?'一部の科目はClaudeによる採点が使えなかったため，キーワード照合による簡易採点です。':''}</p>
      <div class="row"><button class="btn pri" data-act="x-print" data-what="result">結果と解説を印刷</button><button class="btn" data-act="x-save" data-what="result">印刷用ファイルを保存</button></div>`;
    if(!X.details) return h+`<div class="xwait"><div class="xspin"></div><p class="lead">解説を読み込んでいます…</p></div></div>`;
    if(S.type==='tanto') h+=this.vAnalysis(S,X.details,false);
    h+=`<h2 class="xh2">${S.type==='tanto'?'まちがえた問題の解説':'答案と講評・模範解答'}</h2>`;
    h+=this.review(S,X.details,false);
    return h+'</div>';
  },
  vAnalysis(S,details,print){
    const A=xAnalyze(S,details); if(!A.subjects.length) return '';
    let h=`<h2 class="xh2">講評と弱点分析</h2><div class="xana"><ul class="xnotes">${A.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
    if(A.review.length) h+=`<h3 class="xh3">重点的に復習すべき論点</h3><p class="xsmall">今回まちがえた問題を，重要度（A＞B＞C）・配点・これまでの正答率から優先度の高い順に並べています。</p><ol class="xprio">${A.review.map(v=>{ const r=typeof pageRef==='function'?pageRef(String(v.id||'')):null;
      return `<li><div><b>${esc(v.topic||'')}</b> <span class="tag ${v.r==='A'?'a':v.r==='C'?'c':''}">重要度${esc(v.r)}</span></div><div class="xsmall">${esc(v.subj)}・問題${v.no}${v.ch?'・'+esc(v.ch):''}${v.hn?`・過去の正答率 ${Math.round(v.hr*100)}%（${v.hn}回）`:'・初めての論点'}${v.blank?'・未解答':''}</div>${r?`<div class="xref">テキスト参照：${esc(r.text)}</div>`:''}</li>`; }).join('')}</ol>`;
    h+=`<h3 class="xh3">論点別の正答率</h3><p class="xsmall">「累計」は1問1答と模擬試験（今回を含む）を合わせた，その論点のこれまでの正答率です。</p>`;
    A.subjects.forEach(x=>{ h+=`<details class="xchs"${print?' open':''}><summary><b>${esc(x.name)}</b><span class="xsmall">　${x.chs.length}論点・正答率の低い順</span></summary><table class="d xtbl"><tr><th>論点（章）</th><th class="r">今回</th><th class="r">累計</th></tr>${x.chs.map(c=>`<tr class="${c.rate<0.5?'cut':''}"><td>${esc(c.ch)}</td><td class="r">${c.ok}/${c.n}</td><td class="r">${c.hist===null?'—':Math.round(c.hist*100)+'%'}</td></tr>`).join('')}</table></details>`; });
    if(S.aiReview) h+=`<div class="ex xai"><h4>Claudeによる講評と学習計画</h4><div class="model">${esc(S.aiReview)}</div></div>`;
    else if(!print && AI.state==='ready') h+=`<div class="row" style="margin-top:12px"><button class="btn" data-act="x-ai-review" ${this.X&&this.X.aiBusy?'disabled':''}>${this.X&&this.X.aiBusy?'講評を作成しています…':'Claudeに詳しい講評と学習計画を作ってもらう'}</button></div>`;
    return h+'</div>';
  },
  async aiReview(){
    const X=this.X, S=X&&X.summary; if(!S||X.aiBusy||!X.details) return; X.aiBusy=true; App.render();
    const A=xAnalyze(S,X.details);
    const data={合格可能性:Math.round(S.p*100)+'%',総合点:`${S.tot}/${S.max}`,科目:S.subs.map(s=>({科目:s.name,得点:`${s.score}/${s.max}`,正答:`${s.ok}/${s.n}`,時間切れ:!!s.timeUp})),
      講評メモ:A.notes,復習候補:A.review.map(v=>({論点:v.topic,科目:v.subj,章:v.ch,重要度:v.r,過去の正答率:v.hr===null?'初出':Math.round(v.hr*100)+'%',テキスト:((typeof pageRef==='function'&&pageRef(String(v.id||'')))||{}).text||null})),
      正答率の低い章:A.subjects.map(x=>({科目:x.name,章:x.chs.filter(c=>c.rate<0.5).map(c=>`${c.ch}（${c.ok}/${c.n}）`)}))};
    const prompt=`あなたは公認会計士試験の受験指導講師です。短答式模擬試験の結果データをもとに，受験生への講評を書いてください。
【条件】日本語で600〜900字。次の3部構成で，見出しは【総評】【科目別の弱点】【重点復習の順番】とする。【重点復習の順番】では具体的な論点名を挙げ，テキスト参照がある論点はそのページも書く。データにない事実や点数は作らない。励ましは一言にとどめ，具体的な指摘を優先する。
【結果データ】${JSON.stringify(data)}
次のJSONだけを返してください：{"review":"講評本文（改行は\\n）"}`;
    try{ const r=await AI.fn.json(prompt,{modelTier:'default'}); const t=r&&r.review?String(r.review):''; if(t){ S.aiReview=t; Store.save(); } else this.toast('講評を作成できませんでした。'); }
    catch(e){ this.toast('講評を作成できませんでした。時間をおいてもう一度お試しください。'); }
    X.aiBusy=false; if(this.X===X) App.render();
  },
  review(S,details,print){
    let h='';
    if(S.type==='tanto'){
      for(const d of details){
        const wrong=(d.items||[]).filter(it=>it.mark!==it.correct);
        h+=`<section class="xrv"><h3>${d.name}　<small>${wrong.length?`誤答・未解答 ${wrong.length}問`:'全問正解'}</small></h3>`;
        if(!print) h+=`<div class="xstrip">${(d.items||[]).map(it=>`<span class="${it.mark===it.correct?'o':'x'}">${it.no}</span>`).join('')}</div>`;
        for(const it of wrong){
          h+=`<div class="xitem"><div class="xih"><b>問題${it.no}</b><span class="tag">${esc(it.topic||'')}</span><span>あなたの解答：${it.mark===null||it.mark===undefined?'未解答':XNUM[it.mark]}</span><span class="okc">正答：${XNUM[it.correct]}</span><span>${it.pts}点</span></div>${xRefLine(it.id)}
            ${it.data?`<details${print?' open':''}><summary>共通資料</summary><div class="qtext">${it.data}</div></details>`:''}<div class="qtext">${it.html||''}</div>
            <ol class="xch">${(it.choices||[]).map((c,i)=>`<li class="${i===it.correct?'ok':i===it.mark?'ng':''}">${c}</li>`).join('')}</ol><div class="ex"><h4>解説</h4>${it.ex||''}</div></div>`;
        }
        h+='</section>';
      }
    } else {
      for(const d of details){
        const s=S.subs.find(x=>x.id===d.id)||{};
        h+=`<section class="xrv"><h3>${d.name}　<small>${Math.round((s.pct||0)*10)/10}%</small></h3>`;
        (d.blocks||[]).forEach((b,k)=>{
          const got=(b.grades||[]).reduce((a,g)=>a+g.score,0), full=b.subs.reduce((a,t)=>a+t.pts,0);
          h+=`<details class="xitem xfold"${print?' open':''}><summary class="xih"><b>${XKAN[k]}</b><span class="tag">${esc(b.t)}</span><span class="okc">${got} / ${full}点</span><span class="xopen">答案・講評・模範解答</span></summary>${xRefLine(b.id)}<details${print?' open':''}><summary>問題文</summary><div class="qtext">${b.q}</div></details>`;
          b.subs.forEach((t,j)=>{ const g=(b.grades||[])[j]||{score:0,fb:''};
            h+=`<div class="xsubr"><div class="xsq">${t.q}</div><div class="xsc ${g.score>=t.pts*0.6?'ok':'ng'}">${g.score} / ${t.pts}点</div>
              <div class="xans"><h4>あなたの答案</h4><div class="model">${esc((b.ans&&b.ans[j])||'（空欄）')}</div></div>${g.fb?`<p class="xfb"><b>講評</b>　${esc(g.fb)}</p>`:''}
              <div class="ex"><h4>模範解答</h4><div class="model">${esc(t.model)}</div>${t.ex?`<h4 style="margin-top:8px">採点のポイント</h4><p>${esc(t.ex)}</p>`:''}</div></div>`; });
          h+='</details>';
        });
        h+='</section>';
      }
    }
    return h;
  },

  /* --- 印刷 --- */
  cover(kind,s,extra){
    const t= kind==='tanto'?'短答式試験':'論文式試験';
    const notes= kind==='tanto'
      ? ['試験開始の合図があるまで，この問題冊子を開いてはいけません。','解答は，別紙の答案用紙（マークシート）の該当欄に，正答と思われる番号を一つだけマークしなさい。','各問題の配点は，問題番号の右に示しています。','問題冊子の余白は，計算等に使用して差し支えありません。','電卓の使用は認めますが，関数電卓等の使用はできません。']
      : ['試験開始の合図があるまで，この問題冊子を開いてはいけません。','答案は，別紙の答案用紙の所定の欄に記入しなさい。','計算問題は，計算過程も記入しなさい。','各問の配点は，問題文中に示しています。',s.id==='law'||s.id==='tax'?'法令基準集（会社法・税法等）を参照して差し支えありません。':'問題冊子の余白は，計算等に使用して差し支えありません。'];
    return `<section class="pg p-cover"><div class="p-top">公認会計士試験（模擬）</div><div class="p-t">${t}</div><div class="p-subj">${s.name}</div>
      <div class="p-meta">試験時間 ${s.min}分　／　${extra}</div>
      <div class="p-id"><div><span>受験番号</span><i></i></div><div><span>氏　名</span><i></i></div></div>
      <div class="p-note"><h3>注意事項</h3><ol>${notes.map(n=>`<li>${n}</li>`).join('')}</ol></div></section>`;
  },
  docBook(){
    const X=this.X, s=this.sub();
    if(X.type==='tanto'){
      let h=this.cover('tanto',s,`${s.qs.length}問・${s.pts}点`)+'<section class="pg">';
      let lastG=-1;
      s.qs.forEach(q=>{
        if(q.sogo&&q.sogo.g!==lastG){ lastG=q.sogo.g; const grp=s.qs.filter(x=>x.sogo&&x.sogo.g===q.sogo.g); h+=`<div class="p-sogo"><p class="p-sogo-h">問題${grp[0].no}から問題${grp[grp.length-1].no}までは，次の〔資料〕に基づいて解答しなさい。</p>${q.sogo.data}</div>`; }
        h+=`<div class="p-q"><div class="p-qh">問題 ${q.no}<span>（${q.pts}点）</span></div><div class="p-qt">${q.html}</div><ol class="p-ch">${q.choices.map(c=>`<li>${c}</li>`).join('')}</ol></div>`;
      });
      return h+'</section>';
    }
    let h=this.cover('ronbun',s,`大問${s.blocks.length}問`)+'<section class="pg">';
    s.blocks.forEach((b,k)=>{ h+=`<div class="p-q p-rb"><div class="p-qh">${XKAN[k]}<span>（配点 ${b.subs.reduce((a,t)=>a+t.pts,0)}点）</span></div><div class="p-qt">${b.q}</div>${b.subs.map(t=>`<div class="p-qs">${t.q}<span>（${t.pts}点）</span></div>`).join('')}</div>`; });
    return h+'</section>';
  },
  docSheet(filled){
    const X=this.X, s=this.sub();
    if(X.type==='tanto'){
      const rows=s.qs.map((q,i)=>`<tr><th>${q.no}</th>${[0,1,2,3,4,5].map(k=>`<td><span class="bub${filled&&s.marks[i]===k?' f':''}">${k+1}</span></td>`).join('')}</tr>`);
      const half=Math.ceil(rows.length/2);
      const tb=r=>`<table class="p-mark"><tr><th>解答<br>番号</th>${[1,2,3,4,5,6].map(k=>`<th>${k}</th>`).join('')}</tr>${r.join('')}</table>`;
      return `<section class="pg p-sheet"><div class="p-sh"><div><b>答案用紙（マークシート）</b><span>短答式試験　${s.name}</span></div><div class="p-id sm"><div><span>受験番号</span><i></i></div><div><span>氏名</span><i></i></div></div></div>
        <p class="p-hint">マーク例　良い例：<span class="bub f">1</span>　HBの鉛筆で，○の中を塗りつぶすこと。</p><div class="p-cols">${tb(rows.slice(0,half))}${tb(rows.slice(half))}</div></section>`;
    }
    let h=`<section class="pg p-sheet"><div class="p-sh"><div><b>答案用紙</b><span>論文式試験　${s.name}</span></div><div class="p-id sm"><div><span>受験番号</span><i></i></div><div><span>氏名</span><i></i></div></div></div>`;
    s.blocks.forEach((b,k)=>{ b.subs.forEach((t,j)=>{ const txt=filled?(s.ans[k][j]||''):''; const n=Math.max(8,Math.min(26,Math.round(t.pts*1.6)));
      h+=`<div class="p-ans"><div class="p-ah">${XKAN[k]}　${(plain(t.q).match(/^問\s*\d+/)||['問'+(j+1)])[0]}</div>${txt?`<div class="p-fill">${esc(txt)}</div>`:`<div class="p-lines">${'<i></i>'.repeat(n)}</div>`}</div>`; }); });
    return h+'</section>';
  },
  docResult(){
    const S=this.X.summary, typ=S.type==='tanto'?'短答式':'論文式'; const pct=v=>Math.round(v*10)/10;
    return `<section class="pg"><div class="p-top">公認会計士試験（模擬）　${typ}　成績表</div><div class="p-t" style="font-size:20pt">${fmtD(S.date)} 実施</div>
      <table class="p-score"><tr><th>合格可能性</th><td>${Math.round(S.p*100)}%（${S.rank}判定・${S.label}）</td></tr><tr><th>総合点</th><td>${pct(S.tot)} / ${S.max}（${pct(S.ratio*100)}%）</td></tr></table>
      <table class="p-score"><tr><th>科目</th><th>得点</th><th>得点率</th></tr>${S.subs.map(s=>`<tr><td>${s.name}</td><td>${pct(s.score)} / ${s.max}</td><td>${pct(s.score/s.max*100)}%${s.score<s.max*0.4?'（40%未満）':''}</td></tr>`).join('')}</table>
      <div class="p-review">${this.X.details?(S.type==='tanto'?this.vAnalysis(S,this.X.details,true):'')+this.review(S,this.X.details,true):''}</div></section>`;
  },
  docFor(what){
    if(what==='book') return {title:`${this.sub().name}_問題冊子`,html:this.docBook()};
    if(what==='sheet') return {title:`${this.sub().name}_答案用紙`,html:this.docSheet(false)};
    return {title:`模擬試験結果_${fmtD(this.X.summary.date).replace(/[\/: ]/g,'')}`,html:this.docResult()};
  },
  print(what){
    const d=this.docFor(what); const root=document.getElementById('print-root'); root.innerHTML=`<div class="pdoc">${d.html}</div>`;
    let fired=false; const on=()=>{fired=true;}; window.addEventListener('beforeprint',on,{once:true});
    const t0=document.title; document.title=d.title;
    try{ window.print(); }catch(e){}
    setTimeout(()=>{ document.title=t0; window.removeEventListener('beforeprint',on); if(!fired) this.toast('この画面からは印刷画面を開けませんでした。「印刷用ファイルを保存」で保存したファイルを開いて印刷してください。',true,what); },1200);
  },
  async saveFile(what){
    const d=this.docFor(what);
    const html=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(d.title)}</title><style>${PRINT_CSS}
body{margin:0;background:#E9E9E4}.pbar-f{position:sticky;top:0;background:#222;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;font:14px sans-serif}.pbar-f button{font:inherit;padding:6px 14px;border-radius:6px;border:0;background:#E6A646;color:#1A1204;font-weight:700;cursor:pointer}
@media screen{.pdoc .pg{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:12px auto;padding:14mm;box-shadow:0 2px 12px rgba(0,0,0,.15)}}
@media print{.pbar-f{display:none}body{background:#fff}}</style></head><body><div class="pbar-f"><span>${esc(d.title)}</span><button onclick="print()">印刷する</button></div><div class="pdoc">${d.html}</div></body></html>`;
    const name=d.title+'.html';
    try{ if(window.claude&&window.claude.use){ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:name,data:html}); this.toast('印刷用ファイルを保存しました。開いて「印刷する」を押してください。'); return; } } }
    catch(e){ if(e&&e.code==='declined') return; }
    try{ const url=URL.createObjectURL(new Blob([html],{type:'text/html'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); this.toast('印刷用ファイルを保存しました。開いて「印刷する」を押してください。'); }
    catch(e){ this.toast('ファイルを保存できませんでした。'); }
  },
  toast(msg,withSave,what){
    let el=document.getElementById('xtoast'); if(!el){ el=document.createElement('div'); el.id='xtoast'; el.className='xtoast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.innerHTML=`<span>${esc(msg)}</span>${withSave?`<button class="btn pri" data-act="x-save" data-what="${what}">印刷用ファイルを保存</button>`:''}<button class="btn ghost" data-act="x-toast-close" aria-label="閉じる">×</button>`;
    el.classList.add('show'); clearTimeout(this._tt); this._tt=setTimeout(()=>el.classList.remove('show'),withSave?12000:5000);
  },

  /* --- 操作 --- */
  onClick(b,a){
    const X=this.X;
    if(a==='x-start-tanto') return this.startTanto();
    if(a==='x-start-ronbun') return this.startRonbun();
    if(a==='x-reset-ronbun'){ const rb=Store.data.ronbun; if(rb) RONBUN.flat().forEach(t=>Vault.drop(`${rb.id}_${t.id}`)); Store.data.ronbun=null; Store.save(); App.render(); this.toast('論文式の進行状況をリセットしました。'); return; }
    if(a==='x-hist') return this.openHist(b.dataset.id);
    if(a==='x-ai-review') return this.aiReview();
    if(a==='x-home'){ if(X&&X.phase==='intro'){ this.X=null; } App.go('home'); return; }
    if(a==='x-toast-close'){ const el=document.getElementById('xtoast'); if(el) el.classList.remove('show'); return; }
    if(a==='x-print') return this.print(b.dataset.what);
    if(a==='x-save') return this.saveFile(b.dataset.what);
    if(!X) return;
    if(a==='x-begin') return this.begin();
    if(a==='x-quit'){ this.pullDraft(); X.modal='quit'; App.render(); return; }
    if(a==='x-quit-ok') return this.quit();
    if(a==='x-modal-close'){ X.modal=null; App.render(); return; }
    if(a==='x-submit'){ this.pullDraft(); X.modal='submit'; App.render(); return; }
    if(a==='x-submit-ok') return this.endSubject(false);
    const s=this.sub(); if(X.phase!=='run'||!s) return;
    if(a==='x-mark'){ const i=+b.dataset.i; s.marks[X.qi]= s.marks[X.qi]===i?null:i; App.render(); return; }
    if(a==='x-flag'){ s.flags[X.qi]=!s.flags[X.qi]; App.render(); return; }
    if(a==='x-go'||a==='x-jump'){ this.pullDraft(); const n=(s.qs||s.blocks).length; X.qi= a==='x-go' ? Math.max(0,Math.min(n-1,X.qi+(+b.dataset.d))) : +b.dataset.i; App.render(); window.scrollTo(0,0); return; }
  },
  onKey(e){
    const X=this.X; if(!X||X.phase!=='run'||X.type!=='tanto'||X.modal) return;
    if(e.target.tagName==='TEXTAREA'||e.metaKey||e.ctrlKey||e.altKey) return;
    const s=this.sub();
    if(/^[1-6]$/.test(e.key)){ const i=+e.key-1; s.marks[X.qi]= s.marks[X.qi]===i?null:i; App.render(); }
    else if(e.key==='ArrowRight'&&X.qi<s.qs.length-1){ X.qi++; App.render(); }
    else if(e.key==='ArrowLeft'&&X.qi>0){ X.qi--; App.render(); }
    else if(e.key==='f'||e.key==='F'){ s.flags[X.qi]=!s.flags[X.qi]; App.render(); }
  },
};
document.addEventListener('input',e=>{ const t=e.target; if(!t.dataset||!t.dataset.xa||!Exam.X) return; const s=Exam.sub(); if(!s||!s.ans) return; const [b,j]=t.dataset.xa.split(',').map(Number); s.ans[b][j]=t.value; const c=document.querySelector(`[data-cnt="${b},${j}"]`); if(c) c.textContent=t.value.length+'字'; });
window.addEventListener('beforeunload',e=>{ if(Exam.running()){ e.preventDefault(); e.returnValue=''; } });

function buildEssay(item){ const o=item.gen?item.gen():{q:item.q,model:item.model,kw:item.kw}; return {item,kind:'essay',q:o.q,model:o.model,kw:o.kw}; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=sel=>document.querySelector(sel);
const FIELD={}; SUBJECTS.forEach(s=>s.fields.forEach(f=>{FIELD[f.id]={...f,subj:s};}));
const chNo=ch=>{ const m=/第\s*(\d+)/.exec(ch.replace(/[０-９]/g,d=>'０１２３４５６７８９'.indexOf(d))); return m?+m[1]:999; };

/* ---- 保存（端末＋アカウント） ---- */
const KEY='cpa-mark-drill.v1';
const Store={
  data:{v:1,stats:{},exams:[],ronbun:null,opts:{count:10,rank:'ABC',adv:true,order:'random',skin:'sheet',rv2:true},updated:0}, doc:null, timer:null, mode:'local',
  load(){ try{ const s=localStorage.getItem(KEY); if(s){ const d=JSON.parse(s); if(d&&d.stats){ if(d.opts&&!d.opts.rv2){ d.opts.rank='ABC'; d.opts.rv2=true; } this.data={...this.data,...d,opts:{...this.data.opts,...(d.opts||{})}}; } } }catch(e){} this.migrate(); },
  migrate(){ const o=this.data.opts||(this.data.opts={}); if(!o.rv2){ o.rank='ABC'; o.rv2=true; } if(!['A','AB','ABC'].includes(o.rank)) o.rank='ABC'; },
  async connect(){
    try{
      if(!window.claude||!window.claude.use) return;
      const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
      if(!user||!db) return; const id=await user.id(); if(!id) return;
      this.db=db; this.uid=id; this.doc=db.doc('data/users/'+id+'/progress');
      const snap=await this.doc.get();
      if(snap.exists){ const d=snap.data(); if(d && (d.updated||0)>(this.data.updated||0)){ this.data={...this.data,...JSON.parse(JSON.stringify(d))}; this.migrate(); try{localStorage.setItem(KEY,JSON.stringify(this.data));}catch(e){} if(App.view==='home') App.render(); } }
      this.mode='account'; App.syncLabel();
    }catch(e){ this.doc=null; }
  },
  save(){
    this.data.updated=Date.now();
    try{ localStorage.setItem(KEY,JSON.stringify(this.data)); }catch(e){}
    if(this.doc){ clearTimeout(this.timer); this.timer=setTimeout(()=>{ this.doc.set(JSON.parse(JSON.stringify(this.data))).catch(()=>{ this.mode='local'; App.syncLabel(); }); },1500); }
  },
  rec(id,ok){ const s=this.data.stats[id]||{n:0,c:0,last:null,t:0}; s.n++; if(ok)s.c++; s.last=ok?1:0; s.t=Date.now(); this.data.stats[id]=s; this.save(); },
};

/* ---- Claude による理由・記述の採点（使えない環境では自己判定） ---- */
const AI={ fn:null, state:'unknown',
  async init(){ try{ if(window.claude&&window.claude.use) this.fn=await claude.use('sample'); }catch(e){} this.state=this.fn?'ready':'off'; if(App.view==='quiz') App.render(); },
  async json(prompt){ if(!this.fn) throw {code:'off'}; try{ return await this.fn.json(prompt,{modelTier:'quick'}); }catch(e){ if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e&&e.code)) this.state='off'; throw e; } },
};
const plain=h=>{const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim();};
function reasonPrompt(q,choice,reason){
  const stem=plain(q.html.split('<ul')[0]);
  const lines=q.st.map((x,i)=>`${KANA[i]}：${x.s}\n　→ 正解：${x.ok?'○（正しい）':'×（誤り）'}${x.ok?'':'。根拠：'+x.why}`).join('\n');
  return `あなたは公認会計士試験の採点者です。短答式の組合せ問題で，受験生が選択肢を選び，その理由を書きました。理由の内容が正しいかを判定してください。
【判定基準】
- 受験生が述べた根拠が，下の正解データとニュアンスとして一致していれば ok=true とする（言い回しの違いや簡潔な表現は許容する。すべての肢に触れていなくてもよい）。
- 述べた根拠に誤り（事実に反する内容，○の肢を誤りとする根拠，×の肢を正しいとする根拠）が含まれる場合は ok=false とする。
- 肢の正誤や根拠に触れていない，意味のない文字列，問題文の書き写しだけの場合は ok=false とする。
- 選んだ番号の正誤とは切り離し，理由の中身だけで判定する。
【問題】${stem}
${lines}
【正答】${q.choices[q.correct]}
【受験生の選択】${q.choices[choice]}
【受験生の理由】${reason}
次のJSONだけを返してください：{"ok": true または false, "feedback": "日本語120字以内の講評（良い点とずれている点）"}`;
}
function essayPrompt(q,ans){
  return `あなたは公認会計士試験（${(FIELD[q.item.f]&&FIELD[q.item.f].subj.name)||'租税法'}）の採点者です。模範解答と比べて受験生の解答を採点してください。計算問題は最終数値と主要な計算過程，理論問題は要点が押さえられているかを重視し，表現の違いは許容します。
【問題】${q.q}
【模範解答】${q.model}
【受験生の解答】${ans||'（空欄）'}
次のJSONだけを返してください：{"grade": "○" または "△" または "×", "feedback": "日本語150字以内の講評"}`;
}

function poolFor(fieldIds, topicIds){
  const o=Store.data.opts;
  return BANK.filter(it=>fieldIds.includes(it.f) && (!topicIds||topicIds.includes(it.id)) && (topicIds||String(o.rank).includes(it.r)) && (o.adv||!it.adv||topicIds));
}
function pickItems(pool,count,order){
  if(!pool.length) return [];
  const st=Store.data.stats; let list;
  if(order==='weak'){
    const score=it=>{const s=st[it.id]; if(!s) return -1+Math.random()*0.1; return s.c/s.n + (s.last===0?-0.5:0) + Math.random()*0.15;};
    list=pool.slice().sort((a,b)=>score(a)-score(b));
  } else list=R.shuffle(pool);
  const n=count==='all'?pool.length:count; const out=[];
  while(out.length<n){ out.push(...list.slice(0,n-out.length)); list=R.shuffle(pool); }
  return out;
}

  async gradeReason(){

    try{ const r=await AI.json(reasonPrompt(q,choice,s.reason)); if(this.sess!==s||s.q!==q) return; this.finishTheory(!!(r&&r.ok===true), r&&r.feedback?String(r.feedback):''); }

  },

  async gradeEssay(){
    const s=this.sess, q=s.q; if(s.aiBusy) return; s.aiBusy=true; this.render();
    try{ const r=await AI.json(essayPrompt(q,s.draft)); if(this.sess!==s||s.q!==q) return; const g=['○','△','×'].includes(r&&r.grade)?r.grade:'△'; s.ai={grade:g,feedback:r&&r.feedback?String(r.feedback):''}; }
    catch(e){ if(this.sess===s) s.ai={grade:'—',feedback:'AI採点を利用できませんでした。模範解答と見比べて自己採点してください。'}; }
    s.aiBusy=false; if(this.sess===s) this.render();
  },
  nav(it){ return `<div class="qnav"><button class="btn" data-act="again">${it.kind==='calc'?'数字を変えてもう一問':it.kind==='theory'?'同じ論点で別の組合せ':'同じ論点をもう一度'}</button><button class="btn pri" data-act="next">${this.sess.i+1<this.sess.items.length?'次の問題へ':'結果を見る'}</button></div>`; },
  result(){
    const s=this.sess; const tot=s.log.length; const pts=s.log.reduce((a,b)=>a+b.v,0);
    const wrongIds=[...new Set(s.log.filter(x=>x.v<1).map(x=>x.id))];
    let h=`<h2>${esc(s.label)}　結果</h2><div class="score"><b class="tnum">${Math.round(pts*10)/10}</b><span>/ ${tot} 問正解</span></div><ul class="rlist">`+
      s.log.map((x,i)=>`<li><span class="${x.v>=1?'o':'x'}">${x.v>=1?'○':x.v>0?'△':'×'}</span><span>${esc(BYID[x.id].t)}</span><span class="t">${esc(FIELD[BYID[x.id].f].subj.name)}</span></li>`).join('')+'</ul>';
    h+=`<div class="row">${wrongIds.length?`<button class="btn pri" data-act="retry">まちがえた${wrongIds.length}論点をもう一度</button>`:''}<button class="btn" data-act="home">科目一覧へ</button></div>`;
    this._wrong=wrongIds; return h;
  },
  onClick(e){
    const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; const o=Store.data.opts;
    if(a.startsWith('x-')){ Exam.onClick(b,a); return; }
    if(a==='home' && this.view==='exam' && Exam.X){ if(Exam.active()&&Exam.X.phase!=='intro'){ if(Exam.X.phase!=='grading'){ Exam.pullDraft(); Exam.X.modal='quit'; this.render(); } return; } Exam.X=null; }
    if(a==='opt'){ let v=b.dataset.v; if(v==='true')v=true; else if(v==='false')v=false; else if(/^\d+$/.test(v))v=+v; o[b.dataset.k]=v; Store.save(); this.render(); }
    else if(a==='home'||a==='quit'){ this.go('home'); }
    else if(a==='start'){ const f=b.dataset.f; this.start(pickItems(poolFor([f]),o.count,o.order),FIELD[f].subj.name+'・'+FIELD[f].name); }
    else if(a==='mix'){ const fs=Object.keys(FIELD); this.start(pickItems(poolFor(fs),o.count,o.order),'全科目ミックス'); }
    else if(a==='wrong'||a==='allwrong'){ const fs=a==='wrong'?[b.dataset.f]:Object.keys(FIELD); const ids=BANK.filter(i=>fs.includes(i.f)&&Store.data.stats[i.id]&&Store.data.stats[i.id].last===0); this.start(R.shuffle(ids),'復習'); }
    else if(a==='pick'){ this.pickField=b.dataset.f; this.picked=new Set(); this.go('pick'); }
    else if(a==='toggle'){ const id=b.dataset.id; this.picked.has(id)?this.picked.delete(id):this.picked.add(id); this.render(); }
    else if(a==='pickall'){ BANK.filter(i=>i.f===this.pickField).forEach(i=>this.picked.add(i.id)); this.render(); }
    else if(a==='picknone'){ this.picked.clear(); this.render(); }
    else if(a==='startpick'){ const ids=[...this.picked]; const n=o.count==='all'?ids.length:Math.max(o.count,0); this.start(pickItems(BANK.filter(i=>this.picked.has(i.id)),n,o.order),FIELD[this.pickField].name+'（論点指定）'); }
    else if(a==='ans'){ const s=this.sess; if(s.ans!==null) return;
      if(s.q.kind==='theory'){ const t=$('#reason'); s.reason=t?t.value:s.reason; if((s.reason||'').replace(/\s/g,'').length<6){ s.warn=true; this.render(); const r=$('#reason'); if(r) r.focus(); return; }
        s.warn=false; s.ans=+b.dataset.i; s.rv={status:'checking'}; this.render(); this.gradeReason(); return; }
      s.ans=+b.dataset.i; const ok=s.ans===s.q.correct; Store.rec(s.q.item.id,ok); s.log.push({id:s.q.item.id,v:ok?1:0}); this.render(); }
    else if(a==='selfr'){ this.finishTheory(b.dataset.v==='1',''); }
    else if(a==='aigrade'){ this.gradeEssay(); }
    else if(a==='reveal'){ const t=$('#essay'); this.sess.draft=t?t.value:''; this.sess.ans='open'; this.render(); }
    else if(a==='grade'){ const s=this.sess; const v=+b.dataset.v; Store.rec(s.q.item.id,v>=1); s.log.push({id:s.q.item.id,v}); s.ans='done'; this.render(); }
    else if(a==='next'){ this.next(); }
    else if(a==='again'){ this.again(); }
    else if(a==='retry'){ this.start(R.shuffle(this._wrong.map(id=>BYID[id])),'まちがえた論点'); }
  },
  onKey(e){
    if(this.view==='exam'){ Exam.onKey(e); return; }
    if(this.view!=='quiz'||!this.sess) return; const s=this.sess;
    const inText=e.target.tagName==='TEXTAREA';
    if(inText){
      if(e.key==='Escape'){ e.target.blur(); e.preventDefault(); }
      else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); if(e.target.id==='essay'&&s.ans===null){ const b=document.querySelector('[data-act="reveal"]'); if(b) b.click(); } else { e.target.blur(); const c=document.querySelector('.ch:not([disabled])'); if(c) c.focus(); } }
      return;
    }
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(s.q.kind!=='essay' && s.ans===null && /^[1-6]$/.test(e.key)){ const btn=document.querySelector(`[data-act="ans"][data-i="${+e.key-1}"]`); if(btn) btn.click(); }
    else if(e.key==='Enter' && s.ans!==null && s.ans!=='open' && !(s.q.kind==='theory'&&(!s.rv||s.rv.status!=='done')) && !(e.target.tagName==='BUTTON'&&e.target.dataset.act!=='next')){ e.preventDefault(); this.next(); }
    else if((e.key==='r'||e.key==='R') && s.ans!==null && s.ans!=='open' && !(s.q.kind==='theory'&&(!s.rv||s.rv.status!=='done'))){ this.again(); }
  },
};
document.addEventListener('click',e=>App.onClick(e));
document.addEventListener('keydown',e=>App.onKey(e));
document.addEventListener('input',e=>{ if(!App.sess) return; if(e.target.id==='essay') App.sess.draft=e.target.value; if(e.target.id==='reason'){ App.sess.reason=e.target.value; if(App.sess.warn&&e.target.value.trim()){ App.sess.warn=false; const w=document.querySelector('.warn'); if(w) w.remove(); } } });
Store.load(); App.render(); Store.connect(); AI.init();

</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
