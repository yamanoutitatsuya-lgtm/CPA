E({id:'tax-dividend',f:TX,ch:'法人税法',t:'受取配当等の益金不算入（計算）',r:'A',
gen(){ const a=R.int(1,5)*1000000, b=R.int(1,5)*1000000, c=R.int(1,5)*1000000, d=R.int(1,5)*1000000;
  return {q:`内国法人である当社（資本金1億円）が当期に受け取った配当等の額は次のとおりである。受取配当等の益金不算入額を計算過程を示して求めなさい（関連法人株式等に係る控除負債利子はないものとし，源泉所得税は考慮しない）。\n・完全子法人株式等（100%保有）：${Y(a)}円\n・関連法人株式等（40%保有）：${Y(b)}円\n・その他の株式等（10%保有）：${Y(c)}円\n・非支配目的株式等（3%保有）：${Y(d)}円`,
  model:`完全子法人株式等：${Y(a)}×100%＝${Y(a)}\n関連法人株式等：${Y(b)}×100%＝${Y(b)}（控除負債利子なし）\nその他の株式等：${Y(c)}×50%＝${Y(c/2)}\n非支配目的株式等：${Y(d)}×20%＝${Y(d/5)}\n益金不算入額合計＝${Y(a+b+c/2+d/5)}円`,
  kw:['100%','50%','20%',Y(a+b+c/2+d/5)]}; }});

E({id:'tax-entertain',f:TX,ch:'法人税法',t:'交際費等の損金不算入（計算）',r:'A',
gen(){ const tot=R.int(80,200)*100000; const food=R.int(20,Math.floor(tot/100000)-10)*100000; const half=food/2; const allow=Math.max(8000000,half); const non=tot-Math.min(tot,allow);
  return {q:`当社（資本金5,000万円，期末資本金の額が1億円以下で大法人との完全支配関係はない）の当期（12か月）の交際費等の額は${Y(tot)}円であり，そのうち接待飲食費の額は${Y(food)}円である（1人当たり1万円以下の飲食費は含まれていない）。交際費等の損金不算入額を求めなさい（有利な方法を選択する）。`,
  model:`① 定額控除限度額：800万円×12/12＝8,000,000\n② 接待飲食費の50%：${Y(food)}×50%＝${Y(half)}\n損金算入限度額＝①と②のいずれか多い額＝${Y(allow)}\n損金不算入額＝${Y(tot)}－${Y(Math.min(tot,allow))}＝${Y(non)}円`,
  kw:['800万円','50%','いずれか多い',Y(non)]}; }});

E({id:'tax-donation',f:TX,ch:'法人税法',t:'一般寄附金の損金算入限度額（計算）',r:'A',

E({id:'tax-officer',f:TX,ch:'法人税法',t:'役員給与の損金算入',r:'A',
q:'法人がその役員に対して支給する給与のうち，損金の額に算入されるものの類型を3つ挙げて説明しなさい（退職給与等を除く）。',
model:'① 定期同額給与：支給時期が1月以下の一定の期間ごとである給与で，その事業年度の各支給時期における支給額が同額であるもの等。\n② 事前確定届出給与：所定の時期に確定した額の金銭等を交付する旨の定めに基づいて支給する給与で，納税地の所轄税務署長にその定めの内容に関する届出をしているもの等。\n③ 業績連動給与：利益の状況を示す指標等を基礎として算定される給与で，算定方法が報酬委員会等の適正な手続を経て決定され，有価証券報告書等で開示されているなど一定の要件を満たすもの。\nなお，これらに該当する場合でも，不相当に高額な部分の金額は損金不算入となる。',
kw:['定期同額給与','事前確定届出給与','業績連動給与','届出','不相当に高額']});

E({id:'tax-kyuyo',f:TX,ch:'所得税法',t:'給与所得の金額（計算）',r:'A',
gen(){ const S=R.int(40,84)*100000; let d; if(S<=1625000)d=550000; else if(S<=1800000)d=S*0.4-100000; else if(S<=3600000)d=S*0.3+80000; else if(S<=6600000)d=S*0.2+440000; else if(S<=8500000)d=S*0.1+1100000; else d=1950000;
  return {q:`居住者Aの本年分の給与等の収入金額は${Y(S)}円である。給与所得の金額を求めなさい（所得金額調整控除・特定支出控除は考慮しない）。`,
  model:`給与所得控除額：${S<=6600000?`${Y(S)}×20%＋440,000`:`${Y(S)}×10%＋1,100,000`}＝${Y(d)}\n給与所得の金額＝${Y(S)}－${Y(d)}＝${Y(S-d)}円`,
  kw:['給与所得控除',Y(d),Y(S-d)]}; }});

E({id:'tax-taishoku',f:TX,ch:'所得税法',t:'退職所得の金額（計算）',r:'A',
gen(){ const y=R.int(10,38); const S=R.int(10,40)*1000000; const ded= y<=20? Math.max(800000,400000*y) : 8000000+700000*(y-20); const inc=Math.max(0,(S-ded)/2);
  return {q:`居住者Bは本年，勤続${y}年で退職し，退職手当等${Y(S)}円の支払を受けた（障害者になったことによる退職ではなく，役員等勤続年数はない）。退職所得の金額を求めなさい。`,
  model:`退職所得控除額：${y<=20?`400,000×${y}年`:`8,000,000＋700,000×(${y}年－20年)`}＝${Y(ded)}\n退職所得の金額＝(${Y(S)}－${Y(ded)})×1/2＝${Y(inc)}円`,
  kw:[y<=20?'400,000':'700,000','1/2',Y(ded),Y(inc)]}; }});

E({id:'tax-ichiji',f:TX,ch:'所得税法',t:'一時所得（計算）',r:'B',
gen(){ const a=R.int(10,50)*100000, b=R.int(1,Math.floor(a/100000)-5)*100000; const inc=Math.max(0,a-b-500000);
  return {q:`居住者Cは本年，生命保険契約（本人が保険料を負担）の満期保険金${Y(a)}円を一時金で受け取った。払込保険料の総額は${Y(b)}円である。総所得金額に算入される一時所得の金額を求めなさい（他の一時所得はない）。`,
  model:`一時所得の金額＝${Y(a)}－${Y(b)}－特別控除額500,000＝${Y(inc)}\n総所得金額に算入される金額＝${Y(inc)}×1/2＝${Y(inc/2)}円`,
  kw:['500,000','1/2',Y(inc/2)]}; }});

E({id:'tax-10',f:TX,ch:'所得税法',t:'所得の種類',r:'B',

E({id:'tax-menzei',f:TX,ch:'消費税法',t:'小規模事業者の納税義務の免除',r:'A',
q:'消費税法における事業者の納税義務の免除（小規模事業者に係る納税義務の免除）について，基準期間と特定期間の考え方を含めて説明しなさい。',
model:'事業者のうち，その課税期間に係る基準期間における課税売上高が1,000万円以下である者については，その課税期間中に国内において行った課税資産の譲渡等につき，消費税を納める義務が免除される。基準期間とは，個人事業者についてはその年の前々年，法人についてはその事業年度の前々事業年度をいう。\nただし，基準期間の課税売上高が1,000万円以下であっても，特定期間（個人事業者は前年1月1日から6月30日まで，法人は原則として前事業年度開始の日以後6か月の期間）における課税売上高（又は給与等支払額）が1,000万円を超える場合には，納税義務は免除されない。\nなお，適格請求書発行事業者の登録を受けている事業者は，基準期間の課税売上高にかかわらず納税義務は免除されない。',
kw:['基準期間','1,000万円','前々年','前々事業年度','特定期間','6か月','給与等支払額','適格請求書発行事業者']});

E({id:'tax-kani',f:TX,ch:'消費税法',t:'簡易課税制度（計算）',r:'A',
gen(){ const kinds=[['卸売業',90],['小売業',80],['製造業',70],['サービス業',50]]; const k=R.pick(kinds); const S=R.int(20,49)*1000000; const tax=S*0.078; const ded=tax*k[1]/100; const pay=tax-ded;
  return {q:`簡易課税制度を選択している事業者（${k[0]}のみを営む，第${[90,80,70,60,50,40].indexOf(k[1])+1}種事業）の当課税期間の課税標準額は${Y(S)}円（税抜）である（標準税率10%のみ，売上に係る返還等はない）。納付すべき消費税額（国税分7.8%）を求めなさい。`,
  model:`課税標準額に対する消費税額＝${Y(S)}×7.8%＝${Y(tax)}\n控除対象仕入税額＝${Y(tax)}×みなし仕入率${k[1]}%＝${Y(ded)}\n納付税額＝${Y(tax)}－${Y(ded)}＝${Y(pay)}円`,
  kw:['7.8%',`${k[1]}%`,'みなし仕入率',Y(pay)]}; }});

E({id:'tax-kouka',f:TX,ch:'法人税法',t:'租税公課の損金算入・不算入',r:'B',
q:'法人が納付する次の税金等について，損金算入の可否とその時期を説明しなさい。\n①法人税（本税）　②法人住民税（道府県民税・市町村民税）　③法人事業税　④固定資産税　⑤延滞税・加算税',
model:'① 法人税の本税は損金不算入。\n② 法人住民税も損金不算入。\n③ 法人事業税は損金算入。申告納税方式のため，原則として申告書を提出した日の属する事業年度の損金となる。\n④ 固定資産税は損金算入。賦課課税方式のため，原則として賦課決定のあった日の属する事業年度（納期開始日又は実際納付日の属する事業年度も可）の損金となる。\n⑤ 延滞税・加算税（及び過怠税・罰金等）は損金不算入。',
kw:['損金不算入','損金算入','申告書を提出した日','賦課決定','延滞税','加算税']});

/* ============ 租税法（独自作成・論文式想定） ============ */
const TXN='（本問は3月決算の内国法人（普通法人）とし，当期は×6年4月1日から×7年3月31日までの12か月である。）';

E({id:'tax-dep-db',f:TX,ch:'法人税法',t:'減価償却：償却限度額と償却超過額（計算）',r:'A',
gen(){ const n=R.pick([5,8,10]); const rate={5:0.400,8:0.250,10:0.200}[n]; const X=R.int(10,60)*100000; const lim=X*rate; const book=lim+R.int(1,20)*10000;
  return {q:`${TXN}\n当社は当期首に機械装置${Y(X)}円を取得し，直ちに事業の用に供した。法定耐用年数${n}年，償却方法は定率法（200%定率法，償却率${rate.toFixed(3)}）である。当社は当期に減価償却費として${Y(book)}円を損金経理した。\n問：償却限度額及び税務調整（加算又は減算）を示しなさい。`,
  model:`償却限度額：${Y(X)}×${rate.toFixed(3)}＝${Y(lim)}（調整前償却額が償却保証額以上であるため，そのまま限度額となる）\n償却超過額：${Y(book)}－${Y(lim)}＝${Y(book-lim)}\n税務調整：減価償却超過額 ${Y(book-lim)}円を加算（留保）`,
  kw:['償却限度額',Y(lim),'償却超過額',Y(book-lim),'加算','留保']}; }});

E({id:'tax-dep-nintei',f:TX,ch:'法人税法',t:'減価償却：前期償却超過額の認容（計算）',r:'A',
gen(){ const lim=R.int(20,60)*10000; const book=lim-R.int(1,15)*10000; const ex=R.int(1,20)*10000; const nin=Math.min(lim-book,ex);
  return {q:`${TXN}\n建物について，当期の償却限度額は${Y(lim)}円であり，当社は減価償却費として${Y(book)}円を損金経理した。前期から繰り越された償却超過額は${Y(ex)}円である。\n問：当期の税務調整を示しなさい。`,
  model:`償却不足額：${Y(lim)}－${Y(book)}＝${Y(lim-book)}\n前期繰越償却超過額：${Y(ex)}\n認容額：いずれか少ない額＝${Y(nin)}\n税務調整：減価償却超過額認容 ${Y(nin)}円を減算（留保）${ex>nin?`\n翌期繰越償却超過額：${Y(ex-nin)}`:''}`,
  kw:['償却不足額','認容',Y(nin),'減算','少ない']}; }});

E({id:'tax-ikkatsu',f:TX,ch:'法人税法',t:'少額減価償却資産と一括償却資産（計算）',r:'A',
gen(){ const a=R.int(3,9)*10000, n1=R.int(2,10); const b=R.int(11,19)*10000, n2=R.int(2,10);
  const A=b*n2; const lim=A*12/36;
  return {q:`${TXN}\n当期に次の備品を取得し，事業の用に供するとともに，取得価額の全額を消耗品費として損金経理した。\n① 1個当たりの取得価額${Y(a)}円の備品 ${n1}個\n② 1個当たりの取得価額${Y(b)}円の備品 ${n2}個（一括償却資産の損金算入の規定を適用する）\n問：当期の税務調整を示しなさい（中小企業者等の少額減価償却資産の特例は適用しない）。`,
  model:`① 取得価額が10万円未満 → 少額の減価償却資産として損金経理額の全額が損金算入。調整なし。\n② 取得価額が20万円未満 → 一括償却資産\n　取得価額の合計：${Y(b)}×${n2}＝${Y(A)}\n　損金算入限度額：${Y(A)}×12/36＝${Y(lim)}\n　損金算入限度超過額：${Y(A)}－${Y(lim)}＝${Y(A-lim)}を加算（留保）`,
  kw:['10万円未満','20万円未満','一括償却資産','12/36',Y(lim),Y(A-lim),'加算']}; }});

E({id:'tax-kashidaore',f:TX,ch:'法人税法',t:'貸倒引当金（一括評価金銭債権）（計算）',r:'A',
gen(){ const kinds=[['卸売業',10],['小売業',10],['製造業',8],['サービス業（その他）',6]]; const k=R.pick(kinds); const B=R.int(50,200)*1000000; const off=R.int(1,10)*1000000; const jr=R.pick([0.004,0.005,0.007,0.012]);
  const L1=Math.round(B*jr), L2=(B-off)*k[1]/1000; const lim=Math.max(L1,L2); const C=Math.round(lim/10000)*10000+R.int(1,30)*10000;
  return {q:`${TXN}\n当社（資本金3,000万円，${k[0]}，大法人との完全支配関係なし）の期末一括評価金銭債権の帳簿価額は${Y(B)}円であり，このうち実質的に債権とみられない金額（同一取引先に対する買掛金との相殺可能額）は${Y(off)}円である。貸倒実績率は${jr}である。当社は貸倒引当金繰入額として${Y(C)}円を損金経理した。\n問：繰入限度額及び繰入限度超過額を求めなさい（有利な方法による）。`,
  model:`① 実績繰入率による限度額：${Y(B)}×${jr}＝${Y(L1)}\n② 法定繰入率による限度額：(${Y(B)}－${Y(off)})×${k[1]}/1,000＝${Y(L2)}\n繰入限度額：①と②のいずれか多い額＝${Y(lim)}\n繰入限度超過額：${Y(C)}－${Y(lim)}＝${Y(C-lim)}（加算・留保）`,
  kw:['実績繰入率','法定繰入率',`${k[1]}/1,000`,'実質的に債権とみられない',Y(lim),Y(C-lim)]}; }});

E({id:'tax-kesson',f:TX,ch:'法人税法',t:'欠損金の繰越控除（計算）',r:'A',
gen(){ const big=R.chance(0.5); const I=R.int(20,100)*1000000; const D=R.int(10,150)*1000000; const lim=big?I*0.5:I; const ded=Math.min(D,lim);
  return {q:`${TXN}\n当社（資本金${big?'5億円':'5,000万円（中小法人等に該当）'}）の当期の欠損金控除前の所得金額は${Y(I)}円である。前期以前10年以内に生じた青色欠損金の繰越額は${Y(D)}円である。\n問：当期に損金算入される欠損金額と，翌期へ繰り越す欠損金額を求めなさい。`,
  model:`控除限度額：${big?`${Y(I)}×50%＝${Y(lim)}（中小法人等以外は所得金額の50%が限度）`:`${Y(I)}×100%＝${Y(lim)}（中小法人等は所得金額の全額）`}\n損金算入額：${Y(D)}と${Y(lim)}のいずれか少ない額＝${Y(ded)}\n翌期繰越額：${Y(D)}－${Y(ded)}＝${Y(D-ded)}`,
  kw:[big?'50%':'100%','10年',Y(ded),Y(D-ded)]}; }});

E({id:'tax-kifu2',f:TX,ch:'法人税法',t:'寄附金の損金不算入額（指定寄附金・特定公益増進法人）（計算）',r:'A',
gen(){ const K=R.int(2,10)*10000000; const I=R.int(30,150)*1000000; const a=R.int(1,10)*100000, b=R.int(10,60)*100000, c=R.int(5,30)*100000;
  const GL=(K*2.5/1000+I*2.5/100)/4; const SP=(K*3.75/1000+I*6.25/100)/2; const non=Math.max(0,a+b+c-a-Math.min(b,SP)-GL);
  return {q:`${TXN}\n当社（期末の資本金の額及び資本準備金の額の合計額${Y(K)}円）が当期に支出した寄附金は次のとおりである（すべて損金経理，未払・仮払はない）。寄附金支出前所得金額は${Y(I)}円である。\n① 国・地方公共団体に対する寄附金（指定寄附金等）${Y(a)}円\n② 特定公益増進法人に対する寄附金 ${Y(b)}円\n③ その他の寄附金（一般寄附金）${Y(c)}円\n問：寄附金の損金不算入額を求めなさい。`,
  model:`一般寄附金の損金算入限度額：(${Y(K)}×2.5/1,000＋${Y(I)}×2.5/100)×1/4＝${Y(GL)}\n特別損金算入限度額：(${Y(K)}×3.75/1,000＋${Y(I)}×6.25/100)×1/2＝${Y(SP)}\n損金不算入額：支出総額${Y(a+b+c)}－指定寄附金等${Y(a)}－特定公益増進法人分（限度内）${Y(Math.min(b,SP))}－一般限度額${Y(GL)}＝${Y(non)}${non===0?'（マイナスのため0）':''}`,
  kw:['指定寄附金','全額損金','3.75/1,000','6.25/100','1/2','1/4',Y(non)]}; }});

E({id:'tax-kosai-big',f:TX,ch:'法人税法',t:'交際費等（資本金1億円超の法人）（計算）',r:'B',
gen(){ const tot=R.int(50,300)*1000000/10; const food=Math.round(tot*R.pick([0.3,0.4,0.5])/100000)*100000; const ok=food/2; const non=tot-ok;
  return {q:`${TXN}\n当社（資本金5億円）の当期の交際費等の額は${Y(tot)}円であり，このうち接待飲食費の額は${Y(food)}円である（1人当たり1万円以下の飲食費は含まれていない）。\n問：交際費等の損金不算入額を求めなさい。`,
  model:`資本金1億円超100億円以下の法人は定額控除限度額の適用はなく，接待飲食費の50%のみ損金算入される。\n損金算入限度額：${Y(food)}×50%＝${Y(ok)}\n損金不算入額：${Y(tot)}－${Y(ok)}＝${Y(non)}`,
  kw:['接待飲食費','50%','定額控除限度額',Y(non)]}; }});

E({id:'tax-group',f:TX,ch:'法人税法',t:'グループ法人税制',r:'A',
q:'完全支配関係がある内国法人間の取引に関するグループ法人税制について，①寄附金，②譲渡損益調整資産の譲渡，③受取配当等の取扱いを説明しなさい。',
model:'① 寄附金：法人による完全支配関係がある内国法人間の寄附金は，支出した法人において全額損金不算入となり，受領した法人においては受贈益の全額が益金不算入となる。\n② 譲渡損益調整資産：完全支配関係がある内国法人間で，固定資産・土地・有価証券（売買目的有価証券を除く）・金銭債権・繰延資産のうち譲渡直前の帳簿価額が1,000万円以上のもの（譲渡損益調整資産）を譲渡した場合，譲渡損益は繰り延べられ，譲受法人における譲渡・償却・評価換え・完全支配関係の解消等の事由が生じた時に計上する。\n③ 受取配当等：完全子法人株式等（配当等の計算期間を通じて完全支配関係があった法人の株式等）に係る配当等は，負債利子を控除することなく全額益金不算入となる。',
kw:['全額損金不算入','益金不算入','譲渡損益調整資産','1,000万円','繰り延','完全子法人株式等','全額']});

E({id:'tax-assyuku',f:TX,ch:'法人税法',t:'圧縮記帳（国庫補助金等）',r:'B',
q:'国庫補助金等で取得した固定資産の圧縮記帳について，その趣旨と経理方法を説明しなさい。',
model:'国庫補助金等は益金の額に算入されるため，そのままでは補助金の交付を受けた事業年度に課税が生じ，補助金の効果が減殺される。そこで，国庫補助金等の交付の目的に適合した固定資産を取得した場合，その交付の目的に適合した固定資産の圧縮限度額（交付を受けた国庫補助金等の額）の範囲内で帳簿価額を減額した金額を損金の額に算入することができる。\nこれは課税の免除ではなく，減価償却費の減少や譲渡時の譲渡益の増加を通じて将来課税される課税の繰延べである。\n経理方法には，直接減額方式のほか，確定した決算において積立金として積み立てる方法（剰余金の処分による積立金方式を含む）がある。',
kw:['益金','圧縮限度額','損金','課税の繰延','直接減額','積立金']});

E({id:'tax-dozoku',f:TX,ch:'法人税法',t:'同族会社の判定（計算・理論）',r:'B',
gen(){ const g=[R.int(15,30),R.int(8,20),R.int(5,15),R.int(3,10),R.int(3,10)]; const rest=100-g.reduce((a,b)=>a+b,0); if(rest<0) return this.gen(); const top3=g.slice(0,3).reduce((a,b)=>a+b,0); const is=top3>50;
  return {q:`当社（発行済株式総数100,000株，自己株式なし）の株主グループ別の持株割合は，Aグループ${g[0]}%，Bグループ${g[1]}%，Cグループ${g[2]}%，Dグループ${g[3]}%，Eグループ${g[4]}%，その他少数株主${rest}%である（各グループは株主とその同族関係者で構成される）。\n問：当社が同族会社に該当するかどうかを判定し，その理由を述べなさい。`,
  model:`同族会社とは，会社の株主等の3人以下並びにこれらと特殊の関係のある個人及び法人（同族関係者）がその会社の発行済株式等の総数の50%を超える数を有する場合等におけるその会社をいう。\n上位3グループの持株割合：${g[0]}%＋${g[1]}%＋${g[2]}%＝${top3}%\n${is?'50%を超えるため，同族会社に該当する。':'50%以下であるため，同族会社に該当しない。'}`,
  kw:['3人以下','同族関係者','50%を超',`${top3}%`,is?'該当する':'該当しない']}; }});

E({id:'tax-kubun',f:TX,ch:'所得税法',t:'所得区分の判定',r:'A',
gen(){ const pool=[['所有するアパートの家賃収入','不動産所得'],['上場株式の譲渡益','譲渡所得（株式等に係る譲渡所得等として申告分離課税）'],['本人が保険料を負担した生命保険契約の満期一時金','一時所得'],['会社員が副業で受け取った原稿料','雑所得（業務に係る雑所得）'],['銀行預金の利子','利子所得（源泉分離課税）'],['勤務先から受け取った賞与','給与所得'],['勤続30年で退職した際に受け取った退職金','退職所得'],['保有期間10年超の山林を伐採して譲渡したことによる所得','山林所得'],['懸賞の賞金','一時所得'],['公的年金','雑所得（公的年金等）'],['上場株式の配当','配当所得'],['個人で営む小売業の売上','事業所得']];
  const pk=R.pickN(pool,5);
  return {q:'居住者に生じた次の所得は，所得税法上いずれの所得に区分されるか答えなさい。\n'+pk.map((x,i)=>`${'①②③④⑤'[i]} ${x[0]}`).join('\n'),
  model:pk.map((x,i)=>`${'①②③④⑤'[i]} ${x[1]}`).join('\n'),
  kw:[...new Set(pk.map(x=>x[1].split('（')[0]))]}; }});

E({id:'tax-tsusan',f:TX,ch:'所得税法',t:'損益通算（計算・理論）',r:'A',
gen(){ const G=R.int(40,90)*100000; const L=R.int(10,40)*100000; const x=R.int(1,Math.floor(L/100000))*100000; const z=R.int(1,5)*100000; const ded=L-Math.min(L,x); const tot=G-ded;
  return {q:`居住者Dの本年分の各種所得の金額は次のとおりである。\n・給与所得の金額 ${Y(G)}円\n・不動産所得の金額 △${Y(L)}円（必要経費には，土地等を取得するために要した負債の利子${Y(x)}円が含まれている）\n・雑所得の金額（業務に係るもの）△${Y(z)}円\n問：損益通算後の総所得金額を求め，損益通算の対象とならない損失について説明しなさい。`,
  model:`不動産所得の損失のうち，土地等を取得するために要した負債の利子に相当する部分${Y(Math.min(L,x))}は損益通算の対象外。\n通算対象となる不動産所得の損失：${Y(L)}－${Y(Math.min(L,x))}＝${Y(ded)}\n雑所得の損失は損益通算できない（損益通算の対象は不動産所得・事業所得・山林所得・譲渡所得の損失に限られる）。\n総所得金額：${Y(G)}－${Y(ded)}＝${Y(tot)}`,
  kw:['土地等を取得するために要した負債の利子','雑所得','不動産所得','事業所得','山林所得','譲渡所得',Y(tot)]}; }});

E({id:'tax-iryo',f:TX,ch:'所得税法',t:'医療費控除（計算）',r:'A',
gen(){ const S=R.int(20,150)*10000; const H=R.int(0,Math.floor(S/10000)-10)*10000; const inc=R.int(100,800)*10000; const th=Math.min(100000,inc*0.05); const d=Math.min(2000000,Math.max(0,S-H-th));
  return {q:`居住者Eが本年中に支払った医療費（本人及び生計を一にする親族分）は${Y(S)}円であり，このうち保険金等で補塡された金額は${Y(H)}円である。Eの本年分の総所得金額等は${Y(inc)}円である（セルフメディケーション税制は選択しない）。\n問：医療費控除の額を求めなさい。`,
  model:`足切額：10万円と総所得金額等×5%（${Y(inc*0.05)}）のいずれか少ない額＝${Y(th)}\n医療費控除額：(${Y(S)}－${Y(H)})－${Y(th)}＝${Y(d)}（限度額200万円）`,
  kw:['10万円','5%','いずれか少ない','200万円',Y(d)]}; }});

E({id:'tax-joto',f:TX,ch:'所得税法',t:'総合課税の譲渡所得（計算）',r:'B',
gen(){ const s=R.int(10,60)*10000, l=R.int(20,100)*10000; const sd=Math.min(500000,s); const ld=500000-sd; const s2=s-sd, l2=Math.max(0,l-ld); const inc=s2+l2/2;
  return {q:`居住者Fは本年，次の資産（いずれも総合課税の対象となる資産）を譲渡した。\n・取得後3年で譲渡した絵画：譲渡益 ${Y(s)}円\n・取得後8年で譲渡したゴルフ会員権：譲渡益 ${Y(l)}円\n問：総所得金額に算入される譲渡所得の金額を求めなさい。`,
  model:`保有期間5年以内は短期，5年超は長期となる。\n特別控除額50万円は短期譲渡益から先に控除する。\n短期：${Y(s)}－${Y(sd)}＝${Y(s2)}\n長期：${Y(l)}－${Y(ld)}＝${Y(l2)}\n総所得金額算入額：${Y(s2)}＋${Y(l2)}×1/2＝${Y(inc)}`,
  kw:['5年','短期','長期','50万円','1/2',Y(inc)]}; }});

E({id:'tax-kazei-kubun',f:TX,ch:'消費税法',t:'課税・非課税・免税・不課税の区分',r:'A',
gen(){ const pool=[['土地の譲渡','非課税'],['住宅の貸付け（貸付期間1か月以上）','非課税'],['商品の輸出販売','免税（輸出免税）'],['国内での商品販売','課税'],['受取配当金','不課税（課税対象外）'],['寄附金の受領','不課税（課税対象外）'],['有価証券（株式）の譲渡','非課税'],['事務所用建物の貸付け','課税'],['貸付金の利子','非課税'],['国際輸送','免税（輸出免税）'],['社会保険診療','非課税'],['保険金の受領（損害保険）','不課税（課税対象外）']];
  const pk=R.pickN(pool,5);
  return {q:'国内の事業者が行う次の取引は，消費税法上，課税取引・非課税取引・免税取引・不課税取引（課税対象外）のいずれに該当するか答えなさい。\n'+pk.map((x,i)=>`${'①②③④⑤'[i]} ${x[0]}`).join('\n'),
  model:pk.map((x,i)=>`${'①②③④⑤'[i]} ${x[1]}`).join('\n')+'\n\n※課税の対象は「国内において事業者が事業として対価を得て行う資産の譲渡等」であり，これに該当しないものが不課税取引である。',
  kw:[...new Set(pk.map(x=>x[1].split('（')[0]))]}; }});

E({id:'tax-ratio',f:TX,ch:'消費税法',t:'課税売上割合と95%ルール（計算）',r:'A',
gen(){ const T=R.int(100,450)*1000000; const X=R.int(0,50)*1000000; const N=R.int(1,60)*1000000; const r=(T+X)/(T+X+N); const pct=Math.floor(r*10000)/100;
  const full= (T+X)<=500000000 && r>=0.95;
  return {q:`当課税期間（12か月）における当社の売上高（税抜）の内訳は，課税売上高${Y(T)}円，輸出免税売上高${Y(X)}円，非課税売上高${Y(N)}円である（売上に係る対価の返還等はない）。\n問：課税売上割合を求め，仕入税額の全額控除が認められるかを判定しなさい（課税売上割合は小数点以下第2位未満切捨て）。`,
  model:`課税売上割合＝(課税売上高＋免税売上高)÷(課税売上高＋免税売上高＋非課税売上高)\n＝(${Y(T)}＋${Y(X)})÷${Y(T+X+N)}＝${pct}%\n全額控除の要件：課税売上高が5億円以下（当課税期間の課税売上高${Y(T+X)}円）かつ課税売上割合が95%以上\n判定：${full?'要件を満たすため，課税仕入れ等の税額の全額を控除できる。':'要件を満たさないため，個別対応方式又は一括比例配分方式により控除額を計算する。'}`,
  kw:['免税売上高','非課税売上高','95%','5億円',`${pct}%`]}; }});

E({id:'tax-kobetsu',f:TX,ch:'消費税法',t:'仕入税額控除：個別対応方式と一括比例配分方式（計算）',r:'A',
gen(){ const a=R.int(50,300)*100000, b=R.int(5,50)*100000, c=R.int(20,150)*100000; const r=R.pick([0.8,0.75,0.85,0.9,0.6]); const ko=a+c*r, ik=(a+b+c)*r;
  return {q:`当課税期間の課税売上割合は${r*100}%（課税売上高は5億円以下）である。課税仕入れ等に係る消費税額（国税分）の区分は次のとおりである。\n・課税資産の譲渡等にのみ要するもの ${Y(a)}円\n・その他の資産の譲渡等（非課税売上）にのみ要するもの ${Y(b)}円\n・共通して要するもの ${Y(c)}円\n問：個別対応方式と一括比例配分方式による控除対象仕入税額をそれぞれ求め，有利な方式を答えなさい。`,
  model:`個別対応方式：${Y(a)}＋${Y(c)}×${r*100}%＝${Y(ko)}\n一括比例配分方式：(${Y(a)}＋${Y(b)}＋${Y(c)})×${r*100}%＝${Y(ik)}\n有利な方式：${ko>=ik?'個別対応方式':'一括比例配分方式'}（なお，一括比例配分方式を選択した場合は2年間継続適用が必要）`,
  kw:['個別対応方式','一括比例配分方式',Y(ko),Y(ik),'2年']}; }});

E({id:'tax-invoice',f:TX,ch:'消費税法',t:'インボイス制度（適格請求書等保存方式）',r:'A',
q:'適格請求書等保存方式について，①適格請求書の記載事項，②適格請求書発行事業者以外の者（免税事業者等）からの課税仕入れに係る経過措置を説明しなさい。',
model:'① 適格請求書の記載事項：(1)適格請求書発行事業者の氏名又は名称及び登録番号，(2)課税資産の譲渡等を行った年月日，(3)課税資産の譲渡等に係る資産又は役務の内容（軽減対象資産の譲渡等である場合はその旨），(4)税率ごとに区分して合計した対価の額及び適用税率，(5)税率ごとに区分した消費税額等，(6)書類の交付を受ける事業者の氏名又は名称。\n② 経過措置：適格請求書発行事業者以外の者からの課税仕入れであっても，区分記載請求書等と同様の事項が記載された請求書等及び経過措置の適用を受ける旨を記載した帳簿を保存している場合には，令和5年10月1日から令和8年9月30日までは仕入税額相当額の80%，令和8年10月1日から令和11年9月30日までは50%を控除することができる。',
kw:['登録番号','年月日','税率ごと','消費税額','80%','50%','令和8年9月30日','令和11年9月30日']});

E({id:'tax-niwari',f:TX,ch:'消費税法',t:'2割特例（計算）',r:'B',
gen(){ const S=R.int(3,9)*1000000+R.int(0,9)*100000; const tax=S*0.078; const pay=tax*0.2;
  return {q:`免税事業者であった個人事業者Gは，インボイス制度を機に適格請求書発行事業者の登録を受けた（基準期間の課税売上高は1,000万円以下）。本年の課税標準額（税抜，標準税率10%のみ）は${Y(S)}円である。2割特例を適用する。\n問：納付すべき消費税額（国税分7.8%）を求めなさい。`,
  model:`売上税額：${Y(S)}×7.8%＝${Y(tax)}\n2割特例による納付税額：${Y(tax)}×20%＝${Y(pay)}（控除対象仕入税額を売上税額の80%とする）\n※2割特例は，令和5年10月1日から令和8年9月30日までの日の属する各課税期間に適用できる。`,
  kw:['7.8%','80%','20%',Y(pay)]}; }});

E({id:'tax-sogo',f:TX,ch:'法人税法',t:'総合問題：所得金額と法人税額（計算）',r:'A',adv:true,
gen(){ const NI=R.int(20,80)*1000000; const hz=R.int(5,20)*1000000; const dep=R.int(1,10)*100000; const kosai=R.int(1,30)*100000; const fine=R.int(1,5)*10000; const div=R.int(2,10)*100000; const divEx=div/2; const zei=R.int(3,12)*100000;
  const inc=NI+hz+dep+kosai+fine-divEx-zei; const t1=Math.min(inc,8000000)*0.15; const t2=Math.max(0,inc-8000000)*0.232; const tax=Math.floor((t1+t2)/100)*100;
  return {q:`${TXN}\n当社（資本金5,000万円，中小法人等に該当，大法人との完全支配関係なし）の当期の資料は次のとおりである。\n① 確定した決算による当期純利益 ${Y(NI)}円\n② 損金経理をした法人税・住民税（当期中間納付分及び納税充当金繰入額）${Y(hz)}円\n③ 減価償却超過額 ${Y(dep)}円\n④ 交際費等の損金不算入額 ${Y(kosai)}円\n⑤ 損金経理した交通反則金 ${Y(fine)}円\n⑥ 受取配当金 ${Y(div)}円（その他の株式等に該当，益金不算入割合50%）\n⑦ 前期分の事業税を当期に納付し損金経理した額（前期に納税充当金から支出）${Y(zei)}円\n問：当期の所得金額及び法人税額（年800万円以下の部分は15%，超える部分は23.2%）を求めなさい（税額控除はないものとし，100円未満切捨て）。`,
  model:`【所得金額】\n当期純利益 ${Y(NI)}\n加算：損金経理をした法人税・住民税等 ${Y(hz)}\n　　　減価償却超過額 ${Y(dep)}\n　　　交際費等の損金不算入額 ${Y(kosai)}\n　　　交通反則金（損金不算入）${Y(fine)}\n減算：受取配当等の益金不算入額 ${Y(div)}×50%＝${Y(divEx)}\n　　　納税充当金から支出した事業税等 ${Y(zei)}\n所得金額＝${Y(inc)}\n【法人税額】\n800万円以下：${Y(Math.min(inc,8000000))}×15%＝${Y(t1)}\n800万円超：${Y(Math.max(0,inc-8000000))}×23.2%＝${Y(t2)}\n合計＝${Y(tax)}（100円未満切捨て）`,
  kw:['加算','減算','損金不算入','益金不算入','事業税','15%','23.2%',Y(inc),Y(tax)]}; }});

function reasonPrompt(q,choice,reason){

【判定基準】
- 受験生が述べた根拠が，下の正解データとニュアンスとして一致していれば ok=true とする（言い回しの違いや簡潔な表現は許容する。すべての肢に触れていなくてもよい）。
- 述べた根拠に誤り（事実に反する内容，○の肢を誤りとする根拠，×の肢を正しいとする根拠）が含まれる場合は ok=false とする。
- 肢の正誤や根拠に触れていない，意味のない文字列，問題文の書き写しだけの場合は ok=false とする。
- 選んだ番号の正誤とは切り離し，理由の中身だけで判定する。
【問題】${stem}
${lines}
【正答】${q.choices[q.correct]}
【受験生の選択】${q.choices[choice]}
【受験生の理由】${reason}
次のJSONだけを返してください：{"ok": true または false, "feedback": "日本語120字以内の講評（良い点とずれている点）"}`;

function poolFor(fieldIds, topicIds){
  const o=Store.data.opts;
  return BANK.filter(it=>fieldIds.includes(it.f) && (!topicIds||topicIds.includes(it.id)) && (o.rank==='AB'||it.r==='A'||topicIds) && (o.adv||!it.adv||topicIds));
}
function pickItems(pool,count,order){
  if(!pool.length) return [];
  const st=Store.data.stats; let list;
  if(order==='weak'){
    const score=it=>{const s=st[it.id]; if(!s) return -1+Math.random()*0.1; return s.c/s.n + (s.last===0?-0.5:0) + Math.random()*0.15;};
    list=pool.slice().sort((a,b)=>score(a)-score(b));
  } else list=R.shuffle(pool);
  const n=count==='all'?pool.length:count; const out=[];
  while(out.length<n){ out.push(...list.slice(0,n-out.length)); list=R.shuffle(pool); }
  return out;
}

    let h=`<div class="qhead"><button class="btn ghost" data-act="quit">中断</button><span class="prog">${s.i+1} / ${s.items.length}</span><span>${f.subj.name}・${f.name}</span></div>
    <div class="pbar"><b style="width:${(s.i)/s.items.length*100}%"></b></div>
    <article class="qcard"><div class="qgrid"><div class="qmain"><div class="row" style="gap:6px;margin-bottom:6px"><span class="tag ${it.r==='A'?'a':''}">重要度${it.r}</span>${it.adv?'<span class="tag adv">応用</span>':''}<span class="tag">${esc(it.ch)}</span></div>
    <div class="qno">問${s.i+1}　${esc(it.t)}</div>`;
    h+= q.kind==='essay' ? `<div class="qtext model">${esc(q.q)}</div>` : `<div class="qtext">${q.html}</div>`;
    h+='</div><div class="qside">';
    if(q.kind==='essay'){
      h+=`<div class="sheet"><div class="sheet-l">解答欄（文章・計算過程を入力）</div><textarea id="essay" aria-label="解答欄" placeholder="ここに解答を書く">${esc(s.draft||'')}</textarea></div>`;
      if(s.ans===null){ h+=`<div class="qnav"><span></span><button class="btn pri" data-act="reveal">模範解答を見る</button></div>`; }
      else {
        const txt=s.draft||''; const hits=q.kw.map(k=>({k,hit:txt.replace(/[,，\s]/g,'').includes(k.replace(/[,，\s]/g,''))}));
        h+=`<div class="ex"><h4>模範解答</h4><div class="model">${esc(q.model)}</div><h4 style="margin-top:10px">キーワード（${hits.filter(x=>x.hit).length}/${hits.length}）</h4><div class="kw">${hits.map(x=>`<span class="${x.hit?'hit':''}">${esc(x.k)}</span>`).join('')}</div></div>`;
        if(s.ai) h+=`<div class="ex"><h4>AI採点</h4><p><b style="font-size:18px">${esc(s.ai.grade)}</b>　${esc(s.ai.feedback||'')}</p></div>`;
        if(s.ans==='open' && AI.state==='ready' && !s.ai) h+=`<div class="qnav"><span></span><button class="btn pri" data-act="aigrade" ${s.aiBusy?'disabled':''}>${s.aiBusy?'採点中…':'AIで採点する'}</button></div>`;
        if(s.ans==='open') h+=`<div class="qnav"><span>${s.ai?'採点を確定：':'自己採点：'}</span><div class="row"><button class="btn" data-act="grade" data-v="1">○ 書けた</button><button class="btn" data-act="grade" data-v="0.5">△ 一部</button><button class="btn" data-act="grade" data-v="0">× 書けない</button></div></div>`;
        else h+=this.nav(it);
      }
    } else {
      if(q.kind==='theory') h+=`<div class="sheet"><div class="sheet-l">理由（必須）</div><textarea id="reason" class="reason" aria-label="解答の理由" placeholder="例：ウは貸手の区分が維持されているので誤り。エは短期リースに購入オプション付きは含まれないので誤り。" ${s.ans!==null?'readonly':''}>${esc(s.reason||'')}</textarea>${s.warn?`<p class="warn" role="alert">理由が書かれていません。正誤に関係なく，選んだ理由（各肢の正誤の根拠）を書いてから，もう一度解答してください。</p>`:''}</div>`;
      h+=`<div class="sheet"><div class="sheet-l">解答欄</div><div class="choices">`+
        q.choices.map((c,i)=>{ let cls='ch'; if(s.ans!==null){ if(i===q.correct)cls+=' right'; else if(i===s.ans)cls+=' wrong'; if(i===s.ans)cls+=' sel'; }
          return `<button class="${cls}" data-act="ans" data-i="${i}" ${s.ans!==null?'disabled':''}><span class="ov">${i+1}</span><span class="tx">${c}</span></button>`; }).join('')+`</div></div>`;
      if(s.ans!==null && q.kind==='calc'){ const ok=s.ans===q.correct;
        h+=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}<span style="font-size:14px;font-family:var(--f-body);font-weight:400;color:var(--ink2)">正答は ${ORD[q.correct]}</span></div><div class="ex"><h4>解説</h4>${q.ex}</div>`+this.nav(it); }
      if(s.ans!==null && q.kind==='theory'){ const ok=s.ans===q.correct; const rv=s.rv||{};
        let rline='';
        if(rv.status==='checking') rline=`<div class="rv">理由を採点しています…</div>`;
        else if(rv.status==='self') rline=`<div class="rv"><span>理由の判定：解説と見比べて選んでください</span><div class="row"><button class="btn" data-act="selfr" data-v="1">理由は合っていた</button><button class="btn" data-act="selfr" data-v="0">理由がずれていた</button></div></div>`;
        else if(rv.status==='done') rline=`<div class="rv ${rv.ok?'ok':'ng'}"><b>理由：${rv.ok?'○ 妥当':'× 不十分'}</b>${rv.fb?`<span>${esc(rv.fb)}</span>`:''}</div>`;
        const fin= rv.status==='done' ? (ok&&rv.ok) : null;
        h+=`<div class="verdict ${fin===null?(ok?'ok':'ng'):(fin?'ok':'ng')}">${fin===null?(ok?'番号は正解':'番号は不正解'):(fin?'正解（番号・理由とも）':(ok?'番号は正解・理由が不十分':'不正解'))}<span style="font-size:14px;font-family:var(--f-body);font-weight:400;color:var(--ink2)">正答は ${ORD[q.correct]}</span></div>${rline}<div class="ex"><h4>解説</h4>${q.ex}</div>`+(rv.status==='done'?this.nav(it):''); }
    }
    h+=`<p class="kbd-hint"><kbd>1</kbd>〜<kbd>6</kbd> 解答　<kbd>Enter</kbd> 次へ　<kbd>R</kbd> ${it.kind==='calc'?'数字を変える':'別の問題'}　<kbd>Esc</kbd> 入力欄から抜ける　<kbd>⌘</kbd>+<kbd>Enter</kbd> 理由を書き終えて解答欄へ</p>`;
    return h+'</div></div></article>';
  },
  async gradeReason(){
    const s=this.sess, q=s.q, choice=s.ans;
    if(AI.state!=='ready'){ s.rv={status:'self'}; this.render(); return; }
    try{ const r=await AI.json(reasonPrompt(q,choice,s.reason)); if(this.sess!==s||s.q!==q) return; this.finishTheory(!!(r&&r.ok===true), r&&r.feedback?String(r.feedback):''); }
    catch(e){ if(this.sess!==s||s.q!==q) return; s.rv={status:'self'}; this.render(); }
  },
  finishTheory(reasonOk,fb){ const s=this.sess; if(!s||!s.rv||s.rv.status==='done') return; const ok=s.ans===s.q.correct&&reasonOk; s.rv={status:'done',ok:reasonOk,fb}; Store.rec(s.q.item.id,ok); s.log.push({id:s.q.item.id,v:ok?1:0}); this.render(); },
  async gradeEssay(){
    const s=this.sess, q=s.q; if(s.aiBusy) return; s.aiBusy=true; this.render();
    try{ const r=await AI.json(essayPrompt(q,s.draft)); if(this.sess!==s||s.q!==q) return; const g=['○','△','×'].includes(r&&r.grade)?r.grade:'△'; s.ai={grade:g,feedback:r&&r.feedback?String(r.feedback):''}; }
    catch(e){ if(this.sess===s) s.ai={grade:'—',feedback:'AI採点を利用できませんでした。模範解答と見比べて自己採点してください。'}; }
    s.aiBusy=false; if(this.sess===s) this.render();
  },
  nav(it){ return `<div class="qnav"><button class="btn" data-act="again">${it.kind==='calc'?'数字を変えてもう一問':it.kind==='theory'?'同じ論点で別の組合せ':'同じ論点をもう一度'}</button><button class="btn pri" data-act="next">${this.sess.i+1<this.sess.items.length?'次の問題へ':'結果を見る'}</button></div>`; },
  result(){
    const s=this.sess; const tot=s.log.length; const pts=s.log.reduce((a,b)=>a+b.v,0);
    const wrongIds=[...new Set(s.log.filter(x=>x.v<1).map(x=>x.id))];
    let h=`<h2>${esc(s.label)}　結果</h2><div class="score"><b class="tnum">${Math.round(pts*10)/10}</b><span>/ ${tot} 問正解</span></div><ul class="rlist">`+
      s.log.map((x,i)=>`<li><span class="${x.v>=1?'o':'x'}">${x.v>=1?'○':x.v>0?'△':'×'}</span><span>${esc(BYID[x.id].t)}</span><span class="t">${esc(FIELD[BYID[x.id].f].subj.name)}</span></li>`).join('')+'</ul>';
    h+=`<div class="row">${wrongIds.length?`<button class="btn pri" data-act="retry">まちがえた${wrongIds.length}論点をもう一度</button>`:''}<button class="btn" data-act="home">科目一覧へ</button></div>`;
    this._wrong=wrongIds; return h;
  },
  onClick(e){
    const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; const o=Store.data.opts;
    if(a==='opt'){ let v=b.dataset.v; if(v==='true')v=true; else if(v==='false')v=false; else if(/^\d+$/.test(v))v=+v; o[b.dataset.k]=v; Store.save(); this.render(); }
    else if(a==='home'||a==='quit'){ this.go('home'); }
    else if(a==='start'){ const f=b.dataset.f; this.start(pickItems(poolFor([f]),o.count,o.order),FIELD[f].subj.name+'・'+FIELD[f].name); }
    else if(a==='mix'){ const fs=Object.keys(FIELD); this.start(pickItems(poolFor(fs),o.count,o.order),'全科目ミックス'); }
    else if(a==='wrong'||a==='allwrong'){ const fs=a==='wrong'?[b.dataset.f]:Object.keys(FIELD); const ids=BANK.filter(i=>fs.includes(i.f)&&Store.data.stats[i.id]&&Store.data.stats[i.id].last===0); this.start(R.shuffle(ids),'復習'); }
    else if(a==='pick'){ this.pickField=b.dataset.f; this.picked=new Set(); this.go('pick'); }
    else if(a==='toggle'){ const id=b.dataset.id; this.picked.has(id)?this.picked.delete(id):this.picked.add(id); this.render(); }
    else if(a==='pickall'){ BANK.filter(i=>i.f===this.pickField).forEach(i=>this.picked.add(i.id)); this.render(); }
    else if(a==='picknone'){ this.picked.clear(); this.render(); }
    else if(a==='startpick'){ const ids=[...this.picked]; const n=o.count==='all'?ids.length:Math.max(o.count,0); this.start(pickItems(BANK.filter(i=>this.picked.has(i.id)),n,o.order),FIELD[this.pickField].name+'（論点指定）'); }
    else if(a==='ans'){ const s=this.sess; if(s.ans!==null) return;
      if(s.q.kind==='theory'){ const t=$('#reason'); s.reason=t?t.value:s.reason; if((s.reason||'').replace(/\s/g,'').length<6){ s.warn=true; this.render(); const r=$('#reason'); if(r) r.focus(); return; }
        s.warn=false; s.ans=+b.dataset.i; s.rv={status:'checking'}; this.render(); this.gradeReason(); return; }
      s.ans=+b.dataset.i; const ok=s.ans===s.q.correct; Store.rec(s.q.item.id,ok); s.log.push({id:s.q.item.id,v:ok?1:0}); this.render(); }
    else if(a==='selfr'){ this.finishTheory(b.dataset.v==='1',''); }
    else if(a==='aigrade'){ this.gradeEssay(); }
    else if(a==='reveal'){ const t=$('#essay'); this.sess.draft=t?t.value:''; this.sess.ans='open'; this.render(); }
    else if(a==='grade'){ const s=this.sess; const v=+b.dataset.v; Store.rec(s.q.item.id,v>=1); s.log.push({id:s.q.item.id,v}); s.ans='done'; this.render(); }
    else if(a==='next'){ this.next(); }
    else if(a==='again'){ this.again(); }
    else if(a==='retry'){ this.start(R.shuffle(this._wrong.map(id=>BYID[id])),'まちがえた論点'); }
  },
  onKey(e){
    if(this.view!=='quiz'||!this.sess) return; const s=this.sess;
    const inText=e.target.tagName==='TEXTAREA';
    if(inText){
      if(e.key==='Escape'){ e.target.blur(); e.preventDefault(); }
      else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); if(e.target.id==='essay'&&s.ans===null){ const b=document.querySelector('[data-act="reveal"]'); if(b) b.click(); } else { e.target.blur(); const c=document.querySelector('.ch:not([disabled])'); if(c) c.focus(); } }
      return;
    }
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(s.q.kind!=='essay' && s.ans===null && /^[1-6]$/.test(e.key)){ const btn=document.querySelector(`[data-act="ans"][data-i="${+e.key-1}"]`); if(btn) btn.click(); }
    else if(e.key==='Enter' && s.ans!==null && s.ans!=='open' && !(s.q.kind==='theory'&&(!s.rv||s.rv.status!=='done')) && !(e.target.tagName==='BUTTON'&&e.target.dataset.act!=='next')){ e.preventDefault(); this.next(); }
    else if((e.key==='r'||e.key==='R') && s.ans!==null && s.ans!=='open' && !(s.q.kind==='theory'&&(!s.rv||s.rv.status!=='done'))){ this.again(); }
  },
};
document.addEventListener('click',e=>App.onClick(e));
document.addEventListener('keydown',e=>App.onKey(e));
document.addEventListener('input',e=>{ if(!App.sess) return; if(e.target.id==='essay') App.sess.draft=e.target.value; if(e.target.id==='reason'){ App.sess.reason=e.target.value; if(App.sess.warn&&e.target.value.trim()){ App.sess.warn=false; const w=document.querySelector('.warn'); if(w) w.remove(); } } });
Store.load(); App.render(); Store.connect(); AI.init();

</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
