// 問題2-1（R4Ⅱ, p.②-2）階梯式配賦法
C({id:'q-mg-kaitei',f:MC,ch:CH2,t:'階梯式配賦法（配賦順位の決定）',r:'A',g(){
  const nm=['動力部門','材料倉庫部門','工場事務部門'];
  const M=[R.int(2000,3500)*100,R.int(2000,3500)*100]; const c=[R.int(1000,2000)*100,R.int(1000,2000)*100,R.int(80,150)*100]; if(c[0]===c[1]) throw 0;
  const pw=R.chance(0.6), wp=R.chance(0.6);
  // base[j] = [M1,M2,aux0,aux1,aux2,self]
  const base=[[R.int(3,8)*100000,R.int(2,6)*100000,0,pw?R.int(1,3)*100000:0,0],[R.int(5,12)*100,R.int(4,10)*100,wp?R.int(2,6)*100:0,0,0],[R.int(10,30),R.int(10,30),R.int(5,12),R.int(5,12),0]];
  const self2=R.int(3,6);
  const cnt=[pw?1:0,wp?1:0,2];
  const ord=[0,1,2].sort((a,b)=>cnt[b]-cnt[a]||c[b]-c[a]);
  const step=(order,selfIn)=>{ const v=[M[0],M[1],c[0],c[1],c[2]], done=new Set(), out=[0,0,0];
    for(const j of order){ const tot=v[2+j]; out[j]=tot; const rc=[0,1,...[0,1,2].filter(k=>k!==j&&!done.has(k)).map(k=>2+k)].filter(k=>base[j][k]>0);
      const den=sum(rc.map(k=>base[j][k]))+(selfIn&&j===2?self2:0); rc.forEach(k=>{v[k]+=tot*base[j][k]/den;}); v[2+j]=0; done.add(j); }
    return {m:[v[0],v[1]],out}; };
  const dir=()=>{ const v=[M[0],M[1]]; [0,1,2].forEach(j=>{const d=base[j][0]+base[j][1]; v[0]+=c[j]*base[j][0]/d; v[1]+=c[j]*base[j][1]/d;}); return v; };
  const R0=step(ord,false);
  const ordC=[0,1,2].sort((a,b)=>c[b]-c[a]); const ordS=[ord[0],ord[2],ord[1]];
  const alts=[step(ordC,false),step(ordS,false),step(ord,true)];
  const ask=R.pick(['m2','m1','out']); const pwr=0;
  let a,w,lab;
  if(ask==='m2'){ lab='補助部門費配賦後の第2製造部門費'; a=rd(R0.m[1]); w=[...alts.map(x=>rd(x.m[1])),rd(dir()[1]),rd(R0.m[0])]; }
  else if(ask==='m1'){ lab='補助部門費配賦後の第1製造部門費'; a=rd(R0.m[0]); w=[...alts.map(x=>rd(x.m[0])),rd(dir()[0]),rd(R0.m[1])]; }
  else { lab='動力部門から他部門へ配賦する合計金額'; a=rd(R0.out[pwr]); w=[c[0],...alts.map(x=>rd(x.out[pwr])),rd(c[0]+c[2]*base[2][2]/(sum(base[2].slice(0,4))))]; }
  const row=j=>[`${nm[j]}費`,...[0,1,2,3,4].map(k=>k===2+j&&j!==2?'—':(j===2&&k===4?self2:(base[j][k]||'—')))];
  return {q:P_(`当社は個別原価計算を採用し，製造部門として第1製造部門および第2製造部門があり，補助部門として動力部門，材料倉庫部門，工場事務部門がある。次の〔資料〕に基づき，階梯式配賦法によって算出される${lab}を計算しなさい（単位：千円）。なお，補助部門の配賦順位は，他の補助部門への用役提供先の数が多い部門を先順位とし，数が同じ場合には第1次集計費の多い部門を先順位とする。${RNDK}`)+
    P_('1．部門費データ（単位：千円）')+tbl([['部門費',M[0],M[1],c[0],c[1],c[2]]],['','第1製造部門','第2製造部門','動力部門','材料倉庫部門','工場事務部門'])+
    P_('2．補助部門のサービス提供実績（動力部門：動力供給量kWh，材料倉庫部門：材料出庫額千円，工場事務部門：従業員数人）')+tbl([0,1,2].map(row),['配賦元','第1製造部門','第2製造部門','動力部門','材料倉庫部門','工場事務部門']),
    a,u:'千円',w,
    ex:`用役提供先の補助部門数：動力${cnt[0]}，材料倉庫${cnt[1]}，工場事務${cnt[2]}（自部門への用役は除く）→ 配賦順位：${ord.map(j=>nm[j]).join('→')}<br>`+
      ord.map(j=>`${nm[j]}：${Y(rd(R0.out[j]))}千円を後順位の部門に配賦`).join('<br>')+`<br>第1製造部門＝${Y(rd(R0.m[0]))}千円，第2製造部門＝${Y(rd(R0.m[1]))}千円<br>よって<b>${Y(a)}千円</b>`};
}});

// 問題2-2（H30Ⅱ, p.②-5）/2-4（R2Ⅰ）相互配賦法（連立方程式法・簡便法）
C({id:'q-mg-recip3',f:MC,ch:CH2,t:'相互配賦法（補助部門3つ・連立方程式法／簡便法）',r:'A',g(){
  const M=[R.int(250,400)*10000,R.int(180,300)*10000]; const c=[R.int(80,150)*1000,R.int(300,500)*1000,R.int(200,350)*1000];
  // base[i] = [M1,M2,修繕,動力,事務]
  const base=[[R.int(3,6)*10,R.int(2,5)*10,0,R.int(1,2)*10,0],[R.int(4,8)*10000,R.int(2,5)*10000,R.int(1,2)*10000,0,0],[R.int(3,5)*10,R.int(3,5)*10,R.int(1,2)*5,R.int(1,2)*5,0]];
  const self2=R.int(1,2)*5;
  const sh=(selfIn)=>base.map((b,i)=>{ const d=sum(b)+(selfIn&&i===2?self2:0); return b.map(x=>x/d); });
  const recip=(s)=>{ const A=[[1,-s[1][2],-s[2][2]],[-s[0][3],1,-s[2][3]],[-s[0][4],-s[1][4],1]]; const x=solve(A,c); return [0,1].map(k=>M[k]+sum(x.map((xi,i)=>xi*s[i][k]))); };
  const simple=(s)=>{ const r=[0,0,0]; const m=[M[0],M[1]]; for(let i=0;i<3;i++){ for(let k=0;k<2;k++) m[k]+=c[i]*s[i][k]; for(let j=0;j<3;j++) if(j!==i) r[j]+=c[i]*s[i][2+j]; }
    for(let j=0;j<3;j++){ const d=s[j][0]+s[j][1]; m[0]+=r[j]*s[j][0]/d; m[1]+=r[j]*s[j][1]/d; } return m; };
  const direct=()=>{ const m=[M[0],M[1]]; for(let i=0;i<3;i++){ const d=base[i][0]+base[i][1]; m[0]+=c[i]*base[i][0]/d; m[1]+=c[i]*base[i][1]/d; } return m; };
  const meth=R.pick(['連立方程式法','簡便法']); const k=R.int(0,1);
  const s=sh(false), s2=sh(true);
  const f= meth==='連立方程式法'?recip:simple, g= meth==='連立方程式法'?simple:recip;
  const res=f(s); const a=rd(res[k]);
  const w=[rd(g(s)[k]),rd(direct()[k]),rd(f(s2)[k]),rd(res[1-k]),rd(g(s2)[k])];
  const nm=['修繕部門費','動力部門費','工場事務部門費'], bn=['修繕回数(回)','動力供給量(kWh)','従業員数(人)'];
  return {q:P_(`当工場では部門別原価計算を採用しており，補助部門費の配賦は${meth==='連立方程式法'?'「補助部門間相互の用役の授受を計算上も完全に反映する配賦方法」（相互配賦法の連立方程式法）':'相互配賦法の簡便法（第1次配賦は補助部門間の用役授受を考慮し，第2次配賦は直接配賦法による方法）'}によっている。次の〔資料〕に基づき，補助部門費配賦後の第${k?'二':'一'}製造部門費を計算しなさい。${RND}`)+
    P_('1．部門費データ')+tbl([[M[0],M[1],c[0],c[1],c[2]]],['第一製造部門','第二製造部門','修繕部門','動力部門','工場事務部門'])+
    P_('2．補助部門費の配賦データ')+tbl([0,1,2].map(i=>[nm[i],bn[i],...base[i].map((x,j)=>j===2+i?(i===2?self2:'—'):(x||'—'))]),['','配賦基準','第一製造部門','第二製造部門','修繕部門','動力部門','工場事務部門']),
    a,u:'円',w,
    ex:(meth==='連立方程式法'?`修繕部門費の配賦総額をx，動力部門をy，工場事務部門をzとすると（工場事務部門自身の従業員数は除く）<br>x＝${Y(c[0])}＋${yen(s[1][2]*100,2)}%y＋${yen(s[2][2]*100,2)}%z<br>y＝${Y(c[1])}＋${yen(s[0][3]*100,2)}%x＋${yen(s[2][3]*100,2)}%z<br>z＝${Y(c[2])}（工場事務部門は他の補助部門から用役を受けていない）<br>これを解き，各補助部門費を製造部門へ配賦する。`
      :`第1次配賦：各補助部門費を自部門以外の全部門（他の補助部門を含む）へ配賦（工場事務部門自身の従業員数は除く）。<br>第2次配賦：第1次配賦で補助部門が受け取った額を，製造部門の用役消費量の比で直接配賦する。`)+
      `<br>第一製造部門費＝${Y(rd(res[0]))}，第二製造部門費＝${Y(rd(res[1]))}<br>よって<b>${Y(a)}円</b>`};
}});

// 問題2-7（H30Ⅱ, p.②-17）複数基準配賦法・予定配賦・予算差異
C({id:'q-mg-dualbase',f:MC,ch:CH2,t:'複数基準配賦法による予定配賦と製造部門の予算差異',r:'A',g(){
  const N1=R.int(50,80)*1200, N2=R.int(40,60)*1200;
  const F1=12*R.int(150,300)*10000, v1=R.int(150,300), F2=12*R.int(100,200)*10000, v2=R.int(100,200);
  const Fp=12*R.int(80,120)*10000, rp=R.int(8,15)*100;
  const cap1=R.int(25,40)*100, cap2=R.int(15,30)*100; const pl1=cap1-R.int(1,5)*100, pl2=cap2-R.int(0,4)*100; const Vp=rp*(pl1+pl2);
  const A1=N1/12+R.int(-40,10)*10; const k1=Math.round(pl1/12)+R.int(-10,10), k2=Math.round(pl2/12)+R.int(-10,10);
  const Fa1=F1/12+R.int(-20,20)*1000, Va1=v1*A1+R.int(-30,30)*1000; const Fpa=Fp/12+R.int(-10,10)*1000, Vpa=rp*(k1+k2)+R.int(-20,20)*1000;
  const fsh=Fp/12*cap1/(cap1+cap2);
  const allow=(capv)=> F1/12+fsh+(v1+rp*capv/N1)*A1;
  const act=Fa1+Va1+fsh+rp*k1;
  const bv=rd(allow(pl1)-act);
  const w=[rd(allow(pl1)-(Fa1+Va1+(Fpa+Vpa)*k1/(k1+k2))),rd(allow(pl1)-(Fa1+Va1+Fpa*cap1/(cap1+cap2)+Vpa*k1/(k1+k2))),rd(allow(cap1)-act),rd(allow(pl1)-(Fa1+Va1+Fp/12*k1/(k1+k2)+rp*k1)),rd(F1/12+v1*A1-Fa1-Va1),-bv];
  return {q:P_(`当工場では，製造部門費について予定配賦を行う実際部門別個別原価計算を採用している。次の〔資料〕に基づき，組立部門費の配賦差異を分析し，当月の組立部門の予算差異を計算しなさい（有利差異はプラス，不利差異は△）。${RND}`)+
    P_('1．年間の予算データ<br>(1) 部門費予算額と基準操業度（機械作業時間）')+tbl([['組立部門',F1,Y(v1*N1),`${Y(N1)}時間`],['塗装部門',F2,Y(v2*N2),`${Y(N2)}時間`],['動力部門',Fp,Y(Vp),'—']],['','固定費','変動費','基準操業度'])+
    P_('(2) 各製造部門の動力消費能力と年間予定動力消費量')+tbl([['組立部門',`${Y(cap1)}kWh`,`${Y(pl1)}kWh`],['塗装部門',`${Y(cap2)}kWh`,`${Y(pl2)}kWh`]],['','消費能力','予定消費量'])+
    P_('2．当月の実績データ')+tbl([['組立部門',Fa1,Va1,`${Y(A1)}時間`],['動力部門',Fpa,Vpa,'—']],['','固定費','変動費','実際操業度'])+
    P_(`当月の動力実際消費量：組立部門${Y(k1)}kWh，塗装部門${Y(k2)}kWh<br>3．計算条件<br>(1) 補助部門である動力部門費の製造部門への配賦は，複数基準配賦法による予定配賦（固定費は消費能力の割合で予算額を，変動費は予定配賦率×実際消費量を配賦）を行っている。<br>(2) 補助部門の固定費・変動費は，製造部門においても固定費・変動費として扱う。`),
    a:bv,u:'円',neg:true,w,
    ex:`動力部門変動費の予定配賦率＝${Y(Vp)}÷(${Y(pl1)}＋${Y(pl2)})kWh＝＠${rp}<br>`+
      `組立部門の月間固定費予算＝(${Y(F1)}＋${Y(Fp)}×${cap1}/${cap1+cap2})÷12＝${Y(rd(F1/12+fsh))}<br>`+
      `組立部門の変動費率＝(${Y(v1*N1)}＋＠${rp}×${Y(pl1)}kWh)÷${Y(N1)}時間＝＠${yen(v1+rp*pl1/N1,2)}<br>`+
      `予算許容額＝固定費予算＋変動費率×${Y(A1)}時間＝${Y(rd(allow(pl1)))}<br>`+
      `実際発生額＝自部門${Y(Fa1+Va1)}＋動力固定費${Y(rd(fsh))}＋動力変動費＠${rp}×${Y(k1)}kWh＝${Y(rd(act))}<br>予算差異＝<b>${yen(bv)}円</b>（${fav(bv)}）<br>※動力部門自体の予算差異は組立部門に負担させない。`};
}});

// 問題3-1（H24Ⅰ, p.③-2）部門別個別原価計算・階梯式配賦法
C({id:'q-mg-jobdept',f:MC,ch:CH3,t:'部門別個別原価計算（階梯式配賦・部門別実際配賦率）',r:'B',g(){
  const pa=R.int(3,6)*100, pb=R.int(4,7)*100, w=R.int(12,16)*100;
  const J=[0,1].map(()=>({a:R.int(5,20)*10,b:R.int(2,6)*100,hd:R.int(10,50)*10,hi:R.int(2,5)*10,hw:R.int(1,2)*10,m:R.int(40,150)*10}));
  const C1=R.int(50,80)*10000, C2=R.int(40,70)*10000, C3=R.int(20,40)*10000, C4=R.int(20,40)*10000; if(C3===C4) throw 0;
  const T1=R.int(10,15)*100, T2=R.int(30,40)*100;
  const rep=[R.int(4,8)*10,R.int(2,5)*10,R.int(1,2)*10], adm=[R.int(10,20),R.int(15,30),R.int(5,10)]; // 修繕→[切削,組立,事務], 事務→[切削,組立,修繕]
  const first=C3>C4?'rep':'adm';
  const calc=(order,direct)=>{ let d1=C1,d2=C2,r3=C3,a4=C4;
    const give=(tot,b3,to)=>{ const den=to?b3[0]+b3[1]+b3[2]:b3[0]+b3[1]; d1+=tot*b3[0]/den; d2+=tot*b3[1]/den; return to?tot*b3[2]/den:0; };
    if(direct){ give(r3,rep,false); give(a4,adm,false); }
    else if(order==='rep'){ a4+=give(r3,rep,true); give(a4,adm,false); } else { r3+=give(a4,adm,true); give(r3,rep,false); }
    return [d1/T1,d2/T2]; };
  const cost=(j,[o1,o2],lab)=>J[j].a*pa+J[j].b*pb+lab(J[j])*w+J[j].hd*o1+J[j].m*o2;
  const std=x=>x.hd;
  const rt=calc(first,false), rtR=calc(first==='rep'?'adm':'rep',false), rtD=calc(null,true);
  const ask=R.pick(['diff','c20']);
  const f=(r,lab)=> ask==='diff'? cost(1,r,lab)-cost(0,r,lab) : cost(1,r,lab);
  const a=rd(f(rt,std)); if(ask==='diff'&&a<=0) throw 0;
  const w_=[rd(f(rt,x=>x.hd+x.hi+x.hw)),rd(f(rtR,std)),rd(f(rtD,std)),rd(f(rt,x=>x.hd+x.hi)),rd(ask==='diff'?cost(1,rt,std)+cost(0,rt,std):cost(0,rt,std))];
  return {q:P_(`当社は実際個別原価計算を採用し，製造間接費については部門別計算を行っている。次の当月の〔資料〕に基づき，${ask==='diff'?'製造指図書#20と#10に集計された製造原価の差額（#20－#10）':'製造指図書#20に集計された製造原価'}を計算しなさい。${RND}`)+
    P_(`1．実際消費単価：材料A＠${pa}円/kg，材料B＠${pb}円/kg<br>2．指図書別データ`)+
    tbl(J.map((x,i)=>[i?'#20':'#10',`${x.a}kg`,`${x.b}kg`,`${x.hd+x.hi+x.hw}時間（直接作業${x.hd}・間接作業${x.hi}・手待${x.hw}）`,`${x.m}時間`]),['','材料A','材料B','直接工実際作業時間','機械運転時間'])+
    P_(`労務費の計算には工場全体平均賃率＠${Y(w)}円/時間を使用する。<br>3．部門費実際発生額`)+tbl([[C1,C2,C3,C4]],['切削部門','組立部門','修繕部門','工場事務部門'])+
    P_('4．補助部門費の配賦基準')+tbl([['修繕部門費（修繕回数）',rep[0]+'回',rep[1]+'回','—',rep[2]+'回'],['工場事務部門費（人員数）',adm[0]+'人',adm[1]+'人',adm[2]+'人','—']],['','切削部門','組立部門','修繕部門','工場事務部門'])+
    P_(`5．補助部門費は階梯式配賦法（第1次集計費の多い補助部門を先順位とする）により製造部門に配賦する。製造部門費は，切削部門は直接作業時間，組立部門は機械運転時間を配賦基準として実際配賦する。当月の総直接作業時間は${Y(T1)}時間，総機械運転時間は${Y(T2)}時間である。`),
    a,u:'円',w:w_,
    ex:`配賦順位：${first==='rep'?'修繕部門→工場事務部門':'工場事務部門→修繕部門'}（第1次集計費が多い方が先）<br>切削部門の実際配賦率＝＠${yen(rt[0],2)}，組立部門＝＠${yen(rt[1],2)}<br>`+
      J.map((x,i)=>`${i?'#20':'#10'}：材料${Y(x.a*pa+x.b*pb)}＋直接労務費${x.hd}h×＠${w}＋切削${x.hd}h×配賦率＋組立${x.m}h×配賦率＝${Y(rd(cost(i,rt,std)))}`).join('<br>')+
      `<br>※間接作業・手待時間の賃金は間接労務費（製造間接費）であり，指図書には直課しない。<br>よって<b>${Y(a)}円</b>`};
}});


// 問題3-3（H22Ⅰ, p.③-9）/3-4（R4Ⅰ）仕損費の直接経費処理と売上原価
C({id:'q-mg-shison-direct',f:MC,ch:CH3,t:'仕損費の直接経費処理（補修・代品製造・異常仕損）と売上原価',r:'A',g(){
  const px=R.int(8,15)*100, py=R.int(15,25)*100, r=R.int(10,15)*100;
  const Nn=R.int(20,30)*100, Ns=Nn-R.int(1,4)*100, Np=Nn+R.int(5,9)*100, Nt=Nn+R.int(10,15)*100;
  const o=R.int(25,45)*100, Bo=o*Nn; if(Bo%Ns===0) throw 0;
  const ids=['#10','#20','#30','#10A','#20R','#30C'];
  const J={}; ids.forEach(id=>{ const sm=id.length>3; J[id]={x:(sm?R.int(1,4):R.int(2,9))*100,y:(sm?R.int(1,3):R.int(1,6))*50,h:(sm?R.int(1,4):R.int(4,9))*100}; });
  const B0=R.int(30,60)*10000;
  const dir=id=>J[id].x*px+J[id].y*py+J[id].h*r;
  const cost=(id,oo)=>dir(id)+J[id].h*oo+(id==='#10'?B0:0);
  const Ab=R.int(2,6)*100000; if(Ab>=cost('#10',o)*0.7) throw 0;
  const Es=R.int(10,30)*10000, ws=Es*0.9, e=R.int(3,8)*10000;
  const undel=R.pick([null,'#20','#30']);
  const dm=R.int(-5,20)*1000, dl=R.int(-5,20)*1000, dof=R.int(-30,30)*1000;
  const Ma=sum(ids.map(id=>J[id].x*px+J[id].y*py))+dm, La=sum(ids.map(id=>J[id].h*r))+dl, Oa=sum(ids.map(id=>J[id].h*o))+dof;
  const f=(oo,{ab=false,sc=true,ev=true,vr=1,inc=false}={})=>{
    const T10A=cost('#10A',oo)-(sc?ws:0)+cost('#10',oo)-(ab?0:Ab), T20=cost('#20',oo)+cost('#20R',oo), T30=cost('#30',oo)+cost('#30C',oo)-(ev?e:0);
    const applied=sum(ids.map(id=>dir(id)+J[id].h*oo)); const dv=Ma+La+Oa-applied;
    return T10A+((undel!=='#20'||inc)?T20:0)+((undel!=='#30'||inc)?T30:0)+vr*dv; };
  const a=f(o);
  const w=[f(o,{ab:true}),f(o,{sc:false}),f(o,{ev:false}),f(o,{vr:0}),f(o,{vr:-1}),f(Bo/Ns),...(undel?[f(o,{inc:true})]:[])].map(x=>rd(x));
  return {q:P_(`当工場では個別原価計算を実施している。次の〔資料〕に基づき，当月の売上原価の金額を計算しなさい。なお，原価差異は正常なものであり，「原価計算基準」にしたがって処理する。${RND}`)+
    P_('1．原価データ<br>(1) 指図書別データ')+tbl([['期首仕掛品原価',B0,'—','—','—','—','—'],['X材料消費量',...ids.map(id=>J[id].x+'kg')],['Y材料消費量',...ids.map(id=>J[id].y+'個')],['直接作業時間',...ids.map(id=>J[id].h+'h')]],['',...ids])+
    P_(`(2) 直接材料費の計算には予定消費価格（X材料＠${Y(px)}円/kg，Y材料＠${Y(py)}円/個），直接労務費の計算には予定消費賃率＠${Y(r)}円/hを使用する。<br>`+
      `(3) 製造間接費は実際直接作業時間を基準として予定配賦する。年間製造間接費予算は${Y(Bo)}円，年間の操業度は理論的最大操業度${Y(Nt)}h，実現可能最大操業度${Y(Np)}h，正常操業度${Y(Nn)}h，期待実際操業度${Y(Ns)}hであり，当工場では景気変動の影響を平準化した操業度を基準操業度として採用している。<br>`+
      `2．仕損データ<br>(1) #10は全部が仕損と判明したため，代品製造のため新指図書#10Aを発行した。#10の製造原価のうち${Y(Ab)}円は異常な原因によるものである。仕損品の評価額はゼロである。<br>`+
      `(2) #20に正常な仕損が発生し，補修のため指図書#20Rを発行した。<br>(3) #30に正常な一部仕損が発生し，代品製造のため新指図書#30Cを発行した。仕損品の評価額は${Y(e)}円である。<br>`+
      `3．作業屑データ：#10Aに作業屑が発生した。売却見積額は${Y(Es)}円であり，販売費及び一般管理費は売却見積額の10%と見込まれる。評価額は製造原価から控除する。<br>`+
      `4．実際原価データ：材料費${Y(Ma)}円，労務費${Y(La)}円，製造間接費${Y(Oa)}円<br>5．当月末に#10A・#20・#30はすべて完成し，${undel?`${undel}以外は顧客に引き渡した（${undel}は製品として在庫）。`:'顧客に引き渡した。'}`),
    a:rd(a),u:'円',w,
    ex:`予定配賦率＝${Y(Bo)}÷正常操業度${Y(Nn)}h＝＠${o}<br>`+
      `#10A：自己の原価${Y(cost('#10A',o))}－作業屑評価額${Y(ws)}＋仕損費（#10の原価${Y(cost('#10',o))}－異常分${Y(Ab)}）＝${Y(cost('#10A',o)-ws+cost('#10',o)-Ab)}（異常分は非原価）<br>`+

C({id:'q-mg-diffalloc',f:MC,ch:CH3,t:'原価差異の会計処理（比較的多額の差異の追加配賦）',r:'B',g(){

      `2．計算条件：原価差異を比較的多額に発生したものとみなして処理する場合は，直接材料費に関する原価差異は指図書別の当月実際材料消費数量を基準に配賦し，それ以外の原価差異は合計し，指図書別の当月加工費（予定額）を基準に配賦する。`),

// 問題4-1（H10改, p.④-3）異常仕損と正常減損（非度外視法・平均法）
C({id:'q-mg-abnspoil',f:MC,ch:CH4,t:'異常仕損と正常減損費の負担（非度外視法・平均法）',r:'A',g(){
  const q0=R.int(3,8)*10, p0=R.pick([0.2,0.4,0.6,0.8]); const L=R.int(1,3)*20, S=R.int(1,3)*20, ps=R.pick([0.25,0.5,0.75]), W=R.int(2,5)*20, pw=R.pick([0.25,0.5,0.75]), Q=R.int(6,15)*20;
  const TOT=Q+L+S+W, I=TOT-q0; if(I<=0) throw 0;
  const u=R.int(20,40)*10, v=R.int(15,30)*10;
  const DMall=u*TOT, CCall=v*(Q+L/2+S*ps+W*pw);
  const DM0=q0*(u+R.int(-3,3)*10), CC0=q0*p0*(v+R.int(-3,3)*10); const DM=DMall-DM0, CC=CCall-CC0;
  const Nl=L*u+L/2*v, e0=Q+S*ps+W*pw;
  const comp=Q*(u+v)+Nl*Q/e0, abn=S*u+S*ps*v+Nl*S*ps/e0;
  const ask=R.pick(['comp','abn']);
  const a=rd(ask==='comp'?comp:abn);
  const w= ask==='comp'?[Q*(u+v)+Nl*Q/(Q+S+W),Q*(u+v)+Nl,Q*(u+v)+Nl*Q/(Q+W*pw),Q*(u+v)+L*u*Q/(Q+S+W)+L/2*v*Q/e0,Q*(u+v)].map(x=>rd(x))
    :[S*u+S*ps*v,S*u+S*ps*v+Nl*S/(Q+S+W),S*(u+v),S*u+S*ps*v+Nl*S*ps/(Q+S*ps),S*(u+v)+Nl*S/(Q+S+W)].map(x=>rd(x));
  return {q:P_(`当社は製品Aを生産しており，単一工程単純総合原価計算を採用している。次の〔資料〕に基づき，${ask==='comp'?'製品Aの完成品総合原価':'異常仕損費'}を計算しなさい。`)+
    tbl([['月初仕掛品量',`${q0}kg（${pc(p0)}）`],['当月投入量',`${I}kg`],['当月完成品量',`${Q}kg`],['正常減損量',`${L}kg（工程を通じ平均的に発生）`],['異常仕損品量',`${S}kg（${pc(ps)}）`],['月末仕掛品量',`${W}kg（${pc(pw)}）`]],['1．生産データ',''])+
    tbl([['月初仕掛品原価',DM0,CC0],['当月製造費用',DM,CC]],['2．原価データ','原料費','加工費'])+
    P_('3．その他<br>(1) 原価配分は平均法による。(2) 原料は工程の始点で投入する。(3) 減損費の計算は非度外視法による。(4) 正常減損は工程を通じて平均的に発生する。(5) 正常減損費は異常仕損品にも負担させる。異常仕損品に評価額はない。(6) （　）内の数値は加工進捗度を表す。(7) 計算上の端数処理は，完成品原価・異常仕損費等の最終数値について円未満を四捨五入する。'),
    a,u:'円',w,
    ex:`単価（平均法）：原料費＝${Y(DMall)}÷${TOT}kg＝＠${u}，加工費＝${Y(CCall)}÷${Q+L/2+S*ps+W*pw}kg＝＠${v}<br>`+
      `正常減損費＝${L}kg×＠${u}＋${L/2}kg×＠${v}＝${Y(Nl)}（平均的発生なので加工換算量は50%）<br>`+
      `正常減損は平均的に発生するため，加工費換算量（完成品${Q}：異常仕損${S*ps}：月末${W*pw}）の比で負担させる。<br>`+
      `完成品＝${Q}×＠${u+v}＋${Y(Nl)}×${Q}/${e0}＝${Y(rd(comp))}<br>異常仕損費＝${S}×＠${u}＋${S*ps}×＠${v}＋${Y(Nl)}×${S*ps}/${e0}＝${Y(rd(abn))}<br>よって<b>${Y(a)}円</b>`};

// 問題4-3（H22Ⅰ, p.④-7）副産物（終点発生・原料費部分と加工費部分）
C({id:'q-mg-byprod2',f:MC,ch:CH4,t:'副産物の評価額の控除（原料費部分・加工費部分）',r:'A',g(){

  return {q:P_(`当工場では単一の食料品を生産している。次の〔資料〕に基づき，当月の完成品総合原価${ask==='dm'?'のうち原料費部分':ask==='cc'?'のうち加工費部分':''}を計算しなさい（単位：千円）。${RNDK}`)+

    a,u:'千円',w,

// 問題4-7（H24Ⅰ, p.④-17）累加法（第2工程で正常減損・度外視法）
C({id:'q-mg-kotei-gen',f:MC,ch:CH4,t:'工程別総合原価計算（累加法・正常減損の度外視法）',r:'A',g(){
  const q0=R.int(1,3)*100, p0=R.pick([0.3,0.5]), W1=R.int(1,3)*100, a1=R.pick([0.4,0.6,0.8]), I1=R.int(15,25)*100; const T=q0+I1-W1;
  const u1=R.int(15,30), v1=R.int(8,15);
  const DMall=u1*(T+W1), CCall=v1*(T+W1*a1); const DM0=q0*(u1+R.int(-2,2)), CC0=rd(q0*p0*(v1+R.int(-2,2))); const DM=DMall-DM0, CC=CCall-CC0;
  const T1=T*(u1+v1);
  const L2=R.int(1,3)*100, W2=R.int(1,2)*100, p2=R.pick([0.4,0.5,0.8]); const Q2=T-L2-W2; if(Q2<=0) throw 0;
  const CC2=R.int(40,80)*1000;
  const comp=T1*Q2/(Q2+W2)+CC2*Q2/(Q2+W2*p2);
  const T1f=DM0+CC0+DM*(T-q0)/I1+CC*(T-q0*p0)/(T-q0*p0+W1*a1);
  const w=[T1f*Q2/(Q2+W2)+CC2*Q2/(Q2+W2*p2),T1*Q2/(Q2+L2+W2)+CC2*Q2/(Q2+L2/2+W2*p2),T1-T1*W2/(Q2+L2+W2)+CC2-CC2*W2*p2/(Q2+L2/2+W2*p2),T1*Q2/(Q2+W2*p2)+CC2*Q2/(Q2+W2*p2),(DM+CC)*T/(T+W1)+CC2*Q2/(Q2+W2*p2)].map(x=>rd(x));
  return {q:P_(`当工場では，単一製品を連続する2つの製造工程において生産し，累加法による工程別総合原価計算を実施している。第1工程の始点で材料を投入し，これを加工し完成させて，全量を第2工程に振り替えさらに加工し完成品を生産している。次の〔資料〕に基づき，第2工程の完成品原価を計算しなさい（単位：千円）。${RNDK}`)+
    tbl([['月初仕掛品',`${q0}kg（${pc(p0)}）`,'—'],['当月投入',`${Y(I1)}kg`,'各自計算'],['正常減損','—',`${L2}kg`],['月末仕掛品',`${W1}kg（${pc(a1)}）`,`${W2}kg（${pc(p2)}）`],['当月完成品','各自計算','各自計算']],['1．生産データ','第1工程','第2工程'])+
    tbl([['月初仕掛品　直接材料費',DM0,'—'],['月初仕掛品　加工費',CC0,'—'],['当月製造費用　直接材料費',DM,'—'],['当月製造費用　加工費',CC,CC2]],['2．原価データ（千円）','第1工程','第2工程'])+
    P_('3．計算条件<br>(1) 仕掛品の評価は平均法による。<br>(2) 正常減損は第2工程で平均的に発生し，非度外視法ではなく度外視法により当月完成品と月末仕掛品に負担させる。<br>（　）内は加工進捗度を示している。'),

      `第2工程：完成品＝${Y(T)}－減損${L2}－月末${W2}＝${Y(Q2)}kg。度外視法（両者負担）では減損量を分母から除いて按分する。<br>`+
      `前工程費：${Y(T1)}×${Y(Q2)}/${Y(Q2+W2)}，加工費：${Y(CC2)}×${Y(Q2)}/${Y(Q2+W2*p2)}<br>完成品原価＝<b>${Y(rd(comp))}千円</b>`};

// 問題4-11（R4Ⅱ）/4-12（H24Ⅱ, p.④-31）/4-13 追加材料（増量しない）
C({id:'q-mg-addmat',f:MC,ch:CH4,t:'追加材料（増量しない・終点／平均／途中点投入）',r:'A',g(){
  const q0=R.int(2,5)*100, W=R.int(2,5)*100, Q=R.int(15,30)*100; const I=Q+W-q0;
  const pp=[0.2,0.4,0.6,0.8]; const p0=R.pick(pp), pw=R.pick(pp);
  const mode=R.pick(['end','avg','pt']); const x=0.5;
  const E={start:p=>1,end:p=>p>=1?1:0,avg:p=>p,pt:p=>p>=x?1:0}; const eq=E[mode];
  const meth=R.pick(['平均法','先入先出法']);
  const uA=R.int(20,50)*10, uB=R.int(10,30)*10, v=R.int(30,60)*10;
  const A0=q0*(uA+R.int(-3,3)*10), B0=q0*eq(p0)*(uB+R.int(-3,3)*10), C0=q0*p0*(v+R.int(-3,3)*10);
  let A,Bc,CC;
  if(meth==='平均法'){ A=uA*(Q+W)-A0; Bc=uB*(Q+W*eq(pw))-B0; CC=v*(Q+W*pw)-C0; } else { A=uA*(Q-q0+W); Bc=uB*(Q-q0*eq(p0)+W*eq(pw)); CC=v*(Q-q0*p0+W*pw); }
  if(A<=0||Bc<=0||CC<=0) throw 0;
  const tot=A0+B0+C0+A+Bc+CC; const wip=W*uA+W*eq(pw)*uB+W*pw*v; const comp=tot-wip;
  const wipB=(f,m)=> m==='平均法'?(B0+Bc)*W*f(pw)/(Q+W*f(pw)):Bc*W*f(pw)/(Q-q0*f(p0)+W*f(pw));
  const wipA=m=> m==='平均法'?(A0+A)*W/(Q+W):A*W/(Q-q0+W), wipC=m=> m==='平均法'?(C0+CC)*W*pw/(Q+W*pw):CC*W*pw/(Q-q0*p0+W*pw);
  const alt=[];
  for(const k of ['start','end','avg','pt']) if(k!==mode){ const d=Q-q0*E[k](p0)+W*E[k](pw); if(d>0&&Q+W*E[k](pw)>0) alt.push(rd(tot-wipA(meth)-wipC(meth)-wipB(E[k],meth))); }
  const om=meth==='平均法'?'先入先出法':'平均法'; alt.push(rd(tot-wipA(om)-wipC(om)-wipB(eq,om)));
  const how= mode==='end'?'工程の終点で投入する':mode==='avg'?'工程を通じて平均的に投入する':`工程の${pc(x)}の点で投入する`;
  return {q:P_(`当工場では単一工程で製品Xを生産しており，単純総合原価計算を採用している。原料Aは工程の始点で投入し，原料Bは${how}（原料Bの投入によって製品の数量は増加しない）。原価配分方法は${meth}による。次の〔資料〕に基づき，当月の完成品総合原価を計算しなさい。${RND}`)+
    tbl([['月初仕掛品',`${Y(q0)}個（${pc(p0)}）`,A0,B0||'—',C0],['当月投入',`${Y(I)}個`,A,Bc,CC],['当月完成品',`${Y(Q)}個`,'','',''],['月末仕掛品',`${Y(W)}個（${pc(pw)}）`,'','','']],['','数量（加工進捗度）','原料A費','原料B費','加工費']),
    a:rd(comp),u:'円',w:alt,
    ex:`原料Bの完成品換算量：${mode==='end'?'終点投入なので仕掛品には含まれない（完成品のみが負担）':mode==='avg'?'平均的投入なので加工費と同じく加工進捗度で換算':`${pc(x)}点投入なので，その点を通過した仕掛品のみ100%，未通過は0%`}<br>`+
      `月初の原料B換算量＝${Y(q0*eq(p0))}，月末の原料B換算量＝${Y(W*eq(pw))}<br>`+
      `月末仕掛品＝原料A ${Y(W)}×＠${uA}＋原料B ${Y(W*eq(pw))}×＠${uB}＋加工費${Y(W*pw)}×＠${v}＝${Y(wip)}<br>`+
      `（単価：${meth==='平均法'?'(月初＋当月)÷(完成品＋月末換算量)':'当月投入÷(完成品－月初換算量＋月末換算量)'}）<br>完成品＝総原価${Y(tot)}－${Y(wip)}＝<b>${Y(rd(comp))}円</b>`};
}});

// 問題4-15（H25Ⅱ, p.④-39）/4-16（H29Ⅱ）追加材料（増量する・始点投入），加工費＝直接労務費＋予定配賦
C({id:'q-mg-addmat-inc',f:MC,ch:CH4,t:'追加材料（増量する・始点投入）と工程別計算',r:'A',g(){
  const k=R.pick([1,0.5]); const X=R.int(20,40)*100; const q0=R.int(3,8)*100, p0=R.pick([0.2,0.4,0.8]); const W=R.int(3,8)*100, pw=R.pick([0.3,0.5,0.6]);
  const In=X*(1+k); const Q=q0+In-W; if(Q<=0) throw 0;
  const be=R.pick([40,50,60,80]); const b=R.int(20,40)*10, m=R.int(10,30)*10, l=R.int(10,30)*10;
  const Bt=b*(Q+W), Mt=m*(Q+W), Lt=l*(Q+W*pw);
  const B0=q0*(b+R.int(-2,2)*10), M0=q0*(m+R.int(-2,2)*10), L0=rd(q0*p0*(l+R.int(-2,2)*10)); const T1=Bt-B0, M=Mt-M0, L=Lt-L0; if(T1<=0||M<=0||L<=0) throw 0;
  const f=1+be/100; const comp=Q*(b+m)+Q*l*f;
  const Qx=q0+X-W; const tot=Bt+Mt+Lt*f;
  const w=[Q*(b+m+l),(Bt+Mt)*Qx/(Qx+W)+Lt*f*Qx/(Qx+W*pw),(Bt+Mt)*Q/(Q+W*pw)+Lt*f*Q/(Q+W*pw),T1*(Q-q0)/In+M*(Q-q0)/In+B0+M0+(L0+L*(Q-q0*p0)/(Q-q0*p0+W*pw))*f,tot-(b+m)*W-l*W*f].map(x=>rd(x));
  return {q:P_(`当工場では，化学製品を連続する2つの製造工程において製造し，累加法による工程別総合原価計算を実施している。第2工程では，前工程完成品${k===1?'と同量':'1ℓにつき0.5ℓ'}の溶剤（原料）を工程の始点で加えて加工し製品を完成させている（追加投入された原料の分だけ全体の数量は増加する）。次の〔資料〕に基づき，第2工程の完成品原価を計算しなさい。${RND}`)+
    tbl([['月初仕掛品',`${Y(q0)}ℓ（${pc(p0)}）`],['前工程からの受入',`${Y(X)}ℓ`],['月末仕掛品',`${Y(W)}ℓ（${pc(pw)}）`],['完成品','各自計算']],['1．第2工程の当月生産データ',''])+
    tbl([['月初仕掛品',B0,M0,L0],['当月製造費用',T1,M,L]],['2．第2工程の原価データ（円）','前工程費','原料費','直接労務費'])+
    P_(`3．その他の計算条件<br>(1) 仕掛品の評価は平均法を採用している。<br>(2) 製造間接費は直接労務費の${be}%を予定配賦している（月初仕掛品についても同様）。<br>(3) 月初・月末仕掛品の数量は，溶剤投入後の数量である。`),
    a:rd(comp),u:'円',w,
    ex:`当月投入量（溶剤投入後）＝${Y(X)}ℓ×${1+k}＝${Y(In)}ℓ → 完成品＝${Y(q0)}＋${Y(In)}－${Y(W)}＝${Y(Q)}ℓ<br>`+
      `加工費＝直接労務費×(1＋${be}%)：月初${Y(L0*f)}，当月${Y(L*f)}<br>`+
      `前工程費単価＝${Y(Bt)}÷${Y(Q+W)}＝＠${b}，原料費単価＝${Y(Mt)}÷${Y(Q+W)}＝＠${m}，加工費単価＝${Y(Lt*f)}÷${Y(Q+W*pw)}＝＠${l*f}<br>`+
      `完成品＝${Y(Q)}×(＠${b}＋＠${m}＋＠${l*f})＝<b>${Y(rd(comp))}円</b>`};
}});

// 問題5-1（H15, p.⑤-3）/5-2/5-3 組別総合原価計算
C({id:'q-mg-kumi',f:MC,ch:CH5,t:'組別総合原価計算（組間接費の予定配賦）',r:'A',g(){
  const wg=R.int(5,8)*100, o=R.int(3,6)*100, Na=R.int(60,90)*1000, Bo=o*Na;
  const P=['A','B'].map(nm=>{ const q0=R.int(10,25)*100, p0=R.pick([0.3,0.5,0.8]), W=R.int(10,25)*100, pw=R.pick([0.4,0.5,0.6]), Q=R.int(50,80)*100, I=Q+W-q0;
    const uD=R.int(30,50)*10, uC=R.int(50,90)*10; const DMall=uD*(Q+W), DM0=q0*(uD+R.int(-3,3)*10), DM=DMall-DM0; const CCall=uC*(Q+W*pw);
    const h=rd((CCall-q0*p0*uC)/(wg+o),100); const CC=(wg+o)*h, CC0=CCall-CC; if(h<=0||CC0<q0*p0*uC*0.6||CC0>q0*p0*uC*1.4) throw 0;
    return {nm,q0,p0,W,pw,Q,I,uD,uC,DMall,DM0,DM,CCall,CC0,CC,h}; });
  const i=R.int(0,1), x=P[i];
  const a=(x.uD+x.uC)*x.Q;
  const w=[x.DMall*x.Q/(x.Q+x.W)+(x.CC0+wg*x.h)*x.Q/(x.Q+x.W*x.pw),x.DM0+x.DM*(x.Q-x.q0)/x.I+x.CC0+x.CC*(x.Q-x.q0*x.p0)/(x.Q-x.q0*x.p0+x.W*x.pw),x.DMall*x.Q/(x.Q+x.W)+x.CCall*x.Q/(x.Q+x.W),x.DMall*x.Q/(x.Q+x.W*x.pw)+x.CCall*x.Q/(x.Q+x.W*x.pw),(P[1-i].uD+P[1-i].uC)*P[1-i].Q].map(v=>rd(v));
  return {q:P_(`当社は，異種製品である製品Aと製品Bを組別に連続生産していることから，組別総合原価計算を採用している。次の〔資料〕に基づき，製品${x.nm}の当月完成品原価を計算しなさい。${RND}`)+
    tbl([['月初仕掛品（加工進捗度）',...P.map(p=>`${Y(p.q0)}kg（${pc(p.p0)}）`)],['当月投入直接材料',...P.map(p=>`${Y(p.I)}kg`)],['月末仕掛品（加工進捗度）',...P.map(p=>`${Y(p.W)}kg（${pc(p.pw)}）`)],['当月完成品',...P.map(p=>`${Y(p.Q)}kg`)]],['1．製品別生産データ','製品A','製品B'])+
    tbl([['直接材料費　月初仕掛品',P[0].DM0,P[1].DM0],['直接材料費　当月製造費用',P[0].DM,P[1].DM],['加工費　月初仕掛品',P[0].CC0,P[1].CC0],['直接作業時間（当月）',`${Y(P[0].h)}時間`,`${Y(P[1].h)}時間`]],['2．製造費用関連データ','製品A','製品B'])+
    P_(`3．原価の算定に関する事項<br>(1) 直接材料はすべて始点で投入している。(2) 月末仕掛品の評価方法は平均法によっている。(3) 直接労務費の1時間あたり単価は${Y(wg)}円である。<br>(4) 製造間接費の配賦は直接作業時間を基準として予定配賦を行う。なお，当年度の予定直接作業時間は${Y(Na)}時間，製造間接費予算は${Y(Bo)}円である。(5) 加工費は加工進捗度に基づいて原価を配分する。`),
    a,u:'円',w,
    ex:`予定配賦率＝${Y(Bo)}÷${Y(Na)}時間＝＠${o}<br>製品${x.nm}の当月加工費＝直接労務費${Y(x.h)}h×＠${wg}＋製造間接費${Y(x.h)}h×＠${o}＝${Y(x.CC)}<br>`+
      `直接材料費単価＝(${Y(x.DM0)}＋${Y(x.DM)})÷(${Y(x.Q)}＋${Y(x.W)})＝＠${x.uD}<br>加工費単価＝(${Y(x.CC0)}＋${Y(x.CC)})÷(${Y(x.Q)}＋${Y(x.W*x.pw)})＝＠${x.uC}<br>完成品原価＝${Y(x.Q)}×＠${x.uD+x.uC}＝<b>${Y(a)}円</b>`};

// 問題5-6（H21, p.⑤-15）等級別総合原価計算（当月製造費用を積数で按分・終点仕損）
C({id:'q-mg-grade-sp',f:MC,ch:CH5,t:'等級別総合原価計算（積数による按分・正常仕損）',r:'A',g(){
  const kD=R.pick([0.6,0.8,1.2]), kC=R.pick([0.5,0.8,1.5]);
  const IX=R.int(20,30)*1000, WX=R.int(3,6)*1000, px=R.pick([0.4,0.5,0.6]), QX=IX-WX;
  const IY=R.int(20,35)*1000, SY=R.int(5,15)*100, WY=R.int(3,6)*1000, py=R.pick([0.2,0.4,0.5]), QY=IY-SY-WY;
  const DMt=R.int(50,80)*100000, CCt=R.int(30,60)*100000, e=R.int(3,8)*10;
  const f=({c=true,sp=true,ev=true,dv=false}={})=>{ const sDX=IX*(c?kD:1), sDY=IY, sCX=(QX+WX*px)*(c?kC:1), sCY=QY+(sp?SY:0)+WY*py;
    const DMX=DMt*sDX/(sDX+sDY), DMY=DMt-DMX, CCX=CCt*sCX/(sCX+sCY), CCY=CCt-CCX;
    const ux=(DMX*QX/IX+CCX*QX/(QX+WX*px))/QX;
    const wipY=DMY*WY/(sp?IY:IY-SY)+CCY*WY*py/(QY+(sp?SY:0)+WY*py); const uy=(DMY+CCY-wipY-(ev?SY*e:0))/(dv?QY+SY:QY);
    return [ux,uy]; };
  const i=R.int(0,1); const r0=f();
  const a=rd(r0[i]);
  const w=[f({c:false}),f({sp:false}),f({ev:false}),f({dv:true}),f({c:false,ev:false})].map(x=>rd(x[i])).concat([rd(r0[1-i])]);
  return {q:P_(`当工場は等級別総合原価計算を採用し，X製品とY製品を量産している。次の〔資料〕に基づき，${i?'Y':'X'}製品1台当たりの製品製造原価を計算しなさい。${RND}`)+
    tbl([['当月投入',`${Y(IX)}台`,`${Y(IY)}台`],['仕損品','—',`${Y(SY)}台`],['月末仕掛品',`${Y(WX)}台（${pc(px)}）`,`${Y(WY)}台（${pc(py)}）`],['当月完成品',`${Y(QX)}台`,`${Y(QY)}台`]],['1．生産データ','X製品','Y製品'])+
    P_(`2．原価データ：当月直接材料費${Y(DMt)}円，当月加工費${Y(CCt)}円（月初仕掛品は存在しない）`)+
    tbl([['直接材料費',String(kD),'1'],['加工費',String(kC),'1']],['3．等価係数','X製品','Y製品'])+
    P_(`4．計算条件<br>(1) 等級別総合原価計算の方法は，各等級製品の等価係数と生産量（完成品換算量）の積数の比を用いてそれぞれの当月製造費用を按分する方法を採用している。<br>(2) 直接材料は工程の始点で投入される。<br>(3) 仕損はすべて正常なもので工程の終点で発生している。仕損品は外部売却予定額で評価をして，当月完成品総合原価から控除する。売却予定額は1台当たり${e}円とする。<br>(4) 仕損費の処理は仕損品の発生点と仕損品の進捗度により判断する。`),
    a,u:'円',w,
    ex:`直接材料費の積数：X ${Y(IX)}×${kD}＝${Y(IX*kD)}，Y ${Y(IY)}×1＝${Y(IY)}<br>加工費の積数：X ${Y(QX+WX*px)}×${kC}＝${Y(rd((QX+WX*px)*kC))}，Y (${Y(QY)}＋仕損${Y(SY)}＋${Y(WY*py)})×1＝${Y(QY+SY+WY*py)}<br>`+
      `仕損は終点発生なので完成品のみが負担（月末仕掛品の按分計算では仕損品数量を分母に含める）。仕損品評価額${Y(SY*e)}はY製品の完成品原価から控除。<br>`+
      `X製品単位原価＝${yen(r0[0],2)}，Y製品単位原価＝${yen(r0[1],2)}<br>よって<b>${Y(a)}円</b>`};
}});

// 問題5-8（H23Ⅱ, p.⑤-19）等級別総合原価計算・等価係数の推定
C({id:'q-mg-grade-coef',f:MC,ch:CH5,t:'等級別総合原価計算（等価係数の推定）',r:'B',g(){
  const u=R.int(30,60)*10, k=R.pick([0.5,0.6,0.75,0.8,1.2,1.5]);
  const QX=R.int(40,90)*1000, SX=R.int(1,5)*100, WX=R.int(5,12)*1000, QY=R.int(30,70)*1000, WY=R.int(3,10)*1000;
  const qX0=R.int(5,12)*1000, qY0=R.int(3,8)*1000;
  const X0=qX0*(u+R.int(-2,2)*10), Y0=rd(qY0*u*k)+R.int(-5,5)*1000;
  const CX=u*(QX+SX), CY=u*k*QY; const cur=u*(QX+SX+WX+k*(QY+WY))-X0-Y0; if(cur<=0) throw 0;
  const ask=R.pick(['k','cur']);
  const u2=CX/QX;
  let a,w,dp=0,un='円';
  if(ask==='k'){ a=k; dp=2; un=''; w=[CY/QY/u2,1/k,CY/CX,(CY/QY)/(CX/(QX+SX+WX)),k*(QX+SX)/QX].map(x=>Math.round(x*100)/100); }
  else { a=cur; w=[u*(QX+SX+WX+QY+WY)-X0-Y0,u2*(QX+WX+k*(QY+WY))-X0-Y0,cur+X0+Y0,u*(QX+SX+WX+(QY+WY)/k)-X0-Y0,u*(QX+SX+WX+k*QY+WY)-X0-Y0].map(x=>rd(x)); }
  return {q:P_(`当工場では，等級製品XとYを生産し，実際等級別総合原価計算を採用している。月初仕掛品原価と当月製造費用の合計額を，完成品・正常仕損品・月末仕掛品の積数（数量×等価係数）の比で按分する方法（平均法）による。次の〔資料〕に基づき，${ask==='k'?'等級製品Yの原料費の等価係数（製品X＝1，小数点以下第3位を四捨五入）':'当月製造費用のうち原料費の合計額'}を計算しなさい。原料は工程の始点で投入される。`)+
    tbl([['月初仕掛品',`${Y(qX0)}個`,`${Y(qY0)}個`],['正常仕損品（終点発生）',`${Y(SX)}個`,'—'],['月末仕掛品',`${Y(WX)}個`,`${Y(WY)}個`],['完成品',`${Y(QX)}個`,`${Y(QY)}個`]],['1．生産データ','製品X','製品Y'])+
    tbl([['月初仕掛品原価（原料費）',X0,Y0],['当月製造費用（原料費）','（各自計算）','（各自計算）'],['完成品原価（原料費）',CX,CY]],['2．原価データ（円）','製品X','製品Y'])+
    P_('（注）正常仕損費は完成品のみに負担させており，仕損品の評価額はない。製品Xの原料費の等価係数は1である。'),
    a,u:un,dp,w,
    ex:`製品Xの完成品原価には終点で発生した正常仕損${Y(SX)}個分の原価が含まれる。<br>積数1単位当たり原料費＝${Y(CX)}÷(${Y(QX)}＋${Y(SX)})＝＠${u}<br>`+
      `製品Yの等価係数＝(${Y(CY)}÷${Y(QY)})÷＠${u}＝${k}<br>`+
      `原料費の総額＝＠${u}×(${Y(QX+SX+WX)}＋${k}×${Y(QY+WY)})＝${Y(u*(QX+SX+WX+k*(QY+WY)))}<br>当月原料費＝総額－月初(${Y(X0)}＋${Y(Y0)})＝${Y(cur)}<br>よって<b>${ask==='k'?k:Y(cur)+'円'}</b>`};
}});

// 問題5-12（H11改, p.⑤-32）連産品（正常市価基準・追加加工費の実際額と正常額）
C({id:'q-mg-joint-add',f:MC,ch:CH5,t:'連産品（分離後の追加加工・kg当たり製造原価）',r:'A',g(){
  const P=['A','B','C'].map(nm=>{ const q=R.int(5,15)*1000, n=R.int(2,8)*10, p=n+R.int(6,25)*10; return {nm,q,p,n,a:n}; });
  const d=R.shuffle([0,1,2]).slice(0,2); d.forEach(j=>{ P[j].a=P[j].n+R.pick([-5,5,10,15]); });
  const J=R.int(20,40)*100000; const TOT=J+sum(P.map(x=>x.q*x.a));
  const nrv=P.map(x=>x.q*(x.p-x.n)), nrvA=P.map(x=>x.q*(x.p-x.a)), qs=sum(P.map(x=>x.q)), gr=P.map(x=>x.q*x.p);
  const i=R.int(0,2), x=P[i];
  const uc=(al,add)=>(al+x.q*add)/x.q;
  const a=rd(uc(J*nrv[i]/sum(nrv),x.a));
  const w=[rd(uc(J*nrvA[i]/sum(nrvA),x.a)),rd(uc(J*nrv[i]/sum(nrv),x.n)),rd(uc(TOT*nrv[i]/sum(nrv),0)),rd(uc(J*x.q/qs,x.a)),rd(uc(J*nrv[i]/sum(nrv),0)),rd(uc(J*gr[i]/sum(gr),x.a))];
  return {q:P_(`当社は，連産品A，B，Cの3種類の製品を生産し，これらに加工を加えたものを販売している。次の〔資料〕に基づき，製品${x.nm}のkg当たりの製造原価を最も適切な方法で計算しなさい。${RND}`)+
    tbl(P.map(o=>[o.nm,`${Y(o.q)}kg`,`${o.p}円`,`${o.n}円`]),['製品名','生産量','正常市価（kg当たり）','連産品分離後の正常追加加工費（kg当たり）'])+
    P_(`（注1）当月実際製造原価（結合原価と分離後の追加加工費の実際額の合計）は${Y(TOT)}円である。<br>（注2）分離後の追加加工費の実際額（kg当たり）は，${P.map(o=>`${o.nm}製品${o.a}円`).join('，')}であった。<br>（注3）当月生産量は，すべて販売された。`),
    a,u:'円',w,
    ex:`結合原価＝${Y(TOT)}－追加加工費実際額(${P.map(o=>Y(o.q*o.a)).join('＋')})＝${Y(J)}<br>`+
      `結合原価は分離点における見積正常市価（正常市価－正常追加加工費）の比で按分：${P.map((o,j)=>`${o.nm} ${Y(nrv[j])}`).join('，')}<br>`+
      `製品${x.nm}：結合原価配賦額${Y(rd(J*nrv[i]/sum(nrv)))}÷${Y(x.q)}kg＋追加加工費実際額＠${x.a}＝<b>${Y(a)}円</b>`};
}});

// 問題5-16（H23Ⅰ, p.⑤-41）連産品（正常市価基準と生産量基準の差額）
C({id:'q-mg-joint-diff',f:MC,ch:CH5,t:'連産品（正常市価基準と生産量基準の製造原価の差額）',r:'A',g(){
  const P=['X','Y','Z'].map(nm=>{ const q=R.int(10,30)*1000, p=R.int(10,30)*100, Ad=q*R.int(1,5)*100; return {nm,q,p,Ad}; });
  const J=R.int(80,200)*1000000; const nrv=P.map(o=>o.q*o.p-o.Ad), gr=P.map(o=>o.q*o.p), qs=sum(P.map(o=>o.q));
  const cN=j=>(J*nrv[j]/sum(nrv)+P[j].Ad)/P[j].q, cQ=j=>(J*P[j].q/qs+P[j].Ad)/P[j].q, cG=j=>(J*gr[j]/sum(gr)+P[j].Ad)/P[j].q;
  const i=R.int(0,2); const a=rd(Math.abs(cN(i)-cQ(i))); if(a===0) throw 0;
  const w=[Math.abs(cG(i)-cQ(i)),Math.abs(cG(i)-cN(i)),Math.abs(cN((i+1)%3)-cQ((i+1)%3)),Math.abs(cN((i+2)%3)-cQ((i+2)%3)),Math.abs(cN(i)-cQ(i)+P[i].Ad/P[i].q)].map(x=>rd(x));
  return {q:P_(`当工場は連産品X，Y，Zを生産し，これらを加工のうえ製品として販売している。次の〔資料〕に基づき，当月の連産品${P[i].nm}の1kg当たりの製品製造原価を正常市価基準と生産量基準によって計算し，その差額を求めなさい。${RND}`)+P_('1．当月の製品データ')+
    tbl(P.map(o=>[o.nm,`${Y(o.q)}kg`,`${Y(o.p)}円`,o.Ad]),['製品','生産数量','1kg当たり正常市価','分離後の個別加工費（円）'])+
    P_(`2．計算条件<br>(1) 当該製品に係る販売費及び一般管理費は考慮しないものとする。<br>(2) 当工場の当月における正常個別加工費を含まない段階での実際製造原価（結合原価）の合計額は${Y(J)}円である。<br>(3) 製品X，Y，Zの月初並びに月末在庫はないものとする。`),
    a,u:'円',w,
    ex:`正常市価基準（分離点の見積正常市価＝正常市価×生産量－個別加工費）：${P.map((o,j)=>`${o.nm} ${Y(nrv[j])}`).join('，')}<br>`+
      `${P[i].nm}の単位原価：正常市価基準＝(${Y(J)}×${Y(nrv[i])}/${Y(sum(nrv))}＋${Y(P[i].Ad)})÷${Y(P[i].q)}＝${yen(cN(i),2)}，生産量基準＝(${Y(J)}×${Y(P[i].q)}/${Y(qs)}＋${Y(P[i].Ad)})÷${Y(P[i].q)}＝${yen(cQ(i),2)}<br>差額＝<b>${Y(a)}円</b>`};
}});

// 問題6-1（R4Ⅱ, p.⑥-3）/6-2/6-3 標準原価差異の分析
C({id:'q-mg-std-var',f:MC,ch:CH6,t:'標準原価差異の分析（完成品換算量・固定予算額からの基準操業度）',r:'A',g(){
  const p=R.int(50,90)*10, qd=R.pick([2,3,4]), r=R.int(10,15)*100, h=R.pick([2,3,4]), f=R.int(3,7)*100, v=R.int(2,6)*100, o=v+f;
  const q0=R.int(3,6)*100, p0=R.pick([0.4,0.6,0.8]), I=R.int(15,25)*100, W=R.int(2,5)*100, pw=R.pick([0.4,0.5,0.6]); const Q=q0+I-W, EQ=Q-q0*p0+W*pw;
  const Nm=ce(h*EQ/100)*100+R.int(0,5)*100, Nan=12*Nm, F=f*Nan;
  const Ka=qd*I+R.int(-10,20)*10, pa=p+R.pick([-15,-10,-5,5,10,15]), DMa=Ka*pa;
  const Ha=h*EQ+R.int(-10,30)*10, ra=r+R.pick([-30,-20,-10,10,20,30]), DLa=Ha*ra;
  const OHa=v*Ha+F/12+R.int(-30,30)*1000;
  const dmP=(p-pa)*Ka, dmQ=p*(qd*I-Ka), dlR=(r-ra)*Ha, dlT=r*(h*EQ-Ha), bud=v*Ha+F/12-OHa, eff=o*(h*EQ-Ha), ope=f*(Ha-Nm);
  const L=R.pick([
    ['直接材料費の価格差異',dmP,[(p-pa)*qd*I,-dmP,(p-pa)*qd*Q,dmP+dmQ]],
    ['直接材料費の数量差異',dmQ,[p*(qd*Q-Ka),pa*(qd*I-Ka),-dmQ,p*(qd*EQ-Ka)]],
    ['直接労務費の賃率差異',dlR,[(r-ra)*h*EQ,-dlR,(r-ra)*h*Q,dlR+dlT]],
    ['直接労務費の作業時間差異',dlT,[r*(h*Q-Ha),ra*(h*EQ-Ha),-dlT,r*(h*I-Ha)]],
    ['製造間接費の予算差異',bud,[o*Ha-OHa,v*h*EQ+F/12-OHa,-bud,v*Nm+F/12-OHa]],
    ['製造間接費の能率差異（変動費および固定費から構成される）',eff,[v*(h*EQ-Ha),o*(h*Q-Ha),-eff,f*(h*EQ-Ha)]],
    ['製造間接費の操業度差異',ope,[f*(h*EQ-Nm),-ope,o*(Ha-Nm),v*(Ha-Nm)]]]);

  return {q:P_(`当社は製品Aの製造を行っており，標準原価計算制度を採用している。次の〔資料〕に基づき，当月の${L[0]}を計算しなさい（有利差異はプラス，不利差異は△）。`)+
    tbl([['直接材料費',`＠${Y(p)}円×${qd}kg`,p*qd],['直接労務費',`＠${Y(r)}円×${h}時間`,r*h],['製造間接費',`＠${Y(o)}円×${h}時間`,o*h],['合計','',p*qd+(r+o)*h]],['1．製品A1個当たりの標準原価カード','','金額（円）'])+
    P_(`なお，年間の製造間接費予算のうち固定費予算額は${Y(F)}円であり，年間の基準操業度は${Y(Nan)}時間（直接作業時間）である。製造間接費の予算差異は，変動費部分のみから発生しているものとする。`)+
    tbl([['月初仕掛品',`${Y(q0)}個（${pc(p0)}）`],['当月投入',`${Y(I)}個`],['月末仕掛品',`${Y(W)}個（${pc(pw)}）`],['完成品',`${Y(Q)}個`]],['2．当月の生産データ',''])+

    a:L[1],u:'円',neg:true,w:L[2],
    ex:`当月投入の完成品換算量：材料${Y(I)}個，加工費${Y(Q)}－${Y(q0*p0)}＋${Y(W*pw)}＝${Y(EQ)}個<br>`+
      `標準消費量＝${qd}kg×${Y(I)}＝${Y(qd*I)}kg，標準直接作業時間＝${h}h×${Y(EQ)}＝${Y(h*EQ)}時間<br>`+
      `実際単価＝＠${pa}，実際賃率＝＠${ra}，固定費率＝${Y(F)}÷${Y(Nan)}＝＠${f}（変動費率＠${v}），月間基準操業度＝${Y(Nm)}時間<br>`+
      `価格差異${yen(dmP)}，数量差異${yen(dmQ)}，賃率差異${yen(dlR)}，作業時間差異${yen(dlT)}<br>予算差異＝(＠${v}×${Y(Ha)}＋${Y(F/12)})－${Y(OHa)}＝${yen(bud)}，能率差異＝＠${o}×(${Y(h*EQ)}－${Y(Ha)})＝${yen(eff)}，操業度差異＝＠${f}×(${Y(Ha)}－${Y(Nm)})＝${yen(ope)}<br>よって<b>${yen(L[1])}円</b>（${fav(L[1])}）`};

// 問題6-4（H28Ⅰ, p.⑥-16）仕損を含む標準原価（完成品標準原価と異常仕損費）
C({id:'q-mg-std-spoil',f:MC,ch:CH6,t:'正常仕損費を含む標準原価（完成品原価と異常仕損費）',r:'B',g(){
  const pd=R.int(15,25)*100, qd=R.pick([2,3]), c=R.int(10,20)*100, hh=R.pick([3,4,5]); const DMs=pd*qd, CCs=c*hh;

  const passed=Q-(p0>=x?q0:0)+(pw>=x?W:0), allowed=passed*rr/100; const Sp=allowed+R.int(1,6)*5; const I=Q+Sp+W-q0;
  const sp=DMs+CCs*x, NS=rr/100*sp, U=DMs+CCs+NS;
  const comp=Q*U, abn=(Sp-allowed)*sp;

    :[(Sp-rr/100*(Q+(pw>=x?W:0)))*sp,(Sp-rr/100*(Q-(p0>=x?q0:0)))*sp,abn*(1+rr/100),(Sp-allowed)*(DMs+CCs),Sp*sp,(Sp-rr/100*(Q+W))*sp].map(z=>rd(z));
  return {q:P_(`当社は製品Xを量産しており，全部標準原価計算を行っている。次の〔資料〕に基づいて，当月の${ask==='comp'?'完成品標準原価':'異常仕損費'}を計算しなさい。${RND}`)+
    tbl([['直接材料費',`＠${Y(pd)}円×${qd}kg`,DMs],['加工費',`＠${Y(c)}円×${hh}時間`,CCs],['正常仕損費','','？'],['製品1個当たりの標準原価','','？']],['1．製品Xの原価標準','','金額（円）'])+

    P_('（注1）直接材料は工程の始点で投入される。（注2）（　）内の数値は加工費進捗度を示している。'),
    a,u:'円',w,
    ex:`仕損品1個の原価＝${Y(DMs)}＋${Y(CCs)}×${pc(x)}＝${Y(sp)}<br>正常仕損費（製品1個当たり）＝${Y(sp)}×${rr}%＝${yen(NS,1)} → 標準原価＝${yen(U,1)}<br>`+
      `完成品標準原価＝${Y(Q)}×${yen(U,1)}＝${Y(rd(comp))}<br>`+
      `当月に仕損発生点（${pc(x)}）を通過した良品＝完成品${Y(Q)}${p0>=x?`－月初仕掛品${Y(q0)}（前月に通過済み）`:''}${pw>=x?`＋月末仕掛品${Y(W)}`:''}＝${Y(passed)}個<br>`+
      `正常仕損数量＝${Y(passed)}×${rr}%＝${Y(allowed)}個 → 異常仕損＝${Y(Sp)}－${Y(allowed)}＝${Y(Sp-allowed)}個<br>異常仕損費＝${Y(Sp-allowed)}×${Y(sp)}＝${Y(rd(abn))}<br>よって<b>${Y(a)}円</b>`};

// 問題6-15（p.⑥-46）原価差異の会計処理（総括配賦と原価要素別配賦）
C({id:'q-mg-std-close',f:MC,ch:CH6,t:'標準原価差異の追加配賦（総括配賦・原価要素別配賦）',r:'B',g(){
  const pd=R.int(6,10)*100, qd=R.pick([4,6,8]), r=R.int(8,10)*100, hh=R.pick([3,4,5]), o=R.int(6,9)*100; const DMu=pd*qd, CCu=(r+o)*hh, U=DMu+CCu;
  const I=R.int(8,12)*1000, W=R.int(3,8)*100, pw=R.pick([0.4,0.5,0.6]); const Q=I-W, E=R.int(3,6)*100, S=Q-E, EQ=Q+W*pw;
  const d1=R.int(-10,10)*1000+R.int(-9,9)*250, d2=R.int(10,50)*1000, d3=R.int(-40,40)*1000; const V=d1+d2+d3; if(V<=0||d1===0) throw 0;
  const stdS=S*U, stdE=E*U, stdW=W*DMu+W*pw*CCu;
  const c1=V*stdS/(stdS+stdE+stdW), c2=d1*S/(S+E+W)+(d2+d3)*S/EQ;
  const ask=R.pick(['c1','c2']);
  const a= ask==='c1'?rd(c1):rd(c2);
  const w=[ask==='c1'?c2:c1,V*S/(S+E+W),V*S/(S+E),d1*S/(S+E)+(d2+d3)*S/(S+E),d1*S/EQ+(d2+d3)*S/EQ,V].map(z=>rd(z));
  return {q:P_(`全部標準原価計算を採用している当社では，会計年度末において原価差異が比較的多額に生じたことが判明し，原価差異の追加配賦方法を検討している。次の〔資料〕に基づき，${ask==='c1'?'ケース①（原価差異を総括して追加配賦する方法）':'ケース②（原価差異を原価要素別に追加配賦する方法）'}によって売上原価に追加配賦される原価差異の金額を計算しなさい。${RND}`)+

    P_(`2．当期の生産データ：当期投入数量${Y(I)}個，期末仕掛品数量${Y(W)}個（加工進捗度${pc(pw)}），期末製品数量${Y(E)}個（材料は工程の始点で投入）<br>`+

      `5．ケース①：原価差異を総括して標準原価の比で追加配賦する方法，ケース②：原価差異を原価要素別に（直接材料費差異は材料の数量，加工費差異は加工費の完成品換算量を基準に）追加配賦する方法`),

// 問題6-17（H20, p.⑥-51）/6-16 受入価格差異の処理
C({id:'q-mg-std-ukeire',f:MC,ch:CH6,t:'受入価格差異の処理と売上原価',r:'A',g(){
  const ps=R.int(8,15)*10, qd=R.int(5,12), c=R.int(4,8)*10, hh=R.pick([5,8,10]); const DMu=ps*qd, CCu=c*hh, U=DMu+CCu;
  const I=R.int(10,15)*1000, W=R.int(1,3)*1000, pw=R.pick([0.4,0.5,0.6]); const Q=I-W, E=R.int(1,3)*1000, S=Q-E; if(S<=0) throw 0;
  const Ka=qd*I+R.int(1,8)*1000, em=R.int(5,15)*1000, Kp=Ka+em; const dp=R.int(1,9), pa=ps-dp;
  const CCa=CCu*(Q+W*pw)+R.int(-10,30)*10000;
  const pvC=dp*Ka, qv=ps*(Ka-qd*I), cv=CCa-CCu*(Q+W*pw); const D=-pvC+qv+cv; if(D===0) throw 0;
  const stdS=S*U, stdE=E*U, stdW=W*DMu+W*pw*CCu, T=stdS+stdE+stdW;
  const al=x=>stdS+x*stdS/T;
  const a=rd(al(D));
  const w=[al(D-dp*em),stdS+D,al(D-qv),al(qv+cv),stdS+D*S/(S+E+W),stdS].map(z=>rd(z));
  const sp=R.int(18,25)*10;
  return {q:P_(`当社は製品Aの製造を行っており，全部標準原価計算を採用している。材料の購入時に標準価格で受け入れ，受入価格差異を把握している。当期の原価差異で異常な状態に基づくと認められるものはないが，比較的多額に生じたため，期末材料にかかる受入価格差異を除き，原価差異を一括して売上原価と期末棚卸資産に（標準原価の比で）配賦するものとする。次の〔資料〕に基づき，当期の売上原価の金額を計算しなさい。${RND}`)+
    tbl([['直接材料費',`＠${ps}円×${qd}kg`,DMu],['加工費',`＠${c}円×${hh}時間`,CCu],['合計','',U]],['1．製品A1個当たりの標準原価カード','','金額（円）'])+
    tbl([['期首仕掛品','0個'],['当期投入',`${Y(I)}個`],['期末仕掛品',`${Y(W)}個（${pc(pw)}）`],['完成品',`${Y(Q)}個`]],['2．当期の生産データ',''])+
    P_(`（注）材料は工程の始点で投入される。（　）内は加工進捗度を示している。<br>3．当期の原価データ：材料実際購入高${Y(Kp*pa)}円（実際購入量${Y(Kp)}kg），材料実際消費量${Y(Ka)}kg，実際加工費${Y(CCa)}円<br>`+
      `4．その他：当期の製品Aの売上数量は${Y(S)}個で売上金額は${Y(S*sp*10)}円であった。なお，材料，製品とも期首残高はなかった。`),
    a,u:'円',w,
    ex:`受入価格差異＝(＠${ps}－実際＠${pa})×購入量${Y(Kp)}kg＝${Y(dp*Kp)}（有利）<br>うち期末材料${Y(em)}kg分${Y(dp*em)}は材料に残し，消費分${Y(pvC)}（有利）を配賦対象とする。<br>`+
      `数量差異＝＠${ps}×(実際${Y(Ka)}－標準${Y(qd*I)})kg＝${Y(qv)}（不利），加工費差異＝${Y(CCa)}－${Y(CCu*(Q+W*pw))}＝${yen(cv)}（${cv>=0?'不利':'有利'}）<br>`+
      `配賦対象差異（不利をプラス）＝△${Y(pvC)}＋${Y(qv)}＋${yen(cv)}＝${yen(D)}<br>`+
      `標準原価：売上原価${Y(stdS)}，期末製品${Y(stdE)}，期末仕掛品${Y(stdW)}（合計${Y(T)}）<br>売上原価＝${Y(stdS)}＋${yen(D)}×${Y(stdS)}/${Y(T)}＝<b>${Y(a)}円</b>`};
}});

})();

T({id:'law-board',f:LW,ch:'第3章 機関（取締役・取締役会）',t:'取締役と取締役会',r:'A',
T:['取締役会設置会社においては，取締役は3人以上でなければならない。',
'取締役の任期は，原則として選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。',
'公開会社でない株式会社（監査等委員会設置会社・指名委員会等設置会社を除く）は，定款により取締役の任期を選任後10年以内に終了する事業年度に関する定時株主総会の終結の時まで伸長することができる。',
'取締役会は，重要な財産の処分及び譲受け，多額の借財，支配人その他の重要な使用人の選任及び解任などの決定を取締役に委任することができない。',
'決議について特別の利害関係を有する取締役は，取締役会の議決に加わることができない。',
'取締役は，いつでも，株主総会の決議によって解任することができる。'],
F:[['取締役会設置会社の取締役は2人以上いれば足りる。','3人以上必要である。'],
['取締役会の決議要件は，定款により軽減することができる。','定款で加重することはできるが軽減はできない。'],
['取締役は，取締役会の決議について代理人により議決権を行使することができる。','取締役会での代理行使は認められない。'],
['公開会社である取締役会設置会社は，定款で取締役の任期を10年まで伸長することができる。','任期の伸長は公開会社でない会社に限られる。'],
['取締役会は，多額の借財の決定を代表取締役に委任することができる。','多額の借財は取締役会の専決事項である。'],
['正当な理由なく解任された取締役であっても，会社に対して損害賠償を請求することはできない。','解任に正当な理由がない場合には損害賠償を請求できる。']]});

T({id:'law-duty',f:LW,ch:'第3章 機関（取締役の義務）',t:'競業取引・利益相反取引',r:'A',
T:['取締役が自己又は第三者のために株式会社の事業の部類に属する取引をしようとするときは，取締役会設置会社では取締役会において重要な事実を開示し，その承認を受けなければならない。',
'取締役会設置会社において，競業取引や利益相反取引をした取締役は，当該取引後遅滞なく，重要な事実を取締役会に報告しなければならない。',
'利益相反取引によって株式会社に損害が生じたときは，当該取引をした取締役等は，その任務を怠ったものと推定される。',
'自己のために株式会社と直接取引をした取締役の責任は，任務を怠ったことが当該取締役の責めに帰することができない事由によるものであっても免れることができない。',
'取締役は，法令及び定款並びに株主総会の決議を遵守し，株式会社のため忠実にその職務を行わなければならない。'],
F:[['取締役会設置会社において，競業取引の承認は株主総会の普通決議によって行う。','取締役会設置会社では取締役会の承認による。'],
['承認を受けた利益相反取引によって会社に損害が生じた場合には，取締役は一切責任を負わない。','承認を受けていても任務懈怠が推定される。'],
['自己のために会社と直接取引をした取締役も，帰責事由がないことを証明すれば責任を免れる。','無過失責任であり，帰責事由がないことをもって責任を免れない。'],
['競業取引について事前に承認を受けた場合には，事後に取締役会へ報告する必要はない。','取締役会設置会社では事後報告も必要である。'],
['取締役会の承認を受けない利益相反取引であっても，会社との関係では当然に有効である。','承認を欠く取引は無効である（善意の第三者には無効を主張できない相対的無効）。']]});

T({id:'law-kansayaku',f:LW,ch:'第3章 機関（監査役・監査役会）',t:'監査役と監査役会',r:'A',
T:['監査役は，取締役（会計参与設置会社では取締役及び会計参与）の職務の執行を監査し，監査報告を作成しなければならない。',
'監査役の任期は選任後4年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までであり，定款によっても短縮することはできない。',
'監査役会設置会社においては，監査役は3人以上で，そのうち半数以上は社外監査役でなければならない。',
'監査役会は，監査役の中から常勤の監査役を選定しなければならない。',
'監査役の解任は，株主総会の特別決議によらなければならない。',
'公開会社である大会社（監査等委員会設置会社及び指名委員会等設置会社を除く）は，監査役会及び会計監査人を置かなければならない。'],
F:[['監査役会設置会社において，監査役の過半数は社外監査役でなければならない。','半数以上である。'],
['監査役の任期は，定款によって2年に短縮することができる。','監査役の任期は短縮できない。'],
['監査役の解任は，株主総会の普通決議によって行うことができる。','特別決議が必要である。'],
['監査役会の決議があれば，個々の監査役の権限行使を制限することができる。','監査役は独任制の機関であり，監査役会は各監査役の権限の行使を妨げることはできない。'],
['監査役は，子会社の取締役を兼任することができる。','子会社の取締役・使用人等との兼任は禁止されている。'],
['監査役会設置会社や会計監査人設置会社であっても，定款で監査役の監査の範囲を会計に関するものに限定することができる。','監査範囲の限定ができるのは，公開会社でない会社のうち監査役会設置会社・会計監査人設置会社以外の会社である。']]});

T({id:'law-auditor',f:LW,ch:'第3章 機関（会計監査人・会計参与）',t:'会計監査人と会計参与',r:'A',
T:['会計監査人は，公認会計士又は監査法人でなければならない。',
'会計監査人の任期は選任後1年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までであり，当該総会で別段の決議がなければ再任されたものとみなされる。',
'監査役設置会社では，株主総会に提出する会計監査人の選任・解任・不再任に関する議案の内容は，監査役（監査役会設置会社では監査役会）が決定する。',
'取締役は，会計監査人の報酬等を定める場合には，監査役（監査役会）の同意を得なければならない。',
'会計参与は，公認会計士若しくは監査法人又は税理士若しくは税理士法人でなければならない。'],
F:[['会計監査人の任期は2年であり，定款で1年に短縮することができる。','任期は1年である。'],
['会計監査人の選任議案の内容は取締役会が決定し，監査役の同意を得れば足りる。','議案の内容は監査役（監査役会）が決定する。'],
['会計参与には，弁護士もなることができる。','公認会計士・監査法人・税理士・税理士法人に限られる。'],
['会計監査人は役員ではないため，株主代表訴訟の対象とならない。','会計監査人は「役員等」に含まれ，代表訴訟の対象となる。'],
['大会社であっても，公開会社でなければ会計監査人を置く必要はない。','大会社は公開会社であるか否かを問わず会計監査人を置かなければならない。']]});

T({id:'law-committee',f:LW,ch:'第3章 機関（委員会型）',t:'指名委員会等設置会社・監査等委員会設置会社',r:'A',
T:['指名委員会等設置会社の各委員会は委員3人以上で組織し，各委員会の委員の過半数は社外取締役でなければならない。',
'指名委員会等設置会社の業務執行は執行役が行い，取締役は，法令に別段の定めがある場合を除き，業務を執行することができない。',
'監査等委員会設置会社の監査等委員である取締役は3人以上で，その過半数は社外取締役でなければならない。',
'監査等委員である取締役の任期は2年であり，定款等によって短縮することはできない。',
'監査等委員会設置会社及び指名委員会等設置会社は，監査役を置くことができず，会計監査人を置かなければならない。'],
F:[['指名委員会等設置会社の各委員会は，委員の半数以上が社外取締役であれば足りる。','過半数が社外取締役でなければならない。'],
['指名委員会等設置会社の取締役の任期は2年である。','1年である。'],
['監査等委員である取締役の任期は1年である。','2年である（監査等委員以外の取締役は1年）。'],
['監査等委員会設置会社は，監査役を置くこともできる。','監査役を置くことはできない。'],
['指名委員会等設置会社において，監査委員は執行役を兼ねることができる。','監査委員は執行役・業務執行取締役等を兼ねることができない。']]});

T({id:'law-liability',f:LW,ch:'第3章 機関（役員等の責任）',t:'役員等の責任と株主代表訴訟',r:'A',
T:['役員等は，その任務を怠ったときは，株式会社に対し，これによって生じた損害を賠償する責任を負う。',
'役員等の株式会社に対する任務懈怠責任の全部の免除には，総株主の同意が必要である。',
'役員等がその職務を行うについて悪意又は重大な過失があったときは，これによって第三者に生じた損害を賠償する責任を負う。',
'株主が責任追及等の訴えの提起を請求した日から60日以内に株式会社が訴えを提起しないときは，当該株主は株式会社のために責任追及等の訴えを提起することができる。',
'株式会社は，定款の定めに基づき，非業務執行取締役等との間で責任限定契約を締結することができる。'],
F:[['役員等の株式会社に対する任務懈怠責任は，取締役会の決議によっていつでも全部免除することができる。','全部免除には総株主の同意が必要である。'],
['役員等の第三者に対する責任は，軽過失の場合にも生じる。','悪意又は重大な過失が要件である。'],
['株主代表訴訟を提起するには，あらかじめ裁判所の許可を得なければならない。','裁判所の許可は不要であり，会社への提訴請求が前提となる。'],
['株主が提訴請求した日から30日以内に会社が訴えを提起しない場合，株主は代表訴訟を提起できる。','60日である。'],
['責任限定契約は，代表取締役との間でも締結することができる。','責任限定契約は非業務執行取締役等に限られる。']]});

T({id:'law-setup',f:LW,ch:'第5章 設立',t:'株式会社の設立',r:'A',
T:['株式会社の設立の方法には，発起設立と募集設立がある。',
'発起人は，株式会社の設立に際し，設立時発行株式を1株以上引き受けなければならない。',
'現物出資，財産引受け，発起人の報酬その他の特別の利益，設立費用は変態設立事項であり，定款に記載又は記録しなければ効力を生じない。',
'現物出資財産等について定款に記載された価額の総額が500万円を超えない場合には，検査役の調査は不要である。',
'株式会社は，その本店の所在地において設立の登記をすることによって成立する。',
'募集設立においては，創立総会を開催しなければならない。'],
F:[['発起人は，設立時発行株式を引き受けなくてもよい。','発起人は1株以上引き受けなければならない。'],
['変態設立事項は，定款に記載しなくても，発起人全員の同意があれば効力を生じる。','定款に記載しなければ効力を生じない。'],
['現物出資財産の定款記載価額の総額が1,000万円以下の場合には，検査役の調査は不要である。','基準額は500万円である。'],
['株式会社は，定款の認証を受けた時に成立する。','設立の登記によって成立する。'],
['発起設立においても，創立総会を開催しなければならない。','創立総会は募集設立の場合に開催する。']]});

T({id:'law-issue',f:LW,ch:'第6章 資金調達',t:'募集株式の発行等',r:'A',
T:['公開会社においては，払込金額が特に有利な金額である場合を除き，募集事項は取締役会の決議によって定める。',
'公開会社でない株式会社においては，募集事項の決定は株主総会の特別決議による（取締役・取締役会への委任が可能）。',
'公開会社が取締役会の決議により募集事項を定めた場合，払込期日（又は払込期間の初日）の2週間前までに株主に対し募集事項を通知又は公告しなければならない。',
'株式の発行が法令・定款に違反する場合や著しく不公正な方法による場合において，株主が不利益を受けるおそれがあるときは，株主は発行の差止めを請求することができる。',
'公開会社における新株発行無効の訴えは，株式の発行の効力が生じた日から6か月以内に提起しなければならない。'],
F:[['公開会社において株主以外の者に特に有利な払込金額で募集株式を発行する場合でも，取締役会の決議で足りる。','有利発行には株主総会の特別決議が必要である。'],
['公開会社でない会社では，募集事項の決定は常に取締役会の決議のみで行う。','原則として株主総会の特別決議による。'],
['公開会社における新株発行無効の訴えは，効力発生日から1年以内であれば提起できる。','公開会社は6か月以内（公開会社でない会社は1年以内）である。'],
['募集株式の発行の差止めを請求できるのは会社債権者に限られる。','差止請求権者は株主である。'],
['募集株式の引受人は，出資の履行をしなかった場合でも株主となる権利を失わない。','出資の履行をしないときは株主となる権利を失う（失権）。']]});

T({id:'law-bond',f:LW,ch:'第6章 資金調達',t:'新株予約権と社債',r:'B',
T:['新株予約権とは，株式会社に対して行使することにより当該株式会社の株式の交付を受けることができる権利をいう。',
'会社は，社債を発行する場合には，原則として社債管理者を定め，社債権者のために社債の管理を委託しなければならない。',
'各社債の金額が1億円以上である場合には，社債管理者を置かなくてもよい。',
'社債権者集会の決議は，原則として裁判所の認可を受けなければその効力を生じない。',
'持分会社も社債を発行することができる。'],
F:[['公開会社が社債を発行するには，株主総会の特別決議が必要である。','取締役会の決議による（取締役に委任できない重要事項）。'],
['各社債の金額が1,000万円以上であれば，社債管理者を置くことを要しない。','1億円以上である。'],
['社債権者集会の決議は，裁判所の認可を要せず直ちに効力を生じる。','原則として裁判所の認可が必要である。'],
['社債は株式会社のみが発行することができ，持分会社は発行できない。','持分会社も発行できる。']]});

T({id:'law-calc',f:LW,ch:'第7章 株式会社の計算等',t:'計算書類と剰余金の配当',r:'A',
T:['株式会社は，各事業年度に係る計算書類（貸借対照表，損益計算書，株主資本等変動計算書，個別注記表）及び事業報告並びにこれらの附属明細書を作成しなければならない。',
'剰余金の配当をする場合には，準備金の合計額が資本金の4分の1に達するまで，配当により減少する剰余金の額の10分の1を資本準備金又は利益準備金として計上しなければならない。',
'剰余金の配当は，原則として株主総会の普通決議によって行う。',
'取締役会設置会社は，一事業年度の途中において1回に限り，取締役会の決議により金銭による中間配当をすることができる旨を定款で定めることができる。',
'純資産額が300万円を下回る場合には，剰余金の配当をすることができない。'],
F:[['剰余金の配当をする場合には，準備金の合計額が資本金の2分の1に達するまで準備金を積み立てる。','資本金の4分の1である。'],
['中間配当は，金銭以外の財産による配当として行うこともできる。','中間配当は金銭に限られる。'],
['純資産額が500万円を下回る場合には，剰余金の配当をすることができない。','300万円である。'],
['資本金の額の減少は，常に取締役会の決議のみで行うことができる。','原則として株主総会の特別決議が必要である。'],
['資本金の額を減少する場合でも，債権者異議手続を行う必要はない。','債権者異議手続が必要である。']]});

T({id:'law-reorg',f:LW,ch:'第10章 組織再編行為等',t:'組織再編（合併・分割・株式交換等）',r:'A',
T:['吸収合併の存続会社は，効力発生日に，消滅会社の権利義務を承継する。',
'組織再編に反対する株主は，原則として，会社に対し自己の有する株式を公正な価格で買い取ることを請求することができる。',
'存続会社等が交付する対価の額が存続会社等の純資産額の5分の1を超えない場合には，原則として存続会社等の株主総会の決議を省略することができる。',
'特別支配会社（総株主の議決権の10分の9以上を有する会社）との間で吸収合併等を行う場合，被支配会社の株主総会の決議を原則として省略することができる。',
'合併無効の訴えは，合併の効力が生じた日から6か月以内に提起しなければならない。',
'株式交付は，株式会社が他の株式会社を子会社とするために，当該他の株式会社の株式を譲り受け，対価として自社の株式を交付する制度である。'],
F:[['簡易組織再編の要件は，交付する対価の額が存続会社の純資産額の3分の1を超えないことである。','5分の1である。'],
['略式組織再編は，特別支配会社が被支配会社の総株主の議決権の3分の2以上を有する場合に認められる。','10分の9以上である。'],
['合併無効の訴えは，効力発生日から1年以内であれば提起することができる。','6か月以内である。'],
['吸収合併の消滅会社の債権者は，債権者異議手続の対象とならない。','消滅会社の債権者も対象となる。'],

F:[['合理的な保証とは，財務諸表に虚偽の表示が全く存在しないことを絶対的に保証することをいう。','絶対的ではないが高い水準の保証である。'],

['監査人の意見表明は，財務諸表の適正性に加えて，経営の効率性や将来の業績についての保証も含む。','経営の効率性や将来の業績は保証の対象ではない。'],
['監査人は，財務諸表の重要な虚偽表示の有無にかかわらず，すべての不正を発見する責任を負う。','重要な虚偽表示がないことについて合理的な保証を得る責任を負う。'],

'実証手続は，詳細テストと分析的実証手続から構成される。'],
F:[['監査証拠の十分性とは，監査証拠の質的な尺度をいう。','十分性は量的な尺度であり，質的な尺度は適切性である。'],
['質問のみによって，内部統制の運用状況の有効性について十分な監査証拠を入手できる。','質問だけでは十分でなく，他の手続と組み合わせる必要がある。'],
['口頭による証拠は，文書化された証拠よりも一般に証明力が強い。','文書化された証拠の方が一般に証明力が強い。'],
['監査証拠の量を増やせば，監査証拠の質の低さを常に補うことができる。','量を増やしても質の低さを補えないことがある。'],
['再実施とは，記録や文書の計算の正確性を確かめることをいう。','それは再計算の説明である。再実施は企業が実施する手続や内部統制を監査人が独自に実施することをいう。']]});

T({id:'aud-confirm',f:AU,ch:'第3章 監査実施論',t:'確認・分析的手続・実地棚卸の立会',r:'A',
T:['確認とは，監査人が確認の相手先である第三者から文書による回答を直接入手する監査手続をいう。',
'積極的確認とは，確認回答者に確認依頼の情報に同意するか不同意であるかの回答，又は情報の提供を求める方法をいう。',
'経営者が確認依頼の送付に同意しない場合には，監査人は，その理由の妥当性を検討し，代替的な監査手続を実施しなければならない。',
'分析的手続は，リスク評価手続として実施するほか，実証手続として，また監査の最終段階で全般的な結論を形成するためにも実施する。',
'棚卸資産が財務諸表において重要である場合には，監査人は，実務的に不可能でない限り，実地棚卸の立会を実施しなければならない。'],
F:[['消極的確認は，同意しない場合にのみ回答を求める方法であり，通常，積極的確認よりも証明力が強い。','消極的確認は積極的確認よりも証明力が弱い。'],
['確認の回答は，被監査会社を経由して入手してもよい。','監査人が直接入手しなければならない。'],
['分析的手続は，監査の最終段階においてのみ実施が求められる。','リスク評価手続としても実施が求められる。'],
['経営者が確認依頼の送付に同意しない場合には，監査人は直ちに意見不表明としなければならない。','理由を検討し，代替的な手続を実施する。']]});

T({id:'aud-ic',f:AU,ch:'第3章 監査実施論',t:'内部統制の理解と運用評価',r:'A',
T:['監査人は，重要な虚偽表示リスクを識別し評価するため，企業及び企業環境（内部統制を含む）を理解しなければならない。',
'運用評価手続は，内部統制が有効に運用されていると想定する場合や，実証手続のみでは十分かつ適切な監査証拠を入手できない場合に実施する。',
'内部統制には，経営者による内部統制の無効化のリスクなどの固有の限界がある。',
'監査人は，内部統制のデザインを評価し，それが業務に適用されているかどうかを判断する。',
'監査人は，評価した重要な虚偽表示リスクの程度にかかわらず，重要な取引種類・勘定残高・注記事項に対して実証手続を立案し実施しなければならない。'],
F:[['監査人は，すべての内部統制について運用評価手続を実施しなければならない。','依拠する予定の内部統制などについて実施する。'],
['内部統制が有効に運用されていれば，実証手続を一切実施する必要はない。','重要な取引種類等には実証手続が必要である。'],
['前年度に運用評価手続を実施した内部統制は，変更がなくても毎年度必ず運用評価手続を実施しなければならない。','変更がない場合には，一定の条件のもと過年度の証拠を利用できる（少なくとも3年に1度は実施）。'],
['経営者の誠実性が高い企業では，経営者による内部統制の無効化のリスクは存在しない。','無効化のリスクはすべての企業に存在する。']]});

T({id:'aud-rep-letter',f:AU,ch:'第3章 監査実施論',t:'経営者確認書・監査調書・会計上の見積り',r:'A',
T:['経営者確認書は必要な監査証拠であるが，それ自体では記載事項について十分かつ適切な監査証拠とはならない。',
'経営者確認書の日付は，監査報告書日より後であってはならない。',
'監査人は，経験豊富な監査人が以前に当該監査に関与していなくても，実施した監査手続や入手した監査証拠，結論を理解できるように監査調書を作成しなければならない。',
'監査ファイルの最終的な整理が完了した後は，保存期間が終了するまで，監査調書を削除又は廃棄してはならない。',
'監査人は，会計上の見積りに関する重要な虚偽表示リスクを評価する際，見積りの不確実性，複雑性，主観性などの固有リスク要因を考慮する。'],
F:[['経営者確認書を入手すれば，確認事項について他の監査証拠を入手する必要はない。','経営者確認書だけでは十分かつ適切な監査証拠とはならない。'],
['経営者確認書の日付は，監査報告書日より後の日付とする。','監査報告書日より後であってはならない。'],
['監査調書には，最終的な結論のみを記載すれば足り，判断の過程を記録する必要はない。','重要な判断とその過程も記録する。'],
['経営者が要請された確認事項の確認を拒否した場合でも，監査意見に影響を及ぼすことはない。','経営者の誠実性を再評価し，意見不表明等を検討する。'],
['監査ファイルの最終的な整理が完了した後であっても，不要となった監査調書は自由に廃棄できる。','保存期間が終了するまで廃棄してはならない。']]});

T({id:'aud-opinion',f:AU,ch:'第4章 監査報告論',t:'監査意見の類型',r:'A',
T:['除外事項付意見には，限定付適正意見，不適正意見及び意見不表明がある。',
'会計方針の選択・適用等に不適切なものがあり，その影響が重要ではあるが財務諸表全体として虚偽の表示に当たるとするほどではない場合には，限定付適正意見を表明する。',
'重要な監査手続を実施できなかったことにより無限定適正意見を表明できないが，その影響が財務諸表全体に対する意見表明ができないほどではない場合には，限定付適正意見を表明する。',
'重要な監査手続を実施できず，財務諸表全体に対する意見表明のための基礎を得ることができなかったときは，意見を表明してはならない。',
'監査報告書では，冒頭に「監査意見」区分を記載し，続けて「監査意見の根拠」区分を記載する。'],
F:[['監査範囲の制約の影響が財務諸表全体に及ぶほど広範な場合には，不適正意見を表明する。','その場合は意見不表明とする。'],
['会計方針の選択・適用の不適切による影響が重要かつ広範な場合には，意見不表明とする。','その場合は不適正意見を表明する。'],
['限定付適正意見を表明する場合，監査意見の根拠区分に除外事項の内容を記載する必要はない。','除外した事項とその影響等を記載する。'],
['監査報告書では，冒頭に「監査意見の根拠」区分を記載し，その後に「監査意見」区分を記載する。','「監査意見」区分が冒頭である。'],
['強調事項区分に記載した事項は，除外事項として監査意見に影響を及ぼす。','強調事項は監査意見に影響しない。']]});

T({id:'aud-kam',f:AU,ch:'第4章 監査報告論',t:'監査上の主要な検討事項（KAM）',r:'A',
T:['監査上の主要な検討事項とは，当年度の財務諸表の監査において，監査人が職業的専門家として特に重要であると判断した事項をいう。',
'監査上の主要な検討事項は，監査役等とコミュニケーションを行った事項の中から決定する。',
'監査上の主要な検討事項の記載は，監査意見とは明確に区別され，監査意見に代わるものではない。',
'監査上の主要な検討事項の記載に当たっては，その内容，特に重要であると判断した理由及び監査上の対応を記載する。',
'意見不表明の場合には，監査上の主要な検討事項は記載しない。'],
F:[['除外事項付意見の根拠となる事項は，監査上の主要な検討事項として記載することで除外事項の記載に代えることができる。','除外事項は監査意見の根拠区分に記載し，KAMで代替することはできない。'],
['監査上の主要な検討事項は，監査役等とのコミュニケーションの有無にかかわらず決定される。','監査役等とコミュニケーションを行った事項から選定する。'],
['監査上の主要な検討事項の記載は，会社法に基づく監査においても義務付けられている。','記載が求められるのは主として金融商品取引法に基づく監査である。'],
['意見不表明の場合であっても，監査上の主要な検討事項を記載しなければならない。','意見不表明の場合は記載しない。'],
['監査人は，監査上の主要な検討事項として記載した事項について，個別に意見を表明する。','KAMについて個別の意見は表明しない。']]});

T({id:'aud-other',f:AU,ch:'第4章 監査報告論',t:'その他の記載内容・強調事項・その他の事項',r:'A',
T:['その他の記載内容とは，監査した財務諸表を含む開示書類のうち，当該財務諸表と監査報告書とを除いた部分の記載内容をいう。',
'監査人は，その他の記載内容を通読し，財務諸表や監査の過程で得た知識との間に重要な相違があるかどうかを検討する。',
'強調事項とは，財務諸表に適切に表示又は開示されている事項のうち，利用者の注意を喚起する必要があると監査人が判断した事項をいう。',
'その他の事項とは，財務諸表に表示又は開示されていない事項について，監査や監査報告書に関する利用者の理解に関連するため説明する必要があると監査人が判断した事項をいう。'],
F:[['監査人は，その他の記載内容について監査を実施し，その適正性について意見を表明する。','その他の記載内容に対して意見は表明しない。'],
['強調事項は，財務諸表に表示又は開示されていない事項について記載する。','それはその他の事項である。'],
['その他の記載内容に重要な誤りがあると結論付けた場合でも，監査報告書に記載することはない。','未修正の重要な誤りがある場合にはその内容を記載する。'],
['強調事項区分は，限定付適正意見の根拠を示すために用いられる。','強調事項は意見に影響しない。']]});

T({id:'aud-gc',f:AU,ch:'第5章 継続企業の前提',t:'継続企業の前提に関する監査人の検討',r:'A',
T:['監査人は，継続企業を前提として経営者が財務諸表を作成することが適切であるかどうかを検討しなければならない。',
'継続企業の前提に関する重要な不確実性が認められる場合でも，財務諸表に適切な注記がなされていれば無限定適正意見を表明し，監査報告書に「継続企業の前提に関する重要な不確実性」区分を設けて記載する。',
'重要な不確実性が認められるにもかかわらず適切な注記がなされていない場合には，限定付適正意見又は不適正意見を表明する。',
'継続企業を前提として財務諸表を作成することが適切でない場合に，継続企業を前提として財務諸表が作成されているときは，不適正意見を表明する。',
'経営者が継続企業の前提に関する評価を行う期間は，少なくとも期末日の翌日から12か月間である。'],
F:[['継続企業の前提に関する重要な不確実性が認められる場合には，適切な注記がなされていても限定付適正意見を表明しなければならない。','適切な注記があれば無限定適正意見である。'],
['継続企業の前提に関する重要な不確実性についての記載は，強調事項区分に記載する。','独立した「継続企業の前提に関する重要な不確実性」区分に記載する。'],
['監査人は，企業が将来にわたって存続することを保証する責任を負う。','企業の存続を保証するものではない。'],
['経営者が行う継続企業の前提に関する評価の期間は，期末日から6か月間で足りる。','少なくとも期末日の翌日から12か月間である。'],
['継続企業の前提に重要な疑義を生じさせる事象又は状況が存在すれば，対応策の内容にかかわらず直ちに注記が必要となる。','対応策を講じてもなお重要な不確実性が認められる場合に注記する。']]});

T({id:'aud-fraud',f:AU,ch:'第6章 その他の諸論点（不正）',t:'不正リスク対応基準',r:'A',
T:['不正リスク対応基準は，主として金融商品取引法に基づいて開示を行っている企業（非上場企業のうち資本金5億円未満又は売上高10億円未満かつ負債総額200億円未満の企業は除く）の財務諸表監査に適用される。',
'監査人は，経営者等の誠実性に関するこれまでの認識にかかわらず，不正リスクに常に留意し，監査の全過程を通じて職業的懐疑心を保持しなければならない。',
'監査人は，不正による重要な虚偽の表示を示唆する状況を識別した場合には，経営者に質問し説明を求めるとともに，追加的な監査手続を実施しなければならない。',
'監査人は，不正による重要な虚偽の表示の疑義があると判断した場合には，想定される不正の態様等に直接対応した監査手続を立案し，監査計画を修正しなければならない。',
'監査人は，不正リスクに対応するため，企業が想定しない要素を監査計画に組み込むことを検討しなければならない。'],
F:[['不正リスク対応基準は，会社法監査を含むすべての監査に一律に適用される。','主として金融商品取引法監査に適用される。'],
['不正リスク対応基準により，監査人の責任は財務諸表に含まれるすべての不正を発見することにまで拡大された。','監査の目的や責任を拡大するものではない。'],
['経営者の誠実性について過去に問題がなかった場合には，監査人は不正リスクを考慮する必要はない。','過去の認識にかかわらず不正リスクに留意しなければならない。'],
['不正による重要な虚偽表示の疑義があると判断した場合であっても，監査計画を修正する必要はない。','監査計画を修正し対応する手続を実施する。']]});

T({id:'aud-qc',f:AU,ch:'第2章 監査主体論（品質管理）',t:'監査に関する品質管理',r:'A',
T:['監査事務所は，品質管理システムを整備及び運用しなければならず，品質管理システムの最高責任者は少なくとも年に1度その評価を行わなければならない。',
'監査事務所は，品質目標を設定し，品質リスクを識別・評価し，それに対処する方針又は手続を整備・運用する（リスク・アプローチに基づく品質管理）。',
'監査責任者は，監査業務の品質に対する全体的な責任を負う。',
'審査は，監査チームが行った重要な判断及び到達した結論について，監査報告書日以前に客観的な評価を行うものである。'],
F:[['審査は，監査報告書を発行した後に実施すればよい。','監査報告書日以前に実施する。'],
['監査業務の品質に対する責任は，すべて審査担当者が負う。','全体的な責任は監査責任者が負う。'],
['審査担当者は，当該監査業務の監査チームの中から選任する。','審査担当者は監査チーム外の者でなければならない。'],
['品質管理システムの評価は，監査事務所の判断により数年に1度実施すれば足りる。','少なくとも年に1度評価する。']]});

T({id:'aud-cpa-law',f:AU,ch:'第8章 公認会計士法・倫理規則',t:'公認会計士法と独立性',r:'A',
T:['大会社等に対して監査証明業務を提供する場合には，公認会計士法により一定の非監査証明業務を同時に提供することが禁止されている。',
'大会社等の監査において，同一の業務執行社員が一定の会計期間を超えて継続して監査業務に関与することは禁止されている（ローテーション）。',
'大規模監査法人においては，筆頭業務執行社員等が連続して5会計期間関与した場合，その後5会計期間のインターバルが必要とされる。',
'公認会計士が大会社等の監査証明業務を行った場合，一定期間（1年間）は当該会社の役員等に就任することが制限される。',
'監査法人の社員のうち公認会計士である社員の占める割合は，100分の75以上でなければならない。'],
F:[['監査人は，被監査会社に対して非監査証明業務を制限なく同時に提供することができる。','大会社等に対しては一定の非監査証明業務の同時提供が禁止されている。'],
['大会社等の監査においても，業務執行社員のローテーションは任意である。','ローテーションは義務である。'],
['監査法人の社員のうち公認会計士である社員の割合は，半数以上であれば足りる。','100分の75以上である。'],
['公認会計士は，監査証明業務を行った会社の役員に，監査業務終了後直ちに就任することができる。','一定期間（1年間）は就任が制限される。'],
['大規模監査法人の筆頭業務執行社員のインターバル期間は2会計期間である。','5会計期間である。']]});

T({id:'aud-comm',f:AU,ch:'第6章 その他の諸論点（コミュニケーション）',t:'監査役等とのコミュニケーション・内部統制の不備の伝達',r:'B',
T:['監査人は，監査の過程で識別した内部統制の重要な不備を，書面により監査役等に適時に報告しなければならない。',
'監査人は，監査役等に対して，計画した監査の範囲とその実施時期の概要を伝達しなければならない。',

E({id:'tax-dividend',f:TX,ch:'法人税法',t:'受取配当等の益金不算入（計算）',r:'A',
gen(){ const a=R.int(1,5)*1000000, b=R.int(1,5)*1000000, c=R.int(1,5)*1000000, d=R.int(1,5)*1000000;
  return {q:`内国法人である当社（資本金1億円）が当期に受け取った配当等の額は次のとおりである。受取配当等の益金不算入額を計算過程を示して求めなさい（関連法人株式等に係る控除負債利子はないものとし，源泉所得税は考慮しない）。\n・完全子法人株式等（100%保有）：${Y(a)}円\n・関連法人株式等（40%保有）：${Y(b)}円\n・その他の株式等（10%保有）：${Y(c)}円\n・非支配目的株式等（3%保有）：${Y(d)}円`,
  model:`完全子法人株式等：${Y(a)}×100%＝${Y(a)}\n関連法人株式等：${Y(b)}×100%＝${Y(b)}（控除負債利子なし）\nその他の株式等：${Y(c)}×50%＝${Y(c/2)}\n非支配目的株式等：${Y(d)}×20%＝${Y(d/5)}\n益金不算入額合計＝${Y(a+b+c/2+d/5)}円`,
  kw:['100%','50%','20%',Y(a+b+c/2+d/5)]}; }});

E({id:'tax-entertain',f:TX,ch:'法人税法',t:'交際費等の損金不算入（計算）',r:'A',
gen(){ const tot=R.int(80,200)*100000; const food=R.int(20,Math.floor(tot/100000)-10)*100000; const half=food/2; const allow=Math.max(8000000,half); const non=tot-Math.min(tot,allow);
  return {q:`当社（資本金5,000万円，期末資本金の額が1億円以下で大法人との完全支配関係はない）の当期（12か月）の交際費等の額は${Y(tot)}円であり，そのうち接待飲食費の額は${Y(food)}円である（1人当たり1万円以下の飲食費は含まれていない）。交際費等の損金不算入額を求めなさい（有利な方法を選択する）。`,
  model:`① 定額控除限度額：800万円×12/12＝8,000,000\n② 接待飲食費の50%：${Y(food)}×50%＝${Y(half)}\n損金算入限度額＝①と②のいずれか多い額＝${Y(allow)}\n損金不算入額＝${Y(tot)}－${Y(Math.min(tot,allow))}＝${Y(non)}円`,
  kw:['800万円','50%','いずれか多い',Y(non)]}; }});

E({id:'tax-donation',f:TX,ch:'法人税法',t:'一般寄附金の損金算入限度額（計算）',r:'A',
gen(){ const K=R.int(1,10)*10000000; const inc=R.int(20,200)*1000000; const lim=(K*2.5/1000+inc*2.5/100)/4;
  return {q:`当社（期末の資本金の額及び資本準備金の額の合計額${Y(K)}円，当期12か月）の一般寄附金の損金算入限度額を求めなさい。なお，寄附金支出前所得金額は${Y(inc)}円とする。`,
  model:`資本基準額：${Y(K)}×12/12×2.5/1,000＝${Y(K*2.5/1000)}\n所得基準額：${Y(inc)}×2.5/100＝${Y(inc*2.5/100)}\n損金算入限度額＝(${Y(K*2.5/1000)}＋${Y(inc*2.5/100)})×1/4＝${Y(lim)}円`,
  kw:['2.5/1,000','2.5/100','1/4',Y(lim)]}; }});

E({id:'tax-officer',f:TX,ch:'法人税法',t:'役員給与の損金算入',r:'A',
q:'法人がその役員に対して支給する給与のうち，損金の額に算入されるものの類型を3つ挙げて説明しなさい（退職給与等を除く）。',
model:'① 定期同額給与：支給時期が1月以下の一定の期間ごとである給与で，その事業年度の各支給時期における支給額が同額であるもの等。\n② 事前確定届出給与：所定の時期に確定した額の金銭等を交付する旨の定めに基づいて支給する給与で，納税地の所轄税務署長にその定めの内容に関する届出をしているもの等。\n③ 業績連動給与：利益の状況を示す指標等を基礎として算定される給与で，算定方法が報酬委員会等の適正な手続を経て決定され，有価証券報告書等で開示されているなど一定の要件を満たすもの。\nなお，これらに該当する場合でも，不相当に高額な部分の金額は損金不算入となる。',

E({id:'tax-kyuyo',f:TX,ch:'所得税法',t:'給与所得の金額（計算）',r:'A',
gen(){ const S=R.int(40,84)*100000; let d; if(S<=1625000)d=550000; else if(S<=1800000)d=S*0.4-100000; else if(S<=3600000)d=S*0.3+80000; else if(S<=6600000)d=S*0.2+440000; else if(S<=8500000)d=S*0.1+1100000; else d=1950000;
  return {q:`居住者Aの本年分の給与等の収入金額は${Y(S)}円である。給与所得の金額を求めなさい（所得金額調整控除・特定支出控除は考慮しない）。`,
  model:`給与所得控除額：${S<=6600000?`${Y(S)}×20%＋440,000`:`${Y(S)}×10%＋1,100,000`}＝${Y(d)}\n給与所得の金額＝${Y(S)}－${Y(d)}＝${Y(S-d)}円`,
  kw:['給与所得控除',Y(d),Y(S-d)]}; }});

E({id:'tax-taishoku',f:TX,ch:'所得税法',t:'退職所得の金額（計算）',r:'A',
gen(){ const y=R.int(10,38); const S=R.int(10,40)*1000000; const ded= y<=20? Math.max(800000,400000*y) : 8000000+700000*(y-20); const inc=Math.max(0,(S-ded)/2);
  return {q:`居住者Bは本年，勤続${y}年で退職し，退職手当等${Y(S)}円の支払を受けた（障害者になったことによる退職ではなく，役員等勤続年数はない）。退職所得の金額を求めなさい。`,
  model:`退職所得控除額：${y<=20?`400,000×${y}年`:`8,000,000＋700,000×(${y}年－20年)`}＝${Y(ded)}\n退職所得の金額＝(${Y(S)}－${Y(ded)})×1/2＝${Y(inc)}円`,
  kw:[y<=20?'400,000':'700,000','1/2',Y(ded),Y(inc)]}; }});

E({id:'tax-ichiji',f:TX,ch:'所得税法',t:'一時所得（計算）',r:'B',
gen(){ const a=R.int(10,50)*100000, b=R.int(1,Math.floor(a/100000)-5)*100000; const inc=Math.max(0,a-b-500000);

E({id:'tax-menzei',f:TX,ch:'消費税法',t:'小規模事業者の納税義務の免除',r:'A',

E({id:'tax-dep-db',f:TX,ch:'法人税法',t:'減価償却：償却限度額と償却超過額（計算）',r:'A',

E({id:'tax-ikkatsu',f:TX,ch:'法人税法',t:'少額減価償却資産と一括償却資産（計算）',r:'A',

E({id:'tax-kashidaore',f:TX,ch:'法人税法',t:'貸倒引当金（一括評価金銭債権）（計算）',r:'A',

  const L1=Math.round(B*jr), L2=(B-off)*k[1]/1000; const lim=Math.max(L1,L2); const C=Math.round(lim/10000)*10000+R.int(1,30)*10000;
  return {q:`${TXN}\n当社（資本金3,000万円，${k[0]}，大法人との完全支配関係なし）の期末一括評価金銭債権の帳簿価額は${Y(B)}円であり，このうち実質的に債権とみられない金額（同一取引先に対する買掛金との相殺可能額）は${Y(off)}円である。貸倒実績率は${jr}である。当社は貸倒引当金繰入額として${Y(C)}円を損金経理した。\n問：繰入限度額及び繰入限度超過額を求めなさい（有利な方法による）。`,
  model:`① 実績繰入率による限度額：${Y(B)}×${jr}＝${Y(L1)}\n② 法定繰入率による限度額：(${Y(B)}－${Y(off)})×${k[1]}/1,000＝${Y(L2)}\n繰入限度額：①と②のいずれか多い額＝${Y(lim)}\n繰入限度超過額：${Y(C)}－${Y(lim)}＝${Y(C-lim)}（加算・留保）`,
  kw:['実績繰入率','法定繰入率',`${k[1]}/1,000`,'実質的に債権とみられない',Y(lim),Y(C-lim)]}; }});

E({id:'tax-kifu2',f:TX,ch:'法人税法',t:'寄附金の損金不算入額（指定寄附金・特定公益増進法人）（計算）',r:'A',

/* ============ 租税法（法人税法①テキスト準拠：別表四の加算・減算／計算＋理論） ============
 * 出典：租税法テキスト（法人税法①）。用語・端数処理・解答形式（加算すべき金額／減算すべき金額）はテキストに合わせている。
 * 当期は令和5年4月1日～令和6年3月31日（テキストの例題と同じ事業年度）。
 */
{
const N3='（前提）当社は3月決算の内国法人（普通法人）であり，当期は令和5年4月1日から令和6年3月31日までの12か月である。';
const r3=v=>(v/1000).toFixed(3);                       // 償却率（千分率の整数）→ '0.250'
const monthsTo=mo=>mo>=4?16-mo:4-mo;                  // 事業供用月から期末（3月）までの月数
const dt=(mo,d)=>mo>=4?`令和5年${mo}月${d}日`:`令和6年${mo}月${d}日`;
const rngM=mo=>`${mo}月～3月`;
const man=v=>v%100000000===0?`${v/100000000}億円`:`${Y(v/10000)}万円`;
/* 定額法・200％定率法の償却率（平成24年4月1日以後取得分，テキスト掲載の償却率表と同値） */
const TEIGAKU={3:334,5:200,6:167,8:125,10:100,12:84,15:67,20:50,24:42,30:34,34:30,38:27,47:22,50:20};
const TEIRITSU={2:1000,3:667,4:500,5:400,6:333,7:286,8:250,9:222,10:200,11:182,12:167,13:154,14:143,15:133,20:100};
/* 別表四の書式（テキスト法②－11・法㉕－2）：加算・減算 → 仮計 → 仮計の下（寄附金・所得税額）→ 差引計 → 欠損金 → 所得金額 */
function B4(NI,adds,subs,below,loss){
  const A=adds.filter(x=>x[1]>0), S=subs.filter(x=>x[1]>0), Bl=(below||[]).filter(x=>x[1]>0);
  const sa=A.reduce((s,x)=>s+x[1],0), ss=S.reduce((s,x)=>s+x[1],0);
  const kari=NI+sa-ss, sb=Bl.reduce((s,x)=>s+x[1],0), sashi=kari+sb;
  const use=loss?Math.min(loss,sashi):0, inc=sashi-use;
  const L=['【別表四】',`当期利益 ${Y(NI)}`,'加算：'];
  A.forEach(x=>L.push(`　${x[0]} ${Y(x[1])}（${x[2]}）`)); L.push(`　加算 小計 ${Y(sa)}`);
  L.push('減算：'); if(!S.length) L.push('　なし'); S.forEach(x=>L.push(`　${x[0]} ${Y(x[1])}（${x[2]}）`)); L.push(`　減算 小計 ${Y(ss)}`);
  L.push(`仮計 ${Y(kari)}`);
  Bl.forEach(x=>L.push(`${x[0]} ${Y(x[1])}（${x[2]}）`));
  if(Bl.length||loss) L.push(`合計・差引計 ${Y(sashi)}`);
  if(loss) L.push(`欠損金の当期控除額 △${Y(use)}`);
  L.push(`所得金額 ${Y(inc)}`);
  return {txt:L.join('\n'),sa,ss,kari,sashi,use,inc};
}
const addSub=(adds,subs)=>{ const A=adds.filter(x=>x[1]>0), S=subs.filter(x=>x[1]>0);
  return '（加算すべき金額）\n'+(A.length?A.map(x=>`　${x[0]} ${Y(x[1])}（${x[2]}）`).join('\n'):'　なし')+'\n（減算すべき金額）\n'+(S.length?S.map(x=>`　${x[0]} ${Y(x[1])}（${x[2]}）`).join('\n'):'　なし'); };
