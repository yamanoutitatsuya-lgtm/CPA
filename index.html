}});

/* ---- 4. 個別決算整理 ---- */
SG({id:'sg-kessan-1',t:'決算整理（残高試算表から当期純利益）',ch:'決算整理',g(R){
  // 貸倒引当金
  const AR=R.int(40,90)*1000, X=R.int(2,8)*100, A0=X+R.int(2,10)*100, rt=2;
  const A1=pc(AR-X,rt), kuri=A1-(A0-X); if(kuri<=0) throw 0;
  // 商品
  const B=R.int(20,50)*1000, Pu=R.int(300,600)*1000, c=R.int(30,60), Qb=R.int(800,1500), Qa=Qb-R.int(10,50), nv=c-R.int(1,5);
  const End=Qb*c, cogs=B+Pu-End, gen=(Qb-Qa)*c, hyo=Qa*(c-nv), bsInv=Qa*nv;
  if(cogs<=0) throw 0;
  // 建物（定額法）
  const L=R.pick([20,25,30,40]), depB=R.int(20,60)*100, Bc=depB*L, Bd=depB*R.int(2,L-5);
  // 備品（定率法）
  const rate=R.pick([20,25]), Ec=R.int(10,40)*1000, Ed=R.int(2,Math.floor(Ec/100*0.6))*100;
  const depE=pc(Ec-Ed,rate);
  const mA=R.pick([10,12,1]), mon=(3-mA+12)%12+1, Nc=R.int(2,10)*1200, depN=pc(Nc,rate)*mon/12;
  ok(isI(depN),'depN');
  const depAll=depB+depE+depN;
  // 有価証券
  const Tc=R.int(50,150)*100; let Tv=Tc+R.int(-20,20)*100; if(Tv===Tc) throw 0;
  const m=R.pick([4,5]), ay=R.int(1,8)*100, F=R.int(10,50)*1000, H=F-m*ay, cr=R.pick([1,2]), cpn=pc(F,cr);
  // 経過勘定
  const pm=R.pick([8,9,10,11,12,1]), used=(3-pm+12)%12+1, P12=R.int(3,20)*1200, prep=P12*(12-used)/12;
  const Sal=R.int(40,90)*1000, ua=R.int(2,8)*100, O=R.int(20,60)*1000;
  const exp=cogs+gen+hyo+kuri+depAll+Sal+ua+(P12-prep)+O;
  const Sales=Math.round((exp+R.int(20,80)*1000-cpn-ay-(Tv-Tc))/1000)*1000;
  const NI=Sales+cpn+ay+(Tv-Tc)-exp; if(NI<=0) throw 0;
  const tb=[['現金預金',R.int(30,90)*1000,''],['売掛金',AR,''],['繰越商品',B,''],['売買目的有価証券',Tc,''],['満期保有目的債券',H,''],['建物',Bc,''],['備品',Ec+Nc,''],
    ['貸倒引当金','',A0],['建物減価償却累計額','',Bd],['備品減価償却累計額','',Ed],['売上','',Sales],['有価証券利息','',cpn],
    ['仕入',Pu,''],['給料',Sal,''],['支払保険料',P12,''],['その他の費用',O,'']];
  const data=P(`当社の当期（X1年4月1日～X2年3月31日）の決算整理前残高試算表（一部）および決算整理事項は次のとおりである。${NOTE}法人税等および税効果会計は考慮しない。`)
   +tbl(tb,['勘定科目','借方','貸方'])
   +P(`1．売掛金のうち${Y(X)}千円は前期に発生した得意先に対するものであり，当期中に回収不能となったが未処理である。売掛金の期末残高に対して${rt}％の貸倒引当金を差額補充法により設定する。`)
   +P(`2．期末商品の帳簿棚卸数量は${Qb}個，実地棚卸数量は${Qa}個，取得原価は@${c}千円，正味売却価額は@${nv}千円である。棚卸減耗損および商品評価損は売上原価に含めず独立の費用として表示する。`)
   +P(`3．建物は耐用年数${L}年，残存価額ゼロの定額法により償却する。備品は償却率${rate/100}の定率法により償却する。備品のうち${Y(Nc)}千円はX${mA>=4?1:2}年${mA}月1日に取得し使用を開始したもので（期中取得分は月割計算），残高試算表の備品減価償却累計額はすべて取得済みの既存備品にかかるものである。`)
   +P(`4．売買目的有価証券の期末時価は${Y(Tv)}千円である。満期保有目的債券は当期首に額面${Y(F)}千円の社債（満期まで${m}年，クーポン年${cr}％，利払日3月31日）を${Y(H)}千円で取得したものであり，取得差額は金利調整差額と認められるため償却原価法（定額法）を適用する。当期の利息は受取済みで適正に処理されている。`)
   +P(`5．支払保険料はX${pm>=4?1:2}年${pm}月1日に1年分を支払ったものである。給料の未払額が${Y(ua)}千円ある。`);
  const s1=S('問1　当期純利益はいくらか。',NI,
    [NI+ay, NI+depE-pc(Ec,rate), NI+depN-pc(Nc,rate), NI-prep, NI+kuri-(pc(AR,rt)-A0), NI+hyo, NI+ua],
    `収益：売上${Y(Sales)}＋有価証券利息${Y(cpn+ay)}（クーポン${Y(cpn)}＋償却額${Y(ay)}）${Tv>Tc?'＋':'－'}有価証券評価${Tv>Tc?'益':'損'}${Y(Math.abs(Tv-Tc))}<br>売上原価＝${Y(B)}＋${Y(Pu)}－${Y(End)}＝${Y(cogs)}，棚卸減耗損${Y(gen)}，商品評価損${Y(hyo)}<br>貸倒引当金繰入＝（${Y(AR)}－${Y(X)}）×${rt}％－（${Y(A0)}－${Y(X)}）＝${Y(kuri)}<br>減価償却費${Y(depAll)}，給料${Y(Sal+ua)}，保険料${Y(P12-prep)}（前払${Y(prep)}），その他${Y(O)}<br>当期純利益＝<b>${Y(NI)}千円</b>`);
  const s2= R.chance(0.5)
   ? S('問2　期末の貸借対照表に計上される商品の金額はいくらか。',bsInv,
      [End, Qa*c, Qb*nv, End-gen, End-hyo],
      `実地数量${Qa}個×正味売却価額@${nv}＝<b>${Y(bsInv)}千円</b>`)
   : S('問2　期末の貸借対照表に計上される満期保有目的債券（投資有価証券）の金額はいくらか。',H+ay,
      [H, F, F-ay, H+2*ay, H+ay*m],
      `取得差額${Y(F-H)}を${m}年で定額償却：${Y(F-H)}÷${m}＝${Y(ay)}<br>${Y(H)}＋${Y(ay)}＝<b>${Y(H+ay)}千円</b>`);
  const s3=S('問3　当期の減価償却費（建物および備品の合計）はいくらか。',depAll,
    [depB+pc(Ec,rate)+depN, depB+depE+pc(Nc,rate), depB+pc(Ec+Nc-Ed,rate), depB+pc(Ec,rate)+pc(Nc,rate), depE+depN, depB+depE],
    `建物：${Y(Bc)}÷${L}年＝${Y(depB)}<br>既存備品：（${Y(Ec)}－${Y(Ed)}）×${rate/100}＝${Y(depE)}<br>新規備品：${Y(Nc)}×${rate/100}×${mon}/12＝${Y(depN)}<br>合計＝<b>${Y(depAll)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});

/* ---- 5. 税効果会計＋包括利益 ---- */
SG({id:'sg-zeikouka-1',t:'税効果会計と包括利益',ch:'税効果会計',g(R){
  const t=30, t7=70;
  const a0=R.int(10,60)*100, a1=R.int(10,60)*100, d0=R.int(10,80)*100, d1=R.int(10,80)*100;
  const dlt=(a1+d1)-(a0+d0); if(dlt===0) throw 0;
  const C=R.int(20,60)*1000, V0=C+R.int(-30,30)*100, V1=V0+R.int(5,40)*100; if(V1===C) throw 0;
  const ent=R.int(5,30)*100, PBT=R.int(80,200)*1000;
  const taxable=PBT+ent+dlt, Tx=pc(taxable,t), adj=pc(dlt,t);   // adj>0: 貸方（費用の減少）
  const NI=PBT-Tx+adj;
  ok(NI===PBT-pc(PBT+ent,t),'NI5');
  const secDTA=V1<C?pc(C-V1,t):0;
  const dta=pc(a1+d1,t)+secDTA;
  const oci=pc(V1-V0,t7), ci=NI+oci;
  const data=P(`当社の当期（X1年4月1日～X2年3月31日）に関する資料は次のとおりである。${NOTE}法定実効税率は${t}％とし，繰延税金資産の回収可能性に問題はないものとする。`)
   +P('1．将来減算一時差異の残高')+tbl([['貸倒引当金繰入限度超過額',a0,a1],['減価償却限度超過額',d0,d1]],['項目','期首','期末'])
   +P(`2．当期の税引前当期純利益は${Y(PBT)}千円である。このほか，交際費の損金不算入額が${Y(ent)}千円ある（永久差異）。当期の課税所得に基づく「法人税，住民税及び事業税」は${Y(Tx)}千円である。`)
   +P(`3．当社は前期よりその他有価証券（取得原価${Y(C)}千円）を保有しており，前期末の時価は${Y(V0)}千円，当期末の時価は${Y(V1)}千円である。全部純資産直入法を採用し，評価差額には税効果会計を適用する。評価差額は毎期洗替処理する。`)
   +P('4．当期の包括利益計算書において，その他の包括利益はその他有価証券評価差額金のみである（組替調整額はない）。');
  const s1=S('問1　当期末の繰延税金資産の金額（繰延税金負債と相殺する前の金額）はいくらか。',dta,
    [pc(a1+d1,t), pc(a1+d1+ent,t)+secDTA, pc(a1+d1,t7)+(V1<C?pc(C-V1,t7):0), Math.abs(adj), pc(a1+d1,t)+pc(Math.abs(V1-C),t)+(V1<C?pc(C-V1,t):0), pc(a0+d0,t)+secDTA],
    `貸倒引当金${Y(a1)}＋減価償却${Y(d1)}${V1<C?`＋その他有価証券評価差損${Y(C-V1)}`:''}＝${Y(a1+d1+(V1<C?C-V1:0))}<br>×${t}％＝<b>${Y(dta)}千円</b>${V1<C?'':'<br>その他有価証券は評価差益のため繰延税金負債となり，繰延税金資産には含まれない。'}<br>交際費は永久差異のため税効果の対象外。`);
  const s2= R.chance(0.5)&&adj>0
   ? S('問2　当期の損益計算書に計上される法人税等調整額（貸方）はいくらか。',adj,
      [pc(a1+d1,t), pc(dlt+ent,t), pc(dlt,t7), pc(dlt+V1-V0,t), pc(a1-a0,t), pc(d1-d0,t)],
      `一時差異の増加額＝（${Y(a1)}＋${Y(d1)}）－（${Y(a0)}＋${Y(d0)}）＝${Y(dlt)}<br>${Y(dlt)}×${t}％＝<b>${Y(adj)}千円</b>（貸方）<br>その他有価証券の評価差額にかかる税効果は評価差額金から直接控除され，法人税等調整額には含めない。`)
   : S('問2　当期の損益計算書に計上される当期純利益はいくらか。',NI,
      [PBT-Tx, PBT-Tx-adj, pc(PBT,t7), PBT-Tx+adj+ent, NI+pc(V1-V0,t)],
      `税引前当期純利益${Y(PBT)}－法人税等${Y(Tx)}${adj>=0?'＋':'－'}法人税等調整額${Y(Math.abs(adj))}＝<b>${Y(NI)}千円</b><br>（検算：${Y(PBT)}－（${Y(PBT)}＋交際費${Y(ent)}）×${t}％＝${Y(NI)}）`);
  const s3= R.chance(0.5)
   ? S('問3　当期の包括利益計算書に計上されるその他の包括利益はいくらか。',oci,
      [V1-V0, pc(V1-V0,t), Math.abs(V1-C)>0?pc(Math.abs(V1-C),t7):0, V1-C>0?V1-C:0, NI+oci],
      `当期末評価差額${Y(V1-C)}－前期末評価差額${Y(V0-C)}＝増加額${Y(V1-V0)}<br>税効果控除後：${Y(V1-V0)}×（1－${t}％）＝<b>${Y(oci)}千円</b>`)
   : S('問3　当期の包括利益計算書に計上される包括利益はいくらか。',ci,
      [NI+(V1-V0), NI, NI+(V1>C?pc(V1-C,t7):0), PBT-Tx+oci, NI+pc(V1-V0,t), pc(PBT,t7)+oci, NI-adj+oci],
      `当期純利益${Y(NI)}＋その他の包括利益${Y(oci)}（（${Y(V1)}－${Y(V0)}）×${t7}％）＝<b>${Y(ci)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});
})();

/* ---- 出題の組立て ---- */
function xDraw(fields,kind,n){
  const pool=BANK.filter(i=>fields.includes(i.f)&&i.kind===kind); if(!pool.length) return [];
  const out=[]; let list=R.shuffle(pool);
  while(out.length<n){ if(!list.length) list=R.shuffle(pool); out.push(list.shift()); }
  return out;
}
function xTheory(fields,n){ return xDraw(fields,'theory',n).map(it=>{ const q=buildTheory(it); return {kind:'theory',f:it.f,topic:it.t,html:q.html,choices:q.choices,correct:q.correct,ex:q.ex}; }); }
function xCalc(fields,n){ return xDraw(fields,'calc',n).map(it=>{ const q=buildCalc(it); return {kind:'calc',f:it.f,topic:it.t,html:q.html,choices:q.choices,correct:q.correct,ex:q.ex}; }); }
function xSogo(n){
  const out=[]; const picks=R.pickN(SOGO,Math.min(n,SOGO.length));
  picks.forEach((d,g)=>{
    for(let t=0;t<60;t++){
      let o; try{ o=d.g(R); }catch(e){ if(e!==0) console.error(d.id,e); continue; }
      try{ const qs=o.subs.map((s,k)=>{ const q=buildCalc({id:d.id+'-'+k,g:()=>s}); return {kind:'calc',f:'fa-c',topic:d.t,html:String(q.html).replace(/^(<p>)?\s*問\s*[0-9０-９]+\s*/,'$1'),choices:q.choices,correct:q.correct,ex:q.ex,sogo:{g,t:d.t,data:o.data,k}}; });
        out.push(...qs); return; }catch(e){ continue; }
    }
  });
  return out;
}
function xPts(qs,total){
  const n=qs.length, base=Math.floor(total/n); let rem=total-base*n;
  qs.forEach(q=>q.pts=base);
  for(const q of qs.filter(q=>q.kind==='calc').concat(qs.filter(q=>q.kind!=='calc'))){ if(rem<=0) break; q.pts++; rem--; }
  qs.forEach((q,i)=>q.no=i+1); return qs;
}

/* ---- 合格可能性（推定） ---- */
const logi=x=>1/(1+Math.exp(-x));
function xJudge(type,subs){
  const tot=subs.reduce((a,s)=>a+s.score,0), max=subs.reduce((a,s)=>a+s.max,0), ratio=max?tot/max:0;
  const cut=subs.some(s=>s.score<s.max*0.4);
  let p= type==='tanto' ? logi((ratio-0.70)/0.025) : logi((ratio-0.52)/0.03);
  if(cut) p=Math.min(p, type==='tanto'?0.02:0.05);
  p=Math.max(0.01,Math.min(0.99,p));
  const rank= p>=0.8?'A':p>=0.6?'B':p>=0.4?'C':p>=0.2?'D':'E';
  const label={A:'合格圏',B:'合格有望',C:'ボーダー付近',D:'もう一歩',E:'要努力'}[rank];
  return {tot:Math.round(tot*10)/10,max,ratio,cut,p,rank,label};
}

/* ---- 論文式の採点（Claude，使えない環境ではキーワード照合） ---- */
const nrm=s=>String(s||'').replace(/[\s,，、。．.・「」（）()：:]/g,'');
function kwScore(sub,ans){
  const a=nrm(ans); if(a.length<15) return {score:0,fb:'記述が不足しているため採点対象外です。'};
  const hits=sub.kw.filter(k=>a.includes(nrm(k))); const need=Math.max(1,Math.ceil(sub.kw.length*0.7));
  const sc=Math.round(sub.pts*Math.min(1,hits.length/need)*2)/2;
  return {score:sc,fb:`キーワード照合による簡易採点（${hits.length}/${sub.kw.length}語）。`};
}
function rbPrompt(subjName,b,answers){
  const lead=plain(b.q).slice(0,2800);
  const parts=b.subs.map((s,j)=>`【設問${j+1}】（配点${s.pts}点）${plain(s.q)}\n［模範解答］${s.model}\n［採点キーワード］${s.kw.join('／')}\n［受験生答案］${(answers[j]||'').trim()||'（空欄）'}`).join('\n\n');
  return `あなたは公認会計士試験 論文式試験「${subjName}」の採点委員です。次の大問について，設問ごとに受験生答案を模範解答と照らして採点してください。
【採点基準】計算は最終数値と主要な計算過程，理論は論点の指摘・根拠・結論が模範解答と同じ趣旨かを評価し，表現の違いは許容する。空欄や設問と無関係な記述は0点。部分点は配点の範囲内で0.5点刻みで与える。
【問題文】${lead}

${parts}

次のJSONだけを返してください：{"scores":[{"score":数値,"feedback":"日本語100字以内（良い点と不足点）"}]}（scoresは設問の数${b.subs.length}個，設問順）`;
}
async function gradeRBBlock(subjName,b,answers){
  const blank=answers.every(a=>!nrm(a));
  if(blank) return b.subs.map(()=>({score:0,fb:'空欄',mode:'blank'}));
  if(AI.state==='ready'){
    try{ const r=await AI.fn.json(rbPrompt(subjName,b,answers),{modelTier:'default'});
      const arr=r&&Array.isArray(r.scores)?r.scores:null;
      if(arr&&arr.length>=b.subs.length) return b.subs.map((s,j)=>{ let v=Number(arr[j]&&arr[j].score); if(!isFinite(v)) v=0; v=Math.max(0,Math.min(s.pts,Math.round(v*2)/2)); if(!nrm(answers[j])) v=0; return {score:v,fb:String(arr[j].feedback||''),mode:'ai'}; });
    }catch(e){ if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e&&e.code)) AI.state='off'; }
  }
  return b.subs.map((s,j)=>({...kwScore(s,answers[j]),mode:'kw'}));
}

const Vault={
  enc:new TextEncoder(),
  async put(key,items){
    try{ localStorage.setItem('cpa-x:'+key,JSON.stringify(items)); }catch(e){}
    if(!Store.db||!Store.uid) return;
    const chunks=[]; let cur=[], size=0;
    for(const it of items){ const b=this.enc.encode(JSON.stringify(it)).length; if(cur.length&&size+b>190000){ chunks.push(cur); cur=[]; size=0; } cur.push(it); size+=b; }
    chunks.push(cur);
    for(let i=0;i<chunks.length;i++){ try{ await Store.db.doc(`data/users/${Store.uid}/x_${key}_${i}`).set({i,n:chunks.length,items:chunks[i]}); }catch(e){} }
  },
  async get(key){
    if(Store.db&&Store.uid){ try{ const s0=await Store.db.doc(`data/users/${Store.uid}/x_${key}_0`).get();
      if(s0.exists){ const d0=s0.data(); let items=d0.items||[]; for(let i=1;i<(d0.n||1);i++){ const s=await Store.db.doc(`data/users/${Store.uid}/x_${key}_${i}`).get(); if(s.exists) items=items.concat(s.data().items||[]); } return items; } }catch(e){} }
    try{ const s=localStorage.getItem('cpa-x:'+key); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async drop(key){ try{ localStorage.removeItem('cpa-x:'+key); }catch(e){} if(Store.db&&Store.uid){ for(let i=0;i<4;i++){ try{ await Store.db.doc(`data/users/${Store.uid}/x_${key}_${i}`).delete(); }catch(e){} } } },
};

    const X=this.X; X.lastTimeUp=!!timeUp;
    if(X.type==='tanto'){
      const subs=X.subs.map(s=>{ let sc=0,ok=0; s.qs.forEach((q,i)=>{ if(s.marks[i]===q.correct){sc+=q.pts;ok++;} }); return {id:s.id,name:s.name,score:sc,max:s.pts,ok,n:s.qs.length,used:s.end-s.start,timeUp:s.timeUp}; });
      const j=xJudge('tanto',subs);
      const details=X.subs.map(s=>({id:s.id,name:s.name,items:s.qs.map((q,i)=>({no:q.no,pts:q.pts,kind:q.kind,topic:q.topic,mark:s.marks[i],correct:q.correct,choices:q.choices,...(s.marks[i]===q.correct?{}:{html:q.html,ex:q.ex,data:q.sogo?q.sogo.data:null})}))}));
      const sum={id:X.id,type:'tanto',date:X.date,subs,...j};
      X.phase='result'; X.summary=sum; X.details=details; document.body.classList.remove('in-exam'); App.go('exam');
      this.saveHistory(sum,details);
      return;
    }
    // 論文式：この回の2科目を採点して保存（結果の表示は6科目終了後）
    X.phase='grading'; X.gradeDone=0; X.gradeAll=X.subs.reduce((a,s)=>a+s.blocks.length,0); App.go('exam');
    const rb=Store.data.ronbun;
    for(const s of X.subs){
      const res=await this.pool(s.blocks.map((b,k)=>async()=>{ const g=await gradeRBBlock(s.name.replace(/.*（|）/g,''),b,s.ans[k]); X.gradeDone++; const el=document.getElementById('xgp'); if(el) el.textContent=`${X.gradeDone} / ${X.gradeAll}`; return g; }),3);
      const blocks=s.blocks.map((b,k)=>({...b,ans:s.ans[k],grades:res[k]}));
      const got=blocks.reduce((a,b)=>a+b.grades.reduce((x,g)=>x+g.score,0),0), full=blocks.reduce((a,b)=>a+b.subs.reduce((x,t)=>x+t.pts,0),0);
      const mode=blocks.some(b=>b.grades.some(g=>g.mode==='ai'))?'ai':'kw';
      rb.res[s.id]={name:s.name,w:s.w,got,full,pct:full?got/full*100:0,used:s.end-s.start,timeUp:s.timeUp,mode,date:Date.now()};
      await Vault.put(`${rb.id}_${s.id}`,blocks);
    }
    rb.done[X.sit]=true; Store.save();
    if(rb.done.every(Boolean)){
      const subs=RONBUN.flat().map(t=>{ const r=rb.res[t.id]||{pct:0,name:t.name,w:t.w}; return {id:t.id,name:r.name||t.name,score:Math.round(r.pct*t.w/100*10)/10,max:t.w,pct:r.pct,used:r.used,timeUp:r.timeUp,mode:r.mode}; });
      const j=xJudge('ronbun',subs); const sum={id:rb.id,type:'ronbun',date:Date.now(),subs,...j};
      const details=[]; for(const t of RONBUN.flat()){ details.push({id:t.id,name:t.name,blocks:await Vault.get(`${rb.id}_${t.id}`)||[]}); }
      Store.data.ronbun=null; X.phase='result'; X.summary=sum; X.details=details; document.body.classList.remove('in-exam'); App.go('exam');
      this.saveHistory(sum,null);
    } else { X.phase='sitdone'; document.body.classList.remove('in-exam'); App.go('exam'); }
  },
  async pool(tasks,n){ const out=new Array(tasks.length); let i=0; const run=async()=>{ while(i<tasks.length){ const k=i++; out[k]=await tasks[k](); } }; await Promise.all(Array.from({length:Math.min(n,tasks.length)},run)); return out; },
  async saveHistory(sum,details){
    const d=Store.data; d.exams=d.exams||[]; d.exams.push(sum);
    while(d.exams.length>30){ const old=d.exams.shift(); (old.subs||[]).forEach(s=>Vault.drop(`${old.id}_${s.id}`)); }
    Store.save();
    if(details) for(const s of details){ await Vault.put(`${sum.id}_${s.id}`,s.items); }
  },
  async openHist(id){
    const sum=(Store.data.exams||[]).find(e=>e.id===id); if(!sum) return;
    this.X={phase:'result',summary:sum,details:null,hist:true}; App.go('exam');
    const details=[]; for(const s of sum.subs){ const v=await Vault.get(`${sum.id}_${s.id}`); details.push(sum.type==='tanto'?{id:s.id,name:s.name,items:v||[]}:{id:s.id,name:s.name,blocks:v||[]}); }
    if(this.X&&this.X.summary===sum){ this.X.details=details; App.render(); }
  },

  /* --- 描画 --- */
  render(){
    const X=this.X; if(!X) return '<div class="empty">模擬試験は開始されていません。<div style="margin-top:12px"><button class="btn" data-act="home">戻る</button></div></div>';
    document.body.classList.toggle('in-exam',['run','grading'].includes(X.phase));
    const typ=X.type==='tanto'?'短答式':'論文式';

    if(X.phase==='grading') return `<div class="xwait"><div class="xk">論文式 第${X.sit+1}回</div><h2>答案を採点して保存しています</h2><p class="lead">画面を閉じずにお待ちください（<span id="xgp">${X.gradeDone} / ${X.gradeAll}</span>）。点数は6科目すべて終わってから表示します。</p><div class="xspin"></div></div>`;
    if(X.phase==='sitdone'){ const rb=Store.data.ronbun; const k=rb?rb.done.indexOf(false):-1;
      return `<div class="xwait"><div class="xk">論文式</div><h2>第${X.sit+1}回（${X.subs.map(s=>s.name).join('・')}）を保存しました</h2><p class="lead">${X.lastTimeUp?'制限時間になったため答案を回収しました。':''}答案は保存済みです。6科目すべて終わった時点で採点結果と合格可能性を表示します。</p>
      <ol class="xsched">${RONBUN.map((p,i)=>`<li class="${rb&&rb.done[i]?'done':''}"><b>第${i+1}回</b><span>${p.map(s=>s.name).join('・')}</span>${rb&&rb.done[i]?'<em>済</em>':''}</li>`).join('')}</ol>
      <div class="row">${k>=0?`<button class="btn pri" data-act="x-start-ronbun">続けて第${k+1}回を受ける</button>`:''}<button class="btn" data-act="x-home">ホームへ</button></div></div>`; }
    if(X.phase==='result') return this.vResult();
    return '';
  },
  vIntro(typ){
    const X=this.X;
    const rules= X.type==='tanto'
      ? ['科目は 企業法 → 管理会計論 → 監査論 → 財務会計論 の順で，本試験と同じ制限時間です。','制限時間になると，その科目は自動的に終了し（未解答は0点），次の科目に進みます。科目の間は休憩できます。','解答中は正誤を表示しません。4科目がすべて終わってから答え合わせをし，合格可能性を判定します。','途中で中断・画面を閉じた場合は最初からやり直しとなり，結果は保存されません。','各科目の問題冊子・マークシートは解答中に印刷できます。']
      : [`第${X.sit+1}回は ${X.subs.map(s=>s.name).join(' → ')} の順で，各${RB_MIN}分です。`,'各科目 大問3〜4問の記述式です。計算問題は計算過程も書いてください。','制限時間になると自動的に答案を回収し，次の科目に進みます。','途中で中断・画面を閉じた場合，この回は最初からやり直しとなり保存されません（終了済みの回の答案は保存されています）。','採点結果と合格可能性は，6科目すべて終わった時点で表示します。'];

      <table class="d xtbl"><tr><th>順</th><th>科目</th><th>出題</th><th>時間</th></tr>${X.subs.map((s,i)=>`<tr><td>${XNUM[i]}</td><td>${s.name}</td><td>${s.spec}</td><td class="r">${s.min}分</td></tr>`).join('')}</table>
      <ul class="xrules">${rules.map(r=>`<li>${r}</li>`).join('')}</ul>
      <div class="row"><button class="btn pri" data-act="x-begin">${X.subs[0].name}を開始する</button><button class="btn ghost" data-act="x-home">やめる</button></div></div>`;
  },
  vBreak(typ){
    const X=this.X, prev=X.subs[X.cur-1], s=this.sub();
    return `<div class="xwait"><div class="xk">${typ}${X.type==='ronbun'?` 第${X.sit+1}回`:''}　休憩</div><h2>${prev.name}が終了しました</h2><p class="lead">${X.lastTimeUp?'制限時間になったため解答を回収しました。':'解答を回収しました。'}結果は最後にまとめて表示します。</p>
      <ol class="xsched">${X.subs.map((t,i)=>`<li class="${i<X.cur?'done':i===X.cur?'now':''}"><b>${XNUM[i]} ${t.name}</b><span>${t.spec}・${t.min}分</span>${i<X.cur?'<em>済</em>':''}</li>`).join('')}</ol>
      <div class="row"><button class="btn pri" data-act="x-begin">${s.name}を開始する（${s.min}分）</button><button class="btn ghost" data-act="x-quit">中断する</button></div></div>`;
  },
  bar(title){
    const s=this.sub();
    return `<div class="xbar"><div class="xti"><span class="xk">${this.X.type==='tanto'?'短答式':'論文式'}　${XNUM[this.X.cur]}</span><b>${s.name}</b></div><div class="xtime" id="xtimer" role="timer" aria-label="残り時間">${fmtT(s.deadline-Date.now())}</div>
      <div class="xacts"><button class="btn" data-act="x-print" data-what="book">問題<span class="xl">冊子を</span>印刷</button><button class="btn" data-act="x-print" data-what="sheet">答案<span class="xl">用紙を</span>印刷</button><button class="btn pri" data-act="x-submit">解答<span class="xl">を</span>終了</button><button class="btn ghost" data-act="x-quit">中断</button></div></div>`;
  },
  vTanto(){
    const X=this.X, s=this.sub(), q=s.qs[X.qi], m=s.marks[X.qi];
    let data='';
    if(q.sogo){ const grp=s.qs.filter(x=>x.sogo&&x.sogo.g===q.sogo.g); data=`<div class="sogo"><div class="sogo-h">問題${grp[0].no}から問題${grp[grp.length-1].no}までは，次の〔資料〕に基づいて解答しなさい。</div>${q.sogo.data}</div>`; }
    const left=s.marks.filter(x=>x===null).length;
    let h=this.bar()+`<article class="qcard xq"><div class="qgrid"><div class="qmain"><div class="qno">問題 ${q.no}<span class="xpts">（${q.pts}点）</span></div>${data}<div class="qtext">${q.html}</div></div>
      <div class="qside"><div class="sheet"><div class="sheet-l">マークシート　問題${q.no}</div><div class="choices">${q.choices.map((c,i)=>`<button class="ch${m===i?' sel':''}" data-act="x-mark" data-i="${i}" aria-pressed="${m===i}"><span class="ov">${i+1}</span><span class="tx">${c}</span></button>`).join('')}</div></div>
      <div class="qnav"><button class="btn" data-act="x-go" data-d="-1" ${X.qi?'':'disabled'}>← 前の問題</button><button class="btn ${s.flags[X.qi]?'on':''}" data-act="x-flag" aria-pressed="${s.flags[X.qi]}">${s.flags[X.qi]?'★ 見直し':'☆ 見直し'}</button><button class="btn pri" data-act="x-go" data-d="1" ${X.qi<s.qs.length-1?'':'disabled'}>次の問題 →</button></div>
      <p class="kbd-hint"><kbd>1</kbd>〜<kbd>6</kbd> マーク　<kbd>←</kbd><kbd>→</kbd> 問題移動　<kbd>F</kbd> 見直し印</p></div></div></article>`;
    h+=`<div class="xmap"><div class="xmap-h">解答状況　<span>未解答 ${left}問</span></div><div class="xcells">${s.qs.map((x,i)=>`<button data-act="x-jump" data-i="${i}" class="${i===X.qi?'cur':''} ${s.marks[i]!==null?'done':''} ${s.flags[i]?'flag':''}" aria-label="問題${x.no}">${x.no}<small>${s.marks[i]!==null?s.marks[i]+1:''}</small></button>`).join('')}</div></div>`;
    return h;
  },
  vRonbun(){
    const X=this.X, s=this.sub(), b=s.blocks[X.qi];
    const links=XLAW[s.id]; const full=b.subs.reduce((a,t)=>a+t.pts,0);
    let h=this.bar()+`<div class="xtabs">${s.blocks.map((x,i)=>`<button data-act="x-jump" data-i="${i}" aria-pressed="${i===X.qi}">${XKAN[i]}</button>`).join('')}${links?`<span class="xlaw">法令：${links.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('')}</span>`:''}</div>`;
    h+=`<article class="qcard xq"><div class="qno">${XKAN[X.qi]}<span class="xpts">（配点 ${full}点）</span></div><div class="qtext">${b.q}</div>`;
    b.subs.forEach((t,j)=>{ const v=s.ans[X.qi][j]||''; h+=`<div class="xsub"><div class="xsq">${t.q}<span class="xpts">（${t.pts}点）</span></div><textarea data-xa="${X.qi},${j}" aria-label="${esc(plain(t.q).slice(0,12))} 解答欄" placeholder="答案を記入（計算問題は計算過程も）">${esc(v)}</textarea><div class="xcnt" data-cnt="${X.qi},${j}">${v.length}字</div></div>`; });
    h+=`<div class="qnav"><button class="btn" data-act="x-go" data-d="-1" ${X.qi?'':'disabled'}>← 前の大問</button><button class="btn pri" data-act="x-go" data-d="1" ${X.qi<s.blocks.length-1?'':'disabled'}>次の大問 →</button></div></article>`;
    return h;
  },
  vModal(){
    const X=this.X; if(!X.modal) return ''; const s=this.sub();
    if(X.modal==='submit'){
      const left= X.type==='tanto' ? s.marks.filter(x=>x===null).length : s.ans.flat().filter(a=>!a.trim()).length;
      return `<div class="xmodal" role="dialog" aria-modal="true"><div><h3>${s.name}の解答を終了しますか？</h3><p>${left?`<b class="ng">未解答が ${left}${X.type==='tanto'?'問':'設問'}あります。</b>`:'すべて解答済みです。'}終了すると，この科目には戻れません。</p><div class="row"><button class="btn pri" data-act="x-submit-ok">終了して次へ</button><button class="btn" data-act="x-modal-close">解答に戻る</button></div></div></div>`;
    }
    if(X.modal==='quit') return `<div class="xmodal" role="dialog" aria-modal="true"><div><h3>模擬試験を中断しますか？</h3><p>中断すると${X.type==='ronbun'?'この回は':''}最初からやり直しとなり，${X.type==='ronbun'?'この回の答案は':'結果は'}保存されません。</p><div class="row"><button class="btn danger" data-act="x-quit-ok">中断する</button><button class="btn" data-act="x-modal-close">続ける</button></div></div></div>`;
    return '';
  },
  vResult(){
    const X=this.X, S=X.summary, typ=S.type==='tanto'?'短答式':'論文式';
    const pct=v=>Math.round(v*10)/10;
    let h=`<div class="xres"><button class="btn ghost" data-act="x-home">← ホーム</button><div class="xk" style="margin-top:8px">${typ} 模擬試験の結果　<span>${fmtD(S.date)}</span></div>
      <div class="xjudge"><div class="xprob"><span>合格可能性</span><b class="tnum">${Math.round(S.p*100)}<small>%</small></b><em class="rk rk-${S.rank}">${S.rank}判定・${S.label}</em></div>
      <div class="xtot"><span>総合点</span><b class="tnum">${pct(S.tot)}<small> / ${S.max}</small></b><em>得点率 ${pct(S.ratio*100)}%</em></div></div>
      ${S.cut?`<p class="warn">40%に届かない科目があります（足切りの対象となるおそれ）。</p>`:''}
      <table class="d xtbl"><tr><th>科目</th><th class="r">得点</th><th class="r">得点率</th>${S.type==='tanto'?'<th class="r">正答</th>':''}<th>時間</th></tr>${S.subs.map(s=>`<tr class="${s.score<s.max*0.4?'cut':''}"><td>${s.name}</td><td class="r">${pct(s.score)} / ${s.max}</td><td class="r">${pct(s.score/s.max*100)}%</td>${S.type==='tanto'?`<td class="r">${s.ok} / ${s.n}</td>`:''}<td>${s.used?Math.ceil(s.used/60000)+'分':''}${s.timeUp?'（時間切れ）':''}</td></tr>`).join('')}</table>
      <p class="xsmall">判定の目安：${S.type==='tanto'?'総点数の70%を合格ラインの基準とし，1科目でも40%未満は不合格となるおそれがあります（本試験の合格基準に準拠した推定）。':'得点比率52%を合格ラインの基準とし，1科目でも40%未満は不合格となるおそれがあります。本試験は偏差値による得点調整後の比率で判定されるため，この判定は素点からの推定です。'}${S.type==='ronbun'&&S.subs.some(s=>s.mode==='kw')?'一部の科目はClaudeによる採点が使えなかったため，キーワード照合による簡易採点です。':''}</p>
      <div class="row"><button class="btn pri" data-act="x-print" data-what="result">結果と解説を印刷</button><button class="btn" data-act="x-save" data-what="result">印刷用ファイルを保存</button></div>`;
    if(!X.details) return h+`<div class="xwait"><div class="xspin"></div><p class="lead">解説を読み込んでいます…</p></div></div>`;
    h+=`<h2 class="xh2">${S.type==='tanto'?'まちがえた問題の解説':'答案と講評・模範解答'}</h2>`;
    h+=this.review(S,X.details,false);
    return h+'</div>';
  },
  review(S,details,print){
    let h='';
    if(S.type==='tanto'){
      for(const d of details){
        const wrong=(d.items||[]).filter(it=>it.mark!==it.correct);
        h+=`<section class="xrv"><h3>${d.name}　<small>${wrong.length?`誤答・未解答 ${wrong.length}問`:'全問正解'}</small></h3>`;
        if(!print) h+=`<div class="xstrip">${(d.items||[]).map(it=>`<span class="${it.mark===it.correct?'o':'x'}">${it.no}</span>`).join('')}</div>`;
        for(const it of wrong){
          h+=`<div class="xitem"><div class="xih"><b>問題${it.no}</b><span class="tag">${esc(it.topic||'')}</span><span>あなたの解答：${it.mark===null||it.mark===undefined?'未解答':XNUM[it.mark]}</span><span class="okc">正答：${XNUM[it.correct]}</span><span>${it.pts}点</span></div>
            ${it.data?`<details${print?' open':''}><summary>共通資料</summary><div class="qtext">${it.data}</div></details>`:''}<div class="qtext">${it.html||''}</div>
            <ol class="xch">${(it.choices||[]).map((c,i)=>`<li class="${i===it.correct?'ok':i===it.mark?'ng':''}">${c}</li>`).join('')}</ol><div class="ex"><h4>解説</h4>${it.ex||''}</div></div>`;
        }
        h+='</section>';
      }
    } else {
      for(const d of details){
        const s=S.subs.find(x=>x.id===d.id)||{};
        h+=`<section class="xrv"><h3>${d.name}　<small>${Math.round((s.pct||0)*10)/10}%</small></h3>`;
        (d.blocks||[]).forEach((b,k)=>{
          const got=(b.grades||[]).reduce((a,g)=>a+g.score,0), full=b.subs.reduce((a,t)=>a+t.pts,0);
          h+=`<details class="xitem xfold"${print?' open':''}><summary class="xih"><b>${XKAN[k]}</b><span class="tag">${esc(b.t)}</span><span class="okc">${got} / ${full}点</span><span class="xopen">答案・講評・模範解答</span></summary><details${print?' open':''}><summary>問題文</summary><div class="qtext">${b.q}</div></details>`;
          b.subs.forEach((t,j)=>{ const g=(b.grades||[])[j]||{score:0,fb:''};
            h+=`<div class="xsubr"><div class="xsq">${t.q}</div><div class="xsc ${g.score>=t.pts*0.6?'ok':'ng'}">${g.score} / ${t.pts}点</div>
              <div class="xans"><h4>あなたの答案</h4><div class="model">${esc((b.ans&&b.ans[j])||'（空欄）')}</div></div>${g.fb?`<p class="xfb"><b>講評</b>　${esc(g.fb)}</p>`:''}
              <div class="ex"><h4>模範解答</h4><div class="model">${esc(t.model)}</div>${t.ex?`<h4 style="margin-top:8px">採点のポイント</h4><p>${esc(t.ex)}</p>`:''}</div></div>`; });
          h+='</details>';
        });
        h+='</section>';
      }
    }
    return h;
  },

  /* --- 印刷 --- */
  cover(kind,s,extra){
    const t= kind==='tanto'?'短答式試験':'論文式試験';
    const notes= kind==='tanto'
      ? ['試験開始の合図があるまで，この問題冊子を開いてはいけません。','解答は，別紙の答案用紙（マークシート）の該当欄に，正答と思われる番号を一つだけマークしなさい。','各問題の配点は，問題番号の右に示しています。','問題冊子の余白は，計算等に使用して差し支えありません。','電卓の使用は認めますが，関数電卓等の使用はできません。']
      : ['試験開始の合図があるまで，この問題冊子を開いてはいけません。','答案は，別紙の答案用紙の所定の欄に記入しなさい。','計算問題は，計算過程も記入しなさい。','各問の配点は，問題文中に示しています。',s.id==='law'||s.id==='tax'?'法令基準集（会社法・税法等）を参照して差し支えありません。':'問題冊子の余白は，計算等に使用して差し支えありません。'];
    return `<section class="pg p-cover"><div class="p-top">公認会計士試験（模擬）</div><div class="p-t">${t}</div><div class="p-subj">${s.name}</div>

  docBook(){
    const X=this.X, s=this.sub();

      let h=this.cover('tanto',s,`${s.qs.length}問・${s.pts}点`)+'<section class="pg">';
      let lastG=-1;
      s.qs.forEach(q=>{
        if(q.sogo&&q.sogo.g!==lastG){ lastG=q.sogo.g; const grp=s.qs.filter(x=>x.sogo&&x.sogo.g===q.sogo.g); h+=`<div class="p-sogo"><p class="p-sogo-h">問題${grp[0].no}から問題${grp[grp.length-1].no}までは，次の〔資料〕に基づいて解答しなさい。</p>${q.sogo.data}</div>`; }
        h+=`<div class="p-q"><div class="p-qh">問題 ${q.no}<span>（${q.pts}点）</span></div><div class="p-qt">${q.html}</div><ol class="p-ch">${q.choices.map(c=>`<li>${c}</li>`).join('')}</ol></div>`;

  },
  docSheet(filled){
    const X=this.X, s=this.sub();
    if(X.type==='tanto'){
      const rows=s.qs.map((q,i)=>`<tr><th>${q.no}</th>${[0,1,2,3,4,5].map(k=>`<td><span class="bub${filled&&s.marks[i]===k?' f':''}">${k+1}</span></td>`).join('')}</tr>`);
      const half=Math.ceil(rows.length/2);
      const tb=r=>`<table class="p-mark"><tr><th>解答<br>番号</th>${[1,2,3,4,5,6].map(k=>`<th>${k}</th>`).join('')}</tr>${r.join('')}</table>`;
      return `<section class="pg p-sheet"><div class="p-sh"><div><b>答案用紙（マークシート）</b><span>短答式試験　${s.name}</span></div><div class="p-id sm"><div><span>受験番号</span><i></i></div><div><span>氏名</span><i></i></div></div></div>
        <p class="p-hint">マーク例　良い例：<span class="bub f">1</span>　HBの鉛筆で，○の中を塗りつぶすこと。</p><div class="p-cols">${tb(rows.slice(0,half))}${tb(rows.slice(half))}</div></section>`;
    }
    let h=`<section class="pg p-sheet"><div class="p-sh"><div><b>答案用紙</b><span>論文式試験　${s.name}</span></div><div class="p-id sm"><div><span>受験番号</span><i></i></div><div><span>氏名</span><i></i></div></div></div>`;
    s.blocks.forEach((b,k)=>{ b.subs.forEach((t,j)=>{ const txt=filled?(s.ans[k][j]||''):''; const n=Math.max(8,Math.min(26,Math.round(t.pts*1.6)));
      h+=`<div class="p-ans"><div class="p-ah">${XKAN[k]}　${(plain(t.q).match(/^問\s*\d+/)||['問'+(j+1)])[0]}</div>${txt?`<div class="p-fill">${esc(txt)}</div>`:`<div class="p-lines">${'<i></i>'.repeat(n)}</div>`}</div>`; }); });
    return h+'</section>';
  },
  docResult(){
    const S=this.X.summary, typ=S.type==='tanto'?'短答式':'論文式'; const pct=v=>Math.round(v*10)/10;
    return `<section class="pg"><div class="p-top">公認会計士試験（模擬）　${typ}　成績表</div><div class="p-t" style="font-size:20pt">${fmtD(S.date)} 実施</div>
      <table class="p-score"><tr><th>合格可能性</th><td>${Math.round(S.p*100)}%（${S.rank}判定・${S.label}）</td></tr><tr><th>総合点</th><td>${pct(S.tot)} / ${S.max}（${pct(S.ratio*100)}%）</td></tr></table>
      <table class="p-score"><tr><th>科目</th><th>得点</th><th>得点率</th></tr>${S.subs.map(s=>`<tr><td>${s.name}</td><td>${pct(s.score)} / ${s.max}</td><td>${pct(s.score/s.max*100)}%${s.score<s.max*0.4?'（40%未満）':''}</td></tr>`).join('')}</table>
      <div class="p-review">${this.X.details?this.review(S,this.X.details,true):''}</div></section>`;

  docFor(what){
    if(what==='book') return {title:`${this.sub().name}_問題冊子`,html:this.docBook()};
    if(what==='sheet') return {title:`${this.sub().name}_答案用紙`,html:this.docSheet(false)};
    return {title:`模擬試験結果_${fmtD(this.X.summary.date).replace(/[\/: ]/g,'')}`,html:this.docResult()};

  print(what){

body{margin:0;background:#E9E9E4}.pbar-f{position:sticky;top:0;background:#222;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;font:14px sans-serif}.pbar-f button{font:inherit;padding:6px 14px;border-radius:6px;border:0;background:#E6A646;color:#1A1204;font-weight:700;cursor:pointer}

  /* --- 操作 --- */
  onClick(b,a){

    if(a==='x-start-ronbun') return this.startRonbun();
    if(a==='x-reset-ronbun'){ const rb=Store.data.ronbun; if(rb) RONBUN.flat().forEach(t=>Vault.drop(`${rb.id}_${t.id}`)); Store.data.ronbun=null; Store.save(); App.render(); this.toast('論文式の進行状況をリセットしました。'); return; }
    if(a==='x-hist') return this.openHist(b.dataset.id);
    if(a==='x-home'){ if(X&&X.phase==='intro'){ this.X=null; } App.go('home'); return; }
    if(a==='x-toast-close'){ const el=document.getElementById('xtoast'); if(el) el.classList.remove('show'); return; }
    if(a==='x-print') return this.print(b.dataset.what);

    if(!X) return;
    if(a==='x-begin') return this.begin();
    if(a==='x-quit'){ this.pullDraft(); X.modal='quit'; App.render(); return; }
    if(a==='x-quit-ok') return this.quit();
    if(a==='x-modal-close'){ X.modal=null; App.render(); return; }
    if(a==='x-submit'){ this.pullDraft(); X.modal='submit'; App.render(); return; }
    if(a==='x-submit-ok') return this.endSubject(false);
    const s=this.sub(); if(X.phase!=='run'||!s) return;
    if(a==='x-mark'){ const i=+b.dataset.i; s.marks[X.qi]= s.marks[X.qi]===i?null:i; App.render(); return; }
    if(a==='x-flag'){ s.flags[X.qi]=!s.flags[X.qi]; App.render(); return; }
    if(a==='x-go'||a==='x-jump'){ this.pullDraft(); const n=(s.qs||s.blocks).length; X.qi= a==='x-go' ? Math.max(0,Math.min(n-1,X.qi+(+b.dataset.d))) : +b.dataset.i; App.render(); window.scrollTo(0,0); return; }
  },
  onKey(e){
    const X=this.X; if(!X||X.phase!=='run'||X.type!=='tanto'||X.modal) return;
    if(e.target.tagName==='TEXTAREA'||e.metaKey||e.ctrlKey||e.altKey) return;
    const s=this.sub();
    if(/^[1-6]$/.test(e.key)){ const i=+e.key-1; s.marks[X.qi]= s.marks[X.qi]===i?null:i; App.render(); }
    else if(e.key==='ArrowRight'&&X.qi<s.qs.length-1){ X.qi++; App.render(); }
    else if(e.key==='ArrowLeft'&&X.qi>0){ X.qi--; App.render(); }
    else if(e.key==='f'||e.key==='F'){ s.flags[X.qi]=!s.flags[X.qi]; App.render(); }
  },
};

function reasonPrompt(q,choice,reason){
  const stem=plain(q.html.split('<ul')[0]);
  const lines=q.st.map((x,i)=>`${KANA[i]}：${x.s}\n　→ 正解：${x.ok?'○（正しい）':'×（誤り）'}${x.ok?'':'。根拠：'+x.why}`).join('\n');
  return `あなたは公認会計士試験の採点者です。短答式の組合せ問題で，受験生が選択肢を選び，その理由を書きました。理由の内容が正しいかを判定してください。
【判定基準】
- 受験生が述べた根拠が，下の正解データとニュアンスとして一致していれば ok=true とする（言い回しの違いや簡潔な表現は許容する。すべての肢に触れていなくてもよい）。
- 述べた根拠に誤り（事実に反する内容，○の肢を誤りとする根拠，×の肢を正しいとする根拠）が含まれる場合は ok=false とする。
- 肢の正誤や根拠に触れていない，意味のない文字列，問題文の書き写しだけの場合は ok=false とする。
- 選んだ番号の正誤とは切り離し，理由の中身だけで判定する。
【問題】${stem}
${lines}
【正答】${q.choices[q.correct]}
【受験生の選択】${q.choices[choice]}
【受験生の理由】${reason}
次のJSONだけを返してください：{"ok": true または false, "feedback": "日本語120字以内の講評（良い点とずれている点）"}`;
}
function essayPrompt(q,ans){
  return `あなたは公認会計士試験（租税法）の採点者です。模範解答と比べて受験生の解答を採点してください。計算問題は最終数値と主要な計算過程，理論問題は要点が押さえられているかを重視し，表現の違いは許容します。
【問題】${q.q}
【模範解答】${q.model}
【受験生の解答】${ans||'（空欄）'}
次のJSONだけを返してください：{"grade": "○" または "△" または "×", "feedback": "日本語150字以内の講評"}`;
}

function poolFor(fieldIds, topicIds){
  const o=Store.data.opts;
  return BANK.filter(it=>fieldIds.includes(it.f) && (!topicIds||topicIds.includes(it.id)) && (o.rank==='AB'||it.r==='A'||topicIds) && (o.adv||!it.adv||topicIds));
}
function pickItems(pool,count,order){
  if(!pool.length) return [];
  const st=Store.data.stats; let list;
  if(order==='weak'){
    const score=it=>{const s=st[it.id]; if(!s) return -1+Math.random()*0.1; return s.c/s.n + (s.last===0?-0.5:0) + Math.random()*0.15;};
    list=pool.slice().sort((a,b)=>score(a)-score(b));
  } else list=R.shuffle(pool);
  const n=count==='all'?pool.length:count; const out=[];
  while(out.length<n){ out.push(...list.slice(0,n-out.length)); list=R.shuffle(pool); }
  return out;
}

const App={
  view:'home', sess:null, pickField:null, picked:new Set(),
  syncLabel(){ const el=$('#sync'); if(el) el.textContent= Store.mode==='account'?'成績はアカウントに保存':'成績はこの端末に保存'; },
  go(v){ this.view=v; this.render(); window.scrollTo(0,0); },
  render(){
    try{ document.documentElement.dataset.skin='night'; }catch(e){}
    const m=$('#main');
    if(this.view==='home') m.innerHTML=this.home();
    else if(this.view==='pick') m.innerHTML=this.pick();
    else if(this.view==='quiz') m.innerHTML=this.quiz();
    else if(this.view==='result') m.innerHTML=this.result();
    else if(this.view==='exam') m.innerHTML=Exam.render();
    if(this.view!=='exam') document.body.classList.remove('in-exam');
    this.syncLabel();
  },
  fieldStats(fid){
    const items=BANK.filter(i=>i.f===fid); let n=0,c=0,wrong=0;
    items.forEach(i=>{const s=Store.data.stats[i.id]; if(s){n+=s.n;c+=s.c; if(s.last===0)wrong++;}});
    return {items:items.length,n,c,wrong,rate:n?Math.round(c/n*100):null};
  },
  seg(key,vals){ const o=Store.data.opts; return `<div class="seg" role="group">${vals.map(([v,l])=>`<button data-act="opt" data-k="${key}" data-v="${v}" aria-pressed="${String(o[key])===String(v)}">${l}</button>`).join('')}</div>`; },
  home(){
    const tot=BANK.length;
    let h=Exam.homeCard()+`<h1 style="font-size:26px">科目別 1問1答</h1><p class="lead">短答式の過去問形式で解く演習帳です。計算問題は解くたびに数字と条件が変わり，理論問題は肢の内容（数値・語句）や問い方（正しいもの／誤っているもの）が毎回入れ替わる組合せ6択で，理由を書いてから解答します。収録 ${tot}論点。</p>
    <div class="opts">
      <div class="opt"><label>出題数</label>${this.seg('count',[[5,'5問'],[10,'10問'],[20,'20問'],['all','全論点']])}</div>
      <div class="opt"><label>重要度</label>${this.seg('rank',[['A','Aのみ'],['AB','A＋B']])}</div>
      <div class="opt"><label>応用問題</label>${this.seg('adv',[[true,'含める'],[false,'除く']])}</div>
      <div class="opt"><label>出題順</label>${this.seg('order',[['random','ランダム'],['weak','苦手優先']])}</div>
    </div>
    <div class="row" style="margin-bottom:22px"><button class="btn pri" data-act="mix">全科目ミックスで解く</button><button class="btn" data-act="allwrong">前回まちがえた問題だけ（全科目）</button></div>
    <div class="note">理論問題は，選んだ理由を書いてから解答します。理由はClaudeが解説と照らして採点します（使えない環境では自己判定）。番号と理由の両方が合って正解です。肢の組合せ・問い方（正しいもの／誤っているもの）・数値は解くたびに変わり，各分野の「総合問題」では複数論点がまざります。リースは新リース会計基準（企業会計基準第34号），租税法は論文式を想定した独自問題です。</div>`;
    for(const s of SUBJECTS){
      h+=`<section class="subj"><div class="subj-h"><h2>${s.name}</h2></div><div class="fields">`;
      for(const f of s.fields){
        const st=this.fieldStats(f.id);
        const kind=f.kind==='calc'?'計算 6択':f.kind==='theory'?'理論 組合せ6択':'記述';
        h+=`<div class="field"><div><span class="nm">${f.name}</span> <span class="tag">${kind}</span></div>
          <div class="acts"><button class="btn pri" data-act="start" data-f="${f.id}">解く</button><button class="btn" data-act="pick" data-f="${f.id}">論点を選ぶ</button>${st.wrong?`<button class="btn" data-act="wrong" data-f="${f.id}">復習 ${st.wrong}</button>`:''}</div>
          <div class="st"><span>${st.items}論点</span><span>解答 ${st.n}回</span><span>正答率 ${st.rate===null?'—':st.rate+'%'}</span></div>
          <div class="meter"><b style="width:${st.rate||0}%"></b></div></div>`;
      }
      h+='</div></section>';
    }
    return h;
  },
  pick(){
    const f=FIELD[this.pickField]; const items=BANK.filter(i=>i.f===f.id).sort((a,b)=>chNo(a.ch)-chNo(b.ch));
    const groups={}; items.forEach(i=>{(groups[i.ch]=groups[i.ch]||[]).push(i);});
    let h=`<button class="btn ghost" data-act="home">← 科目一覧</button><h2 style="margin:10px 0 4px">${f.subj.name}　${f.name}</h2><p class="lead">解きたい論点を選んでください（重要度・応用の設定より優先されます）。</p>
    <div class="row" style="margin:10px 0"><button class="btn" data-act="pickall">すべて選択</button><button class="btn" data-act="picknone">選択を解除</button><button class="btn pri" data-act="startpick" ${this.picked.size?'':'disabled'}>選んだ論点で解く（${this.picked.size}）</button></div>`;
    for(const ch in groups){
      h+=`<h3 style="font-size:15px;margin-top:14px">${ch}</h3><div class="chips">`+groups[ch].map(i=>{const s=Store.data.stats[i.id]; const r=s?Math.round(s.c/s.n*100)+'%':'未'; return `<button data-act="toggle" data-id="${i.id}" aria-pressed="${this.picked.has(i.id)}"><span class="tag ${i.r==='A'?'a':''}">${i.r}</span> ${i.t}${i.adv?' <span class="tag adv">応用</span>':''}<small>${r}</small></button>`;}).join('')+'</div>';
    }
    return h;
  },
  start(items,label){
    if(!items.length){ this.sess=null; $('#main').innerHTML=`<div class="empty">条件に合う問題がありません。重要度や応用の設定を見直してください。<div style="margin-top:12px"><button class="btn" data-act="home">戻る</button></div></div>`; return; }
    this.sess={label,items,i:0,log:[],q:null,ans:null};
    this.next(true);
  },
  next(first){
    const s=this.sess; if(!first) s.i++;
    if(s.i>=s.items.length){ this.go('result'); return; }
    const it=s.items[s.i]; s.q= it.kind==='essay'?buildEssay(it):buildQ(it); s.ans=null; s.draft=''; s.reason=''; s.warn=false; s.rv=null; s.ai=null;
    this.go('quiz');
  },
  again(){ const s=this.sess; const it=s.items[s.i]; s.q= it.kind==='essay'?buildEssay(it):buildQ(it); s.ans=null; s.draft=''; s.reason=''; s.warn=false; s.rv=null; s.ai=null; this.render(); },
  quiz(){
    const s=this.sess, q=s.q, it=q.item, f=FIELD[it.f];
    let h=`<div class="qhead"><button class="btn ghost" data-act="quit">中断</button><span class="prog">${s.i+1} / ${s.items.length}</span><span>${f.subj.name}・${f.name}</span></div>
    <div class="pbar"><b style="width:${(s.i)/s.items.length*100}%"></b></div>
    <article class="qcard"><div class="qgrid"><div class="qmain"><div class="row" style="gap:6px;margin-bottom:6px"><span class="tag ${it.r==='A'?'a':''}">重要度${it.r}</span>${it.adv?'<span class="tag adv">応用</span>':''}<span class="tag">${esc(it.ch)}</span></div>
    <div class="qno">問${s.i+1}　${esc(it.t)}</div>`;
    h+= q.kind==='essay' ? `<div class="qtext model">${esc(q.q)}</div>` : `<div class="qtext">${q.html}</div>`;
    h+='</div><div class="qside">';
    if(q.kind==='essay'){
      h+=`<div class="sheet"><div class="sheet-l">解答欄（文章・計算過程を入力）</div><textarea id="essay" aria-label="解答欄" placeholder="ここに解答を書く">${esc(s.draft||'')}</textarea></div>`;
      if(s.ans===null){ h+=`<div class="qnav"><span></span><button class="btn pri" data-act="reveal">模範解答を見る</button></div>`; }
      else {
        const txt=s.draft||''; const hits=q.kw.map(k=>({k,hit:txt.replace(/[,，\s]/g,'').includes(k.replace(/[,，\s]/g,''))}));
        h+=`<div class="ex"><h4>模範解答</h4><div class="model">${esc(q.model)}</div><h4 style="margin-top:10px">キーワード（${hits.filter(x=>x.hit).length}/${hits.length}）</h4><div class="kw">${hits.map(x=>`<span class="${x.hit?'hit':''}">${esc(x.k)}</span>`).join('')}</div></div>`;
        if(s.ai) h+=`<div class="ex"><h4>AI採点</h4><p><b style="font-size:18px">${esc(s.ai.grade)}</b>　${esc(s.ai.feedback||'')}</p></div>`;
        if(s.ans==='open' && AI.state==='ready' && !s.ai) h+=`<div class="qnav"><span></span><button class="btn pri" data-act="aigrade" ${s.aiBusy?'disabled':''}>${s.aiBusy?'採点中…':'AIで採点する'}</button></div>`;
        if(s.ans==='open') h+=`<div class="qnav"><span>${s.ai?'採点を確定：':'自己採点：'}</span><div class="row"><button class="btn" data-act="grade" data-v="1">○ 書けた</button><button class="btn" data-act="grade" data-v="0.5">△ 一部</button><button class="btn" data-act="grade" data-v="0">× 書けない</button></div></div>`;
        else h+=this.nav(it);
      }
    } else {
      if(q.kind==='theory') h+=`<div class="sheet"><div class="sheet-l">理由（必須）</div><textarea id="reason" class="reason" aria-label="解答の理由" placeholder="例：ウは貸手の区分が維持されているので誤り。エは短期リースに購入オプション付きは含まれないので誤り。" ${s.ans!==null?'readonly':''}>${esc(s.reason||'')}</textarea>${s.warn?`<p class="warn" role="alert">理由が書かれていません。正誤に関係なく，選んだ理由（各肢の正誤の根拠）を書いてから，もう一度解答してください。</p>`:''}</div>`;
      h+=`<div class="sheet"><div class="sheet-l">解答欄</div><div class="choices">`+
        q.choices.map((c,i)=>{ let cls='ch'; if(s.ans!==null){ if(i===q.correct)cls+=' right'; else if(i===s.ans)cls+=' wrong'; if(i===s.ans)cls+=' sel'; }
          return `<button class="${cls}" data-act="ans" data-i="${i}" ${s.ans!==null?'disabled':''}><span class="ov">${i+1}</span><span class="tx">${c}</span></button>`; }).join('')+`</div></div>`;
      if(s.ans!==null && q.kind==='calc'){ const ok=s.ans===q.correct;
        h+=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}<span style="font-size:14px;font-family:var(--f-body);font-weight:400;color:var(--ink2)">正答は ${ORD[q.correct]}</span></div><div class="ex"><h4>解説</h4>${q.ex}</div>`+this.nav(it); }
      if(s.ans!==null && q.kind==='theory'){ const ok=s.ans===q.correct; const rv=s.rv||{};
        let rline='';
        if(rv.status==='checking') rline=`<div class="rv">理由を採点しています…</div>`;
        else if(rv.status==='self') rline=`<div class="rv"><span>理由の判定：解説と見比べて選んでください</span><div class="row"><button class="btn" data-act="selfr" data-v="1">理由は合っていた</button><button class="btn" data-act="selfr" data-v="0">理由がずれていた</button></div></div>`;
        else if(rv.status==='done') rline=`<div class="rv ${rv.ok?'ok':'ng'}"><b>理由：${rv.ok?'○ 妥当':'× 不十分'}</b>${rv.fb?`<span>${esc(rv.fb)}</span>`:''}</div>`;
        const fin= rv.status==='done' ? (ok&&rv.ok) : null;
        h+=`<div class="verdict ${fin===null?(ok?'ok':'ng'):(fin?'ok':'ng')}">${fin===null?(ok?'番号は正解':'番号は不正解'):(fin?'正解（番号・理由とも）':(ok?'番号は正解・理由が不十分':'不正解'))}<span style="font-size:14px;font-family:var(--f-body);font-weight:400;color:var(--ink2)">正答は ${ORD[q.correct]}</span></div>${rline}<div class="ex"><h4>解説</h4>${q.ex}</div>`+(rv.status==='done'?this.nav(it):''); }
    }
    h+=`<p class="kbd-hint"><kbd>1</kbd>〜<kbd>6</kbd> 解答　<kbd>Enter</kbd> 次へ　<kbd>R</kbd> ${it.kind==='calc'?'数字を変える':'別の問題'}　<kbd>Esc</kbd> 入力欄から抜ける　<kbd>⌘</kbd>+<kbd>Enter</kbd> 理由を書き終えて解答欄へ</p>`;
    return h+'</div></div></article>';
  },
  async gradeReason(){
    const s=this.sess, q=s.q, choice=s.ans;
    if(AI.state!=='ready'){ s.rv={status:'self'}; this.render(); return; }
    try{ const r=await AI.json(reasonPrompt(q,choice,s.reason)); if(this.sess!==s||s.q!==q) return; this.finishTheory(!!(r&&r.ok===true), r&&r.feedback?String(r.feedback):''); }
    catch(e){ if(this.sess!==s||s.q!==q) return; s.rv={status:'self'}; this.render(); }
  },
  finishTheory(reasonOk,fb){ const s=this.sess; if(!s||!s.rv||s.rv.status==='done') return; const ok=s.ans===s.q.correct&&reasonOk; s.rv={status:'done',ok:reasonOk,fb}; Store.rec(s.q.item.id,ok); s.log.push({id:s.q.item.id,v:ok?1:0}); this.render(); },
  async gradeEssay(){
    const s=this.sess, q=s.q; if(s.aiBusy) return; s.aiBusy=true; this.render();
    try{ const r=await AI.json(essayPrompt(q,s.draft)); if(this.sess!==s||s.q!==q) return; const g=['○','△','×'].includes(r&&r.grade)?r.grade:'△'; s.ai={grade:g,feedback:r&&r.feedback?String(r.feedback):''}; }
    catch(e){ if(this.sess===s) s.ai={grade:'—',feedback:'AI採点を利用できませんでした。模範解答と見比べて自己採点してください。'}; }
    s.aiBusy=false; if(this.sess===s) this.render();
  },
  nav(it){ return `<div class="qnav"><button class="btn" data-act="again">${it.kind==='calc'?'数字を変えてもう一問':it.kind==='theory'?'同じ論点で別の組合せ':'同じ論点をもう一度'}</button><button class="btn pri" data-act="next">${this.sess.i+1<this.sess.items.length?'次の問題へ':'結果を見る'}</button></div>`; },
  result(){
    const s=this.sess; const tot=s.log.length; const pts=s.log.reduce((a,b)=>a+b.v,0);
    const wrongIds=[...new Set(s.log.filter(x=>x.v<1).map(x=>x.id))];
    let h=`<h2>${esc(s.label)}　結果</h2><div class="score"><b class="tnum">${Math.round(pts*10)/10}</b><span>/ ${tot} 問正解</span></div><ul class="rlist">`+
      s.log.map((x,i)=>`<li><span class="${x.v>=1?'o':'x'}">${x.v>=1?'○':x.v>0?'△':'×'}</span><span>${esc(BYID[x.id].t)}</span><span class="t">${esc(FIELD[BYID[x.id].f].subj.name)}</span></li>`).join('')+'</ul>';
    h+=`<div class="row">${wrongIds.length?`<button class="btn pri" data-act="retry">まちがえた${wrongIds.length}論点をもう一度</button>`:''}<button class="btn" data-act="home">科目一覧へ</button></div>`;
    this._wrong=wrongIds; return h;
  },
  onClick(e){
    const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; const o=Store.data.opts;
    if(a.startsWith('x-')){ Exam.onClick(b,a); return; }
    if(a==='home' && this.view==='exam' && Exam.X){ if(Exam.active()&&Exam.X.phase!=='intro'){ if(Exam.X.phase!=='grading'){ Exam.pullDraft(); Exam.X.modal='quit'; this.render(); } return; } Exam.X=null; }
    if(a==='opt'){ let v=b.dataset.v; if(v==='true')v=true; else if(v==='false')v=false; else if(/^\d+$/.test(v))v=+v; o[b.dataset.k]=v; Store.save(); this.render(); }
    else if(a==='home'||a==='quit'){ this.go('home'); }
    else if(a==='start'){ const f=b.dataset.f; this.start(pickItems(poolFor([f]),o.count,o.order),FIELD[f].subj.name+'・'+FIELD[f].name); }
    else if(a==='mix'){ const fs=Object.keys(FIELD); this.start(pickItems(poolFor(fs),o.count,o.order),'全科目ミックス'); }
    else if(a==='wrong'||a==='allwrong'){ const fs=a==='wrong'?[b.dataset.f]:Object.keys(FIELD); const ids=BANK.filter(i=>fs.includes(i.f)&&Store.data.stats[i.id]&&Store.data.stats[i.id].last===0); this.start(R.shuffle(ids),'復習'); }
    else if(a==='pick'){ this.pickField=b.dataset.f; this.picked=new Set(); this.go('pick'); }
    else if(a==='toggle'){ const id=b.dataset.id; this.picked.has(id)?this.picked.delete(id):this.picked.add(id); this.render(); }
    else if(a==='pickall'){ BANK.filter(i=>i.f===this.pickField).forEach(i=>this.picked.add(i.id)); this.render(); }
    else if(a==='picknone'){ this.picked.clear(); this.render(); }
    else if(a==='startpick'){ const ids=[...this.picked]; const n=o.count==='all'?ids.length:Math.max(o.count,0); this.start(pickItems(BANK.filter(i=>this.picked.has(i.id)),n,o.order),FIELD[this.pickField].name+'（論点指定）'); }
    else if(a==='ans'){ const s=this.sess; if(s.ans!==null) return;
      if(s.q.kind==='theory'){ const t=$('#reason'); s.reason=t?t.value:s.reason; if((s.reason||'').replace(/\s/g,'').length<6){ s.warn=true; this.render(); const r=$('#reason'); if(r) r.focus(); return; }
        s.warn=false; s.ans=+b.dataset.i; s.rv={status:'checking'}; this.render(); this.gradeReason(); return; }
      s.ans=+b.dataset.i; const ok=s.ans===s.q.correct; Store.rec(s.q.item.id,ok); s.log.push({id:s.q.item.id,v:ok?1:0}); this.render(); }
    else if(a==='selfr'){ this.finishTheory(b.dataset.v==='1',''); }
    else if(a==='aigrade'){ this.gradeEssay(); }
    else if(a==='reveal'){ const t=$('#essay'); this.sess.draft=t?t.value:''; this.sess.ans='open'; this.render(); }
    else if(a==='grade'){ const s=this.sess; const v=+b.dataset.v; Store.rec(s.q.item.id,v>=1); s.log.push({id:s.q.item.id,v}); s.ans='done'; this.render(); }
    else if(a==='next'){ this.next(); }
    else if(a==='again'){ this.again(); }
    else if(a==='retry'){ this.start(R.shuffle(this._wrong.map(id=>BYID[id])),'まちがえた論点'); }
  },
  onKey(e){
    if(this.view==='exam'){ Exam.onKey(e); return; }
    if(this.view!=='quiz'||!this.sess) return; const s=this.sess;
    const inText=e.target.tagName==='TEXTAREA';
    if(inText){
      if(e.key==='Escape'){ e.target.blur(); e.preventDefault(); }
      else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); if(e.target.id==='essay'&&s.ans===null){ const b=document.querySelector('[data-act="reveal"]'); if(b) b.click(); } else { e.target.blur(); const c=document.querySelector('.ch:not([disabled])'); if(c) c.focus(); } }
      return;
    }
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(s.q.kind!=='essay' && s.ans===null && /^[1-6]$/.test(e.key)){ const btn=document.querySelector(`[data-act="ans"][data-i="${+e.key-1}"]`); if(btn) btn.click(); }
    else if(e.key==='Enter' && s.ans!==null && s.ans!=='open' && !(s.q.kind==='theory'&&(!s.rv||s.rv.status!=='done')) && !(e.target.tagName==='BUTTON'&&e.target.dataset.act!=='next')){ e.preventDefault(); this.next(); }
    else if((e.key==='r'||e.key==='R') && s.ans!==null && s.ans!=='open' && !(s.q.kind==='theory'&&(!s.rv||s.rv.status!=='done'))){ this.again(); }
  },
};
document.addEventListener('click',e=>App.onClick(e));
document.addEventListener('keydown',e=>App.onKey(e));
document.addEventListener('input',e=>{ if(!App.sess) return; if(e.target.id==='essay') App.sess.draft=e.target.value; if(e.target.id==='reason'){ App.sess.reason=e.target.value; if(App.sess.warn&&e.target.value.trim()){ App.sess.warn=false; const w=document.querySelector('.warn'); if(w) w.remove(); } } });
Store.load(); App.render(); Store.connect(); AI.init();

</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
