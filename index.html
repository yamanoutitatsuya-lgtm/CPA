C({id:'q-lease-mod',f:FA,ch:LCH,t:'借手：契約条件の変更（リース料単価の増額・契約期間の延長）',r:'B',adv:true,g(){
  const n=R.int(4,6), r1=R.pick([3,4,5]), r2=r1+R.pick([-1,1]), P=R.int(10,60)*10000, mode=R.pick(['price','extend']);
  const f1=pvA(r1,n), L0=rd(P*f1), int1=rd(L0*r1/100), L1=L0+int1-P, dep=rd(L0/n), rem=n-1;
  const e=R.int(1,2), P2= mode==='price'? P+R.int(1,6)*10000 : P, m= mode==='price'? rem : rem+e;
  const fN=pvA(r2,m), fO=pvA(r1,m), newL=rd(P2*fN), adj=newL-L1, ROU=L0-dep+adj;
  const ask=R.pick(['×2年4月1日におけるリース負債の修正額','契約条件変更後の使用権資産（減価償却累計額控除後）','契約条件変更後のリース負債']);
  let a,w,neg=false;
  if(ask.includes('修正額')){ a=adj; neg=true; w=nz([rd(P2*fO)-L1,newL-L0,rd((P2-P)*fN),P2*m-P*rem,newL-(L0-P)]); }
  else if(ask.includes('使用権資産')){ a=ROU; w=[L0+adj,L0-dep,L0-dep+rd(P2*fO)-L1,newL,newL-dep]; }
  else { a=newL; w=[rd(P2*fO),L1,L1+(P2-P)*rem+(mode==='extend'?P*e:0),L0+adj,newL+int1]; }
  const chg= mode==='price'? `残り${rem}年間の年額リース料を${Y(P2)}円に増額すること` : `契約期間を${e}年延長すること（リース料の年額は変わらない）`;
  return {q:P_(`${LEASE_PRE}×1年4月1日に機械のリース（借手のリース期間${n}年，毎年3月末に${Y(P)}円を後払い，所有権移転条項・購入オプションなし）を開始した。追加借入利子率は，×1年4月1日が年${r1}%，×2年4月1日が年${r2}%であり，貸手の計算利子率は知り得ない。×2年4月1日に，貸手との間で${chg}に合意した。原資産の追加はなく，契約条件の変更に伴い変更後の割引率を使用する。使用権資産は定額法により償却する。年金現価係数：${r1}%・${n}年${F4(f1)}，${m!==n?`${r1}%・${m}年${F4(fO)}，`:''}${r2}%・${m}年${F4(fN)}。${ask}はいくらか${neg?'（減少の場合は△）':''}。${LRND}`),
    a,u:'円',w,neg,
    ex:`当初：リース負債＝${Y(P)}×${F4(f1)}＝${Y(L0)}（＝使用権資産）<br>×2年3月末：利息${Y(int1)}，リース負債${Y(L1)}，減価償却費${Y(L0)}÷${n}＝${Y(dep)}<br>${mode==='price'?'リース料単価の増額':'契約期間の延長'}は，原資産を追加する範囲の拡大にも範囲の縮小にも該当しない変更 → 変更後の条件でリース負債を修正し，修正額を使用権資産に加減する。<br>修正後リース負債＝${Y(P2)}×${F4(fN)}（変更後の割引率${r2}%・${m}年）＝${Y(newL)}<br>修正額＝${Y(newL)}－${Y(L1)}＝${yen(adj)}<br>変更後の使用権資産＝${Y(L0)}－${Y(dep)}${adj<0?'－'+Y(-adj):'＋'+Y(adj)}＝${Y(ROU)}<br>よって<b>${yen(a)}円</b>`};
}});

C({id:'q-lease-scope',f:FA,ch:LCH,t:'借手：契約条件の変更（リースの範囲の縮小）',r:'B',adv:true,g(){
  const n=R.int(4,6), r1=R.pick([3,4,5]), r2=r1+R.pick([-1,1]), P=R.int(20,90)*10000, t=R.int(1,2), k=R.pick([20,25,40,50]);
  const P2=P*(100-k)/100+R.int(1,4)*10000;
  const L0=rd(P*pvA(r1,n)), dep=rd(L0/n), sc=lsched(L0,r1,Array(t).fill(P)), Lt=sc.bal[t], ROUc=L0-dep*t;
  const liabDec=rd(Lt*k/100), rouDec=rd(ROUc*k/100), gain=liabDec-rouDec, rem=n-t;
  const fN=pvA(r2,rem), fO=pvA(r1,rem), newL=rd(P2*fN), adj2=newL-(Lt-liabDec), liabMod=newL-Lt, rouMod=-rouDec+adj2;
  const ask=R.pick(['契約条件変更時に認識される損益（損失の場合は△）','契約条件変更時のリース負債の修正額（減少の場合は△）','契約条件変更時の使用権資産の修正額（減少の場合は△）','契約条件変更後のリース負債']);
  let a,w,neg=true;
  if(ask.includes('損益')){ a=gain; w=[-gain,liabDec-rd(L0*k/100),Lt-ROUc,rd(Lt*(100-k)/100)-rd(ROUc*(100-k)/100),gain+adj2]; }
  else if(ask.includes('リース負債の修正額')){ a=liabMod; w=[-liabDec,adj2,rd(P2*fO)-Lt,newL-L0,liabMod-gain]; }
  else if(ask.includes('使用権資産の修正額')){ a=rouMod; w=[-rouDec,liabMod,-rd(L0*k/100)+adj2,-rouDec+rd(P2*fO)-(Lt-liabDec),rouMod+gain]; }
  else { a=newL; neg=false; w=[Lt-liabDec,rd(P2*fO),Lt,rd(P*fN),newL+gain]; }
  const d=`×${t+1}年4月1日`;
  return {q:P_(`${LEASE_PRE}×1年4月1日に事務所スペースの賃貸借契約（リースを含む）を締結した。借手のリース期間は${n}年，リース料は年額${Y(P)}円を毎年3月末に後払いする。${d}に，同日から事務所スペースを${k}%縮小し，残り${rem}年間のリース料を年額${Y(P2)}円とする変更に合意した。追加借入利子率は×1年4月1日が年${r1}%，${d}が年${r2}%（貸手の計算利子率は知り得ない）である。範囲の縮小には変更前の割引率を，リース料単価の変更には変更後の割引率を用いる。使用権資産は定額法で償却する。年金現価係数：${r1}%・${n}年${F4(pvA(r1,n))}，${r1}%・${rem}年${F4(fO)}，${r2}%・${rem}年${F4(fN)}。${ask}はいくらか。${LRND}`),
    a,u:'円',w,neg,
    ex:`当初リース負債＝${Y(P)}×${F4(pvA(r1,n))}＝${Y(L0)}，減価償却費${Y(dep)}/年<br>変更直前：リース負債${Y(Lt)}（利息法），使用権資産${Y(L0)}－${Y(dep)}×${t}＝${Y(ROUc)}<br>①範囲の縮小（変更前の割引率）：リース負債${Y(Lt)}×${k}%＝${Y(liabDec)}減少，使用権資産${Y(ROUc)}×${k}%＝${Y(rouDec)}減少，差額${yen(gain)}を損益に計上<br>②単価の変更（変更後の割引率）：${Y(P2)}×${F4(fN)}＝${Y(newL)}，修正額${Y(newL)}－${Y(Lt-liabDec)}＝${yen(adj2)}を使用権資産に加減<br>リース負債の修正額＝△${Y(liabDec)}${adj2<0?'－'+Y(-adj2):'＋'+Y(adj2)}＝${yen(liabMod)}<br>使用権資産の修正額＝△${Y(rouDec)}${adj2<0?'－'+Y(-adj2):'＋'+Y(adj2)}＝${yen(rouMod)}<br>よって<b>${yen(a)}円</b>`};
}});

C({id:'q-lease-reassess',f:FA,ch:LCH,t:'借手：契約条件の変更を伴わないリース期間の見直し',r:'B',adv:true,g(){
  const n=R.int(4,6), m=R.int(1,3), r1=R.pick([3,4,5]), r2=r1+R.pick([-1,1]), P=R.int(20,90)*10000, P2=P+R.int(0,3)*10000, ctrl=R.chance(0.7);
  const L0=rd(P*pvA(r1,n)), dep=rd(L0/n), sc=lsched(L0,r1,[P,P]), Lt=sc.bal[2], rem=n-2;
  const A1=pvA(r2,rem), A2=pvA(r2,rem+m), B1=pvA(r1,rem), B2=pvA(r1,rem+m);
  const newL=rd(P*A1+P2*(A2-A1)), adj=newL-Lt, oldR=rd(P*B1+P2*(B2-B1));
  const ask=R.pick(['リース負債','使用権資産の帳簿価額']);
  const L= ctrl?newL:Lt, U= ctrl? L0-2*dep+adj : L0-2*dep;
  const a= ask==='リース負債'?L:U;
  const w= ask==='リース負債'? [ctrl?Lt:newL, oldR, rd(P2*A2), L0, Lt+P2*m] : [ctrl?L0-2*dep:L0-2*dep+adj, L0+adj, newL, L0-2*dep+oldR-Lt, L0-dep];
  const ev= ctrl? '当社は新規事業のためのスタッフ増員を決定し，同じ建物に人員を集約することとした。この決定は当社の統制下にあり，延長オプションの行使判断に影響を与える重要な事象であるため，当社は延長オプションを行使することが合理的に確実になったと判断した'
    : '近隣の不動産賃料相場が大きく上昇し，延長期間のリース料が相対的に割安となった（借手の統制下にない市場動向の変化）。当社はこれ以外に延長に関する意思決定や重要な事象はない';
  return {q:P_(`${LEASE_PRE}×1年4月1日に建物の1フロアを賃借した（リースを含む）。解約不能期間は${n}年で，当社は解約不能期間終了時に${m}年間延長するオプションを有する。リース料は毎年3月末に後払いで，解約不能期間中は年額${Y(P)}円，延長期間中は年額${Y(P2)}円である。リース開始日には延長オプションの行使は合理的に確実ではないと判断し，借手のリース期間を${n}年とした。×3年3月31日に，${ev}。追加借入利子率は，×1年4月1日が年${r1}%，×3年3月31日が年${r2}%（見直しを行う場合は見直し時点の割引率を用いる）。使用権資産は定額法で償却する。年金現価係数：${r1}%・${n}年${F4(pvA(r1,n))}，${r1}%・${rem}年${F4(B1)}，${r1}%・${rem+m}年${F4(B2)}，${r2}%・${rem}年${F4(A1)}，${r2}%・${rem+m}年${F4(A2)}。×3年3月31日（リース料支払及び決算整理後）の${ask}はいくらか。${LRND}`),
    a,u:'円',w,
    ex:`当初リース負債＝${Y(P)}×${F4(pvA(r1,n))}＝${Y(L0)}，減価償却費${Y(dep)}/年<br>×3年3月末（見直し前）：リース負債${Y(Lt)}，使用権資産${Y(L0)}－${Y(dep)}×2＝${Y(L0-2*dep)}<br>${ctrl?`借手の統制下にあり，かつ，延長オプションの判断に影響を与える重要な事象が生じたため，借手のリース期間を${n+m}年に変更しリース負債を見直す（変更後の割引率）。<br>見直し後＝${Y(P)}×${F4(A1)}＋${Y(P2)}×(${F4(A2)}－${F4(A1)})＝${Y(newL)}<br>修正額${Y(newL)}－${Y(Lt)}＝${yen(adj)}を使用権資産に加減（差額を損益に計上しない）→ 使用権資産${Y(L0-2*dep+adj)}`:`見直しの契機となる重要な事象は「借手の統制下にある」ものに限られる。市場動向の変化では借手のリース期間を見直さないため，リース負債・使用権資産の修正は行わない。`}<br>よって<b>${Y(a)}円</b>`};
}});

C({id:'q-lease-prepay',f:FA,ch:LCH,t:'借手：リース料を前払いする場合（未払利息と流動・固定区分）',r:'A',g(){
  const n=R.int(3,5), r=R.pick([2,3,4,5]), P=R.int(20,90)*10000, fA=pvA(r,n-1), fX=pvA(r,n);
  const L0=P+rd(P*fA), B=L0-P, acc=rd(B*r/100), dep=rd(L0/n), non=B+acc-P, Lx=rd(P*fX);
  const ask=R.pick(['当期の費用合計（減価償却費と支払利息）','当期末の貸借対照表において固定負債に表示されるリース負債','当期末の使用権資産の帳簿価額']);
  let a,w;
  if(ask.startsWith('当期の')){ a=dep+acc; w=[rd(Lx/n)+rd(Lx*r/100),dep+rd(L0*r/100),dep,rd(L0/(n-1))+acc,dep+rd(B/(n-1))]; }
  else if(ask.includes('固定負債')){ a=non; w=[B,B-P,B+acc,P*(n-2),non+acc]; }
  else { a=L0-dep; w=[L0-rd(L0/(n-1)),Lx-rd(Lx/n),L0,B-rd(B/n),L0-dep-acc]; }
  return {q:P_(`${LEASE_PRE}当期首（×1年4月1日）に設備のリースを開始した。借手のリース期間は${n}年，リース料は年額${Y(P)}円を毎年4月1日に前払いする（初回はリース開始日に支払った）。所有権移転条項・購入オプションはない。貸手の計算利子率は知り得ず，追加借入利子率は年${r}%（年金現価係数：${r}%・${n-1}年${F4(fA)}，${r}%・${n}年${F4(fX)}）。使用権資産は定額法で償却する。翌期首に支払うリース料に含まれる利息のうち当期に帰属する分は未払利息として計上する。${ask}はいくらか。${LRND}`),
    a,u:'円',w,
    ex:`リース負債＝${Y(P)}（初回：割引かない）＋${Y(P)}×${F4(fA)}＝${Y(L0)}（＝使用権資産）<br>初回支払後のリース負債＝${Y(B)}<br>当期の支払利息（未払利息）＝${Y(B)}×${r}%＝${Y(acc)}<br>減価償却費＝${Y(L0)}÷${n}＝${Y(dep)}<br>翌期首の支払${Y(P)}のうち元本部分${Y(P-acc)}＋未払利息${Y(acc)}が流動負債，固定負債＝${Y(B)}－${Y(P-acc)}＝${Y(non)}<br>よって<b>${Y(a)}円</b>`};
}});

C({id:'q-lease-simple',f:FA,ch:LCH,t:'借手：短期リース・少額リースの簡便的な取扱い',r:'B',g(){
  const m1=R.pick([6,8,10,12]), s=R.pick([7,10,11]), am=R.int(5,20)*10000, fm=Math.min(m1,16-s), expA=am*fm;
  const bm=R.int(3,12)*10000, y=R.int(3,5), c=R.int(20,Math.floor(300/y))*10000, d=R.int(5,15)*10000, y2=R.int(3,5), e=R.int(Math.ceil(360/y2),Math.floor(900/y2))*10000;
  const ans=expA+c+d;
  return {q:P_(`${LEASE_PRE}当社は，短期リース及び少額リースに関する簡便的な取扱いを適用できるものにはすべて適用している（重要性が乏しい減価償却資産の購入時費用処理の基準は採用していない）。当期に開始した次のリースについて，簡便的な取扱いにより当期の損益計算書に費用計上される借手のリース料の合計額はいくらか（B〜Eは当期首に開始，年額を毎年3月末に後払い，延長オプションはない）。<br>A：倉庫の賃借（当期${s}月1日開始，借手のリース期間${m1}か月，購入オプションなし，月額${Y(am)}円を毎月末払い）<br>B：車両のリース（借手のリース期間12か月，購入オプション付き，月額${Y(bm)}円）<br>C：事業内容に照らして重要性の乏しい複合機のリース（${y}年，リース料総額${Y(c*y)}円）<br>D：新品時の価値が4千米ドル程度のノートPCのリース（年額${Y(d)}円）<br>E：事業内容に照らして重要性の乏しい備品のリース（${y2}年，リース料総額${Y(e*y2)}円）`),
    a:ans,u:'円',w:[am*m1+c+d,ans+bm*12,ans+e,expA+c,expA+d,am*12+c+d],
    ex:`A：借手のリース期間12か月以内で購入オプションなし → 短期リース。当期分${Y(am)}×${fm}か月＝${Y(expA)}<br>B：購入オプションを含むため短期リースに該当しない → 使用権資産・リース負債を計上<br>C：1件当たりのリース料総額${Y(c*y)}円は300万円以下 → 少額リース，年額${Y(c)}を費用<br>D：新品時の原資産の価値が少額（5千米ドル以下程度）→ 少額リース，${Y(d)}を費用<br>E：1件当たり${Y(e*y2)}円は300万円超 → 簡便的な取扱い不可（オンバランス）<br>合計＝${Y(expA)}＋${Y(c)}＋${Y(d)}＝<b>${Y(ans)}円</b>`};
}});

C({id:'q-lease-slb',f:FA,ch:LCH,t:'セール・アンド・リースバック取引（新基準：一体処理と別個処理）',r:'A',g(){
  const N=R.pick([5,6,8,10]), Cst=R.int(10,50)*N*10000, a1=Cst*0.9/N, BV=Cst-a1, fin=R.chance(0.5);
  if(fin){
    const n=R.int(3,N-1), r=R.pick([3,4,5,6]), f=pvA(r,n), P=rd(BV*(1+R.int(-5,10)/100)/f,1000), S=rd(P*f), int1=rd(S*r/100);
    const why=R.pick(['当社による資産の譲渡は，収益認識会計基準等に照らして損益を認識する売却に該当しない','当社による資産の譲渡は損益を認識する売却に該当するが，リースバックにより当社が資産からもたらされる経済的利益のほとんどすべてを享受し，かつ，資産の使用に伴って生じるコストのほとんどすべてを負担する（フルペイアウト）']);
    const ask=R.pick(['当期の費用合計（減価償却費と支払利息）','当期末の借入金']);
    const a= ask.startsWith('当期の')? a1+int1 : S+int1-P;
    const w= ask.startsWith('当期の')? nz([rd(S/n)+int1,a1,rd(Cst*0.9/n)+int1,rd((S-Cst*0.1)/(N-1))+int1,a1+int1+Math.max(0,S-BV)]) : [S-P,S,S+int1,P*(n-1),S-P+rd((P*n-S)/n)];
    return {q:P_(`${LEASE_PRE}当社は当期首（×1年4月1日）に，×0年4月1日に${Y(Cst)}円で取得した機械（耐用年数${N}年，残存価額10%，定額法）を${Y(S)}円でB社に売却し，同時にリースバックした（借手のリース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い）。当該取引はセール・アンド・リースバック取引に該当し，${why}。B社の計算利子率は年${r}%で当社はこれを知り得る（${r}%・${n}年の年金現価係数${F4(f)}）。${ask}はいくらか。${LRND}`),
      a,u:'円',w,
      ex:`譲渡が売却に該当しない，又は，リースバックがフルペイアウトである場合は，資産の譲渡とリースバックを一体の取引とみて<b>金融取引</b>として処理する。<br>（借）現金預金${Y(S)}（貸）借入金${Y(S)}，機械は引き続き計上し売却損益は認識しない。<br>減価償却費＝${Y(Cst)}×0.9÷${N}＝${Y(a1)}（従来どおり）<br>支払利息＝${Y(S)}×${r}%＝${Y(int1)}，期末借入金＝${Y(S)}＋${Y(int1)}－${Y(P)}＝${Y(S+int1-P)}<br>よって<b>${Y(a)}円</b>`};
  }
  const S=rd(BV*(1+R.int(5,30)/100),10000), gain=S-BV, n2=R.int(2,3), r2=R.pick([2,3,4,5]), Q=rd(S*R.int(10,25)/100,10000), f2=pvA(r2,n2), L=rd(Q*f2), dep=rd(L/n2), ii=rd(L*r2/100);
  const ask=R.pick(['当期の固定資産売却益','当期の費用合計（使用権資産の減価償却費と支払利息）']);
  const a= ask.includes('売却益')? gain : dep+ii;
  const w= ask.includes('売却益')? [gain-rd(gain/n2),rd(gain/n2),S-Cst+2*a1,S-Cst+a1+rd(a1/2),L-BV].filter(x=>x>0) : [a1+ii,dep+ii-rd(gain/n2),dep,rd(S/n2)+rd(S*r2/100),a1+dep+ii];
  return {q:P_(`${LEASE_PRE}当社は当期首（×1年4月1日）に，×0年4月1日に${Y(Cst)}円で取得した店舗設備（耐用年数${N}年，残存価額10%，定額法）を${Y(S)}円でB社に売却し，同時にリースバックした（借手のリース期間${n2}年，リース料は毎年3月末に${Y(Q)}円を後払い，所有権移転条項・購入オプションなし）。当該取引はセール・アンド・リースバック取引に該当し，資産の譲渡は損益を認識する売却に該当する。また，リースバックはフルペイアウトのリースではない。当社は貸手の計算利子率を知り得ず，追加借入利子率は年${r2}%（${r2}%・${n2}年の年金現価係数${F4(f2)}）。使用権資産は定額法で償却する。${ask}はいくらか。${LRND}`),
    a,u:'円',w,
    ex:`売却に該当し，かつ，リースバックがフルペイアウトでないため，資産の譲渡は損益を認識し，リースバックは通常のリースとして<b>別個に</b>処理する（第13号のような売却損益の繰延べは行わない）。<br>帳簿価額＝${Y(Cst)}－${Y(a1)}＝${Y(BV)}，売却益＝${Y(S)}－${Y(BV)}＝${Y(gain)}<br>リース負債＝${Y(Q)}×${F4(f2)}＝${Y(L)}（＝使用権資産）<br>減価償却費＝${Y(L)}÷${n2}＝${Y(dep)}，支払利息＝${Y(L)}×${r2}%＝${Y(ii)}<br>よって<b>${Y(a)}円</b>`};
}});

C({id:'q-lease-sub',f:FA,ch:LCH,t:'サブリース取引（中間的な貸手の処理）',r:'B',adv:true,g(){
  const n=R.int(4,5), r=R.pick([2,3,4,5]), P=R.int(20,90)*10000, fH=pvA(r,n), L0=rd(P*fH), dep=rd(L0/n), sc=lsched(L0,r,[P,P]), L1=sc.bal[1], int2=sc.ints[1];
  const fl=R.chance(0.65), Q=P+R.int(1,6)*10000, m=n-1, fS=pvA(r,m);
  const head=`${LEASE_PRE}当社は×1年4月1日に事務所のリース（ヘッドリース：借手のリース期間${n}年，毎年3月末に${Y(P)}円を後払い，所有権移転条項・購入オプションなし）を開始した。貸手の計算利子率は知り得ず，追加借入利子率は年${r}%（${r}%・${n}年の年金現価係数${F4(fH)}，${r}%・${m}年の年金現価係数${F4(fS)}）であり，使用権資産は定額法で償却する。×2年4月1日，当社は当該事務所を第三者にサブリースした（`;
  if(fl){
    const Inv=rd(Q*fS), carry=L0-dep, gain=Inv-carry, ii=rd(Inv*r/100), InvEnd=Inv+ii-Q;
    const ask=R.pick(['サブリース開始時に認識される損益','受取利息','期末のリース投資資産','支払利息（ヘッドリース）']);
    let a,w;
    if(ask.includes('損益')){ a=gain; w=[Inv-L0,Inv-L1,Q*m-carry,gain-dep,Inv-(L0-2*dep)]; }
    else if(ask==='受取利息'){ a=ii; w=[rd(Q*r/100),rd((Q*m-Inv)/m),int2,rd(carry*r/100),ii+int2]; }
    else if(ask.includes('投資資産')){ a=InvEnd; w=[Inv-Q,Inv,L1+int2-P,carry-dep,Inv-rd((Q*m-Inv)/m)]; }
    else { a=int2; w=[rd(L0*r/100),ii,rd((P*n-L0)/n),int2+ii,rd(carry*r/100)]; }
    return {q:P_(`${head}貸手のリース期間${m}年，毎年3月末に${Y(Q)}円を受取，見積残存価額ゼロ）。サブリースはファイナンス・リースに該当する。サブリースの計算利子率の算定は容易でないため，ヘッドリースに用いた割引率を用いる。当期（×2年4月1日〜×3年3月31日）について，${ask}はいくらか。${LRND}`),
      a,u:'円',w,
      ex:`ヘッドリース：リース負債・使用権資産${Y(L0)}，減価償却費${Y(dep)}/年，×2年3月末のリース負債${Y(L1)}<br>サブリース（ファイナンス・リース）開始時：サブリースした使用権資産（帳簿価額${Y(L0)}－${Y(dep)}＝${Y(carry)}）の消滅を認識し，貸手のリース料の現在価値${Y(Q)}×${F4(fS)}＝${Y(Inv)}でリース投資資産を計上。差額${yen(gain)}を純額で損益計上。<br>受取利息＝${Y(Inv)}×${r}%＝${Y(ii)}，期末リース投資資産＝${Y(Inv)}＋${Y(ii)}－${Y(Q)}＝${Y(InvEnd)}<br>ヘッドリースのリース負債は存続：支払利息＝${Y(L1)}×${r}%＝${Y(int2)}<br>よって<b>${yen(a)}円</b>`};
  }
  const ask=R.pick(['当期末の使用権資産の帳簿価額','当期の損益（受取リース料－減価償却費－支払利息）']);
  const a= ask.startsWith('当期末')? L0-2*dep : Q-dep-int2;
  const w= ask.startsWith('当期末')? [L0-dep,L0,L1-P+int2,L0-dep-rd(Q*fS)+Q,rd(Q*fS)] : [Q-int2,Q-dep,Q-P,Q-dep-rd(L0*r/100),-(dep+int2)];
  return {q:P_(`${head}貸手のリース期間1年，×3年3月31日に${Y(Q)}円を受取）。サブリースの貸手のリース料の現在価値は独立第三者間取引における使用権資産のリース料の90%を明らかに下回る。当期（×2年4月1日〜×3年3月31日）の${ask}はいくらか（損失の場合は△）。${LRND}`),
    a,u:'円',w,neg:true,
    ex:`サブリースの分類は原資産ではなく使用権資産を参照して判定する：貸手のリース期間1年＜ヘッドリース残存期間${m}年×75%，かつ現在価値基準も満たさない → オペレーティング・リース。<br>中間的な貸手は使用権資産を引き続き計上・償却し，受取リース料${Y(Q)}を収益計上する。<br>減価償却費${Y(dep)}（期末使用権資産${Y(L0)}－${Y(dep)}×2＝${Y(L0-2*dep)}），支払利息＝${Y(L1)}×${r}%＝${Y(int2)}<br>よって<b>${yen(a)}円</b>`};
}});

/* ---------- 新リース会計基準（第34号）：貸手 ---------- */
C({id:'q-lease-lessor34',f:FA,ch:LCH,t:'貸手：ファイナンス・リースの処理（事業の形態別）',r:'A',g(){
  const n=R.int(3,6), r=R.pick([3,4,5,6,7,8,9]), P=R.int(10,60)*10000, f=pvA(r,n), g=pv1(r,n), type=R.pick(['X','Y','Z']);
  const base=`${LEASE_PRE}当期首（リース開始日）に，機械を借手にリースした（貸手のリース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い，所有権移転条項・割安購入選択権なし，特別仕様ではない）。当該リースは所有権移転外ファイナンス・リースに該当する。貸手の計算利子率は年${r}%である。`;
  if(type==='X'){
    const Sales=rd(P*f), BV=rd(Sales*R.int(75,92)/100,1000), a0=R.chance(0.5)?R.int(1,5)*10000:0, gp=Sales-BV-a0, ii=rd(Sales*r/100);
    const ask=R.pick(['当期の売上総利益（売上高－売上原価）','当期の受取利息']);
    const a= ask.includes('売上総利益')? gp : ii;
    const w= ask.includes('売上総利益')? [P*n-BV-a0,Sales-BV+(a0?0:10000),ii,P*n-Sales,gp+ii] : [rd((P*n-Sales)/n),rd(P*r/100),P*n-Sales,rd(gp*r/100),P-ii];
    return {q:P_(`${base}当社は製造業を営み，製品の販売手法の一つとして事業の一環でリースを行っている。原資産（製品）の帳簿価額は${Y(BV)}円，借手に対する現金販売価額は${Y(Sales)}円（貸手のリース料の現在価値と一致，見積残存価額ゼロ）である。${a0?`原資産を借手の使用に供するための付随費用${Y(a0)}円を支払った。`:''}${ask}はいくらか（円未満四捨五入）。`),
      a,u:'円',w,
      ex:`製造又は販売を事業とする貸手が事業の一環で行うリース：リース開始日に，貸手のリース料から利息相当額を控除した額（${Y(Sales)}）で売上高とリース投資資産を計上し，原資産の帳簿価額${a0?'＋付随費用':''}で売上原価を計上（旧第1法を利息控除後の売上高に修正したもの）。<br>売上総利益＝${Y(Sales)}－(${Y(BV)}${a0?'＋'+Y(a0):''})＝${Y(gp)}<br>受取利息＝${Y(Sales)}×${r}%＝${Y(ii)}<br>よって<b>${Y(a)}円</b>`};
  }
  if(type==='Y'){
    const E=R.chance(0.5)?R.int(1,8)*10000:0, K=rd(P*f+E*g), ii=rd(K*r/100), end=K+ii-P;
    const ask=R.pick(['当期の受取利息','当期末のリース投資資産']);
    const a= ask.includes('受取')? ii : end;
    const w= ask.includes('受取')? nz([rd((P*n+E-K)/n),rd((P*n-K)/n),rd(P*r/100),rd((K-E)*r/100),P-ii]) : nz([K-P,K-P+rd((P*n+E-K)/n),end-E,K-ii,P*(n-1)]);
    return {q:P_(`${base}当社はリース会社（製造又は販売以外を事業とする貸手）であり，事業の一環として，機械を${Y(K)}円で現金購入し直ちにリースした。${E?`見積残存価額は${Y(E)}円である。`:'見積残存価額はゼロである。'}${ask}はいくらか（円未満四捨五入）。`),
      a,u:'円',w,
      ex:`製造又は販売以外を事業とする貸手が事業の一環で行うリース：売上高・売上原価を計上せず，原資産の現金購入価額${Y(K)}でリース投資資産を計上し，受取リース料を利息相当額と元本回収に区分する（旧第3法に相当）。<br>受取利息＝${Y(K)}×${r}%＝${Y(ii)}（利息相当額の総額は，リース料${Y(P*n)}${E?'＋見積残存価額'+Y(E):''}－取得価額${Y(K)}）<br>期末リース投資資産＝${Y(K)}－(${Y(P)}－${Y(ii)})＝${Y(end)}<br>よって<b>${Y(a)}円</b>`};
  }
  const PVs=rd(P*f), BV=rd(PVs*R.int(60,90)/100,1000), a0=R.chance(0.4)?R.int(1,3)*10000:0, gain=PVs-BV-a0;
  return {q:P_(`${base}当社は製造業を営んでおり，本業とは関係なく，自社で使用していた機械（帳簿価額${Y(BV)}円）を遊休化したためリースしたものである（事業の一環以外で行うリース）。見積残存価額はゼロ，${r}%・${n}年の年金現価係数は${F4(f)}である。${a0?`原資産を借手の使用に供するための付随費用${Y(a0)}円を支払った。`:''}リース開始日に計上される売却益はいくらか（円未満四捨五入）。`),
    a:gain,u:'円',w:nz([P*n-BV-a0,PVs-BV+(a0?0:10000),rd(PVs*r/100),P*n-PVs,PVs-BV-a0-rd(PVs*r/100)]).filter(x=>x>0),
    ex:`事業の一環以外で行うリース：貸手のリース料から利息相当額を控除した金額（現在価値）${Y(P)}×${F4(f)}＝${Y(PVs)}でリース投資資産を計上し，原資産の帳簿価額${a0?'（付随費用を含む）':''}との差額を売却損益とする。<br>${Y(PVs)}－(${Y(BV)}${a0?'＋'+Y(a0):''})＝<b>${Y(gain)}円</b>`};
}});

/* ---------- 現行基準（第13号） ---------- */
C({id:'q-lease-13init',f:FA,ch:LCH13,t:'借手：リース資産・リース債務の計上額（第13号）',r:'A',g(){
  const n=R.int(3,6), P=R.int(10,60)*10000, cs=R.int(1,4);
  let q,a,w,ex;
  if(cs===1){ // 移転外・貸手の購入価額不明
    const r=R.pick([3,4,5,6]), f=pvA(r,n), PV=rd(P*f), X=rd(PV*(1+R.pick([-6,-4,-3,3,4,6])/100),1000); a=Math.min(PV,X);
    q=`所有権移転外ファイナンス・リース取引に該当する。借手において貸手の購入価額は明らかでなく，リース物件の見積現金購入価額は${Y(X)}円である。貸手の計算利子率は知り得ず，追加借入利子率は年${r}%（${r}%・${n}年の年金現価係数${F4(f)}）である。`;
    w=[Math.max(PV,X),P*n,rd(P*pvA(r+1,n)),rd(P*pvA(r-1,n)),X+P*n-PV]; ex=`所有権移転外FL・貸手の購入価額不明 → 「リース料総額の割引現在価値」と「見積現金購入価額」のいずれか低い額。<br>現在価値＝${Y(P)}×${F4(f)}＝${Y(PV)}，見積現金購入価額${Y(X)} → <b>${Y(a)}円</b>`;
  } else if(cs===2){ // 移転外・貸手の購入価額判明
    const r=R.pick([4,5,6,7,8]), f=pvA(r,n), g=pv1(r,n), E=R.int(2,10)*10000, K=rd(P*f+E*g), PV=rd(P*f); a=PV;
    q=`所有権移転外ファイナンス・リース取引に該当する。借手において貸手の購入価額${Y(K)}円は明らかであり，貸手の計算利子率年${r}%も知り得る（${r}%・${n}年の年金現価係数${F4(f)}）。なお，貸手は見積残存価額を見込んでいる。`;
    w=[K,P*n,K-E,rd(P*pvA(r+1,n)),PV+E]; ex=`所有権移転外FL・貸手の購入価額判明 → 「リース料総額の割引現在価値（貸手の計算利子率）」と「貸手の購入価額」のいずれか低い額。<br>現在価値＝${Y(P)}×${F4(f)}＝${Y(PV)}＜購入価額${Y(K)}（貸手は見積残存価額でも回収するため）→ <b>${Y(a)}円</b>`;
  } else if(cs===3){ // 移転・判明
    const r=R.pick([4,5,6,7,8]), f=pvA(r,n), g=pv1(r,n), B=R.int(1,5)*10000, K=rd(P*f+B*g), PV=rd(P*f); a=K;
    q=`契約上，リース期間終了時に${Y(B)}円で購入できる割安購入選択権があり，その行使が確実に予想されるため所有権移転ファイナンス・リース取引に該当する。借手において貸手の購入価額${Y(K)}円は明らかであり，貸手の計算利子率は年${r}%（${r}%・${n}年の年金現価係数${F4(f)}）である。`;
    w=[PV,P*n+B,P*n,PV+B,K-B]; ex=`所有権移転FL・貸手の購入価額判明 → 貸手の購入価額をそのまま計上。<br><b>${Y(a)}円</b>（割安購入選択権の行使価額も含めたリース料の現在価値と一致する）`;
  } else { // 移転・不明
    const r=R.pick([3,4,5,6]), f=pvA(r,n), PV=rd(P*f), X=rd(PV*(1+R.pick([-5,-3,-2,2,3,5])/100),1000); a=Math.min(PV,X);
    q=`契約上，リース期間終了時に所有権が借手に移転するため所有権移転ファイナンス・リース取引に該当する。借手において貸手の購入価額は明らかでなく，リース物件の見積現金購入価額は${Y(X)}円である。追加借入利子率は年${r}%（${r}%・${n}年の年金現価係数${F4(f)}）である。`;
    w=[Math.max(PV,X),P*n,rd((PV+X)/2,1000),rd(P*pvA(r+1,n)),X+P*n-PV]; ex=`所有権移転FL・貸手の購入価額不明 → 見積現金購入価額と割引現在価値のいずれか低い額。<br>現在価値＝${Y(P)}×${F4(f)}＝${Y(PV)}，見積現金購入価額${Y(X)} → ${X<=PV?'見積現金購入価額':'現在価値'}<b>${Y(Math.min(PV,X))}円</b>`;
  }
  return {q:P_(`${LEASE_PRE13}当期首に備品をリースした（リース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い）。当該リースは${q}リース開始日に計上するリース資産の金額はいくらか（円未満四捨五入）。`),a,u:'円',w,ex};
}});

C({id:'q-lease-13year1',f:FA,ch:LCH13,t:'借手：所有権移転外ファイナンス・リースの利息と償却（第13号）',r:'A',g(){
  const n=R.int(3,5), r=R.pick([3,4,5,6]), P=R.int(10,60)*10000, G=R.chance(0.5)?R.int(2,10)*10000:0, f=pvA(r,n), g=pv1(r,n);
  const PV=rd(P*f)+(G?rd(G*g):0), X=rd(PV*(1+R.int(2,8)/100),1000), N=n+R.int(2,4);
  const dep=rd((PV-G)/n), int1=rd(PV*r/100), L1=PV+int1-P, int2=rd(L1*r/100), cur=P-int2, non=L1-cur;
  const ask=R.pick(['当期の費用合計（減価償却費と支払利息）','当期末のリース債務のうち固定負債に表示される金額','当期末のリース資産（減価償却累計額控除後）']);
  let a,w;
  if(ask.startsWith('当期の')){ a=dep+int1; w=[rd(PV/n)+int1,rd(PV*0.9/N)+int1,rd(X/n)+rd(X*r/100),dep+rd((P*n+G-PV)/n),rd((PV-G)/N)+int1]; }
  else if(ask.includes('固定負債')){ a=non; w=[L1,cur,L1-P,PV-P,non+int2]; }
  else { a=PV-dep; w=[PV-rd(PV/n),PV-rd(PV*0.9/N),X-rd(X/n),PV,PV-rd((PV-G)/N)]; }
  return {q:P_(`${LEASE_PRE13}当期首に備品をリースした（リース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い）。当該リースは所有権移転外ファイナンス・リース取引に該当する。${G?`契約上，リース期間終了時の処分価額が${Y(G)}円に満たない場合に不足額を当社が補填する残価保証の取決めがある。`:''}借手において貸手の購入価額は明らかでなく，見積現金購入価額は${Y(X)}円，追加借入利子率は年${r}%（${r}%・${n}年の年金現価係数${F4(f)}${G?`，現価係数${F4(g)}`:''}）である。当社が所有する同種の備品は耐用年数${N}年・残存価額10%・定額法で償却している。${ask}はいくらか。${LRND}`),
    a,u:'円',w,
    ex:`リース料総額の現在価値＝${Y(P)}×${F4(f)}${G?`＋残価保証額${Y(G)}×${F4(g)}`:''}＝${Y(PV)}＜見積現金購入価額${Y(X)} → リース資産・リース債務${Y(PV)}（割引率${r}%で利息法）<br>減価償却：所有権移転外 → リース期間${n}年，残存価額${G?`は残価保証額${Y(G)}`:'ゼロ'}（同種資産の耐用年数・残存価額は用いない）→ (${Y(PV)}${G?'－'+Y(G):''})÷${n}＝${Y(dep)}<br>支払利息＝${Y(PV)}×${r}%＝${Y(int1)}，期末リース債務${Y(L1)}<br>翌期元本返済額${Y(P)}－${Y(L1)}×${r}%＝${Y(cur)}（流動），固定${Y(non)}<br>よって<b>${Y(a)}円</b>`};
}});

C({id:'q-lease-13lessor',f:FA,ch:LCH13,t:'貸手：ファイナンス・リースの3つの処理方法（第13号）',r:'A',g(){
  const n=R.int(3,6), r=R.pick([5,6,7,8,9]), P=R.int(10,60)*10000, E=R.chance(0.6)?R.int(1,8)*10000:0, f=pvA(r,n), g=pv1(r,n);
  const K=rd(P*f+E*g), int1=rd(K*r/100), acct=E?'リース投資資産':'リース債権';
  const M=[['リース取引開始日に売上高と売上原価を計上する方法',[['売上高',P*n],['売上原価',K-E],['繰延リース利益繰入額',(P*n+E-K)-int1]]],
           ['リース料受取時に売上高と売上原価を計上する方法',[['売上高',P],['売上原価',P-int1]]],
           ['売上高を計上せずに利息相当額を各期へ配分する方法',[['受取利息',int1],[`当期末の${acct}`,K+int1-P]]]];
  const mi=R.int(0,2), [lab,val]=R.pick(M[mi][1]);
  const pool=nz([P*n,K,K-E,P,P-int1,int1,P*n-K,(P*n+E-K)-int1,K+int1-P,rd((P*n+E-K)/n)]).filter(x=>x>0&&x!==val);
  return {q:P_(`${LEASE_PRE13}当社（貸手）は当期首に備品を${Y(K)}円で購入し，直ちにリースした（リース期間${n}年，リース料は毎年3月末に${Y(P)}円を受取，貸手の計算利子率年${r}%）。当該リースは${E?`所有権移転外ファイナンス・リース取引に該当し，見積残存価額は${Y(E)}円である`:'所有権移転ファイナンス・リース取引に該当する'}。当社は「${M[mi][0]}」を採用している。${lab.startsWith('当期末')?lab:'当期の'+lab}はいくらか（円未満四捨五入）。`),
    a:val,u:'円',w:pool,
    ex:`利息相当額の総額＝リース料総額${Y(P*n)}${E?`＋見積残存価額${Y(E)}`:''}－取得価額${Y(K)}＝${Y(P*n+E-K)}，当期分＝${Y(K)}×${r}%＝${Y(int1)}（利息法）<br>第1法：売上高＝リース料総額${Y(P*n)}，売上原価＝取得価額${E?'－見積残存価額':''}＝${Y(K-E)}，当期末以降に対応する利息相当額${Y((P*n+E-K)-int1)}を繰延リース利益として繰り延べる。<br>第2法：売上高＝受取リース料${Y(P)}，売上原価＝元本回収額${Y(P)}－${Y(int1)}＝${Y(P-int1)}<br>第3法：受取利息${Y(int1)}，期末${acct}＝${Y(K)}－${Y(P-int1)}＝${Y(K+int1-P)}<br>よって<b>${Y(val)}円</b>（いずれの方法でも各期の利益は同額。なお新基準では第2法は廃止）`};
}});

C({id:'q-lease-13slb',f:FA,ch:LCH13,t:'セール・アンド・リースバック取引（第13号：売却損益の繰延べ）',r:'A',g(){
  const N=R.pick([5,6,8,10]), Cst=R.int(10,50)*N*10000, a1=Cst*0.9/N, BV=Cst-a1, own=R.chance(0.4);
  const n= own? N-1 : R.int(3,N-2), r=R.pick([4,5,6,8,10]), f=pvA(r,n), P=rd(BV*(1+R.int(3,15)/100)/f,1000), S=rd(P*f);
  if(S<=BV) throw 0;
  const gain=S-BV, life= own? N-1 : n, dep= own? rd((S-Cst*0.1)/(N-1)) : rd(S/n), am=rd(gain/life), int1=rd(S*r/100);
  const ask=R.pick(['当期の費用合計（減価償却費，長期前受収益の振替額及び支払利息の純額）','当期末の長期前受収益']);
  const a= ask.startsWith('当期の')? dep-am+int1 : gain-am;
  const w= ask.startsWith('当期の')? [dep+int1,dep+am+int1,a1+int1,dep-gain+int1,rd(S/N)-am+int1].filter(x=>x>0) : [gain,am,gain-rd(gain/N),gain-a1,S-Cst+a1].filter(x=>x>0);
  return {q:P_(`${LEASE_PRE13}当社は当期首に，前期首に${Y(Cst)}円で取得した備品（耐用年数${N}年，残存価額10%，定額法）を${Y(S)}円で売却し，同時にリースバックした（リース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い）。当該リースは${own?`契約上リース期間終了時に所有権が当社に移転する所有権移転ファイナンス・リース取引であり，リースバック以後の経済的残存耐用年数は${N-1}年である（減価償却は定額法，終了時に当初の残存価額を残す）`:'所有権移転外ファイナンス・リース取引である'}。貸手の計算利子率は年${r}%で当社はこれを知り得る（${r}%・${n}年の年金現価係数${F4(f)}）。${ask}はいくらか。${LRND}`),
    a,u:'円',w,
    ex:`売却時：帳簿価額${Y(Cst)}－${Y(a1)}＝${Y(BV)}，売却益${Y(gain)}は実現していないため長期前受収益として繰り延べる。<br>リース資産・リース債務＝貸手の購入価額（売却価額）${Y(S)}<br>減価償却費＝${own?`(${Y(S)}－${Y(Cst)}×10%)÷${N-1}年`:`${Y(S)}÷リース期間${n}年`}＝${Y(dep)}<br>長期前受収益の振替（減価償却費の割合で減価償却費から控除）＝${Y(gain)}÷${life}＝${Y(am)}<br>支払利息＝${Y(S)}×${r}%＝${Y(int1)}<br>費用合計＝${Y(dep)}－${Y(am)}＋${Y(int1)}＝${Y(dep-am+int1)}，期末長期前受収益＝${Y(gain-am)}<br>よって<b>${Y(a)}円</b>（新基準ではこのような繰延べは行わない）`};
}});

T({id:'q-leaset-ident',f:FT,ch:LCH,t:'リースの識別とリースを構成する部分の区分（新リース会計基準）',r:'A',
T:['契約の締結時に，契約の当事者は，当該契約がリースを含むか否かを判断し，特定された資産の使用を支配する権利を一定期間にわたり対価と交換に移転する契約はリースを含む。',
'特定された資産の使用期間全体を通じて，顧客が資産の使用から生じる経済的利益のほとんどすべてを享受する権利と，資産の使用を指図する権利の両方を有する場合に，資産の使用を支配する権利が顧客に移転している。',
'顧客が使用できる資産が物理的に別個のものではない稼働能力の一部分であっても，その稼働能力が資産の稼働能力のほとんどすべてであり，顧客が経済的利益のほとんどすべてを享受する場合には，特定された資産に該当する。',
'借手は，契約における対価の中に借手に財又はサービスを移転しない活動及びコストについて支払う金額が含まれる場合，当該金額を契約における対価の一部としてリースを構成する部分とリースを構成しない部分とに配分する。',
'借手は，原資産の科目ごと又は性質及び用途が類似する原資産のグループごとに，リースを構成する部分と関連するリースを構成しない部分とを合わせてリースを構成する部分として会計処理することを選択できる。',
'無形固定資産のリースについては，本会計基準を適用しないことができる。',
'第13号では一般にオペレーティング・リース取引として賃貸借処理されていた事務所の不動産賃貸借契約についても，リースを含む場合には借手が使用権資産及びリース負債を計上する。'],
F:[['契約がリースを含むか否かの判断は，少なくとも毎期見直さなければならない。','契約条件が変更されない限り，契約期間中は判断を見直さない。'],
['顧客が特定された資産の使用から生じる経済的利益のほとんどすべてを享受する権利を有していれば，使用を指図する権利の有無にかかわらず，リースを含む。','使用を指図する権利も有していることが必要である。'],
['資産の使用方法に係る決定が事前になされていれば，それだけで顧客は使用期間全体を通じて資産の使用を指図する権利を有している。','加えて，顧客のみが資産を稼働する権利を有しているか，顧客が使用方法を事前に決定するように資産を設計していることが必要である。'],
['サプライヤーが使用期間全体を通じて資産を代替する実質上の能力を有していれば，代替により経済的利益を享受するか否かにかかわらず，当該資産は特定された資産に該当しない。','実質上の能力と，代替による経済的利益の享受の両方を満たす場合に特定された資産に該当しない。'],
['借手及び貸手は，原則として，リースを構成する部分とリースを構成しない部分とを合わせて一体として会計処理を行う。','原則は両者を分けて会計処理する。'],
['借手は，契約における対価を，それぞれの部分の独立販売価格の比率に基づいて配分しなければならない。','借手は独立価格の比率で配分する（独立販売価格の比率は貸手）。'],
['貸手は，契約における対価に維持管理費用相当額が含まれる場合，必ずこれを対価から控除して収益に計上しなければならない。','対価の一部として配分する方法と，控除して収益計上又は費用の控除額とする方法とを選択できる。'],
['本会計基準は有形固定資産のリースを対象としており，無形固定資産のリースに適用することはできない。','無形固定資産のリースは適用しないことが「できる」にすぎない。']],
V:[['顧客がガス貯蔵タンクの容量の70%までを使用する権利を有し，残りの容量をサプライヤーが使用できる場合，当該稼働能力部分は特定された資産に{該当しない|該当する}。']]});

T({id:'q-leaset-term',f:FT,ch:LCH,t:'借手のリース期間・リース負債の見直し・契約条件の変更（新リース会計基準）',r:'A',
T:['借手のリース期間は，解約不能期間に，借手が行使することが合理的に確実である延長オプションの対象期間と，借手が行使しないことが合理的に確実である解約オプションの対象期間を加えて決定する。',
'貸手のみがリースを解約する権利を有している場合，当該期間は借手の解約不能期間に含まれる。',
'「合理的に確実」は蓋然性が相当程度高いことを示し，その閾値は「可能性が高い」よりも高く「ほぼ確実」よりも低いと考えられている。',
'貸手は，借手のリース期間と同様に決定する方法と，解約不能期間に借手が再リースする意思が明らかな場合の再リース期間を加えて決定する方法のいずれかを選択して，貸手のリース期間を決定する。',
'原資産の追加によりリースの範囲が拡大され，かつ，リース料が拡大部分の独立価格に適切な調整を加えた金額分だけ増額される契約条件の変更は，独立したリースとして会計処理する。',
'リースの範囲が縮小される契約条件の変更では，使用権資産の帳簿価額を減額し，使用権資産の減少額とリース負債の修正額との差額を損益に計上する。',
'リース料単価の変更や契約期間の延長のように，範囲の拡大にも縮小にも該当しない契約条件の変更は，リース負債の修正額に相当する金額を使用権資産に加減する。',
'指数又はレートに応じて決まる借手の変動リース料は，指数又はレートの変動により今後支払うリース料に変動が生じたときに，残りのリース期間にわたりリース負債を修正し，修正額を使用権資産に加減する。'],
F:[['借手のリース期間は，解約不能期間に，借手が行使可能な延長オプション及び解約オプションの対象期間をすべて加えて決定する。','行使すること（しないこと）が合理的に確実な期間のみを加える。'],
['貸手のみがリースを解約する権利を有している場合，当該解約権の対象期間は借手の解約不能期間に含まれない。','貸手のみが解約権を有する期間は借手の解約不能期間に含まれる。'],
['貸手のリース期間を借手のリース期間と同様の方法で決定できるのは，製造又は販売を事業とする貸手に限られる。','すべての貸手がいずれかの方法を選択できる。'],
['借手の統制下にない市場動向の変化であっても，延長オプションの行使判断に影響を与える重要な事象であれば，借手のリース期間を見直さなければならない。','見直しの契機は借手の統制下にある重要な事象又は状況に限られる。'],
['リースの契約条件の変更が生じた場合，独立したリースとしての処理とリース負債の見直しの両方が同時に行われることはない。','変更に複数の要素がある場合は両方を行うことがある。'],
['リースの契約条件の変更を伴わずに借手のリース期間を変更する場合，リース負債と使用権資産の修正額の差額を損益に計上する。','リース負債の修正額を使用権資産に加減するため，原則として差額は生じない。'],
['借手が再リース期間を借手のリース期間に含めていない場合，再リースは当初のリースとは独立したリースとして会計処理しなければならない。','独立したリースとして処理することが「できる」（容認）にとどまる。'],
['リースの範囲が縮小される契約条件の変更では，リース負債の修正額と同額を使用権資産から減額するため，損益は生じない。','使用権資産は解約割合に応じて減額し，差額を損益に計上する。']]});

T({id:'q-leaset-lessee',f:FT,ch:LCH,t:'借手の会計処理（新リース会計基準と第13号の相違）',r:'A',
T:['借手は，ファイナンス・リースとオペレーティング・リースの分類を行わず，すべてのリースについて使用権資産とリース負債を計上し，使用権資産の減価償却費とリース負債に係る利息相当額を計上する。',
'リース負債は，リース開始日において未払である借手のリース料から利息相当額の合理的な見積額を控除した現在価値により算定し，リース開始日までに支払ったリース料は使用権資産に加算する。',
'第13号では所有権移転外ファイナンス・リースの残価保証額を残存価額としていたが，新基準では残価保証に係る借手の支払見込額を借手のリース料に含め，残価保証額を残存価額とする取扱いは廃止された。',
'所有権移転外リースの使用権資産は，定額法等の中から企業の実態に応じた償却方法を選択でき，原資産を自ら所有していたと仮定した場合と同一の方法による必要はない。',
'使用権資産総額に重要性が乏しいと認められる場合とは，未経過の借手のリース料の期末残高が，当該期末残高，有形固定資産及び無形固定資産の期末残高の合計額に占める割合が10%未満である場合をいう。',
'借手の業績に連動する変動リース料はリース負債に含めず，発生時に損益に計上する。',
'借手は，貸手の計算利子率を知り得る場合には貸手の計算利子率を，知り得ない場合には借手の追加借入利子率を割引率として用いる。',
'第13号では借手の所有権移転外ファイナンス・リース取引について資産計上額を「リース料総額の現在価値」と「貸手の購入価額等」のいずれか低い額としていたが，新基準の使用権資産はリース負債に前払リース料・付随費用等を加減して算定する。'],
F:[['リース負債は，リース開始日において未払である借手のリース料にリース開始日までに支払った借手のリース料を加えた額の現在価値により算定する。','既に支払ったリース料はリース負債に含めない（使用権資産に加算）。'],
['使用権資産は，リース負債に付随費用及び受け取ったリース・インセンティブを加算し，資産除去債務に対応する除去費用を控除して算定する。','除去費用を加算し，リース・インセンティブを控除する。'],
['借手の割引率は，貸手の計算利子率と借手の追加借入利子率のいずれか低い利率による。','知り得る場合は貸手の計算利子率，知り得ない場合は追加借入利子率による。'],
['所有権移転外リースの使用権資産は，定額法により償却しなければならない。','定額法等の中から企業の実態に応じた方法を選択適用する。'],
['短期リースについては，借手のリース料から利息相当額を控除せず，借手のリース料をもって使用権資産及びリース負債を計上する方法が認められる。','短期リースは資産・負債を計上せず定額法等で費用処理する。本問の方法は使用権資産総額に重要性が乏しい場合の取扱い。'],
['使用権資産は，貸借対照表において必ず「使用権資産」として区分して表示しなければならない。','原資産を自ら所有していたと仮定した場合の科目に含める方法も認められる。'],
['リース負債は，正常営業循環基準により全額を流動負債に表示する。','一年基準により流動負債と固定負債に区分する。'],

/* ============ 管理会計論・計算（原価計算分野／管理会計分野） ============ */
const MC='mg-cc', MM='mg-mc';
const fav=(x)=>x>=0?'有利差異':'不利差異';

C({id:'mg-mat-price',f:MC,ch:'第3章 材料費',t:'材料消費価格差異',r:'A',g(){
  const p=R.int(40,120)*10; const c0=p+R.int(-8,8)*10; let c1=p+R.int(-8,8)*10; if((c0+c1)%20) c1+=10;
  const q0=R.int(2,8)*100, q1=q0; const avg=(c0+c1)/2; const Q=R.int(Math.ceil(q0*1.1/100),Math.floor(q0*1.9/100))*100;
  const d=(p-avg)*Q;
  return {q:P_(`材料の消費額は予定価格＠${Y(p)}円で計算している。当月の資料は，月初有高${Y(q0)}kg（＠${Y(c0)}円），当月購入${Y(q1)}kg（＠${Y(c1)}円），当月消費量${Y(Q)}kgであり，実際消費単価は総平均法による。材料消費価格差異はいくらか（有利差異はプラス，不利差異は△）。`),
    a:d,u:'円',neg:true,w:[-d,(p-c1)*Q,(p-c0)*Q,(p-avg)*(q0+q1),(p-avg)*(q0+q1-Q)],
    ex:`実際消費単価＝(${Y(q0*c0)}＋${Y(q1*c1)})÷${Y(q0+q1)}kg＝＠${Y(avg)}<br>差異＝(予定＠${p}－実際＠${avg})×${Y(Q)}kg＝<b>${yen(d)}円</b>（${fav(d)}）`};
}});

C({id:'mg-labor-rate',f:MC,ch:'第4章 労務費',t:'賃率差異',r:'A',g(){
  const r=R.int(10,25)*100; const h=R.int(20,60)*100; const act=r*h+R.int(-20,20)*10000; const u0=R.int(20,60)*10000, u1=R.int(20,60)*10000; const W=act+u0-u1;
  const d=r*h-act;
  return {q:P_(`直接工の賃金は予定賃率＠${Y(r)}円/時間で消費額を計算している。当月の実際作業時間（直接作業・間接作業・手待時間の合計）は${Y(h)}時間であった。当月の賃金支給総額は${Y(W)}円，前月末未払賃金は${Y(u0)}円，当月末未払賃金は${Y(u1)}円である。賃率差異はいくらか（有利差異はプラス，不利差異は△）。`),
    a:d,u:'円',neg:true,w:[r*h-W,r*h-(W+u0-u1),-d,r*h-(W-u0-u1),r*h-(W+u0+u1)],
    ex:`実際消費賃金＝支給額${Y(W)}－前月未払${Y(u0)}＋当月未払${Y(u1)}＝${Y(act)}<br>予定消費額＝＠${r}×${Y(h)}時間＝${Y(r*h)}<br>差異＝${Y(r*h)}－${Y(act)}＝<b>${yen(d)}円</b>（${fav(d)}）`};
}});

C({id:'mg-oh-var',f:MC,ch:'第6章 製造間接費',t:'製造間接費の予算差異・操業度差異（公式法変動予算）',r:'A',g(){
  const N=R.int(20,60)*100; const v=R.int(3,12)*100; const f=R.int(4,15)*100; const F=f*N; const A=N+R.int(-8,4)*100;
  const X=v*A+F+R.int(-30,30)*10000; const bd=(v*A+F)-X, vd=(A-N)*f;
  const ask=R.pick(['予算差異','操業度差異','製造間接費配賦差異（総差異）']);
  const ans= ask==='予算差異'?bd: ask==='操業度差異'?vd: bd+vd;
  return {q:P_(`製造間接費は直接作業時間を基準に予定配賦しており，公式法変動予算を用いている。月間の基準操業度${Y(N)}時間，変動費率＠${Y(v)}円，固定費予算額${Y(F)}円である。当月の実際直接作業時間は${Y(A)}時間，製造間接費の実際発生額は${Y(X)}円であった。${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w: ask==='予算差異'?[(v*N+F)-X,(v+f)*A-X,-bd,bd+vd]: ask==='操業度差異'?[(A-N)*(v+f),(N-A)*f,(A-N)*v,bd]:[bd,vd,-(bd+vd),(v+f)*N-X],
    ex:`予定配賦率＝＠${v}＋${Y(F)}÷${Y(N)}＝＠${v+f}<br>予算差異＝(＠${v}×${Y(A)}＋${Y(F)})－${Y(X)}＝${yen(bd)}<br>操業度差異＝(${Y(A)}－${Y(N)})×固定費率＠${f}＝${yen(vd)}<br>総差異＝予定配賦額${Y((v+f)*A)}－${Y(X)}＝${yen(bd+vd)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-dept-direct',f:MC,ch:'第7章 部門別計算',t:'補助部門費の配賦（直接配賦法）',r:'A',g(){
  const a1=R.int(2,8)*100, b1=R.int(2,8)*100, m1=R.int(1,3)*100; const a2=R.int(2,8)*10, b2=R.int(2,8)*10, m2=R.int(1,4)*10;
  const X=(a1+b1)*R.int(2,8)*100, Yv=(a2+b2)*R.int(20,80)*100; const A0=R.int(100,400)*10000;
  const ans=A0+X*a1/(a1+b1)+Yv*a2/(a2+b2);
  return {q:P_('補助部門費を直接配賦法により製造部門に配賦する。第1製造部門の部門費（補助部門費配賦後）はいくらか。')+
    tbl([['部門個別費・共通費配賦後',A0,R.int(100,400)*10000,X,Yv],['動力供給量(kWh)',a1,b1,'—',m1],['修繕作業時間',a2,b2,m2,'—']],['','第1製造部門','第2製造部門','動力部','修繕部']),
    a:rd(ans),u:'円',w:[rd(A0+X*a1/(a1+b1+m1)+Yv*a2/(a2+b2+m2)),rd(A0+X*a1/(a1+b1)),rd(A0+Yv*a2/(a2+b2)),rd(A0+(X+Yv)*a1/(a1+b1)),rd(A0+X*a2/(a2+b2)+Yv*a1/(a1+b1))],
    ex:`直接配賦法では補助部門相互間の用役授受を無視し，製造部門の用役消費量の比で配賦する。<br>動力部費：${Y(X)}×${a1}/${a1+b1}＝${Y(rd(X*a1/(a1+b1)))}<br>修繕部費：${Y(Yv)}×${a2}/${a2+b2}＝${Y(rd(Yv*a2/(a2+b2)))}<br>${Y(A0)}＋上記＝<b>${Y(rd(ans))}円</b>`};
}});

C({id:'mg-dept-recip',f:MC,ch:'第7章 部門別計算',t:'補助部門費の配賦（相互配賦法・連立方程式法）',r:'B',adv:true,g(){
  const X=R.int(20,80)*10000, Yv=R.int(20,80)*10000;
  const s1=R.pick([[50,40,10],[40,40,20],[60,30,10],[45,35,20]]), s2=R.pick([[40,40,20],[50,30,20],[30,50,20],[45,45,10]]); // [A,B,他補助]
  const al=s1[2]/100, be=s2[2]/100; const S1=(X+be*Yv)/(1-al*be), S2=Yv+al*S1;
  const toA=rd(S1*s1[0]/100+S2*s2[0]/100);
  const direct=rd(X*s1[0]/(s1[0]+s1[1])+Yv*s2[0]/(s2[0]+s2[1]));
  return {q:P_(`補助部門費を相互配賦法（連立方程式法）により配賦する。動力部費は${Y(X)}円，修繕部費は${Y(Yv)}円である。用役の提供割合は，動力部：第1製造部門${s1[0]}%・第2製造部門${s1[1]}%・修繕部${s1[2]}%，修繕部：第1製造部門${s2[0]}%・第2製造部門${s2[1]}%・動力部${s2[2]}%である。第1製造部門に配賦される補助部門費の合計はいくらか（円未満四捨五入）。`),
    a:toA,u:'円',w:[direct,rd(X*s1[0]/100+Yv*s2[0]/100),rd(S1*s1[0]/100+Yv*s2[0]/100),rd((X+Yv)*s1[0]/100),rd(S1*s1[0]/(s1[0]+s1[1])+S2*s2[0]/(s2[0]+s2[1]))],
    ex:`動力部の配賦総額をx，修繕部をyとすると x＝${Y(X)}＋${be}y，y＝${Y(Yv)}＋${al}x<br>x＝${Y(rd(S1))}，y＝${Y(rd(S2))}<br>第1製造部門：x×${s1[0]}%＋y×${s2[0]}%＝<b>${Y(toA)}円</b>`};
}});

C({id:'mg-process',f:MC,ch:'第10章 単純総合原価計算',t:'月末仕掛品原価（平均法・先入先出法）',r:'A',g(){
  const q0=R.int(2,6)*100, p0=R.pick([0.4,0.5,0.6]), q1=R.int(2,6)*100, p1=R.pick([0.3,0.5,0.6,0.8]); const Q=R.int(15,40)*100; const qin=Q+q1-q0;
  const meth=R.pick(['平均法','先入先出法']);
  let DM0,CC0,DM,CC,wip,other;
  const u=R.int(20,80)*10, v=R.int(20,80)*10;
  DM0=q0*R.int(20,80)*10; CC0=q0*p0*R.int(20,80)*10;
  if(meth==='平均法'){ DM=u*(Q+q1)-DM0; CC=v*(Q+q1*p1)-CC0; if(DM<=0||CC<=0) throw 0; wip=q1*u+q1*p1*v; other=rd(DM*q1/(Q-q0+q1)+CC*q1*p1/(Q-q0*p0+q1*p1)); }
  else { DM=u*(Q-q0+q1); CC=v*(Q-q0*p0+q1*p1); wip=q1*u+q1*p1*v; other=rd((DM0+DM)*q1/(Q+q1)+(CC0+CC)*q1*p1/(Q+q1*p1)); }
  const tot=DM0+CC0+DM+CC;
  const ask=R.pick(['月末仕掛品原価','完成品総合原価']);
  const ans= ask==='月末仕掛品原価'?wip:tot-wip;
  return {q:P_(`単純総合原価計算を行っている。材料はすべて工程の始点で投入し，加工費は工程の進捗に応じて発生する。原価配分方法は${meth}による。${ask}はいくらか（円未満四捨五入）。`)+
    tbl([['月初仕掛品',`${q0}個（進捗度${p0*100}%）`,DM0,CC0],['当月投入',`${qin}個`,DM,CC],['完成品',`${Q}個`,'',''],['月末仕掛品',`${q1}個（進捗度${p1*100}%）`,'','']],['','数量','直接材料費','加工費']),
    a:ans,u:'円',w: ask==='月末仕掛品原価'?[other,rd(q1*u+q1*v),rd((DM0+DM)*q1/(Q+q1)+(CC0+CC)*q1/(Q+q1)),wip+rd(q1*p1*v*0.2)]:[tot-other,tot,tot-rd(q1*u+q1*v),DM+CC-wip],
    ex:`${meth==='平均法'?`平均法：(月初＋当月)の原価を(完成品＋月末仕掛品換算量)で按分。<br>直接材料費単価＝${Y(DM0+DM)}÷${Q+q1}＝＠${u}，加工費単価＝${Y(CC0+CC)}÷${Q+q1*p1}＝＠${v}`:`先入先出法：当月投入原価を(完成品－月初仕掛品換算量＋月末仕掛品換算量)で按分。<br>直接材料費単価＝${Y(DM)}÷${Q-q0+q1}＝＠${u}，加工費単価＝${Y(CC)}÷${Q-q0*p0+q1*p1}＝＠${v}`}<br>月末仕掛品＝${q1}×＠${u}＋${q1*p1}×＠${v}＝${Y(wip)}<br>完成品＝総原価${Y(tot)}－${Y(wip)}＝${Y(tot-wip)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'mg-spoilage',f:MC,ch:'第10章 単純総合原価計算',t:'正常仕損（度外視法）',r:'A',g(){
  const Q=R.int(15,40)*100, L=R.int(1,4)*50, q1=R.int(2,6)*100, p1=R.pick([0.4,0.5,0.6]); const where=R.pick(['終点','始点']);
  const u=R.int(20,80)*10, v=R.int(20,80)*10;
  let DM,CC,wip,alt;
  if(where==='終点'){ DM=u*(Q+L+q1); CC=v*(Q+L+q1*p1); wip=q1*u+q1*p1*v; alt=rd(DM*q1/(Q+q1)+CC*q1*p1/(Q+q1*p1)); }
  else { DM=u*(Q+q1); CC=v*(Q+q1*p1); wip=q1*u+q1*p1*v; alt=rd(DM*q1/(Q+L+q1)+CC*q1*p1/(Q+L+q1*p1)); }
  const tot=DM+CC; const ans=tot-wip;
  return {q:P_(`当月，材料${Q+L+q1}個を工程の始点で投入し（月初仕掛品なし），完成品${Y(Q)}個，正常仕損${L}個（工程の${where}で発生，評価額ゼロ），月末仕掛品${q1}個（進捗度${p1*100}%）であった。当月製造費用は直接材料費${Y(DM)}円，加工費${Y(CC)}円である。正常仕損費は度外視法により処理する。完成品総合原価はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w:[tot-alt,tot,wip,rd(tot*Q/(Q+L+q1)),tot-rd(q1*u+q1*v)],
    ex:`${where==='終点'?'終点発生の仕損は月末仕掛品（進捗度が終点未満）に負担させず，完成品のみが負担する。月末仕掛品の計算では仕損品数量を分母に含める。':'始点発生の仕損は完成品と月末仕掛品の両者に負担させる（度外視法では仕損品数量を分母から除いて按分する）。'}<br>月末仕掛品＝${Y(wip)}，完成品＝${Y(tot)}－${Y(wip)}＝<b>${Y(ans)}円</b>`};
}});

C({id:'mg-grade',f:MC,ch:'第13章 等級別総合原価計算',t:'等級別総合原価計算（等価係数）',r:'A',g(){
  const k=[1,R.pick([0.8,0.7,0.6]),R.pick([0.5,0.4])]; const n=[R.int(10,40)*100,R.int(10,40)*100,R.int(10,40)*100];
  const pts=n.map((x,i)=>x*k[i]); const tp=pts.reduce((a,b)=>a+b); const T0=tp*R.int(5,30)*10; const i=R.int(0,2); const nm=['A','B','C'];
  const ans=T0*pts[i]/tp;
  return {q:P_(`等級製品A・B・Cを製造している。当月の完成品総合原価は${Y(T0)}円であり，完成品数量はA ${Y(n[0])}個，B ${Y(n[1])}個，C ${Y(n[2])}個，等価係数はA ${k[0]}，B ${k[1]}，C ${k[2]}である。製品${nm[i]}の完成品原価はいくらか。`),
    a:rd(ans),u:'円',w:[rd(T0*n[i]/(n[0]+n[1]+n[2])),rd(T0*k[i]/(k[0]+k[1]+k[2])),rd(T0*pts[(i+1)%3]/tp),rd(T0*pts[i]/tp*1.1)],
    ex:`積数＝数量×等価係数：A ${Y(pts[0])}，B ${Y(pts[1])}，C ${Y(pts[2])}（合計${Y(tp)}）<br>${nm[i]}：${Y(T0)}×${Y(pts[i])}/${Y(tp)}＝<b>${Y(rd(ans))}円</b>`};
}});

C({id:'mg-joint',f:MC,ch:'第14章 連産品',t:'連産品（正常市価基準）',r:'A',g(){
  const pr=[]; for(const nm of ['X','Y','Z']){ const q=R.int(2,10)*100, p=R.int(10,50)*10, add=R.chance(0.6)?q*R.int(1,5)*10:0; pr.push({nm,q,p,add,nrv:q*p-add}); }
  const tot=pr.reduce((a,b)=>a+b.nrv,0); const J=tot*R.pick([0.5,0.6,0.7]); const i=R.int(0,2);
  const ans=J*pr[i].nrv/tot; const qsum=pr.reduce((a,b)=>a+b.q,0); const msum=pr.reduce((a,b)=>a+b.q*b.p,0);
  return {q:P_(`連産品X・Y・Zの結合原価${Y(J)}円を，分離点における見積正常市価の比で配賦する。製品${pr[i].nm}への結合原価配賦額はいくらか（円未満四捨五入）。`)+tbl(pr.map(o=>[o.nm,`${o.q}kg`,`＠${o.p}`,o.add]),['製品','生産量','最終製品の単位当たり正常市価','分離後の追加加工費']),
    a:rd(ans),u:'円',w:[rd(J*pr[i].q/qsum),rd(J*pr[i].q*pr[i].p/msum),rd(J*pr[(i+1)%3].nrv/tot),rd(ans+pr[i].add)],
    ex:`見積正常市価＝最終製品の正常市価－分離後の追加加工費：${pr.map(o=>`${o.nm} ${Y(o.nrv)}`).join('，')}（合計${Y(tot)}）<br>${pr[i].nm}：${Y(J)}×${Y(pr[i].nrv)}/${Y(tot)}＝<b>${Y(rd(ans))}円</b>`};
}});

C({id:'mg-std-dm',f:MC,ch:'第15章 標準原価計算',t:'直接材料費差異（価格差異・数量差異）',r:'A',g(){
  const ps=R.int(20,80)*10, qs=R.int(2,6); const N=R.int(5,20)*100; const Qa=qs*N+R.int(-15,15)*10; const pa=ps+R.int(-6,6)*10;
  const pv=(ps-pa)*Qa, qv=ps*(qs*N-Qa); const ask=R.pick(['価格差異','数量差異']);
  const ans= ask==='価格差異'?pv:qv;
  return {q:P_(`製品1個当たりの標準直接材料費は，標準単価＠${Y(ps)}円×標準消費量${qs}kgである。当月の実際生産量は${Y(N)}個（月初・月末仕掛品なし），直接材料の実際消費量は${Y(Qa)}kg，実際単価は＠${Y(pa)}円であった。直接材料費の${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w: ask==='価格差異'?[(ps-pa)*qs*N,-pv,pa*(qs*N-Qa),pv+qv]:[pa*(qs*N-Qa),-qv,(ps-pa)*Qa,pv+qv],
    ex:`価格差異＝(標準単価－実際単価)×実際消費量＝(${ps}－${pa})×${Y(Qa)}＝${yen(pv)}<br>数量差異＝標準単価×(標準消費量${Y(qs*N)}－実際消費量${Y(Qa)})＝${yen(qv)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-std-dl',f:MC,ch:'第15章 標準原価計算',t:'直接労務費差異（賃率差異・作業時間差異）',r:'A',g(){
  const rs=R.int(10,25)*100, hs=R.pick([0.5,1,1.5,2]); const N=R.int(5,30)*100; const S=hs*N; const Ha=S+R.int(-20,20)*10; const ra=rs+R.int(-10,10)*10;
  const rv=(rs-ra)*Ha, tv=rs*(S-Ha); const ask=R.pick(['賃率差異','作業時間差異']);
  const ans= ask==='賃率差異'?rv:tv;
  return {q:P_(`製品1個当たりの標準直接労務費は，標準賃率＠${Y(rs)}円×標準直接作業時間${hs}時間である。当月の完成品換算量は${Y(N)}個，実際直接作業時間は${Y(Ha)}時間，実際賃率は＠${Y(ra)}円であった。${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w: ask==='賃率差異'?[(rs-ra)*S,-rv,rv+tv,ra*(S-Ha)]:[ra*(S-Ha),-tv,rv+tv,(rs-ra)*Ha],
    ex:`標準作業時間＝${hs}×${Y(N)}＝${Y(S)}時間<br>賃率差異＝(${rs}－${ra})×実際${Y(Ha)}時間＝${yen(rv)}<br>作業時間差異＝${rs}×(${Y(S)}－${Y(Ha)})＝${yen(tv)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-std-oh',f:MC,ch:'第15章 標準原価計算',t:'製造間接費差異（四分法）',r:'A',g(){
  const N=R.int(20,60)*100; const v=R.int(3,10)*100, f=R.int(4,12)*100; const F=f*N; const S=N+R.int(-6,2)*100; const A=S+R.int(-3,3)*100; const X=v*A+F+R.int(-20,20)*10000;
  const bd=v*A+F-X, ve=v*(S-A), fe=f*(S-A), od=f*(A-N);
  const opts=[['予算差異',bd],['変動費能率差異',ve],['固定費能率差異',fe],['操業度差異',od]]; const [ask,ans]=R.pick(opts);
  return {q:P_(`製造間接費の標準配賦率は直接作業時間当たり＠${Y(v+f)}円（変動費率＠${v}円，固定費率＠${f}円），月間基準操業度は${Y(N)}時間（公式法変動予算）である。当月の標準直接作業時間は${Y(S)}時間，実際直接作業時間は${Y(A)}時間，製造間接費実際発生額は${Y(X)}円であった。四分法による${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w:[bd,ve,fe,od,(v+f)*(S-A),f*(S-N),-ans,(v+f)*S-X].filter(x=>x!==ans),
    ex:`予算差異＝(＠${v}×${Y(A)}＋${Y(F)})－${Y(X)}＝${yen(bd)}<br>変動費能率差異＝＠${v}×(${Y(S)}－${Y(A)})＝${yen(ve)}<br>固定費能率差異＝＠${f}×(${Y(S)}－${Y(A)})＝${yen(fe)}<br>操業度差異＝＠${f}×(${Y(A)}－${Y(N)})＝${yen(od)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-dc-ac',f:MC,ch:'第17章 直接原価計算',t:'全部原価計算と直接原価計算の営業利益の差（固定費調整）',r:'A',g(){
  const P=R.int(8,20)*100, S=P+R.int(-6,4)*100; const b=R.int(0,5)*100; const e=b+P-S; if(e<0) throw 0;
  const f=R.int(5,20)*10; const F=f*P; const f0=f+R.int(-4,4)*10; const DC=R.int(50,300)*10000;
  const AC=DC+e*f-b*f0;
  return {q:P_(`当期の直接原価計算による営業利益は${Y(DC)}円である。当期の生産量は${Y(P)}個，販売量は${Y(S)}個，期首製品在庫は${Y(b)}個（前期の固定製造間接費は1個当たり${Y(f0)}円），期末製品在庫は${Y(e)}個であった。当期の固定製造間接費は${Y(F)}円である。仕掛品はなく，製品の払出しは先入先出法による。全部原価計算による営業利益はいくらか。`),
    a:AC,u:'円',neg:true,w:[DC,DC-e*f+b*f0,DC+(e-b)*f,DC+e*f,DC+F-S*f],
    ex:`全部原価計算の営業利益＝直接原価計算の営業利益＋期末在庫に含まれる固定製造間接費－期首在庫に含まれる固定製造間接費<br>${Y(DC)}＋${Y(e)}×${f}－${Y(b)}×${f0}＝<b>${yen(AC)}円</b>`};
}});

C({id:'mg-job',f:MC,ch:'第9章 個別原価計算',t:'個別原価計算（完成品原価）',r:'A',g(){
  const rate=R.int(8,20)*100; const o=[];
  for(const no of ['#101','#102','#103']){ o.push({no,dm:R.int(10,60)*10000,dl:R.int(10,50)*10000,h:R.int(5,30)*10}); }
  const beg=R.int(10,40)*10000; const done=[0,1];
  const cost=i=>o[i].dm+o[i].dl+o[i].h*rate+(i===0?beg:0);
  const ans=cost(0)+cost(1);
  return {q:P_(`個別原価計算を採用している。製造間接費は直接作業時間当たり＠${Y(rate)}円で予定配賦する。#101は前月から繰り越された仕掛品（前月までの原価${Y(beg)}円）である。当月末に#101と#102が完成し，#103は未完成である。当月の完成品原価はいくらか。`)+tbl(o.map(x=>[x.no,x.dm,x.dl,x.h+'時間']),['指図書','当月直接材料費','当月直接労務費','当月直接作業時間']),
    a:ans,u:'円',w:[ans-beg,ans+cost(2),cost(0)+cost(2),ans-o[0].h*rate-o[1].h*rate,ans+beg],
    ex:`#101：${Y(beg)}＋${Y(o[0].dm)}＋${Y(o[0].dl)}＋${o[0].h}h×${rate}＝${Y(cost(0))}<br>#102：${Y(o[1].dm)}＋${Y(o[1].dl)}＋${o[1].h}h×${rate}＝${Y(cost(1))}<br>合計<b>${Y(ans)}円</b>（#103は月末仕掛品）`};
}});

C({id:'mg-cvp',f:MM,ch:'第19章 短期利益計画（CVP分析）',t:'損益分岐点・安全余裕率・経営レバレッジ',r:'A',g(){
  const cmr=R.pick([0.25,0.3,0.4,0.5]); const p=R.int(10,50)*100; const v=p*(1-cmr); const F=cmr*R.int(10,60)*1000000; const bep=F/cmr;
  const S=bep*R.pick([1.25,1.5,2,1.6]); const G=cmr*R.int(2,20)*1000000; const cm=S*cmr, oi=cm-F;
  const opts=[['損益分岐点売上高',bep,'円',0],['目標営業利益'+Y(G)+'円を達成する売上高',(F+G)/cmr,'円',0],['安全余裕率',(S-bep)/S*100,'%',1],['経営レバレッジ係数',cm/oi,'',2]];
  const [ask,ans,u,dp]=R.pick(opts);
  const w= ask==='損益分岐点売上高'?[F/(1-cmr),F/cmr*1.2,bep+G/cmr,F*cmr]: ask.startsWith('目標')?[G/cmr,F/cmr,(F+G)/(1-cmr),(F-G)/cmr]: ask==='安全余裕率'?[bep/S*100,(S-bep)/bep*100,cmr*100,100-cmr*100]:[oi/cm,S/oi,cm/F,oi/F];
  return {q:P_(`製品の販売単価は${Y(p)}円，単位当たり変動費は${Y(v)}円，年間固定費は${Y(F)}円である。当期の売上高は${Y(S)}円であった。${ask}はいくらか${dp?`（小数点以下第${dp}位を四捨五入）`:''}。`),
    a:ans,u,dp,w,
    ex:`貢献利益率＝(${Y(p)}－${Y(v)})÷${Y(p)}＝${cmr}<br>損益分岐点売上高＝${Y(F)}÷${cmr}＝${Y(bep)}<br>目標利益達成売上高＝(固定費＋目標利益)÷貢献利益率<br>安全余裕率＝(売上高－損益分岐点売上高)÷売上高<br>経営レバレッジ係数＝貢献利益${Y(cm)}÷営業利益${Y(oi)}<br>よって<b>${yen(ans,dp)}${u}</b>`};
}});

C({id:'mg-cvp-mix',f:MM,ch:'第19章 短期利益計画（CVP分析）',t:'複数製品の損益分岐点（セールス・ミックス一定）',r:'A',g(){
  const pA=R.int(10,40)*100, vA=pA*R.pick([0.5,0.6,0.7]), pB=R.int(10,40)*100, vB=pB*R.pick([0.4,0.5,0.6]); const a=R.int(1,4), b=R.int(1,4);
  const cmSet=a*(pA-vA)+b*(pB-vB); const sets=R.int(2,20)*100; const F=cmSet*sets; const ans=sets*(a*pA+b*pB);
  return {q:P_(`製品Aの販売単価${Y(pA)}円・単位当たり変動費${Y(vA)}円，製品Bの販売単価${Y(pB)}円・単位当たり変動費${Y(vB)}円である。販売数量の比率はA：B＝${a}：${b}で一定とし，共通固定費は${Y(F)}円である。損益分岐点における売上高（A・B合計）はいくらか。`),
    a:ans,u:'円',w:[rd(F/(((pA-vA)/pA+(pB-vB)/pB)/2)),rd(F/((pA-vA)/pA)),rd(F/((pB-vB)/pB)),sets*(pA+pB),rd(F/((a*(pA-vA)+b*(pB-vB))/(a*pA+b*pB))*1.1)],
    ex:`1セット（A${a}個＋B${b}個）の貢献利益＝${a}×${Y(pA-vA)}＋${b}×${Y(pB-vB)}＝${Y(cmSet)}<br>損益分岐点セット数＝${Y(F)}÷${Y(cmSet)}＝${Y(sets)}セット<br>売上高＝${Y(sets)}×(${a}×${Y(pA)}＋${b}×${Y(pB)})＝<b>${Y(ans)}円</b>`};
}});

C({id:'mg-opt-mix',f:MM,ch:'第24章 戦術的意思決定',t:'最適セールス・ミックス（制約条件が1つ）',r:'A',g(){
  const cA=R.int(10,40)*100, hA=R.int(2,6), cB=R.int(10,40)*100, hB=R.int(2,6); if(cA/hA===cB/hB) throw 0;
  const DA=R.int(5,20)*100, DB=R.int(5,20)*100; const H=Math.round((DA*hA+DB*hB)*R.pick([0.6,0.7,0.8])); const F=R.int(10,50)*100000;
  const plan=(order)=>{ let h=H, cm=0; for(const [c,hh,D] of order){ const q=Math.min(D,Math.floor(h/hh)); cm+=q*c; h-=q*hh; } return cm; };
  const A=[cA,hA,DA], B=[cB,hB,DB];
  const best=cA/hA>cB/hB?plan([A,B]):plan([B,A]); const byUnit=cA>cB?plan([A,B]):plan([B,A]); const worst=cA/hA>cB/hB?plan([B,A]):plan([A,B]);
  if(best===byUnit && best===worst) throw 0;
  return {q:P_(`製品A（単位当たり貢献利益${Y(cA)}円，機械作業時間${hA}時間/個，最大需要量${Y(DA)}個）と製品B（単位当たり貢献利益${Y(cB)}円，機械作業時間${hB}時間/個，最大需要量${Y(DB)}個）を製造販売している。月間の機械作業時間は${Y(H)}時間が上限であり，固定費は${Y(F)}円である。営業利益を最大にするセールス・ミックスのときの営業利益はいくらか。`),
    a:best-F,u:'円',neg:true,w:[byUnit-F,worst-F,best,DA*cA+DB*cB-F],
    ex:`制約条件である機械作業時間1時間当たりの貢献利益で優先順位を決める。A：${Y(cA)}÷${hA}＝${yen(cA/hA,1)}，B：${Y(cB)}÷${hB}＝${yen(cB/hB,1)}<br>優先製品を需要量まで生産し，残りの時間で他方を生産すると貢献利益${Y(best)}<br>営業利益＝${Y(best)}－${Y(F)}＝<b>${yen(best-F)}円</b>`};
}});

C({id:'mg-special',f:MM,ch:'第24章 戦術的意思決定',t:'特別注文の引受可否（差額原価収益分析）',r:'A',g(){
  const v=R.int(20,60)*100; const fu=R.int(5,20)*100; const q=v+R.int(-4,12)*100; const n=R.int(2,10)*100; const E=R.int(0,6)*50000;
  const d=n*(q-v)-E;
  return {q:P_(`当社は遊休生産能力を有している。製品の単位当たり製造原価は変動費${Y(v)}円，固定費配賦額${Y(fu)}円（固定費総額は注文の引受けにより変化しない）である。顧客から${Y(n)}個を1個${Y(q)}円で購入したいとの特別注文があり，引き受ける場合は専用治具の購入費${Y(E)}円が追加で発生する。この注文を引き受けた場合の差額利益はいくらか（増加はプラス，減少は△）。`),
    a:d,u:'円',neg:true,w:[n*(q-v-fu)-E,n*(q-v),n*(q-v)+E,n*(q-v-fu)],
    ex:`固定費配賦額は注文の有無で変わらない埋没原価であり無関連。<br>差額収益${Y(n*q)}－差額原価(変動費${Y(n*v)}＋治具${Y(E)})＝<b>${yen(d)}円</b>`};
}});

C({id:'mg-make-buy',f:MM,ch:'第24章 戦術的意思決定',t:'部品の自製か購入か',r:'A',g(){
  const n=R.int(10,50)*100; const dm=R.int(5,20)*100, dl=R.int(5,20)*100, voh=R.int(2,8)*100, foh=R.int(3,10)*100; const FA=R.int(0,10)*100000; const p=dm+dl+voh+R.int(-3,8)*100;
  const make=n*(dm+dl+voh)+FA, buy=n*p; const d=buy-make;
  return {q:P_(`部品${Y(n)}個を自製するか外部から購入するかを検討している。自製する場合の単位当たり原価は直接材料費${Y(dm)}円，直接労務費${Y(dl)}円，変動製造間接費${Y(voh)}円，固定製造間接費配賦額${Y(foh)}円である。固定製造間接費は購入しても発生するが，自製する場合に限り設備の賃借料${Y(FA)}円が追加で発生する。購入単価は${Y(p)}円である。購入原価と自製原価の差額（購入原価－自製原価）はいくらか（△はマイナス）。`),
    a:d,u:'円',neg:true,w:[buy-n*(dm+dl+voh+foh)-FA,buy-n*(dm+dl+voh),-d,buy-n*(dm+dl)-FA],
    ex:`自製の差額原価＝${Y(n)}×(${dm}＋${dl}＋${voh})＋賃借料${Y(FA)}＝${Y(make)}（固定製造間接費配賦額は無関連原価）<br>購入原価＝${Y(n)}×${p}＝${Y(buy)}<br>差額＝<b>${yen(d)}円</b>（${d>0?'自製が有利':d<0?'購入が有利':'同額'}）`};
}});

const annuity=(r,n)=>{let s=0;for(let t=1;t<=n;t++)s+=1/Math.pow(1+r/100,t);return Math.round(s*10000)/10000;};
C({id:'mg-npv',f:MM,ch:'第25章 戦略的意思決定（設備投資）',t:'設備投資の正味現在価値（税引後CF）',r:'A',g(){
  const n=R.pick([3,4,5]); const r=R.pick([6,8,10]); const t=R.pick([30,40]); const I=n*R.int(5,30)*1000000; const D=I/n;
  const Rv=R.int(20,80)*1000000, E=rd(Rv*R.pick([0.5,0.6,0.7]),100000); const cf=(Rv-E-D)*(1-t/100)+D; const fac=annuity(r,n);
  const npv=rd(cf*fac)-I; const ask=R.pick(['正味現在価値','各年度の税引後キャッシュ・フロー']);
  return {q:P_(`設備投資案を検討している。設備の取得原価は${Y(I)}円（耐用年数${n}年，残存価額ゼロ，定額法），毎年の売上収入は${Y(Rv)}円，現金支出費用は${Y(E)}円である。法人税率は${t}%，資本コストは${r}%，${r}%・${n}年の年金現価係数は${fac}とする。キャッシュ・フローは各年度末に生じるものとする。この投資案の${ask}はいくらか（円未満四捨五入）。`),
    a: ask==='正味現在価値'?npv:cf, u:'円', neg:true, w: ask==='正味現在価値'?[rd((Rv-E)*fac)-I,rd((Rv-E)*(1-t/100)*fac)-I,rd(cf*n)-I,rd((Rv-E-D)*(1-t/100)*fac)-I]:[(Rv-E)*(1-t/100),Rv-E-D,(Rv-E-D)*(1-t/100),(Rv-E)*(1-t/100)-D*t/100],
    ex:`税引後CF＝(収入${Y(Rv)}－現金支出${Y(E)})×(1－${t}%)＋減価償却費${Y(D)}×${t}%＝${Y(cf)}（タックス・シールドを加える）<br>正味現在価値＝${Y(cf)}×${fac}－${Y(I)}＝${yen(npv)}<br>よって<b>${yen(ask==='正味現在価値'?npv:cf)}円</b>`};
}});

C({id:'mg-payback',f:MM,ch:'第25章 戦略的意思決定（設備投資）',t:'回収期間法',r:'B',g(){
  const cfs=[R.int(10,40),R.int(10,40),R.int(10,40),R.int(10,40),R.int(10,40)].map(x=>x*1000000); const k=R.int(2,4);
  let cum=0; for(let i=0;i<k-1;i++)cum+=cfs[i]; const frac=R.pick([0.2,0.25,0.4,0.5,0.6,0.75,0.8]); const I=cum+cfs[k-1]*frac;
  const ans=(k-1)+frac; const avg=cfs.reduce((a,b)=>a+b)/5;
  return {q:P_(`投資額${Y(I)}円の投資案の各年度末のキャッシュ・インフローは，1年目${Y(cfs[0])}円，2年目${Y(cfs[1])}円，3年目${Y(cfs[2])}円，4年目${Y(cfs[3])}円，5年目${Y(cfs[4])}円である。累積法による回収期間は何年か（年度内のキャッシュ・フローは均等に生じると仮定し，小数点以下第3位を四捨五入）。`),
    a:ans,u:'年',dp:2,w:[I/avg,k,k-1,ans+0.5,I/cfs[0]],
    ex:`${k-1}年目までの累積回収額＝${Y(cum)}，未回収額＝${Y(I-cum)}<br>${k}年目：${Y(I-cum)}÷${Y(cfs[k-1])}＝${frac}年<br>回収期間＝${k-1}＋${frac}＝<b>${ans.toFixed(2)}年</b>`};
}});

C({id:'mg-sales-var',f:MM,ch:'第20章 予算管理',t:'売上高差異・販売数量差異の分析',r:'A',g(){
  const pb=R.int(10,40)*100, vb=pb*R.pick([0.5,0.6,0.7]); const qb=R.int(10,50)*100; const pa=pb+R.int(-5,5)*20; const qa=qb+R.int(-10,10)*50;
  const pv=(pa-pb)*qa, qvS=(qa-qb)*pb, qvC=(qa-qb)*(pb-vb);
  const opts=[['販売価格差異',pv],['販売数量差異（売上高の分析）',qvS],['販売数量差異（貢献利益の分析，予算の単位当たり貢献利益による）',qvC]]; const [ask,ans]=R.pick(opts);
  return {q:P_(`予算：販売単価${Y(pb)}円，販売数量${Y(qb)}個，単位当たり変動費${Y(vb)}円。実績：販売単価${Y(pa)}円，販売数量${Y(qa)}個。${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w:[pv,qvS,qvC,(pa-pb)*qb,(qa-qb)*pa,-ans].filter(x=>x!==ans),
    ex:`販売価格差異＝(実際単価－予算単価)×実際数量＝${yen(pv)}<br>販売数量差異（売上高）＝(実際数量－予算数量)×予算単価＝${yen(qvS)}<br>販売数量差異（貢献利益）＝(実際数量－予算数量)×予算単位貢献利益${Y(pb-vb)}＝${yen(qvC)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-ri',f:MM,ch:'事業部の業績評価',t:'事業部の投資利益率と残余利益',r:'A',g(){
  const I=R.int(10,50)*10000000; const roi=R.pick([12,15,18,20]); const P=I*roi/100; const c=R.pick([8,10]); const dI=R.int(2,10)*10000000; const r2=R.pick([c+1,c+2,roi-1]); const dP=dI*r2/100;
  const ri=P+dP-(I+dI)*c/100; const roiAfter=(P+dP)/(I+dI)*100;
  const ask=R.pick(['新規投資後の残余利益','新規投資後の投資利益率']);
  return {q:P_(`A事業部の投資額は${Y(I)}円，事業部利益は${Y(P)}円である。新規投資（投資額${Y(dI)}円，追加利益${Y(dP)}円）を検討している。資本コスト率は${c}%である。${ask}はいくらか${ask.includes('率')?'（%，小数点以下第2位を四捨五入）':''}。`),
    a: ask.includes('率')?roiAfter:ri, u: ask.includes('率')?'%':'円', dp: ask.includes('率')?1:0, neg:true,
    w: ask.includes('率')?[roi,r2,(roi+r2)/2,(P+dP)/I*100]:[P-I*c/100,dP-dI*c/100,P+dP-I*c/100,(P+dP)*(1-c/100)],
    ex:`残余利益＝事業部利益－投資額×資本コスト率＝${Y(P+dP)}－${Y(I+dI)}×${c}%＝${yen(ri)}<br>投資利益率＝${Y(P+dP)}÷${Y(I+dI)}＝${roiAfter.toFixed(1)}%<br>（新規投資の利益率${r2}%が資本コスト${c}%を上回るため残余利益は増加するが，現状の投資利益率${roi}%を下回る場合は事業部の投資利益率は低下する＝部分最適化の問題）`};
}});

C({id:'mg-eoq',f:MM,ch:'在庫管理',t:'経済的発注量',r:'B',g(){
  const Q=R.pick([100,200,300,400,500,600,800]); const H=R.pick([100,200,250,400,500]); const S=R.pick([1000,2000,2500,5000,8000]); const D=Q*Q*H/(2*S);
  if(!Number.isInteger(D)) throw 0;
  const ask=R.pick(['経済的発注量','経済的発注量で発注した場合の年間の発注費と保管費の合計']);
  const tc=H*Q/2+S*D/Q;
  return {q:P_(`材料の年間需要量は${Y(D)}個，1回当たりの発注費は${Y(S)}円，材料1個当たりの年間保管費は${Y(H)}円である。${ask}はいくらか。`),
    a: ask==='経済的発注量'?Q:tc, u: ask==='経済的発注量'?'個':'円', w: ask==='経済的発注量'?[Math.round(Math.sqrt(D*S/H)),Math.round(Math.sqrt(2*D*H/S)),Q*2,Math.round(Q/Math.SQRT2)]:[H*Q,S*D/Q,tc*2,H*Q/2],
    ex:`経済的発注量＝√(2×年間需要量×1回の発注費÷1個当たり年間保管費)＝√(2×${Y(D)}×${Y(S)}÷${Y(H)})＝${Y(Q)}個<br>このとき保管費＝${Y(H)}×${Q}/2＝${Y(H*Q/2)}，発注費＝${Y(S)}×${Y(D)}/${Q}＝${Y(S*D/Q)}（両者が等しくなる）<br>よって<b>${Y(ask==='経済的発注量'?Q:tc)}${ask==='経済的発注量'?'個':'円'}</b>`};
}});

C({id:'mg-hilo',f:MM,ch:'第19章 短期利益計画（原価予測）',t:'高低点法による原価分解',r:'A',g(){
  const v=R.int(2,15)*10; const F=R.int(20,80)*10000; const acts=R.shuffle([R.int(30,40),R.int(41,50),R.int(51,60),R.int(61,70),R.int(71,80),R.int(81,95)].map(x=>x*100));
  const mx=Math.max(...acts), mn=Math.min(...acts);
  const rows=acts.map((a,i)=>[`${i+1}月`,a+'時間',F+v*a+((a===mx||a===mn)?0:R.int(-5,5)*1000)]);
  const X=R.int(50,90)*100; const ask=R.pick(['月間固定費',`操業度${Y(X)}時間における原価の予測額`]);
  const ans= ask==='月間固定費'?F:F+v*X;
  return {q:P_(`過去6か月の機械稼働時間と製造間接費の実績は次のとおりである（異常値はない）。高低点法により原価分解したときの${ask}はいくらか。`)+tbl(rows,['月','機械稼働時間','製造間接費']),
    a:ans,u:'円',w: ask==='月間固定費'?[F+v*mn,F-v*100,(F+v*mx)-(v+10)*mx,Math.round(rows.reduce((s,r)=>s+r[2],0)/6)]:[F+v*mx,v*X,F+v*X+v*100,Math.round((F+v*mn)/mn*X)],
    ex:`変動費率＝(最高点原価－最低点原価)÷(最高操業度${mx}－最低操業度${mn})＝＠${v}<br>固定費＝最高点原価${Y(F+v*mx)}－＠${v}×${mx}＝${Y(F)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'mg-ratio',f:MM,ch:'第21章 経営分析',t:'財務比率の計算',r:'B',g(){
  const TA=R.int(50,200)*1000000; const EQ=rd(TA*R.pick([0.3,0.4,0.5,0.6]),1000000); const CA=rd(TA*R.pick([0.4,0.5,0.6]),1000000); const CL=rd(CA*R.pick([0.5,0.6,0.8]),1000000);
  const S=TA*R.pick([1.2,1.5,2]); const OP=rd(S*R.pick([0.05,0.08,0.1]),100000); const OR=OP-R.int(-5,5)*100000; const NI=rd(OR*0.65,100000);
  const opts=[['流動比率',CA/CL*100,'%',1],['自己資本比率',EQ/TA*100,'%',1],['自己資本利益率（ROE，当期純利益ベース）',NI/EQ*100,'%',1],['総資本経常利益率',OR/TA*100,'%',1],['総資本回転率',S/TA,'回',2],['売上高営業利益率',OP/S*100,'%',1]];
  const [ask,ans,u,dp]=R.pick(opts);
  return {q:P_(`期末の貸借対照表と当期の損益計算書から，${ask}を求めなさい（期末残高を用い，小数点以下第${dp+1}位を四捨五入）。`)+tbl([['総資産',TA],['流動資産',CA],['流動負債',CL],['純資産（自己資本）',EQ],['売上高',S],['営業利益',OP],['経常利益',OR],['当期純利益',NI]],['項目','金額']),
    a:ans,u,dp,w:opts.filter(o=>o[0]!==ask&&o[2]===u).map(o=>o[1]).concat([ans*1.1,ans*0.9]),
    ex:`流動比率＝流動資産÷流動負債，自己資本比率＝自己資本÷総資本，ROE＝当期純利益÷自己資本，総資本経常利益率＝経常利益÷総資本，総資本回転率＝売上高÷総資本，売上高営業利益率＝営業利益÷売上高<br>よって<b>${yen(ans,dp)}${u}</b>`};
}});

C({id:'mg-abc',f:MM,ch:'第28章 活動基準原価計算',t:'活動基準原価計算（ABC）',r:'B',g(){
  const pools=[['段取活動','段取回数',R.int(20,60)],['検査活動','検査回数',R.int(20,80)],['機械運転活動','機械時間',R.int(200,800)*10]];
  const rows=[]; let abc=0, tot=0; let mhA=0, mhT=0;
  for(const [nm,drv,n] of pools){ const rate=R.int(5,50)*100; const cost=rate*n; const a=Math.round(n*R.pick([0.2,0.3,0.4,0.6])); abc+=rate*a; tot+=cost; rows.push([nm,cost,drv,`${n}（うちA ${a}）`]); if(drv==='機械時間'){mhA=a;mhT=n;} }
  const trad=rd(tot*mhA/mhT);
  return {q:P_('活動基準原価計算により製品Aに配賦される製造間接費はいくらか。')+tbl(rows,['活動','活動原価','コスト・ドライバー','ドライバー総量']),
    a:abc,u:'円',w:[trad,rd(tot/2),rd(abc*1.15),rd(abc*0.85),trad+rd(abc-trad)*2],
    ex:`各活動のコスト・ドライバー・レート（活動原価÷ドライバー総量）×製品Aのドライバー量を合計して<b>${Y(abc)}円</b><br>（参考：機械時間のみを基準とする伝統的配賦では${Y(trad)}円）`};
}});

C({id:'mg-ccc',f:MM,ch:'第22章 資金管理とキャッシュ・フロー管理',t:'キャッシュ・コンバージョン・サイクル',r:'B',g(){
  const k=R.int(2,10); const S=365*k*1000000; const ar=R.int(30,90), inv=R.int(20,80), ap=R.int(20,70);
  const AR=ar*k*1000000, INV=inv*k*1000000, AP=ap*k*1000000; const ans=ar+inv-ap;
  return {q:P_(`年間売上高${Y(S)}円，売上債権${Y(AR)}円，棚卸資産${Y(INV)}円，仕入債務${Y(AP)}円である。回転日数はいずれも売上高を基準に1年＝365日として計算する。キャッシュ・コンバージョン・サイクル（日）はいくらか。`),
    a:ans,u:'日',neg:true,w:[ar+inv+ap,ar-inv+ap,ar+inv,inv-ap+ar/2],
    ex:`売上債権回転日数${ar}日＋棚卸資産回転日数${inv}日－仕入債務回転日数${ap}日＝<b>${ans}日</b>`};
}});

T:['原価計算基準は，原価計算の目的として，財務諸表作成目的，価格計算目的，原価管理目的，予算管理目的，基本計画設定目的を掲げている。',
'原価とは，経営における一定の給付にかかわらせて把握された財貨又は用役の消費を，貨幣価値的に表したものである。',

'原価計算制度は財務会計機構と有機的に結びつき常時継続的に行われる計算体系であり，特殊原価調査はこれに含まれない。'],

T({id:'mgt-concepts',f:MT,ch:'第1章 原価計算の目的と一般的基準',t:'原価の諸概念と原価要素の分類',r:'A',

'製品原価とは一定単位の製品に集計された原価をいい，期間原価とは一定期間における発生額を当期の収益に直接対応させて把握した原価をいう。',
'原価要素は，操業度との関連において固定費と変動費とに分類される。',
'原価要素は，製品との関連において直接費と間接費とに分類される。'],
F:[['予定価格を用いて計算した原価は，消費量が実際であっても実際原価には該当しない。','消費量が実際であれば実際原価の計算である。'],
['標準原価は，財貨の消費量を過去の実績の平均として予定したものであり，能率の尺度とはならない。','科学的・統計的調査に基づき能率の尺度となるように予定したものである。'],

F:[['材料の実際消費量は，原則として棚卸計算法によって計算する。','原則は継続記録法である。'],
['材料の購入原価に，購入事務・検収・保管などに要した内部材料副費を加算することは一切認められない。','必要ある場合には，内部材料副費の一部又は全部を加算することができる。'],
['間接工の賃金は，直接作業時間に賃率を乗じて直接労務費として計算する。','間接工の賃金は間接労務費である。'],
['賃率差異は，原則として期末の棚卸資産に配賦しなければならない。','原則として当年度の売上原価に賦課する。'],
['経費はいかなる場合も実際発生額で計算し，予定額によることは認められない。','必要ある場合には予定価格又は予定額によることができる。']]});

T({id:'mgt-overhead',f:MT,ch:'第6章 製造間接費',t:'製造間接費の配賦と基準操業度',r:'A',
T:['個別原価計算において，部門間接費は原則として予定配賦率をもって各指図書に配賦する。',
'予定配賦率は，一定期間における部門間接費予定額を，同期間における当該部門の予定配賦基準の総数で除して算定する。',
'基準操業度には，実際的生産能力，平均操業度（正常操業度），期待実際操業度（予定操業度）などがある。',
'実際的生産能力とは，理論的生産能力から機械の故障や段取替えなど不可避的な作業休止による減少分を差し引いた操業度である。',
'変動予算とは，予算期間に予期される範囲内の種々の操業度に対応して算定した予算をいう。'],
F:[['製造間接費の予定配賦によって生じた配賦差異は，原則として期末の仕掛品と製品に配賦しなければならない。','原則として当年度の売上原価に賦課する。'],
['理論的生産能力とは，機械の故障や段取替えなどの不可避的な作業休止を考慮した現実的な最大操業度である。','それは実際的生産能力の説明である。理論的生産能力は作業休止を考慮しない理論上の最大操業度である。'],
['公式法変動予算において，操業度差異は変動費の予算許容額と実際発生額との差額として把握される。','操業度差異は固定費率×(実際操業度－基準操業度)で把握される。'],
['期待実際操業度（予定操業度）は，数年間の平均的な販売量に基づいて決定される操業度である。','それは平均操業度（正常操業度）の説明である。期待実際操業度は次の1年間に予想される操業度である。'],
['予算差異は，製造間接費の実際発生額と予定配賦額との差額である。','それは配賦差異（総差異）である。予算差異は実際操業度における予算許容額と実際発生額との差額である。']]});

T({id:'mgt-dept',f:MT,ch:'第7章 部門別計算',t:'部門別計算',r:'A',
T:['原価部門は，製造部門と補助部門とに分けられる。',
'補助部門費の製造部門への配賦方法には，直接配賦法，階梯式配賦法，相互配賦法などがある。',
'直接配賦法は，補助部門間の用役の授受を無視し，補助部門費を製造部門にのみ配賦する方法である。',
'階梯式配賦法は，補助部門に順位を付け，上位の補助部門費を下位の補助部門と製造部門に配賦していく方法である。',
'部門個別費は原価部門に直課し，部門共通費は適当な配賦基準によって関係部門に配賦する。'],
F:[['補助部門費の配賦方法として原価計算基準が規定しているのは，相互配賦法のみである。','直接配賦法・階梯式配賦法・相互配賦法などがある。'],
['直接配賦法は，補助部門間相互の用役の授受を計算上すべて考慮するため，最も正確な方法である。','直接配賦法は補助部門間の用役授受を無視する方法である。'],
['階梯式配賦法では，他の補助部門への用役提供が少ない補助部門から先に配賦する。','他の補助部門へ用役を多く提供している補助部門を上位（先）とする。'],
['部門共通費は，特定の部門での発生が認識できるため，すべて直課しなければならない。','部門共通費は適当な配賦基準によって配賦する。'],
['単一基準配賦法とは，補助部門費を変動費と固定費に分け，それぞれ異なる配賦基準で配賦する方法である。','それは複数基準配賦法の説明である。']]});

T({id:'mgt-job',f:MT,ch:'第9章 個別原価計算',t:'個別原価計算',r:'A',
T:['個別原価計算は，種類を異にする製品を個別的に生産する生産形態に適用される。',
'個別原価計算では，特定製造指図書について個別的に直接費及び間接費を集計し，製品原価は指図書に集計された製造原価をもって計算する。',
'仕損が補修によって回復でき，補修指図書を発行する場合には，補修指図書に集計された製造原価を仕損費とする。',
'軽微な仕損については，仕損費を計上せず，単に仕損品の見積売却価額又は見積利用価額を当該指図書に集計された製造原価から控除するにとどめることができる。',
'仕損費は，当該指図書に賦課するほか，間接費として仕損の発生部門に賦課する方法もある。'],
F:[['個別原価計算は，標準規格製品を連続生産する生産形態に適用される。','それは総合原価計算の適用対象である。'],
['個別原価計算では，直接費・間接費の区別を行わず，すべてを期間原価として処理する。','直接費は指図書に直課し，間接費は配賦して製品原価とする。'],
['作業くずの評価額は，必ず雑益として処理しなければならない。','原則として発生部門の部門費から控除する（指図書の直接材料費・製造原価から控除することもある）。'],
['個別原価計算において，部門間接費は原則として実際配賦率をもって各指図書に配賦する。','原則は予定配賦率である。']]});

T({id:'mgt-process',f:MT,ch:'第10章 単純総合原価計算',t:'総合原価計算と仕損・減損',r:'A',
T:['総合原価計算は，同種製品を反復連続的に生産する生産形態に適用される。',
'加工費について月末仕掛品の完成品換算量を算定する場合には，進捗度を用いる。',
'正常な仕損が工程の終点で発生した場合，その仕損費は完成品のみに負担させる。',
'正常な仕損が工程の始点で発生した場合，その仕損費は完成品と月末仕掛品の数量の割合で両者に負担させる。',
'度外視法では，正常仕損費を別個に計算せず，良品に自動的に負担させる。'],
F:[['先入先出法では，月初仕掛品原価と当月製造費用の合計額を完成品と月末仕掛品に按分する。','それは平均法の説明である。先入先出法では当月製造費用を按分する。'],
['正常な仕損が工程の終点で発生した場合でも，月末仕掛品に仕損費を負担させなければならない。','終点発生の仕損費は完成品のみに負担させる。'],
['異常仕損費は，正常仕損費と同様に良品の原価に含める。','異常仕損費は非原価項目である。'],
['平均法では，月初仕掛品から優先的に完成したものとみなして計算する。','それは先入先出法の考え方である。平均法は月初分と当月投入分を区別せず平均単価で計算する。'],
['仕損品に評価額がある場合でも，その評価額は仕損費の計算上考慮しない。','仕損品の評価額は控除する。']]});

T({id:'mgt-special',f:MT,ch:'第11章〜第14章 工程別・組別・等級別・連産品',t:'工程別・組別・等級別総合原価計算と連産品',r:'B',
T:['工程別総合原価計算の累加法では，前工程の完成品原価を次工程の前工程費として次工程の製造費用に加算する。',
'組別総合原価計算では，組直接費は各組に直課し，組間接費は適当な配賦基準により各組に配賦する。',
'等級別総合原価計算は，同一工程において同種製品を連続生産するが，その製品を形状，大きさ，品位等によって等級に区別する場合に適用される。',
'連産品とは，同一工程において同一原料から生産される異種の製品であって，相互に主副を明確に区別できないものをいう。',
'副産物の価額は，原則として主産物の総合原価から控除する。'],
F:[['連産品の結合原価は，各連産品の生産量の割合でのみ按分しなければならない。','正常市価等を基準として定めた等価係数に基づき按分する。'],
['副産物の評価額は，主産物の総合原価に加算する。','主産物の総合原価から控除する。'],
['非累加法では，各工程の完成品原価を順次次工程に振り替えて計算する。','それは累加法の説明である。'],
['等級別総合原価計算は，異種製品を組別に連続生産する場合に適用される。','それは組別総合原価計算の説明である。'],
['連産品の按分に用いる正常市価は，分離後に追加加工を要する場合でも最終製品の市価をそのまま用いる。','分離後の加工費を控除した見積正常市価を用いる。']]});

T({id:'mgt-standard',f:MT,ch:'第15章 標準原価計算',t:'標準原価計算',r:'A',
T:['標準原価計算の目的には，原価管理，真実の原価としての棚卸資産価額及び売上原価の算定，予算編成への資料提供，記帳の簡略化・迅速化がある。',
'原価管理のために理想標準原価が用いられることがあるが，これは原価計算基準にいう制度としての標準原価ではない。',
'標準原価は，生産の基本条件や材料価格・賃率等に重大な変化が生じた場合には，現状に即するように改訂する。',
'標準原価計算制度における原価差異は，原則として当年度の売上原価に賦課する。',
'数量差異，作業時間差異，能率差異等であって異常な状態に基づくと認められるものは，非原価項目として処理する。'],
F:[['原価計算制度における標準原価には，理想標準原価も含まれる。','理想標準原価は制度としての標準原価ではない。'],
['標準原価は，いったん設定したら生産条件に重大な変化が生じても改訂してはならない。','重大な変化が生じた場合には改訂する。'],
['正常原価とは，比較的短期における予定操業度及び予定価格を前提として決定された原価をいう。','正常原価は，比較的長期の過去の実際数値を統計的に平準化し，将来のすう勢を加味した正常能率・正常操業度・正常価格に基づく原価である。'],
['標準原価計算制度において生じた原価差異は，すべて期末の仕掛品・製品に配賦しなければならない。','原則として当年度の売上原価に賦課する。'],
['直接材料費の価格差異は，材料の消費時にしか把握することができない。','材料の受入時に把握する方法（材料受入価格差異）もある。']]});

T({id:'mgt-variance',f:MT,ch:'第15章 標準原価計算',t:'原価差異の会計処理',r:'B',
T:['実際原価計算制度において予定価格等を用いた場合の原価差異は，原則として当年度の売上原価に賦課する。',
'材料受入価格差異は，当年度の材料の払出高と期末在高に配賦する。',
'予定価格等が不適当なため比較的多額の原価差異が生ずる場合には，当年度の売上原価と期末における棚卸資産に配賦する。',
'異常な状態に基づく原価差異は，非原価項目として処理する。'],
F:[['材料受入価格差異は，原則として当年度の売上原価に全額賦課する。','払出高と期末在高に配賦する。'],
['予定価格等が不適当なため比較的多額の原価差異が生じた場合でも，当年度の売上原価に全額賦課しなければならない。','売上原価と期末棚卸資産に配賦する。'],
['原価差異は，すべて営業外損益として処理する。','原則として売上原価に賦課し，異常なものは非原価項目とする。'],
['標準が不適当なため比較的多額の原価差異が生じた場合は，その差異を非原価項目とする。','売上原価と期末棚卸資産に配賦する。']]});

/* ---- 管理会計分野 ---- */
T({id:'mgt-dc',f:MN,ch:'第17章 直接原価計算',t:'直接原価計算',r:'A',
T:['直接原価計算は，原価を変動費と固定費に分解し，変動費のみで製品原価を計算し，固定費は期間原価として処理する計算方法である。',
'直接原価計算では，営業利益は販売量に応じて変化し，生産量の増減の影響を受けない。',
'直接原価計算はCVP関係を明らかにするため，短期利益計画に有用な情報を提供する。',
'直接原価計算を外部報告に用いる場合には，固定費調整を行い全部原価計算による利益に修正する必要がある。',
'全部原価計算では，販売量が一定でも生産量を増加させて在庫を積み増すことで，営業利益を増加させることができる。'],
F:[['直接原価計算では，固定製造間接費を製品原価に含め，販売時に費用化する。','固定製造間接費は期間原価として発生期に全額費用処理する。'],
['直接原価計算では，販売量が一定であっても生産量が増えると営業利益が増加する。','それは全部原価計算の特徴である。'],
['期末在庫量が期首在庫量より多い場合（単位当たり固定費一定），直接原価計算の営業利益は全部原価計算の営業利益より大きくなる。','固定費の一部が在庫に繰り越される全部原価計算の方が大きくなる。'],
['直接原価計算は，原価計算基準において財務諸表作成のための原価計算として原則的に認められている。','原価計算基準は全部原価計算を原則としている。'],
['直接原価計算における貢献利益とは，売上高から全部製造原価を差し引いた利益をいう。','貢献利益は売上高から変動費を差し引いた利益である。']]});

T({id:'mgt-cvp',f:MN,ch:'第19章 短期利益計画のための管理会計',t:'CVP分析',r:'A',
T:['損益分岐点売上高は，固定費を貢献利益率で除して算定する。',
'安全余裕率は，売上高が損益分岐点売上高をどれだけ上回っているかを示す比率であり，高いほど安全性が高い。',
'経営レバレッジ係数は貢献利益を営業利益で除して算定され，売上高の変化率に対する営業利益の変化率の倍率を示す。',
'損益分岐点比率と安全余裕率の合計は100%となる。',
'原価の固変分解の方法には，費目別精査法，高低点法，スキャッター・チャート法，最小自乗法などがある。'],
F:[['損益分岐点売上高は，固定費を変動費率で除して算定する。','貢献利益率（1－変動費率）で除す。'],
['安全余裕率が高いほど，売上高の減少に対する抵抗力は弱い。','安全余裕率が高いほど抵抗力は強い。'],
['経営レバレッジ係数は，営業利益を貢献利益で除して算定する。','貢献利益を営業利益で除す。'],
['高低点法では，最高点と最低点の実績に加え，全データの平均値も用いて変動費率を算定する。','最高操業度と最低操業度の2点のみを用いる。'],
['他の条件が一定であれば，変動費率が上昇すると損益分岐点売上高は低下する。','貢献利益率が低下するため損益分岐点売上高は上昇する。']]});

T({id:'mgt-budget',f:MN,ch:'第20章 予算管理',t:'予算管理',r:'A',
T:['予算は企業の総合的な利益計画を貨幣額で表示したものであり，計画・調整・統制の機能を有する。',
'総合予算は，経常予算と資本予算から構成され，経常予算はさらに損益予算と資金予算に分けられる。',
'参加型予算は，予算編成に下位の管理者を参加させる方式であり，予算目標に対する動機付けを高める効果が期待される。',
'予算スラックとは，管理者が予算を達成しやすくするため，収益を過小に，費用を過大に見積ることにより生じる予算の余裕をいう。',
'販売価格差異は，（実際販売価格－予算販売価格）×実際販売数量で算定する。'],
F:[['参加型予算では，予算スラックが生じる余地はないとされる。','参加型予算では下位管理者が情報を操作できるため，予算スラックが生じやすい。'],
['割当型（トップダウン型）予算は，下位管理者の動機付けを最も高める方式とされる。','下位管理者の受容性が低くなりやすく，動機付けの面では参加型予算が優れるとされる。'],
['販売数量差異は，（実際販売数量－予算販売数量）×実際販売価格で算定する。','予算販売価格（又は予算単位貢献利益）を乗じる。'],
['予算は計画機能を有するが，統制機能は有しない。','予算は統制機能も有する。'],
['ゼロベース予算は，前年度の予算額を基礎に増減を調整して予算を編成する方式である。','それは増分予算の説明である。ゼロベース予算は既存の活動も含めてゼロから見直す。']]});

T({id:'mgt-decision',f:MN,ch:'第23章〜第24章 意思決定',t:'意思決定のための原価概念',r:'A',
T:['差額原価とは，特定の意思決定の代替案の間で異なる原価をいい，意思決定にとって関連原価となる。',
'埋没原価とは，過去の意思決定によって既に発生し，いずれの代替案を選択しても変わらない原価であり，意思決定には無関連である。',
'機会原価とは，ある代替案を選択したことによって断念された他の代替案から得られたであろう最大の利益をいう。',

/* ============ 管理会計論・原価計算（計算）── 短答対策問題集 計算編①（第1章〜第6章）準拠の追加問題 ============ */
(()=>{
const CH1='第1章 費目別計算',CH2='第2章 部門別計算',CH3='第3章 個別原価計算',CH4='第4章 単純総合・工程別・追加材料',CH5='第5章 組別・等級別・連産品',CH6='第6章 標準原価計算';
const pc=x=>`${Math.round(x*100)}%`;
const sum=a=>a.reduce((x,y)=>x+y,0);
const fv=d=>`${yen(d)}円（${fav(d)}）`;
const RND='計算途中では端数処理を行わず，最終数値の円未満を四捨五入すること。';
const RNDK='計算途中では端数処理を行わず，最終数値の千円未満を四捨五入すること。';
function solve(A,b){ // ガウスの消去法
  const n=b.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<n;i++){ let p=i; for(let k=i+1;k<n;k++) if(Math.abs(M[k][i])>Math.abs(M[p][i])) p=k; [M[i],M[p]]=[M[p],M[i]];
    for(let k=0;k<n;k++){ if(k===i) continue; const f=M[k][i]/M[i][i]; for(let j=i;j<=n;j++) M[k][j]-=f*M[i][j]; } }
  return M.map((r,i)=>r[n]/r[i]);
}

// 問題1-1（H29Ⅱ, p.①-2）材料副費
C({id:'q-mg-matsub',f:MC,ch:CH1,t:'材料副費（購入原価の上限・下限，内部副費の予定配賦差異）',r:'A',g(){
  const P=R.int(20,60)*100000;
  const fee=R.int(5,20)*1000, frt=R.int(40,120)*1000, ins=R.int(2,9)*1000;
  const buy=R.int(30,70)*1000, chk=R.int(5,15)*1000, sto=R.int(10,30)*1000;
  const E=fee+frt+ins, I=buy+chk+sto;
  const rt=R.pick([1,1.5,2,2.5,3]); const Pan=R.int(20,60)*1000000; const Ban=Pan*rt/100;
  const app=P*rt/100, dv=app-I; if(dv===0) throw 0;
  const rows=R.shuffle([['買入手数料',fee],['購入事務費',buy],['検収費',chk],['引取運賃',frt],['運送保険料',ins],['保管費',sto]]);
  const ask=R.pick(['diff','max','var']);
  const data=P_('〔資料〕<br>1．材料Pの当月送状価額（購入代価）　'+Y(P)+'円<br>2．材料Pに関する材料副費の当月実際発生額')+tbl(rows.map(([n,v])=>[n,v]),['費目','金額（円）'])+
    P_(`3．材料Pに予定配賦する材料副費（材料引取費用以外の全ての材料副費）の年間予算額　${Y(Ban)}円<br>4．材料Pの年間予定購入代価（送状価額）　${Y(Pan)}円`);
  let q,a,w,neg=false,exx;
  const base=`材料副費は，材料引取費用（外部副費：買入手数料・引取運賃・運送保険料等）と内部材料副費（購入事務費・検収費・保管費等）に分けられる。「原価計算基準」十一(四)では，購入原価は購入代価に引取費用を必ず加算し，内部材料副費はその全部または一部を加算することができる（加算しないことも可）。<br>引取費用＝${Y(fee)}＋${Y(frt)}＋${Y(ins)}＝${Y(E)}，内部副費＝${Y(buy)}＋${Y(chk)}＋${Y(sto)}＝${Y(I)}<br>`;
  if(ask==='diff'){ q='材料副費の予定配賦を行わない場合，「原価計算基準」に照らして材料Pの購入原価として計算される金額の上限と下限の差額はいくらか。'; a=I; w=[E,E+I,app,I-sto,I+fee];
    exx=base+`上限＝購入代価＋引取費用＋内部副費の全額，下限＝購入代価＋引取費用（内部副費を算入しない）。<br>差額＝内部副費の実際額合計＝<b>${Y(I)}円</b>`; }
  else if(ask==='max'){ q='材料副費の予定配賦を行わない場合，「原価計算基準」に照らして材料Pの購入原価として計算される金額の上限はいくらか。'; a=P+E+I; w=[P+E,P+I,P+E+I-sto,P+E+app,P+frt+ins+I];
    exx=base+`上限＝${Y(P)}＋${Y(E)}＋${Y(I)}＝<b>${Y(a)}円</b>`; }
  else { q='材料引取費用以外の全ての材料副費について材料購入代価を配賦基準とし，一括して予定配賦を行う場合，材料Pに関連する当月の材料副費配賦差異はいくらか（有利差異はプラス，不利差異は△）。'; a=dv; neg=true; w=[-dv,app-(I+E),app-(I+fee),app-(I-sto),Ban/12-I];
    exx=base+`予定配賦率＝${Y(Ban)}÷${Y(Pan)}＝${rt}%<br>予定配賦額＝${Y(P)}×${rt}%＝${Y(app)}<br>配賦差異＝予定配賦額${Y(app)}－内部副費実際額${Y(I)}＝<b>${yen(dv)}円</b>（${fav(dv)}）<br>※引取費用は予定配賦の対象外なので差異計算に含めない。`; }
  return {q:P_(q)+data,a,u:'円',neg,w,ex:exx};
}});

// 問題1-4（H27Ⅰ, p.①-9）材料費：購入原価（引取運賃・内部副費）と先入先出法
C({id:'q-mg-matfifo',f:MC,ch:CH1,t:'材料費（購入原価の算定・先入先出法・棚卸減耗費）',r:'A',g(){
  const q0=R.int(3,8)*10, c0=R.int(28,36)*10; const q1=R.int(60,120)*10; const p1=R.int(13,17)*20; const s=R.pick([5,10]); const t=R.int(10,30);
  const pi=p1*s/100, c1=p1+pi+t;
  const x=[R.int(10,30)*10,R.int(20,40)*10,R.int(10,40)*10]; const X=sum(x); const be=q0+q1-X; if(X<=q0||be<30||be>q1) throw 0;
  const d=R.int(1,Math.min(5,Math.floor(be/10)-1)); if(d<1) throw 0;
  const fifo=c=>q0*c0+(X-q0)*c;
  const dm=fifo(c1), loss=d*c1, avg=rd(X*(q0*c0+q1*c1)/(q0+q1));
  const ask=R.pick(['dm','loss']);
  const q=P_(`当工場では個別原価計算を実施している。次の〔資料〕に基づき，当月の${ask==='dm'?'製造指図書#10・#11・#12の直接材料費の合計額':'材料Aの棚卸減耗費'}を計算しなさい。材料の払出単価の計算は先入先出法による。`)+
    tbl([['月初有高',`＠${Y(c0)}円　${q0}kg`],['当月購入単価（購入代価）',`＠${Y(p1)}円`],['当月購入数量',`${Y(q1)}kg`],['当月購入分の引取運賃',`${Y(q1*t)}円`],['当月購入分の内部副費',`購入代価の${s}%`],['当月消費量',`#10　${x[0]}kg<br>#11　${x[1]}kg<br>#12　${x[2]}kg`],['月末実地棚卸数量',`${Y(be-d)}kg`],['棚卸減耗の発生','正常の範囲']],['材料Aに関するデータ','（直接材料）'])+
    P_('（注）内部副費は購入原価に含まれる。');
  const a= ask==='dm'?dm:loss;
  const w= ask==='dm'?[fifo(p1+t),fifo(p1+pi),fifo(p1),avg,dm+loss]:[d*c0,d*(p1+t),d*(p1+pi),rd(d*(q0*c0+q1*c1)/(q0+q1)),d*p1];
  return {q,a,u:'円',w,
    ex:`当月購入単価＝購入代価＠${p1}＋内部副費＠${p1*s/100}（${s}%）＋引取運賃＠${t}（${Y(q1*t)}÷${Y(q1)}kg）＝＠${Y(c1)}<br>`+
      (ask==='dm'?`消費量合計${Y(X)}kg（先入先出法）：月初${q0}kg×＠${c0}＋当月購入分${Y(X-q0)}kg×＠${c1}＝<b>${Y(dm)}円</b>`
      :`帳簿棚卸数量＝${q0}＋${Y(q1)}－${Y(X)}＝${Y(be)}kg（すべて当月購入分）<br>棚卸減耗＝${Y(be)}－${Y(be-d)}＝${d}kg<br>棚卸減耗費＝${d}kg×＠${c1}＝<b>${Y(loss)}円</b>（正常なので間接経費）`)};
}});

// 問題1-6（R3, p.①-16）労務費：予定賃率・未払賃金・間接労務費
C({id:'q-mg-wage',f:MC,ch:CH1,t:'労務費（予定賃率・未払賃金の調整・間接労務費）',r:'A',g(){
  const r=R.int(10,16)*100; const h1=R.int(50,80)*100, h2=R.int(3,8)*100, h3=R.int(2,6)*100, h4=R.int(1,3)*100, h5=R.int(1,3)*100; const H=h1+h2+h3+h4;
  const u0=R.int(250,400)*10000, u1=R.int(250,400)*10000; const act=r*H+R.int(-20,20)*2000; if(act===r*H) throw 0; const W=act+u0-u1;
  const V=R.int(500,900)*10000, ho=R.int(40,100)*10, ro=R.int(25,40)*10, v0=R.int(20,35)*10000, v1=R.int(20,35)*10000; if(v0===v1) throw 0; const ind=V+ho*ro-v0+v1;
  const S=R.int(100,160)*10000, Bn=R.int(80,120)*10000, Rt=R.int(60,100)*10000, Lf=R.int(20,40)*10000, K=R.int(300,600)*1000+R.int(1,9)*100, Fs=R.int(20,40)*10000;
  const indL=(h3+h4)*r+ind+S+Bn+Rt+Lf, rv=r*H-act, dl=(h1+h2)*r;
  const ask=R.pick(['ind','rv','dl']);
  const q=P_(`当工場では，毎月20日から翌月21日までを工場従業員の給与計算期間とし，毎月25日に給与の支払いを行っている。次の〔資料〕に基づき，当月の${ask==='ind'?'間接労務費':ask==='rv'?'賃率差異（有利差異はプラス，不利差異は△）':'直接労務費'}を計算しなさい。`)+
    P_(`〔資料〕<br>(1) 直接工：基本給支払額${Y(W)}円，加工時間${Y(h1)}時間，段取時間${Y(h2)}時間，間接作業時間${Y(h3)}時間，手待時間${Y(h4)}時間，定時休憩時間${Y(h5)}時間，予定賃率${Y(r)}円/時間。前月賃金未払額${Y(u0)}円，当月賃金未払額${Y(u1)}円<br>`+
      `(2) 間接工：基本給支払額${Y(V)}円，残業時間${Y(ho)}時間，残業手当の実際割増賃率${Y(ro)}円/時間。前月賃金未払額${Y(v0)}円，当月賃金未払額${Y(v1)}円<br>`+
      `(3) その他：工場事務員給料${Y(S)}円，従業員賞与手当${Y(Bn)}円，退職給付費用${Y(Rt)}円，法定福利費${Y(Lf)}円，厚生費${Y(K)}円，福利施設負担額${Y(Fs)}円`);
  const a= ask==='ind'?indL: ask==='rv'?rv: dl;
  const w= ask==='ind'?[indL+K+Fs,indL-h4*r,indL+h2*r,indL-ind+V+ho*ro,indL+K,indL-(-v0+v1)*2]
         : ask==='rv'?[r*(H+h5)-act,r*H-W,r*H-(W+u0-u1),-rv,r*(h1+h2)-act]
         : [h1*r,(h1+h2+h4)*r,H*r,(H+h5)*r,(h1+h2)*r+h4*r/2];
  return {q,a,u:'円',neg:ask==='rv',w,
    ex:`直接工の実際消費賃金＝支払${Y(W)}－前月未払${Y(u0)}＋当月未払${Y(u1)}＝${Y(act)}<br>`+
      `就業時間（定時休憩を除く）＝${Y(h1)}＋${Y(h2)}＋${Y(h3)}＋${Y(h4)}＝${Y(H)}時間→予定消費額${Y(r*H)}<br>`+
      `直接労務費＝直接作業時間（加工＋段取）${Y(h1+h2)}時間×＠${r}＝${Y(dl)}<br>`+
      `賃率差異＝${Y(r*H)}－${Y(act)}＝${fv(rv)}<br>`+
      `間接工の実際消費額＝${Y(V)}＋残業手当${Y(ho*ro)}－${Y(v0)}＋${Y(v1)}＝${Y(ind)}<br>`+
      `間接労務費＝直接工の間接作業・手待${Y((h3+h4)*r)}＋間接工${Y(ind)}＋事務員給料${Y(S)}＋賞与手当${Y(Bn)}＋退職給付費用${Y(Rt)}＋法定福利費${Y(Lf)}＝${Y(indL)}（厚生費・福利施設負担額は経費）<br>よって<b>${yen(a)}円</b>`};
}});

// 問題1-8（p.①-23）経費の計算（測定・月割・支払経費）
C({id:'q-mg-expense',f:MC,ch:CH1,t:'経費の計算（測定経費・月割経費・支払経費）',r:'B',g(){
  const m1=R.int(50,70)*100, m2=m1+R.int(3,6)*100, m3=m2+R.int(12,18)*100, m4=m3+R.int(4,8)*100;
  const unit=R.int(2,12), base=R.int(1,5)*1000, pay=base+unit*(m3-m1), elec=base+unit*(m4-m2);
  const Cm=R.int(30,90)*100000, n=R.pick([5,6,8,10]); const dep=Cm*0.9/n/12; if(!Number.isInteger(dep)) throw 0;
  const Pr=R.int(20,40)*10000, a0=R.int(5,20)*1000, b0=R.int(5,15)*10000; const rep=Pr-a0+b0;
  const insA=R.int(60,200)*12000; const ins=insA/12;
  const ans=elec+dep+rep+ins;
  const u2=pay/(m3-m1);
  return {q:P_('以下の〔資料〕に基づき，当原価計算期間（当月1日〜末日）に帰属する経費の金額を計算しなさい。')+
    P_('〔資料〕<br>1．電力料データ<br>(1) 電力メーターの数値')+tbl([[`${Y(m1)}kWh`,`${Y(m2)}kWh`,`${Y(m3)}kWh`,`${Y(m4)}kWh`]],['前月25日','前月末日','当月25日','当月末日'])+
    P_(`(2) 当月の支払電力料金は${Y(pay)}円であり，毎月25日の検針に基づいている。<br>(3) 電力料金の基本料金は月額${Y(base)}円である。<br>2．機械に関するデータ<br>(1) 工場用機械の取得原価は${Y(Cm)}円，残存価額10%，耐用年数${n}年の定額法で減価償却している。<br>(2) 当月に機械の修繕料${Y(Pr)}円を支払った。修繕料の前月未払額は${Y(a0)}円，当月未払額は${Y(b0)}円である。<br>(3) 上記機械の保険料が年間で${Y(insA)}円発生する。`),
    a:ans,u:'円',w:[pay+dep+rep+ins,elec-base+dep+rep+ins,elec+Cm/n/12+rep+ins,elec+dep+Pr+ins,elec+dep+(Pr+a0-b0)+ins,rd(u2*(m4-m2))+dep+rep+ins],
    ex:`電力料（測定経費）：従量単価＝(${Y(pay)}－基本料金${Y(base)})÷(${Y(m3)}－${Y(m1)})kWh＝＠${unit}<br>当月分＝${Y(base)}＋＠${unit}×(${Y(m4)}－${Y(m2)})＝${Y(elec)}<br>`+
      `減価償却費（月割経費）＝${Y(Cm)}×0.9÷${n}年÷12＝${Y(dep)}<br>修繕料（支払経費）＝${Y(Pr)}－前月未払${Y(a0)}＋当月未払${Y(b0)}＝${Y(rep)}<br>保険料（月割経費）＝${Y(insA)}÷12＝${Y(ins)}<br>合計＝<b>${Y(ans)}円</b>`};
}});

// 問題1-13（R2Ⅰ, p.①-39）製造間接費の集計と固定予算による差異分析
C({id:'q-mg-ohfixed',f:MC,ch:CH1,t:'製造間接費の集計と差異分析（固定予算）',r:'B',g(){
  const N=12*R.int(20,30)*100, rate=R.int(12,20)*100, B=rate*N, Bm=B/12; const A=N/12+R.int(-25,5)*10; if(A===N/12) throw 0;
  const d0=R.int(40,70)*1000, un=R.int(10,25)*1000, loss=d0-un;
  const ip=R.int(55,90)*10000, i0=R.int(20,40)*10000, i1=R.int(20,40)*10000; const iw=ip-i0+i1;
  const tr=R.int(8,15)*10000+R.int(1,9)*1000;
  const dA=R.int(12,24)*120000, dC=R.int(30,70)*120000;
  const mp=R.int(60,90)*10000, m0=R.int(20,40)*10000, m1=R.int(15,30)*10000; const mr=mp-m0+m1;
  const gp=R.int(70,90)*10000, g0=R.int(10,20)*10000, g1=R.int(20,30)*10000;
  const ep=R.int(90,110)*10000, em=ep+R.int(-5,5)*1000; if(em===ep) throw 0;
  const others=loss+iw+tr+dC/12+mr+em; const target=Bm+R.int(-60,60)*1000; if(target===Bm) throw 0;
  const sub=target-others; if(sub<150000||sub>1500000) throw 0; const bp=sub+R.int(-8,8)*1000+50000;
  const X=others+sub, bd=Bm-X, vd=rate*A-Bm;
  const BE=R.int(300,400)*10000; const AE=BE-d0;
  const Xs=[X+un,X-sub+bp,X-em+ep,X+dA/12,X+gp-g0+g1];
  const ask=R.pick(['X','bd','vd']);
  const a= ask==='X'?X: ask==='bd'?bd: vd;
  const w= ask==='X'?Xs: ask==='bd'?[...Xs.slice(0,3).map(x=>Bm-x),-bd,rate*A-X]: [rate*(N/12-A),rate*A-X,bd,Bm-rate*A+bd,-vd];
  return {q:P_(`当社は実際全部原価計算のもとで製造間接費を製品に予定配賦している。次の〔資料〕に基づき，当月の${ask==='X'?'製造間接費の実際発生額':ask==='bd'?'製造間接費の予算差異（有利差異はプラス，不利差異は△）':'製造間接費の操業度差異（有利差異はプラス，不利差異は△）'}を計算しなさい。`)+
    P_(`〔資料〕<br>(1) 主要材料：月末帳簿棚卸高${Y(BE)}円，月末実地棚卸高${Y(AE)}円。調査の結果，差額のうち${Y(un)}円は払出しの記帳漏れ（直接材料の未記帳分）であることが判明した。残額は正常な棚卸減耗である。<br>`+
      `(2) 補助材料：当月購入額${Y(bp)}円，当月消費額${Y(sub)}円<br>(3) 間接工賃金：当月支払額${Y(ip)}円，前月末未払額${Y(i0)}円，当月末未払額${Y(i1)}円<br>(4) 工場総務部員の出張旅費：${Y(tr)}円<br>`+
      `(5) 特定製品の製造のための専用機械の減価償却費：年額${Y(dA)}円<br>(6) 共用機械の減価償却費：年額${Y(dC)}円<br>(7) 共用機械修繕費：当月支払額${Y(mp)}円，前月末未払額${Y(m0)}円，当月末未払額${Y(m1)}円<br>`+
      `(8) 外注加工賃：当月支払額${Y(gp)}円，前月末未払額${Y(g0)}円，当月末未払額${Y(g1)}円<br>(9) 工場電力料：当月支払額${Y(ep)}円，測定量に基づく当月発生額${Y(em)}円<br>`+
      `(10) 製造間接費予算：${Y(B)}円（年額・固定予算）<br>(11) 基準操業度：${Y(N)}時間（年間）<br>(12) 当月の実際操業度：${Y(A)}時間`),
    a,u:'円',neg:ask!=='X',w,
    ex:`実際発生額＝棚卸減耗費${Y(loss)}（記帳漏れ${Y(un)}は直接材料費）＋補助材料消費額${Y(sub)}＋間接工賃金${Y(iw)}＋出張旅費${Y(tr)}＋共用機械減価償却費${Y(dC/12)}＋修繕費${Y(mr)}＋電力料（測定額）${Y(em)}＝${Y(X)}<br>※専用機械の減価償却費・外注加工賃は直接経費。<br>`+
      `予定配賦率＝${Y(B)}÷${Y(N)}＝＠${rate}，月間予算＝${Y(Bm)}<br>予算差異＝${Y(Bm)}－${Y(X)}＝${fv(bd)}<br>操業度差異＝＠${rate}×${Y(A)}－${Y(Bm)}＝${fv(vd)}<br>よって<b>${yen(a)}円</b>`};
}});

// 問題1-14（p.①-42）基準操業度の選択と予定配賦率
C({id:'q-mg-basecap',f:MC,ch:CH1,t:'基準操業度の選択と予定配賦率・操業度差異',r:'C',g(){
  const ms=R.shuffle([15,16,18,20,24,30]).slice(0,4).sort((a,b)=>b-a); const u=1200;
  const Nt=ms[0]*u, Np=ms[1]*u; const [s1,s2]=R.shuffle([ms[2],ms[3]]); const Ns=s1*u, Nn=s2*u;
  const k=R.int(50,100); const F=864000*k; const v=R.int(10,30)*100; const V=v*Ns;
  const A=Ns/12+R.int(-30,10)*5; if(A===Ns/12) throw 0;
  const L=R.pick([['原価計算基準が原則として採用することと規定する基準操業度',Ns],['4種類の操業度のうち，最も大きな金額の不利な操業度差異が生じるもの',Nt],['実際的生産能力',Np],['正常操業度',Nn]]);
  const N=L[1]; const ask=R.pick(['rate','vd']);
  const rt=x=>v+F/x, vd=x=>F/x*(A-x/12);
  const lv=[Nt,Np,Ns,Nn].filter(x=>x!==N);
  const a= ask==='rate'?rt(N):vd(N);
  const w= ask==='rate'?[...lv.map(rt),V/N+F/N,F/N]: [...lv.map(vd),rt(N)*(A-N/12),-vd(N),(V/N+F/N)*(A-N/12)];
  const nm={[Nt]:'理論的最大操業度',[Np]:'実現可能最大操業度（実際的生産能力）',[Ns]:'短期予定操業度（期待実際操業度）',[Nn]:'正常操業度'};
  return {q:P_(`次の〔資料〕に基づき，「${L[0]}」を基準操業度として採用した場合の${ask==='rate'?'製造間接費の予定配賦率（円/時間）':'当月の操業度差異（有利差異はプラス，不利差異は△）'}を計算しなさい。製造間接費の管理は公式法変動予算による。`)+
    P_('〔資料〕<br>1．短期予定操業度における年間製造間接費予算額')+tbl([['固定費',F],['変動費',V]],['','金額（円）'])+
    P_('2．基準操業度（年間）')+tbl([[nm[Nt],`${Y(Nt)}h`],[nm[Np],`${Y(Np)}h`],[nm[Ns],`${Y(Ns)}h`],[nm[Nn],`${Y(Nn)}h`]])+
    P_(`3．月間の基準操業度は年間の1/12とする。当月の実際操業度は${Y(A)}hである。変動費はいずれの操業度においても操業度に比例して増減し，固定費はいずれの操業度においても一定額発生する。`),
    a,u:ask==='rate'?'円/h':'円',neg:ask==='vd',w,
    ex:`変動費率＝${Y(V)}÷短期予定操業度${Y(Ns)}h＝＠${v}（どの基準操業度でも同じ）<br>`+
      `「原価計算基準」は予定配賦率の基礎として期待実際操業度（短期予定操業度）を原則とする。固定費率は基準操業度が大きいほど小さく，操業度差異（不利）は理論的最大操業度で最大となる。<br>`+
      `採用する基準操業度＝${Y(N)}h → 固定費率＝${Y(F)}÷${Y(N)}＝＠${F/N}，予定配賦率＝＠${v}＋＠${F/N}＝＠${rt(N)}<br>`+
      `操業度差異＝＠${F/N}×(${Y(A)}－${Y(N/12)})＝${fv(vd(N))}<br>よって<b>${yen(a)}${ask==='rate'?'円/h':'円'}</b>`};
}});
