  const q=P_(`当期末（X3年3月31日）の有価証券の保有状況は次のとおりである。期末の貸借対照表の流動資産の区分に計上される有価証券の金額はいくらか（単位：千円）。有価証券の発生の認識は修正受渡日基準による。`)+
    tbl([['A社株式','売買目的有価証券',a0,a1],['B社株式','売買目的有価証券','（？）',b1],['C社社債','満期保有目的の債券','（？）','―'],['D社株式','関連会社株式',d0,d1],['E社株式','その他有価証券',e0,e1]],['銘柄','保有目的','帳簿価額','期末時価'])+
    `<p>1．B社株式は，X3年3月30日に${Y(b0)}千円で購入の約定をしたものである（受渡日はX3年4月2日）。<br>2．C社社債（償還期間${n}年）は，X1年4月1日の発行と同時に額面${Y(F)}千円を${Y(P)}千円で取得したものであり，差額は金利調整差額と認められるため償却原価法（定額法）を適用している。<br>3．D社株式はD社の発行済株式の25%を保有するものである。</p>`;
  return {q,a:ans,u:'千円',w:[a1+b1+(cur?amC:0),a1+(b1-b0)+(cur?bookC:amC),a1+(b1-b0)+(cur?0:amC),a0+(b1-b0)+(cur?amC:0),ans+e1,a1+(b1-b0)+(cur?F:bookC)],
    ex:`A社株式：時価${Y(a1)}<br>B社株式：修正受渡日基準では約定日に買手は有価証券を計上せず，決算日には約定価格との評価差額のみ計上 → ${Y(b1)}－${Y(b0)}＝${Y(b1-b0)}<br>C社社債：償還日はX${1+n}年3月31日。${cur?`決算日から1年以内に満期が到来するため流動資産。償却原価＝${Y(P)}＋${Y(disc)}×24/${n*12}＝${Y(amC)}`:'満期まで1年超のため投資その他の資産（流動資産に含めない）'}<br>D社株式・E社株式は固定資産（投資その他の資産）。<br>合計＝<b>${Y(ans)}千円</b>`};
}});

C({id:'q-fa-sec-pl-total',f:FA,ch:'第9章 有価証券',t:'保有目的別の株式売却損益・評価損益の合計（洗替・部分純資産直入・外貨建）',r:'A',g(){
  const r10=(a,b)=>R.int(a,b)*10;
  const ca=r10(40,60), pa=ca+r10(-5,15), sa=pa+r10(-5,12);
  const cb=r10(20,40), pb=cb+r10(5,25), eb=pb+r10(-10,8);
  const cc=R.int(5,12), ec=cc+R.pick([-2,-1,1,2]), HR=R.int(108,118), CR=HR+R.pick([-6,-5,-4,-3,3,4,5]);
  const cd=r10(250,350), pd=cd+r10(50,150), ed=pd+r10(-10,20);
  const ce=r10(80,120), pe=ce+r10(10,40), se=ce+r10(-30,50);
  const cf=r10(200,260), pf=cf-r10(1,10), ef=rd(cf*R.pick([0.35,0.4,0.45]),10);
  const cg=r10(60,80), pg=cg+r10(5,20), sgv=cg+r10(10,40);
  const ch=r10(50,70), ph=ch-r10(1,10), eh=ch-r10(5,20);
  const ci=r10(70,90), ei=ci+r10(5,20);
  const effA=sa-pa, effB=eb-pb, fxC=ec*CR-cc*HR, effE=se-ce, effF=ef-cf, effG=sgv-cg, effH=eh-ch;
  const ans=effA+effB+fxC+effE+effF+effG+effH;
  if(ans===0) throw 0;
  const rows=[['A株式','売買目的',ca,pa,sa,'―'],['B株式','売買目的',cb,pb,'―',eb],['C株式','売買目的',`${cc}千ドル`,'―','―',`${ec}千ドル`],['D株式','子会社',cd,pd,'―',ed],['E株式','関連会社',ce,pe,se,'―'],['F株式','関連会社',cf,pf,'―',ef],['G株式','その他',cg,pg,sgv,'―'],['H株式','その他',ch,ph,'―',eh],['I株式','その他',ci,'―','―',ei]];
  const q=P_(`次の〔資料〕に基づき，当期の損益計算書において当期純利益の計算に算入される株式売却損益および株式評価損益の合計額を求めなさい（単位：千円。利益はプラス，損失は△で表示）。その他有価証券は部分純資産直入法による。税効果会計は考慮しない。`)+tbl(rows,['銘柄','保有目的','取得原価','前期末時価','当期売却額','当期末時価'])+
    `<p>(注1) A・E・Gの各株式は当期中に売却され，C・Iの各株式は当期中に新規取得したものである。<br>(注2) C株式の取得時の為替相場は1ドル＝${HR}円，決算日の為替相場は1ドル＝${CR}円である。<br>(注3) F株式の時価の回復可能性はないと判断される。<br>(注4) 評価差額は洗替方式による。期首の振戻額も株式評価損益の計算に含める。</p>`;
  return {q,a:ans,u:'千円',neg:true,w:[ans-effH,ans-effA+(sa-ca),ans-fxC+(ec-cc)*CR,ans-effF,ans-effB+(eb-cb),ans+(ei-ci),ans-effE],
    ex:`A（売買・売却）：洗替の振戻△${Y(pa-ca)}＋売却損益${sg(sa-ca)}＝${sg(effA)}（＝売却額－前期末時価）<br>B（売買・保有）：${Y(eb)}－${Y(pb)}＝${sg(effB)}<br>C（売買・外貨）：${ec}千ドル×${CR}－${cc}千ドル×${HR}＝${sg(fxC)}<br>D（子会社）：時価評価しない → 0<br>E（関連会社・売却）：${Y(se)}－${Y(ce)}＝${sg(effE)}<br>F（関連会社・著しい下落で回復見込なし）：減損 ${Y(ef)}－${Y(cf)}＝${sg(effF)}<br>G（その他・売却）：${Y(sgv)}－${Y(cg)}＝${sg(effG)}<br>H（その他・評価損）：部分純資産直入法により損益 ${Y(eh)}－${Y(ch)}＝${sg(effH)}<br>I（その他・評価益）：純資産直入 → 0<br>合計＝<b>${sg(ans)}千円</b>`};
}});

C({id:'q-fa-sec-reclass',f:FA,ch:'第9章 有価証券',t:'保有目的区分の変更とその他有価証券評価差額金（税効果）',r:'B',g(){
  const t=R.pick([30,35,40]);
  const cA=R.int(300,400)*100, tvA=cA+R.int(-10,10)*100, eA=tvA+R.int(-5,15)*100;
  const cB=R.int(50,100)*400, bB=cB/4, tvB=bB+R.int(5,40)*100, eB=bB+R.int(-10,40)*100;
  const F=R.int(10,30)*1000, disc=48*R.int(20,60), P=F-disc, amC=P+disc/2, amT=P+disc*18/48, tvC=amT+R.int(-10,20)*50, eC=amC+R.int(-10,30)*50;
  const diff=(eA-tvA)+(eB-bB)+(eC-amC); const k=(100-t)/100; const ans=rd(diff*k);
  if(ans===0) throw 0;
  const q=P_(`当期（X5年4月1日～X6年3月31日）末のその他有価証券は次のとおりである。全部純資産直入法を採用し，税効果会計を適用する（法定実効税率${t}%）。貸借対照表に計上されるその他有価証券評価差額金はいくらか（単位：千円，千円未満四捨五入。借方残高は△）。`)+
    tbl([['A社株式',cA,eA],['B社株式','（？）',eB],['C社社債','（？）',eC]],['銘柄','取得価額','当期末時価'])+
    `<p>1．トレーディング部門の廃止に伴い，当期中に取得したA社株式をX6年2月15日に売買目的有価証券からその他有価証券に振り替えた。同日の時価は${Y(tvA)}千円であった。<br>2．B社株式は支配獲得目的で400株を${Y(cB)}千円で取得していたが，X6年1月21日に300株を売却し支配が解消したため，残り100株を子会社株式からその他有価証券に振り替えた。同日の100株の時価は${Y(tvB)}千円であった。<br>3．C社社債（額面${Y(F)}千円，償還日X8年3月31日）はX4年4月1日に満期保有目的で${Y(P)}千円で取得し，償却原価法（定額法）を適用していた。他の満期保有目的の債券を売却したため，X5年9月30日にその他有価証券に振り替えた（同日の時価${Y(tvC)}千円）。振替後も償却原価法を継続する。</p>`;
  return {q,a:ans,u:'千円',neg:true,w:[diff,rd(((eA-tvA)+(eB-tvB)+(eC-amC))*k),rd(((eA-tvA)+(eB-bB)+(eC-tvC))*k),rd(((eA-cA)+(eB-bB)+(eC-amC))*k),rd(((eA-tvA)+(eB-bB)+(eC-amT))*k),rd(diff*t/100)],
    ex:`振替価額：売買目的→その他は振替時の時価，子会社株式→その他は帳簿価額，満期保有→その他は振替時の償却原価。<br>A：${Y(eA)}－${Y(tvA)}＝${sg(eA-tvA)}<br>B：${Y(eB)}－帳簿価額${Y(bB)}（${Y(cB)}×100/400）＝${sg(eB-bB)}<br>C：期末償却原価${Y(P)}＋${Y(disc)}×24/48＝${Y(amC)}，${Y(eC)}－${Y(amC)}＝${sg(eC-amC)}<br>評価差額合計${sg(diff)}×(1－${t}%)＝<b>${sg(ans)}千円</b>`};
}});

C({id:'q-fa-allow-cf-int',f:FA,ch:'第12章 貸倒引当金',t:'キャッシュ・フロー見積法の取崩（受取利息）と流動区分の貸倒引当金',r:'A',g(){
  const N1=R.int(150,250)*100, N2=R.int(800,1500)*100, LB=R.int(5,15)*10000, rb=R.pick([2,3,4]);
  const LC=R.int(10,30)*100000, rc=R.pick([4,5,6]), rc2=rc-R.pick([1,2]), n=R.int(3,5);
  const g=R.pick([2,2.5,3,3.5]), pg=R.int(10,50)*10, TBint=R.int(50,150)*1000;
  const pv=k=>{ let s=0; for(let i=1;i<=k;i++) s+=LC*rc2/100/Math.pow(1+rc/100,i); return s+LC/Math.pow(1+rc/100,k); };
  const prev=LC-rd(pv(n+1)), now=LC-rd(pv(n)), tori=prev-now;
  const acc=LB*rb/100*3/12;
  const ask=R.pick(['al','int']);
  const al=rd((N1+N2+LB)*g/100), it=TBint+acc+tori;
  const q=P_(`当期（X8年4月1日～X9年3月31日）末の決算整理に関する次の資料に基づき，${ask==='al'?'貸借対照表の流動資産の区分に計上される貸倒引当金':'損益計算書に計上される受取利息'}の金額を求めなさい（単位：千円，千円未満四捨五入）。`)+
    tbl([['受取手形',N1,'貸倒引当金',pg+prev],['売掛金',N2,'受取利息',TBint],['貸付金',LB+LC,'','']],['借方科目','金額','貸方科目','金額'])+
    `<p>1．受取手形および売掛金はすべて一般債権である。<br>2．貸付金のうち${Y(LB)}千円はB社に対するもの（返済期日X9年12月31日，年利率${rb}%，利払日は6月末と12月末の後払い）であり，一般債権である。<br>3．残り${Y(LC)}千円はC社に対するもの（X${n-1}年4月1日に貸付，期間10年，当初の年利率${rc}%，利払日は毎年3月末）である。C社の業績悪化により，前期末に当期末の利払日から利率を年${rc2}%に引き下げることに合意した。前期末にC社貸付金を貸倒懸念債権に区分し，キャッシュ・フロー見積法（当初の約定利子率で割り引き，割引現在価値は合計額で千円未満四捨五入）により貸倒引当金${Y(prev)}千円を設定している。当期末の利息は約定どおり受け取り，記帳済みである。<br>4．一般債権には貸倒実績率${g}%で貸倒引当金を差額補充法により設定する。未収利息には設定しない。<br>5．キャッシュ・フロー見積法による貸倒引当金の減少額は受取利息として処理する。</p>`;
  const ex=`一般債権（流動）：(${Y(N1)}＋${Y(N2)}＋B社${Y(LB)})×${g}%＝${Y(al)}（C社貸付金は返済期日がX${n+9}年3月末で固定資産の区分）<br>B社未収利息：${Y(LB)}×${rb}%×3/12＝${Y(acc)}<br>C社：当期末の割引現在価値（残り${n}年，${rc}%で割引）＝${Y(LC-now)} → 当期末引当金${Y(now)}<br>取崩額＝${Y(prev)}－${Y(now)}＝${Y(tori)}（受取利息）<br>`;
  return ask==='al'?{q,a:al,u:'千円',w:[rd((N1+N2+LB+LC)*g/100),rd((N1+N2)*g/100),al+now,al+prev,pg+prev,al-pg],ex:ex+`よって<b>${Y(al)}千円</b>`}
    :{q,a:it,u:'千円',w:[TBint+acc,TBint+tori,TBint+acc*2+tori,TBint+acc+prev,TBint+acc-tori,TBint+acc+rd(LC*(rc-rc2)/100)],ex:ex+`受取利息＝${Y(TBint)}＋${Y(acc)}＋${Y(tori)}＝<b>${Y(it)}千円</b>`};
}});

C({id:'q-fa-deriv-mix',f:FA,ch:'第13章 デリバティブ取引',t:'先物・オプション・金利スワップ（特例処理）の損益影響',r:'B',g(){
  const FV=R.int(10,30)*1000, p1=R.int(94,99), dp=R.pick([-3,-2,-1,1,2]), p2=p1+dp, short=R.chance(0.5);
  const gain=(short?(p1-p2):(p2-p1))*FV/100, mg=R.int(3,8)*100, prem=R.int(5,20)*10;
  const L=R.int(10,30)*10000, k=R.pick([1.5,2,2.5]), l1=R.pick([1.24,1.36,1.48,1.12]), l2=l1+R.pick([0.2,0.35,0.3]);
  const it=L*k/100*9/12; const ans=gain-prem-it;
  const itVar=rd(L*(l1+0.5)/100*6/12+L*(l2+0.5)/100*3/12);
  const q=P_(`次の〔資料〕に基づき，当期（X4年4月1日～X5年3月31日）の税引前当期純利益に与える影響額を求めなさい（単位：千円。増加はプラス，減少は△で表示）。ヘッジ目的でない取引はヘッジ会計を適用しない。`)+
    `<p>1．X5年3月1日に国債先物（額面${Y(FV)}千円）を額面100円につき${p1}円で${short?'売建て':'買建て'}，委託証拠金${Y(mg)}千円を現金で差し入れた。X5年3月31日の先物価格は${p2}円である。<br>2．運用目的でX4年8月1日にB社株式のコール・オプションを購入し，オプション料${Y(prem)}千円を支払った。権利行使期日（X4年11月30日）の株価は権利行使価格を上回らなかったため，権利を行使しなかった。<br>3．X4年7月1日にC銀行から${Y(L)}千円を期間5年，6か月TIBOR＋0.5%の変動金利で借り入れ，同日D銀行と金利スワップ契約（想定元本${Y(L)}千円，当社は年${k}%の固定金利を支払い，6か月TIBOR＋0.5%を受け取る）を締結した。利払日は借入金・スワップともに6月末と12月末の後払いで，適用金利は各利払日の6か月前の水準による。6か月TIBORはX4年7月1日${l1}%，X4年12月31日${l2}%である。金利スワップは特例処理の要件を満たしている。</p>`;
  return {q,a:ans,u:'千円',neg:true,w:[ans-mg,gain-prem-itVar,gain-prem-L*k/100*6/12,gain-it,-gain-prem-it,gain-prem-rd(L*(k+0.5)/100*9/12)],
    ex:`先物：${short?'売建':'買建'}　${Y(FV/100)}千口×(${short?`${p1}－${p2}`:`${p2}－${p1}`})＝${sg(gain)}（委託証拠金は資産であり損益ではない）<br>オプション：権利放棄によりオプション料${Y(prem)}が損失<br>金利スワップ特例処理：借入金の変動金利とスワップの受取変動金利が相殺され，実質的に固定金利${k}%の借入となる。支払利息（7月～3月の9か月，未払計上含む）＝${Y(L)}×${k}%×9/12＝${Y(it)}<br>影響額＝${sg(gain)}－${Y(prem)}－${Y(it)}＝<b>${sg(ans)}千円</b>`};
}});

/* ---------- 第3章 有形固定資産 ---------- */
C({id:'q-fa-ppe-cip-life',f:FA,ch:'第2章 有形固定資産',t:'建設仮勘定の振替漏れと耐用年数の変更（有形固定資産合計）',r:'A',g(){
  const B0=R.int(50,90)*1500000, M0=R.int(30,60)*1000000, Ld=R.int(80,150)*1000000, K=R.int(50,120)*100000;
  const nl=R.pick([8,7]); const mBV=M0*7/10, mEnd=mBV-mBV/(nl-3);
  const b=B0-B0/30*4, s=K-K/15*1.5; const ans=b+mEnd+s+Ld;
  if(!Number.isInteger(mEnd)) throw 0;
  const q=P_(`次の〔資料〕に基づき，X4年度末（会計期間は4月1日から3月31日）の貸借対照表に計上する有形固定資産の合計額を求めなさい。減価償却は残存価額ゼロの定額法による。`)+
    tbl([['建物',B0,'X1年度期首','30年'],['機械',M0,'X1年度期首','10年'],['土地',Ld,'X1年度期首','―']],['資産','取得原価','取得・使用開始','耐用年数'])+
    `<p>1．X3年度末の建設仮勘定${Y(K)}円はすべて構築物（耐用年数15年）の建設工事に係るものである。工事はX3年度の第3四半期期首（10月1日）に完了し同日から使用しているが，構築物への振替および減価償却が行われていなかったことがX4年度に判明した。<br>2．機械の耐用年数を，X4年度期首において10年から${nl}年に変更した（会計上の見積りの変更）。</p>`;
  return {q,a:ans,u:'円',w:[rd(b+(M0-M0/nl*4)+s+Ld),b+mEnd+(K-K/15)+Ld,b+mEnd+K+Ld,rd(b+(mBV-mBV/nl)+s+Ld),b+mEnd+s,b+mEnd+(K-K/15*0.5)+Ld],
    ex:`建物：${Y(B0)}－${Y(B0/30)}×4年＝${Y(b)}<br>機械：X4期首簿価${Y(mBV)}を残存耐用年数${nl-3}年（${nl}年－経過3年）で償却（プロスペクティブ方式）→ ${Y(mBV)}－${Y(mBV/(nl-3))}＝${Y(mEnd)}<br>構築物：X3.10～X5.3の18か月分の償却 → ${Y(K)}－${Y(K)}÷15×18/12＝${Y(s)}<br>土地${Y(Ld)}<br>合計＝<b>${Y(ans)}円</b>`};
}});

C({id:'q-fa-ppe-capex-ext',f:FA,ch:'第2章 有形固定資産',t:'使用可能期間を延長させる支出（延長部分のみ資本的支出）',r:'A',g(){
  const n=R.pick([30,40]), m=R.pick([10,12,15]), e=R.pick([3,5,6]); const Bc=R.int(5,20)*12000;
  const X=R.int(10,50)*(n-m+e)*10; const cap=X*e/(n-m+e);
  const acc0=Bc*0.9/n*m; const dep=rd((Bc-acc0-Bc*0.1+cap)/(n-m+e)); const ans=rd(acc0+dep);
  const q=P_(`次の〔資料〕に基づき，当期末の建物減価償却累計額を求めなさい（単位：千円，千円未満四捨五入）。`)+
    `<p>1．建物：取得原価${Y(Bc)}千円，残存価額は取得原価の10%，耐用年数${n}年，定額法。使用開始は当期首より${m}年前の期首である。<br>2．当期に発生した建物に係る支出<br>　(1) 通常の維持のための修繕費${Y(R.int(3,9)*100)}千円<br>　(2) 当期首に支出した外壁補強費${Y(X)}千円。これにより耐用年数は${e}年延長すると見積もられる。支出後の使用可能年数のうち，使用可能期間を延長させた部分に対応する金額のみを資本的支出とする。<br>3．資本的支出後も建物本体の残存価額は変更しない。資本的支出部分の残存価額はゼロとし，支出後の残存耐用年数で建物と一体として償却する。</p>`;
  return {q,a:ans,u:'千円',w:[rd(acc0+(Bc-acc0-Bc*0.1)/(n-m+e)),rd(acc0+(Bc-acc0-Bc*0.1+X)/(n-m+e)),rd(acc0+(Bc-acc0-Bc*0.1+cap)/(n-m)),rd(acc0+Bc*0.9/n),rd(acc0+(Bc-acc0-Bc*0.1)/(n-m)+cap/(n-m+e)),rd(acc0+(Bc-acc0-Bc*0.1+X*e/(n-m))/(n-m+e))],
    ex:`期首累計額：${Y(Bc)}×90%÷${n}年×${m}年＝${Y(acc0)}<br>資本的支出：${Y(X)}×延長${e}年／支出後の使用可能年数${n-m+e}年＝${Y(cap)}（残りは修繕費）<br>当期償却：(${Y(Bc)}－${Y(acc0)}－残存${Y(Bc*0.1)}＋${Y(cap)})÷${n-m+e}年＝${Y(dep)}<br>期末累計額＝<b>${Y(ans)}千円</b>`};
}});

C({id:'q-fa-ppe-200db-exch',f:FA,ch:'第2章 有形固定資産',t:'200%定率法・見積りの変更・付随費用と改良・同種資産の交換',r:'A',adv:true,g(){
  const L=R.pick([[5,0.4,0.5,0.108],[8,0.25,0.334,0.07909],[10,0.2,0.25,0.06552]]); const [life,rate,rev,guar]=L;
  const k=R.int(3,life-1); const Ca=R.int(20,80)*100000;
  let bv=Ca, sw=false, fd=0, bvNo=Ca; for(let y=1;y<=k;y++){ let d; if(!sw){ d=rd(bv*rate); if(d<rd(Ca*guar)){ sw=true; fd=rd(bv*rev); d=fd; } } else d=fd; bv-=d; bvNo-=rd(bvNo*rate); }
  const A=bv;
  const Cb=R.int(10,30)*1200000, el=R.pick([4,5,6]), nlB=el+R.pick([2,3,4]);
  const accB=Cb*0.9/12*el, bvB0=Cb-accB, depB=rd((bvB0-Cb*0.05)/(nlB-el)); const B=bvB0-depB;
  const retroB=Cb-rd((Cb*0.95)/nlB*(el+1));
  const pc=R.int(150,300)*100000, fr=R.int(1,5)*100000, Cc=pc+fr, rp=R.int(3,9)*10000*R.int(1,2), im=R.int(10,40)*100000;
  const cC=c=>{ let v=c; for(let y=0;y<3;y++) v-=rd(v*0.369); return v; };
  const Cv=cC(Cc)+im;
  const Dl=R.int(8,15)*1000000, Dfv=Dl+R.int(10,30)*1000000, Efv=Dfv+R.int(2,8)*1000000; const D=Dl+(Efv-Dfv);
  const ans=A+B+Cv+D;
  const q=P_(`次の〔資料〕に基づき，当期（X9年4月1日～X10年3月31日）末の有形固定資産の貸借対照表価額の合計額を求めなさい。計算過程で円未満の端数が生じる場合はその都度四捨五入する。〔資料〕以外の有形固定資産はない。`)+
    `<p>1．機械装置A（X${10-k}年4月1日取得，取得原価${Y(Ca)}円，耐用年数${life}年）は200%定率法（償却率${rate}，改定償却率${rev}，保証率${guar}）で償却している。<br>2．機械装置B（X${9-el}年4月1日取得，取得原価${Y(Cb)}円，耐用年数12年，残存価額は取得原価の10%，定額法）について，当期首に耐用年数を${nlB}年（総耐用年数），残存価額を取得原価の5%に変更した。これは会計上の見積りの変更に該当する。<br>3．機械装置CはX7年4月1日に取得し，購入代価${Y(pc)}円と引取運賃${Y(fr)}円を支払った。耐用年数5年，残存価額は取得原価の10%，定率法（償却率0.369）。当期首に維持管理のための修繕${Y(rp)}円，当期末に性能を大きく高める改良${Y(im)}円を支出した。<br>4．当期中に当社所有の土地D（帳簿価額${Y(Dl)}円，時価${Y(Dfv)}円）と他社所有の同種の土地E（時価${Y(Efv)}円）を交換し，時価の差額は現金で支払った。土地Eは土地Dと同一の用途に使用している。</p>`;
  return {q,a:ans,u:'円',w:[A+B+Cv+Efv,A+B+Cv+rp+D,bvNo+B+Cv+D,A+retroB+Cv+D,A+B+Cv-im+D,A+B+cC(pc)+im+D],
    ex:`A：200%定率法で償却率による償却額が償却保証額（${Y(Ca)}×${guar}＝${Y(rd(Ca*guar))}）を下回った年度から改定取得価額×改定償却率で均等償却 → 期末簿価${Y(A)}<br>B：期首簿価${Y(Cb)}－${Y(accB)}＝${Y(bvB0)}，(${Y(bvB0)}－${Y(Cb*0.05)})÷残存${nlB-el}年＝${Y(depB)} → ${Y(B)}<br>C：取得原価＝代価＋付随費用＝${Y(Cc)}，3年目期末簿価${Y(cC(Cc))}＋改良（資本的支出）${Y(im)}＝${Y(Cv)}（修繕は費用）<br>D：同種資産の交換は交換に供した資産の帳簿価額＋支払現金 → ${Y(Dl)}＋${Y(Efv-Dfv)}＝${Y(D)}<br>合計＝<b>${Y(ans)}円</b>`};
}});

/* ---------- 第5章 無形固定資産・繰延資産 ---------- */
C({id:'q-fa-sw-market-loss',f:FA,ch:'第15章 研究開発費・ソフトウェア',t:'市場販売目的ソフトウェア（均等配分額との比較・見込販売収益の減少）',r:'A',g(){
  const Cs=R.int(150,350)*1000, u1=R.int(15,25)*1000, u2=R.int(10,18)*1000, u3=R.int(8,14)*1000;
  const p1=R.int(12,16)*1000, p2=p1-R.int(1,3)*1000, p3=p2-R.int(1,3)*1000;
  const d1=Math.max(rd(Cs*u1/(u1+u2+u3)),rd(Cs/3)), bv1=Cs-d1; if(bv1>u2*p2/1000+u3*p3/1000) throw 0;
  const a2=u2-R.int(0,4)*500, dU=rd(bv1*a2/(u2+u3)), dE=rd(bv1/2), d2=Math.max(dU,dE), bv2=bv1-d2;
  const u3n=u3-R.int(1,4)*500, p3n=p3-R.int(0,3)*1000, r3n=u3n*p3n/1000; const wd=Math.max(0,bv2-r3n); const ans=d2+wd;
  const alt=Math.max(0,bv1-dU-r3n);
  const q=P_(`次の〔資料〕に基づき，市場販売目的のソフトウェアに関してX2年度（3月決算）に計上すべき費用および損失の総額を求めなさい（単位：千円，千円未満四捨五入）。`)+
    `<p>1．X1年4月1日に販売を開始し，制作費${Y(Cs)}千円を無形固定資産に計上した。見込有効期間は3年であり，見込販売数量に基づき償却する。ただし，各年度の償却額は残存有効期間に基づく均等配分額を下回らない。各年度の償却額は，当該年度の実績販売数量を当該年度期首時点の見込販売数量（当年度以降の合計）で除した割合を期首未償却残高に乗じて算定する。</p>`+
    tbl([['X1年度',`${Y(u1)}個`,`＠${Y(p1)}円`],['X2年度',`${Y(u2)}個`,`＠${Y(p2)}円`],['X3年度',`${Y(u3)}個`,`＠${Y(p3)}円`]],['年度','販売開始時の見込販売数量','見込販売単価'])+
    `<p>2．X1年度は見込みどおり販売された。X2年度の実績販売数量は${Y(a2)}個であった。<br>3．X2年度末においてX3年度の見込販売数量を${Y(u3n)}個，見込販売単価を＠${Y(p3n)}円に見直した（合理的な見積りによる）。<br>4．未償却残高が翌期以降の見込販売収益の額を上回る場合，その超過額は一時の費用または損失とする。</p>`;
  return {q,a:ans,u:'千円',w:[dU+alt,d2,d2+Math.max(0,bv2-u3*p3/1000),dU,wd+dE,rd(bv1*a2/(a2+u3n))+Math.max(0,bv1-rd(bv1*a2/(a2+u3n))-r3n)],
    ex:`X1：数量基準${Y(rd(Cs*u1/(u1+u2+u3)))}と均等配分${Y(rd(Cs/3))}の大きい方${Y(d1)} → 期末残高${Y(bv1)}<br>X2：数量基準${Y(bv1)}×${Y(a2)}/${Y(u2+u3)}＝${Y(dU)}，均等配分${Y(bv1)}÷2＝${Y(dE)} → 償却額${Y(d2)}，期末残高${Y(bv2)}<br>翌期見込販売収益：${Y(u3n)}個×＠${Y(p3n)}円＝${Y(r3n)} → ${wd>0?`超過額${Y(wd)}を損失計上`:'未償却残高が下回るため損失なし'}<br>費用・損失合計＝<b>${Y(ans)}千円</b>`};
}});

C({id:'q-fa-deferred-nonop',f:FA,ch:'第3章 繰延資産',t:'繰延資産の償却と営業外費用（株式交付費・社債発行費・開発費）',r:'A',g(){
  const mi=R.pick([5,6,7,8,9,10,11]), A1=R.int(2,8)*3600, A2=R.int(2,6)*600, sm=R.pick([2,1,12]);
  const nb=R.pick([5,7,10]), ms=R.pick([6,7,9,10]), Sb=nb*12*R.int(10,30), md=R.pick([7,10,1]), Dv=R.int(5,15)*600;
  const mA=mo(mi), mS=mo(ms), mD=mo(md);
  const ans=A1*mA/36+A2+Sb*mS/(nb*12);
  const q=P_(`${FY}当期末の決算整理前残高試算表には，株式交付費${Y(A1+A2)}千円，社債発行費${Y(Sb)}千円，開発費${Y(Dv)}千円が計上されている（いずれも当期の支出額）。次の資料に基づき，当期の損益計算書の営業外費用に計上される金額の合計を求めなさい（単位：千円）。当社は選択可能な会計処理がある場合，当期の費用が最も少なくなる方法を選択し，償却は月割計算による。</p><p>1．株式交付費のうち${Y(A1)}千円は，工場増設による生産量増強のための資金調達を目的とした新株発行に係るもので，${mi}月1日に株式を交付した。当社はこの資金調達の効果が10年間継続すると見積もっている。資本金・資本準備金からの減額処理は行わない。<br>2．株式交付費の残り${Y(A2)}千円は，${sm}月1日に実施した株式分割に係る支出である。<br>3．社債発行費は${ms}月1日に発行した社債（償還期間${nb}年）に係るものである。<br>4．開発費は${md}月1日に支出した新技術の採用に係る費用であり，開発費の償却は販売費及び一般管理費とする。`);
  return {q,a:ans,u:'千円',w:[A1*mA/120+A2+Sb*mS/(nb*12),ans+Dv*mD/60,A1*mA/36+A2*mo(sm)/36+Sb*mS/(nb*12),A1*mA/36+A2+Sb/nb,A1*mA/36+Sb*mS/(nb*12),A1/3+A2+Sb*mS/(nb*12)],
    ex:`株式交付費（資金調達目的の新株発行）：繰延資産とし，交付から3年以内（効果が10年でも最長3年）で償却 → ${Y(A1)}×${mA}/36＝${Y(A1*mA/36)}<br>株式分割の費用：資金調達ではないため繰延資産にできず，支出時の営業外費用${Y(A2)}<br>社債発行費：償還期間${nb}年にわたり償却 → ${Y(Sb)}×${mS}/${nb*12}＝${Y(Sb*mS/(nb*12))}<br>開発費償却（${Y(Dv*mD/60)}）は販売費及び一般管理費であり営業外費用ではない。<br>合計＝<b>${Y(ans)}千円</b>`};
}});

/* ---------- 第7章 退職給付会計 ---------- */
C({id:'q-fa-ret-exp-emp',f:FA,ch:'第21章 退職給付会計',t:'退職給付費用（従業員拠出・過去勤務費用と数理差異の処理開始時期）',r:'A',g(){
  const P0=R.int(250,400)*1000, A0=R.int(100,200)*1000, r=R.pick([1.5,2,2.5,3]), k=R.pick([1.5,2,2.5,3]);
  const PS=9*R.int(300,600), AD=10*R.int(80,200), sP=R.pick([1,-1]), sA=R.pick([1,-1]);
  const S=R.int(20,40)*1000, Cn=R.int(8,15)*1000, E=R.int(1,4)*500, Bf=R.int(15,25)*1000;
  const I=P0*r/100, X=A0*k/100; const ans=S-E+I-X+sP*PS/9+sA*AD/10;
  const q=P_(`次の〔資料〕に基づき，X6年度（X6年4月1日～X7年3月31日）の退職給付費用を求めなさい（単位：千円）。`)+
    `<p>〔X5年度末〕退職給付債務${Y(P0)}千円，年金資産${Y(A0)}千円，未認識過去勤務費用${Y(PS)}千円（${sP>0?'借方':'貸方'}差異，X5年度期首発生），未認識数理計算上の差異${Y(AD)}千円（${sA>0?'借方':'貸方'}差異，X5年度末発生）<br>〔X6年度〕勤務費用${Y(S)}千円，年金基金への掛金拠出額${Y(Cn)}千円（うち${Y(E)}千円は従業員からの拠出），年金支給額${Y(Bf)}千円<br>〔その他〕割引率年${r}%，長期期待運用収益率年${k}%。過去勤務費用は発生年度から10年，数理計算上の差異は発生年度の翌年度から10年の定額法で費用処理する。</p>`;
  return {q,a:ans,u:'千円',w:[ans+E,S-E+I-X+sP*PS/10+sA*AD/10,S-E+I-X+sP*PS/9+sA*AD/9,S-E+I-X+sP*PS/9-sA*AD/10,S-E+I-X-sP*PS/9+sA*AD/10,S-E+I-X],
    ex:`勤務費用${Y(S)}－従業員拠出${Y(E)}（勤務費用から控除）＋利息費用${Y(P0)}×${r}%＝${Y(I)}－期待運用収益${Y(A0)}×${k}%＝${Y(X)}<br>過去勤務費用：X5年度に1年分償却済み → 発生額${Y(PS/9*10)}÷10＝${sg(sP*PS/9)}<br>数理計算上の差異：X5年度末発生で未償却 → ${Y(AD)}÷10＝${sg(sA*AD/10)}<br>退職給付費用＝<b>${Y(ans)}千円</b>`};
}});

C({id:'q-fa-ret-unrecog',f:FA,ch:'第21章 退職給付会計',t:'期末の未認識数理計算上の差異（費用処理年数の短縮・当期発生差異）',r:'A',g(){
  const P0=R.int(100,200)*100, A0=R.int(50,100)*100, r=3, k=3, U0=35*R.int(5,20);
  const S=R.int(6,12)*100, Bf=R.int(2,5)*100, Cn=R.int(3,8)*100, I=P0*r/100, X=A0*k/100;
  const dP=R.int(5,25)*80, dA=R.int(1,10)*40;
  const P1=P0+S+I-Bf+dP, A1=A0+X+Cn-Bf-dA;
  const newD=dP+dA; const end=newD*7/8-(U0-U0/5);
  const fmt=v=>`${Y(Math.abs(v))}百万円（${v>=0?'借方':'貸方'}）`;
  const a=fmt(end);
  const ws=[newD*7/8-rd(U0-U0/7),newD-(U0-U0/5),dP*7/8-(U0-U0/5),newD*7/8-rd(U0-U0/10),rd(newD*9/10)-(U0-U0/5),newD*7/8+(U0-U0/5)].map(fmt);
  ws.push(fmt(-end));
  const q=P_(`次の〔資料〕に基づき，X1年度（X1年4月1日～X2年3月31日）末における未認識数理計算上の差異の総額を求めなさい（単位：百万円）。`)+
    `<p>1．従業員非拠出の確定給付企業年金制度を採用している。数理計算上の差異は発生年度から平均残存勤務期間にわたり定額法で費用処理する。<br>2．X1年4月1日の期首残高：退職給付債務${Y(P0)}，年金資産${Y(A0)}，未認識数理計算上の差異（貸方）${Y(U0)}（当初の費用処理年数10年，既経過3年）<br>3．X1年度期首に平均残存勤務期間を見直した結果，10年から8年に短縮された。<br>4．X1年度の勤務費用${Y(S)}，利息費用${Y(I)}，期待運用収益${Y(X)}。年金資産からの給付支払額${Y(Bf)}，掛金拠出額${Y(Cn)}。<br>5．X1年度末に割引率を見直した結果，退職給付債務は${Y(P1)}となった。年金資産の期末時価は${Y(A1)}である。</p>`;
  return {q,a,w:ws,
    ex:`期首分（貸方${Y(U0)}）：残りの費用処理年数は8年－既経過3年＝5年 → 当期償却${Y(U0/5)}，期末貸方${Y(U0-U0/5)}<br>当期発生（債務）：${Y(P1)}－(${Y(P0)}＋${Y(S)}＋${Y(I)}－${Y(Bf)})＝${Y(dP)}（借方）<br>当期発生（資産）：(${Y(A0)}＋${Y(X)}＋${Y(Cn)}－${Y(Bf)})－${Y(A1)}＝${Y(dA)}（借方）<br>発生年度から8年で償却 → 期末残高${Y(newD)}×7/8＝${Y(newD*7/8)}（借方）<br>差引＝<b>${a}</b>`};
}});

/* ---------- 第8章 外貨建取引 ---------- */
C({id:'q-fa-fx-fwd-ind',f:FA,ch:'第18章 外貨建取引',t:'取引発生後の為替予約（独立処理と振当処理の比較）',r:'B',g(){
  const X=R.int(1,10)*60000, S0=R.int(110,125), S1=S0+R.pick([-3,-2,2,3]), FC=S1+R.pick([-2,-1,1,2]), S2=S1+R.pick([-3,-2,-1,1,2,3]), F2=S2+(FC-S1>0?1:-1);
  const cm=R.pick([1,2,3]), tot=6-cm, cur=4-cm;
  const ind=X*(S2-S0)+X*(FC-F2), ate=X*(S1-S0)+X*(FC-S1)*cur/tot;
  if(ind===0||ate===0||S2===S0) throw 0;
  const ask=R.pick(['ind','ate']);
  const q=P_(`${FY}次の外貨建取引について，当期の損益計算書に計上される為替差損益を${ask==='ind'?'独立処理':'振当処理（直先差額は期間配分する）'}によって求めなさい（為替差益はプラス，為替差損は△で表示。円未満の端数は生じない）。`)+
    `<p>1．X5年10月1日に商品${Y(X)}ドルを輸出した（掛け）。代金の回収予定日はX6年5月31日である。<br>2．X6年${cm}月1日に，円高による回収額の減少に備えて，X6年5月31日を期日とするドル売りの為替予約を締結した。<br>3．為替相場は次のとおりである。</p>`+
    tbl([['直物相場',`${S0}円`,`${S1}円`,`${S2}円`],['先物相場（5月31日期日）','―',`${FC}円`,`${F2}円`]],['','X5年10月1日',`X6年${cm}月1日`,'X6年3月31日']);
  return ask==='ind'?{q,a:ind,u:'円',neg:true,w:[X*(S2-S0),X*(FC-F2),X*(F2-S0)+X*(FC-F2),-ind,ate,X*(S1-S0)+X*(FC-F2)],
      ex:`独立処理：売掛金は決算時の直物相場で換算し，為替予約は時価評価する。<br>売掛金：${Y(X)}×(${S2}－${S0})＝${sg(X*(S2-S0))}<br>為替予約（売予約）：${Y(X)}×(${FC}－${F2})＝${sg(X*(FC-F2))}<br>合計<b>${sg(ind)}円</b>`}
    :{q,a:ate,u:'円',neg:true,w:[X*(S1-S0),X*(S1-S0)+X*(FC-S1),X*(FC-S0),ind,-ate,X*(S1-S0)+X*(FC-S1)*(cur-1)/tot],
      ex:`振当処理：予約締結時までの為替相場の変動（直直差額）は当期の損益，予約締結時の直物相場と予約相場の差額（直先差額）は予約日の属する期から決済日の属する期までの期間に配分する。<br>直直差額：${Y(X)}×(${S1}－${S0})＝${sg(X*(S1-S0))}<br>直先差額：${Y(X)}×(${FC}－${S1})＝${sg(X*(FC-S1))}，当期配分${cur}か月/${tot}か月＝${sg(X*(FC-S1)*cur/tot)}<br>合計<b>${sg(ate)}円</b>`};
}});

C({id:'q-fa-fx-sec-diff',f:FA,ch:'第18章 外貨建取引',t:'外貨建有価証券・外貨建債務の為替差損益',r:'A',g(){
  const HRb=R.int(105,115), AR=HRb+R.pick([-2,1,2,3]), CR=AR+R.pick([-4,-3,-2,2,3,4]);
  const F=R.int(3,6)*100, d=R.int(1,4), P=F-5*d;
  const HRa=R.int(100,118), a$=R.int(100,300), a1=a$+R.int(-20,30);
  const HRc=R.int(100,118), c$=R.int(150,400), c1=c$+R.int(-30,30);
  const HRd=R.int(100,120), Xd=R.int(50,200); if(HRd===CR) throw 0;
  const fxB=(P+d)*CR-(P*HRb+d*AR), fxD=Xd*(HRd-CR); const ans=fxB+fxD; if(ans===0) throw 0;
  const q=P_(`${FY}次の〔資料〕に基づき，当期の損益計算書に計上される為替差損益を求めなさい（単位：千円。差益はプラス，差損は△）。期中平均相場は1ドル＝${AR}円，決算時の為替相場は1ドル＝${CR}円である。`)+
    tbl([['A社株式','売買目的',`${a$}千ドル（取得時${HRa}円）`,`${a1}千ドル`],['B社社債','満期保有目的',`${P}千ドル（取得時${HRb}円）`,'―'],['C社株式','関連会社株式',`${c$}千ドル（取得時${HRc}円）`,`${c1}千ドル`]],['銘柄','保有目的','取得原価','期末時価'])+
    `<p>1．B社社債は当期首に額面${F}千ドル（償還期間5年）を取得したもので，取得差額は金利調整差額と認められ償却原価法（定額法）を適用する。<br>2．C社株式の時価の下落は著しいものではない。<br>3．当期の2月1日に商品を掛けで輸入した買掛金${Xd}千ドル（輸入時の為替相場1ドル＝${HRd}円）が期末に未決済である。</p>`;
  return {q,a:ans,u:'千円',neg:true,w:[ans+a$*(CR-HRa),ans+c$*(CR-HRc),(P+d)*CR-(P*HRb+d*CR)+fxD,fxB-fxD,P*(CR-HRb)+fxD,fxB],
    ex:`A社株式（売買目的）：換算差額を含めて有価証券評価損益とする（為替差損益に含めない）。<br>B社社債：償却額${d}千ドル×AR${AR}＝${Y(d*AR)}（有価証券利息）。為替差損益＝${P+d}千ドル×${CR}－(${P}千ドル×${HRb}＋${Y(d*AR)})＝${sg(fxB)}<br>C社株式（関連会社）：取得時の為替相場で換算 → 差損益なし<br>買掛金：${Xd}千ドル×(${HRd}－${CR})＝${sg(fxD)}<br>合計<b>${sg(ans)}千円</b>`};
}});

/* ---------- 第9章 純資産 ---------- */
C({id:'q-fa-treasury-split',f:FA,ch:'第23章 純資産',t:'自己株式（移動平均・付随費用）と株式分割費用（株式交付費＋その他資本剰余金）',r:'B',g(){
  const n0=R.int(2,5)*100, u0=R.int(15,25), v0=n0*u0, n1=R.int(1,4)*100, p1=R.int(18,26), c1=n1*p1, f1=R.int(1,5)*60;
  const avg=(v0+c1)/(n0+n1), n2=R.int(1,Math.max(1,(n0+n1)/100-1))*100, cost2=rd(n2*avg), s2=cost2+R.int(2,12)*50;
  const dm=R.pick([7,8,9,10,11,12]), m2=mo(dm), f2=R.int(1,5)*36, f3=R.int(2,6)*60;
  const bal=f2*(36-m2)/36, gain=s2-cost2, ans=bal+gain;
  const avgF=(v0+c1+f1)/(n0+n1), gainF=s2-rd(n2*avgF);
  const q=P_(`次の〔資料〕に基づき，当期末（X2年3月31日）の貸借対照表に計上される株式交付費とその他資本剰余金の合計額を求めなさい（単位：千円，千円未満四捨五入）。</p><p>1．前期末の貸借対照表に株式交付費とその他資本剰余金は計上されていない。前期末の自己株式の帳簿価額は${Y(v0)}千円（${n0}株）である。<br>2．X1年6月1日に自己株式${n1}株を${Y(c1)}千円で取得し，手数料${Y(f1)}千円を支払った。<br>3．X1年${dm}月1日に自己株式${n2}株を${Y(s2)}千円で処分し，手数料${Y(f2)}千円を支払った。<br>4．X2年1月10日に1：1.2の株式分割を行い，手数料${Y(f3)}千円を支払った。<br>5．自己株式の払出単価は移動平均法による。繰延資産に計上できるものは繰延資産とし，規定の最長期間で月割償却する。`);
  return {q,a:ans,u:'千円',w:[bal+gainF,ans+f3*(36-2)/36,f2+gain,gain,f2*m2/36+gain,gain-f2,ans+f3],
    ex:`取得の付随費用${Y(f1)}は営業外費用（自己株式の取得原価に含めない）。<br>平均単価：(${Y(v0)}＋${Y(c1)})÷${n0+n1}株＝${yen(avg,2)}<br>処分差益：${Y(s2)}－${n2}株×${yen(avg,2)}＝${Y(gain)}（その他資本剰余金）<br>処分の費用${Y(f2)}は株式交付費（繰延資産，3年償却）→ 期末残高${Y(f2)}×${36-m2}/36＝${Y(bal)}<br>株式分割の費用${Y(f3)}は資金調達ではないため支出時の費用。<br>合計＝<b>${Y(ans)}千円</b>`};
}});

C({id:'q-fa-ss-change',f:FA,ch:'第23章 純資産',t:'株主資本等変動計算書（増資・配当と準備金・圧縮積立金・自己株式）',r:'A',g(){
  const C0=R.int(20,40)*100, CRv=R.int(1,3)*100, OC=R.int(3,8)*10, Rv0=R.int(2,6)*10, RE0=R.int(30,60)*10, TS0=0;
  const I=R.int(2,8)*100, Dv=R.int(10,30)*10, Rz=R.int(1,5)*10, NI=R.int(15,40)*10;
  const lm=R.chance(0.35), LRv=lm?(C0+I/2)/4-CRv-I/2-R.int(1,Dv/10-1):R.int(3,8)*10; if(LRv<=0) throw 0;
  const A=R.int(5,10)*10, b=R.int(2,4)*10, p=b+R.int(1,3)*10, c=R.pick([10,20]); if(b+c>A) throw 0;
  const Cn=C0+I/2, lim=Cn/4-(CRv+I/2+LRv), dLR=Math.max(0,Math.min(Dv/10,lim)); if(lim<=0||(!lm&&lim<Dv/10)) throw 0;
  const T0=C0+CRv+OC+LRv+Rv0+RE0-TS0;
  const ask=R.pick(['tot','re']);
  const tot=T0+I-Dv+NI-A+p, re=RE0-Dv-dLR-Rz+NI;
  const q=P_(`当期（X0年4月1日～X1年3月31日）の純資産の変動に関する次の資料に基づき，株主資本等変動計算書の${ask==='tot'?'株主資本合計':'繰越利益剰余金'}の当期末残高を求めなさい（単位：百万円）。</p>`+
    tbl([['資本金',C0],['資本準備金',CRv],['その他資本剰余金',OC],['利益準備金',LRv],['圧縮積立金',Rv0],['繰越利益剰余金',RE0],['株主資本合計',T0]],['当期首残高','金額'])+
    `<p>1．X0年4月に新株を発行し${Y(I)}百万円の払込みを受けた。資本金には会社法規定の最低限度額を計上する。<br>2．X0年6月の株主総会で繰越利益剰余金を財源とする配当${Y(Dv)}百万円を決議し，会社法規定の利益準備金を積み立てた。<br>3．決算にあたり圧縮積立金${Y(Rz)}百万円を積み立てた。<br>4．当期に自己株式${Y(A)}百万円を取得し，そのうち帳簿価額${Y(b)}百万円を${Y(p)}百万円で処分し，${Y(c)}百万円を消却した。<br>5．当期純利益は${Y(NI)}百万円である。`);
  return ask==='tot'?{q,a:tot,u:'百万円',w:[tot-dLR,tot-Rz,tot-p+b,tot-c,tot+A,tot-Dv/10-Rz],
      ex:`株主資本合計に影響するのは払込・配当・純利益・自己株式の取得と処分対価のみ。準備金の積立・圧縮積立金・自己株式の消却は株主資本内の振替。<br>${Y(T0)}＋${Y(I)}－${Y(Dv)}＋${Y(NI)}－${Y(A)}＋${Y(p)}＝<b>${Y(tot)}百万円</b>`}
    :{q,a:re,u:'百万円',w:[RE0-Dv-Rz+NI,RE0-Dv-dLR+NI,re-c,RE0-Dv-Dv/10-Rz+NI,re+p-b,re-Dv/10],
      ex:`利益準備金の積立額：配当の1/10＝${Y(Dv/10)}と，資本金${Y(Cn)}×1/4－(資本準備金${Y(CRv+I/2)}＋利益準備金${Y(LRv)})＝${yen(Cn/4-(CRv+I/2+LRv))}のいずれか小さい額 → ${Y(dLR)}<br>繰越利益剰余金＝${Y(RE0)}－配当${Y(Dv)}－${Y(dLR)}－圧縮積立金${Y(Rz)}＋${Y(NI)}＝<b>${Y(re)}百万円</b>（処分差益・消却はその他資本剰余金で処理）`};
}});

/* ---------- 第10章 税効果会計 ---------- */
C({id:'q-fa-tax-reserve-rate',f:FA,ch:'第17章 税金及び税効果会計',t:'圧縮積立金と税率変更（法人税等調整額）',r:'A',g(){
  const items=R.pickN([['貸倒引当金繰入限度超過額',10,60],['未払事業税',50,120],['退職給付引当金',800,1600],['棚卸資産評価損',5,40],['減価償却限度超過額',20,100],['賞与引当金',100,300]],4)
    .map(([nm,lo,hi])=>{ const a=R.int(lo,hi)*100; return [nm,a,a+R.int(-20,30)*100]; });
  const Bc=R.int(50,150)*1000, S=R.int(10,40)*1000, R0=S*9/10, R1=S*8/10;
  const v0=R.int(10,50)*100, v1=R.int(10,50)*100, t0=R.pick([42,40,38]), t1=t0-R.pick([2,4]);
  const D0=items.reduce((s,x)=>s+x[1],0), D1=items.reduce((s,x)=>s+x[2],0);
  const ans=rd((D1-R1)*t1/100-(D0-R0)*t0/100); if(ans===0) throw 0;
  const q=P_(`次の〔資料〕に基づき，当期の損益計算書に計上される法人税等調整額を求めなさい（単位：千円，千円未満四捨五入。貸方の場合はプラス，借方の場合は△）。繰延税金資産の回収可能性に問題はない。</p>`+
    tbl(items.concat([['その他有価証券評価差益（将来加算）',v0,v1],['交際費の損金不算入額（永久差異）',R.int(3,9)*100,R.int(3,9)*100]]),['一時差異等','前期末','当期末'])+
    `<p>1．前期首に国庫補助金${Y(S)}千円を受け入れて建物${Y(Bc)}千円を取得した（耐用年数10年，残存価額ゼロ，定額法）。圧縮記帳は積立金方式による。<br>2．前期末の法定実効税率は${t0}%であったが，当期中に税法が改正され，当期末の法定実効税率は${t1}%となった。`);
  return {q,a:ans,u:'千円',neg:true,w:[rd((D1-R1-(D0-R0))*t1/100),rd((D1-R1-v1)*t1/100-(D0-R0-v0)*t0/100),rd(D1*t1/100-D0*t0/100),rd((D1-S)*t1/100-(D0-S)*t0/100),-ans,rd((D1-R1)*t0/100-(D0-R0)*t0/100)],
    ex:`圧縮積立金（将来加算一時差異）：前期末${Y(S)}×9/10＝${Y(R0)}，当期末${Y(S)}×8/10＝${Y(R1)}<br>損益に係る繰延税金資産（純額）：前期末(${Y(D0)}－${Y(R0)})×${t0}%＝${Y(rd((D0-R0)*t0/100))}，当期末(${Y(D1)}－${Y(R1)})×${t1}%＝${Y(rd((D1-R1)*t1/100))}<br>その他有価証券の評価差額に係る分は純資産直入，永久差異は対象外。<br>法人税等調整額＝<b>${sg(ans)}千円</b>（プラスは貸方）`};
}});

C({id:'q-fa-tax-partial',f:FA,ch:'第17章 税金及び税効果会計',t:'部分純資産直入法と税効果（評価差額金・法人税等調整額）',r:'A',g(){
  const t=R.pick([30,35,40]), e0=R.int(30,60)*100, e1=R.int(30,60)*100, b0=R.int(30,60)*100, b1=b0+R.int(1,15)*100;
  const Bc=R.int(20,60)*100000, q1=0.056, u=0.025; const tx=rd(Bc*0.9*u), d1=rd(Bc*q1), d2=rd((Bc-d1)*q1);
  const ex0=d1-tx, ex1=ex0+d2-tx;
  const la=R.int(10,40)*1000, gb=R.int(30,90)*1000;
  const v1=gb*(100-t)/100, v2=rd(((e1+b1+ex1+la)-(e0+b0+ex0))*t/100);
  const fmt=(x)=>`${Y(x)}千円`;
  const a=`(1) ${fmt(v1)}　(2) ${fmt(v2)}`;
  const A1=[fmt(v1),fmt((gb-la)*(100-t)/100),fmt(gb)], A2=[fmt(v2),fmt(rd(v2-la*t/100)),fmt(rd(v2-(d2-tx)*t/100))];
  const w=R.shuffle(pairs(A1,A2,a)).slice(0,6);
  const q=P_(`次の資料に基づき，当期末の(1)その他有価証券評価差額金と(2)当期の法人税等調整額（貸方）の組合せとして正しいものを選びなさい（千円未満四捨五入）。法定実効税率は${t}%，繰延税金資産の回収可能性に問題はない。</p><p>1．期末商品のうち${Y(e1)}千円の評価損は税務上損金不算入である。前期の損金不算入額${Y(e0)}千円は当期に全額認容された。<br>2．貸倒引当金の繰入限度超過額は前期末${Y(b0)}千円，当期末${Y(b1)}千円である。<br>3．建物（前期首取得，取得原価${Y(Bc)}千円）は定率法（償却率0.056，残存価額10%）で償却しているが，税務上は定額法（償却率0.025，残存価額10%）による償却額が損金算入限度額である。<br>4．投資有価証券はすべて当期取得のその他有価証券であり，部分純資産直入法を採用している。A社株式は取得原価に比べ時価が${Y(la)}千円下落し，B社株式は時価が${Y(gb)}千円上昇している（著しい下落ではない）。<br>5．前期に生じた一時差異は上記1.～3.のみである。`);
  return {q,a,w,
    ex:`(1) 評価差益のみ純資産直入：${Y(gb)}×(1－${t}%)＝${Y(v1)}（評価損${Y(la)}は当期の損失 → 将来減算一時差異）<br>(2) 減価償却超過額：前期末${Y(d1)}－${Y(tx)}＝${Y(ex0)}，当期${Y(d2)}－${Y(tx)}＝${Y(d2-tx)}加算 → 当期末${Y(ex1)}<br>将来減算一時差異の増加：商品${sg(e1-e0)}＋貸引${Y(b1-b0)}＋減価償却${Y(d2-tx)}＋評価損${Y(la)}＝${Y((e1+b1+ex1+la)-(e0+b0+ex0))}×${t}%＝${Y(v2)}<br><b>${a}</b>`};
}});

/* ---------- 第11章 社債 ---------- */
C({id:'q-fa-bond-lottery',f:FA,ch:'第19章 社債',t:'抽選償還社債の社債利息（利息法）',r:'A',g(){
  const F=R.int(5,20)*1000000, n=5, c=R.pick([2,3]), r=c+R.pick([1.25,1.5,2,2.5]), red=F/n;
  let P=0, out=F; for(let t=1;t<=n;t++){ P+=(out*c/100+red)/Math.pow(1+r/100,t); out-=red; } P=rd(P);
  const k=R.pick([2,3]); let bv=P, o=F, ints=[], cps=[], bvs=[P];
  for(let t=1;t<=k;t++){ const it=rd(bv*r/100), cp=o*c/100; ints.push(it); cps.push(cp); bv=bv+it-cp-red; o-=red; bvs.push(bv); }
  const ans=ints[k-1], oK=F-red*(k-1);
  const sumOut=[...Array(n)].map((_,i)=>F-red*i).reduce((a,b)=>a+b,0);
  const q=P_(`X1年4月1日に額面総額${Y(F)}円の社債を${Y(P)}円で発行した（3月決算）。発行条件は，期間${n}年，X2年3月31日以降毎年度末に${Y(red)}円ずつ抽選により額面で償還，約定利子率年${c}%（利払日は毎年3月末），である。償却原価法は利息法（実効利子率年${r}%）による。X${k}年度の社債利息はいくらか（円未満四捨五入）。`);
  return {q,a:ans,u:'円',w:[ints[k-2],cps[k-1],ans-cps[k-1],rd((bvs[k-1]+red)*r/100),rd(oK*r/100),rd(cps[k-1]+(F-P)*oK/sumOut)],
    ex:ints.map((it,i)=>`X${i+1}年度：${Y(bvs[i])}×${r}%＝${Y(it)}，クーポン${Y(cps[i])}，償還${Y(red)} → 期末簿価${Y(bvs[i+1])}`).join('<br>')+`<br>償還により簿価が減少した後の残高に実効利子率を乗じる。よって<b>${Y(ans)}円</b>`};
}});

/* ---------- 第12章 商品売買・棚卸資産 ---------- */
C({id:'q-fa-inv-multi',f:FA,ch:'第5章 商品売買・棚卸資産',t:'複数商品の売上原価（原価性のない減耗・正味売却価額の算定）',r:'A',g(){
  const mk=()=>{ const cost=R.int(5,20)*10, bq=R.int(80,220), sh=R.int(3,15); return {cost,bq,aq:bq-sh,beg:R.int(80,200)*100,pur:R.int(700,1800)*100}; };
  const A=mk(), B=mk(), Cc=mk(); A.nrv=A.cost-R.int(1,3)*5; B.nrv=B.cost+R.int(1,4)*10; const cSell=Cc.cost+R.int(0,2)*5, cExp=R.int(2,4)*5; Cc.nrv=cSell-cExp; if(Cc.nrv>=Cc.cost) throw 0;
  const kB=R.int(1,B.bq-B.aq-1);
  const base=[A,B,Cc].reduce((s,x)=>s+x.beg+x.pur-x.bq*x.cost,0);
  const shA=(A.bq-A.aq)*A.cost, shB=kB*B.cost, shC=(Cc.bq-Cc.aq)*Cc.cost, lsA=A.aq*(A.cost-A.nrv), lsC=Cc.aq*(Cc.cost-Cc.nrv);
  const ans=base+shA+shB+shC+lsA+lsC;
  const rows=[['期首商品棚卸高',A.beg,B.beg,Cc.beg],['当期商品仕入高',A.pur,B.pur,Cc.pur],['帳簿棚卸数量',`${A.bq}個`,`${B.bq}個`,`${Cc.bq}個`],['実地棚卸数量',`${A.aq}個`,`${B.aq}個`,`${Cc.aq}個`],['取得原価',`＠${A.cost}`,`＠${B.cost}`,`＠${Cc.cost}`],['正味売却価額',`＠${A.nrv}`,`＠${B.nrv}`,'＠（？）']];
  const q=P_(`次の〔資料〕に基づき，当期の売上原価の金額を求めなさい（単位：千円）。</p>`+tbl(rows,['','A商品','B商品','C商品'])+
    `<p>1．A商品およびC商品の棚卸減耗は原価性がある。B商品の棚卸減耗のうち${kB}個分は原価性があり，残りは原価性がない。<br>2．C商品の見積売価は＠${cSell}千円，見積販売直接経費は＠${cExp}千円である。<br>3．原価性のある棚卸減耗損および収益性の低下による簿価切下額（臨時・多額ではない）は売上原価とする。`);
  return {q,a:ans,u:'千円',w:[ans+(B.bq-B.aq-kB)*B.cost,ans-lsC,ans+(A.bq-A.aq)*(A.cost-A.nrv)+(Cc.bq-Cc.aq)*(Cc.cost-Cc.nrv),ans-shA-shB-shC,ans-lsA-lsC,ans-shB],
    ex:`帳簿上の売上原価：Σ(期首＋仕入－帳簿数量×原価)＝${Y(base)}<br>棚卸減耗（原価性あり）：A ${Y(shA)}＋B ${kB}個×${B.cost}＝${Y(shB)}＋C ${Y(shC)}<br>評価損：A ${A.aq}個×(${A.cost}－${A.nrv})＝${Y(lsA)}，C 正味売却価額＝${cSell}－${cExp}＝${Cc.nrv} → ${Cc.aq}個×(${Cc.cost}－${Cc.nrv})＝${Y(lsC)}，B は正味売却価額が原価を上回るため評価損なし<br>売上原価＝<b>${Y(ans)}千円</b>（原価性のないB商品の減耗${Y((B.bq-B.aq-kB)*B.cost)}は営業外費用等）`};
}});

C({id:'q-fa-retail-cost',f:FA,ch:'第5章 商品売買・棚卸資産',t:'売価還元法（原価法）と正味売却価額による切下げ',r:'A',g(){
  const begS=R.int(100,140)*100000, begC=rd(begS*R.int(66,74)/100,100), purC=R.int(500,700)*100000, iv=rd(purC*R.int(30,45)/100,100);
  const up=R.int(20,40)*100000, upc=R.int(1,9)*10000, dn=R.int(20,35)*100000, dnc=R.int(1,9)*10000;
  const price=begS+purC+iv+up-upc-dn+dnc, cost=begC+purC;
  const endS=R.int(50,80)*100000, sales=price-endS, loss=R.int(1,6)*5000, act=endS-loss;
  const rate=rd(cost/price,0.001), lowRate=rd(cost/(price+dn-dnc),0.001);
  const bc=rd(act*rate); const nrv=rd(bc,1000)+R.pick([-1,1])*R.int(2,40)*1000; const ans=Math.min(bc,nrv);
  const q=P_(`次の〔資料〕に基づき，当期末の貸借対照表に計上する商品の金額を求めなさい。期末商品の評価は売価還元法（原価法）により，収益性の低下により簿価を切り下げる場合は正味売却価額による。原価率は小数点第4位を四捨五入し，それ以外の端数は円未満を四捨五入する。</p>`+
    tbl([['期首商品（原価）',begC],['期首商品（売価）',begS],['純仕入高',purC],['原始値入額',iv],['値上額',up],['値上取消額',upc],['値下額',dn],['値下取消額',dnc],['売上高',sales],['棚卸減耗（売価）',loss],['期末商品（実際有高）の正味売却価額',nrv]],['項目','金額（円）']));
  return {q,a:ans,u:'円',w:[rd(act*lowRate),rd(endS*rate),Math.max(bc,nrv),rd(act*rd(cost/(price+2*upc-2*dnc),0.001)),rd(act*rd(cost/(price-iv),0.001)),Math.min(rd(endS*rate),nrv)],
    ex:`売価合計：${Y(begS)}＋${Y(purC)}＋${Y(iv)}＋(${Y(up)}－${Y(upc)})－(${Y(dn)}－${Y(dnc)})＝${Y(price)}<br>原価率（原価法）：${Y(cost)}÷${Y(price)}≒${pct(rate)}（値下額も分母に含める）<br>期末売価：${Y(price)}－${Y(sales)}＝${Y(endS)}，減耗控除後${Y(act)}<br>原価：${Y(act)}×${pct(rate)}＝${Y(bc)}，正味売却価額${Y(nrv)} → いずれか低い方<b>${Y(ans)}円</b>`};
}});

/* ---------- 第13章 減損会計 ---------- */
C({id:'q-fa-impair-common',f:FA,ch:'第16章 減損会計',t:'共用資産の帳簿価額を配分する方法（減損損失の配分）',r:'A',g(){
  const CA=R.int(15,30)*10, ratios=R.shuffle([10,20,30,40]); const G=['A','B','C','D'];
  const noInd=R.int(0,3);
  const data=G.map((g,i)=>{ const bv=R.int(8,25)*10, al=CA*ratios[i]/100, tot=bv+al; let cf,rc; const kind=i===noInd?'none':R.pick(['ok','loss','loss']);
    if(kind==='ok'){ cf=tot+R.int(1,4)*10; rc=tot-R.int(1,3)*10; } else if(kind==='loss'){ cf=tot-R.int(1,4)*10; rc=cf-R.int(2,6)*10; } else { cf=tot-R.int(1,3)*10; rc=cf-R.int(1,4)*10; }
    return {g,bv,al,tot,cf,rc,kind,ind:kind!=='none'}; });
  if(!data.some(d=>d.kind==='loss')) throw 0;
  let sh=0, shWrongOk=0, lossAll=0, shNoInd=0, shBV=0;
  data.forEach(d=>{ const l=d.tot-d.rc; const s=rd(l*d.al/d.tot);
    if(d.kind==='loss'){ sh+=s; lossAll+=l; shBV+=rd(l*d.al/d.bv); }
    if(d.kind==='ok' && d.rc<d.tot) shWrongOk+=s; if(d.kind==='none') shNoInd+=s; });
  const ans=CA-sh;
  const rows=data.map(d=>[`資産グループ${d.g}`,d.bv,`${ratios[G.indexOf(d.g)]}%`,d.ind?'あり':'なし',d.cf,d.rc]);
  const q=P_(`次の〔資料〕に基づき，減損損失計上後の共用資産の帳簿価額を求めなさい（単位：百万円，百万円未満四捨五入）。共用資産の帳簿価額は${Y(CA)}百万円であり，合理的な基準により各資産グループに配分する方法を採用している。割引前将来キャッシュ・フローおよび回収可能価額は共用資産の帳簿価額配分後のものである。減損損失は帳簿価額に基づき資産グループと共用資産に配分する。</p>`+tbl(rows,['','帳簿価額','共用資産の配賦割合','減損の兆候','割引前将来CF','回収可能価額']));
  return {q,a:ans,u:'百万円',w:[CA-sh-shWrongOk,Math.max(0,CA-Math.min(CA,lossAll)),CA-sh-shNoInd,CA-Math.min(CA,shBV),CA-sh-shWrongOk-shNoInd,CA],
    ex:data.map(d=>`${d.g}：${d.ind?`配分後帳簿価額${Y(d.bv)}＋${Y(d.al)}＝${Y(d.tot)} ${d.cf<d.tot?`＞ 割引前CF${Y(d.cf)} → 減損損失${Y(d.tot-d.rc)}，共用資産分${Y(d.tot-d.rc)}×${Y(d.al)}/${Y(d.tot)}≒${Y(rd((d.tot-d.rc)*d.al/d.tot))}`:`≦ 割引前CF${Y(d.cf)} → 減損を認識しない（回収可能価額が下回っていても測定しない）`}`:'減損の兆候なし'}`).join('<br>')+`<br>共用資産：${Y(CA)}－${Y(sh)}＝<b>${Y(ans)}百万円</b>`};
}});

/* ---------- 第14章 ストック・オプション ---------- */
C({id:'q-fa-so-modify',f:FA,ch:'第25章 ストック・オプション等',t:'条件変更（評価単価の変動）と失効見込みの修正',r:'B',g(){
  const N=R.int(20,40), m=R.pick([10,20,50]), v=R.int(20,40)*100, up=R.chance(0.7), v2=up?v+R.int(3,10)*100:v-R.int(3,8)*100;
  const f0=R.int(1,3), f1=f0+R.int(1,3);
  const cum1=rd((N-f0)*m*v*9/24), cum2=rd((N-f1)*m*v*21/24), inc=up?rd((N-f1)*m*(v2-v)*9/12):0; const ans=cum2-cum1+inc;
  const q=P_(`次の〔資料〕に基づき，当期（X2年4月1日～X3年3月31日）に計上する株式報酬費用を求めなさい（円未満四捨五入）。</p><p>1．X1年6月の株主総会で従業員${N}人に1人当たり${m}個のストック・オプションを7月1日付で付与することを決議した。権利確定日はX3年6月30日，付与日の公正な評価単価は${Y(v)}円である。付与日時点で権利確定日までに${f0}人の退職による失効を見込んでいた。<br>2．株価が下落したため，X2年6月の株主総会で行使価格を引き下げる条件変更を行った。条件変更日（X2年7月1日）の条件変更後の公正な評価単価は${Y(v2)}円である。<br>3．X3年3月31日までに累計${f1}人が退職し，以後の退職は見込まれない（失効見込みを${f1}人に修正する）。`);
  const dv=Math.abs(v2-v);
  return {q,a:ans,u:'円',w:[up?cum2-cum1:cum2-cum1-rd((N-f1)*m*dv*9/12),cum2-cum1+rd((N-f1)*m*dv*9/21),rd((N-f1)*m*v2*21/24)-cum1,rd((N-f0)*m*v*21/24)-cum1+(up?rd((N-f0)*m*dv*9/12):0),cum2-cum1+rd((N-f1)*m*dv*12/24),cum2+inc],
    ex:`付与分（当初の評価単価）：X2年度末累計${N-f1}人×${m}個×${Y(v)}×21/24＝${Y(cum2)}，前期末累計${N-f0}人×${m}個×${Y(v)}×9/24＝${Y(cum1)} → ${Y(cum2-cum1)}<br>`+(up?`条件変更による評価単価の増加分：(${Y(v2)}－${Y(v)})×${N-f1}人×${m}個×(条件変更日から当期末9か月／残り12か月)＝${Y(inc)}<br>`:`条件変更後の評価単価が付与日を下回る場合は，付与日の評価単価に基づく費用計上を継続する（減額しない）。<br>`)+`株式報酬費用＝<b>${Y(ans)}円</b>`};
}});

/* ---------- 第15章 資産除去債務 ---------- */
C({id:'q-fa-aro-revise',f:FA,ch:'第22章 資産除去債務',t:'割引前見積額の増加（見積りの変更）と割引率',r:'A',g(){
  const Ca=R.int(50,100)*120, n=6, E0=R.int(10,20)*100, r0=R.pick([1.5,2,2.5]), rc=r0+R.pick([1.5,1.75,2]), dE=R.int(3,8)*100, r1=r0+R.pick([0.5,1]);
  const L0=rd(E0/Math.pow(1+r0/100,n)); let L=L0; const ints=[]; for(let y=1;y<=3;y++){ const i=rd(L*r0/100); ints.push(i); L+=i; }
  const dL=rd(dE/Math.pow(1+r1/100,n-3)), i4=rd(L*r0/100)+rd(dL*r1/100), aro4=L+dL+i4;
  const dep4=rd((Ca+L0)/n+dL/(n-3));
  const ask=R.pick(['aro','int','dep']);
  const q=P_(`当社はX1年度期首に設備（取得原価${Y(Ca)}千円，耐用年数${n}年，残存価額ゼロ，定額法）を取得し，使用後に除去する法的義務を負っている。取得時の除去支出の見積額（割引前）は${Y(E0)}千円，無リスクの税引前の利率は${r0}%，当社の信用リスクを反映した利率は${pct(rc)}%であった。X3年度末に除去支出の見積額を${Y(E0+dE)}千円に増額修正した（同時点の無リスクの税引前の利率は${pct(r1)}%）。X4年度の${ask==='aro'?'期末の資産除去債務':ask==='int'?'利息費用':'減価償却費（除去費用の配分額を含む）'}はいくらか（計算過程の端数は千円未満をその都度四捨五入）。`);
  const ex=`当初：${Y(E0)}÷(1＋${r0}%)^${n}＝${Y(L0)}，X1～X3利息費用${ints.map(Y).join('，')} → X3年度末${Y(L)}<br>増加分は変更時点の割引率で割り引く：${Y(dE)}÷(1＋${pct(r1)}%)^${n-3}＝${Y(dL)}（有形固定資産にも同額加算）<br>`;
  if(ask==='aro'){ const L0c=rd(E0/Math.pow(1+rc/100,n)); return {q,a:aro4,u:'千円',w:[L+dL+rd(L*r0/100)+rd(dL*r0/100),L+rd(L*r0/100),rd(rd((E0+dE)/Math.pow(1+r1/100,n-3))*(1+r1/100)),L+dL,rd(L0c*Math.pow(1+rc/100,4))+rd(dE/Math.pow(1+rc/100,n-3)*(1+rc/100)),rd((E0+dE)/Math.pow(1+r0/100,n-4))],ex:ex+`X4利息費用${Y(rd(L*r0/100))}＋${Y(rd(dL*r1/100))}＝${Y(i4)}<br>期末資産除去債務＝${Y(L)}＋${Y(dL)}＋${Y(i4)}＝<b>${Y(aro4)}千円</b>`}; }
  if(ask==='int') return {q,a:i4,u:'千円',w:[rd((L+dL)*r0/100),rd(L*r0/100),rd((L+dL)*r1/100),rd(L*rc/100)+rd(dL*rc/100),ints[2],rd(L*r0/100)+rd(dL*r0/100)===i4?i4+1:rd(L*r0/100)+rd(dL*r0/100)],ex:ex+`X4利息費用＝${Y(L)}×${r0}%＋${Y(dL)}×${pct(r1)}%＝<b>${Y(i4)}千円</b>`};
  return {q,a:dep4,u:'千円',w:[rd((Ca+L0)/n),rd((Ca+L0+dL)/n),rd(Ca/n+dL/(n-3)),rd((Ca+L0)/n+dL/(n-3))+rd(L*r0/100),rd((Ca+L0)/n+dE/(n-3))],ex:ex+`減価償却費＝(${Y(Ca)}＋${Y(L0)})÷${n}＋${Y(dL)}÷残存${n-3}年＝<b>${Y(dep4)}千円</b>`};
}});

/* ---------- 第17章 四半期財務諸表 ---------- */
C({id:'q-fa-q-taxcost',f:FA,ch:'第32章 四半期財務諸表に関する会計基準',t:'四半期の税金費用（見積実効税率・前年度の負担率）',r:'B',g(){
  const t=R.pick([30,35,40]); const pb=R.int(40,80)*1000, adj=R.pick([-1,1])*R.int(1,4)*500, tx=rd(pb*t/100)+R.int(1,6)*500;
  const qb=R.int(20,40)*1000, yc=R.int(30,50)*10000, pm=R.int(1,6)*10000, qc=rd(yc*R.int(60,85)/100,1000);
  const rB=(tx+adj)/pb, rC=(yc+pm)*t/100/yc; const b=rd(qb*rB), c=rd(qc*rC), ans=b+c;
  const q=P_(`次の〔資料〕に基づき，X6年度の第3四半期累計期間に計上されるB社とC社の税金費用（未払法人税等）の合計額を求めなさい（単位：千円，千円未満四捨五入）。各社の法定実効税率は${t}%である。</p><p>〔B社〕重要性が乏しい連結子会社であり，一時差異等の発生状況に大幅な変動がないため，前年度の損益計算書における税効果会計適用後の法人税等の負担率を用いる簡便的な方法による。前年度の税引前当期純利益${Y(pb)}千円，法人税，住民税及び事業税${Y(tx)}千円，法人税等調整額${sg(adj)}千円。当第3四半期累計期間の税引前四半期純利益は${Y(qb)}千円である。<br>〔C社〕税引前四半期純利益に年間見積実効税率を乗じる方法による。当第3四半期累計期間の税引前四半期純利益は${Y(qc)}千円，予想年間税引前当期純利益は${Y(yc)}千円，損金不算入の交際費は${Y(pm)}千円と予想される。`);
  return {q,a:ans,u:'千円',w:[rd(qb*tx/pb)+c,b+rd(qc*t/100),rd(qb*t/100)+c,rd(qb*t/100)+rd(qc*t/100),b+rd((qc+pm)*t/100),rd(qb*(tx-adj)/pb)+c],
    ex:`B社：負担率＝(${Y(tx)}${adj>=0?'＋':'－'}${Y(Math.abs(adj))})÷${Y(pb)}＝${yen(rB*100,2)}% → ${Y(qb)}×負担率＝${Y(b)}<br>C社：見積実効税率＝(${Y(yc)}＋${Y(pm)})×${t}%÷${Y(yc)}＝${yen(rC*100,2)}% → ${Y(qc)}×見積実効税率＝${Y(c)}<br>合計＝<b>${Y(ans)}千円</b>`};
}});

/* ---------- 第20章 分配可能額 ---------- */
C({id:'q-fa-dist-after',f:FA,ch:'第24章 分配可能額',t:'分配可能額（期末後の自己株式処分・のれん等調整額の区分判定）',r:'B',g(){
  const Cp=R.int(10,30)*100, CRv=R.int(3,10)*100, LRv=R.int(2,6)*100, OC=R.int(2,8)*100, ORE=R.int(5,15)*100, TS=R.int(1,4)*60, V=-R.int(1,5)*20;
  const base=Cp+CRv+LRv; const sc=R.pick([1,2,3]); let Gw, Dd;
  if(sc===1){ Gw=R.int(1,4)*200; Dd=R.int(1,4)*100; if(Gw/2+Dd>base) throw 0; }
  else if(sc===2){ const GA=base+R.int(1,Math.max(1,OC/100-1))*100; Dd=R.int(1,4)*100; Gw=2*(GA-Dd); if(Gw<0||Gw/2>base+OC) throw 0; }
  else { Dd=R.int(1,4)*100; Gw=2*(base+OC+R.int(1,5)*100); }
  const GA=Gw/2+Dd; let red;
  if(GA<=base) red=0; else if(GA<=base+OC) red=GA-base; else red=(Gw/2<=base+OC)?GA-base:OC+Dd;
  if(!(GA<=base+OC) && sc===2) throw 0;
  const b=TS/2, p=b+R.int(1,3)*10;
  const ans=OC+ORE-TS-red+V; if(ans<=0) throw 0;
  const q=P_(`次の〔資料〕に基づき，X7年6月30日における会社法上の分配可能額を求めなさい（単位：百万円）。当社は臨時決算を行っておらず，連結配当規制適用会社ではない。</p>`+
    tbl([['資本金',Cp],['資本準備金',CRv],['その他資本剰余金',OC],['利益準備金',LRv],['その他利益剰余金',ORE],['自己株式',-TS],['その他有価証券評価差額金',V]],['X7年3月31日の純資産の部','金額'])+
    `<p>1．X7年3月31日の資産にはのれん${Y(Gw)}百万円と繰延資産${Y(Dd)}百万円が含まれている。<br>2．X7年4月1日からX7年6月30日までに，帳簿価額${Y(b)}百万円の自己株式を${Y(p)}百万円で処分した。自己株式の追加取得はない。`);
  const ex=`のれん等調整額：${Y(Gw)}÷2＋${Y(Dd)}＝${Y(GA)}，資本等金額（資本金＋準備金）${Y(base)}，＋その他資本剰余金＝${Y(base+OC)}<br>`+
    (GA<=base?'のれん等調整額≦資本等金額 → 減算額0':GA<=base+OC?`資本等金額＜のれん等調整額≦資本等金額＋その他資本剰余金 → 減算額${Y(GA)}－${Y(base)}＝${Y(red)}`:(Gw/2<=base+OC?`のれん等調整額が超過するが，のれん÷2≦資本等金額＋その他資本剰余金 → 減算額${Y(GA)}－${Y(base)}＝${Y(red)}`:`のれん÷2＞資本等金額＋その他資本剰余金 → 減算額＝その他資本剰余金${Y(OC)}＋繰延資産${Y(Dd)}＝${Y(red)}`))+
    `<br>分配時の剰余金：${Y(OC)}＋${Y(ORE)}＋処分差益${Y(p-b)}＝${Y(OC+ORE+p-b)}<br>分配可能額＝${Y(OC+ORE+p-b)}－分配時の自己株式${Y(TS-b)}－処分対価${Y(p)}（臨時決算なし）－${Y(red)}－評価差額金${Y(-V)}＝<b>${Y(ans)}百万円</b>`;
  return {q,a:ans,u:'百万円',w:[ans+p,ans+b,ans-V,ans+red,ans+red-GA,ans+red-Gw/2,ans+p-b],ex};
}});

})();

T({id:'fat-principles',f:FT,ch:'第2章 一般原則',t:'企業会計原則の一般原則',r:'B',

'資本取引・損益取引区分の原則は，資本剰余金と利益剰余金とを混同してはならないことを要請している。',

'保守主義の原則は，予測される将来の危険に備えて慎重な判断に基づく会計処理を要請するが，過度に保守的な会計処理は認められない。',

['重要性の原則の適用により簡便な方法が認められるのは正規の簿記の原則に関してのみであり，財務諸表の表示には適用されない。','重要性の原則は，会計処理だけでなく財務諸表の表示（明瞭性の原則）にも適用される。'],
['保守主義の原則は真実性の原則に優先するため，利益を過小に表示することも認められる。','過度な保守主義は真実な報告をゆがめるため認められない。'],

T:['財務報告の目的は，投資家による企業成果の予測と企業価値の評価に役立つような，企業の財務状況の開示にある。',
'会計情報の基本的な特性は意思決定有用性であり，意思決定との関連性と信頼性という下位の特性に支えられ，内的整合性と比較可能性がそれらを基礎から支える特性とされる。',
'資産とは，過去の取引または事象の結果として，報告主体が支配している経済的資源をいう。',
'純利益とは，特定期間の期末までに生じた純資産の変動額のうち，その期間中にリスクから解放された投資の成果であって，報告主体の所有者に帰属する部分をいう。',
'株主資本とは，純資産のうち報告主体の所有者である株主（連結財務諸表の場合には親会社株主）に帰属する部分をいう。',
'経済的資源とは，キャッシュの獲得に貢献する便益の源泉をいい，実物財に限らず，金融資産及びそれらとの同等物を含む。'],
F:[['概念フレームワークでは，信頼性が意思決定との関連性に常に優先すると定められている。','両者は相互に補強し合う一方でトレードオフの関係になることもあり，一方が常に優先するとはしていない。'],
['負債とは，報告主体が支配している経済的資源を放棄もしくは引き渡す義務をいい，法的債務に限られる。','負債には法的債務だけでなく，それに準ずるものも含まれる。'],
['概念フレームワークにおいて，資産の測定属性は取得原価に一本化されている。','取得原価，市場価格，割引価値など複数の測定属性が示されている。'],
['包括利益とは，特定期間における純資産の変動額のうち，株主等の持分所有者との直接的な取引による部分をいう。','持分所有者との直接的な取引によらない部分をいう。'],
['概念フレームワークは，純利益に代えて包括利益を最も重要な業績指標と位置付けている。','純利益が投資の成果を表す重要な指標であることを強調しており，包括利益を純利益に代わるものとはしていない。'],
['信頼性は中立性のみによって支えられており，検証可能性や表現の忠実性はその構成要素ではない。','信頼性は中立性・検証可能性・表現の忠実性によって支えられている。']]});

T({id:'fat-segment',f:FT,ch:'第14章 セグメント情報等の開示',t:'セグメント情報等の開示',r:'A',
T:['セグメント情報の開示は，マネジメント・アプローチに基づき，経営者が経営上の意思決定や業績評価のために設定した事業単位を基礎として行われる。',
'報告セグメントの利益（又は損失）などの額は，最高経営意思決定機関に報告される金額に基づいて開示する。',
'売上高（事業セグメント間の内部売上高等を含む）がすべての事業セグメントの売上高合計の10%以上である事業セグメントは，報告セグメントとしなければならない。',
'報告セグメントの外部顧客への売上高の合計額が連結損益計算書の売上高の75%未満である場合には，75%以上となるまで報告セグメントを追加して識別しなければならない。',
'セグメント情報等の開示において，関連情報として，製品及びサービスに関する情報，地域に関する情報，主要な顧客に関する情報を開示する。'],
F:[['セグメント情報は，財務諸表の作成に用いた会計方針と同一の会計方針で測定した金額でなければならない。','経営者に報告される金額に基づいて開示し，財務諸表計上額との差異は調整表で説明する。'],
['事業セグメントは，製品・サービスの種類や地域など，比較しやすい画一的な基準により区分しなければならない。','マネジメント・アプローチにより，企業の内部組織に基づいて区分する。'],
['量的基準の判定における売上高には，事業セグメント間の内部売上高や振替高は含めない。','量的基準の売上高には内部売上高・振替高を含める。'],
['報告セグメントに含まれない事業セグメントについては，何らの情報も開示する必要はない。','「その他」の区分に一括して開示する。'],
['連結財務諸表でセグメント情報を開示している場合でも，個別財務諸表において同様のセグメント情報を開示しなければならない。','連結財務諸表で開示している場合，個別財務諸表での開示は要しない。']]});

T({id:'fat-related',f:FT,ch:'第15章 関連当事者の開示',t:'関連当事者の開示',r:'A',
T:['関連当事者の開示は，会社と関連当事者との取引が財政状態や経営成績に及ぼす影響を，財務諸表利用者が把握できるようにするために行われる。',
'関連当事者には，親会社，子会社，関連会社のほか，当該会社の役員及びその近親者，主要株主などが含まれる。',
'一般競争入札による取引や，預金利息・配当の受取りなど取引条件が一般の取引と同様であることが明白な取引は，開示対象外とされる。',
'役員に対する報酬・賞与及び退職慰労金の支払いは，関連当事者との取引として開示する必要はない。',
'連結財務諸表の作成にあたって相殺消去した取引は，関連当事者との取引の開示対象外である。'],
F:[['主要株主とは，自己又は他人の名義をもって総株主の議決権の20%以上を保有している株主をいう。','主要株主は議決権の10%以上を保有している株主をいう。'],
['役員の近親者（二親等以内の親族）は関連当事者に含まれない。','役員の近親者も関連当事者に含まれる。'],
['連結財務諸表上相殺消去された連結会社間の取引も，関連当事者との取引として開示しなければならない。','相殺消去した取引は開示対象外である。'],
['親会社が存在していても，当期に親会社との取引がなければ，親会社に関する情報を注記する必要はない。','親会社が存在する場合には，取引の有無にかかわらず親会社の名称等を注記する。'],
['関連当事者との取引であっても，その取引条件が第三者との取引と同様である場合には，すべて開示を要しない。','開示対象外となるのは，取引条件が一般と同様であることが明白な一定の取引に限られる。']]});

T({id:'fat-investprop',f:FT,ch:'第16章 賃貸等不動産の時価等の開示',t:'賃貸等不動産の時価等の開示',r:'B',
T:['賃貸等不動産とは，棚卸資産に分類されている不動産以外のものであって，賃貸収益又はキャピタル・ゲインの獲得を目的として保有されている不動産をいう。',
'賃貸等不動産を保有している場合，その概要，貸借対照表計上額及び期中における主な変動，当期末における時価及びその算定方法等を注記する。',
'将来において賃貸等不動産として使用される予定で開発中の不動産は，賃貸等不動産に含まれる。',
'賃貸等不動産の総額に重要性が乏しい場合には，注記を省略することができる。'],
F:[['賃貸等不動産は，貸借対照表において時価をもって計上し，評価差額は当期の損益とする。','貸借対照表上は取得原価を基礎として計上し，時価は注記で開示する。'],
['棚卸資産に分類されている販売用不動産も，賃貸等不動産の時価等の注記の対象となる。','棚卸資産に分類されている不動産は除かれる。'],
['将来の使用が見込まれていない遊休不動産は，賃貸収益を生んでいないため賃貸等不動産に含まれない。','将来の使用が見込まれていない遊休不動産は賃貸等不動産に含まれる。'],
['賃貸等不動産の時価の注記において，時価の算定方法を記載する必要はない。','時価の算定方法も注記事項である。']]});

T({id:'fat-eps',f:FT,ch:'第20章 1株当たり当期純利益に関する会計基準',t:'1株当たり当期純利益',r:'B',
T:['1株当たり当期純利益は，普通株式に係る当期純利益を普通株式の期中平均株式数で除して算定する。',
'普通株式の期中平均株式数の算定にあたっては，期中平均自己株式数を控除する。',
'当期に株式分割が行われた場合には，表示する財務諸表のうち最も古い期間の期首に株式分割が行われたと仮定して期中平均株式数を算定する。',
'潜在株式が希薄化効果を有する場合には，潜在株式調整後1株当たり当期純利益を開示する。',
'普通株式に係る当期純利益の算定上，優先配当額など普通株主に帰属しない金額は損益計算書上の当期純利益から控除する。'],
F:[['1株当たり当期純損失の場合であっても，潜在株式調整後1株当たり当期純利益を開示しなければならない。','1株当たり当期純損失の場合は，潜在株式調整後1株当たり当期純利益を開示しない。'],
['期中に株式分割が行われた場合は，分割日以降についてのみ株式数を増加させて期中平均株式数を算定する。','表示する最も古い期間の期首に分割が行われたと仮定して算定する。'],
['潜在株式調整後1株当たり当期純利益が1株当たり当期純利益を上回る場合でも，これを開示しなければならない。','その場合は希薄化効果がないため開示しない。'],
['1株当たり当期純利益の算定における株式数は，期末の発行済株式数による。','期中平均株式数による。'],
['1株当たり純資産額は，期中平均の普通株式の発行済株式数を用いて算定する。','1株当たり純資産額は，期末の普通株式の発行済株式数から期末の自己株式数を控除した株式数で算定する。']]});

T({id:'fat-impair',f:FT,ch:'固定資産の減損に係る会計基準',t:'固定資産の減損',r:'A',
T:['減損処理は，資産の収益性の低下により投資額の回収が見込めなくなった場合に，一定の条件の下で回収可能性を反映させるように帳簿価額を減額する会計処理である。',
'減損の兆候がある資産又は資産グループについて，割引前将来キャッシュ・フローの総額が帳簿価額を下回る場合には，減損損失を認識する。',
'回収可能価額とは，資産又は資産グループの正味売却価額と使用価値のいずれか高い方の金額をいう。',
'減損処理を行った資産については，減損損失の戻入れは行わない。',
'減損損失の認識の判定における割引前将来キャッシュ・フローの見積期間は，資産の経済的残存使用年数（又は主要な資産の経済的残存使用年数）と20年のいずれか短い方とする。',
'減損処理を行った資産の減価償却は，減損損失を控除した帳簿価額に基づいて行う。'],
F:[['回収可能価額とは，正味売却価額と使用価値のいずれか低い方の金額をいう。','いずれか高い方の金額である。'],
['減損損失の認識の判定には，将来キャッシュ・フローを割り引いた現在価値を用いる。','認識の判定には割引前将来キャッシュ・フローを用いる（測定には使用価値等を用いる）。'],
['減損処理後に回収可能価額が回復した場合には，減損損失を戻し入れる。','日本基準では減損損失の戻入れは行わない。'],
['減損の兆候の有無にかかわらず，すべての固定資産について毎期減損損失の認識の判定を行わなければならない。','認識の判定は，減損の兆候がある場合に行う。'],
['減損損失は，原則として営業外費用に計上する。','減損損失は原則として特別損失とする。']]});

T({id:'fat-rd',f:FT,ch:'研究開発費等に係る会計基準',t:'研究開発費・ソフトウェア',r:'B',
T:['研究開発費は，すべて発生時に費用として処理しなければならない。',
'市場販売目的のソフトウェアについて，最初に製品化された製品マスターの完成までの費用は研究開発費として処理する。',
'市場販売目的のソフトウェアの製品マスター完成後の機能の改良・強化に要した費用は，著しい改良と認められるものを除き，資産に計上する。',
'自社利用のソフトウェアについて，将来の収益獲得又は費用削減が確実であると認められる場合には，取得に要した費用を無形固定資産として計上する。',
'研究開発費には，人件費，原材料費，固定資産の減価償却費及び間接費の配賦額等，研究開発のために費消されたすべての原価が含まれる。'],
F:[['研究開発費は，将来の収益獲得が確実であると認められる場合には資産計上することができる。','研究開発費はすべて発生時に費用処理する。'],
['市場販売目的のソフトウェアの制作費は，製品マスターの完成前後を問わずすべて研究開発費として処理する。','製品マスター完成後の制作費（著しい改良を除く）は資産計上する。'],
['市場販売目的のソフトウェアの見込有効期間は，原則として5年以内とする。','原則として3年以内とする。'],
['自社利用のソフトウェアの償却は，見込販売数量に基づく方法によらなければならない。','自社利用のソフトウェアは一般に定額法（原則5年以内）で償却する。'],
['研究開発費には，研究開発に使用する固定資産の減価償却費は含まれない。','固定資産の減価償却費も研究開発費に含まれる。']]});

T({id:'fat-retire',f:FT,ch:'第24章 退職給付に関する会計基準',t:'退職給付会計',r:'A',
T:['退職給付債務は，退職給付見込額のうち期末までに発生していると認められる額を割り引いて計算する。',
'退職給付見込額の期間帰属方法として，期間定額基準と給付算定式基準の選択適用が認められている。',
'数理計算上の差異及び過去勤務費用は，原則として平均残存勤務期間以内の一定の年数で按分した額を毎期費用処理する。',
'連結財務諸表上，未認識数理計算上の差異及び未認識過去勤務費用は，税効果を調整のうえ，その他の包括利益累計額（退職給付に係る調整累計額）に計上する。',
'年金資産の額が退職給付債務を超える場合には，個別財務諸表上は前払年金費用，連結財務諸表上は退職給付に係る資産として計上する。',
'割引率は，安全性の高い債券の利回りを基礎として決定する。'],
F:[['連結財務諸表上も個別財務諸表と同様に，未認識数理計算上の差異は貸借対照表に計上されない。','連結上は即時認識し，退職給付に係る負債（資産）とその他の包括利益累計額に反映する。'],
['期待運用収益は，期末の年金資産の額に長期期待運用収益率を乗じて計算する。','期首の年金資産の額に長期期待運用収益率を乗じて計算する。'],
['退職給付見込額の期間帰属方法は，給付算定式基準のみが認められている。','期間定額基準と給付算定式基準の選択適用である。'],
['割引率は，企業の借入利子率を基礎として決定する。','安全性の高い債券の利回りを基礎として決定する。'],
['過去勤務費用とは，年金資産の期待運用収益と実際の運用成果との差異をいう。','それは数理計算上の差異である。過去勤務費用は退職給付水準の改訂等に起因して発生した退職給付債務の増減部分をいう。']]});

T({id:'fat-aro',f:FT,ch:'資産除去債務に関する会計基準',t:'資産除去債務',r:'B',
T:['資産除去債務は，有形固定資産の取得，建設，開発又は通常の使用によって発生した時に負債として計上する。',
'資産除去債務に対応する除去費用は，資産除去債務を負債として計上した時に，当該負債の計上額と同額を関連する有形固定資産の帳簿価額に加える。',
'時の経過による資産除去債務の調整額は，その発生時の費用として処理し，関連する有形固定資産の減価償却費と同じ区分に含めて計上する。',
'資産除去債務の算定に用いる割引率は，貨幣の時間価値を反映した無リスクの税引前の利率とする。',
'割引前将来キャッシュ・フローの見積りの変更による調整額は，資産除去債務の帳簿価額及び関連する有形固定資産の帳簿価額に加減して処理する。'],
F:[['資産除去債務の算定に用いる割引率は，企業の信用リスクを反映した利率とする。','無リスクの税引前の利率を用いる。'],
['除去費用は，有形固定資産の除去時に一括して費用処理する。','除去費用は資産計上し，減価償却を通じて各期に費用配分する。'],
['資産除去債務を合理的に見積ることができない場合でも，概算額で負債計上しなければならない。','合理的に見積ることができない場合は計上せず，その旨等を注記する。'],
['時の経過による資産除去債務の調整額は，営業外費用（支払利息）として処理する。','減価償却費と同じ区分に計上する。'],
['割引前将来キャッシュ・フローが増加した場合，その増加部分には負債計上時の割引率を適用する。','増加部分にはその時点の割引率を，減少部分には負債計上時の割引率を適用する。']]});

T({id:'fat-equity',f:FT,ch:'第26章 資本会計',t:'純資産の部・自己株式',r:'A',
T:['純資産の部は，株主資本と株主資本以外の各項目に区分される。',
'自己株式の取得原価は，純資産の部の株主資本の末尾に控除する形式で表示する。',
'自己株式処分差益は，その他資本剰余金に計上する。',
'自己株式処分差損によりその他資本剰余金の残高が負となった場合には，会計期間末においてその他資本剰余金をゼロとし，負の値をその他利益剰余金（繰越利益剰余金）から減額する。',
'自己株式の取得，処分及び消却に関する付随費用は，損益計算書の営業外費用に計上する。',
'新株予約権は，権利行使の有無が確定するまでの間，純資産の部に株主資本以外の項目として計上する。'],
F:[['自己株式は，有価証券として資産の部に計上する。','自己株式は株主資本から控除する。'],
['自己株式処分差損は，営業外費用として処理する。','その他資本剰余金から減額する。'],
['自己株式の取得に要した付随費用は，自己株式の取得原価に含める。','付随費用は営業外費用とする。'],
['自己株式を消却した場合には，消却の対象となった自己株式の帳簿価額を資本金から減額する。','その他資本剰余金から減額する。'],
['資本準備金を減少させて生じた剰余金は，その他利益剰余金に計上する。','その他資本剰余金に計上する（資本剰余金と利益剰余金の混同の禁止）。']]});

T({id:'fat-so',f:FT,ch:'第27章 ストック・オプション等に関する会計基準',t:'ストック・オプション',r:'A',
T:['従業員等に付与したストック・オプションは，その取得に応じて費用として計上し，対応する金額を，権利の行使又は失効が確定するまでの間，純資産の部に新株予約権として計上する。',
'ストック・オプションの公正な評価単価は付与日現在で算定し，条件変更の場合を除き，その後は見直さない。',
'ストック・オプション数は，権利不確定による失効の見積数を控除して算定し，重要な変動が生じた場合には見直す。',
'権利確定日後に権利不行使による失効が生じた場合には，失効に対応する新株予約権の額を，失効が確定した期の利益として計上する。',
'未公開企業では，公正な評価単価に代えて，単位当たりの本源的価値の見積りに基づいて会計処理を行うことができる。'],
F:[['ストック・オプションの公正な評価単価は，毎期末の株価に基づいて見直す。','付与日現在で算定し，原則として見直さない。'],
['権利不確定による失効の見積数を見直した場合，その影響は将来の期間にわたって配分する。','見直し後の数に基づく累計額と既計上額との差額を，見直した期の損益として計上する。'],
['ストック・オプションに係る費用は，付与日に一括して計上する。','対象勤務期間を基礎とする方法等により各期に配分して計上する。'],
['条件変更により公正な評価単価が付与日の公正な評価単価を下回った場合には，条件変更後の公正な評価単価に基づいて費用を計上する。','下回る場合は，付与日の公正な評価単価に基づく費用計上を継続する。'],
['権利確定日後に権利不行使による失効が生じた場合には，過去に計上した株式報酬費用を戻し入れて修正する。','過去の費用は修正せず，失効に対応する新株予約権の額を失効確定期の利益（新株予約権戻入益）とする。']]});

T({id:'fat-fx',f:FT,ch:'第28章 外貨建取引等会計処理基準',t:'外貨建取引・在外子会社の換算',r:'A',
T:['外貨建取引は，原則として当該取引発生時の為替相場による円換算額をもって記録する。',
'外国通貨及び外貨建金銭債権債務（外貨預金を含む）には，決算時の為替相場による円換算額を付す。',
'外貨建の満期保有目的の債券は決算時の為替相場による円換算額を付し，償却原価法の償却額は期中平均相場により円換算する。',
'外貨建の子会社株式及び関連会社株式には，取得時の為替相場による円換算額を付す。',
'在外子会社の資産及び負債は決算時の為替相場により，親会社による株式取得時における資本に属する項目は株式取得時の為替相場により円換算する。',
'在外子会社の換算によって生じた換算差額は，為替換算調整勘定として純資産の部に記載する。'],
F:[['外貨建の子会社株式には，決算時の為替相場による円換算額を付す。','取得時の為替相場による。'],
['外貨建その他有価証券の換算差額は，すべて当期の為替差損益として処理する。','原則として評価差額に含めて純資産の部に計上する（債券については為替差損益処理も可）。'],
['在外子会社の収益及び費用は，必ず決算時の為替相場により換算しなければならない。','原則として期中平均相場により換算する（決算時の為替相場も可）。'],
['在外子会社の換算によって生じた換算差額は，当期の為替差損益として損益計算書に計上する。','為替換算調整勘定として純資産の部に計上する。'],
['外貨建取引に係る前払金・前受金は，決算時の為替相場で換算替えを行う。','前払金・前受金は非貨幣性項目であり，換算替えを行わない。']]});

T({id:'fat-tax',f:FT,ch:'第29章 税効果会計に係る会計基準',t:'税効果会計',r:'A',
T:['税効果会計は，法人税等の額を適切に期間配分することにより，税引前当期純利益と法人税等を合理的に対応させることを目的とする。',
'一時差異とは，貸借対照表に計上されている資産及び負債の金額と課税所得計算上の資産及び負債の金額との差額をいう。',
'繰延税金資産及び繰延税金負債の金額は，回収又は支払が行われると見込まれる期の税率に基づいて計算する（資産負債法）。',
'繰延税金資産は投資その他の資産の区分に，繰延税金負債は固定負債の区分に表示する。',
'交際費の損金不算入額のような永久差異は，税効果会計の対象とならない。',
'税務上の繰越欠損金は，一時差異と同様に取り扱う（一時差異等）。'],
F:[['繰延税金資産は，関連する資産・負債の分類に基づいて流動資産と固定資産に区分して表示する。','現行基準ではすべて投資その他の資産（負債は固定負債）に表示する。'],
['繰延税金資産及び負債の計算には，一時差異が発生した年度の税率を用いる（繰延法）。','回収・支払が見込まれる期の税率を用いる資産負債法による。'],
['永久差異も将来の課税所得に影響するため，税効果会計の対象となる。','永久差異は将来解消しないため対象外である。'],
['その他有価証券の評価差額に係る税効果額は，法人税等調整額として損益計算書に計上する。','評価差額から直接控除し，法人税等調整額は計上しない。'],
['繰延税金資産と繰延税金負債は，異なる納税主体のものであっても相殺して表示する。','同一納税主体のものは相殺するが，異なる納税主体のものは相殺しない。']]});

T({id:'fat-change',f:FT,ch:'第31章 会計方針の開示，会計上の変更及び誤謬の訂正',t:'会計上の変更及び誤謬の訂正',r:'A',
T:['会計方針の変更を行った場合には，原則として新たな会計方針を過去の期間のすべてに遡及適用する。',
'会計上の見積りの変更は，変更期間のみに影響する場合には当該変更期間に，将来の期間にも影響する場合には将来にわたり会計処理を行う。',
'過去の財務諸表における誤謬が発見された場合には，修正再表示を行う。',
'有形固定資産等の減価償却方法の変更は，会計方針の変更を会計上の見積りの変更と区別することが困難な場合に該当し，遡及適用は行わない。',
'表示方法の変更を行った場合には，原則として表示する過去の財務諸表について，新たな表示方法に従い財務諸表の組替えを行う。'],
F:[['会計上の見積りの変更を行った場合には，過去の財務諸表に遡って処理する。','見積りの変更は遡及せず，当期以降で処理する。'],
['過去の誤謬の修正は，前期損益修正損益として当期の特別損益に計上する。','修正再表示を行い，累積的影響額は表示期間の最も古い期間の期首残高に反映する。'],
['会計方針とは，財務諸表の作成にあたって採用した会計処理の原則及び手続並びに表示方法をいう。','会計方針は会計処理の原則及び手続をいい，表示方法は含まない。'],
['正当な理由による会計方針の変更には，会計基準等の改正に伴う変更は含まれない。','会計基準等の改正に伴う変更と，それ以外の正当な理由による変更の両方がある。'],
['会計方針の変更は，遡及適用が実務上不可能な場合であっても，必ず過去のすべての期間に遡及適用しなければならない。','実務上不可能な場合には，遡及適用が可能な最も古い期間から適用するなどの取扱いがある。']]});

T({id:'fat-fi',f:FT,ch:'第33章 金融商品に関する会計基準',t:'金融商品会計',r:'A',
T:['金融資産の契約上の権利を生じさせる契約を締結したときは，原則として当該金融資産の発生を認識しなければならない。',
'金融資産の消滅の認識は，財務構成要素アプローチに基づき，支配が他に移転したかどうかで判断する。',
'売買目的有価証券は時価をもって貸借対照表価額とし，評価差額は当期の損益として処理する。',
'満期保有目的の債券を債券金額と異なる価額で取得した場合，その差額の性格が金利の調整と認められるときは，償却原価法に基づいて算定された価額をもって貸借対照表価額としなければならない。',
'子会社株式及び関連会社株式は，取得原価をもって貸借対照表価額とする。',
'ヘッジ会計の原則的処理方法は，ヘッジ手段に係る損益又は評価差額を，ヘッジ対象に係る損益が認識されるまで純資産の部において繰り延べる方法である。'],
F:[['満期保有目的の債券は時価をもって貸借対照表価額とし，評価差額は純資産の部に計上する。','取得原価又は償却原価をもって貸借対照表価額とする。'],
['子会社株式は時価をもって貸借対照表価額とする。','取得原価をもって貸借対照表価額とする。'],
['その他有価証券の評価差額の処理方法としては，全部純資産直入法のみが認められている。','継続適用を条件に部分純資産直入法も認められる。'],
['金融資産の消滅の認識は，リスクと経済価値のほとんどすべてが移転した場合にのみ行う（リスク・経済価値アプローチ）。','日本基準は財務構成要素アプローチによる。'],
['市場価格のない株式は，合理的に時価を算定して時価評価しなければならない。','市場価格のない株式等は取得原価をもって貸借対照表価額とする。'],
['時価が著しく下落したその他有価証券は，回復する見込みがあると認められない場合でも，評価差額を純資産の部に計上する。','減損処理を行い，評価差額を当期の損失とする。']]});

T({id:'fat-rev',f:FT,ch:'第34章 収益認識に関する会計基準',t:'収益認識',r:'A',
T:['収益認識の基本となる原則は，約束した財又はサービスの顧客への移転を，当該財又はサービスと交換に企業が権利を得ると見込む対価の額で描写するように収益を認識することである。',
'収益を認識するための5つのステップは，契約の識別，履行義務の識別，取引価格の算定，履行義務への取引価格の配分，履行義務の充足による収益の認識である。',
'取引価格には，消費税等のように第三者のために回収する額は含まれない。',
'変動対価の額の見積りにあたっては，最頻値による方法又は期待値による方法のうち，企業が権利を得ることとなる対価の額をより適切に予測できる方法を用いる。',
'取引価格は，財又はサービスの独立販売価格の比率に基づき，それぞれの履行義務に配分する。',
'企業が代理人に該当する場合は，他の当事者が提供する財又はサービスと交換に受け取る額から当該他の当事者に支払う額を控除した純額を収益として認識する。'],
F:[['一定の期間にわたり充足される履行義務について，進捗度を合理的に見積ることができない場合には，収益を一切認識しない。','発生する費用を回収することが見込まれる場合には，原価回収基準により収益を認識する。'],
['変動対価は，その見積額の全額を必ず取引価格に含めなければならない。','収益の著しい減額が発生しない可能性が高い部分に限り取引価格に含める。'],
['契約負債とは，顧客に移転した財又はサービスと交換に受け取る対価に対する企業の権利のうち，顧客との契約から生じた債権を除いたものをいう。','これは契約資産の定義である。契約負債は，財又はサービスを移転する前に対価を受け取った（又は期限が到来した）ものをいう。'],
['企業が代理人に該当する場合には，顧客から受け取る対価の総額を収益として認識する。','代理人の場合は純額で認識する。'],
['返品権付きの販売では，返品が見込まれる部分も含めて販売時に全額を収益として認識し，返品調整引当金を計上する。','返品が見込まれる部分は収益を認識せず，返金負債を計上する。']]});

T({id:'fat-cons',f:FT,ch:'第35章 連結財務諸表に関する会計基準',t:'連結財務諸表',r:'A',
T:['親会社は，原則としてすべての子会社を連結の範囲に含める。',
'連結にあたって，子会社の資産及び負債は，支配獲得日の時価により評価する（全面時価評価法）。',
'親会社の投資と子会社の資本との相殺消去にあたり生じた差額は，のれん（又は負ののれん）として処理する。',
'支配獲得後に子会社株式を追加取得した場合，追加取得した株式に対応する持分と追加投資額との差額は資本剰余金とする。',
'子会社の決算日と連結決算日の差異が3か月を超えない場合には，子会社の正規の決算を基礎として連結決算を行うことができる。',
'ダウンストリームの取引から生じた未実現損益は，全額消去し，その全額を親会社持分に負担させる。'],
F:[['支配獲得後に子会社株式を追加取得した場合に生じる差額は，のれんとして処理する。','資本剰余金として処理する。'],
['子会社の資産及び負債の評価方法として，部分時価評価法も認められている。','全面時価評価法のみである。'],
['議決権の過半数を所有していない会社は，いかなる場合も子会社に該当しない。','議決権の40%以上を所有し一定の要件を満たす場合など，支配力基準により子会社となることがある。'],
['子会社株式を一部売却し親子関係が継続している場合，売却価額と持分の減少額との差額は，連結上，子会社株式売却損益とする。','支配が継続している場合の差額は資本剰余金とする。'],
['負ののれんが生じた場合には，20年以内の期間で規則的に償却する。','負ののれんは生じた事業年度の利益として処理する。'],
['子会社の欠損のうち非支配株主の負担すべき額を超える部分も，非支配株主持分に負担させる。','超過額は親会社持分に負担させる。']]});

T({id:'fat-equitym',f:FT,ch:'第36章 持分法に関する会計基準',t:'持分法',r:'B',
T:['非連結子会社及び関連会社に対する投資については，原則として持分法を適用する。',
'関連会社とは，出資，人事，資金，技術，取引等の関係を通じて，子会社以外の他の企業の財務及び営業又は事業の方針の決定に対して重要な影響を与えることができる場合における当該他の企業をいう。',
'持分法適用会社から受け取った配当金は，当該会社に対する投資の額から減額する。',
'投資の日における投資とこれに対応する被投資会社の資本との差額のうち，のれん相当額は投資に含めて処理する。',
'持分法による投資損益は，連結損益計算書上，営業外収益又は営業外費用の区分に一括して表示する。'],
F:[['持分法適用会社から受け取った配当金は，連結上も受取配当金として収益計上する。','配当金は投資の額から減額する。'],
['持分法による投資損益は，特別損益の区分に表示する。','営業外収益又は営業外費用に一括表示する。'],
['他の企業の議決権の20%未満を所有している場合には，関連会社となることはない。','15%以上20%未満でも一定の要件を満たせば関連会社となる。'],
['持分法では，被投資会社の資産及び負債を連結財務諸表に合算する。','合算せず，投資勘定の増減として処理する（一行連結）。'],
['持分法適用関連会社へのダウンストリームの取引から生じた未実現損益は，消去する必要がない。','投資会社の持分相当額を消去する。']]});

T({id:'fat-ci',f:FT,ch:'第37章 包括利益の表示に関する会計基準',t:'包括利益の表示',r:'B',
T:['包括利益とは，特定期間の財務諸表において認識された純資産の変動額のうち，当該企業の純資産に対する持分所有者との直接的な取引によらない部分をいう。',
'その他の包括利益には，その他有価証券評価差額金，繰延ヘッジ損益，為替換算調整勘定，退職給付に係る調整額などがある。',
'当期純利益を構成する項目のうち，当期又は過去の期間にその他の包括利益に含まれていた部分は，組替調整額としてその他の包括利益の内訳項目ごとに注記する。',
'包括利益を表示する計算書は，2計算書方式と1計算書方式のいずれかで表示する。'],
F:[['包括利益には，増資や配当など株主との資本取引による純資産の変動も含まれる。','持分所有者との直接的な取引による部分は含まれない。'],

/* ============ 財務会計論：リース（企業会計基準第34号「リースに関する会計基準」） ============ */
const LCH='リース（企業会計基準第34号）';
const pvA=(r,n)=>{let s=0;for(let t=1;t<=n;t++)s+=1/Math.pow(1+r/100,t);return Math.round(s*10000)/10000;};
const pv1=(r,n)=>Math.round(1/Math.pow(1+r/100,n)*10000)/10000;
const LEASE_PRE='新リース会計基準（企業会計基準第34号）を適用している。会計期間は4月1日から3月31日までの1年間である。';

C({id:'fa-lease-init',f:FA,ch:LCH,t:'借手：リース負債と使用権資産の当初測定',r:'A',g(){
  const n=R.int(3,6), r=R.pick([2,3,4,5]), P=R.int(10,60)*100000, a=R.int(1,5)*100000, pre=R.chance(0.4)?R.int(1,3)*100000:0; const f=pvA(r,n);
  const L=rd(P*f), ROU=L+a+pre; const ask=R.pick(['リース負債','使用権資産']);
  return {q:P_(`${LEASE_PRE}当期首に機械のリース契約（借手のリース期間${n}年，解約不能，リース料は毎年3月末に${Y(P)}円を後払い，所有権移転条項・購入オプションなし）を締結し，使用を開始した。借手の追加借入利子率は年${r}%（貸手の計算利子率は知り得ない），${r}%・${n}年の年金現価係数は${f}である。リース開始時に付随費用${Y(a)}円を支払った${pre?`。また，リース開始日までにリース料${Y(pre)}円を前払いしている（上記のリース料とは別枠）`:''}。リース開始日に計上する${ask}はいくらか（円未満四捨五入）。`),
    a: ask==='リース負債'?L:ROU, u:'円', w: ask==='リース負債'?[P*n,L+a,rd(P*pvA(r,n-1)),rd(P*f*(1+r/100))]:[L,P*n+a+pre,L+a,L+pre,P*n],
    ex:`リース負債＝リース料${Y(P)}×年金現価係数${f}＝${Y(L)}<br>使用権資産＝リース負債${Y(L)}＋付随費用${Y(a)}${pre?`＋前払リース料${Y(pre)}`:''}＝${Y(ROU)}<br>よって<b>${Y(ask==='リース負債'?L:ROU)}円</b><br>借手はファイナンス／オペレーティングの区分を行わず，単一のモデルで使用権資産とリース負債を計上する。`};
}});

C({id:'fa-lease-year1',f:FA,ch:LCH,t:'借手：支払利息・減価償却・期末リース負債',r:'A',g(){
  const n=R.int(3,6), r=R.pick([2,3,4,5]), P=R.int(10,60)*100000; const f=pvA(r,n); const L=rd(P*f);
  const own=R.chance(0.3); const N=own?n+R.int(2,5):n; const int1=rd(L*r/100); const L1=L+int1-P; const dep=rd(L/N);
  const ask=R.pick(['当期の支払利息','当期末のリース負債','当期の費用合計（減価償却費と支払利息）']);
  const ans= ask==='当期の支払利息'?int1: ask==='当期末のリース負債'?L1: dep+int1;
  return {q:P_(`${LEASE_PRE}当期首に設備のリース（借手のリース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い）を開始した。${own?`契約上，リース期間終了時に所有権が借手に移転する（設備の経済的耐用年数${N}年）。`:'所有権移転条項・購入オプションはない（設備の経済的耐用年数はリース期間より長い）。'}割引率は年${r}%，年金現価係数は${f}である。付随費用はなく，使用権資産は残存価額ゼロ・定額法で償却し，利息相当額は利息法により配分する。${ask}はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w: ask==='当期の支払利息'?[rd((P*n-L)/n),rd(P*r/100),rd(P*n*r/100),rd(L1*r/100)]: ask==='当期末のリース負債'?[L-P,L-int1,P*(n-1),L1+int1]:[dep,P,dep+rd((P*n-L)/n),rd(L/(own?n:n+2))+int1,int1+rd(P*n/N)],
    ex:`リース負債（期首）＝${Y(P)}×${f}＝${Y(L)}（＝使用権資産）<br>支払利息＝${Y(L)}×${r}%＝${Y(int1)}<br>期末リース負債＝${Y(L)}＋${Y(int1)}－${Y(P)}＝${Y(L1)}<br>減価償却費＝${Y(L)}÷${N}年＝${Y(dep)}（${own?'所有権が移転するため経済的耐用年数':'所有権が移転しないため借手のリース期間'}で償却）<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-lease-term',f:FA,ch:LCH,t:'借手：リース期間の決定（延長オプション）',r:'A',g(){
  const n=R.int(2,5), m=R.int(1,3), r=R.pick([2,3,4]), P=R.int(10,50)*100000; const sure=R.chance(0.5);
  const f1=pvA(r,n), f2=pvA(r,n+m); const L1=rd(P*f1), L2=rd(P*f2); const ans=sure?L2:L1;
  return {q:P_(`${LEASE_PRE}当期首に店舗の賃貸借契約を締結した。解約不能期間は${n}年であり，借手は同条件で${m}年延長するオプションを有している。${sure?'店舗には多額の内装工事を行っており，その経済的耐用年数は延長後の期間にわたる。借手が延長オプションを行使することは合理的に確実であると判断した。':'延長を行う経済的インセンティブは乏しく，延長オプションを行使することが合理的に確実とはいえない。'}リース料は毎年3月末に${Y(P)}円を後払いする。割引率${r}%の年金現価係数は，${n}年${f1}，${n+m}年${f2}である。リース開始日のリース負債はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w:[sure?L1:L2,P*n,P*(n+m),rd(P*pvA(r,m))],
    ex:`借手のリース期間＝解約不能期間＋行使が合理的に確実な延長オプション期間。<br>本問では${sure?`延長を含めて${n+m}年`:`解約不能期間の${n}年のみ`}。<br>${Y(P)}×${sure?f2:f1}＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-lease-variable',f:FA,ch:LCH,t:'借手：変動リース料と購入オプション',r:'A',adv:true,g(){
  const n=R.int(3,5), r=R.pick([3,4,5]), P=R.int(10,40)*100000, Q=R.int(1,8)*100000, s=R.int(1,5)*100000; const f=pvA(r,n), g=pv1(r,n);
  const opt=R.chance(0.5); const E=R.int(2,10)*100000;
  const L=rd((P+Q)*f)+(opt?rd(E*g):0);
  return {q:P_(`${LEASE_PRE}当期首に開始したリースの借手のリース料は，毎年3月末に固定額${Y(P)}円と，消費者物価指数に連動する額（リース開始日の指数に基づくと${Y(Q)}円）を支払うほか，店舗売上高の1%（当期見込${Y(s)}円）を支払う（借手のリース期間${n}年）。${opt?`また，リース期間終了時に${Y(E)}円で原資産を購入するオプションを有しており，その行使は合理的に確実である。`:''}割引率${r}%の${n}年の年金現価係数は${f}，現価係数は${g}とする。リース開始日のリース負債はいくらか（円未満四捨五入）。`),
    a:L,u:'円',w:[rd((P+Q+s)*f)+(opt?rd(E*g):0),rd(P*f)+(opt?rd(E*g):0),rd((P+Q)*f)+(opt?0:rd(E*g)),rd((P+Q)*f)+(opt?E:0),rd(P*f)],
    ex:`指数・レートに応じて決まる変動リース料はリース開始日の指数でリース負債に含める。売上高に連動する変動リース料は含めず発生時の費用とする。${opt?'行使が合理的に確実な購入オプションの行使価額もリース料に含める。':''}<br>(${Y(P)}＋${Y(Q)})×${f}${opt?`＋${Y(E)}×${g}`:''}＝<b>${Y(L)}円</b>`};
}});

C({id:'fa-lease-current',f:FA,ch:LCH,t:'借手：リース負債の流動・固定区分',r:'B',adv:true,g(){
  const n=R.int(3,6), r=R.pick([2,3,4,5]), P=R.int(10,60)*100000; const f=pvA(r,n); const L=rd(P*f); const L1=L+rd(L*r/100)-P; const cur=P-rd(L1*r/100);
  const ask=R.pick(['流動負債','固定負債']); const ans=ask==='流動負債'?cur:L1-cur;
  return {q:P_(`${LEASE_PRE}当期首にリース（借手のリース期間${n}年，毎年3月末に${Y(P)}円を後払い，割引率${r}%，年金現価係数${f}）を開始した。当期末の貸借対照表において，リース負債のうち${ask}に表示される金額はいくらか（利息法，円未満四捨五入）。`),
    a:ans,u:'円',w: ask==='流動負債'?[P,L1-cur,rd(L1/(n-1)),rd(L1*r/100)]:[cur,L1,L1-P,L-P],
    ex:`当期末リース負債＝${Y(L)}＋利息${Y(rd(L*r/100))}－${Y(P)}＝${Y(L1)}<br>翌期の支払額${Y(P)}のうち元本部分＝${Y(P)}－${Y(L1)}×${r}%＝${Y(cur)} → 流動負債<br>残り${Y(L1-cur)} → 固定負債<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-lease-lessor',f:FA,ch:LCH,t:'貸手：ファイナンス・リースの利息配分',r:'B',g(){
  const n=R.int(3,6), r=R.pick([3,4,5,6]), P=R.int(10,60)*100000; const f=pvA(r,n); const Cst=rd(P*f); const i1=rd(Cst*r/100); const B1=Cst+i1-P;
  const ask=R.pick(['当期の受取利息相当額','当期末のリース投資資産']);
  return {q:P_(`${LEASE_PRE}当社（リース会社：製造又は販売以外を事業とする貸手）は当期首に機械を${Y(Cst)}円で購入し，事業の一環として直ちに貸し出した。当該リースは所有権移転外ファイナンス・リースに該当する（貸手のリース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い，見積残存価額ゼロ，貸手の計算利子率${r}%）。${ask}はいくらか（円未満四捨五入）。`),

C({id:'fa-lease-term2',f:FA,ch:'リース（企業会計基準第34号）',t:'借手：リース期間の決定（解約オプション・延長オプション）',r:'A',g(){
  const base=R.int(2,6); const ext=R.int(1,5); const hasCancel=R.chance(0.5); const cx=R.int(1,Math.max(1,base-1)); const notCancelSure=R.chance(0.5); const extSure=(hasCancel&&!notCancelSure)?false:R.chance(0.5);
  // 解約オプション：借手は base 年経過後にも解約可能で，その後 cx 年間の使用が可能
  let term=base; if(hasCancel&&notCancelSure) term+=cx; if(extSure) term+=ext;
  const desc=[`解約不能期間は${base}年である。`];
  if(hasCancel) desc.push(`借手は${base}年経過時点で解約できるが，解約しなければさらに${cx}年間使用できる（解約オプション）。借手が解約オプションを行使しないことは${notCancelSure?'合理的に確実である':'合理的に確実とはいえない'}。`);
  desc.push(`${hasCancel?`その後，`:''}借手は契約を${ext}年延長できる（延長オプション）。延長オプションを行使することは，重要な建物附属設備の存在などの経済的インセンティブを考慮すると${extSure?'合理的に確実である':'合理的に確実とはいえない'}。`);
  const all=base+(hasCancel?cx:0)+ext;
  return {q:P_(`店舗の不動産賃貸借契約について，${desc.join('')}借手のリース期間は何年か。`),
    a:term,u:'年',w:[base,all,base+ext,base+(hasCancel?cx:0),term+1,Math.max(1,term-1)],
    ex:`借手のリース期間＝解約不能期間＋行使することが合理的に確実な延長オプションの期間＋行使しないことが合理的に確実な解約オプションの期間<br>${base}年${hasCancel&&notCancelSure?`＋${cx}年`:''}${extSure?`＋${ext}年`:''}＝<b>${term}年</b>`};
}});


/* ============ 財務会計論：リース（追加）─ 新リース会計基準（第34号）と現行基準（第13号） ============

 */
const LCH13='リース取引（企業会計基準第13号）';
const LEASE_PRE13='リース取引に関する会計基準（企業会計基準第13号）を適用している。会計期間は4月1日から3月31日までの1年間である。';

/** 利息法による返済予定（各期の利息は円未満四捨五入） */
function lsched(L0,r,pays){ const bal=[L0], ints=[]; let b=L0; for(const p of pays){ const i=rd(b*r/100); ints.push(i); b=b+i-p; bal.push(b); } return {bal,ints}; }
const nz=arr=>arr.filter(x=>x!==0);

  const f=pvA(r,n), g=pv1(r,n);

  const ask=R.pick(['リース開始日のリース負債','当期の費用合計（減価償却費と支払利息）','当期末の使用権資産の帳簿価額']);

C({id:'q-lease-index',f:FA,ch:LCH,t:'借手：指数連動の変動リース料とリース負債の見直し',r:'B',g(){

  const ask=R.pick(['×2年4月1日におけるリース負債の修正額','×2年4月1日（見直し及び第2回支払後）のリース負債','×2年4月1日の見直し後の使用権資産（減価償却累計額控除前）']);
