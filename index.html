/* ============ 租税法（独自作成・論文式想定） ============ */
const TXN='（本問は3月決算の内国法人（普通法人）とし，当期は×6年4月1日から×7年3月31日までの12か月である。）';

E({id:'tax-dep-db',f:TX,ch:'法人税法',t:'減価償却：償却限度額と償却超過額（計算）',r:'A',
gen(){ const n=R.pick([5,8,10]); const rate={5:0.400,8:0.250,10:0.200}[n]; const X=R.int(10,60)*100000; const lim=X*rate; const book=lim+R.int(1,20)*10000;
  return {q:`${TXN}\n当社は当期首に機械装置${Y(X)}円を取得し，直ちに事業の用に供した。法定耐用年数${n}年，償却方法は定率法（200%定率法，償却率${rate.toFixed(3)}）である。当社は当期に減価償却費として${Y(book)}円を損金経理した。\n問：償却限度額及び税務調整（加算又は減算）を示しなさい。`,
  model:`償却限度額：${Y(X)}×${rate.toFixed(3)}＝${Y(lim)}（調整前償却額が償却保証額以上であるため，そのまま限度額となる）\n償却超過額：${Y(book)}－${Y(lim)}＝${Y(book-lim)}\n税務調整：減価償却超過額 ${Y(book-lim)}円を加算（留保）`,
  kw:['償却限度額',Y(lim),'償却超過額',Y(book-lim),'加算','留保']}; }});

E({id:'tax-dep-nintei',f:TX,ch:'法人税法',t:'減価償却：前期償却超過額の認容（計算）',r:'A',
gen(){ const lim=R.int(20,60)*10000; const book=lim-R.int(1,15)*10000; const ex=R.int(1,20)*10000; const nin=Math.min(lim-book,ex);
  return {q:`${TXN}\n建物について，当期の償却限度額は${Y(lim)}円であり，当社は減価償却費として${Y(book)}円を損金経理した。前期から繰り越された償却超過額は${Y(ex)}円である。\n問：当期の税務調整を示しなさい。`,
  model:`償却不足額：${Y(lim)}－${Y(book)}＝${Y(lim-book)}\n前期繰越償却超過額：${Y(ex)}\n認容額：いずれか少ない額＝${Y(nin)}\n税務調整：減価償却超過額認容 ${Y(nin)}円を減算（留保）${ex>nin?`\n翌期繰越償却超過額：${Y(ex-nin)}`:''}`,
  kw:['償却不足額','認容',Y(nin),'減算','少ない']}; }});

E({id:'tax-ikkatsu',f:TX,ch:'法人税法',t:'少額減価償却資産と一括償却資産（計算）',r:'A',
gen(){ const a=R.int(3,9)*10000, n1=R.int(2,10); const b=R.int(11,19)*10000, n2=R.int(2,10);
  const A=b*n2; const lim=A*12/36;
  return {q:`${TXN}\n当期に次の備品を取得し，事業の用に供するとともに，取得価額の全額を消耗品費として損金経理した。\n① 1個当たりの取得価額${Y(a)}円の備品 ${n1}個\n② 1個当たりの取得価額${Y(b)}円の備品 ${n2}個（一括償却資産の損金算入の規定を適用する）\n問：当期の税務調整を示しなさい（中小企業者等の少額減価償却資産の特例は適用しない）。`,
  model:`① 取得価額が10万円未満 → 少額の減価償却資産として損金経理額の全額が損金算入。調整なし。\n② 取得価額が20万円未満 → 一括償却資産\n　取得価額の合計：${Y(b)}×${n2}＝${Y(A)}\n　損金算入限度額：${Y(A)}×12/36＝${Y(lim)}\n　損金算入限度超過額：${Y(A)}－${Y(lim)}＝${Y(A-lim)}を加算（留保）`,
  kw:['10万円未満','20万円未満','一括償却資産','12/36',Y(lim),Y(A-lim),'加算']}; }});

E({id:'tax-kashidaore',f:TX,ch:'法人税法',t:'貸倒引当金（一括評価金銭債権）（計算）',r:'A',
gen(){ const kinds=[['卸売業',10],['小売業',10],['製造業',8],['サービス業（その他）',6]]; const k=R.pick(kinds); const B=R.int(50,200)*1000000; const off=R.int(1,10)*1000000; const jr=R.pick([0.004,0.005,0.007,0.012]);
  const L1=Math.round(B*jr), L2=(B-off)*k[1]/1000; const lim=Math.max(L1,L2); const C=Math.round(lim/10000)*10000+R.int(1,30)*10000;
  return {q:`${TXN}\n当社（資本金3,000万円，${k[0]}，大法人との完全支配関係なし）の期末一括評価金銭債権の帳簿価額は${Y(B)}円であり，このうち実質的に債権とみられない金額（同一取引先に対する買掛金との相殺可能額）は${Y(off)}円である。貸倒実績率は${jr}である。当社は貸倒引当金繰入額として${Y(C)}円を損金経理した。\n問：繰入限度額及び繰入限度超過額を求めなさい（有利な方法による）。`,
  model:`① 実績繰入率による限度額：${Y(B)}×${jr}＝${Y(L1)}\n② 法定繰入率による限度額：(${Y(B)}－${Y(off)})×${k[1]}/1,000＝${Y(L2)}\n繰入限度額：①と②のいずれか多い額＝${Y(lim)}\n繰入限度超過額：${Y(C)}－${Y(lim)}＝${Y(C-lim)}（加算・留保）`,
  kw:['実績繰入率','法定繰入率',`${k[1]}/1,000`,'実質的に債権とみられない',Y(lim),Y(C-lim)]}; }});

E({id:'tax-kesson',f:TX,ch:'法人税法',t:'欠損金の繰越控除（計算）',r:'A',
gen(){ const big=R.chance(0.5); const I=R.int(20,100)*1000000; const D=R.int(10,150)*1000000; const lim=big?I*0.5:I; const ded=Math.min(D,lim);
  return {q:`${TXN}\n当社（資本金${big?'5億円':'5,000万円（中小法人等に該当）'}）の当期の欠損金控除前の所得金額は${Y(I)}円である。前期以前10年以内に生じた青色欠損金の繰越額は${Y(D)}円である。\n問：当期に損金算入される欠損金額と，翌期へ繰り越す欠損金額を求めなさい。`,
  model:`控除限度額：${big?`${Y(I)}×50%＝${Y(lim)}（中小法人等以外は所得金額の50%が限度）`:`${Y(I)}×100%＝${Y(lim)}（中小法人等は所得金額の全額）`}\n損金算入額：${Y(D)}と${Y(lim)}のいずれか少ない額＝${Y(ded)}\n翌期繰越額：${Y(D)}－${Y(ded)}＝${Y(D-ded)}`,
  kw:[big?'50%':'100%','10年',Y(ded),Y(D-ded)]}; }});

E({id:'tax-kifu2',f:TX,ch:'法人税法',t:'寄附金の損金不算入額（指定寄附金・特定公益増進法人）（計算）',r:'A',
gen(){ const K=R.int(2,10)*10000000; const I=R.int(30,150)*1000000; const a=R.int(1,10)*100000, b=R.int(10,60)*100000, c=R.int(5,30)*100000;
  const GL=(K*2.5/1000+I*2.5/100)/4; const SP=(K*3.75/1000+I*6.25/100)/2; const non=Math.max(0,a+b+c-a-Math.min(b,SP)-GL);
  return {q:`${TXN}\n当社（期末の資本金の額及び資本準備金の額の合計額${Y(K)}円）が当期に支出した寄附金は次のとおりである（すべて損金経理，未払・仮払はない）。寄附金支出前所得金額は${Y(I)}円である。\n① 国・地方公共団体に対する寄附金（指定寄附金等）${Y(a)}円\n② 特定公益増進法人に対する寄附金 ${Y(b)}円\n③ その他の寄附金（一般寄附金）${Y(c)}円\n問：寄附金の損金不算入額を求めなさい。`,
  model:`一般寄附金の損金算入限度額：(${Y(K)}×2.5/1,000＋${Y(I)}×2.5/100)×1/4＝${Y(GL)}\n特別損金算入限度額：(${Y(K)}×3.75/1,000＋${Y(I)}×6.25/100)×1/2＝${Y(SP)}\n損金不算入額：支出総額${Y(a+b+c)}－指定寄附金等${Y(a)}－特定公益増進法人分（限度内）${Y(Math.min(b,SP))}－一般限度額${Y(GL)}＝${Y(non)}${non===0?'（マイナスのため0）':''}`,
  kw:['指定寄附金','全額損金','3.75/1,000','6.25/100','1/2','1/4',Y(non)]}; }});

E({id:'tax-kosai-big',f:TX,ch:'法人税法',t:'交際費等（資本金1億円超の法人）（計算）',r:'B',
gen(){ const tot=R.int(50,300)*1000000/10; const food=Math.round(tot*R.pick([0.3,0.4,0.5])/100000)*100000; const ok=food/2; const non=tot-ok;
  return {q:`${TXN}\n当社（資本金5億円）の当期の交際費等の額は${Y(tot)}円であり，このうち接待飲食費の額は${Y(food)}円である（1人当たり1万円以下の飲食費は含まれていない）。\n問：交際費等の損金不算入額を求めなさい。`,
  model:`資本金1億円超100億円以下の法人は定額控除限度額の適用はなく，接待飲食費の50%のみ損金算入される。\n損金算入限度額：${Y(food)}×50%＝${Y(ok)}\n損金不算入額：${Y(tot)}－${Y(ok)}＝${Y(non)}`,
  kw:['接待飲食費','50%','定額控除限度額',Y(non)]}; }});

E({id:'tax-group',f:TX,ch:'法人税法',t:'グループ法人税制',r:'A',
q:'完全支配関係がある内国法人間の取引に関するグループ法人税制について，①寄附金，②譲渡損益調整資産の譲渡，③受取配当等の取扱いを説明しなさい。',
model:'① 寄附金：法人による完全支配関係がある内国法人間の寄附金は，支出した法人において全額損金不算入となり，受領した法人においては受贈益の全額が益金不算入となる。\n② 譲渡損益調整資産：完全支配関係がある内国法人間で，固定資産・土地・有価証券（売買目的有価証券を除く）・金銭債権・繰延資産のうち譲渡直前の帳簿価額が1,000万円以上のもの（譲渡損益調整資産）を譲渡した場合，譲渡損益は繰り延べられ，譲受法人における譲渡・償却・評価換え・完全支配関係の解消等の事由が生じた時に計上する。\n③ 受取配当等：完全子法人株式等（配当等の計算期間を通じて完全支配関係があった法人の株式等）に係る配当等は，負債利子を控除することなく全額益金不算入となる。',
kw:['全額損金不算入','益金不算入','譲渡損益調整資産','1,000万円','繰り延','完全子法人株式等','全額']});

E({id:'tax-assyuku',f:TX,ch:'法人税法',t:'圧縮記帳（国庫補助金等）',r:'B',
q:'国庫補助金等で取得した固定資産の圧縮記帳について，その趣旨と経理方法を説明しなさい。',
model:'国庫補助金等は益金の額に算入されるため，そのままでは補助金の交付を受けた事業年度に課税が生じ，補助金の効果が減殺される。そこで，国庫補助金等の交付の目的に適合した固定資産を取得した場合，その交付の目的に適合した固定資産の圧縮限度額（交付を受けた国庫補助金等の額）の範囲内で帳簿価額を減額した金額を損金の額に算入することができる。\nこれは課税の免除ではなく，減価償却費の減少や譲渡時の譲渡益の増加を通じて将来課税される課税の繰延べである。\n経理方法には，直接減額方式のほか，確定した決算において積立金として積み立てる方法（剰余金の処分による積立金方式を含む）がある。',
kw:['益金','圧縮限度額','損金','課税の繰延','直接減額','積立金']});

E({id:'tax-dozoku',f:TX,ch:'法人税法',t:'同族会社の判定（計算・理論）',r:'B',
gen(){ const g=[R.int(15,30),R.int(8,20),R.int(5,15),R.int(3,10),R.int(3,10)]; const rest=100-g.reduce((a,b)=>a+b,0); if(rest<0) return this.gen(); const top3=g.slice(0,3).reduce((a,b)=>a+b,0); const is=top3>50;
  return {q:`当社（発行済株式総数100,000株，自己株式なし）の株主グループ別の持株割合は，Aグループ${g[0]}%，Bグループ${g[1]}%，Cグループ${g[2]}%，Dグループ${g[3]}%，Eグループ${g[4]}%，その他少数株主${rest}%である（各グループは株主とその同族関係者で構成される）。\n問：当社が同族会社に該当するかどうかを判定し，その理由を述べなさい。`,
  model:`同族会社とは，会社の株主等の3人以下並びにこれらと特殊の関係のある個人及び法人（同族関係者）がその会社の発行済株式等の総数の50%を超える数を有する場合等におけるその会社をいう。\n上位3グループの持株割合：${g[0]}%＋${g[1]}%＋${g[2]}%＝${top3}%\n${is?'50%を超えるため，同族会社に該当する。':'50%以下であるため，同族会社に該当しない。'}`,
  kw:['3人以下','同族関係者','50%を超',`${top3}%`,is?'該当する':'該当しない']}; }});

E({id:'tax-kubun',f:TX,ch:'所得税法',t:'所得区分の判定',r:'A',
gen(){ const pool=[['所有するアパートの家賃収入','不動産所得'],['上場株式の譲渡益','譲渡所得（株式等に係る譲渡所得等として申告分離課税）'],['本人が保険料を負担した生命保険契約の満期一時金','一時所得'],['会社員が副業で受け取った原稿料','雑所得（業務に係る雑所得）'],['銀行預金の利子','利子所得（源泉分離課税）'],['勤務先から受け取った賞与','給与所得'],['勤続30年で退職した際に受け取った退職金','退職所得'],['保有期間10年超の山林を伐採して譲渡したことによる所得','山林所得'],['懸賞の賞金','一時所得'],['公的年金','雑所得（公的年金等）'],['上場株式の配当','配当所得'],['個人で営む小売業の売上','事業所得']];
  const pk=R.pickN(pool,5);
  return {q:'居住者に生じた次の所得は，所得税法上いずれの所得に区分されるか答えなさい。\n'+pk.map((x,i)=>`${'①②③④⑤'[i]} ${x[0]}`).join('\n'),
  model:pk.map((x,i)=>`${'①②③④⑤'[i]} ${x[1]}`).join('\n'),
  kw:[...new Set(pk.map(x=>x[1].split('（')[0]))]}; }});

E({id:'tax-tsusan',f:TX,ch:'所得税法',t:'損益通算（計算・理論）',r:'A',
gen(){ const G=R.int(40,90)*100000; const L=R.int(10,40)*100000; const x=R.int(1,Math.floor(L/100000))*100000; const z=R.int(1,5)*100000; const ded=L-Math.min(L,x); const tot=G-ded;
  return {q:`居住者Dの本年分の各種所得の金額は次のとおりである。\n・給与所得の金額 ${Y(G)}円\n・不動産所得の金額 △${Y(L)}円（必要経費には，土地等を取得するために要した負債の利子${Y(x)}円が含まれている）\n・雑所得の金額（業務に係るもの）△${Y(z)}円\n問：損益通算後の総所得金額を求め，損益通算の対象とならない損失について説明しなさい。`,
  model:`不動産所得の損失のうち，土地等を取得するために要した負債の利子に相当する部分${Y(Math.min(L,x))}は損益通算の対象外。\n通算対象となる不動産所得の損失：${Y(L)}－${Y(Math.min(L,x))}＝${Y(ded)}\n雑所得の損失は損益通算できない（損益通算の対象は不動産所得・事業所得・山林所得・譲渡所得の損失に限られる）。\n総所得金額：${Y(G)}－${Y(ded)}＝${Y(tot)}`,
  kw:['土地等を取得するために要した負債の利子','雑所得','不動産所得','事業所得','山林所得','譲渡所得',Y(tot)]}; }});

E({id:'tax-iryo',f:TX,ch:'所得税法',t:'医療費控除（計算）',r:'A',
gen(){ const S=R.int(20,150)*10000; const H=R.int(0,Math.floor(S/10000)-10)*10000; const inc=R.int(100,800)*10000; const th=Math.min(100000,inc*0.05); const d=Math.min(2000000,Math.max(0,S-H-th));
  return {q:`居住者Eが本年中に支払った医療費（本人及び生計を一にする親族分）は${Y(S)}円であり，このうち保険金等で補塡された金額は${Y(H)}円である。Eの本年分の総所得金額等は${Y(inc)}円である（セルフメディケーション税制は選択しない）。\n問：医療費控除の額を求めなさい。`,
  model:`足切額：10万円と総所得金額等×5%（${Y(inc*0.05)}）のいずれか少ない額＝${Y(th)}\n医療費控除額：(${Y(S)}－${Y(H)})－${Y(th)}＝${Y(d)}（限度額200万円）`,
  kw:['10万円','5%','いずれか少ない','200万円',Y(d)]}; }});

E({id:'tax-joto',f:TX,ch:'所得税法',t:'総合課税の譲渡所得（計算）',r:'B',
gen(){ const s=R.int(10,60)*10000, l=R.int(20,100)*10000; const sd=Math.min(500000,s); const ld=500000-sd; const s2=s-sd, l2=Math.max(0,l-ld); const inc=s2+l2/2;
  return {q:`居住者Fは本年，次の資産（いずれも総合課税の対象となる資産）を譲渡した。\n・取得後3年で譲渡した絵画：譲渡益 ${Y(s)}円\n・取得後8年で譲渡したゴルフ会員権：譲渡益 ${Y(l)}円\n問：総所得金額に算入される譲渡所得の金額を求めなさい。`,
  model:`保有期間5年以内は短期，5年超は長期となる。\n特別控除額50万円は短期譲渡益から先に控除する。\n短期：${Y(s)}－${Y(sd)}＝${Y(s2)}\n長期：${Y(l)}－${Y(ld)}＝${Y(l2)}\n総所得金額算入額：${Y(s2)}＋${Y(l2)}×1/2＝${Y(inc)}`,
  kw:['5年','短期','長期','50万円','1/2',Y(inc)]}; }});

E({id:'tax-kazei-kubun',f:TX,ch:'消費税法',t:'課税・非課税・免税・不課税の区分',r:'A',
gen(){ const pool=[['土地の譲渡','非課税'],['住宅の貸付け（貸付期間1か月以上）','非課税'],['商品の輸出販売','免税（輸出免税）'],['国内での商品販売','課税'],['受取配当金','不課税（課税対象外）'],['寄附金の受領','不課税（課税対象外）'],['有価証券（株式）の譲渡','非課税'],['事務所用建物の貸付け','課税'],['貸付金の利子','非課税'],['国際輸送','免税（輸出免税）'],['社会保険診療','非課税'],['保険金の受領（損害保険）','不課税（課税対象外）']];
  const pk=R.pickN(pool,5);
  return {q:'国内の事業者が行う次の取引は，消費税法上，課税取引・非課税取引・免税取引・不課税取引（課税対象外）のいずれに該当するか答えなさい。\n'+pk.map((x,i)=>`${'①②③④⑤'[i]} ${x[0]}`).join('\n'),

  kw:[...new Set(pk.map(x=>x[1].split('（')[0]))]}; }});

E({id:'tax-ratio',f:TX,ch:'消費税法',t:'課税売上割合と95%ルール（計算）',r:'A',
gen(){ const T=R.int(100,450)*1000000; const X=R.int(0,50)*1000000; const N=R.int(1,60)*1000000; const r=(T+X)/(T+X+N); const pct=Math.floor(r*10000)/100;
  const full= (T+X)<=500000000 && r>=0.95;
  return {q:`当課税期間（12か月）における当社の売上高（税抜）の内訳は，課税売上高${Y(T)}円，輸出免税売上高${Y(X)}円，非課税売上高${Y(N)}円である（売上に係る対価の返還等はない）。\n問：課税売上割合を求め，仕入税額の全額控除が認められるかを判定しなさい（課税売上割合は小数点以下第2位未満切捨て）。`,
  model:`課税売上割合＝(課税売上高＋免税売上高)÷(課税売上高＋免税売上高＋非課税売上高)\n＝(${Y(T)}＋${Y(X)})÷${Y(T+X+N)}＝${pct}%\n全額控除の要件：課税売上高が5億円以下（当課税期間の課税売上高${Y(T+X)}円）かつ課税売上割合が95%以上\n判定：${full?'要件を満たすため，課税仕入れ等の税額の全額を控除できる。':'要件を満たさないため，個別対応方式又は一括比例配分方式により控除額を計算する。'}`,
  kw:['免税売上高','非課税売上高','95%','5億円',`${pct}%`]}; }});

E({id:'tax-kobetsu',f:TX,ch:'消費税法',t:'仕入税額控除：個別対応方式と一括比例配分方式（計算）',r:'A',
gen(){ const a=R.int(50,300)*100000, b=R.int(5,50)*100000, c=R.int(20,150)*100000; const r=R.pick([0.8,0.75,0.85,0.9,0.6]); const ko=a+c*r, ik=(a+b+c)*r;
  return {q:`当課税期間の課税売上割合は${r*100}%（課税売上高は5億円以下）である。課税仕入れ等に係る消費税額（国税分）の区分は次のとおりである。\n・課税資産の譲渡等にのみ要するもの ${Y(a)}円\n・その他の資産の譲渡等（非課税売上）にのみ要するもの ${Y(b)}円\n・共通して要するもの ${Y(c)}円\n問：個別対応方式と一括比例配分方式による控除対象仕入税額をそれぞれ求め，有利な方式を答えなさい。`,
  model:`個別対応方式：${Y(a)}＋${Y(c)}×${r*100}%＝${Y(ko)}\n一括比例配分方式：(${Y(a)}＋${Y(b)}＋${Y(c)})×${r*100}%＝${Y(ik)}\n有利な方式：${ko>=ik?'個別対応方式':'一括比例配分方式'}（なお，一括比例配分方式を選択した場合は2年間継続適用が必要）`,
  kw:['個別対応方式','一括比例配分方式',Y(ko),Y(ik),'2年']}; }});

E({id:'tax-niwari',f:TX,ch:'消費税法',t:'2割特例（計算）',r:'B',

  model:`売上税額：${Y(S)}×7.8%＝${Y(tax)}\n2割特例による納付税額：${Y(tax)}×20%＝${Y(pay)}（控除対象仕入税額を売上税額の80%とする）\n※2割特例は，令和5年10月1日から令和8年9月30日までの日の属する各課税期間に適用できる。`,

E({id:'tax-sogo',f:TX,ch:'法人税法',t:'総合問題：所得金額と法人税額（計算）',r:'A',adv:true,
gen(){ const NI=R.int(20,80)*1000000; const hz=R.int(5,20)*1000000; const dep=R.int(1,10)*100000; const kosai=R.int(1,30)*100000; const fine=R.int(1,5)*10000; const div=R.int(2,10)*100000; const divEx=div/2; const zei=R.int(3,12)*100000;
  const inc=NI+hz+dep+kosai+fine-divEx-zei; const t1=Math.min(inc,8000000)*0.15; const t2=Math.max(0,inc-8000000)*0.232; const tax=Math.floor((t1+t2)/100)*100;
  return {q:`${TXN}\n当社（資本金5,000万円，中小法人等に該当，大法人との完全支配関係なし）の当期の資料は次のとおりである。\n① 確定した決算による当期純利益 ${Y(NI)}円\n② 損金経理をした法人税・住民税（当期中間納付分及び納税充当金繰入額）${Y(hz)}円\n③ 減価償却超過額 ${Y(dep)}円\n④ 交際費等の損金不算入額 ${Y(kosai)}円\n⑤ 損金経理した交通反則金 ${Y(fine)}円\n⑥ 受取配当金 ${Y(div)}円（その他の株式等に該当，益金不算入割合50%）\n⑦ 前期分の事業税を当期に納付し損金経理した額（前期に納税充当金から支出）${Y(zei)}円\n問：当期の所得金額及び法人税額（年800万円以下の部分は15%，超える部分は23.2%）を求めなさい（税額控除はないものとし，100円未満切捨て）。`,
  model:`【所得金額】\n当期純利益 ${Y(NI)}\n加算：損金経理をした法人税・住民税等 ${Y(hz)}\n　　　減価償却超過額 ${Y(dep)}\n　　　交際費等の損金不算入額 ${Y(kosai)}\n　　　交通反則金（損金不算入）${Y(fine)}\n減算：受取配当等の益金不算入額 ${Y(div)}×50%＝${Y(divEx)}\n　　　納税充当金から支出した事業税等 ${Y(zei)}\n所得金額＝${Y(inc)}\n【法人税額】\n800万円以下：${Y(Math.min(inc,8000000))}×15%＝${Y(t1)}\n800万円超：${Y(Math.max(0,inc-8000000))}×23.2%＝${Y(t2)}\n合計＝${Y(tax)}（100円未満切捨て）`,
  kw:['加算','減算','損金不算入','益金不算入','事業税','15%','23.2%',Y(inc),Y(tax)]}; }});

    subs:[
      { q:'問1　「収益認識に関する会計基準」の基本となる原則を述べたうえで，収益を認識するための5つのステップを順に説明しなさい。',
        pts:10,
        model:'基本となる原則は，約束した財又はサービスの顧客への移転を，当該財又はサービスと交換に企業が権利を得ると見込む対価の額で描写するように収益を認識することである。\nこの原則に従って，次の5つのステップを適用する。\nステップ1：顧客との契約を識別する。\nステップ2：契約における履行義務（顧客への財又はサービスの移転に関する別個の約束）を識別する。\nステップ3：取引価格（財又はサービスの顧客への移転と交換に企業が権利を得ると見込む対価の額。第三者のために回収する額を除く）を算定する。\nステップ4：契約に複数の履行義務がある場合，独立販売価格の比率に基づき取引価格を各履行義務に配分する。\nステップ5：履行義務を充足した時に又は充足するにつれて（顧客が財又はサービスに対する支配を獲得した時点で）収益を認識する。',
        kw:['権利を得ると見込む対価の額','契約の識別','履行義務の識別','取引価格の算定','独立販売価格','配分','支配','履行義務の充足'],
        ex:'基本原則（何を・いくらで描写するか）と5ステップの順序・内容を正確に述べられるかを問う。ステップ4の配分基準が「独立販売価格の比率」であること，ステップ5が「支配の移転」を基準とすることを明記できているかが採点のポイント。' },
      { q:'問2　変動対価の額の見積方法及び見積りの制限（取引価格に含める範囲）について説明したうえで，第1四半期にA社が計上すべき売上高及び負債の額を，勘定科目とともに示しなさい。',
        pts:12,
        model:'変動対価とは，顧客と約束した対価のうち変動する可能性のある部分をいい，値引き，リベート，返金，インセンティブ，業績に基づく割増金，ペナルティー等の形態がある。変動対価の額は，発生し得ると考えられる対価の額における最も可能性の高い単一の金額（最頻値）による方法，又は発生し得ると考えられる対価の額を確率で加重平均した金額（期待値）による方法のうち，企業が権利を得ることとなる対価の額をより適切に予測できる方法を用いて見積る。\nただし，見積った変動対価の額については，変動対価の額に関する不確実性が事後的に解消される際に，解消される時点までに計上された収益の著しい減額が発生しない可能性が高い部分に限り，取引価格に含める。\n本問では当年度の購入数量が1,000個を超えると見込まれるため，取引価格は単価90円で見積る。\n売上高：300個×90円＝27,000円\n返金負債：30,000円－27,000円＝3,000円\n（仕訳）（借）現金 30,000／（貸）売上高 27,000・返金負債 3,000',
        kw:['最頻値','期待値','著しい減額が発生しない可能性が高い','27,000','返金負債','3,000'],
        ex:'変動対価の見積方法（最頻値・期待値）と，収益の著しい減額が生じない可能性が高い部分に限るという制限の2点が理論の柱。計算では受取額30,000円を全額売上とする誤りや，リベートを販売費として処理する誤りが多い。' },
      { q:'問3　C社に対する返品権付きの販売について，返品が見込まれる部分の会計処理とその理由を説明しなさい。',

        model:'返品権付きの販売を行った場合，企業は，返品されると見込まれる製品については収益を認識せず，当該製品について受け取った又は受け取る対価の額で返金負債を認識する。また，返金負債の決済時に顧客から製品を回収する権利について，返品資産を認識し，その額は製品の従前の帳簿価額から回収費用（価値の潜在的な下落を含む）の見込額を控除した額とし，同額を売上原価から控除する。\n理由：返品が見込まれる部分については，企業は最終的に対価を返金することになるため，権利を得ると見込む対価には含まれず，変動対価として取引価格から除かれるからである。従来のように返品調整引当金を計上して売上総利益を調整する方法は認められない。',

    subs:[

        pts:10,
        model:'収益費用アプローチは，一期間の収益と費用の差額として利益を計算する考え方であり，収益・費用を基礎概念とし，その適切な期間帰属（実現主義・発生主義・費用収益対応の原則）を重視する。貸借対照表は，収益・費用の期間配分の結果として生じる未解消項目（繰延資産等）を収容する，損益計算の連結環としての役割を担う（損益計算書重視）。\nこれに対して資産負債アプローチは，資産・負債を基礎概念として先に定義し，一期間における純資産の増加額（資本取引を除く）として利益を計算する考え方である。収益・費用は資産・負債の増減として定義されるため，将来の経済的便益をもたらさない項目は資産に計上されず，貸借対照表による財政状態の表示が重視される。',

      { q:'問2　概念フレームワークにおける資産及び負債の定義を示し，資産・負債を基礎概念としつつも純利益を重視する理由を説明しなさい。',
        pts:10,
        model:'資産とは，過去の取引または事象の結果として，報告主体が支配している経済的資源をいう。負債とは，過去の取引または事象の結果として，報告主体が支配している経済的資源を放棄もしくは引き渡す義務，またはその同等物をいう。\n概念フレームワークは，定義の明確性を確保する観点から，まず資産・負債を定義し，それらの差額として純資産を定義している。しかし，これは資産・負債の測定値の変動をそのまま利益とすることを意味しない。投資家が企業価値を評価する際には，企業の将来キャッシュフローの予測に役立つ情報，すなわち投資の成果を示す純利益が重要であり，純利益は長年にわたり投資家の意思決定に用いられてきた実績がある。そのため，資産・負債を基礎概念として定義しつつも，純利益の情報価値を重視し，純利益と包括利益を併せて表示する立場をとっている。',

  RB({
    id:'rb-mg-4', s:'mg', t:'設備投資の経済性計算（NPV・IRR・回収期間）',
    src:'設備投資意思決定',
    gen(){
      const I=R.int(8,15)*4000, n=4, D=I/n, WC=R.int(2,6)*1000;
      const k=R.pick([6,8,10]), tax=30;
      const CI=R.int(round(I*0.28/10),round(I*0.42/10))*10;
      function round(x){ return Math.round(x); }
      const CF=CI*(100-tax)/100+D*tax/100;
      const df=[]; for(let t=1;t<=n;t++) df.push(Math.round(10000/Math.pow(1+k/100,t))/10000);
      const pvs=df.map(d=>CF*d), pvWC=WC*df[n-1];
      const npvRaw=pvs.reduce((s,x)=>s+x,0)+pvWC-I-WC, NPV=rd(npvRaw);
      const npvAt=r=>{ let s=-I-WC; for(let t=1;t<=n;t++) s+=CF/Math.pow(1+r,t); return s+WC/Math.pow(1+r,n); };
      let lo=-0.99, hi=1; for(let i=0;i<200;i++){ const mid=(lo+hi)/2; if(npvAt(mid)>0) lo=mid; else hi=mid; }

      const pb=(I+WC)/CF;
      const q=`<p>K社（3月決算）は，新製品の生産のため設備投資案を検討している。資料は次のとおりである（単位：千円）。</p>`+
        `<p>1．設備の取得原価は${Y(I)}千円で，×1年4月1日に支払う。耐用年数${n}年，残存価額ゼロ，定額法で減価償却する（税法上も同じ）。${n}年後の処分価値はゼロとする。</p>`+
        `<p>2．投資開始時に正味運転資本${Y(WC)}千円が必要となり，これは${n}年度末に全額回収される。</p>`+
        `<p>3．本投資により，各年度に現金収入から現金支出を控除した税引前の正味現金流入額${Y(CI)}千円が得られる（各年度末に発生するものとする）。</p>`+
        `<p>4．法人税等の税率は${tax}％であり，K社は全体として黒字であるため，減価償却費による節税効果は各年度に生じる。税引後の資本コスト率は${k}％である。</p>`+
        `<p>5．${k}％の現価係数：`+df.map((d,i)=>`${i+1}年 ${d.toFixed(4)}`).join('，')+`</p>`+
        `<p>計算過程では端数処理を行わず，最終数値の千円未満を四捨五入すること。</p>`;
      const subs=[
        { q:'問1　各年度の税引後正味キャッシュ・フロー（運転資本の回収を除く）を計算しなさい。',
          pts:6,
          model:`減価償却費：${Y(I)}÷${n}年＝${Y(D)}千円\n税引後キャッシュ・フロー＝税引前正味現金流入額×(1－税率)＋減価償却費×税率\n＝${Y(CI)}×${100-tax}％＋${Y(D)}×${tax}％\n＝${Y(CI*(100-tax)/100)}＋${Y(D*tax/100)}＝${Y(CF)}千円（各年度）`,
          kw:['タックス・シールド',Y(D),Y(D*tax/100),Y(CF)],
          ex:'減価償却費は現金支出を伴わないが，課税所得を減らすことで税額を節約する（タックス・シールド）。税引後利益に減価償却費を足し戻す方法で計算しても同じ結果になる。' },
        { q:'問2　正味現在価値（NPV）を計算し，投資案の採否を判断しなさい。',
          pts:8,
          model:`各年度CFの現在価値：`+df.map((d,i)=>`${i+1}年 ${Y(CF)}×${d.toFixed(4)}`).join('，')+`\nCFの現在価値合計：${Y(CF)}×${df.reduce((s,d)=>s+d,0).toFixed(4)}＝${yen(pvs.reduce((s,x)=>s+x,0),1)}千円\n運転資本回収額の現在価値：${Y(WC)}×${df[n-1].toFixed(4)}＝${yen(pvWC,1)}千円\n初期投資：設備${Y(I)}＋運転資本${Y(WC)}＝${Y(I+WC)}千円\nNPV＝${yen(pvs.reduce((s,x)=>s+x,0)+pvWC,1)}－${Y(I+WC)}＝${Y(NPV)}千円\n判断：NPVが${NPV>0?'正であるため，本投資案を採用すべきである':'負（又はゼロ）であるため，本投資案は採用すべきでない'}。`,
          kw:['正味現在価値','運転資本の回収',Y(I+WC),Y(NPV),NPV>0?'採用':'不採用'],
          ex:'正味運転資本は投資時の支出と最終年度の回収の両方を考慮する。回収分の割引を忘れたり，運転資本を投資額に含め忘れたりする誤りが多い。' },
        { q:'問3　本投資案の内部利益率（IRR）が資本コスト率を上回るか否かを，計算を行わずに理由を付して判断しなさい。また，単純回収期間（年，小数第2位まで四捨五入。運転資本を含む初期投資額を毎年の税引後CFで回収すると考える）を求め，回収期間法の問題点を述べなさい。',
          pts:8,
          model:`内部利益率はNPVをゼロとする割引率である。本投資案のCFは初期に支出，その後に収入が生じる通常型であり，割引率が高いほどNPVは小さくなる。資本コスト率${k}％で割り引いたNPVが${NPV>0?'正であるから，IRRは資本コスト率を上回る':'負（又はゼロ）であるから，IRRは資本コスト率以下である'}（参考：IRR≒${pct(irr,1)}％）。\n回収期間：${Y(I+WC)}÷${Y(CF)}＝${pct(pb,2)}年\n回収期間法は，計算が簡便で安全性（流動性）の尺度として有用であるが，①貨幣の時間価値を考慮しない，②回収期間後のキャッシュ・フローを無視するため収益性を測定できない，③採否の基準となる回収期間の設定が恣意的である，という問題点がある。`,
          kw:['内部利益率','NPVをゼロ',NPV>0?'上回る':'下回る',pct(pb,2),'貨幣の時間価値','回収期間後'],
          ex:'NPVとIRRは単一の独立投資案の採否については同じ結論となる。回収期間法の欠点は「時間価値の無視」と「回収後CFの無視」の2点が必須。' },
        { q:'問4　相互排他的な複数の投資案を順位付けする場合に，NPV法とIRR法とで結論が異なることがある理由を説明し，いずれの方法を用いるべきかを論じなさい。',
          pts:8,
          model:'NPV法とIRR法の順位が食い違うのは，主として投資規模の違いやキャッシュ・フローの発生パターン（時期）の違いがある場合である。その根本原因は再投資利回りの仮定にあり，NPV法は途中で回収したキャッシュ・フローが資本コスト率で再投資されると仮定するのに対し，IRR法はIRRそのもので再投資されると仮定する。また，IRRは比率であるため投資規模を反映せず，規模の大きい投資案がもたらす絶対額としての価値増加を評価できない。さらに，非通常型のキャッシュ・フローでは複数のIRRが存在したり，IRRが存在しないことがある。\n企業価値（株主の富）の最大化という目標に照らせば，投資によって増加する価値の絶対額を示し，現実的な再投資率（資本コスト率）を前提とするNPV法を用いるべきである。',
          kw:['投資規模','発生パターン','再投資','資本コスト率','複数のIRR','企業価値','NPV法'],
          ex:'食い違いの原因（規模・時期→再投資率の仮定）と，企業価値最大化の観点からNPV法が優れる理由を論理的につなげられるかがポイント。' },
      ];
      return {q,subs};
    },
  });

  /* ------------------------------------------------------------

  RB({

    gen(){
      const k=R.pick([8,10]);
      const IA=R.int(10,30)*10000, roiA=R.int(18,24), PA=IA*roiA/100;

      const wacc=(wd*rdp*(100-tax)/100+(100-wd)*re)/100; // %

      const EVA=rd(NOPAT-IC*wacc/100);
      const q=`<p>L社は事業部制を採用しており，事業部長の業績を評価している。A事業部に関する資料は次のとおりである（単位：千円）。</p>`+

        `<p>また，L社全体について，投下資本${Y(IC)}千円，税引後営業利益（NOPAT）${Y(NOPAT)}千円である。資本構成（時価ベース）は負債${wd}％・株主資本${100-wd}％，負債の税引前コストは${rdp}％，株主資本コストは${re}％，法人税等の税率は${tax}％である。</p>`;
      const subs=[
        { q:'問1　新規投資案の実行前と実行後のA事業部の投資利益率（ROI，％，小数第2位まで四捨五入）及び残余利益（RI）を計算しなさい。',
          pts:8,
          model:`（実行前）ROI：${Y(PA)}÷${Y(IA)}＝${pct(roiA,2)}％\nRI：${Y(PA)}－${Y(IA)}×${k}％＝${Y(riA)}千円\n（新規投資案単独）ROI：${Y(Pp)}÷${Y(Ip)}＝${roiP}％，RI：${Y(Pp)}－${Y(Ip)}×${k}％＝${Y(riP)}千円\n（実行後）ROI：(${Y(PA)}＋${Y(Pp)})÷(${Y(IA)}＋${Y(Ip)})＝${pct(roiA2,2)}％\nRI：(${Y(PA)}＋${Y(Pp)})－(${Y(IA)}＋${Y(Ip)})×${k}％＝${Y(riA2)}千円`,
          kw:[`${pct(roiA,2)}％`,`${pct(roiA2,2)}％`,Y(riA),Y(riA2),Y(riP)],
          ex:'投資案単独のROIは資本コスト率を上回るが，既存事業のROIを下回るため，実行後の事業部ROIは低下する一方でRIは増加する。この対比が問2の論点につながる。' },
        { q:'問2　A事業部長がROIで評価される場合とRIで評価される場合のそれぞれについて，新規投資案を実行するかどうかを予想し，全社的観点から望ましい結論と比較して論じなさい。',
          pts:8,
          model:`ROIで評価される場合，実行後のROIは${pct(roiA,2)}％から${pct(roiA2,2)}％に低下するため，事業部長は自己の評価を下げないよう投資案を棄却すると予想される。RIで評価される場合，RIは${Y(riA)}千円から${Y(riA2)}千円へ${Y(riP)}千円増加するため，事業部長は投資案を実行すると予想される。\n投資案のROI（${roiP}％）は資本コスト率（${k}％）を上回っており，全社的には資本コストを超える利益を生み企業価値を高めるため実行すべき案である。したがって，ROIによる評価は，事業部にとっての最適と全社にとっての最適が一致しない部分最適化（目標不整合）を引き起こし，収益性の高い事業部ほど有利な投資機会を見送る傾向を生む。RIによる評価は，資本コストを上回る投資であれば事業部長に実行の動機を与えるため，目標整合性の点で優れている。`,
          kw:['棄却','実行','資本コスト率を上回る','部分最適','目標整合性','企業価値'],

          pts:7,
          model:`WACC＝負債${wd}％×${rdp}％×(1－${tax}％)＋株主資本${100-wd}％×${re}％\n＝${pct(wd*rdp*(100-tax)/10000,2)}％＋${pct((100-wd)*re/100,2)}％＝${pct(wacc,2)}％\nEVA＝NOPAT－投下資本×WACC＝${Y(NOPAT)}－${Y(IC)}×${pct(wacc,2)}％＝${Y(NOPAT)}－${Y(rd(IC*wacc/100))}＝${Y(EVA)}千円\n${EVA>0?'EVAが正であり，資本コストを上回る価値を創造している。':EVA<0?'EVAが負であり，資本コストに見合う利益を上げておらず価値を毀損している。':'EVAはゼロであり，ちょうど資本コストに見合う利益である。'}`,
          kw:['加重平均資本コスト',`${pct(wacc,2)}％`,'税引後','NOPAT',Y(EVA)],
          ex:'負債コストは支払利息の節税効果を反映して税引後に換算する。EVAは株主資本コストも含めた全資本コストを控除した後の経済的利益であり，会計上の利益との違いを意識すること。' },
        { q:'問4　残余利益（RI）による業績評価の短所を挙げ，EVAがそれに対してどのような工夫をしているかを説明しなさい。',
          pts:7,
          model:'RIは金額による指標であるため，規模の異なる事業部間の比較には適さず，規模の大きい事業部ほど有利に評価されやすい。また，会計上の利益と簿価ベースの投下資本に基づくため，研究開発費や広告宣伝費など将来の利益をもたらす支出を即時費用化すると利益が過小になり，事業部長が長期的に必要な支出を削減する短期志向を招くおそれがある。さらに，資本コスト率の設定にも恣意性が残る。\nEVAは残余利益の一種であるが，①利益として税引後営業利益（NOPAT）を用い，②資本コストとして負債と株主資本を加重平均したWACCを用いて，株主の期待収益も考慮した経済的な利益を測定する。また，研究開発費等を資本化するなど会計数値に種々の調整を加えることで，会計上の歪みを修正し，企業価値の創造との結び付きを強めている。',
          kw:['規模','比較','短期志向','会計上の歪み','NOPAT','WACC','研究開発費','資本化'],
          ex:'RIの短所（規模・会計数値の歪み・短期志向）と，EVAがNOPAT・WACC・会計調整でこれに対応していることを対応付けて述べる。' },

  });

    subs:[
      { q:'問1　財務指標のみによる業績評価の問題点を説明したうえで，BSCの4つの視点とその内容を説明しなさい。',
        pts:10,
        model:'財務指標は過去の活動の結果を示す遅行指標であり，将来の業績をもたらす顧客関係，業務プロセス，人材・組織能力などの無形の資産の状態を反映しない。そのため財務指標のみで評価すると，研究開発・人材育成・顧客サービスへの支出を削減して短期的な利益を上げる短期志向が生じ，長期的な企業価値を損なうおそれがある。M社の新製品開発の遅れや顧客満足度の低下はその表れといえる。\nBSCは，ビジョンと戦略を次の4つの視点から具体的な目標・尺度に落とし込む。①財務の視点：株主の期待に応えるための収益性・成長性（ROI，EVA，売上高成長率等）。②顧客の視点：財務目標を達成するために顧客にどう評価されるべきか（顧客満足度，市場占有率，顧客維持率等）。③内部ビジネス・プロセスの視点：顧客を満足させるためにどの業務プロセスに卓越すべきか（新製品開発期間，品質，リードタイム等）。④学習と成長の視点：プロセス改善を支える人材・情報システム・組織の能力（従業員満足度，スキル，提案件数等）。',
        kw:['遅行指標','短期志向','無形の資産','財務の視点','顧客の視点','内部ビジネス・プロセスの視点','学習と成長の視点'],
        ex:'財務指標の限界（遅行性・短期志向）を事例と結び付けたうえで，4つの視点を「何を問う視点か」と代表的な尺度とともに説明できるかを見る。' },
      { q:'問2　BSCにおける戦略マップの役割と，先行指標（パフォーマンス・ドライバー）と成果指標の関係について説明しなさい。',
        pts:8,
        model:'戦略マップは，4つの視点の戦略目標の間の因果関係（学習と成長→内部ビジネス・プロセス→顧客→財務）を図示したものであり，戦略がどのように価値を創造するかを可視化して組織全体に伝達し，戦略の共有と理解を促進する役割をもつ。\nBSCでは，各戦略目標について，結果を示す成果指標（遅行指標）と，その結果をもたらす要因を示す先行指標（パフォーマンス・ドライバー）を組み合わせて設定する。例えば，従業員のスキル向上（先行指標）が開発期間の短縮をもたらし，それが顧客満足度の向上を通じて売上高成長率（成果指標）に結び付くという仮説を指標間の因果関係として組み込む。これにより，財務成果が表れる前に問題を把握して是正でき，また指標の実績を通じて戦略仮説の妥当性を検証し修正する（ダブル・ループの学習）ことが可能となる。',
        kw:['戦略マップ','因果関係','可視化','先行指標','成果指標','パフォーマンス・ドライバー','戦略仮説の検証'],
        ex:'戦略マップは「因果関係の可視化」，指標は「先行と遅行の組合せ」が鍵語。戦略仮説の検証（戦略的学習）まで述べられると高得点。' },

RB({

  q:`<p>甲株式会社（以下「甲社」という。）は，取締役会設置会社かつ監査役設置会社である公開会社であり，Aが代表取締役を務めている。</p>
<p>(1) Aは，自己が所有する土地（時価2億円）を甲社に3億円で売却する契約を甲社との間で締結した（以下「本件売買」という。）。本件売買について，甲社の取締役会の承認は得られていない。</p>
<p>(2) また，Aは，個人の事業資金としてB銀行から5億円を借り入れる際，甲社を代表して，Aの当該債務についてB銀行との間で連帯保証契約を締結した（以下「本件保証」という。）。本件保証についても取締役会の承認はなく，B銀行は，承認の有無を確認していなかった。</p>
<p>(3) 甲社の株主Cは，6か月前から引き続き甲社株式を保有している。甲社の他の取締役・監査役はAと親しく，Aの責任を追及する気配はない。</p>`,
  subs:[
    { q:'問1　本件売買の効力，およびAが甲社に対して負う責任について論じなさい。', pts:12,
      model:`1 問題提起：取締役Aが自ら甲社の相手方となる本件売買は，取締役が自己のために株式会社と取引をしようとするとき（直接取引）に当たる（会社法356条1項2号）。取締役会設置会社では取締役会の承認が必要であり（365条1項），承認を欠く本件売買の効力が問題となる。
2 規範：利益相反取引規制の趣旨は，取締役が会社の利益を犠牲にして自己の利益を図ることを防止し，会社の利益を保護する点にある。そこで，承認を欠く利益相反取引は無効と解する（最判昭43.12.25）。もっとも，無効は会社保護のためのものであるから，無効を主張できるのは会社のみであり，取締役側から主張することはできない（最判昭48.12.11）。

5 結論：甲社はAに対し本件売買の無効を主張でき，Aは423条1項に基づき損害（1億円）を賠償する責任を負う。`,

    { q:'問2　甲社はB銀行に対して本件保証の無効を主張することができるか論じなさい。', pts:10,
      model:`1 問題提起：株式会社が取締役以外の者との間で，取締役の債務を保証することは，会社と取締役との利益が相反する取引（間接取引）に当たる（356条1項3号）。承認（365条1項）を欠く本件保証をB銀行に対して無効と主張できるか。
2 規範：承認を欠く利益相反取引は会社の利益保護のため無効であるが，取締役会の承認は会社の内部的意思決定にすぎず，外部の第三者は容易にその有無を知り得ない。そこで，取引の安全との調和から，会社は第三者に対しては，当該取引について取締役会の承認を受けなかったことのほか，相手方である第三者がその事実を知っていたこと（悪意）を主張・立証して初めて無効を主張し得ると解する（相対的無効説，最判昭43.12.25）。
3 あてはめ：本件保証はAの個人債務を甲社が保証するものであり，外形的に会社の犠牲においてAが利益を受ける典型的な間接取引である。B銀行は承認の有無を確認していないが，承認がないことを知っていたとの事情は示されていない。したがって，甲社がB銀行の悪意を立証できれば無効を主張できるが，立証できなければ無効を主張できない。
4 結論：甲社は，B銀行が承認の欠如につき悪意であることを立証した場合に限り，本件保証の無効を主張できる。なお，無効を主張できない場合でも，甲社に損害が生じればAは423条1項・3項により責任を負う。`,
      kw:['356条1項3号','間接取引','相対的無効説','悪意を立証','最判昭43.12.25','取引の安全'],
      ex:'解説：間接取引では第三者の取引安全を考慮し，会社が第三者の悪意を立証しなければ無効を主張できない（相対的無効説）。直接取引との違いを明確に書くこと。学説によっては重過失も含める見解があるが，判例の要旨は「悪意」である。' },
    { q:'問3　株主Cが，Aの甲社に対する責任を追及するために採ることができる会社法上の手段と，その手続を説明しなさい。', pts:8,
      model:`1 問題提起：甲社の取締役・監査役はAの責任を追及しようとしない。役員間の仲間意識から会社による責任追及が懈怠されるおそれがあるため，株主Cによる責任追及の可否が問題となる。
2 規範：6か月前から引き続き株式を有する株主（公開会社）は，株式会社に対し，書面等により役員等の責任を追及する訴えの提起を請求することができ（847条1項），会社が請求の日から60日以内に訴えを提起しないときは，請求した株主は会社のために責任追及等の訴え（株主代表訴訟）を提起することができる（847条3項）。ただし，60日の経過により会社に回復することができない損害が生ずるおそれがある場合には，直ちに訴えを提起できる（847条5項）。提訴請求の宛先は，取締役の責任追及であるから監査役が会社を代表する（386条2項1号）。なお，株主若しくは第三者の不正な利益を図り又は会社に損害を加えることを目的とする場合は提訴請求できない（847条1項ただし書）。
3 あてはめ：Cは6か月前から引き続き甲社株式を保有しており要件を満たす。Cは甲社の監査役に対し提訴請求を行い，60日以内に甲社が提訴しなければ，Aに対し423条1項の責任（1億円）について代表訴訟を提起できる。
4 結論：Cは847条に基づき株主代表訴訟を提起できる。訴訟の目的の価額は財産権上の請求でない請求とみなされ（847条の4第1項），手数料は低額である。`,
      kw:['847条1項','6か月','60日','847条3項','監査役が会社を代表','386条','株主代表訴訟'],
      ex:'解説：代表訴訟は提訴請求→60日→提訴の流れと，取締役の責任追及の提訴請求の受領者が監査役である点（386条2項1号）が頻出。847条5項の例外，同項ただし書の不当目的も触れると加点。' },

});

RB({

  t:'株主総会決議の瑕疵と決議取消しの訴え',
  src:'第3章 機関 第2節 株主総会',
  q:`<p>乙株式会社（以下「乙社」という。）は，取締役会設置会社である公開会社であり，種類株式は発行していない。乙社は，×1年6月27日に定時株主総会を開催し，取締役Dを選任する決議（以下「本件決議」という。）を行った。</p>

<p>(2) 株主Eは乙社の取締役と対立しており，乙社はEに対してだけ招集通知を発送しなかった。</p>
<p>(3) 株主Fは適法に招集通知を受領し，総会に出席して本件決議に賛成した。</p>
<p>(4) 本件決議は，出席株主の議決権の過半数の賛成により成立したが，Eが出席して反対したとしても結果は変わらなかったとみられる。</p>`,
  subs:[
    { q:'問1　本件決議にはどのような瑕疵があるか。決議取消しの訴えの要件（提訴権者・提訴期間）とあわせて論じなさい。', pts:12,
      model:`1 問題提起：本件決議の招集手続に法令違反があり，決議取消事由（会社法831条1項1号）に当たるかが問題となる。
2 規範：公開会社の株主総会の招集通知は，総会の日の2週間前までに発しなければならない（299条1項）。また，招集通知は議決権を行使できる全株主に発しなければならない。招集手続が法令に違反する場合は，決議取消事由となる（831条1項1号）。
3 あてはめ：(1)招集通知は6月17日に発送されており，総会日6月27日の2週間前（6月12日）までに発していないため，招集期間不足の法令違反がある。(2)株主Eに対する招集通知もれも，招集手続の法令違反である。なお，通知もれが一部にとどまるときは決議不存在ではなく取消事由と解される。
4 訴えの要件：取消しの訴えは，株主等（株主，取締役，監査役等）が（831条1項柱書），決議の日から3か月以内に（同項），会社を被告として（834条17号）提起しなければならない。取消判決が確定すると対世効（838条）を有し，決議は遡及的に無効となる（839条の反対解釈）。
5 結論：本件決議には招集手続の法令違反という取消事由があり，株主等は×1年9月27日までに取消しの訴えを提起することができる。`,
      kw:['831条1項1号','299条1項','2週間前','招集通知もれ','3か月以内','834条17号','838条'],
      ex:'解説：公開会社の招集通知は2週間前（非公開会社は原則1週間前）。取消しの訴えは形成の訴えであり，提訴権者・提訴期間・被告・判決効を正確に書くこと。' },
    { q:'問2　株主Fは，自らは適法に招集通知を受けているが，Eに対する招集通知もれを理由として決議取消しの訴えを提起することができるか論じなさい。', pts:8,
      model:`1 問題提起：Fは自己に対する招集手続には瑕疵がないのに，他の株主Eに対する招集手続の瑕疵を理由に取消しの訴えを提起できるかが問題となる。
2 規範：株主総会決議取消しの訴えは，個々の株主の利益保護のみならず，会社の運営の適法性を確保するための制度である。したがって，株主は，自己に対する招集手続に瑕疵がなくとも，他の株主に対する招集手続の瑕疵を理由として決議取消しの訴えを提起することができる（最判昭42.9.28）。
3 あてはめ：Fは乙社の株主であり，831条1項の「株主等」に該当する。Eに対する通知もれは，招集手続の法令違反であり，Fはこれを主張し得る。また，Fが本件決議に賛成していたことも，取消しの訴えの提起を妨げる事情とはならないと解される（取消訴権は決議の公正を確保するために株主に認められた権利だからである）。
4 結論：Fは，Eに対する招集通知もれを理由として，本件決議の取消しの訴えを提起することができる。`,
      kw:['最判昭42.9.28','他の株主に対する招集手続の瑕疵','会社運営の適法性','株主等','831条1項'],
      ex:'解説：取消訴権は共益権であり，会社運営の適法性を確保するための権利であることが判例の理由付け。賛成株主の原告適格も問われやすい。' },
    { q:'問3　乙社は，「Eが出席していても決議の結果は変わらなかった」として，請求の棄却を求めている。裁判所は請求を棄却することができるか論じなさい。', pts:10,
      model:`1 問題提起：招集手続の法令違反がある場合に，決議の結果に影響がないことを理由に請求を棄却できるか（裁量棄却，831条2項）が問題となる。
2 規範：裁判所は，招集の手続又は決議の方法が法令・定款に違反するときであっても，①その違反する事実が重大でなく，かつ，②決議に影響を及ぼさないものであると認めるときは，請求を棄却することができる（831条2項）。①②は重畳的要件であり，瑕疵が重大であれば，決議に影響がなくても裁量棄却は認められない。
3 あてはめ：Eに対する招集通知もれは，Eから総会に出席して質問し意見を述べ議決権を行使する機会を完全に奪うものであり，しかも会社が対立株主を意図的に排除したものである。また招集期間不足は，株主が議案を検討し出席を準備する機会を全株主について損なう。これらは株主の総会参与権の根幹にかかわる重大な瑕疵であるから，②決議の結果に影響がないとしても，①の要件を満たさない。
4 結論：裁判所は831条2項により請求を棄却することはできず，本件決議は取り消されるべきである（招集手続の重大な瑕疵につき裁量棄却を否定した判例として，最判昭46.3.18）。`,
      kw:['831条2項','裁量棄却','違反する事実が重大でなく','決議に影響を及ぼさない','重大な瑕疵','最判昭46.3.18'],
      ex:'解説：裁量棄却は「重大でない」かつ「影響を及ぼさない」の両方が必要。結果に影響しないという会社側の主張だけでは足りない点が採点の核心。' },
  ],
});

RB({
  id:'rb-law-3', s:'law',
  t:'募集株式の有利発行・不公正発行と差止め・新株発行無効',
  src:'第6章 資金調達 第3節 募集株式の発行等',
  q:`<p>丙株式会社（以下「丙社」という。）は，取締役会設置会社である上場会社（公開会社）であり，発行済株式総数は1,000万株，株価は直近6か月にわたり1株1,000円前後で安定している。</p>
<p>丙社の株主G（持株比率40％）は，次回の定時株主総会で現経営陣の解任を求める株主提案を予定している。これに対し，代表取締役Hは，Hと友好関係にある取引先J社に対し，払込金額1株500円で600万株を割り当てる第三者割当て（以下「本件発行」という。）を取締役会決議により決定し，募集事項を公告した。丙社には差し迫った資金需要はなく，本件発行について株主総会の決議は経ていない。</p>`,
  subs:[
    { q:'問1　Gは本件発行の差止めを請求することができるか。差止事由を2つ挙げて論じなさい。', pts:14,
      model:`1 問題提起：株主は，募集株式の発行等が①法令又は定款に違反する場合，又は②著しく不公正な方法により行われる場合において，株主が不利益を受けるおそれがあるときは，会社に対しその差止めを請求できる（会社法210条）。本件発行がこれらに当たるか。
2 法令違反（有利発行）：公開会社でも，払込金額が募集株式を引き受ける者に特に有利な金額である場合には，株主総会の特別決議が必要であり（201条1項，199条2項3項，309条2項5号），取締役は総会で有利発行を必要とする理由を説明しなければならない（199条3項）。上場株式の公正な払込金額は，原則として発行決議直前の市場価格を基準とし，株価の動向等を考慮して判断する（最判昭50.4.8参照）。本件の払込金額500円は，安定した市場価格1,000円の半額であり，特に有利な金額に当たる。特別決議を欠く本件発行は法令違反であり，既存株主は経済的不利益（株式価値の希薄化）を受けるおそれがある。
3 著しく不公正な方法：資金調達の必要がないのに，支配権をめぐる争いがある状況で，経営陣が自己の支配権維持を主要な目的として行う発行は，著しく不公正な方法による発行に当たると解する（主要目的ルール）。本件では，差し迫った資金需要がなく，Gの解任提案を目前に，友好的なJ社に発行済株式の6割に相当する株式を割り当てるもので，Gの持株比率を40％から25％（400万株/1,600万株）に低下させる。支配権維持が主要目的と認められる。
4 結論：Gは210条1号・2号に基づき差止めを請求でき，実務上は差止めの仮処分（民事保全法）を申し立てることになる。`,
      kw:['210条','有利発行','199条3項','201条1項','309条2項5号','著しく不公正な方法','主要目的ルール','25％'],
      ex:'解説：差止事由の2類型（法令・定款違反／著しく不公正）を区別し，それぞれにあてはめること。主要目的ルールは下級審で確立した判断枠組みであり，資金調達の必要性の有無が重要な考慮要素。持株比率の計算（400万株÷1,600万株＝25％）も示すとよい。' },
    { q:'問2　差止めの仮処分が申し立てられる前に本件発行の効力が生じた場合，Gは新株発行無効の訴えにより本件発行の効力を争うことができるか。判例を踏まえて論じなさい。', pts:12,
      model:`1 問題提起：新株発行無効の訴え（828条1項2号，公開会社は効力発生日から6か月以内）の無効原因は明文がなく，本件の特別決議欠缺・不公正発行が無効原因となるかが問題となる。
2 規範：新株発行は効力発生後に多数の法律関係が形成され，無効とすると取引の安全を害するから，無効原因は重大な法令・定款違反に限定して解すべきである。
(1) 公開会社において株主総会の特別決議を欠く有利発行は，授権資本制度の下で新株発行が業務執行に準ずるものとして扱われていること，株主は取締役等の責任（423条，429条）や引受人の差額支払責任（212条1項1号）により経済的利益を回復し得ることから，無効原因とならない（最判昭46.7.16）。
(2) 著しく不公正な方法による発行も，株主は事前に差止請求（210条）で自己の利益を守ることができたこと，不明確な基準で事後的に無効とすることは取引の安全を害することから，無効原因とならない（最判平6.7.14）。
(3) ただし，差止めの仮処分命令に違反してなされた発行は，差止請求権を株主に与えた趣旨を没却するため無効原因となる（最判平5.12.16）。また，募集事項の公示（201条3項4項）を欠く場合は，差止事由がないため差止めが許容されない場合でない限り無効原因となる（最判平9.1.28）。
3 あてはめ：本件では公示はされており，仮処分違反もない。特別決議の欠缺および不公正発行は，いずれも判例上無効原因とならない。
4 結論：Gは新株発行無効の訴えで本件発行の効力を否定することはできず，取締役の責任追及や引受人の責任追及によって救済を図ることになる。`,
      kw:['828条1項2号','6か月','無効原因','最判昭46.7.16','最判平6.7.14','最判平5.12.16','仮処分','取引の安全'],
      ex:'解説：無効原因を限定的に解する理由（取引の安全）を示したうえで，判例の類型ごとに結論を示すのが合格答案。仮処分違反・公示欠缺の場合との対比を書けると評価が高い。なお非公開会社で特別決議を欠く第三者割当ては無効原因となる（最判平24.4.24）点との違いにも注意。' },
    { q:'問3　本件発行の効力が生じた場合に，J社が丙社に対して負う可能性のある責任を説明しなさい。', pts:6,

2 規範：取締役と通じて著しく不公正な払込金額で募集株式を引き受けた者は，株式会社に対し，当該払込金額と当該募集株式の公正な価額との差額に相当する金額を支払う義務を負う（212条1項1号）。この責任は，株主代表訴訟の対象となる（847条1項）。
3 あてはめ：J社はHと友好関係にあり，Hと通じて市場価格の半額である1株500円で引き受けたと認められれば，公正な価額（1,000円）との差額500円×600万株＝30億円を丙社に支払う義務を負う。
4 結論：J社は212条1項1号の差額支払義務を負い，丙社が責任追及を懈怠するときは，Gは代表訴訟（847条）により追及できる。あわせてHも423条1項の責任を負い得る。`,
      kw:['212条1項1号','取締役と通じて','著しく不公正な払込金額','差額','30億円','847条'],
      ex:'解説：引受人の差額支払責任は「取締役と通じて」が要件。代表訴訟の対象となること（847条1項）も書くこと。差額の計算（500円×600万株）を示すと具体性が増す。' },
  ],

RB({
  id:'rb-law-4', s:'law',
  t:'代表取締役の専断的行為と取引の効力',
  src:'第3章 機関 第5節 取締役会／第6節 代表取締役',
  q:`<p>丁株式会社（以下「丁社」という。）は，取締役会設置会社かつ監査役設置会社であり，総資産は50億円，経常利益は年3億円程度である。丁社の定款には「1億円以上の借入れには取締役会の決議を要する」との定めがある。</p>
<p>(1) 丁社の代表取締役Kは，取締役会の決議を経ずに，丁社の主力工場の土地建物（帳簿価額12億円，丁社の唯一の生産拠点）をL社に売却した（以下「本件売却」という。）。L社の担当者は，丁社の役員と旧知の間柄であり，取締役会決議がないことを知っていた。</p>
<p>(2) Kは，取締役会の決議を経ずに，M銀行から運転資金1億5,000万円を借り入れた（以下「本件借入れ」という。）。M銀行は定款の上記定めを知らなかった。</p>`,
  subs:[
    { q:'問1　本件売却の効力について論じなさい。', pts:12,
      model:`1 問題提起：取締役会設置会社では，「重要な財産の処分」は取締役会で決定しなければならず，代表取締役に委任できない（会社法362条4項1号）。取締役会決議を欠く本件売却の効力が明文なく問題となる。
2 「重要な」の判断：重要な財産の処分に当たるかは，当該財産の価額，その会社の総資産に占める割合，当該財産の保有目的，処分行為の態様及び会社における従来の取扱い等の事情を総合的に考慮して判断する（最判平6.1.20）。本件土地建物は帳簿価額12億円で総資産50億円の24％を占め，丁社唯一の生産拠点であって事業継続の基盤であるから，「重要な財産」に当たる。
3 規範：代表取締役は会社の業務に関する一切の裁判上・裁判外の行為をする包括的代表権を有し（349条4項），取締役会決議は内部的意思決定にすぎない。そこで取引の安全を考慮し，取締役会決議を欠く代表取締役の行為は原則として有効であるが，相手方が決議を経ていないことを知り又は知り得べかりしときは，民法93条1項ただし書の類推適用により無効となると解する（最判昭40.9.22，心裡留保説）。
4 あてはめ：L社の担当者は取締役会決議がないことを知っており悪意である。
5 結論：本件売却は無効である。丁社はL社に対し無効を主張して土地建物の返還を求めることができ，Kは任務懈怠責任（423条1項）を負い得る。`,
      kw:['362条4項1号','重要な財産の処分','最判平6.1.20','総合的に考慮','最判昭40.9.22','民法93条1項ただし書','心裡留保','悪意'],
      ex:'解説：「重要性の判断基準」→「決議を欠く行為の効力」の二段構成が定番。総資産に占める割合（本問は24％）を具体的に指摘すること。心裡留保説のほか，相対的無効説（相手方の悪意・重過失で無効）等の学説もある。' },
    { q:'問2　L社の側から，取締役会の決議を欠くことを理由に本件売却の無効を主張することはできるか論じなさい。', pts:6,
      model:`1 問題提起：362条4項違反の取引の無効を，会社の相手方が主張できるか。
2 規範：362条4項が重要な業務執行を取締役会の決議事項としたのは，代表取締役への権限集中を抑制し，取締役相互の協議による結論に沿った業務執行を確保することで会社の利益を保護する趣旨である。したがって，取締役会決議を経ていないことを理由とする無効は，原則として会社のみが主張することができ，会社以外の者は，当該会社の取締役会が無効を主張する旨の決議をしているなどの特段の事情がない限り，無効を主張することはできない（最判平21.4.17）。
3 あてはめ：本件では丁社の取締役会が無効を主張する旨の決議をしたなどの事情はない。
4 結論：L社は，特段の事情がない限り，本件売却の無効を主張することはできない。`,
      kw:['最判平21.4.17','会社のみが主張','特段の事情','会社の利益を保護','362条4項'],
      ex:'解説：規定の趣旨（会社保護）から主張権者を会社に限定する判例。利益相反取引の無効の主張権者（最判昭48.12.11）と同様の発想である点を指摘するとよい。' },
    { q:'問3　本件借入れについて，丁社はM銀行に対して取締役会決議を欠くことを理由に無効を主張することができるか論じなさい。', pts:10,
      model:`1 問題提起：本件借入れ（1億5,000万円）が法定の「多額の借財」（362条4項2号）に当たるか，当たらない場合に定款による内部制限違反の効力が問題となる。
2 「多額の借財」該当性：多額かどうかは，借財の額，総資産や経常利益に占める割合，借財の目的，従来の取扱い等を総合考慮して判断する（最判平6.1.20の考え方）。本件は総資産50億円の3％，経常利益の半分に相当するが，通常の運転資金の借入れであり，法定の「多額の借財」に当たるかは事実関係によるものの，当たらないと考える余地がある。
3 当たらない場合（定款による内部制限）：代表取締役の代表権に加えた制限は，善意の第三者に対抗することができない（349条5項）。定款で取締役会決議を要すると定めたことは，代表権の内部的制限にすぎない。M銀行は定款の定めを知らず善意であるから，丁社は無効をM銀行に対抗できず，本件借入れは有効である。
4 当たる場合：問1と同様，心裡留保規定の類推（最判昭40.9.22）により，M銀行が決議の欠缺を知り又は知り得たときに限り無効を主張できる。M銀行は定款の定めも知らず，決議の欠缺を知り得た事情も示されていないから，無効は主張できない。
5 結論：いずれにしても，丁社はM銀行に対し本件借入れの無効を主張できず，Kの内部的責任（423条1項）の問題が残るにとどまる。`,
      kw:['362条4項2号','多額の借財','349条5項','代表権に加えた制限','善意の第三者','内部的制限'],
      ex:'解説：法律上の制限（362条4項）と定款・内規による内部的制限（349条5項）を区別できるかが問われる。後者は善意の第三者に対抗できない。両面から検討して結論を示すと高評価。' },
  ],
});

RB({
  id:'rb-law-5', s:'law',
  t:'財源規制違反の剰余金配当・自己株式取得と責任',
  src:'第7章 株式会社の計算等 第5節 剰余金の配当／第4章 株式 第6節 自己株式の取得',
  q:`<p>戊株式会社（以下「戊社」という。）は，取締役会設置会社かつ会計監査人設置会社である。戊社は，×2年4月1日の臨時株主総会の決議に基づき，同月20日を効力発生日として総額5億円の剰余金の配当（金銭配当，以下「本件配当」という。）を行った。</p>
<p>本件配当の効力発生日における戊社の分配可能額は3億円であった。本件配当の議案は代表取締役Nが株主総会に提出し，配当の実務は経理担当取締役Oが行った。Oは分配可能額の計算を誤っていたが，Nはこれを確認していなかった。</p>
<p>株主の多くは，分配可能額を超える配当であることを知らなかった。戊社の債権者Pは，戊社に対して8,000万円の貸付金債権を有している。</p>`,
  subs:[
    { q:'問1　本件配当の効力と，株主およびN・Oが戊社に対して負う責任について論じなさい。', pts:14,
      model:`1 問題提起：剰余金の配当により株主に交付する金銭等の帳簿価額の総額は，効力発生日における分配可能額を超えてはならない（会社法461条1項8号）。本件配当は5億円で分配可能額3億円を超えており，その効力と責任が問題となる。
2 効力：461条1項は「超えてはならない」と定めており，財源規制は会社債権者保護のための強行規定であるから，これに違反する配当は無効と解する（なお，463条1項の文言等から有効とする立案担当者の見解もある）。
3 株主の責任：金銭等の交付を受けた株主は，会社に対し，交付を受けた金銭等の帳簿価額に相当する金銭を支払う義務を負う（462条1項）。これは善意・悪意を問わない無過失責任である。
4 業務執行者等の責任：職務を行った業務執行者（O）及び株主総会に議案を提出した取締役（N）は，会社に対し，株主と連帯して，交付した金銭等の帳簿価額（5億円）に相当する金銭を支払う義務を負う（462条1項柱書・1項6号イ）。ただし，その職務を行うについて注意を怠らなかったことを証明したときは義務を負わない（462条2項，立証責任の転換された過失責任）。Oは計算を誤り，Nは確認を怠っており，いずれも無過失の証明は困難である。
5 免除：この義務は原則として免除できず，総株主の同意がある場合でも分配可能額（3億円）を限度として免除できるにとどまる（462条3項）。
6 結論：本件配当は無効であり，株主は受領額を，N・Oは連帯して5億円を戊社に支払う義務を負う。N・Oの責任のうち分配可能額超過部分2億円は総株主の同意があっても免除できない。`,
      kw:['461条1項','分配可能額','462条1項','連帯','462条2項','注意を怠らなかった','462条3項','2億円'],
      ex:'解説：株主の責任（無過失）と業務執行者等の責任（過失責任・立証責任の転換）の違い，免除の制限（分配可能額が限度）が重要。超過額5億円−3億円＝2億円は免除できない点を具体的に示すこと。' },
    { q:'問2　N・Oが戊社に支払いをした場合，善意の株主に求償することができるか。また，債権者Pは株主に対して直接支払いを請求することができるか論じなさい。', pts:10,
      model:`1 求償の可否：462条1項の義務を履行した業務執行者等は，本来は株主に求償できるはずであるが，分配可能額を超えることにつき善意の株主は，交付を受けた金銭等について，業務執行者等からの求償に応ずる義務を負わない（463条1項）。自ら違法行為を行った業務執行者等が善意の株主に返還を求めることで自己の負担を軽減するのは不当であり，一種の制裁として求償の相手方を悪意の株主に限定したものである。したがって，N・Oは悪意の株主にのみ求償でき，善意の株主には求償できない。
2 債権者の直接請求：株式会社の債権者は，462条1項の義務を負う株主に対し，その交付を受けた金銭等の帳簿価額（当該額が当該債権者の会社に対して有する債権額を超える場合は当該債権額）に相当する金銭を支払わせることができる（463条2項）。会社債権者が会社財産の維持に重大な利害を有するためである。この請求を受ける株主は悪意の株主に限られず，善意の株主も含まれると解される（463条1項は求償に関する制裁規定にすぎないため）。
3 結論：N・Oは善意の株主に求償できない。Pは，株主に対し，その受領額（ただしPの債権額8,000万円が上限）の支払いを請求することができる。`,
      kw:['463条1項','善意の株主','求償に応ずる義務を負わない','463条2項','債権者','債権額','8,000万円'],
      ex:'解説：463条1項（善意株主への求償制限）と2項（債権者の直接請求）を区別すること。債権者の請求額は債権額が上限となる点，善意株主も支払義務自体は負う点がよく問われる。' },
    { q:'問3　戊社が，本件配当とは別に，分配可能額の範囲内で市場取引により自己株式を取得したが，その事業年度末に欠損が生じた場合，業務執行者はどのような責任を負うか説明しなさい。', pts:6,
      model:`1 問題提起：取得時点では財源規制（461条1項2号等）に違反していないが，期末に欠損が生じた場合の責任が問題となる。
2 規範：株式会社が自己株式の取得等をした場合において，当該行為をした日の属する事業年度に係る計算書類の承認時に分配可能額がマイナス（欠損）となったときは，当該行為に関する職務を行った業務執行者は，会社に対し，連帯して，その超過額（交付した金銭等の帳簿価額の総額が上限）を支払う義務を負う（465条1項）。ただし，職務を行うについて注意を怠らなかったことを証明した場合は免れる（同項ただし書）。この責任は総株主の同意により免除できる（465条2項）。
3 趣旨：資本維持の一環として，業務執行者に対し，事後に欠損が生じる可能性があれば取得を行わない義務を課したものである。
4 結論：業務執行者は465条1項の欠損填補責任（過失責任・立証責任転換）を負う。`,
      kw:['465条1項','欠損填補責任','超過額','注意を怠らなかった','465条2項','総株主の同意'],
      ex:'解説：462条（行為時の財源規制違反）と465条（期末の欠損）の区別がポイント。定時株主総会での配当は欠損填補責任の対象外（465条1項10号イ）である点も併せて整理しておくこと。' },
  ],
});

RB({
  id:'rb-law-6', s:'law',
  t:'吸収合併と反対株主の株式買取請求・差止請求・合併無効',
  src:'第10章 組織再編行為等 第3節 吸収型再編の手続／第7節 組織再編行為の瑕疵',
  q:`<p>上場会社である己株式会社（以下「己社」という。存続会社）は，同じく上場会社である庚株式会社（以下「庚社」という。消滅会社）を吸収合併することとし，両社は合併契約を締結した。合併対価は己社株式であり，合併比率は「庚社株式1株につき己社株式0.5株」とされた。</p>
<p>庚社の株主Qは，第三者算定機関の評価等から合併比率が庚社株主に著しく不利であると考えている。庚社は株主総会の特別決議で合併契約を承認したが，Qは総会に先立ち反対の旨を通知し，総会でも反対した。</p>
<p>なお，庚社が株主総会に提出した議案の参考書類および事前開示書類には，合併比率の算定根拠について虚偽の記載があったことが後日判明した。</p>`,
  subs:[
    { q:'問1　Qは，庚社に対して株式買取請求をすることができるか。要件と手続，「公正な価格」の意義を説明しなさい。', pts:10,
      model:`1 規範：吸収合併をする場合，反対株主は，消滅株式会社に対し，自己の有する株式を公正な価格で買い取ることを請求することができる（会社法785条1項）。株主総会の決議を要する場合の反対株主とは，当該総会に先立って吸収合併に反対する旨を会社に通知し，かつ，総会において反対した株主（議決権を行使できる株主）をいう（785条2項1号イ）。
2 手続：消滅会社は効力発生日の20日前までに株主に対し吸収合併をする旨等を通知又は公告しなければならない（785条3項4項）。反対株主は，効力発生日の20日前の日から効力発生日の前日までの間に，株式の数を明らかにして請求しなければならない（785条5項）。価格について効力発生日から30日以内に協議が調わないときは，その期間満了日後30日以内に裁判所に価格決定の申立てができる（786条2項）。請求後は会社の承諾なく撤回できない（785条7項）。
3 公正な価格：公正な価格とは，組織再編によりシナジー等の企業価値の増加が生じる場合には，それを適切に分配したとすれば基準日時点で株式が有したであろう価格をいい，企業価値の増加が生じない場合や毀損される場合には，組織再編がなければ有したであろう価格（ナカリセバ価格）をいうと解されている（判例）。
4 あてはめ・結論：Qは事前通知および総会での反対をしており反対株主に当たる。Qは所定期間内に買取請求をすることにより，不公正な合併比率による不利益を「公正な価格」での買取りを通じて回避できる。`,
      kw:['785条1項','反対株主','公正な価格','785条2項1号イ','20日前','786条','ナカリセバ価格','シナジー'],
      ex:'解説：反対株主の要件（事前通知＋総会で反対），請求期間，価格決定申立ての流れを正確に。公正な価格はシナジー分配価格とナカリセバ価格の2場面を書き分けるのが判例の考え方。' },
    { q:'問2　合併の効力発生前に，Qが合併の差止めを請求することができるか論じなさい。', pts:8,
      model:`1 問題提起：Qは合併比率の不公正と，参考書類・事前開示書類の虚偽記載を理由に差止めを求めうるか。
2 規範：吸収合併が法令又は定款に違反する場合において，消滅株式会社の株主が不利益を受けるおそれがあるときは，株主は消滅会社に対し，吸収合併をやめることを請求できる（784条の2第1号）。対価が著しく不当であることを理由とする差止めは，略式合併の場合に限られる（784条の2第2号，784条1項）。
3 あてはめ：(1)本件は略式合併ではなく株主総会決議を経ているため，合併比率の不公正それ自体は，784条の2第2号の差止事由とはならない。「法令違反」は会社を名宛人とする法令違反をいい，取締役の善管注意義務違反は含まれないと解されている。(2)他方，事前開示書類（782条1項）に虚偽の記載があることは，法令違反に当たりうる。また総会参考書類の虚偽記載は招集手続の法令違反（決議取消事由）であり，それにより承認決議に瑕疵がある以上，合併は株主総会の適法な承認（783条1項）を欠く法令違反に当たると解される。株主は不公正な比率で株式を失う不利益を受けるおそれがある。
4 結論：Qは，事前開示・承認決議の瑕疵という法令違反を理由として，784条の2第1号に基づき差止めを請求でき，実務上は仮処分を申し立てる。`,
      kw:['784条の2','法令又は定款に違反','不利益を受けるおそれ','略式合併','対価が著しく不当','782条1項','事前開示'],
      ex:'解説：「対価の著しい不当」が差止事由になるのは略式組織再編のみ。通常の合併では手続の法令違反を差止事由として構成できるかがポイント。' },
    { q:'問3　合併の効力発生後，Qは合併比率の不公正を理由として合併無効の訴えを提起し，勝訴することができるか論じなさい。', pts:10,
      model:`1 問題提起：合併無効の訴え（828条1項7号）の無効原因は明文がなく，合併比率の不公正が無効原因となるかが問題となる。
2 規範：合併の効力発生後には多数の法律関係が形成されており，取引の安全の観点から無効原因は限定的に解すべきである。そして，合併比率の適否は基本的に株主総会の自主的判断に委ねられており，判断材料として事前開示（782条1項，794条1項）が定められ，不公正な比率に不満な株主は株式買取請求（785条，797条）により救済される。したがって，合併比率の不公正それ自体は合併無効原因とならない（最判平5.10.5）。
3 手続的瑕疵：もっとも，承認決議の瑕疵や事前開示の不備・虚偽は手続上の重大な瑕疵として無効原因となりうる。合併承認決議に取消事由がある場合，効力発生後は決議取消しの訴えは合併無効の訴えに吸収され，合併無効の訴えの中で主張すべきと解される（吸収説。ただし決議取消しの提訴期間3か月（831条1項）内に主張すべきとする見解が多数）。
4 あてはめ：Qは合併比率の不公正のみを理由としては勝訴できない。しかし，参考書類・事前開示書類の虚偽記載という手続的瑕疵を無効原因として主張すれば，勝訴の可能性がある。提訴は効力発生日から6か月以内（828条1項7号），原告は効力発生日に消滅会社の株主であった者等（828条2項7号）である。
5 結論：比率の不公正のみでは合併無効とはならないが，手続的瑕疵を主張して無効判決（将来効，839条）を得る余地がある。`,
      kw:['828条1項7号','6か月','合併比率の不公正','無効原因とならない','最判平5.10.5','株式買取請求','吸収説','839条'],
      ex:'解説：実体的な不公正（比率）は買取請求で救済し，手続的瑕疵は無効原因とする，という整理が合格答案の骨格。無効判決の将来効（839条）・対世効（838条）も押さえること。' },
  ],
});

RB({
  id:'rb-aud-1', s:'aud',
  t:'監査リスク・アプローチと重要性',
  src:'第3章 監査実施論 第4節 リスク・アプローチと監査リスク／第5節 監査の計画及び実施における重要性',
  q:`<p>監査基準は，監査人が監査リスクを合理的に低い水準に抑えるために，財務諸表における重要な虚偽表示のリスクを評価し，発見リスクの水準を決定するとともに，監査上の重要性を勘案して監査計画を策定し，これに基づき監査を実施することを求めている（リスク・アプローチ）。</p>
<p>以下の問いに答えなさい。</p>`,
  subs:[
    { q:'問1　監査リスクの構成要素（固有リスク・統制リスク・発見リスク）の意義と，それらの相互関係について説明しなさい。', pts:12,
      model:`1 監査リスク：監査人が，財務諸表の重要な虚偽表示を看過して誤った意見を形成する可能性をいう（監査基準，監基報200）。監査人は，監査リスクを許容可能な低い水準に抑えることにより合理的な保証を得る。
2 構成要素：
(1) 固有リスク：関連する内部統制が存在していないとの仮定の上で，取引種類，勘定残高又は注記事項に係るアサーションに，不正か誤謬かを問わず，重要な虚偽表示が行われる可能性をいう。
(2) 統制リスク：虚偽表示が，企業の内部統制によって防止又は適時に発見・是正されないリスクをいう。
(3) 両者を併せて「重要な虚偽表示リスク」といい，企業側に存在するリスクであるため監査人はこれを評価するのみで，その水準を直接コントロールできない。なお，現行の監査基準では，アサーション・レベルの重要な虚偽表示リスクは固有リスクと統制リスクを分けて評価することが求められる。
(4) 発見リスク：虚偽表示が存在し，それが重要な虚偽表示になり得る場合に，監査リスクを許容可能な低い水準に抑えるために監査人が監査手続を実施してもなお発見できないリスクをいう。
3 相互関係：監査リスク＝重要な虚偽表示リスク×発見リスクの関係にあり，監査人は，一定の監査リスク水準を達成するため，重要な虚偽表示リスクが高いほど発見リスクを低く設定し，実証手続の種類・時期・範囲（より証明力の強い手続，期末日近くの実施，範囲の拡大）を強化する。逆に重要な虚偽表示リスクが低ければ発見リスクを高く設定できる。発見リスクは監査人がコントロール可能な唯一の要素である。`,
      kw:['監査リスク','固有リスク','統制リスク','重要な虚偽表示リスク','発見リスク','反比例','実証手続','監基報200'],
      ex:'解説：監査リスクの定義，各構成要素の定義，リスク間の関係（重要な虚偽表示リスクと発見リスクの逆相関）の3点が骨格。固有リスクと統制リスクの分離評価（令和2年改訂）も押さえること。' },
    { q:'問2　財務諸表全体レベルの重要な虚偽表示リスクとアサーション・レベルの重要な虚偽表示リスクの違い，およびそれぞれに対する監査人の対応を説明しなさい。', pts:10,
      model:`1 財務諸表全体レベル：財務諸表全体に広く関わりがあり，特定のアサーションに結び付けられない重要な虚偽表示リスクをいう。経営者の誠実性の欠如，内部統制の不備（統制環境の脆弱性など），経営者による内部統制の無効化リスク，厳しい経営環境などから生じる。
対応：監査人は全般的な対応を行う（監基報330）。例えば，職業的懐疑心の保持の必要性の強調，より経験豊富な又は専門的な技能を有する監査チームメンバーの配置，指導監督の強化，監査手続の選択に企業が想定しない要素を組み込むこと，実証手続の実施時期や範囲の変更などである。
2 アサーション・レベル：取引種類，勘定残高，注記事項に関連する個々のアサーション（実在性，網羅性，評価の妥当性等）に係る重要な虚偽表示リスクをいう。固有リスクと統制リスクに分けて評価する。
対応：評価したリスクに応じて，運用評価手続及び実証手続の種類・時期・範囲を立案し実施する（リスク対応手続，監基報330）。リスクが高いほど，より適合性と証明力の高い監査証拠を入手する。
3 特別な検討を必要とするリスク：固有リスクの程度が最も高い領域に存在すると評価されたリスクについては，当該リスクに個別に対応する実証手続を実施し，実証手続のみで対応する場合には詳細テストを含めなければならない（監基報330）。`,
      kw:['財務諸表全体レベル','アサーション・レベル','全般的な対応','リスク対応手続','運用評価手続','実証手続','監基報330','特別な検討を必要とするリスク'],
      ex:'解説：2つのレベルのリスクを区別し，それぞれに対応する監査人の対応（全般的対応／リスク対応手続）を対にして書くこと。特別な検討を必要とするリスクへの言及は加点要素。' },
    { q:'問3　監査の計画及び実施における重要性の基準値と手続実施上の重要性の意義，および手続実施上の重要性を設定する理由を説明しなさい。', pts:8,
      model:`1 重要性の基準値：監査計画の策定時に決定する，財務諸表全体において重要であると判断する虚偽表示の金額をいう（監基報320）。財務諸表利用者の経済的意思決定に影響を与えると合理的に見込まれる金額であり，税引前利益や売上高等の指標に一定割合を乗じて決定するのが一般的である。
2 手続実施上の重要性：未修正の虚偽表示と未発見の虚偽表示の合計が重要性の基準値を上回る可能性を適切な低い水準に抑えるために，監査人が重要性の基準値より低い金額として設定する金額をいう（監基報320）。
3 設定理由：個々には重要性の基準値を下回る虚偽表示であっても，集計すると財務諸表全体として重要な虚偽表示となる可能性がある。また，監査は試査を前提とするため，未発見の虚偽表示が残る可能性がある。そこで，重要性の基準値よりも低い水準で監査手続の種類・時期・範囲を決定することで，未修正・未発見の虚偽表示の合計が基準値を超えるリスクに余裕（バッファー）を持たせる必要がある。
4 なお，重要性は監査の過程で入手した情報に応じて改訂され，監査の最終段階では識別した虚偽表示の影響の評価（監基報450）にも用いられる。`,
      kw:['重要性の基準値','手続実施上の重要性','監基報320','未発見の虚偽表示','未修正の虚偽表示','集計','監基報450'],
      ex:'解説：手続実施上の重要性は「未修正＋未発見の合計が基準値を超える可能性を低く抑える」ために設定する点が核心。重要性の改訂にも触れられると良い。' },
  ],
});

RB({

  q:`<p>上場会社Ａ社の×3年3月期の財務諸表監査において，監査人は次の事実を把握した。</p>
<p>(1) 期末日直前の3月に，新規取引先Ｘ社向けの売上高が急増している（年間売上高の8％に相当）。Ｘ社との取引は，営業担当役員が単独で決定しており，通常の与信審査を経ていない。</p>
<p>(2) Ｘ社に送付した売掛金の確認状は回答が得られず，Ａ社経理部長から「Ｘ社の住所変更で届かなかった」との説明があった。</p>
<p>(3) 4月に入り，Ｘ社向け売上の大部分について返品処理がなされている。</p>
<p>(4) 監査人がＸ社の登記事項等を調査したいと申し出たところ，経営者は「取引先に迷惑がかかる」として協力を拒否し，関連資料の閲覧も認めなかった。</p>`,
  subs:[
    { q:'問1　監査における不正リスク対応基準（以下「不正リスク対応基準」）が設けられた趣旨と，その適用範囲について説明しなさい。', pts:8,
      model:`1 趣旨：近時の不正による有価証券報告書の虚偽記載等の事例において，結果として監査が有効に機能していなかったとの指摘がなされたことを受け，不正による重要な虚偽の表示のリスクに対応した監査手続を明確化するとともに，一定の場合には監査手続をより慎重に実施することを求めるため，監査基準とは別に設けられた（平成25年，企業会計審議会）。
2 位置付け：不正リスク対応基準は，監査人の責任を加重したり，財務諸表に重要な虚偽の表示がないことを保証するものではなく，また不正の摘発自体を目的とするものではない。あくまで財務諸表監査において不正による重要な虚偽表示に適切に対応するための基準である。

      kw:['不正による重要な虚偽の表示','監査手続の明確化','金融商品取引法','職業的懐疑心','品質管理','不正の摘発を目的としない'],
      ex:'解説：「監査人の責任を加重するものではない」「不正摘発を目的としない」という位置付けと，適用範囲の限定（金商法監査）が採点ポイント。' },
    { q:'問2　本事例の(1)〜(3)の状況を踏まえ，不正リスク対応基準に基づき監査人が実施すべき対応を説明しなさい。', pts:10,
      model:`1 不正による重要な虚偽の表示を示唆する状況：(1)期末直前の新規取引先への売上急増と与信審査の欠如，(2)確認状の未回答と不自然な説明，(3)期末後の多額の返品は，不正リスク対応基準の付録に例示される「不正による重要な虚偽の表示を示唆する状況」に該当し，架空売上や押込販売（実在性・期間帰属）の疑いがある。
2 監査人の対応：
(1) 監査人は，不正による重要な虚偽の表示を示唆する状況を識別した場合には，不正による重要な虚偽の表示の疑義が存在していないかどうかを判断するために，経営者に質問し説明を求めるとともに，追加的な監査手続を実施しなければならない。
(2) 確認状が未回答の場合，代替的な手続（期末後入金の検討，出荷記録・受領書の検討等）を実施し，さらに回答が得られない理由の妥当性を検討する。経営者の説明に合理性がないときは，職業的懐疑心を高めて検討する。

(4) 疑義があると判断した場合，監査事務所の方針・手続に従い，審査担当者による審査（疑義に係る審査）を受けるとともに，適切な階層の経営者及び監査役等と協議し，必要に応じて専門家の利用を検討する。これらの判断・対応は監査調書に記載する。`,
      kw:['不正による重要な虚偽の表示を示唆する状況','疑義','追加的な監査手続','経営者に質問','職業的懐疑心','審査','監査役等と協議','架空売上'],
      ex:'解説：「示唆する状況」→「追加手続」→「疑義ありと判断」→「不正の態様に直接対応した手続・審査・監査役等との協議」という段階的な流れを書けるかが核心。' },
    { q:'問3　(4)のように経営者が協力を拒否し，他の手続によっても十分かつ適切な監査証拠が入手できなかった場合，監査人はどのような監査意見を表明すべきか，理由とともに述べなさい。なお，Ｘ社向け売上の影響は財務諸表全体に及ぶほどではないが重要であり，また他の領域では経営者の陳述に依拠できるものとする。', pts:12,
      model:`1 状況の評価：経営者による調査協力の拒否・資料閲覧の拒否は，経営者による監査範囲の制約である。監査人は代替手続を実施したが，Ｘ社向け売上の実在性について十分かつ適切な監査証拠を入手できなかった。
2 意見の判断：監査人は，重要な監査手続を実施できなかったことにより，十分かつ適切な監査証拠を入手できない場合，未発見の虚偽表示がもしあるとすれば，それが財務諸表に及ぼす可能性のある影響の重要性と広範性を判断する（監査基準，監基報705）。

3 あてはめ：Ｘ社向け売上は年間売上の8％で重要であるが，本問では財務諸表全体に及ぶほどではなく，他の領域では経営者の陳述に依拠できるため，広範とまではいえない。したがって，限定付適正意見を表明する。監査報告書には「限定付適正意見の根拠」区分を設け，実施できなかった監査手続，その理由，及び財務諸表に及ぼす可能性のある影響を記載する。
4 留意点：もっとも，経営者が監査人の調査を拒否したことは経営者の誠実性に疑念を生じさせる。経営者の陳述全体の信頼性が損なわれる場合や，不正の影響が財務諸表全体に及ぶと判断される場合には，意見不表明や監査契約の解除を検討すべきである。また，不正の疑義について監査役等に報告し，金融商品取引法193条の3に基づく対応（法令違反等事実の通知）の要否も検討する。`,
      kw:['監査範囲の制約','十分かつ適切な監査証拠','重要性と広範性','限定付適正意見','意見不表明','監基報705','限定付適正意見の根拠','経営者の誠実性'],
      ex:'解説：監査範囲の制約→「重要だが広範でない＝限定付適正」「重要かつ広範＝意見不表明」の判断枠組みを示し，事例にあてはめること。経営者の誠実性への疑念が意見全体に及ぶ可能性に言及できれば高評価。' },

    { q:'問3　事例3の意見不表明の監査報告書において，監査上の主要な検討事項（KAM）を記載すべきか，理由とともに説明しなさい。', pts:7,

RB({

  q:`<p>上場会社Ｅ社は，過年度に買収した子会社に係る多額ののれんを連結貸借対照表に計上している。当期，当該子会社の業績は計画を下回ったが，経営者は将来事業計画に基づく割引前将来キャッシュ・フローがのれんを含む資産グループの帳簿価額を上回るとして，減損損失を認識していない。将来事業計画には，売上成長率や市場の回復時期に関する重要な仮定が含まれている。</p>

  subs:[
    { q:'問1　監査上の主要な検討事項（KAM）の意義と導入の趣旨，および監査人がKAMを決定するプロセスを説明しなさい。', pts:10,
      model:`1 意義：監査上の主要な検討事項とは，当年度の財務諸表の監査の過程で監査役等と協議した事項のうち，職業的専門家として当該監査において特に重要であると判断した事項をいう（監査基準，監基報701）。

      model:`1 記載内容：監査人は，KAMの区分に，個々のKAMごとに，①関連する財務諸表における注記事項がある場合には当該注記事項への参照，②KAMの内容，③監査人が監査の過程で当該事項が特に重要であると判断しKAMと決定した理由，④当該事項に対する監査上の対応，を記載する（監基報701）。

      kw:['注記事項への参照','KAMの内容','決定理由','監査上の対応','企業固有','未公表の情報','経営者に追加開示を促す','個別意見ではない'],
      ex:'解説：記載内容の4項目，特に「決定理由」と「監査上の対応」の具体性が問われる。未公表情報の取扱い（原開示の原則は経営者）も頻出。' },

      model:`1 リスク評価：監査人は，会計上の見積りに関する重要な虚偽表示リスクを識別・評価する際，固有リスク要因である見積りの不確実性，複雑性，主観性及びその他の要因（経営者の偏向・不正リスク要因）を考慮し，固有リスクと統制リスクを分けて評価する（監基報540）。
2 リスク対応手続：監査人は次の一つ又は組合せで対応する。①監査報告書日までに発生した事象から監査証拠を入手する（例：期末後の子会社業績）。②経営者がどのように会計上の見積りを行ったかを検討する（見積手法の適切性，重要な仮定の合理性，データの目的適合性・信頼性）。③監査人の見積額又は許容範囲を設定する。本事例では，事業計画の売上成長率・市場回復時期について，過去の計画と実績の比較（遡及的検討），外部の市場予測との整合性，取締役会資料等との整合性を検討し，感応度分析を行う。
3 経営者の偏向：経営者の判断に偏向の兆候がないか検討し，職業的懐疑心を発揮して，経営者の見積りを裏付ける証拠だけでなく矛盾する証拠にも注意を払う。
4 注記の検討：見積りの不確実性に関する注記が適切かどうかを評価する。
5 総括：これらを踏まえ，会計上の見積りが適用される財務報告の枠組みに照らして合理的か，虚偽表示かを評価する。`,
      kw:['監基報540','見積りの不確実性','複雑性','主観性','経営者の偏向','重要な仮定','監査人の見積額','遡及的検討'],
      ex:'解説：監基報540（改訂）の固有リスク要因（不確実性・複雑性・主観性），3つの対応アプローチ，経営者の偏向の検討が採点の中心。事例の仮定に即して具体的手続を書くと高評価。' },
  ],
});

    { q:'問2　監査人が重要な不確実性が認められると判断した場合において，次の各ケースで表明すべき監査意見と監査報告書の記載を理由とともに述べなさい。\n(a) 継続企業の前提に関する注記が適切になされている場合\n(b) 経営者が注記を一切行わない場合', pts:12,

      ex:'解説：「評価・対応策を示さない」＝範囲制約（限定付/意見不表明），「前提が不適切」＝注記があっても不適正意見。両者の違いを明確にすること。' },

RB({

  t:'内部統制監査（J-SOX）と財務諸表監査の関係',
  src:'第9章 財務報告に係る内部統制の報告・監査制度',
  q:`<p>上場会社Ｇ社の×4年3月期において，Ｇ社の経営者は財務報告に係る内部統制の評価を行った。その結果，売上計上プロセスにおいて，出荷基準に基づく売上計上の承認手続が期中を通じて機能しておらず，期末日時点でも是正されていなかったことが判明した。当該不備により，売上高の過大計上につき重要な虚偽記載が発生する可能性が高いと判断されたため，経営者は内部統制報告書において当該不備を開示すべき重要な不備として記載し，「財務報告に係る内部統制は有効でない」と結論付けた。</p>
<p>なお，監査人は，財務諸表監査において売上高について実証手続を拡大し，発見された虚偽表示は全てＧ社により修正された。</p>`,
  subs:[
    { q:'問1　内部統制監査と財務諸表監査の関係（一体監査）について，同一の監査人が実施する理由と監査証拠の利用の観点から説明しなさい。', pts:10,
      model:`1 実施主体：内部統制監査は，原則として，当該企業の財務諸表監査を行う同一の監査人（監査事務所のみならず業務執行社員も同一）が実施する（内部統制の監査の基準）。
2 理由：内部統制監査と財務諸表監査は，いずれも財務報告の信頼性の確保を目的とし，財務諸表監査においても監査人は内部統制を理解し評価する。同一の監査人が一体的に実施することで，①内部統制の評価結果を財務諸表監査のリスク評価・リスク対応手続に反映し，逆に財務諸表監査で発見した虚偽表示を内部統制の不備の評価に反映できるなど，監査の有効性が高まる，②重複した手続を避け，監査の効率性が向上する。
3 監査証拠の相互利用：内部統制監査の過程で得られた監査証拠は財務諸表監査の内部統制の評価における監査証拠として利用され，また，財務諸表監査の過程で得られた監査証拠も内部統制監査の証拠として利用されることがある。
4 相違点：内部統制監査は，経営者が作成した内部統制報告書の適正性について意見を表明するもの（間接報告）であり，監査人が直接内部統制の有効性について意見を表明するものではない。内部統制監査報告書は原則として財務諸表監査の監査報告書と合わせて一体的に作成する。`,
      kw:['同一の監査人','業務執行社員','一体監査','監査証拠','相互利用','効率性','内部統制報告書','間接報告'],
      ex:'解説：同一監査人の理由を「有効性」と「効率性」の両面から述べ，監査証拠の相互利用を具体的に書くこと。ダイレクト・レポーティングを採用していない点も頻出。' },
    { q:'問2　本事例において，監査人が内部統制監査報告書で表明すべき意見と記載事項を理由とともに述べなさい。', pts:10,
      model:`1 結論：無限定適正意見を表明し，追記情報（強調事項）として開示すべき重要な不備の内容等を記載する。
2 理由：内部統制監査は，経営者が作成した内部統制報告書が，一般に公正妥当と認められる財務報告に係る内部統制の評価の基準に準拠して，内部統制の評価結果について全ての重要な点において適正に表示しているかについて意見を表明するものである。本事例では，経営者が開示すべき重要な不備を適切に識別し，「有効でない」と結論付けて内部統制報告書に記載しており，評価範囲・評価手続・評価結果が適正に表示されていれば，内部統制報告書は適正であり，無限定適正意見となる。内部統制が有効でないことと，内部統制報告書が適正であることは区別される。
3 追記：監査人は，経営者が内部統制報告書に開示すべき重要な不備及びそれが是正されない理由を記載している場合には，当該開示すべき重要な不備がある旨，及び当該開示すべき重要な不備が財務諸表監査に及ぼす影響を強調事項として内部統制監査報告書に追記する。
4 なお，経営者が開示すべき重要な不備を記載せず「有効である」と結論付けていた場合には，内部統制報告書に重要な虚偽表示があるため，影響に応じて限定付適正意見又は不適正意見となる。`,
      kw:['無限定適正意見','内部統制報告書','適正に表示','開示すべき重要な不備','強調事項','開示すべき重要な不備がある旨','財務諸表監査に及ぼす影響','追記'],
      ex:'解説：「内部統制が有効でない」でも「内部統制報告書が適正」なら無限定適正意見となる点が最重要。追記事項（強調事項）の内容も正確に。' },
    { q:'問3　本事例において，財務諸表監査の監査意見はどうなるか。開示すべき重要な不備の存在が財務諸表監査に及ぼす影響とあわせて説明しなさい。', pts:8,
      model:`1 開示すべき重要な不備の影響：開示すべき重要な不備の存在は，売上高の実在性・期間帰属に関する統制リスクが高いことを意味する。監査人は，当該内部統制に依拠できないため，重要な虚偽表示リスクを高く評価し，発見リスクを低く設定して，売上高に係る実証手続（期末日前後のカットオフ・テスト，売掛金の確認，出荷記録との突合等）の種類・時期・範囲を拡大して対応する（監基報330）。
2 監査意見：開示すべき重要な不備があっても，財務諸表に重要な虚偽表示が残っているとは限らない。本事例では，実証手続の拡大により発見された虚偽表示は全て修正されており，十分かつ適切な監査証拠が入手できていれば，財務諸表監査においては無限定適正意見を表明できる。
3 コミュニケーション：監査人は，開示すべき重要な不備を含む重要な不備を，書面又は電磁的記録により監査役等に適時に報告し（監基報265），経営者に報告して是正を求め，是正状況を検討する。
4 結論：財務諸表監査は無限定適正意見，内部統制監査は無限定適正意見（強調事項付き）という組合せとなる。`,
      kw:['統制リスク','実証手続','拡大','無限定適正意見','監基報265','監査役等','書面','監基報330'],
      ex:'解説：内部統制に開示すべき重要な不備があっても，実証手続で十分な証拠を得て財務諸表が修正されていれば財務諸表監査は無限定適正となりうる。両監査の意見の組合せを整理できるかが問われる。' },
  ],
});

      const bLim=R.int(20,60)*100000; const bBook=bLim-R.int(1,10)*100000; const bCarry=R.int(1,15)*100000;

    q:`<p>次の事例を読んで，以下の問に答えなさい。</p>`+

      `<p>一方でA社は，ミクロン単位の微細加工を可能にする独自の生産技術と，それを支える熟練技能者のノウハウを長年にわたって蓄積してきた。この技術は社内の工程設計・品質管理の仕組みや，顧客の開発部門との長期的な共同開発関係と一体となっており，競合他社が設備を購入しても容易には再現できないとされる。A社経営陣は「当社の強みを活かしつつ，EV時代に向けて事業の組み替えを図る」ことを中期経営計画の柱に掲げている。</p>`,
    subs:[
      { q:'問1　ポーターの「5つの競争要因（ファイブ・フォース）」の枠組みを用いて，A社が属する業界の収益性（魅力度）を分析しなさい。',
        pts:8,
        model:'ポーターは，業界の収益性は①既存企業間の競争，②新規参入の脅威，③代替品の脅威，④買い手の交渉力，⑤売り手の交渉力という5つの競争要因の強さによって決まるとする。\nA社の業界では，④買い手である大手自動車メーカーは少数で購買量が大きく，複数社から見積りを取るなど供給者の切替えも可能であるため交渉力が極めて強い（毎年の値下げ要請）。⑤売り手である特殊鋼メーカーも少数で寡占的であり，交渉力は強い。②汎用品分野では新興国メーカーの参入が進み，新規参入の脅威が高まっている。③EVの普及により燃料噴射系部品そのものが不要となる可能性があり，代替品の脅威は長期的に極めて大きい。①その結果，限られた受注をめぐる既存企業間の価格競争も激しくなる。\nしたがって，5つの競争要因がいずれも強く作用しており，A社の業界の構造的な収益性（魅力度）は低いと評価される。',
        kw:['既存企業間の競争','新規参入','代替品','買い手の交渉力','売り手の交渉力','収益性','EV'],
        ex:'5要因をすべて挙げたうえで，事例の事実（顧客集中・値下げ要請，特殊鋼の寡占，新興国の参入，EV）と一つずつ対応させ，業界の魅力度について結論を示すこと。' },
      { q:'問2　ポーターの3つの基本戦略を説明したうえで，「スタック・イン・ザ・ミドル」の概念に触れつつ，A社がとるべき基本戦略について論じなさい。',
        pts:7,
        model:'ポーターは，競争優位のタイプ（低コストか差別化か）と戦略ターゲットの幅（業界全体か特定セグメントか）の組合せから，①コスト・リーダーシップ戦略，②差別化戦略，③集中戦略（コスト集中・差別化集中）の3つの基本戦略を示した。\nそしてポーターは，いずれの戦略にも徹し切れず低コストと差別化を中途半端に追求する企業は，コスト面でも差別化面でも優位を築けず低収益に陥る（スタック・イン・ザ・ミドル）と指摘した。\nA社は新興国メーカーに対して汎用品でコスト優位を築くことは難しい一方，微細加工技術という模倣困難な強みを有する。したがって，高精度が要求される部品領域に経営資源を集中する差別化集中戦略（又は業界全体での差別化戦略）を採用し，汎用品での価格競争から距離を置くべきである。その際，汎用品の低価格受注を並行して追うことはスタック・イン・ザ・ミドルを招くおそれがある。',
        kw:['コスト・リーダーシップ','差別化','集中','スタック・イン・ザ・ミドル','微細加工','汎用品'],
        ex:'3戦略の定義（競争優位の源泉×ターゲットの幅）と，中途半端な戦略の危険性を正確に説明し，A社の強み・弱みに基づく一貫した結論を導けているかを評価する。' },
      { q:'問3　バーニーのVRIOフレームワークを説明し，A社の微細加工技術が持続的競争優位の源泉となり得るかを評価しなさい。',
        pts:8,
        model:'資源ベース論（RBV）は，企業間の業績差の源泉を企業内部の経営資源の異質性と移動困難性に求める。バーニーのVRIOフレームワークは，経営資源について，①経済価値（Value：外部環境の機会を活かし脅威を無力化できるか），②希少性（Rarity），③模倣困難性（Inimitability），④組織（Organization：資源を活用する組織体制が整っているか）を順に問い，すべてを満たす資源が持続的競争優位をもたらすとする。\n模倣困難性の要因として，独自の歴史的条件（経路依存性），因果関係の曖昧性，社会的複雑性，特許が挙げられる。\nA社の微細加工技術は，高精度部品の需要に応えるという点で経済価値を有し，同等技術を持つ企業は少なく希少である。また，長年の蓄積による経路依存性，熟練技能者の暗黙知に基づく因果関係の曖昧性，工程設計・品質管理や顧客との共同開発関係と一体化した社会的複雑性のため，設備の購入では再現できず模倣困難である。組織面でも品質管理の仕組み等が整備されている。したがって現時点では持続的競争優位の源泉となり得る。\nただし，EV化により燃料噴射系部品の需要が消滅すれば，その用途における経済価値が失われるおそれがあり，資源の価値は環境に依存する点に留意が必要である。',
        kw:['経済価値','希少性','模倣困難性','組織','経路依存性','因果関係の曖昧性','社会的複雑性','持続的競争優位'],
        ex:'VRIOの4要素と模倣困難性の要因を正確に示し，事例の記述（長年の蓄積，熟練技能者，共同開発関係）と対応させること。経済価値が外部環境に依存する点に触れると高評価。' },
      { q:'問4　ポジショニング・アプローチと資源ベース論の特徴と限界を比較したうえで，ダイナミック・ケイパビリティの概念を用いて，EV化に直面するA社の課題を論じなさい。',
        pts:7,
        model:'ポジショニング・アプローチは，業界構造（外部環境）の分析を出発点とし，魅力的な業界・位置を選択することで競争優位を得ると考える（S-C-Pパラダイムに由来）。外部環境分析に優れる一方，同一業界内の企業間の業績差や，企業内部の能力の役割を十分に説明できない。資源ベース論は，企業内部の異質な資源に優位の源泉を求め，業績差を説明できる一方，静態的であり，環境変化の下でかつての強みが硬直性（コア・リジディティ）に転じる問題を扱いにくい。\nティースらのダイナミック・ケイパビリティは，急速に変化する環境に対応して，企業が内外の資源・能力を統合・構築・再構成する能力をいう。その内容は，①機会と脅威を感知する能力（センシング），②機会を捕捉し資源を動員する能力（シージング），③資産を再構成し組織を変容させる能力（トランスフォーミング）からなる。\nA社にとっての課題は，微細加工技術に過度に依存してコア・リジディティに陥ることなく，EV化の進展や新たな用途（例えばモーター・電池・半導体製造装置向けの精密部品）の機会を感知し，技術を新市場向けに転用するための投資や提携を実行し，顧客構成・組織・人材を再構成することである。',
        kw:['業界構造','内部資源','コア・リジディティ','ダイナミック・ケイパビリティ','感知','捕捉','再構成'],
        ex:'両アプローチの前提（外部環境か内部資源か）と限界を対比し，DCの3要素（感知・捕捉・変容）をA社の具体的行動に結び付けているかがポイント。' },
    ],
  });

  RB({

    q:`<p>次の事例を読んで，以下の問に答えなさい。</p>`+

      `<p>その後，海外売上高比率が5割を超えると，製品事業部と地域統括会社の双方が海外子会社に指示を出すマトリックス組織が導入されたが，指示の矛盾や意思決定の遅れが問題となっている。また，市場の変化が速く技術的不確実性の高い電子材料事業では，既存事業と同じ規程・評価制度のもとで新製品開発が停滞しており，現場からは「前例がないことは承認されない」「規則を守ること自体が目的になっている」との声が上がっている。</p>`,
    subs:[
      { q:'問1　ウェーバーの官僚制の特徴を説明し，官僚制の逆機能について，事例に即して論じなさい。',
        pts:7,
        model:'ウェーバーは，合法的支配に基づく官僚制を最も合理的・能率的な組織形態とし，その特徴として，①規則に基づく職務の明確な権限配分，②階層制（ヒエラルキー），③文書による職務遂行，④専門的訓練を受けた専任職員，⑤職務と私生活の分離，⑥非人格的（没人格的）な職務遂行などを挙げた。これにより，予測可能性・正確性・迅速性が確保される。\n他方，マートンは官僚制の逆機能を指摘した。規則の遵守が過度に強調されると，規則を守ること自体が目的化する「目的の置換」が生じ，また，訓練された行動様式が状況の変化に適応できない「訓練された無能」が生じる。セルズニックは権限委譲による下位目標の内面化と部門間対立を，グールドナーは規則による最低限の行動の固定化を指摘した。\nB社電子材料事業の「前例がないことは承認されない」「規則を守ること自体が目的になっている」という状況は，まさに目的の置換と訓練された無能の表れであり，不確実性の高い事業において革新や迅速な対応を阻害している。',
        kw:['合法的支配','階層','規則','非人格','逆機能','目的の置換','訓練された無能','マートン'],
        ex:'官僚制の特徴（合理性の源泉）と逆機能（マートン等）を区別して示し，事例の発言と対応付けること。' },
      { q:'問2　バーンズ＆ストーカーの研究，及びローレンス＆ローシュの研究の内容を説明し，コンティンジェンシー理論の観点からB社の組織上の問題を分析しなさい。',
        pts:8,
        model:'コンティンジェンシー理論は，唯一最善の組織は存在せず，有効な組織構造は環境や技術などの状況要因に依存するとする。\nバーンズ＆ストーカーは，英国企業の調査から，安定的な環境では職務の明確化・階層的な統制・垂直的コミュニケーションを特徴とする機械的組織が，変化の激しい環境では職務の柔軟な再定義・ネットワーク型の統制・水平的コミュニケーションを特徴とする有機的組織が有効であることを示した。\nローレンス＆ローシュは，不確実性の異なる下位環境に対応して各部門の目標・時間志向・対人志向・構造の公式性が異なる「分化」と，分化した部門間の協働を達成する「統合」の概念を示し，不確実性の高い環境では高度な分化と高度な統合を同時に達成する組織が高業績であること，統合には統合担当者や対立の直視（問題解決型の対立解消）が有効であることを明らかにした。\nB社の問題は，安定的な汎用樹脂事業に適合した機械的組織（詳細な規程・稟議制度）を，不確実性の高い電子材料事業にも一律に適用していることにある。電子材料事業は有機的組織として既存事業から十分に分化させる必要があり，同時に，分化した事業間・機能間を統合する仕組みを整備する必要がある。',
        kw:['コンティンジェンシー','機械的組織','有機的組織','不確実性','分化','統合','唯一最善'],
        ex:'両研究の主張を正確に示したうえで，事業ごとに環境の不確実性が異なるにもかかわらず単一の構造・制度を適用している点を問題として指摘できているかを評価する。' },
      { q:'問3　事業部制組織とマトリックス組織について，それぞれの長所と短所を説明し，B社のマトリックス組織で生じている問題への対応策を述べなさい。',

        model:'事業部制組織は，製品・地域・顧客別に，生産・販売等の機能を備えた利益責任単位（プロフィット・センター）としての事業部を設け，大幅な権限を委譲する組織である。長所は，①市場変化への迅速な対応，②トップが戦略的意思決定に専念できること，③業績評価の明確化と事業部長の育成である。短所は，①機能の重複による資源の非効率，②事業部間のセクショナリズムと短期利益志向，③事業部横断的な技術・知識の共有の困難である。\nマトリックス組織は，製品別と地域別（又は機能別）など2つの命令系統を組み合わせ，1人の部下が2人の上司をもつ（ツー・ボス・システム）組織である。長所は，複数の次元の要求（グローバル効率と現地適応など）に同時に対応でき，資源を柔軟に共有できることである。短所は，命令の一元性の原則に反するため，指示の矛盾，責任・権限の曖昧化，権力闘争，調整コストの増大と意思決定の遅れが生じやすいことである。\nB社では，①製品事業部と地域統括会社の責任・権限（どの意思決定をどちらが主導するか）を明確化し，②両者の対立を問題解決的に処理する調整会議や統合担当者を設け，③双方の目標を反映した業績評価を導入する必要がある。さらにバートレット＆ゴシャールが指摘するように，構造だけでなく，共有された価値観や管理者の意識（マトリックスを頭の中に作ること）の醸成が重要である。',

      { q:'問4　組織学習の概念（シングル・ループ学習とダブル・ループ学習，探索と活用）を説明し，「両利きの経営」の観点から，B社が電子材料事業の新製品開発を活性化するための方策を論じなさい。',
        pts:7,

        pts:8,
        model:'ブルームの期待理論（VIE理論）では，動機づけの強さ（モチベーションの力）は，①努力すれば一定の成果（業績）を達成できるという主観的確率である期待（E），②成果が報酬に結び付く程度である道具性（I），③報酬の魅力である誘意性（V）の積の総和（M＝Σ E×I×V）として表される。いずれかがゼロに近ければ動機づけは生じない。ポーター＆ローラーはこれを発展させ，業績から得られる報酬が公平と知覚されて満足を生み，それが次の期待に影響する循環モデルを示した。\nC社では，人事評価が年功的で成果が処遇に反映されないため，道具性（成果→報酬の結び付き）が極めて低い。また，設計の可否をすべて上司が判断し成果が見えにくいため，努力が成果につながるという期待も低下している。さらに，自らの仕事が医療に貢献しているという内発的報酬の誘意性も感じにくい。\n対応策として，①成果を公正に評価し処遇に反映する評価・報酬制度により道具性を高める，②能力開発と適切な目標設定・権限付与により期待を高める，③技術者が重視する報酬（挑戦的な仕事，成長機会，承認）を把握して提供し誘意性を高めることが考えられる。',

        ex:'3要素の定義と乗法モデルを示し，事例の事実（年功的評価，上司判断，貢献実感の欠如）がどの要素を低下させているかを対応付け，要素ごとに対策を示すこと。' },
      { q:`問2　ハックマン＆オルダムの職務特性モデルを説明し，資料の現状と職務再設計案について，それぞれ動機づけ潜在スコア（MPS）を計算しなさい。また，再設計案を実現するための具体的な職務設計の方法を述べなさい。`,
        pts:7,
        model:`職務特性モデルは，職務の5つの中核的特性（技能多様性，タスク・アイデンティティ，タスク重要性，自律性，フィードバック）が，3つの臨界的心理状態（仕事の有意味感，結果に対する責任感，結果についての知識）を生み，それが高い内発的動機づけ・職務満足・高い業績・低い欠勤や離職をもたらすとする。この関係は成長欲求の強さによって調整される。\nMPS＝（技能多様性＋タスク・アイデンティティ＋タスク重要性）÷3×自律性×フィードバック\n現状：（${JD0.SV}＋${JD0.TI}＋${JD0.TS}）÷3×${JD0.AU}×${JD0.FB}＝${MPS0}\n再設計案：（${JD1.SV}＋${JD1.TI}＋${JD1.TS}）÷3×${JD1.AU}×${JD1.FB}＝${MPS1}\n自律性とフィードバックは乗数として作用するため，これらが低い現状ではMPSが著しく低い。\n具体策として，①部品単位ではなく製品・モジュール全体を担当させる（タスクの統合）ことでタスク・アイデンティティと技能多様性を高める，②設計判断の権限を委譲し自律性を高める，③医療現場や顧客と直接接する機会を設けて（顧客との関係の確立）タスク重要性とフィードバックを高める，④フィードバック経路を開設する，といった職務充実（垂直的拡大）が有効である。`,

      { q:'問3　ハーシー＆ブランチャードのSL理論（状況的リーダーシップ理論）とバスの変革型リーダーシップ論をそれぞれ説明し，C社の開発部門の管理者に求められるリーダーシップを論じなさい。',

        model:'SL理論は，有効なリーダーシップ・スタイルは部下の成熟度（レディネス：能力と意欲）によって異なるとし，指示的行動と協労的（支援的）行動の組合せにより，①教示的（高指示・低協労），②説得的（高指示・高協労），③参加的（低指示・高協労），④委任的（低指示・低協労）の4スタイルを示した。部下の成熟度が高まるにつれて①から④へと移行すべきであるとする。\nバスは，報酬と成果の交換に基づく交換型（取引型）リーダーシップに対して，理想化された影響（カリスマ），モチベーションの鼓舞，知的刺激，個別配慮の4つの要素（4つのI）により，部下の価値観や意識を変革し期待以上の成果を引き出す変革型リーダーシップを提唱した。\nC社の若手技術者は一定の専門能力を有するが意欲が低下している状態にあり，SL理論に照らせば，指示を減らしつつ協労的行動を高める参加的スタイルが適合する。すべての判断を上司が行う現状は過度に指示的である。さらに，新市場への対応という変化の局面では，医療への貢献というビジョンを示して意欲を鼓舞し，既存の前提を問い直す知的刺激と個々の成長への配慮を行う変革型リーダーシップが求められる。',
        kw:['成熟度','指示的','協労的','参加的','委任的','変革型','知的刺激','個別配慮'],
        ex:'SL理論の2軸・4スタイルと成熟度との対応，変革型の4要素と交換型との違いを正確に説明し，事例の部下の状態に即してスタイルを選択できているかを評価する。' },
      { q:'問4　クリステンセンの「イノベーターのジレンマ」の内容を説明し，C社がD社に対して対応を見送った判断の問題点と，C社がとるべき対応策を論じなさい。',
        pts:8,
        model:'クリステンセンは，既存顧客が評価する性能軸に沿って製品を改良する持続的イノベーションと，当初は主要性能で劣るものの低価格・簡便・小型などの別の価値をもち，ローエンド市場や新市場から浸透する破壊的イノベーションを区別した。破壊的技術は改良が進むにつれ主流市場の要求水準に達し，既存企業の市場を奪う。\n優良な既存企業は，既存の主要顧客の声を聞き，利益率の高い事業に資源を配分するという合理的な経営を行うがゆえに，市場規模が小さく利益率の低い破壊的イノベーションへの対応が遅れ，最終的に地位を失う。これがイノベーターのジレンマである。また，技術進歩のペースが顧客の求める性能向上を上回る（性能の過剰供給）ことも破壊を可能にする。\nD社の携帯型装置は，大病院が重視する画像性能では劣るが，低価格・小型・簡便という別の価値で診療所・在宅医療という無消費の新市場を開拓しており，典型的な破壊的イノベーションである。C社の「利益率が低く当社の顧客も求めていない」という判断は，既存企業として合理的であるがゆえにジレンマに陥る典型であり，将来D社製品の性能向上によって主要市場を侵食される危険を見落としている。\n対応策として，①破壊的事業を既存組織から独立した小規模な組織（スピンアウト）に担わせ，小さな市場・低い利益率でも意欲が持てるコスト構造と評価基準を与える，②新市場の顧客から学習する発見志向の計画を採用する，③既存事業との両利きの経営により，C社の技術・ブランドを活用しつつ新事業を育成することが挙げられる。',
        kw:['持続的イノベーション','破壊的イノベーション','ローエンド','新市場','既存顧客','資源配分','独立した組織','性能の過剰供給'],
        ex:'破壊的イノベーションの定義と，既存企業が「合理的であるがゆえに」失敗するメカニズムを説明できるかがポイント。独立組織による対応は問1〜3の組織・人的管理の論点と関連付けると高評価。' },

  /* ------------------------------------------------------------
   * rb-keiei-4 資本コストとDCF企業価値評価（gen）
   * ------------------------------------------------------------ */
  RB({
    id:'rb-keiei-4', s:'keiei', t:'資本コスト（CAPM・WACC）とDCF法による企業価値評価',
    src:'財務管理',
    gen(){
      const tax=30;
      const rf10=R.pick([10,15,20]);           // 0.1%単位
      const b10=R.int(8,14);                     // β×10
      const MRP=R.pick([5,6]);
      const rdp=R.pick([2,3,4]);                 // 負債コスト（税引前）%
      const wDp=R.pick([20,30,40]);              // 目標負債比率 D/(D+E) %
      const Ke10=rf10+b10*MRP;                   // Ke を0.1%単位
      const W1000=(100-wDp)*Ke10+wDp*rdp*(100-tax)/10; // 0.001%単位
      chk(Number.isInteger(W1000),'W1000');
      const W10=Math.round(W1000/100);           // 小数点以下第2位を四捨五入 → 0.1%単位
      const W=W10/1000;                          // 小数
      const gc=[5,10,15,20].filter(x=>W10-x>=30); chk(gc.length>0,'g'); const g10=R.pick(gc);
      const g=g10/1000;
      const E1=R.int(100,160)*10, E2=E1+R.int(3,10)*10, E3=E2+R.int(3,10)*10;
      const EBIT=[E1,E2,E3];
      const Dep=[0,1,2].map(()=>R.int(20,40)*10);
      const Cap=Dep.map(d=>d+R.int(2,12)*10);
      const dNWC=[0,1,2].map(()=>R.int(3,10)*10);
      const NOPAT=EBIT.map(e=>e*(100-tax)/100);
      const FCF=[0,1,2].map(i=>NOPAT[i]+Dep[i]-Cap[i]-dNWC[i]);
      FCF.forEach(f=>chk(f>0 && Number.isInteger(f),'fcf'));
      const pv=FCF.map((f,i)=>f/Math.pow(1+W,i+1));
      const TV=FCF[2]*(1+g)/(W-g), pvTV=TV/Math.pow(1+W,3);
      const EVraw=pv[0]+pv[1]+pv[2]+pvTV, EV=rd(EVraw);
      const Debt=rd(EVraw*wDp/100,100);
      const Cash=R.int(5,20)*100;
      const Eq=EV+Cash-Debt;
      const N=R.int(20,60)*1000000;
      const VPS=rd(Eq*1e6/N);
      const MP=rd(VPS*R.int(75,125)/100,10);
      chk(Eq>0 && VPS>0,'eq');
      const tvShare=pvTV/EVraw*100;
      const Kep=(Ke10/10).toFixed(1), Wp=(W10/10).toFixed(1), gp=(g10/10).toFixed(1);
      const q=`<p>E社（非上場会社の買収検討対象）の企業価値を，フリー・キャッシュフロー（FCF）を割り引くDCF法により評価する。次の資料に基づいて，以下の問に答えなさい。金額の単位は百万円である。</p>`+
        `<p>1．資本コストに関する資料</p>`+
        tbl([['リスクフリー・レート',`${(rf10/10).toFixed(1)}％`],['E社株式のベータ（目標資本構成のもとでの値）',(b10/10).toFixed(1)],['マーケット・リスク・プレミアム',`${MRP}％`],['負債コスト（税引前）',`${rdp}％`],['法人税等の実効税率',`${tax}％`],['目標資本構成（時価ベース）',`負債：自己資本＝${wDp}：${100-wDp}`]],['項目','数値'])+
        `<p>2．事業計画（第1年度〜第3年度）</p>`+
        tbl([['営業利益（EBIT）',...EBIT],['減価償却費',...Dep],['設備投資額',...Cap],['正味運転資本の増加額',...dNWC]],['項目','第1年度','第2年度','第3年度'])+
        `<p>3．第4年度以降のFCFは，第3年度のFCFを基準に毎年${gp}％で永続的に成長すると仮定する（第3年度末に継続価値を算定する）。キャッシュフローは各年度末に生じるものとする。</p>`+
        `<p>4．評価時点におけるE社の非事業用資産（余剰現金及び投資有価証券）は${Y(Cash)}百万円，有利子負債は${Y(Debt)}百万円（簿価＝時価），発行済株式総数は${Y(N)}株である。</p>`+
        `<p>【解答上の注意】WACCは％表示で小数点以下第2位を四捨五入した値を以後の計算に用いる。割引計算は現価係数を用いず正確に行い，企業価値・株主価値は百万円未満を，1株当たり価値は円未満を四捨五入する（計算途中では端数処理をしない）。</p>`;
      const subs=[
        { q:'問1　CAPMによりE社の株主資本コストを求め，加重平均資本コスト（WACC）を計算しなさい。',
          pts:7,
          model:`株主資本コスト（CAPM）：${(rf10/10).toFixed(1)}％＋${(b10/10).toFixed(1)}×${MRP}％＝${Kep}％\n税引後負債コスト：${rdp}％×（1－${tax}％）＝${(rdp*0.7).toFixed(1)}％\nWACC：${Kep}％×${100-wDp}％＋${(rdp*0.7).toFixed(1)}％×${wDp}％＝${(W1000/1000).toFixed(3)}％ → ${Wp}％`,
          kw:[`${Kep}％`,`${(rdp*0.7).toFixed(1)}％`,`${Wp}％`,'税引後','目標資本構成'],
          ex:'負債コストは支払利息の損金算入による節税効果を反映して税引後で用いる。ウェイトは簿価ではなく時価（目標資本構成）による。' },
        { q:'問2　各年度のFCFを計算し，継続価値を含めたE社の事業価値（企業価値のうち事業から生じる部分）を求めなさい。あわせて，事業価値に占める継続価値の現在価値の割合（％，小数点以下第2位を四捨五入）を示しなさい。',
          pts:10,
          model:`FCF＝EBIT×（1－税率）＋減価償却費－設備投資額－正味運転資本増加額\n第1年度：${Y(E1)}×0.7＋${Dep[0]}－${Cap[0]}－${dNWC[0]}＝${Y(FCF[0])}\n第2年度：${Y(E2)}×0.7＋${Dep[1]}－${Cap[1]}－${dNWC[1]}＝${Y(FCF[1])}\n第3年度：${Y(E3)}×0.7＋${Dep[2]}－${Cap[2]}－${dNWC[2]}＝${Y(FCF[2])}\n各年度FCFの現在価値：${yen(pv[0],1)}，${yen(pv[1],1)}，${yen(pv[2],1)}\n継続価値（第3年度末）：${Y(FCF[2])}×（1＋${gp}％）÷（${Wp}％－${gp}％）＝${yen(TV,1)}\n継続価値の現在価値：${yen(TV,1)}÷（1＋${Wp}％）^3＝${yen(pvTV,1)}\n事業価値：${yen(pv[0]+pv[1]+pv[2],1)}＋${yen(pvTV,1)}＝${Y(EV)}百万円\n継続価値の割合：${fx(tvShare,1)}％`,
          kw:[Y(FCF[0]),Y(FCF[1]),Y(FCF[2]),yen(TV,1).split('.')[0],Y(EV),`${fx(tvShare,1)}％`],
          ex:'FCFは支払利息控除前の税引後営業利益（NOPAT）から計算する（利息の節税効果はWACCで反映するため二重計算しない）。継続価値は第3年度末時点の価値なので3年分割り引く。' },
        { q:'問3　E社の株主価値及び1株当たり株主価値を求めなさい。また，E社株式を1株'+Y(MP)+'円で取得できる場合，買収側の観点からその価格をどのように評価できるか述べなさい。',
          pts:6,
          model:`株主価値＝事業価値＋非事業用資産－有利子負債\n＝${Y(EV)}＋${Y(Cash)}－${Y(Debt)}＝${Y(Eq)}百万円\n1株当たり株主価値：${Y(Eq)}百万円÷${Y(N)}株＝${Y(VPS)}円\n取得価格${Y(MP)}円は1株当たり株主価値${Y(VPS)}円${MP<VPS?'を下回っており，DCF評価上は割安（買収によりNPVが正となる）と評価できる':MP>VPS?'を上回っており，DCF評価上は割高であり，シナジー等の追加価値が見込めない限り取得は正当化されない':'と等しく，DCF評価上はNPVがゼロとなる'}。ただし，継続価値が事業価値の${fx(tvShare,0)}％程度を占めるため，成長率やWACCの前提に対する感応度分析が必要である。`,
          kw:[Y(Eq),Y(VPS),'非事業用資産','有利子負債',MP<VPS?'割安':MP>VPS?'割高':'NPV'],
          ex:'事業価値に非事業用資産を加算し，有利子負債（債権者に帰属する価値）を控除して株主価値を求める。前提への感応度に言及できると高評価。' },

        { q:'問2　投資案A及びBの内部収益率（IRR）を求めなさい。また，両案のNPVが等しくなる割引率（フィッシャーの交差率）を求め，G社がいずれの案を採用すべきかを，評価基準間の結論の相違の原因に触れつつ述べなさい。',
          pts:10,
          model:`IRRをr，x＝1＋rとすると，I x²－C1 x－C2＝0 より x＝（C1＋√（C1²＋4 I C2））÷（2 I）\n投資案A：${Y(I_A)}x²－${Y(C1A)}x－${Y(C2A)}＝0 → IRR＝${pc(irrA)}％\n投資案B：${Y(I_B)}x²－${Y(C1B)}x－${Y(C2B)}＝0 → IRR＝${pc(irrB)}％\n交差率：差額キャッシュフロー（B－A）は第0年度${Y(-dI)}，第1年度${Y(dC1)}，第2年度${Y(dC2)}\n${Y(dI)}x²－${Y(dC1)}x－${Y(dC2)}＝0 → 交差率＝${pc(cross)}％（差額投資のIRR）\n資本コスト${k}％は交差率${pc(cross)}％を下回るため，NPVはBが大きく（A ${fx(npvA,1)}＜B ${fx(npvB,1)}），IRRとPIではAが優位となる。\n相互排他的案件では，企業価値（株主の富）の増加額を直接示すNPVを基準とすべきであり，投資案Bを採用する。差額投資（B－A）のIRR${pc(cross)}％も資本コストを上回っており，追加投資は有利である。\n結論の相違は，両案の投資規模の違いと，IRR法が中間キャッシュフローをIRRで再投資することを暗黙に仮定している（NPV法は資本コストで再投資）ことに起因する。IRRやPIは比率であり投資規模を考慮しない。`,
          kw:[`${pc(irrA)}％`,`${pc(irrB)}％`,`${pc(cross)}％`,'投資案B','規模','再投資','差額'],
          ex:'IRRは2年案件のため2次方程式で厳密に求まる。交差率は差額キャッシュフローのIRR。資本コストが交差率を下回る場合にNPVとIRRの順位が逆転することを説明できるかがポイント。' },
        { q:`問3　資産Xに${Math.round(w*100)}％，資産Yに${Math.round((1-w)*100)}％投資するポートフォリオの期待リターンと標準偏差を求めなさい。また，最小分散ポートフォリオにおける資産Xへの投資比率とその期待リターン・標準偏差を求めなさい。`,
          pts:7,
          model:`期待リターン：${w}×${Ex}％＋${fx(1-w,1)}×${Ey}％＝${fx(Ep,2)}％\n共分散：${rho<0?'（'+rho.toFixed(1)+'）':rho.toFixed(1)}×${sx}×${sy}＝${fx(cov,1)}\n分散：${w}²×${sx}²＋${fx(1-w,1)}²×${sy}²＋2×${w}×${fx(1-w,1)}×${cvP}＝${fx(varP,2)}\n標準偏差：√${fx(varP,2)}＝${fx(sp,2)}％（各資産の標準偏差の加重平均${fx(wavg,2)}％を下回る）\n最小分散ポートフォリオの資産X比率：（σY²－Cov）÷（σX²＋σY²－2Cov）＝（${sy*sy}－${cvP}）÷（${sx*sx}＋${sy*sy}－2×${cvP}）＝${pc(wmin)}％\nその期待リターン：${fx(Em,2)}％，標準偏差：${fx(sm,2)}％`,
          kw:[`${fx(Ep,2)}％`,`${fx(sp,2)}％`,`${pc(wmin)}％`,`${fx(sm,2)}％`,'共分散','相関係数'],
          ex:'ポートフォリオの分散には共分散項（2wxwyρσxσy）が入る。相関係数が1未満であれば標準偏差は加重平均を下回り，分散投資効果が生じる。' },
        { q:'問4　NPV法がIRR法よりも理論的に優れているとされる理由を3点挙げて説明しなさい。また，分散投資によって低減できるリスクとできないリスクを区別し，資本資産評価モデル（CAPM）において投資家が報われるリスクは何かを説明しなさい。',
          pts:6,
          model:'NPV法が優れる理由：①NPVは投資によって増加する企業価値（株主の富）を金額で直接示すため，企業価値最大化という財務目標と整合する。IRRは比率であり，規模の異なる相互排他的案件で誤った順位付けをすることがある。②IRR法は中間キャッシュフローをIRRで再投資することを暗黙に仮定するが，NPV法は資本コストでの再投資を仮定しており，より現実的である。③キャッシュフローの符号が複数回変化する非通常型の案件ではIRRが複数存在し又は存在しないことがあるが，NPVは一意に定まる。また，期間ごとに資本コストが異なる場合にもNPV法は対応できる（NPVには価値の加法性がある）。\nリスクの区分：個別企業に固有の要因から生じる非システマティック・リスク（固有リスク，分散可能リスク）は，相関の低い多数の資産に分散投資することで低減・消去できる。一方，景気変動や金利など市場全体に共通する要因から生じるシステマティック・リスク（市場リスク）は分散投資によっても消去できない。\nCAPMでは，投資家は分散投資により固有リスクを無コストで消去できるため，市場はそれに対してリスク・プレミアムを与えない。投資家が報われるのはシステマティック・リスクのみであり，その大きさはベータ（市場ポートフォリオとの共分散÷市場の分散）で測られ，期待リターン＝リスクフリー・レート＋β×マーケット・リスク・プレミアムとなる。',
          kw:['企業価値','再投資','複数','加法性','非システマティック','システマティック','ベータ'],
          ex:'NPVとIRRの相違点（規模・再投資仮定・複数IRR）を網羅し，分散可能リスクと不可能リスクの区別とCAPMにおけるベータの意味を関連付けられるかがポイント。' },
      ];
      return {q,subs};
    },
  });
})();

/* ============ 財務会計論 短答 総合問題（資料共通・小問3問） ============ */
(function(){
const ok=(c,m)=>{ if(!c) throw new Error('SG assert: '+m); };
const isI=x=>Number.isInteger(x);
/** 誤答リスト: 正答と異なる正の整数のみ・重複除去 */
const W=(a,arr)=>[...new Set(arr.filter(x=>isI(x)&&x>0&&x!==a))];
/** 小問の組立て（正答チェック付き） */
const S=(q,a,w,ex,u='千円')=>{ ok(isI(a)&&a>0,'answer '+q.slice(0,12)+' '+a); const ww=W(a,w); ok(ww.length>=3,'wrongs '+q.slice(0,12)+' a='+a); return {q,a,w:ww,u,ex}; };
const pc=(x,p)=>{ const v=x*p/100; if(!isI(v)) throw 0; return v; };   // x × p%（非整数なら引き直し）
const P=s=>`<p>${s}</p>`;
const NOTE='金額の単位は千円とする。';

/* ---- 1. 連結：資本連結・のれん・非支配株主持分 ---- */
SG({id:'sg-renketsu-1',t:'連結会計（資本連結・のれん・非支配株主持分）',ch:'連結会計',g(R){
  const p=R.pick([60,70,80]), np=100-p;
  const Cs=R.int(20,60)*1000, RE0=R.int(10,50)*1000, D1=R.int(2,12)*1000;
  const n2=R.pick([5,10]), D2=n2*R.int(2,10)*100, dep2=D2/n2;
  const N=R.pick([5,10,20]), am=R.int(2,15)*100, G=N*am;
  const NA=Cs+RE0+D1+D2, pNA=pc(NA,p), cost=pNA+G;
  const NIs=R.int(40,120)*100, Div=R.int(5,25)*100; if(Div>=NIs) throw 0;
  const pDiv=pc(Div,p), NIp=R.int(150,400)*100+pDiv;
  const adjNI=NIs-dep2;
  const nci=pc(NA+adjNI-Div,np);
  const nciNI=pc(adjNI,np);
  const parent=NIp+NIs-dep2-am-pDiv-nciNI;
  ok(parent===NIp-pDiv+pc(adjNI,p)-am,'parent NI');
  const data=P(`P社はX1年3月31日にS社の発行済株式の${p}％を${Y(cost)}千円で取得し，支配を獲得した。会計期間はいずれも4月1日から3月31日までの1年間である。${NOTE}税効果会計は考慮しない。`)
   +P('1．X1年3月31日におけるS社の貸借対照表の純資産の部は次のとおりである。')+tbl([['資本金',Cs],['利益剰余金',RE0]],['科目','金額'])
   +P(`2．X1年3月31日におけるS社の資産のうち，土地の時価は帳簿価額を${Y(D1)}千円上回り，建物の時価は帳簿価額を${Y(D2)}千円上回っていた。当該建物の残存耐用年数は${n2}年であり，定額法（残存価額ゼロ）により減価償却を行う。S社の資産・負債のその他の項目の時価は帳簿価額と一致していた。`)
   +P(`3．のれんは発生年度の翌年度から${N}年間にわたり定額法で償却する。`)
   +P(`4．X2年3月期のS社の当期純利益は${Y(NIs)}千円であり，同期中に${Y(Div)}千円の剰余金の配当（利益剰余金を原資とする）を行った。P社の個別上の当期純利益は${Y(NIp)}千円であり，S社からの受取配当金を含んでいる。なお，土地は期末現在S社が保有している。`)
   +P('5．P社・S社間には上記以外の取引はない。');
  const s1=S('問1　X2年3月期の連結損益計算書に計上されるのれん償却額はいくらか。',am,
    [G, pc(Cs+RE0,p)<cost?(cost-pc(Cs+RE0,p))/N:0, (cost-pc(Cs+RE0+D1,p))/N, G/N*2, (cost-NA)/N, rd(G*100/p/N)],
    `支配獲得時の子会社資本（評価差額を含む）＝${Y(Cs)}＋${Y(RE0)}＋${Y(D1)}＋${Y(D2)}＝${Y(NA)}<br>のれん＝${Y(cost)}－${Y(NA)}×${p}％＝${Y(G)}<br>償却額＝${Y(G)}÷${N}年＝<b>${Y(am)}千円</b><br>評価差額（土地・建物）を含めた資本に持分割合を乗じる点に注意。`);
  const s2=S('問2　X2年3月31日の連結貸借対照表に計上される非支配株主持分はいくらか。',nci,
    [pc(NA+NIs-Div,np), pc(NA+adjNI,np), pc(NA,np), pc(Cs+RE0+adjNI-Div,np), pc(NA+adjNI-Div,p), nci+rd(G*np/p)],
    `支配獲得時の非支配株主持分＝${Y(NA)}×${np}％＝${Y(pc(NA,np))}<br>評価差額の実現（建物の追加償却）＝${Y(D2)}÷${n2}＝${Y(dep2)}<br>修正後当期純利益＝${Y(NIs)}－${Y(dep2)}＝${Y(adjNI)}<br>期末非支配株主持分＝（${Y(NA)}＋${Y(adjNI)}－配当${Y(Div)}）×${np}％＝<b>${Y(nci)}千円</b>`);
  const s3=S('問3　X2年3月期の連結損益計算書に計上される親会社株主に帰属する当期純利益はいくらか。',parent,
    [parent+pDiv, parent+am, parent+pc(dep2,p), NIp+NIs-dep2-am-pDiv, parent-pc(Div,np), NIp+NIs-am-pDiv-pc(NIs,np)],
    `P社${Y(NIp)}＋S社${Y(NIs)}－建物追加償却${Y(dep2)}－のれん償却${Y(am)}－受取配当金の消去${Y(pDiv)}（${Y(Div)}×${p}％）－非支配株主に帰属する当期純利益${Y(nciNI)}（${Y(adjNI)}×${np}％）＝<b>${Y(parent)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});

/* ---- 2. 連結：内部取引・未実現利益・債権債務 ---- */
SG({id:'sg-renketsu-2',t:'連結会計（内部取引・未実現利益の消去）',ch:'連結会計',g(R){
  const p=R.pick([60,70,80]), np=100-p;
  const Sp=R.int(400,800)*1000, Cp=pc(Sp,R.int(65,78)), Ss=R.int(150,350)*1000, Cs=pc(Ss,R.int(70,82));
  const X=R.int(30,90)*1000, r=R.pick([20,25,30]);
  const E0=R.int(2,10)*1000, E1=R.int(3,14)*1000; if(E0===E1) throw 0;
  const u0=pc(E0,r), u1=pc(E1,r);
  const Ip=R.int(30,80)*1000, Is=E1+R.int(10,40)*1000;
  const Lb=R.int(10,30)*1000, Gl=R.int(10,60)*100;
  const AR0=R.int(5,30)*1000, AR1=R.int(5,40)*1000; if(AR0===AR1) throw 0;
  const rt=2, dA=pc(AR1-AR0,rt);
  const NIp=R.int(200,500)*100, NIs=R.int(80,250)*100; if(NIs<=Gl) throw 0;
  const nciNI=pc(NIs-Gl,np);
  const parent=NIp+NIs-(u1-u0)-Gl+dA-nciNI;
  const cogs=Cp+Cs-X+u1-u0, inv=Ip+Is-u1;
  ok(parent===NIp-(u1-u0)+dA+pc(NIs-Gl,p),'parent2');
  const data=P(`P社はS社の発行済株式の${p}％を保有し，支配している。支配獲得時にS社の資産・負債に評価差額はなく，のれんも生じていない。当期はX1年4月1日からX2年3月31日までの1年間である。${NOTE}税効果会計は考慮しない。`)
   +P('1．当期の個別損益計算書（抜粋）および期末の商品残高')+tbl([['売上高',Sp,Ss],['売上原価',Cp,Cs],['当期純利益',NIp,NIs],['期末商品',Ip,Is]],['科目','P社','S社'])
   +P(`2．P社は当期よりS社に商品を販売しており，当期の販売額は${Y(X)}千円である（売上総利益率${r}％，前期も同率）。S社の期首商品のうち${Y(E0)}千円，期末商品のうち${Y(E1)}千円はP社から仕入れたものである。`)
   +P(`3．当期中にS社は帳簿価額${Y(Lb)}千円の土地を${Y(Lb+Gl)}千円でP社に売却した。P社は期末現在当該土地を保有している。`)
   +P(`4．P社の売掛金のうちS社に対するものは，期首${Y(AR0)}千円，期末${Y(AR1)}千円である。P社は売掛金の期末残高に対して${rt}％の貸倒引当金を差額補充法により設定している。S社の買掛金とは一致している。`);
  const s1= R.chance(0.5)
   ? S('問1　当期の連結損益計算書に計上される売上原価はいくらか。',cogs,
      [Cp+Cs+u1-u0, Cp+Cs-X+u1, Cp+Cs-X-u1+u0, Cp+Cs-X, Cp+Cs-X+u1+u0, Cp+Cs-X+pc(u1-u0,p)],
      `P社${Y(Cp)}＋S社${Y(Cs)}－内部仕入高${Y(X)}＋期末未実現利益${Y(u1)}（${Y(E1)}×${r}％）－期首未実現利益の実現${Y(u0)}（${Y(E0)}×${r}％）＝<b>${Y(cogs)}千円</b>`)
   : S('問1　当期末の連結貸借対照表に計上される商品はいくらか。',inv,
      [Ip+Is, Ip+Is-(u1-u0), Ip+Is-pc(u1,p), Ip+Is-E1, Ip+Is-u1-u0, Ip+Is+u1],
      `P社${Y(Ip)}＋S社${Y(Is)}－期末未実現利益${Y(u1)}（${Y(E1)}×${r}％）＝<b>${Y(inv)}千円</b><br>期首分は当期に実現しているため期末商品からは控除しない。`);
  const s2=S('問2　当期の連結損益計算書に計上される非支配株主に帰属する当期純利益はいくらか。',nciNI,
    [pc(NIs,np), pc(NIs-Gl-(u1-u0),np), pc(NIs-Gl,p), pc(NIs+Gl,np), pc(NIs-Gl+dA,np)],
    `土地売却はアップストリームであるため，未実現利益${Y(Gl)}千円は非支配株主にも負担させる。<br>（${Y(NIs)}－${Y(Gl)}）×${np}％＝<b>${Y(nciNI)}千円</b><br>商品販売・貸倒引当金はP社側（ダウンストリーム）の修正であり，非支配株主持分には配分しない。`);
  const s3=S('問3　当期の連結損益計算書に計上される親会社株主に帰属する当期純利益はいくらか。',parent,
    [parent-dA, parent-2*dA, parent-u0, NIp+NIs-(u1-u0)-Gl+dA-pc(NIs,np), NIp+NIs-(u1-u0)-Gl+dA, parent+pc(Gl,np)],
    `P社${Y(NIp)}＋S社${Y(NIs)}－商品未実現利益の純増${Y(u1-u0)}（${Y(u1)}－${Y(u0)}）－土地売却益${Y(Gl)}${dA>=0?'＋':'－'}貸倒引当金の修正${Y(Math.abs(dA))}（（${Y(AR1)}－${Y(AR0)}）×${rt}％）－非支配株主に帰属する当期純利益${Y(nciNI)}＝<b>${Y(parent)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});

/* ---- 3. 持分法 ---- */
SG({id:'sg-mochibun-1',t:'持分法（投資差額・未実現利益・受取配当金）',ch:'持分法',g(R){
  const q=R.pick([20,25,30]);
  const Ca=R.int(20,80)*1000, Ra=R.int(10,50)*1000, D=R.int(2,15)*1000;
  const N=R.pick([5,10]), k=R.int(2,12)*100, G=N*k;
  const K=pc(Ca+Ra+D,q)+G;
  const NI=R.int(20,80)*1000, Div=R.int(4,15)*1000;
  const rdn=R.pick([20,25,30]), ru=R.pick([20,25,30]);
  const Ed=R.int(2,10)*1000, Eu=R.int(2,10)*1000;
  const ud=pc(pc(Ed,rdn),q), uu=pc(pc(Eu,ru),q), qNI=pc(NI,q), qDiv=pc(Div,q);
  const pl=qNI-k-ud-uu; if(pl<=0) throw 0;
  const inv=K+qNI-k-qDiv-ud;
  const X=R.int(100,300)*1000+qDiv, NIc=X-qDiv+pl;
  ok(inv===K+pl+uu-qDiv,'inv');
  const data=P(`P社（連結財務諸表作成会社）は，X1年3月31日にA社の発行済株式の${q}％を${Y(K)}千円で取得し，A社を持分法適用関連会社とした。会計期間はいずれも4月1日から3月31日までの1年間である。${NOTE}税効果会計は考慮しない。`)
   +P(`1．X1年3月31日のA社の純資産は資本金${Y(Ca)}千円，利益剰余金${Y(Ra)}千円であった。また，A社の保有する土地の時価が帳簿価額を${Y(D)}千円上回っていた（その他の資産・負債は時価と帳簿価額が一致）。`)
   +P(`2．投資差額（のれん相当額）は${N}年間で定額法により償却する。`)
   +P(`3．X2年3月期のA社の当期純利益は${Y(NI)}千円であり，期中に${Y(Div)}千円の剰余金の配当を行った。`)
   +P(`4．P社は当期よりA社に商品を販売している（売上総利益率${rdn}％）。A社の期末商品のうち${Y(Ed)}千円はP社から仕入れたものである。`)
   +P(`5．A社は当期よりP社に商品を販売している（売上総利益率${ru}％）。P社の期末商品のうち${Y(Eu)}千円はA社から仕入れたものである。`)
   +P(`6．未実現利益の消去は，ダウンストリームの場合は「持分法による投資損益／投資有価証券」，アップストリームの場合は「持分法による投資損益／商品」として処理する。`)
   +P(`7．持分法適用前のX2年3月期の連結損益計算書の当期純利益は${Y(X)}千円であり，A社からの受取配当金が含まれている。`);
  const s1=S('問1　X2年3月期の連結損益計算書に計上される持分法による投資損益（利益）はいくらか。',pl,

  const s2=S('問2　X2年3月31日の連結貸借対照表に計上されるA社株式（投資有価証券）の金額はいくらか。',inv,
    [inv-uu, inv+qDiv, inv+ud, K+qNI-qDiv, inv+k, K+pl],
