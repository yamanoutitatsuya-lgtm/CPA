  return {q:`Ｎ社の総資本（簿価）は${Y(TA)}百万円（うち有利子負債${Y(D)}百万円，自己資本${Y(Eq)}百万円），売上高は${Y(S)}百万円，営業利益（＝事業利益）は${Y(X)}百万円，負債利子率は${i}%，法人税率は${t}%である。\n問1　ＲＯＡ（事業利益÷総資本）とＲＯＥを求めなさい。\n問2　ＲＯＥを財務レバレッジ効果の公式で求め，問1の結果と一致することを確かめなさい。\n問3　ＲＯＥをデュポン・システムにより収益性・効率性・安全性の３指標に分解しなさい。\n問4　Ｎ社の加重平均資本コストが${w}%，投下資本が総資本（簿価）と等しいとき，ＥＶＡを求めなさい。また，ＥＶＡが毎期一定で永続すると仮定したときのＭＶＡを求めなさい。\n（小数点第３位以下の端数が生じる場合は，小数点第３位を四捨五入すること）`,
  model:`問1　ＲＯＡ＝${Y(X)}÷${Y(TA)}＝${roa}%\n当期純利益＝(${Y(X)}－${Y(D)}×${dec(i)})×(１－${dec(t)})＝${num(NI)}百万円\nＲＯＥ＝${num(NI)}÷${Y(Eq)}（自己資本は簿価）≒${roes}\n問2　ＲＯＥ＝{ＲＯＡ＋(ＲＯＡ－ｉ)×Ｄ／Ｅ}×(１－ｔ)\n＝{${roa}%＋(${roa}%－${i}%)×${Y(D)}／${Y(Eq)}}×(１－${dec(t)})≒${roes}\nＲＯＡ${roa>i?'＞':roa<i?'＜':'＝'}負債利子率であるため，負債の利用により${roa>i?'ＲＯＥは押し上げられている':roa<i?'ＲＯＥは押し下げられている':'ＲＯＥは変化しない'}（財務レバレッジ効果）。\n問3　収益性（売上高純利益率）＝${num(NI)}÷${Y(S)}≒${nf(mg,2)}%\n効率性（総資本回転率）＝${Y(S)}÷${Y(TA)}＝${num(to)}回\n安全性（財務レバレッジ）＝${Y(TA)}÷${Y(Eq)}≒${nf(lev,2)}倍\n問4　ＮＯＰＡＴ＝${Y(X)}×(１－${dec(t)})＝${num(nopat)}百万円\nＥＶＡ＝ＮＯＰＡＴ－投下資本×ＷＡＣＣ＝${num(nopat)}－${Y(TA)}×${dec(w)}＝${nf(eva,2)}百万円\nＭＶＡ＝将来ＥＶＡの現在価値合計＝${num(eva)}÷${dec(w)}＝${nf(mva,2)}百万円\nＥＶＡ${eva>0?'＞０であり，資本コストを上回る利益をあげて企業価値を創造している':'＜０であり，資本コストに見合う利益をあげられず企業価値を毀損している'}。ＥＶＡは株主資本コストまで控除し実額で示すため，ＲＯＥの問題点（株主資本コストを考慮しない比率指標）を解消できる。`,
  kw:[`${roa}%`,roes,'財務レバレッジ効果',nf(lev,2)+'倍','ＮＯＰＡＴ',nf(eva,2),nf(mva,2)]}; }});

/* ---------- 財務分析：回転期間とキャッシュ・コンバージョン・サイクル ---------- */
E({id:'e-keiei-ccc',f:F,ch:C5,t:'回転期間分析とキャッシュ・コンバージョン・サイクル',r:'B',
gen(){
  const S=R.int(10,30)*100, cg=S*R.pick([0.6,0.7,0.75,0.8]), u=S/100;
  const ar=[u*R.int(8,20),u*R.int(8,20)], iv=[u*R.int(4,12),u*R.int(4,12)], ap=[u*R.int(6,15),u*R.int(6,15)];
  const av=x=>(x[0]+x[1])/2;
  const ivD=av(iv)/S*365, arD=av(ar)/S*365, apD=av(ap)/cg*365, ccc=ivD+arD-apD, turn=S/av(iv);
  const cccs=nf(ccc,2)+'日';
  return {q:`Ｏ社の当期の売上高は${Y(S)}百万円，売上原価は${Y(cg)}百万円である。貸借対照表項目（単位：百万円）は次のとおりである。\n　売上債権：期首${Y(ar[0])}，期末${Y(ar[1])}\n　棚卸資産：期首${Y(iv[0])}，期末${Y(iv[1])}\n　仕入債務：期首${Y(ap[0])}，期末${Y(ap[1])}\n問1　棚卸資産回転率（回，売上高を用いる）を求めなさい。\n問2　棚卸資産回転期間（売上高を用いる），売上債権回転期間（売上高を用いる），仕入債務回転期間（売上原価を用いる）を日数で求めなさい。\n問3　キャッシュ・コンバージョン・サイクル（ＣＣＣ）を求め，その短縮が望ましい理由を述べなさい。\n（１年は365日とし，貸借対照表項目は期首と期末の平均を用いる。計算途中では四捨五入せず，最終値の小数点第３位を四捨五入すること）`,
  model:`問1　棚卸資産回転率＝${Y(S)}÷{(${Y(iv[0])}＋${Y(iv[1])})÷２}＝${Y(S)}÷${num(av(iv))}≒${nf(turn,2)}回\n問2　棚卸資産回転期間＝${num(av(iv))}÷${Y(S)}×365日≒${nf(ivD,2)}日\n売上債権回転期間＝${num(av(ar))}÷${Y(S)}×365日≒${nf(arD,2)}日\n仕入債務回転期間＝${num(av(ap))}÷${Y(cg)}×365日≒${nf(apD,2)}日\n問3　ＣＣＣ＝棚卸資産回転期間＋売上債権回転期間－仕入債務回転期間\n＝${num(ivD)}＋${num(arD)}－${num(apD)}≒${cccs}\nＣＣＣは仕入代金を支払ってから売上代金を回収するまでの期間であり，この間資金が棚卸資産や売上債権の形で拘束され機会原価が生じるため，可能な限り短縮することが望ましい。`,
  kw:[nf(turn,2)+'回',nf(ivD,2)+'日',nf(arD,2)+'日',nf(apD,2)+'日',cccs,'機会原価']}; }});

/* ---------- 株式評価：配当割引モデル（２段階）とＰＥＲ・ＰＢＲ ---------- */
E({id:'e-keiei-ddm-per',f:F,ch:C2,t:'配当割引モデル（定率成長モデル）とＰＥＲ・ＰＢＲ',r:'A',
gen(){
  const k=R.pick([8,10,12,15]), g=R.int(2,Math.min(5,k-3)), m=R.int(20,40), D2=(k-g)*m, P1=100*m;
  const D1=Math.max(10,D2-R.int(1,4)*10), P0=(D1+P1)/(1+k/100), P0r=Math.round(P0*100)/100;
  const eps=R.int(10,30)*10, bps=R.int(10,40)*100, per=P0r/eps, pbr=P0r/bps;
  return {q:`Ｐ社の第１期末の１株当たり配当は${D1}円，第２期末の１株当たり配当は${D2}円であり，それ以降は第２期末の配当を基準に毎期${g}%ずつ配当が成長すると見込まれている。株主の期待収益率（株主資本コスト）は${k}%である。\n問1　第１期末（配当支払後）の理論株価を求めなさい。\n問2　第１期首（現時点）の理論株価を求めなさい。\n問3　Ｐ社の１株当たり当期純利益（ＥＰＳ）が${eps}円，１株当たり純資産簿価（ＢＰＳ）が${Y(bps)}円であるとき，問2の株価に基づくＰＥＲとＰＢＲを求めなさい。\n（小数点第３位以下の端数が生じる場合は小数点第３位を四捨五入し，問3は四捨五入後の問2の株価を用いること）`,
  model:`問1　第２期末以降は定率成長するため，定率成長モデルにより，\n第１期末の株価＝${D2}÷(${dec(k)}－${dec(g)})＝${Y(P1)}円\n問2　第１期末の配当と株価が明らかであるため，通常の割引計算を行う。\n第１期首の株価＝(${D1}＋${Y(P1)})÷${g1(k)}≒${nf(P0,2)}円\n問3　ＰＥＲ＝株価÷ＥＰＳ＝${nf(P0r,2)}÷${eps}≒${nf(per,2)}倍\nＰＢＲ＝株価÷ＢＰＳ＝${nf(P0r,2)}÷${Y(bps)}≒${nf(pbr,2)}倍\n将来利益の成長が見込める企業ほど，ＰＥＲ・ＰＢＲは高くなる。`,
  kw:['定率成長モデル',Y(P1)+'円',nf(P0,2)+'円',nf(per,2)+'倍',nf(pbr,2)+'倍','ＥＰＳ']}; }});

/* ---------- 債券：価格・デュレーション・フォワードレート ---------- */
E({id:'e-keiei-bond',f:F,ch:C3,t:'債券価格・デュレーション・フォワードレート',r:'A',
gen(){
  const y=R.int(2,6), c=R.pick([1,2,3,4,5].filter(x=>x!==y)), dy=R.pick([0.5,1]);
  const pv=[1,2,3].map(n=>(n===3?100+c:c)/Math.pow(1+y/100,n)); const P=pv[0]+pv[1]+pv[2], P4=Math.round(P*1e4)/1e4;
  const D=(pv[0]+2*pv[1]+3*pv[2])/P, D3=Math.round(D*1000)/1000, MD=Math.round(D3/(1+y/100)*1000)/1000, dP=P4*MD*dy/100;
  const r1=R.int(5,30)/10, r2=Math.round((r1+R.int(1,10)/10)*10)/10, fw=(Math.pow(1+r2/100,2)/(1+r1/100)-1)*100;
  const Ps=nf(P,4)+'円', Ds=nf(D3,3)+'年', MDs=nf(MD,3), dPs=nf(dP,3)+'円', fws=nf(fw,2)+'%';
  return {q:`額面100円，クーポン・レート年${c}%（年１回利払い），残存期間３年の利付債があり，現在の最終利回りは年${y}%である。\n問1　この利付債の理論価格を求めなさい（小数点第５位を四捨五入）。\n問2　デュレーション（年）を求めなさい（小数点第４位を四捨五入）。\n問3　修正デュレーションを求め（小数点第４位を四捨五入），最終利回りが${dy}%上昇した場合の債券価格の変化額（概算）を求めなさい（問1・問3の四捨五入後の値を用い，小数点第４位を四捨五入）。\n問4　１年物割引債の最終利回り（スポットレート）が${r1}%，２年物割引債の最終利回りが${r2}%であるとき，１年後から２年後の１年間のフォワードレートを求めなさい（％表示で小数点第３位を四捨五入）。`,
  model:`問1　債券価格は将来キャッシュフローを最終利回りで割り引いた現在価値である。\nＰ＝${c}÷${g1(y)}＋${c}÷${g1(y)}^2＋${100+c}÷${g1(y)}^3\n＝${num(pv[0])}＋${num(pv[1])}＋${num(pv[2])}≒${Ps}\n${c<y?'（クーポン・レート＜最終利回りのため額面を下回る）':c>y?'（クーポン・レート＞最終利回りのため額面を上回る）':'（クーポン・レート＝最終利回りのため額面と一致する）'}\n問2　デュレーション＝Σ(ｔ×各期ＣＦの現在価値)÷債券価格\n＝(１×${num(pv[0])}＋２×${num(pv[1])}＋３×${num(pv[2])})÷${num(P)}≒${Ds}\nこれは債券投資の平均回収期間を表し，値が大きいほど金利変動に対する価格変動リスクが大きい。\n問3　修正デュレーション＝Ｄ÷(１＋ｒ)＝${nf(D3,3)}÷${g1(y)}≒${MDs}\n価格の変化額≒債券価格×修正デュレーション×利回りの変化＝${nf(P4,4)}×${MDs}×${dec(dy)}≒${dPs}（下落）\n問4　(１＋0ｒ2)^2＝(１＋0ｒ1)×(１＋1ｆ2)より，\nフォワードレート1ｆ2＝${g1(r2)}^2÷${g1(r1)}－１≒${fws}`,
  kw:[Ps,Ds,MDs,dPs,fws,'フォワードレート','平均回収期間']}; }});

/* ---------- ポートフォリオ理論：２資産・最小分散ポートフォリオ ---------- */
E({id:'e-keiei-portfolio',f:F,ch:C3,t:'２資産ポートフォリオと最小分散ポートフォリオ',r:'A',
gen(){
  const sA=R.int(2,6)*5, sB=R.int(2,6)*5, eA=R.int(3,12), eB=R.int(3,12), w=R.int(2,8)/10;
  const lim=Math.min(sA,sB)/Math.max(sA,sB); const rho=R.pick([-0.5,-0.2,0,0.2,0.4,0.5].filter(x=>x<lim-1e-9)); const rs=rho<0?'－'+P10(-rho):P10(rho);
  const vp=(a)=>a*a*sA*sA+(1-a)*(1-a)*sB*sB+2*a*(1-a)*rho*sA*sB;
  const Ep=w*eA+(1-w)*eB, sp=Math.sqrt(vp(w)), lin=w*sA+(1-w)*sB;
  const ws=(sB*sB-rho*sA*sB)/(sA*sA+sB*sB-2*rho*sA*sB), ss=Math.sqrt(vp(ws));
  const Eps=nf(Ep,2)+'%', sps=nf(sp,2)+'%', wss=nf(ws*100,2)+'%', sss=nf(ss,2)+'%';
  return {q:`証券Ａ（期待収益率${eA}%，標準偏差${sA}%）と証券Ｂ（期待収益率${eB}%，標準偏差${sB}%）があり，両者の収益率の相関係数は${rs}である。\n問1　資金の${Math.round(w*10)}割を証券Ａに，残りを証券Ｂに投資するポートフォリオの期待収益率と標準偏差を求めなさい。\n問2　問1の標準偏差を両証券の標準偏差の加重平均値と比較し，その差が生じる理由を述べなさい。\n問3　証券ＡとＢのみで構成される最小分散ポートフォリオにおける証券Ａへの投資比率と，そのときの標準偏差を求めなさい（空売りは行わない）。\n（計算途中では四捨五入せず，最終値の小数点第３位を四捨五入すること）`,
  model:`問1　Ｅ(Ｒｐ)＝${P10(w)}×${eA}%＋${P10(1-w)}×${eB}%＝${Eps}\nσｐ＝√{ｗ^2σＡ^2＋(１－ｗ)^2σＢ^2＋2ｗ(１－ｗ)ρσＡσＢ}\n＝√{${P10(w)}^2×${sA}^2＋${P10(1-w)}^2×${sB}^2＋2×${P10(w)}×${P10(1-w)}×(${rs})×${sA}×${sB}}＝√${num(vp(w))}≒${sps}\n問2　加重平均値＝${P10(w)}×${sA}%＋${P10(1-w)}×${sB}%＝${num(lin)}%\n相関係数が１未満であるため，各証券の収益の変動がポートフォリオ内で相殺され，標準偏差は加重平均値よりも小さくなる（リスク分散効果）。\n問3　σｐ^2をｗで微分してゼロとおくと，\nｗ＝(σＢ^2－ρσＡσＢ)÷(σＡ^2＋σＢ^2－2ρσＡσＢ)\n＝(${sB}^2－(${rs})×${sA}×${sB})÷(${sA}^2＋${sB}^2－2×(${rs})×${sA}×${sB})＝${num(ws)}≒${wss}\nこのときの標準偏差＝√${num(vp(ws))}≒${sss}\n最小分散ポートフォリオより上方の最小分散フロンティアが有効フロンティアとなる。`,
  kw:[Eps,sps,'リスク分散効果',wss,sss,'最小分散ポートフォリオ']}; }});

/* ---------- ＣＡＰＭ・β・投資パフォーマンス測度 ---------- */
E({id:'e-keiei-capm',f:F,ch:C3,t:'ＣＡＰＭ（証券市場線）と投資パフォーマンス測度',r:'A',
gen(){
  const rf=R.int(1,3), mrp=R.int(4,7), Rm=rf+mrp, sm=20, beta=R.pick([0.6,0.8,0.9,1.1,1.2,1.25,1.5]), cov=Math.round(beta*400);
  const si=R.pick([20,25,30,35,40].filter(x=>x>=beta*20+5)), rho=cov/(si*sm);
  const Ei=rf+beta*mrp, Ra=Math.round(Ei)+R.pick([-2,-1,1,2]), al=Ra-Ei, sh=(Ra-rf)/si, tr=(Ra-rf)/beta, shm=mrp/sm;
  const Eis=nf(Ei,2)+'%', als=nf(al,2)+'%';
  return {q:`安全利子率（リスクフリーレート）は${rf}%，市場ポートフォリオの期待収益率は${Rm}%，その標準偏差は${sm}%である。Ｑ社株式の収益率と市場ポートフォリオの収益率の共分散は${cov}（%^2），Ｑ社株式の標準偏差は${si}%である。\n問1　Ｑ社株式のβと，市場ポートフォリオとの相関係数を求めなさい。\n問2　証券市場線を示し，ＣＡＰＭによるＱ社株式の期待収益率を求めなさい。\n問3　アナリストはＱ社株式の収益率を${Ra}%と予想している。ジェンセン測度（ジェンセンのα）を求め，Ｑ社株式が割安か割高かを判断しなさい。\n問4　予想収益率${Ra}%に基づくＱ社株式のシャープ測度とトレイナー測度を求めなさい。\n（小数点第３位以下の端数が生じる場合は，小数点第３位を四捨五入すること）`,
  model:`問1　β＝Ｃｏｖ(Ｒｉ,Ｒｍ)÷σｍ^2＝${cov}÷${sm}^2＝${nf(beta,2)}\n相関係数＝Ｃｏｖ÷(σｉ×σｍ)＝${cov}÷(${si}×${sm})＝${nf(rho,2)}\n問2　証券市場線：Ｅ(Ｒｉ)＝ｒｆ＋{Ｅ(Ｒｍ)－ｒｆ}β＝${rf}＋(${Rm}－${rf})β＝${mrp}β＋${rf}\nＥ(Ｒｉ)＝${mrp}×${nf(beta,2)}＋${rf}＝${Eis}（均衡期待収益率）\n問3　ジェンセン測度＝実際の（予想）収益率－理論的な期待収益率＝${Ra}%－${nf(Ei,2)}%＝${als}\nα${al>0?'＞０であり，Ｑ社株式は証券市場線の上方に位置するため割安と判断される':'＜０であり，Ｑ社株式は証券市場線の下方に位置するため割高と判断される'}。\n問4　シャープ測度＝(${Ra}－${rf})÷${si}≒${nf(sh,2)}（市場ポートフォリオ：${mrp}÷${sm}＝${nf(shm,2)}）\nトレイナー測度＝(${Ra}－${rf})÷${nf(beta,2)}≒${nf(tr,2)}（市場ポートフォリオ：${mrp}）\nシャープ測度は標準偏差１単位当たり，トレイナー測度はβ１単位当たりの超過収益を示す。`,
  kw:[nf(beta,2),'証券市場線',Eis,'ジェンセン測度',als,al>0?'割安':'割高',nf(sh,2)]}; }});

/* ---------- 先物・先渡の理論価格 ---------- */
E({id:'e-keiei-futures',f:F,ch:C4,t:'先物の理論価格・裁定取引・為替先渡',r:'A',
gen(){
  const S=R.int(20,40)*1000, r=R.int(1,4), T=R.pick([1,2]), f=S*Math.pow(1+r/100,T);
  const Fa=Math.round((f+R.pick([-400,-300,-200,200,300,400]))/10)*10, hi=Fa>f, pr=Math.abs(Fa-f);
  const Sx=R.int(100,160), ry=R.pick([0.1,0.5,1]), ru=R.pick([2,3,4,5]), mo=R.pick([3,6]);
  const Fx=Sx*(1+ry/100*mo/12)/(1+ru/100*mo/12);
  const fs=nf(f,2), prs=nf(pr,2), Fxs=nf(Fx,2)+'円/ドル';

/* ---------- オプション：２項モデルとプット・コール・パリティ ---------- */
E({id:'e-keiei-option',f:F,ch:C4,t:'２項分布モデル（複製ポートフォリオ法）とプット・コール・パリティ',r:'A',

/* ---------- リアル・オプション（延期オプション） ---------- */
const RO=[]; [10,15,20,25,30,40,50].forEach(u=>[5,10,15,20,25,30].forEach(d=>[1,2,3,4,5].forEach(rf=>{ if(((rf+d)*100)%(u+d)===0&&rf+d<u+d) RO.push([u,d,rf]); })));
E({id:'e-keiei-real-option',f:F,ch:C4,t:'リアル・オプション（延期オプション）',r:'B',
gen(){
  const [u,d,rf]=R.pick(RO), S0=R.pick([20,40,100]), Su=S0*(100+u)/100, Sd=S0*(100-d)/100, q=(rf+d)/(u+d);
  const Vu=R.int(12,20)*10, Vd=R.int(5,9)*10, K=R.int(Vd/10+1,Vu/10-1)*10, c=R.int(2,8), I0=c+K;
  const npv1=(q*Vu+(1-q)*Vd)/(1+rf/100)-I0, npv2=q*(Vu-K)/(1+rf/100)-c, ov=npv2-npv1;
  const qs=nf(q,2), n1=nf(npv1,2)+'億円', n2=nf(npv2,2)+'億円', ovs=nf(ov,2)+'億円';
  return {q:`Ｓ社は資源開発プロジェクトの実施を検討している。現在の資源価格は＠${S0}円であり，１年後に＠${Su}円に上昇するとプロジェクトの価値は${Vu}億円，＠${Sd}円に下落すると${Vd}億円になると見込まれる。初期投資額は${I0}億円，リスクフリーレートは${rf}%である。\n問1　資源価格が上昇するリスク中立確率を求めなさい。\n問2　現時点で初期投資額の全額を支払ってプロジェクトを実行する場合の正味現在価値（ＮＰＶ）を求め，採否を判定しなさい。\n問3　手付金として${c}億円のみを現在支払い，残額${K}億円は１年後の資源価格を見て支払う（プロジェクトを実行する）かどうかを決定できる延期オプションが付与された場合の正味現在価値と，当該リアル・オプションの価値を求めなさい。\n（億円未満の端数は小数点第３位を四捨五入すること）`,
  model:`問1　上昇するリスク中立確率をｑとすると，${Su}ｑ＋${Sd}(１－ｑ)＝${S0}×${g1(rf)}\nｑ＝(${P10(S0*(1+rf/100))}－${Sd})÷(${Su}－${Sd})＝${qs}\n問2　実際の確率やリスク調整後の割引率が与えられていないため，リスク中立確率を用いた確実性等価法で割り引く。\nＮＰＶ＝(${Vu}×${qs}＋${Vd}×(１－${qs}))÷${g1(rf)}－${I0}≒${n1}\nＮＰＶ${npv1>0?'＞０より採用':'＜０より棄却'}と判定される。\n問3　延期オプションがある場合，１年後，上昇時は${Vu}－${K}＝${Vu-K}億円＞０のため実行し，下落時は${Vd}－${K}＝${nf(Vd-K)}億円＜０のため実行しない（キャッシュフロー０）。\nＮＰＶ＝(${Vu-K}×${qs}＋０×(１－${qs}))÷${g1(rf)}－${c}≒${n2}\nリアル・オプションの価値＝${num(npv2)}－(${num(npv1)})≒${ovs}\n通常の正味現在価値法は，投資を断念すべき状況でも投資するものとして評価し，意思決定の柔軟性を無視するため，リアル・オプションで求めた評価額の方が大きくなる。`,
  kw:['リスク中立確率',qs,n1,n2,ovs,'延期オプション','柔軟性']}; }});

/* ---------- 金利スワップ ---------- */
E({id:'e-keiei-swap',f:F,ch:C4,t:'金利スワップ（比較優位）',r:'A',
gen(){
  const aF=R.int(20,40), dF=aF+R.int(15,40), bL=R.int(0,10), dL=bL+R.int(3,dF-aF-5), G=(dF-aF)-(dL-bL);
  const gC=R.int(Math.max(1,Math.ceil(G*0.3)),Math.min(G-1,Math.floor(G*0.7))), gD=G-gC, x=aF+gC;
  const fl=s=>s===0?'基準金利':s>0?`基準金利＋${pc1(s)}`:`基準金利－${pc1(-s)}`;
  const Cnet=fl(bL-gC), Dnet=pc1(dF-gD);
  return {q:`信用力の高いＣ社と信用力の劣るＤ社が，同じ金額・同じ期間の借入を行おうとしている。借入条件（年率）は次のとおりである。\n　Ｃ社：固定金利${pc1(aF)}，変動金利${fl(bL)}\n　Ｄ社：固定金利${pc1(dF)}，変動金利${fl(dL)}\nＣ社は変動金利での借入を，Ｄ社は固定金利での借入を望んでいる。\n問1　両社が金利スワップにより分け合うことのできる金利負担の改善幅の合計を求めなさい。\n問2　Ｃ社は固定金利で，Ｄ社は変動金利で借り入れたうえで，Ｄ社はＣ社に固定金利${pc1(x)}を支払い，Ｃ社はＤ社に${fl(bL)}を支払う金利スワップを行う。各社の実質的な金利負担と，自ら希望する金利で借り入れた場合と比べた改善幅を求めなさい。\n問3　本問の金利スワップにより両社の金利負担が改善する理由を，「比較優位」という語を用いて簡潔に述べなさい。`,
  model:`問1　固定金利格差＝${pc1(dF)}－${pc1(aF)}＝${pc1(dF-aF)}，変動金利格差＝${pc1(dL-bL)}\n改善幅の合計＝${pc1(dF-aF)}－${pc1(dL-bL)}＝${pc1(G)}\n問2　Ｃ社：${pc1(aF)}（銀行へ）＋(${fl(bL)})（Ｄ社へ）－${pc1(x)}（Ｄ社から）＝${Cnet}\n→自ら変動金利（${fl(bL)}）で借りる場合より${pc1(gC)}改善\nＤ社：(${fl(dL)})（銀行へ）＋${pc1(x)}（Ｃ社へ）－(${fl(bL)})（Ｃ社から）＝${Dnet}\n→自ら固定金利（${pc1(dF)}）で借りる場合より${pc1(gD)}改善\n改善幅の合計＝${pc1(gC)}＋${pc1(gD)}＝${pc1(G)}（問1と一致）\n問3　Ｃ社はいずれの金利でもＤ社より有利（絶対優位）であるが，金利差は固定金利の方が大きいため，Ｃ社は固定金利に，Ｄ社は変動金利に比較優位をもつ。各社が比較優位のある金利で借り入れてからスワップを行うことで，固定金利格差と変動金利格差の差を両社で分け合える（市場が非効率で裁定機会が存在することが前提）。`,
  kw:[pc1(G),Cnet,pc1(gC),Dnet,pc1(gD),'比較優位','絶対優位']}; }});

      const pvs=df.map(d=>CF*d), pvWC=WC*df[n-1];

        `<p>計算過程では端数処理を行わず，最終数値の千円未満を四捨五入すること。</p>`;

        { q:'問1　各年度の税引後正味キャッシュ・フロー（運転資本の回収を除く）を計算しなさい。',

          model:`減価償却費：${Y(I)}÷${n}年＝${Y(D)}千円\n税引後キャッシュ・フロー＝税引前正味現金流入額×(1－税率)＋減価償却費×税率\n＝${Y(CI)}×${100-tax}％＋${Y(D)}×${tax}％\n＝${Y(CI*(100-tax)/100)}＋${Y(D*tax/100)}＝${Y(CF)}千円（各年度）`,
          kw:['タックス・シールド',Y(D),Y(D*tax/100),Y(CF)],
          ex:'減価償却費は現金支出を伴わないが，課税所得を減らすことで税額を節約する（タックス・シールド）。税引後利益に減価償却費を足し戻す方法で計算しても同じ結果になる。' },
        { q:'問2　正味現在価値（NPV）を計算し，投資案の採否を判断しなさい。',

          ex:'正味運転資本は投資時の支出と最終年度の回収の両方を考慮する。回収分の割引を忘れたり，運転資本を投資額に含め忘れたりする誤りが多い。' },
        { q:'問3　本投資案の内部利益率（IRR）が資本コスト率を上回るか否かを，計算を行わずに理由を付して判断しなさい。また，単純回収期間（年，小数第2位まで四捨五入。運転資本を含む初期投資額を毎年の税引後CFで回収すると考える）を求め，回収期間法の問題点を述べなさい。',
          pts:8,
          model:`内部利益率はNPVをゼロとする割引率である。本投資案のCFは初期に支出，その後に収入が生じる通常型であり，割引率が高いほどNPVは小さくなる。資本コスト率${k}％で割り引いたNPVが${NPV>0?'正であるから，IRRは資本コスト率を上回る':'負（又はゼロ）であるから，IRRは資本コスト率以下である'}（参考：IRR≒${pct(irr,1)}％）。\n回収期間：${Y(I+WC)}÷${Y(CF)}＝${pct(pb,2)}年\n回収期間法は，計算が簡便で安全性（流動性）の尺度として有用であるが，①貨幣の時間価値を考慮しない，②回収期間後のキャッシュ・フローを無視するため収益性を測定できない，③採否の基準となる回収期間の設定が恣意的である，という問題点がある。`,
          kw:['内部利益率','NPVをゼロ',NPV>0?'上回る':'下回る',pct(pb,2),'貨幣の時間価値','回収期間後'],
          ex:'NPVとIRRは単一の独立投資案の採否については同じ結論となる。回収期間法の欠点は「時間価値の無視」と「回収後CFの無視」の2点が必須。' },
        { q:'問4　相互排他的な複数の投資案を順位付けする場合に，NPV法とIRR法とで結論が異なることがある理由を説明し，いずれの方法を用いるべきかを論じなさい。',
          pts:8,
          model:'NPV法とIRR法の順位が食い違うのは，主として投資規模の違いやキャッシュ・フローの発生パターン（時期）の違いがある場合である。その根本原因は再投資利回りの仮定にあり，NPV法は途中で回収したキャッシュ・フローが資本コスト率で再投資されると仮定するのに対し，IRR法はIRRそのもので再投資されると仮定する。また，IRRは比率であるため投資規模を反映せず，規模の大きい投資案がもたらす絶対額としての価値増加を評価できない。さらに，非通常型のキャッシュ・フローでは複数のIRRが存在したり，IRRが存在しないことがある。\n企業価値（株主の富）の最大化という目標に照らせば，投資によって増加する価値の絶対額を示し，現実的な再投資率（資本コスト率）を前提とするNPV法を用いるべきである。',

      ];
      return {q,subs};
    },
  });

RB({

  src:'第3章 機関 第7節 取締役の義務と報酬／第14節 役員等の損害賠償責任',
  q:`<p>甲株式会社（以下「甲社」という。）は，取締役会設置会社かつ監査役設置会社である公開会社であり，Aが代表取締役を務めている。</p>
<p>(1) Aは，自己が所有する土地（時価2億円）を甲社に3億円で売却する契約を甲社との間で締結した（以下「本件売買」という。）。本件売買について，甲社の取締役会の承認は得られていない。</p>
<p>(2) また，Aは，個人の事業資金としてB銀行から5億円を借り入れる際，甲社を代表して，Aの当該債務についてB銀行との間で連帯保証契約を締結した（以下「本件保証」という。）。本件保証についても取締役会の承認はなく，B銀行は，承認の有無を確認していなかった。</p>
<p>(3) 甲社の株主Cは，6か月前から引き続き甲社株式を保有している。甲社の他の取締役・監査役はAと親しく，Aの責任を追及する気配はない。</p>`,
  subs:[
    { q:'問1　本件売買の効力，およびAが甲社に対して負う責任について論じなさい。', pts:12,
      model:`1 問題提起：取締役Aが自ら甲社の相手方となる本件売買は，取締役が自己のために株式会社と取引をしようとするとき（直接取引）に当たる（会社法356条1項2号）。取締役会設置会社では取締役会の承認が必要であり（365条1項），承認を欠く本件売買の効力が問題となる。
2 規範：利益相反取引規制の趣旨は，取締役が会社の利益を犠牲にして自己の利益を図ることを防止し，会社の利益を保護する点にある。そこで，承認を欠く利益相反取引は無効と解する（最判昭43.12.25）。もっとも，無効は会社保護のためのものであるから，無効を主張できるのは会社のみであり，取締役側から主張することはできない（最判昭48.12.11）。
3 あてはめ：本件売買は直接取引であり，相手方はA自身であるから，第三者の取引安全を考慮する必要はなく，甲社はAに対し常に無効を主張できる。
4 責任：時価2億円の土地を3億円で買い受けたことにより甲社には1億円の損害が生じている。Aは356条1項の取締役として任務懈怠が推定され（423条3項1号），さらに自己のために直接取引をした取締役であるから，任務懈怠が自己の責めに帰することができない事由によるものであることをもって免れることができず（428条1項，無過失責任），責任の一部免除（425条〜427条）も受けられない（428条2項）。
5 結論：甲社はAに対し本件売買の無効を主張でき，Aは423条1項に基づき損害（1億円）を賠償する責任を負う。`,
      kw:['356条1項2号','365条1項','直接取引','会社のみが無効を主張','423条3項','428条1項','無過失責任'],
      ex:'解説：直接取引の効力（無効・主張権者）と責任（任務懈怠の推定・428条の無過失責任）をセットで書けるかがポイント。428条は「自己のために」直接取引をした取締役に限られる点，一部免除の規定が適用されない点まで書ければ高得点。' },
    { q:'問2　甲社はB銀行に対して本件保証の無効を主張することができるか論じなさい。', pts:10,
      model:`1 問題提起：株式会社が取締役以外の者との間で，取締役の債務を保証することは，会社と取締役との利益が相反する取引（間接取引）に当たる（356条1項3号）。承認（365条1項）を欠く本件保証をB銀行に対して無効と主張できるか。
2 規範：承認を欠く利益相反取引は会社の利益保護のため無効であるが，取締役会の承認は会社の内部的意思決定にすぎず，外部の第三者は容易にその有無を知り得ない。そこで，取引の安全との調和から，会社は第三者に対しては，当該取引について取締役会の承認を受けなかったことのほか，相手方である第三者がその事実を知っていたこと（悪意）を主張・立証して初めて無効を主張し得ると解する（相対的無効説，最判昭43.12.25）。
3 あてはめ：本件保証はAの個人債務を甲社が保証するものであり，外形的に会社の犠牲においてAが利益を受ける典型的な間接取引である。B銀行は承認の有無を確認していないが，承認がないことを知っていたとの事情は示されていない。したがって，甲社がB銀行の悪意を立証できれば無効を主張できるが，立証できなければ無効を主張できない。
4 結論：甲社は，B銀行が承認の欠如につき悪意であることを立証した場合に限り，本件保証の無効を主張できる。なお，無効を主張できない場合でも，甲社に損害が生じればAは423条1項・3項により責任を負う。`,
      kw:['356条1項3号','間接取引','相対的無効説','悪意を立証','最判昭43.12.25','取引の安全'],
      ex:'解説：間接取引では第三者の取引安全を考慮し，会社が第三者の悪意を立証しなければ無効を主張できない（相対的無効説）。直接取引との違いを明確に書くこと。学説によっては重過失も含める見解があるが，判例の要旨は「悪意」である。' },
    { q:'問3　株主Cが，Aの甲社に対する責任を追及するために採ることができる会社法上の手段と，その手続を説明しなさい。', pts:8,
      model:`1 問題提起：甲社の取締役・監査役はAの責任を追及しようとしない。役員間の仲間意識から会社による責任追及が懈怠されるおそれがあるため，株主Cによる責任追及の可否が問題となる。
2 規範：6か月前から引き続き株式を有する株主（公開会社）は，株式会社に対し，書面等により役員等の責任を追及する訴えの提起を請求することができ（847条1項），会社が請求の日から60日以内に訴えを提起しないときは，請求した株主は会社のために責任追及等の訴え（株主代表訴訟）を提起することができる（847条3項）。ただし，60日の経過により会社に回復することができない損害が生ずるおそれがある場合には，直ちに訴えを提起できる（847条5項）。提訴請求の宛先は，取締役の責任追及であるから監査役が会社を代表する（386条2項1号）。なお，株主若しくは第三者の不正な利益を図り又は会社に損害を加えることを目的とする場合は提訴請求できない（847条1項ただし書）。
3 あてはめ：Cは6か月前から引き続き甲社株式を保有しており要件を満たす。Cは甲社の監査役に対し提訴請求を行い，60日以内に甲社が提訴しなければ，Aに対し423条1項の責任（1億円）について代表訴訟を提起できる。
4 結論：Cは847条に基づき株主代表訴訟を提起できる。訴訟の目的の価額は財産権上の請求でない請求とみなされ（847条の4第1項），手数料は低額である。`,
      kw:['847条1項','6か月','60日','847条3項','監査役が会社を代表','386条','株主代表訴訟'],
      ex:'解説：代表訴訟は提訴請求→60日→提訴の流れと，取締役の責任追及の提訴請求の受領者が監査役である点（386条2項1号）が頻出。847条5項の例外，同項ただし書の不当目的も触れると加点。' },

      model:`1 問題提起：本件決議の招集手続に法令違反があり，決議取消事由（会社法831条1項1号）に当たるかが問題となる。

5 結論：本件決議には招集手続の法令違反という取消事由があり，株主等は×1年9月27日までに取消しの訴えを提起することができる。`,
      kw:['831条1項1号','299条1項','2週間前','招集通知もれ','3か月以内','834条17号','838条'],
      ex:'解説：公開会社の招集通知は2週間前（非公開会社は原則1週間前）。取消しの訴えは形成の訴えであり，提訴権者・提訴期間・被告・判決効を正確に書くこと。' },
    { q:'問2　株主Fは，自らは適法に招集通知を受けているが，Eに対する招集通知もれを理由として決議取消しの訴えを提起することができるか論じなさい。', pts:8,
      model:`1 問題提起：Fは自己に対する招集手続には瑕疵がないのに，他の株主Eに対する招集手続の瑕疵を理由に取消しの訴えを提起できるかが問題となる。
2 規範：株主総会決議取消しの訴えは，個々の株主の利益保護のみならず，会社の運営の適法性を確保するための制度である。したがって，株主は，自己に対する招集手続に瑕疵がなくとも，他の株主に対する招集手続の瑕疵を理由として決議取消しの訴えを提起することができる（最判昭42.9.28）。
3 あてはめ：Fは乙社の株主であり，831条1項の「株主等」に該当する。Eに対する通知もれは，招集手続の法令違反であり，Fはこれを主張し得る。また，Fが本件決議に賛成していたことも，取消しの訴えの提起を妨げる事情とはならないと解される（取消訴権は決議の公正を確保するために株主に認められた権利だからである）。
4 結論：Fは，Eに対する招集通知もれを理由として，本件決議の取消しの訴えを提起することができる。`,
      kw:['最判昭42.9.28','他の株主に対する招集手続の瑕疵','会社運営の適法性','株主等','831条1項'],
      ex:'解説：取消訴権は共益権であり，会社運営の適法性を確保するための権利であることが判例の理由付け。賛成株主の原告適格も問われやすい。' },
    { q:'問3　乙社は，「Eが出席していても決議の結果は変わらなかった」として，請求の棄却を求めている。裁判所は請求を棄却することができるか論じなさい。', pts:10,
      model:`1 問題提起：招集手続の法令違反がある場合に，決議の結果に影響がないことを理由に請求を棄却できるか（裁量棄却，831条2項）が問題となる。
2 規範：裁判所は，招集の手続又は決議の方法が法令・定款に違反するときであっても，①その違反する事実が重大でなく，かつ，②決議に影響を及ぼさないものであると認めるときは，請求を棄却することができる（831条2項）。①②は重畳的要件であり，瑕疵が重大であれば，決議に影響がなくても裁量棄却は認められない。
3 あてはめ：Eに対する招集通知もれは，Eから総会に出席して質問し意見を述べ議決権を行使する機会を完全に奪うものであり，しかも会社が対立株主を意図的に排除したものである。また招集期間不足は，株主が議案を検討し出席を準備する機会を全株主について損なう。これらは株主の総会参与権の根幹にかかわる重大な瑕疵であるから，②決議の結果に影響がないとしても，①の要件を満たさない。
4 結論：裁判所は831条2項により請求を棄却することはできず，本件決議は取り消されるべきである（招集手続の重大な瑕疵につき裁量棄却を否定した判例として，最判昭46.3.18）。`,
      kw:['831条2項','裁量棄却','違反する事実が重大でなく','決議に影響を及ぼさない','重大な瑕疵','最判昭46.3.18'],
      ex:'解説：裁量棄却は「重大でない」かつ「影響を及ぼさない」の両方が必要。結果に影響しないという会社側の主張だけでは足りない点が採点の核心。' },
  ],
});

RB({
  id:'rb-law-3', s:'law',
  t:'募集株式の有利発行・不公正発行と差止め・新株発行無効',
  src:'第6章 資金調達 第3節 募集株式の発行等',
  q:`<p>丙株式会社（以下「丙社」という。）は，取締役会設置会社である上場会社（公開会社）であり，発行済株式総数は1,000万株，株価は直近6か月にわたり1株1,000円前後で安定している。</p>
<p>丙社の株主G（持株比率40％）は，次回の定時株主総会で現経営陣の解任を求める株主提案を予定している。これに対し，代表取締役Hは，Hと友好関係にある取引先J社に対し，払込金額1株500円で600万株を割り当てる第三者割当て（以下「本件発行」という。）を取締役会決議により決定し，募集事項を公告した。丙社には差し迫った資金需要はなく，本件発行について株主総会の決議は経ていない。</p>`,
  subs:[
    { q:'問1　Gは本件発行の差止めを請求することができるか。差止事由を2つ挙げて論じなさい。', pts:14,
      model:`1 問題提起：株主は，募集株式の発行等が①法令又は定款に違反する場合，又は②著しく不公正な方法により行われる場合において，株主が不利益を受けるおそれがあるときは，会社に対しその差止めを請求できる（会社法210条）。本件発行がこれらに当たるか。
2 法令違反（有利発行）：公開会社でも，払込金額が募集株式を引き受ける者に特に有利な金額である場合には，株主総会の特別決議が必要であり（201条1項，199条2項3項，309条2項5号），取締役は総会で有利発行を必要とする理由を説明しなければならない（199条3項）。上場株式の公正な払込金額は，原則として発行決議直前の市場価格を基準とし，株価の動向等を考慮して判断する（最判昭50.4.8参照）。本件の払込金額500円は，安定した市場価格1,000円の半額であり，特に有利な金額に当たる。特別決議を欠く本件発行は法令違反であり，既存株主は経済的不利益（株式価値の希薄化）を受けるおそれがある。
3 著しく不公正な方法：資金調達の必要がないのに，支配権をめぐる争いがある状況で，経営陣が自己の支配権維持を主要な目的として行う発行は，著しく不公正な方法による発行に当たると解する（主要目的ルール）。本件では，差し迫った資金需要がなく，Gの解任提案を目前に，友好的なJ社に発行済株式の6割に相当する株式を割り当てるもので，Gの持株比率を40％から25％（400万株/1,600万株）に低下させる。支配権維持が主要目的と認められる。
4 結論：Gは210条1号・2号に基づき差止めを請求でき，実務上は差止めの仮処分（民事保全法）を申し立てることになる。`,
      kw:['210条','有利発行','199条3項','201条1項','309条2項5号','著しく不公正な方法','主要目的ルール','25％'],
      ex:'解説：差止事由の2類型（法令・定款違反／著しく不公正）を区別し，それぞれにあてはめること。主要目的ルールは下級審で確立した判断枠組みであり，資金調達の必要性の有無が重要な考慮要素。持株比率の計算（400万株÷1,600万株＝25％）も示すとよい。' },
    { q:'問2　差止めの仮処分が申し立てられる前に本件発行の効力が生じた場合，Gは新株発行無効の訴えにより本件発行の効力を争うことができるか。判例を踏まえて論じなさい。', pts:12,
      model:`1 問題提起：新株発行無効の訴え（828条1項2号，公開会社は効力発生日から6か月以内）の無効原因は明文がなく，本件の特別決議欠缺・不公正発行が無効原因となるかが問題となる。
2 規範：新株発行は効力発生後に多数の法律関係が形成され，無効とすると取引の安全を害するから，無効原因は重大な法令・定款違反に限定して解すべきである。
(1) 公開会社において株主総会の特別決議を欠く有利発行は，授権資本制度の下で新株発行が業務執行に準ずるものとして扱われていること，株主は取締役等の責任（423条，429条）や引受人の差額支払責任（212条1項1号）により経済的利益を回復し得ることから，無効原因とならない（最判昭46.7.16）。
(2) 著しく不公正な方法による発行も，株主は事前に差止請求（210条）で自己の利益を守ることができたこと，不明確な基準で事後的に無効とすることは取引の安全を害することから，無効原因とならない（最判平6.7.14）。
(3) ただし，差止めの仮処分命令に違反してなされた発行は，差止請求権を株主に与えた趣旨を没却するため無効原因となる（最判平5.12.16）。また，募集事項の公示（201条3項4項）を欠く場合は，差止事由がないため差止めが許容されない場合でない限り無効原因となる（最判平9.1.28）。
3 あてはめ：本件では公示はされており，仮処分違反もない。特別決議の欠缺および不公正発行は，いずれも判例上無効原因とならない。
4 結論：Gは新株発行無効の訴えで本件発行の効力を否定することはできず，取締役の責任追及や引受人の責任追及によって救済を図ることになる。`,
      kw:['828条1項2号','6か月','無効原因','最判昭46.7.16','最判平6.7.14','最判平5.12.16','仮処分','取引の安全'],
      ex:'解説：無効原因を限定的に解する理由（取引の安全）を示したうえで，判例の類型ごとに結論を示すのが合格答案。仮処分違反・公示欠缺の場合との対比を書けると評価が高い。なお非公開会社で特別決議を欠く第三者割当ては無効原因となる（最判平24.4.24）点との違いにも注意。' },
    { q:'問3　本件発行の効力が生じた場合に，J社が丙社に対して負う可能性のある責任を説明しなさい。', pts:6,
      model:`1 問題提起：不公正な払込金額で株式を引き受けた引受人に，会社に対する責任が生じるか。
2 規範：取締役と通じて著しく不公正な払込金額で募集株式を引き受けた者は，株式会社に対し，当該払込金額と当該募集株式の公正な価額との差額に相当する金額を支払う義務を負う（212条1項1号）。この責任は，株主代表訴訟の対象となる（847条1項）。
3 あてはめ：J社はHと友好関係にあり，Hと通じて市場価格の半額である1株500円で引き受けたと認められれば，公正な価額（1,000円）との差額500円×600万株＝30億円を丙社に支払う義務を負う。
4 結論：J社は212条1項1号の差額支払義務を負い，丙社が責任追及を懈怠するときは，Gは代表訴訟（847条）により追及できる。あわせてHも423条1項の責任を負い得る。`,
      kw:['212条1項1号','取締役と通じて','著しく不公正な払込金額','差額','30億円','847条'],
      ex:'解説：引受人の差額支払責任は「取締役と通じて」が要件。代表訴訟の対象となること（847条1項）も書くこと。差額の計算（500円×600万株）を示すと具体性が増す。' },
  ],
});

RB({
  id:'rb-law-4', s:'law',
  t:'代表取締役の専断的行為と取引の効力',
  src:'第3章 機関 第5節 取締役会／第6節 代表取締役',
  q:`<p>丁株式会社（以下「丁社」という。）は，取締役会設置会社かつ監査役設置会社であり，総資産は50億円，経常利益は年3億円程度である。丁社の定款には「1億円以上の借入れには取締役会の決議を要する」との定めがある。</p>
<p>(1) 丁社の代表取締役Kは，取締役会の決議を経ずに，丁社の主力工場の土地建物（帳簿価額12億円，丁社の唯一の生産拠点）をL社に売却した（以下「本件売却」という。）。L社の担当者は，丁社の役員と旧知の間柄であり，取締役会決議がないことを知っていた。</p>
<p>(2) Kは，取締役会の決議を経ずに，M銀行から運転資金1億5,000万円を借り入れた（以下「本件借入れ」という。）。M銀行は定款の上記定めを知らなかった。</p>`,
  subs:[
    { q:'問1　本件売却の効力について論じなさい。', pts:12,
      model:`1 問題提起：取締役会設置会社では，「重要な財産の処分」は取締役会で決定しなければならず，代表取締役に委任できない（会社法362条4項1号）。取締役会決議を欠く本件売却の効力が明文なく問題となる。
2 「重要な」の判断：重要な財産の処分に当たるかは，当該財産の価額，その会社の総資産に占める割合，当該財産の保有目的，処分行為の態様及び会社における従来の取扱い等の事情を総合的に考慮して判断する（最判平6.1.20）。本件土地建物は帳簿価額12億円で総資産50億円の24％を占め，丁社唯一の生産拠点であって事業継続の基盤であるから，「重要な財産」に当たる。
3 規範：代表取締役は会社の業務に関する一切の裁判上・裁判外の行為をする包括的代表権を有し（349条4項），取締役会決議は内部的意思決定にすぎない。そこで取引の安全を考慮し，取締役会決議を欠く代表取締役の行為は原則として有効であるが，相手方が決議を経ていないことを知り又は知り得べかりしときは，民法93条1項ただし書の類推適用により無効となると解する（最判昭40.9.22，心裡留保説）。
4 あてはめ：L社の担当者は取締役会決議がないことを知っており悪意である。
5 結論：本件売却は無効である。丁社はL社に対し無効を主張して土地建物の返還を求めることができ，Kは任務懈怠責任（423条1項）を負い得る。`,
      kw:['362条4項1号','重要な財産の処分','最判平6.1.20','総合的に考慮','最判昭40.9.22','民法93条1項ただし書','心裡留保','悪意'],
      ex:'解説：「重要性の判断基準」→「決議を欠く行為の効力」の二段構成が定番。総資産に占める割合（本問は24％）を具体的に指摘すること。心裡留保説のほか，相対的無効説（相手方の悪意・重過失で無効）等の学説もある。' },
    { q:'問2　L社の側から，取締役会の決議を欠くことを理由に本件売却の無効を主張することはできるか論じなさい。', pts:6,
      model:`1 問題提起：362条4項違反の取引の無効を，会社の相手方が主張できるか。
2 規範：362条4項が重要な業務執行を取締役会の決議事項としたのは，代表取締役への権限集中を抑制し，取締役相互の協議による結論に沿った業務執行を確保することで会社の利益を保護する趣旨である。したがって，取締役会決議を経ていないことを理由とする無効は，原則として会社のみが主張することができ，会社以外の者は，当該会社の取締役会が無効を主張する旨の決議をしているなどの特段の事情がない限り，無効を主張することはできない（最判平21.4.17）。
3 あてはめ：本件では丁社の取締役会が無効を主張する旨の決議をしたなどの事情はない。
4 結論：L社は，特段の事情がない限り，本件売却の無効を主張することはできない。`,
      kw:['最判平21.4.17','会社のみが主張','特段の事情','会社の利益を保護','362条4項'],
      ex:'解説：規定の趣旨（会社保護）から主張権者を会社に限定する判例。利益相反取引の無効の主張権者（最判昭48.12.11）と同様の発想である点を指摘するとよい。' },
    { q:'問3　本件借入れについて，丁社はM銀行に対して取締役会決議を欠くことを理由に無効を主張することができるか論じなさい。', pts:10,
      model:`1 問題提起：本件借入れ（1億5,000万円）が法定の「多額の借財」（362条4項2号）に当たるか，当たらない場合に定款による内部制限違反の効力が問題となる。
2 「多額の借財」該当性：多額かどうかは，借財の額，総資産や経常利益に占める割合，借財の目的，従来の取扱い等を総合考慮して判断する（最判平6.1.20の考え方）。本件は総資産50億円の3％，経常利益の半分に相当するが，通常の運転資金の借入れであり，法定の「多額の借財」に当たるかは事実関係によるものの，当たらないと考える余地がある。
3 当たらない場合（定款による内部制限）：代表取締役の代表権に加えた制限は，善意の第三者に対抗することができない（349条5項）。定款で取締役会決議を要すると定めたことは，代表権の内部的制限にすぎない。M銀行は定款の定めを知らず善意であるから，丁社は無効をM銀行に対抗できず，本件借入れは有効である。
4 当たる場合：問1と同様，心裡留保規定の類推（最判昭40.9.22）により，M銀行が決議の欠缺を知り又は知り得たときに限り無効を主張できる。M銀行は定款の定めも知らず，決議の欠缺を知り得た事情も示されていないから，無効は主張できない。
5 結論：いずれにしても，丁社はM銀行に対し本件借入れの無効を主張できず，Kの内部的責任（423条1項）の問題が残るにとどまる。`,
      kw:['362条4項2号','多額の借財','349条5項','代表権に加えた制限','善意の第三者','内部的制限'],
      ex:'解説：法律上の制限（362条4項）と定款・内規による内部的制限（349条5項）を区別できるかが問われる。後者は善意の第三者に対抗できない。両面から検討して結論を示すと高評価。' },
  ],
});

RB({
  id:'rb-law-5', s:'law',
  t:'財源規制違反の剰余金配当・自己株式取得と責任',
  src:'第7章 株式会社の計算等 第5節 剰余金の配当／第4章 株式 第6節 自己株式の取得',
  q:`<p>戊株式会社（以下「戊社」という。）は，取締役会設置会社かつ会計監査人設置会社である。戊社は，×2年4月1日の臨時株主総会の決議に基づき，同月20日を効力発生日として総額5億円の剰余金の配当（金銭配当，以下「本件配当」という。）を行った。</p>
<p>本件配当の効力発生日における戊社の分配可能額は3億円であった。本件配当の議案は代表取締役Nが株主総会に提出し，配当の実務は経理担当取締役Oが行った。Oは分配可能額の計算を誤っていたが，Nはこれを確認していなかった。</p>
<p>株主の多くは，分配可能額を超える配当であることを知らなかった。戊社の債権者Pは，戊社に対して8,000万円の貸付金債権を有している。</p>`,
  subs:[
    { q:'問1　本件配当の効力と，株主およびN・Oが戊社に対して負う責任について論じなさい。', pts:14,
      model:`1 問題提起：剰余金の配当により株主に交付する金銭等の帳簿価額の総額は，効力発生日における分配可能額を超えてはならない（会社法461条1項8号）。本件配当は5億円で分配可能額3億円を超えており，その効力と責任が問題となる。
2 効力：461条1項は「超えてはならない」と定めており，財源規制は会社債権者保護のための強行規定であるから，これに違反する配当は無効と解する（なお，463条1項の文言等から有効とする立案担当者の見解もある）。
3 株主の責任：金銭等の交付を受けた株主は，会社に対し，交付を受けた金銭等の帳簿価額に相当する金銭を支払う義務を負う（462条1項）。これは善意・悪意を問わない無過失責任である。
4 業務執行者等の責任：職務を行った業務執行者（O）及び株主総会に議案を提出した取締役（N）は，会社に対し，株主と連帯して，交付した金銭等の帳簿価額（5億円）に相当する金銭を支払う義務を負う（462条1項柱書・1項6号イ）。ただし，その職務を行うについて注意を怠らなかったことを証明したときは義務を負わない（462条2項，立証責任の転換された過失責任）。Oは計算を誤り，Nは確認を怠っており，いずれも無過失の証明は困難である。
5 免除：この義務は原則として免除できず，総株主の同意がある場合でも分配可能額（3億円）を限度として免除できるにとどまる（462条3項）。
6 結論：本件配当は無効であり，株主は受領額を，N・Oは連帯して5億円を戊社に支払う義務を負う。N・Oの責任のうち分配可能額超過部分2億円は総株主の同意があっても免除できない。`,
      kw:['461条1項','分配可能額','462条1項','連帯','462条2項','注意を怠らなかった','462条3項','2億円'],
      ex:'解説：株主の責任（無過失）と業務執行者等の責任（過失責任・立証責任の転換）の違い，免除の制限（分配可能額が限度）が重要。超過額5億円−3億円＝2億円は免除できない点を具体的に示すこと。' },
    { q:'問2　N・Oが戊社に支払いをした場合，善意の株主に求償することができるか。また，債権者Pは株主に対して直接支払いを請求することができるか論じなさい。', pts:10,
      model:`1 求償の可否：462条1項の義務を履行した業務執行者等は，本来は株主に求償できるはずであるが，分配可能額を超えることにつき善意の株主は，交付を受けた金銭等について，業務執行者等からの求償に応ずる義務を負わない（463条1項）。自ら違法行為を行った業務執行者等が善意の株主に返還を求めることで自己の負担を軽減するのは不当であり，一種の制裁として求償の相手方を悪意の株主に限定したものである。したがって，N・Oは悪意の株主にのみ求償でき，善意の株主には求償できない。
2 債権者の直接請求：株式会社の債権者は，462条1項の義務を負う株主に対し，その交付を受けた金銭等の帳簿価額（当該額が当該債権者の会社に対して有する債権額を超える場合は当該債権額）に相当する金銭を支払わせることができる（463条2項）。会社債権者が会社財産の維持に重大な利害を有するためである。この請求を受ける株主は悪意の株主に限られず，善意の株主も含まれると解される（463条1項は求償に関する制裁規定にすぎないため）。
3 結論：N・Oは善意の株主に求償できない。Pは，株主に対し，その受領額（ただしPの債権額8,000万円が上限）の支払いを請求することができる。`,
      kw:['463条1項','善意の株主','求償に応ずる義務を負わない','463条2項','債権者','債権額','8,000万円'],
      ex:'解説：463条1項（善意株主への求償制限）と2項（債権者の直接請求）を区別すること。債権者の請求額は債権額が上限となる点，善意株主も支払義務自体は負う点がよく問われる。' },
    { q:'問3　戊社が，本件配当とは別に，分配可能額の範囲内で市場取引により自己株式を取得したが，その事業年度末に欠損が生じた場合，業務執行者はどのような責任を負うか説明しなさい。', pts:6,
      model:`1 問題提起：取得時点では財源規制（461条1項2号等）に違反していないが，期末に欠損が生じた場合の責任が問題となる。
2 規範：株式会社が自己株式の取得等をした場合において，当該行為をした日の属する事業年度に係る計算書類の承認時に分配可能額がマイナス（欠損）となったときは，当該行為に関する職務を行った業務執行者は，会社に対し，連帯して，その超過額（交付した金銭等の帳簿価額の総額が上限）を支払う義務を負う（465条1項）。ただし，職務を行うについて注意を怠らなかったことを証明した場合は免れる（同項ただし書）。この責任は総株主の同意により免除できる（465条2項）。
3 趣旨：資本維持の一環として，業務執行者に対し，事後に欠損が生じる可能性があれば取得を行わない義務を課したものである。
4 結論：業務執行者は465条1項の欠損填補責任（過失責任・立証責任転換）を負う。`,
      kw:['465条1項','欠損填補責任','超過額','注意を怠らなかった','465条2項','総株主の同意'],
      ex:'解説：462条（行為時の財源規制違反）と465条（期末の欠損）の区別がポイント。定時株主総会での配当は欠損填補責任の対象外（465条1項10号イ）である点も併せて整理しておくこと。' },
  ],
});

RB({
  id:'rb-law-6', s:'law',
  t:'吸収合併と反対株主の株式買取請求・差止請求・合併無効',
  src:'第10章 組織再編行為等 第3節 吸収型再編の手続／第7節 組織再編行為の瑕疵',
  q:`<p>上場会社である己株式会社（以下「己社」という。存続会社）は，同じく上場会社である庚株式会社（以下「庚社」という。消滅会社）を吸収合併することとし，両社は合併契約を締結した。合併対価は己社株式であり，合併比率は「庚社株式1株につき己社株式0.5株」とされた。</p>
<p>庚社の株主Qは，第三者算定機関の評価等から合併比率が庚社株主に著しく不利であると考えている。庚社は株主総会の特別決議で合併契約を承認したが，Qは総会に先立ち反対の旨を通知し，総会でも反対した。</p>
<p>なお，庚社が株主総会に提出した議案の参考書類および事前開示書類には，合併比率の算定根拠について虚偽の記載があったことが後日判明した。</p>`,
  subs:[
    { q:'問1　Qは，庚社に対して株式買取請求をすることができるか。要件と手続，「公正な価格」の意義を説明しなさい。', pts:10,
      model:`1 規範：吸収合併をする場合，反対株主は，消滅株式会社に対し，自己の有する株式を公正な価格で買い取ることを請求することができる（会社法785条1項）。株主総会の決議を要する場合の反対株主とは，当該総会に先立って吸収合併に反対する旨を会社に通知し，かつ，総会において反対した株主（議決権を行使できる株主）をいう（785条2項1号イ）。
2 手続：消滅会社は効力発生日の20日前までに株主に対し吸収合併をする旨等を通知又は公告しなければならない（785条3項4項）。反対株主は，効力発生日の20日前の日から効力発生日の前日までの間に，株式の数を明らかにして請求しなければならない（785条5項）。価格について効力発生日から30日以内に協議が調わないときは，その期間満了日後30日以内に裁判所に価格決定の申立てができる（786条2項）。請求後は会社の承諾なく撤回できない（785条7項）。
3 公正な価格：公正な価格とは，組織再編によりシナジー等の企業価値の増加が生じる場合には，それを適切に分配したとすれば基準日時点で株式が有したであろう価格をいい，企業価値の増加が生じない場合や毀損される場合には，組織再編がなければ有したであろう価格（ナカリセバ価格）をいうと解されている（判例）。
4 あてはめ・結論：Qは事前通知および総会での反対をしており反対株主に当たる。Qは所定期間内に買取請求をすることにより，不公正な合併比率による不利益を「公正な価格」での買取りを通じて回避できる。`,
      kw:['785条1項','反対株主','公正な価格','785条2項1号イ','20日前','786条','ナカリセバ価格','シナジー'],
      ex:'解説：反対株主の要件（事前通知＋総会で反対），請求期間，価格決定申立ての流れを正確に。公正な価格はシナジー分配価格とナカリセバ価格の2場面を書き分けるのが判例の考え方。' },
    { q:'問2　合併の効力発生前に，Qが合併の差止めを請求することができるか論じなさい。', pts:8,
      model:`1 問題提起：Qは合併比率の不公正と，参考書類・事前開示書類の虚偽記載を理由に差止めを求めうるか。
2 規範：吸収合併が法令又は定款に違反する場合において，消滅株式会社の株主が不利益を受けるおそれがあるときは，株主は消滅会社に対し，吸収合併をやめることを請求できる（784条の2第1号）。対価が著しく不当であることを理由とする差止めは，略式合併の場合に限られる（784条の2第2号，784条1項）。
3 あてはめ：(1)本件は略式合併ではなく株主総会決議を経ているため，合併比率の不公正それ自体は，784条の2第2号の差止事由とはならない。「法令違反」は会社を名宛人とする法令違反をいい，取締役の善管注意義務違反は含まれないと解されている。(2)他方，事前開示書類（782条1項）に虚偽の記載があることは，法令違反に当たりうる。また総会参考書類の虚偽記載は招集手続の法令違反（決議取消事由）であり，それにより承認決議に瑕疵がある以上，合併は株主総会の適法な承認（783条1項）を欠く法令違反に当たると解される。株主は不公正な比率で株式を失う不利益を受けるおそれがある。
4 結論：Qは，事前開示・承認決議の瑕疵という法令違反を理由として，784条の2第1号に基づき差止めを請求でき，実務上は仮処分を申し立てる。`,
      kw:['784条の2','法令又は定款に違反','不利益を受けるおそれ','略式合併','対価が著しく不当','782条1項','事前開示'],
      ex:'解説：「対価の著しい不当」が差止事由になるのは略式組織再編のみ。通常の合併では手続の法令違反を差止事由として構成できるかがポイント。' },
    { q:'問3　合併の効力発生後，Qは合併比率の不公正を理由として合併無効の訴えを提起し，勝訴することができるか論じなさい。', pts:10,
      model:`1 問題提起：合併無効の訴え（828条1項7号）の無効原因は明文がなく，合併比率の不公正が無効原因となるかが問題となる。
2 規範：合併の効力発生後には多数の法律関係が形成されており，取引の安全の観点から無効原因は限定的に解すべきである。そして，合併比率の適否は基本的に株主総会の自主的判断に委ねられており，判断材料として事前開示（782条1項，794条1項）が定められ，不公正な比率に不満な株主は株式買取請求（785条，797条）により救済される。したがって，合併比率の不公正それ自体は合併無効原因とならない（最判平5.10.5）。
3 手続的瑕疵：もっとも，承認決議の瑕疵や事前開示の不備・虚偽は手続上の重大な瑕疵として無効原因となりうる。合併承認決議に取消事由がある場合，効力発生後は決議取消しの訴えは合併無効の訴えに吸収され，合併無効の訴えの中で主張すべきと解される（吸収説。ただし決議取消しの提訴期間3か月（831条1項）内に主張すべきとする見解が多数）。
4 あてはめ：Qは合併比率の不公正のみを理由としては勝訴できない。しかし，参考書類・事前開示書類の虚偽記載という手続的瑕疵を無効原因として主張すれば，勝訴の可能性がある。提訴は効力発生日から6か月以内（828条1項7号），原告は効力発生日に消滅会社の株主であった者等（828条2項7号）である。
5 結論：比率の不公正のみでは合併無効とはならないが，手続的瑕疵を主張して無効判決（将来効，839条）を得る余地がある。`,
      kw:['828条1項7号','6か月','合併比率の不公正','無効原因とならない','最判平5.10.5','株式買取請求','吸収説','839条'],
      ex:'解説：実体的な不公正（比率）は買取請求で救済し，手続的瑕疵は無効原因とする，という整理が合格答案の骨格。無効判決の将来効（839条）・対世効（838条）も押さえること。' },
  ],
});

RB({
  id:'rb-aud-1', s:'aud',
  t:'監査リスク・アプローチと重要性',
  src:'第3章 監査実施論 第4節 リスク・アプローチと監査リスク／第5節 監査の計画及び実施における重要性',
  q:`<p>監査基準は，監査人が監査リスクを合理的に低い水準に抑えるために，財務諸表における重要な虚偽表示のリスクを評価し，発見リスクの水準を決定するとともに，監査上の重要性を勘案して監査計画を策定し，これに基づき監査を実施することを求めている（リスク・アプローチ）。</p>
<p>以下の問いに答えなさい。</p>`,
  subs:[
    { q:'問1　監査リスクの構成要素（固有リスク・統制リスク・発見リスク）の意義と，それらの相互関係について説明しなさい。', pts:12,
      model:`1 監査リスク：監査人が，財務諸表の重要な虚偽表示を看過して誤った意見を形成する可能性をいう（監査基準，監基報200）。監査人は，監査リスクを許容可能な低い水準に抑えることにより合理的な保証を得る。
2 構成要素：
(1) 固有リスク：関連する内部統制が存在していないとの仮定の上で，取引種類，勘定残高又は注記事項に係るアサーションに，不正か誤謬かを問わず，重要な虚偽表示が行われる可能性をいう。
(2) 統制リスク：虚偽表示が，企業の内部統制によって防止又は適時に発見・是正されないリスクをいう。
(3) 両者を併せて「重要な虚偽表示リスク」といい，企業側に存在するリスクであるため監査人はこれを評価するのみで，その水準を直接コントロールできない。なお，現行の監査基準では，アサーション・レベルの重要な虚偽表示リスクは固有リスクと統制リスクを分けて評価することが求められる。
(4) 発見リスク：虚偽表示が存在し，それが重要な虚偽表示になり得る場合に，監査リスクを許容可能な低い水準に抑えるために監査人が監査手続を実施してもなお発見できないリスクをいう。
3 相互関係：監査リスク＝重要な虚偽表示リスク×発見リスクの関係にあり，監査人は，一定の監査リスク水準を達成するため，重要な虚偽表示リスクが高いほど発見リスクを低く設定し，実証手続の種類・時期・範囲（より証明力の強い手続，期末日近くの実施，範囲の拡大）を強化する。逆に重要な虚偽表示リスクが低ければ発見リスクを高く設定できる。発見リスクは監査人がコントロール可能な唯一の要素である。`,
      kw:['監査リスク','固有リスク','統制リスク','重要な虚偽表示リスク','発見リスク','反比例','実証手続','監基報200'],
      ex:'解説：監査リスクの定義，各構成要素の定義，リスク間の関係（重要な虚偽表示リスクと発見リスクの逆相関）の3点が骨格。固有リスクと統制リスクの分離評価（令和2年改訂）も押さえること。' },
    { q:'問2　財務諸表全体レベルの重要な虚偽表示リスクとアサーション・レベルの重要な虚偽表示リスクの違い，およびそれぞれに対する監査人の対応を説明しなさい。', pts:10,
      model:`1 財務諸表全体レベル：財務諸表全体に広く関わりがあり，特定のアサーションに結び付けられない重要な虚偽表示リスクをいう。経営者の誠実性の欠如，内部統制の不備（統制環境の脆弱性など），経営者による内部統制の無効化リスク，厳しい経営環境などから生じる。
対応：監査人は全般的な対応を行う（監基報330）。例えば，職業的懐疑心の保持の必要性の強調，より経験豊富な又は専門的な技能を有する監査チームメンバーの配置，指導監督の強化，監査手続の選択に企業が想定しない要素を組み込むこと，実証手続の実施時期や範囲の変更などである。

      model:`1 重要性の基準値：監査計画の策定時に決定する，財務諸表全体において重要であると判断する虚偽表示の金額をいう（監基報320）。財務諸表利用者の経済的意思決定に影響を与えると合理的に見込まれる金額であり，税引前利益や売上高等の指標に一定割合を乗じて決定するのが一般的である。

  src:'第4章 監査報告論／第3章 監査実施論 第13節 会計上の見積りの監査',
  q:`<p>上場会社Ｅ社は，過年度に買収した子会社に係る多額ののれんを連結貸借対照表に計上している。当期，当該子会社の業績は計画を下回ったが，経営者は将来事業計画に基づく割引前将来キャッシュ・フローがのれんを含む資産グループの帳簿価額を上回るとして，減損損失を認識していない。将来事業計画には，売上成長率や市場の回復時期に関する重要な仮定が含まれている。</p>
<p>監査人は，当該のれんの評価を監査役等とコミュニケーションを行った事項の一つとしている。</p>`,
  subs:[
    { q:'問1　監査上の主要な検討事項（KAM）の意義と導入の趣旨，および監査人がKAMを決定するプロセスを説明しなさい。', pts:10,
      model:`1 意義：監査上の主要な検討事項とは，当年度の財務諸表の監査の過程で監査役等と協議した事項のうち，職業的専門家として当該監査において特に重要であると判断した事項をいう（監査基準，監基報701）。
2 趣旨：監査人が実施した監査の内容に関する情報を提供することで，監査報告書の情報価値を高め，監査の透明性を向上させることにある。これにより，①財務諸表利用者の監査や財務諸表への理解が深まり，②経営者・監査役等との対話が促進され，③監査人と監査役等のコミュニケーションや，監査人と経営者との議論が一層充実し，監査品質の向上が期待される。KAMは監査意見に代わるものでも，除外事項付意見に代わるものでもない。
3 決定プロセス：(1)監査役等とコミュニケーションを行った事項の中から，特に注意を払った事項を決定する。その際，①特別な検討を必要とするリスクが識別された事項又は重要な虚偽表示リスクが高いと評価された事項，②見積りの不確実性が高いと識別された事項を含め，経営者の重要な判断を伴う事項に対する監査人の判断，③当年度に発生した重要な事象又は取引が監査に与える影響，を考慮する。(2)その中から，当年度の財務諸表監査において職業的専門家として特に重要であると判断した事項をKAMとして絞り込む。`,
      kw:['監査上の主要な検討事項','監基報701','監査役等と協議した事項','特に重要','透明性','特に注意を払った事項','見積りの不確実性','特別な検討を必要とするリスク'],
      ex:'解説：KAMの決定は「監査役等とコミュニケーションを行った事項」→「特に注意を払った事項」→「特に重要な事項」の三段階の絞り込み。考慮事項3点を正確に書くこと。' },
    { q:'問2　本事例ののれんの評価をKAMとして記載する場合，監査報告書に記載すべき内容と，その記載に当たっての留意点を説明しなさい。', pts:10,
      model:`1 記載内容：監査人は，KAMの区分に，個々のKAMごとに，①関連する財務諸表における注記事項がある場合には当該注記事項への参照，②KAMの内容，③監査人が監査の過程で当該事項が特に重要であると判断しKAMと決定した理由，④当該事項に対する監査上の対応，を記載する（監基報701）。
2 本事例へのあてはめ：②のれんの金額及び減損の兆候の存在，③将来事業計画の売上成長率・市場の回復時期という重要な仮定に高い見積りの不確実性と経営者の判断が伴い，特に重要と判断した理由，④事業計画と過去実績との比較，仮定の外部データ・市場予測との整合性の検討，感応度分析，専門家の利用などの対応を具体的に記載する。
3 留意点：(1)定型的・一般的な記述ではなく，当該企業に固有の情報を記載する。(2)企業に関する未公表の情報（原開示）を不必要に提供しないよう留意し，未公表情報を含める必要があると判断した場合は，経営者に追加開示を促し，監査役等と協議する。(3)KAMの記載は個別の事項に対する意見を表明するものではない。(4)法令等で公表が禁止されている場合や，記載による不利益が公共の利益を上回ると合理的に見込まれる極めて限定的な場合を除き，KAMは記載しなければならない。`,
      kw:['注記事項への参照','KAMの内容','決定理由','監査上の対応','企業固有','未公表の情報','経営者に追加開示を促す','個別意見ではない'],
      ex:'解説：記載内容の4項目，特に「決定理由」と「監査上の対応」の具体性が問われる。未公表情報の取扱い（原開示の原則は経営者）も頻出。' },
    { q:'問3　本事例ののれんの評価のように見積りの不確実性が高い会計上の見積りについて，監査人が実施すべき手続を監基報540の考え方に基づいて説明しなさい。', pts:10,
      model:`1 リスク評価：監査人は，会計上の見積りに関する重要な虚偽表示リスクを識別・評価する際，固有リスク要因である見積りの不確実性，複雑性，主観性及びその他の要因（経営者の偏向・不正リスク要因）を考慮し，固有リスクと統制リスクを分けて評価する（監基報540）。
2 リスク対応手続：監査人は次の一つ又は組合せで対応する。①監査報告書日までに発生した事象から監査証拠を入手する（例：期末後の子会社業績）。②経営者がどのように会計上の見積りを行ったかを検討する（見積手法の適切性，重要な仮定の合理性，データの目的適合性・信頼性）。③監査人の見積額又は許容範囲を設定する。本事例では，事業計画の売上成長率・市場回復時期について，過去の計画と実績の比較（遡及的検討），外部の市場予測との整合性，取締役会資料等との整合性を検討し，感応度分析を行う。
3 経営者の偏向：経営者の判断に偏向の兆候がないか検討し，職業的懐疑心を発揮して，経営者の見積りを裏付ける証拠だけでなく矛盾する証拠にも注意を払う。
4 注記の検討：見積りの不確実性に関する注記が適切かどうかを評価する。
5 総括：これらを踏まえ，会計上の見積りが適用される財務報告の枠組みに照らして合理的か，虚偽表示かを評価する。`,
      kw:['監基報540','見積りの不確実性','複雑性','主観性','経営者の偏向','重要な仮定','監査人の見積額','遡及的検討'],
      ex:'解説：監基報540（改訂）の固有リスク要因（不確実性・複雑性・主観性），3つの対応アプローチ，経営者の偏向の検討が採点の中心。事例の仮定に即して具体的手続を書くと高評価。' },
  ],
});

RB({
  id:'rb-aud-5', s:'aud',
  t:'継続企業の前提に関する監査人の検討と監査意見',
  src:'第5章 継続企業の前提に関する監査人の検討',
  q:`<p>上場会社Ｆ社は，3期連続で多額の営業損失を計上しており，当期末に主要な借入金の財務制限条項に抵触した。Ｆ社の経営者は，主要取引銀行との返済条件の緩和交渉及び不採算事業の売却を内容とする対応策を策定したが，銀行との交渉は監査報告書日時点で合意に至っていない。</p>
<p>以下の問いに答えなさい。</p>`,
  subs:[
    { q:'問1　継続企業の前提に関する監査人の責任と，監査人が実施すべき手続の概要を説明しなさい。', pts:10,
      model:`1 監査人の責任：監査人は，経営者が継続企業を前提として財務諸表を作成することの適切性について十分かつ適切な監査証拠を入手し，継続企業の前提に重要な不確実性が認められるか否かを結論付ける責任を有する（監査基準，監基報570）。ただし，監査人は企業の事業継続能力そのものを認定し保証するものではない。
2 手続：
(1) リスク評価手続の実施に当たり，継続企業の前提に重要な疑義を生じさせるような事象又は状況が存在するかどうかを検討する。本事例の継続的な営業損失，財務制限条項への抵触はこれに該当する。
(2) 当該事象又は状況が識別された場合，経営者の評価（少なくとも期末日の翌日から12か月間）及び対応策について検討する。対応策が当該事象又は状況を解消・改善するものであるか，実行可能性があるかについて十分かつ適切な監査証拠を入手し，重要な不確実性が認められるか否かを判断する。本事例では，銀行交渉の進捗，事業売却の実現可能性（買い手候補，交渉状況）等を検討する。
(3) 経営者から対応策の実行意思等について経営者確認書を入手し，監査役等とコミュニケーションを行う。`,
      kw:['継続企業の前提','監基報570','重要な疑義を生じさせるような事象又は状況','経営者の評価','12か月','対応策','重要な不確実性','実行可能性'],
      ex:'解説：監査人は事業継続能力を保証しない点，事象・状況の識別→経営者の評価と対応策の検討→重要な不確実性の判断という流れを書くこと。' },
    { q:'問2　監査人が重要な不確実性が認められると判断した場合において，次の各ケースで表明すべき監査意見と監査報告書の記載を理由とともに述べなさい。\n(a) 継続企業の前提に関する注記が適切になされている場合\n(b) 経営者が注記を一切行わない場合', pts:12,
      model:`(a) 無限定適正意見＋「継続企業の前提に関する重要な不確実性」区分
継続企業を前提として財務諸表を作成することは適切であり，重要な不確実性が財務諸表に適切に注記されている場合，財務諸表は適正に表示されているため無限定適正意見を表明する。ただし，継続企業の前提に関する注記は利用者の意思決定に及ぼす影響が常に著しく重要であるため，監査報告書に「継続企業の前提に関する重要な不確実性」という見出しを付した区分を必ず設け，重要な不確実性が認められる旨，当該事項を開示している注記事項を参照する旨，及び当該事項が監査意見に影響を及ぼすものではない旨を記載する（監基報570）。なお，当該事項は性質上KAMに該当するが，KAM区分には記載しない。
(b) 不適正意見
重要な不確実性が認められるにもかかわらず注記が行われない場合は，意見に関する除外に当たる。注記の欠如は，利用者の財務諸表の理解に不可欠な注記事項に関する虚偽表示であるから，その影響は広範であり，不適正意見を表明しなければならない。「不適正意見の根拠」区分に，重要な不確実性が認められる旨及び財務諸表に当該事項が注記されていない旨を記載する。なお，注記はなされているが不十分である場合は，状況に応じて限定付適正意見又は不適正意見となる。`,
      kw:['無限定適正意見','継続企業の前提に関する重要な不確実性','区分','注記を参照','不適正意見','広範','意見に関する除外','限定付適正意見'],
      ex:'解説：(a)は強調事項ではなく「継続企業の前提に関する重要な不確実性」区分を必ず設ける点，(b)は注記の欠如の影響が広範であるため不適正意見となる点が核心。' },
    { q:'問3　Ｆ社の経営者が監査人の求めにもかかわらず継続企業の前提に関する評価や対応策を示さない場合，および監査報告書日前に銀行が全額返済を求め，裁判所が再生手続開始決定を取り消した場合，監査人はそれぞれどのように対応すべきか説明しなさい。', pts:8,
      model:`1 経営者が評価・対応策を示さない場合：監査人が評価の実施や対応策の提示を求めたにもかかわらず経営者がこれを行わない場合，監査人は継続企業を前提として財務諸表を作成することの適切性に関する十分かつ適切な監査証拠を入手できない（監基報570）。したがって，監査範囲の制約として扱い，その影響の重要性と広範性に応じて，限定付適正意見又は意見不表明を検討する。継続企業の前提は財務諸表全体に関わるため，通常は意見不表明となる可能性が高い。
2 継続企業を前提とすることが適切でない場合：再生手続開始決定の取消しなど，継続企業を前提として財務諸表を作成することが適切でないと判断される一定の事実が存在するにもかかわらず，経営者が継続企業を前提として財務諸表を作成している場合，たとえその旨が注記されていても，監査人は不適正意見を表明しなければならない（監基報570）。「不適正意見の根拠」区分に，継続企業を前提として財務諸表を作成することが適切でないと判断した理由を記載する。`,
      kw:['監査範囲の制約','十分かつ適切な監査証拠','意見不表明','継続企業を前提とすることが適切でない','再生手続開始決定の取消し','不適正意見','注記されていても'],
      ex:'解説：「評価・対応策を示さない」＝範囲制約（限定付/意見不表明），「前提が不適切」＝注記があっても不適正意見。両者の違いを明確にすること。' },
  ],
});

RB({
  id:'rb-aud-6', s:'aud',
  t:'内部統制監査（J-SOX）と財務諸表監査の関係',
  src:'第9章 財務報告に係る内部統制の報告・監査制度',
  q:`<p>上場会社Ｇ社の×4年3月期において，Ｇ社の経営者は財務報告に係る内部統制の評価を行った。その結果，売上計上プロセスにおいて，出荷基準に基づく売上計上の承認手続が期中を通じて機能しておらず，期末日時点でも是正されていなかったことが判明した。当該不備により，売上高の過大計上につき重要な虚偽記載が発生する可能性が高いと判断されたため，経営者は内部統制報告書において当該不備を開示すべき重要な不備として記載し，「財務報告に係る内部統制は有効でない」と結論付けた。</p>
<p>なお，監査人は，財務諸表監査において売上高について実証手続を拡大し，発見された虚偽表示は全てＧ社により修正された。</p>`,
  subs:[
    { q:'問1　内部統制監査と財務諸表監査の関係（一体監査）について，同一の監査人が実施する理由と監査証拠の利用の観点から説明しなさい。', pts:10,
      model:`1 実施主体：内部統制監査は，原則として，当該企業の財務諸表監査を行う同一の監査人（監査事務所のみならず業務執行社員も同一）が実施する（内部統制の監査の基準）。
2 理由：内部統制監査と財務諸表監査は，いずれも財務報告の信頼性の確保を目的とし，財務諸表監査においても監査人は内部統制を理解し評価する。同一の監査人が一体的に実施することで，①内部統制の評価結果を財務諸表監査のリスク評価・リスク対応手続に反映し，逆に財務諸表監査で発見した虚偽表示を内部統制の不備の評価に反映できるなど，監査の有効性が高まる，②重複した手続を避け，監査の効率性が向上する。
3 監査証拠の相互利用：内部統制監査の過程で得られた監査証拠は財務諸表監査の内部統制の評価における監査証拠として利用され，また，財務諸表監査の過程で得られた監査証拠も内部統制監査の証拠として利用されることがある。
4 相違点：内部統制監査は，経営者が作成した内部統制報告書の適正性について意見を表明するもの（間接報告）であり，監査人が直接内部統制の有効性について意見を表明するものではない。内部統制監査報告書は原則として財務諸表監査の監査報告書と合わせて一体的に作成する。`,
      kw:['同一の監査人','業務執行社員','一体監査','監査証拠','相互利用','効率性','内部統制報告書','間接報告'],
      ex:'解説：同一監査人の理由を「有効性」と「効率性」の両面から述べ，監査証拠の相互利用を具体的に書くこと。ダイレクト・レポーティングを採用していない点も頻出。' },
    { q:'問2　本事例において，監査人が内部統制監査報告書で表明すべき意見と記載事項を理由とともに述べなさい。', pts:10,
      model:`1 結論：無限定適正意見を表明し，追記情報（強調事項）として開示すべき重要な不備の内容等を記載する。
2 理由：内部統制監査は，経営者が作成した内部統制報告書が，一般に公正妥当と認められる財務報告に係る内部統制の評価の基準に準拠して，内部統制の評価結果について全ての重要な点において適正に表示しているかについて意見を表明するものである。本事例では，経営者が開示すべき重要な不備を適切に識別し，「有効でない」と結論付けて内部統制報告書に記載しており，評価範囲・評価手続・評価結果が適正に表示されていれば，内部統制報告書は適正であり，無限定適正意見となる。内部統制が有効でないことと，内部統制報告書が適正であることは区別される。
3 追記：監査人は，経営者が内部統制報告書に開示すべき重要な不備及びそれが是正されない理由を記載している場合には，当該開示すべき重要な不備がある旨，及び当該開示すべき重要な不備が財務諸表監査に及ぼす影響を強調事項として内部統制監査報告書に追記する。
4 なお，経営者が開示すべき重要な不備を記載せず「有効である」と結論付けていた場合には，内部統制報告書に重要な虚偽表示があるため，影響に応じて限定付適正意見又は不適正意見となる。`,
      kw:['無限定適正意見','内部統制報告書','適正に表示','開示すべき重要な不備','強調事項','開示すべき重要な不備がある旨','財務諸表監査に及ぼす影響','追記'],

  /* ------------------------------------------------------------

  RB({
    id:'rb-tax-4', s:'tax', t:'各種所得の金額・損益通算と総所得金額',
    src:'所得税法22条・28条・33条・34条・69条，措置法41条の4',
    gen(){
      const S=R.int(45,84)*100000;
      const sd=S<=6600000?S*20/100+440000:S*10/100+1100000; const sal=S-sd;
      const sdTxt=S<=6600000?`${Y(S)}×20％＋440,000`:`${Y(S)}×10％＋1,100,000`;
      const RRv=R.int(20,60)*100000, LI=R.int(2,20)*100000, RE=RRv+R.int(5,25)*100000; const rLoss=RE-RRv;
      const excl=Math.min(rLoss,LI), usable=rLoss-excl;
      const ZR=R.int(5,20)*100000, ZE=ZR+R.int(1,5)*100000;
      const SP1=R.int(30,80)*100000, g1=R.int(1,15)*100000, SC1=SP1-g1;

      const d1=Math.min(g1,500000), d2=Math.min(g2,500000-d1); const sh=g1-d1, lg=g2-d2;

          kw:[nf(CCC),'キャッシュ・コンバージョン・サイクル',nf(dInv)+'日',nf(dAR)+'日',nf(dAP)+'日'],

          model:`経済的発注量＝√（2×発注固定費×年間販売量÷保管費）＝√（2×${Y(a)}×${Y(Dq)}÷${c}）＝${Y(EOQ)}単位\n発注量${Y(Qg)}単位の総費用＝${Y(a)}×${Y(Dq)}÷${Y(Qg)}＋${b}×${Y(Dq)}＋${c}×${Y(Qg)}÷2＝${nf(TC)}円\n（経済的発注量のときの総費用${nf(TCe)}円より大きい）`,
          kw:[Y(EOQ),nf(TC),'経済的発注量','保管費'],
          ex:'発注量が増えると総発注費用は減少し，保管費用は増加する。両者の和が最小となる発注量が経済的発注量である（単位当たり発注変動費は発注量に依存しない）。' },

})();

/* ============ 財務会計論 短答 総合問題（資料共通・小問3問） ============ */
(function(){
const ok=(c,m)=>{ if(!c) throw new Error('SG assert: '+m); };
const isI=x=>Number.isInteger(x);
/** 誤答リスト: 正答と異なる正の整数のみ・重複除去 */
const W=(a,arr)=>[...new Set(arr.filter(x=>isI(x)&&x>0&&x!==a))];
/** 小問の組立て（正答チェック付き） */
const S=(q,a,w,ex,u='千円')=>{ ok(isI(a)&&a>0,'answer '+q.slice(0,12)+' '+a); const ww=W(a,w); ok(ww.length>=3,'wrongs '+q.slice(0,12)+' a='+a); return {q,a,w:ww,u,ex}; };
const pc=(x,p)=>{ const v=x*p/100; if(!isI(v)) throw 0; return v; };   // x × p%（非整数なら引き直し）
const P=s=>`<p>${s}</p>`;
const NOTE='金額の単位は千円とする。';

/* ---- 1. 連結：資本連結・のれん・非支配株主持分 ---- */
SG({id:'sg-renketsu-1',t:'連結会計（資本連結・のれん・非支配株主持分）',ch:'連結会計',g(R){
  const p=R.pick([60,70,80]), np=100-p;
  const Cs=R.int(20,60)*1000, RE0=R.int(10,50)*1000, D1=R.int(2,12)*1000;
  const n2=R.pick([5,10]), D2=n2*R.int(2,10)*100, dep2=D2/n2;
  const N=R.pick([5,10,20]), am=R.int(2,15)*100, G=N*am;
  const NA=Cs+RE0+D1+D2, pNA=pc(NA,p), cost=pNA+G;
  const NIs=R.int(40,120)*100, Div=R.int(5,25)*100; if(Div>=NIs) throw 0;
  const pDiv=pc(Div,p), NIp=R.int(150,400)*100+pDiv;
  const adjNI=NIs-dep2;
  const nci=pc(NA+adjNI-Div,np);
  const nciNI=pc(adjNI,np);
  const parent=NIp+NIs-dep2-am-pDiv-nciNI;
  ok(parent===NIp-pDiv+pc(adjNI,p)-am,'parent NI');
  const data=P(`P社はX1年3月31日にS社の発行済株式の${p}％を${Y(cost)}千円で取得し，支配を獲得した。会計期間はいずれも4月1日から3月31日までの1年間である。${NOTE}税効果会計は考慮しない。`)
   +P('1．X1年3月31日におけるS社の貸借対照表の純資産の部は次のとおりである。')+tbl([['資本金',Cs],['利益剰余金',RE0]],['科目','金額'])
   +P(`2．X1年3月31日におけるS社の資産のうち，土地の時価は帳簿価額を${Y(D1)}千円上回り，建物の時価は帳簿価額を${Y(D2)}千円上回っていた。当該建物の残存耐用年数は${n2}年であり，定額法（残存価額ゼロ）により減価償却を行う。S社の資産・負債のその他の項目の時価は帳簿価額と一致していた。`)
   +P(`3．のれんは発生年度の翌年度から${N}年間にわたり定額法で償却する。`)
   +P(`4．X2年3月期のS社の当期純利益は${Y(NIs)}千円であり，同期中に${Y(Div)}千円の剰余金の配当（利益剰余金を原資とする）を行った。P社の個別上の当期純利益は${Y(NIp)}千円であり，S社からの受取配当金を含んでいる。なお，土地は期末現在S社が保有している。`)
   +P('5．P社・S社間には上記以外の取引はない。');
  const s1=S('問1　X2年3月期の連結損益計算書に計上されるのれん償却額はいくらか。',am,
    [G, pc(Cs+RE0,p)<cost?(cost-pc(Cs+RE0,p))/N:0, (cost-pc(Cs+RE0+D1,p))/N, G/N*2, (cost-NA)/N, rd(G*100/p/N)],
    `支配獲得時の子会社資本（評価差額を含む）＝${Y(Cs)}＋${Y(RE0)}＋${Y(D1)}＋${Y(D2)}＝${Y(NA)}<br>のれん＝${Y(cost)}－${Y(NA)}×${p}％＝${Y(G)}<br>償却額＝${Y(G)}÷${N}年＝<b>${Y(am)}千円</b><br>評価差額（土地・建物）を含めた資本に持分割合を乗じる点に注意。`);
  const s2=S('問2　X2年3月31日の連結貸借対照表に計上される非支配株主持分はいくらか。',nci,
    [pc(NA+NIs-Div,np), pc(NA+adjNI,np), pc(NA,np), pc(Cs+RE0+adjNI-Div,np), pc(NA+adjNI-Div,p), nci+rd(G*np/p)],
    `支配獲得時の非支配株主持分＝${Y(NA)}×${np}％＝${Y(pc(NA,np))}<br>評価差額の実現（建物の追加償却）＝${Y(D2)}÷${n2}＝${Y(dep2)}<br>修正後当期純利益＝${Y(NIs)}－${Y(dep2)}＝${Y(adjNI)}<br>期末非支配株主持分＝（${Y(NA)}＋${Y(adjNI)}－配当${Y(Div)}）×${np}％＝<b>${Y(nci)}千円</b>`);
  const s3=S('問3　X2年3月期の連結損益計算書に計上される親会社株主に帰属する当期純利益はいくらか。',parent,
    [parent+pDiv, parent+am, parent+pc(dep2,p), NIp+NIs-dep2-am-pDiv, parent-pc(Div,np), NIp+NIs-am-pDiv-pc(NIs,np)],
    `P社${Y(NIp)}＋S社${Y(NIs)}－建物追加償却${Y(dep2)}－のれん償却${Y(am)}－受取配当金の消去${Y(pDiv)}（${Y(Div)}×${p}％）－非支配株主に帰属する当期純利益${Y(nciNI)}（${Y(adjNI)}×${np}％）＝<b>${Y(parent)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});

/* ---- 2. 連結：内部取引・未実現利益・債権債務 ---- */
SG({id:'sg-renketsu-2',t:'連結会計（内部取引・未実現利益の消去）',ch:'連結会計',g(R){
  const p=R.pick([60,70,80]), np=100-p;
  const Sp=R.int(400,800)*1000, Cp=pc(Sp,R.int(65,78)), Ss=R.int(150,350)*1000, Cs=pc(Ss,R.int(70,82));
  const X=R.int(30,90)*1000, r=R.pick([20,25,30]);
  const E0=R.int(2,10)*1000, E1=R.int(3,14)*1000; if(E0===E1) throw 0;
  const u0=pc(E0,r), u1=pc(E1,r);
  const Ip=R.int(30,80)*1000, Is=E1+R.int(10,40)*1000;
  const Lb=R.int(10,30)*1000, Gl=R.int(10,60)*100;
  const AR0=R.int(5,30)*1000, AR1=R.int(5,40)*1000; if(AR0===AR1) throw 0;
  const rt=2, dA=pc(AR1-AR0,rt);
  const NIp=R.int(200,500)*100, NIs=R.int(80,250)*100; if(NIs<=Gl) throw 0;
  const nciNI=pc(NIs-Gl,np);
  const parent=NIp+NIs-(u1-u0)-Gl+dA-nciNI;
  const cogs=Cp+Cs-X+u1-u0, inv=Ip+Is-u1;
  ok(parent===NIp-(u1-u0)+dA+pc(NIs-Gl,p),'parent2');
  const data=P(`P社はS社の発行済株式の${p}％を保有し，支配している。支配獲得時にS社の資産・負債に評価差額はなく，のれんも生じていない。当期はX1年4月1日からX2年3月31日までの1年間である。${NOTE}税効果会計は考慮しない。`)
   +P('1．当期の個別損益計算書（抜粋）および期末の商品残高')+tbl([['売上高',Sp,Ss],['売上原価',Cp,Cs],['当期純利益',NIp,NIs],['期末商品',Ip,Is]],['科目','P社','S社'])
   +P(`2．P社は当期よりS社に商品を販売しており，当期の販売額は${Y(X)}千円である（売上総利益率${r}％，前期も同率）。S社の期首商品のうち${Y(E0)}千円，期末商品のうち${Y(E1)}千円はP社から仕入れたものである。`)
   +P(`3．当期中にS社は帳簿価額${Y(Lb)}千円の土地を${Y(Lb+Gl)}千円でP社に売却した。P社は期末現在当該土地を保有している。`)
   +P(`4．P社の売掛金のうちS社に対するものは，期首${Y(AR0)}千円，期末${Y(AR1)}千円である。P社は売掛金の期末残高に対して${rt}％の貸倒引当金を差額補充法により設定している。S社の買掛金とは一致している。`);
  const s1= R.chance(0.5)
   ? S('問1　当期の連結損益計算書に計上される売上原価はいくらか。',cogs,
      [Cp+Cs+u1-u0, Cp+Cs-X+u1, Cp+Cs-X-u1+u0, Cp+Cs-X, Cp+Cs-X+u1+u0, Cp+Cs-X+pc(u1-u0,p)],
      `P社${Y(Cp)}＋S社${Y(Cs)}－内部仕入高${Y(X)}＋期末未実現利益${Y(u1)}（${Y(E1)}×${r}％）－期首未実現利益の実現${Y(u0)}（${Y(E0)}×${r}％）＝<b>${Y(cogs)}千円</b>`)
   : S('問1　当期末の連結貸借対照表に計上される商品はいくらか。',inv,
      [Ip+Is, Ip+Is-(u1-u0), Ip+Is-pc(u1,p), Ip+Is-E1, Ip+Is-u1-u0, Ip+Is+u1],
      `P社${Y(Ip)}＋S社${Y(Is)}－期末未実現利益${Y(u1)}（${Y(E1)}×${r}％）＝<b>${Y(inv)}千円</b><br>期首分は当期に実現しているため期末商品からは控除しない。`);
  const s2=S('問2　当期の連結損益計算書に計上される非支配株主に帰属する当期純利益はいくらか。',nciNI,
    [pc(NIs,np), pc(NIs-Gl-(u1-u0),np), pc(NIs-Gl,p), pc(NIs+Gl,np), pc(NIs-Gl+dA,np)],
    `土地売却はアップストリームであるため，未実現利益${Y(Gl)}千円は非支配株主にも負担させる。<br>（${Y(NIs)}－${Y(Gl)}）×${np}％＝<b>${Y(nciNI)}千円</b><br>商品販売・貸倒引当金はP社側（ダウンストリーム）の修正であり，非支配株主持分には配分しない。`);
  const s3=S('問3　当期の連結損益計算書に計上される親会社株主に帰属する当期純利益はいくらか。',parent,
    [parent-dA, parent-2*dA, parent-u0, NIp+NIs-(u1-u0)-Gl+dA-pc(NIs,np), NIp+NIs-(u1-u0)-Gl+dA, parent+pc(Gl,np)],
    `P社${Y(NIp)}＋S社${Y(NIs)}－商品未実現利益の純増${Y(u1-u0)}（${Y(u1)}－${Y(u0)}）－土地売却益${Y(Gl)}${dA>=0?'＋':'－'}貸倒引当金の修正${Y(Math.abs(dA))}（（${Y(AR1)}－${Y(AR0)}）×${rt}％）－非支配株主に帰属する当期純利益${Y(nciNI)}＝<b>${Y(parent)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});

/* ---- 3. 持分法 ---- */
SG({id:'sg-mochibun-1',t:'持分法（投資差額・未実現利益・受取配当金）',ch:'持分法',g(R){
  const q=R.pick([20,25,30]);
  const Ca=R.int(20,80)*1000, Ra=R.int(10,50)*1000, D=R.int(2,15)*1000;
  const N=R.pick([5,10]), k=R.int(2,12)*100, G=N*k;
  const K=pc(Ca+Ra+D,q)+G;
  const NI=R.int(20,80)*1000, Div=R.int(4,15)*1000;
  const rdn=R.pick([20,25,30]), ru=R.pick([20,25,30]);
  const Ed=R.int(2,10)*1000, Eu=R.int(2,10)*1000;
  const ud=pc(pc(Ed,rdn),q), uu=pc(pc(Eu,ru),q), qNI=pc(NI,q), qDiv=pc(Div,q);
  const pl=qNI-k-ud-uu; if(pl<=0) throw 0;
  const inv=K+qNI-k-qDiv-ud;
  const X=R.int(100,300)*1000+qDiv, NIc=X-qDiv+pl;
  ok(inv===K+pl+uu-qDiv,'inv');
  const data=P(`P社（連結財務諸表作成会社）は，X1年3月31日にA社の発行済株式の${q}％を${Y(K)}千円で取得し，A社を持分法適用関連会社とした。会計期間はいずれも4月1日から3月31日までの1年間である。${NOTE}税効果会計は考慮しない。`)
   +P(`1．X1年3月31日のA社の純資産は資本金${Y(Ca)}千円，利益剰余金${Y(Ra)}千円であった。また，A社の保有する土地の時価が帳簿価額を${Y(D)}千円上回っていた（その他の資産・負債は時価と帳簿価額が一致）。`)
   +P(`2．投資差額（のれん相当額）は${N}年間で定額法により償却する。`)
   +P(`3．X2年3月期のA社の当期純利益は${Y(NI)}千円であり，期中に${Y(Div)}千円の剰余金の配当を行った。`)
   +P(`4．P社は当期よりA社に商品を販売している（売上総利益率${rdn}％）。A社の期末商品のうち${Y(Ed)}千円はP社から仕入れたものである。`)
   +P(`5．A社は当期よりP社に商品を販売している（売上総利益率${ru}％）。P社の期末商品のうち${Y(Eu)}千円はA社から仕入れたものである。`)
   +P(`6．未実現利益の消去は，ダウンストリームの場合は「持分法による投資損益／投資有価証券」，アップストリームの場合は「持分法による投資損益／商品」として処理する。`)
   +P(`7．持分法適用前のX2年3月期の連結損益計算書の当期純利益は${Y(X)}千円であり，A社からの受取配当金が含まれている。`);
  const s1=S('問1　X2年3月期の連結損益計算書に計上される持分法による投資損益（利益）はいくらか。',pl,
    [qNI, qNI-k, qNI-k-ud, qNI-k-uu, qNI-k-pc(Ed,rdn)-pc(Eu,ru), pl-qDiv, qNI-G-ud-uu],
    `A社当期純利益の持分${Y(qNI)}（${Y(NI)}×${q}％）<br>投資差額＝${Y(K)}－（${Y(Ca)}＋${Y(Ra)}＋${Y(D)}）×${q}％＝${Y(G)}，償却額＝${Y(G)}÷${N}＝${Y(k)}<br>ダウンストリーム未実現利益＝${Y(Ed)}×${rdn}％×${q}％＝${Y(ud)}<br>アップストリーム未実現利益＝${Y(Eu)}×${ru}％×${q}％＝${Y(uu)}<br>${Y(qNI)}－${Y(k)}－${Y(ud)}－${Y(uu)}＝<b>${Y(pl)}千円</b>`);
  const s2=S('問2　X2年3月31日の連結貸借対照表に計上されるA社株式（投資有価証券）の金額はいくらか。',inv,
    [inv-uu, inv+qDiv, inv+ud, K+qNI-qDiv, inv+k, K+pl],
    `取得原価${Y(K)}＋持分利益${Y(qNI)}－投資差額償却${Y(k)}－受取配当金${Y(qDiv)}（${Y(Div)}×${q}％）－ダウンストリーム未実現利益${Y(ud)}＝<b>${Y(inv)}千円</b><br>アップストリームの未実現利益は商品から控除するため，投資有価証券は減額しない。`);
  const s3=S('問3　持分法適用後のX2年3月期の連結損益計算書に計上される当期純利益はいくらか。',NIc,
    [X+pl, X-qDiv+qNI, X, X-qDiv+qNI-k, X+pl-qDiv*2],
    `受取配当金は投資有価証券の減額として処理するため消去する。<br>${Y(X)}－受取配当金${Y(qDiv)}＋持分法による投資利益${Y(pl)}＝<b>${Y(NIc)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});

/* ---- 4. 個別決算整理 ---- */
SG({id:'sg-kessan-1',t:'決算整理（残高試算表から当期純利益）',ch:'決算整理',g(R){
  // 貸倒引当金
  const AR=R.int(40,90)*1000, X=R.int(2,8)*100, A0=X+R.int(2,10)*100, rt=2;
  const A1=pc(AR-X,rt), kuri=A1-(A0-X); if(kuri<=0) throw 0;
  // 商品
  const B=R.int(20,50)*1000, Pu=R.int(300,600)*1000, c=R.int(30,60), Qb=R.int(800,1500), Qa=Qb-R.int(10,50), nv=c-R.int(1,5);
  const End=Qb*c, cogs=B+Pu-End, gen=(Qb-Qa)*c, hyo=Qa*(c-nv), bsInv=Qa*nv;
  if(cogs<=0) throw 0;
  // 建物（定額法）
  const L=R.pick([20,25,30,40]), depB=R.int(20,60)*100, Bc=depB*L, Bd=depB*R.int(2,L-5);
  // 備品（定率法）
  const rate=R.pick([20,25]), Ec=R.int(10,40)*1000, Ed=R.int(2,Math.floor(Ec/100*0.6))*100;
  const depE=pc(Ec-Ed,rate);
  const mA=R.pick([10,12,1]), mon=(3-mA+12)%12+1, Nc=R.int(2,10)*1200, depN=pc(Nc,rate)*mon/12;
  ok(isI(depN),'depN');
  const depAll=depB+depE+depN;
  // 有価証券
  const Tc=R.int(50,150)*100; let Tv=Tc+R.int(-20,20)*100; if(Tv===Tc) throw 0;
  const m=R.pick([4,5]), ay=R.int(1,8)*100, F=R.int(10,50)*1000, H=F-m*ay, cr=R.pick([1,2]), cpn=pc(F,cr);
  // 経過勘定
  const pm=R.pick([8,9,10,11,12,1]), used=(3-pm+12)%12+1, P12=R.int(3,20)*1200, prep=P12*(12-used)/12;
  const Sal=R.int(40,90)*1000, ua=R.int(2,8)*100, O=R.int(20,60)*1000;
  const exp=cogs+gen+hyo+kuri+depAll+Sal+ua+(P12-prep)+O;
  const Sales=Math.round((exp+R.int(20,80)*1000-cpn-ay-(Tv-Tc))/1000)*1000;
  const NI=Sales+cpn+ay+(Tv-Tc)-exp; if(NI<=0) throw 0;
  const tb=[['現金預金',R.int(30,90)*1000,''],['売掛金',AR,''],['繰越商品',B,''],['売買目的有価証券',Tc,''],['満期保有目的債券',H,''],['建物',Bc,''],['備品',Ec+Nc,''],
    ['貸倒引当金','',A0],['建物減価償却累計額','',Bd],['備品減価償却累計額','',Ed],['売上','',Sales],['有価証券利息','',cpn],
    ['仕入',Pu,''],['給料',Sal,''],['支払保険料',P12,''],['その他の費用',O,'']];
  const data=P(`当社の当期（X1年4月1日～X2年3月31日）の決算整理前残高試算表（一部）および決算整理事項は次のとおりである。${NOTE}法人税等および税効果会計は考慮しない。`)
   +tbl(tb,['勘定科目','借方','貸方'])
   +P(`1．売掛金のうち${Y(X)}千円は前期に発生した得意先に対するものであり，当期中に回収不能となったが未処理である。売掛金の期末残高に対して${rt}％の貸倒引当金を差額補充法により設定する。`)
   +P(`2．期末商品の帳簿棚卸数量は${Qb}個，実地棚卸数量は${Qa}個，取得原価は@${c}千円，正味売却価額は@${nv}千円である。棚卸減耗損および商品評価損は売上原価に含めず独立の費用として表示する。`)
   +P(`3．建物は耐用年数${L}年，残存価額ゼロの定額法により償却する。備品は償却率${rate/100}の定率法により償却する。備品のうち${Y(Nc)}千円はX${mA>=4?1:2}年${mA}月1日に取得し使用を開始したもので（期中取得分は月割計算），残高試算表の備品減価償却累計額はすべて取得済みの既存備品にかかるものである。`)
   +P(`4．売買目的有価証券の期末時価は${Y(Tv)}千円である。満期保有目的債券は当期首に額面${Y(F)}千円の社債（満期まで${m}年，クーポン年${cr}％，利払日3月31日）を${Y(H)}千円で取得したものであり，取得差額は金利調整差額と認められるため償却原価法（定額法）を適用する。当期の利息は受取済みで適正に処理されている。`)
   +P(`5．支払保険料はX${pm>=4?1:2}年${pm}月1日に1年分を支払ったものである。給料の未払額が${Y(ua)}千円ある。`);
  const s1=S('問1　当期純利益はいくらか。',NI,
    [NI+ay, NI+depE-pc(Ec,rate), NI+depN-pc(Nc,rate), NI-prep, NI+kuri-(pc(AR,rt)-A0), NI+hyo, NI+ua],
    `収益：売上${Y(Sales)}＋有価証券利息${Y(cpn+ay)}（クーポン${Y(cpn)}＋償却額${Y(ay)}）${Tv>Tc?'＋':'－'}有価証券評価${Tv>Tc?'益':'損'}${Y(Math.abs(Tv-Tc))}<br>売上原価＝${Y(B)}＋${Y(Pu)}－${Y(End)}＝${Y(cogs)}，棚卸減耗損${Y(gen)}，商品評価損${Y(hyo)}<br>貸倒引当金繰入＝（${Y(AR)}－${Y(X)}）×${rt}％－（${Y(A0)}－${Y(X)}）＝${Y(kuri)}<br>減価償却費${Y(depAll)}，給料${Y(Sal+ua)}，保険料${Y(P12-prep)}（前払${Y(prep)}），その他${Y(O)}<br>当期純利益＝<b>${Y(NI)}千円</b>`);
  const s2= R.chance(0.5)
   ? S('問2　期末の貸借対照表に計上される商品の金額はいくらか。',bsInv,
      [End, Qa*c, Qb*nv, End-gen, End-hyo],
      `実地数量${Qa}個×正味売却価額@${nv}＝<b>${Y(bsInv)}千円</b>`)
   : S('問2　期末の貸借対照表に計上される満期保有目的債券（投資有価証券）の金額はいくらか。',H+ay,
      [H, F, F-ay, H+2*ay, H+ay*m],
      `取得差額${Y(F-H)}を${m}年で定額償却：${Y(F-H)}÷${m}＝${Y(ay)}<br>${Y(H)}＋${Y(ay)}＝<b>${Y(H+ay)}千円</b>`);
  const s3=S('問3　当期の減価償却費（建物および備品の合計）はいくらか。',depAll,
    [depB+pc(Ec,rate)+depN, depB+depE+pc(Nc,rate), depB+pc(Ec+Nc-Ed,rate), depB+pc(Ec,rate)+pc(Nc,rate), depE+depN, depB+depE],
    `建物：${Y(Bc)}÷${L}年＝${Y(depB)}<br>既存備品：（${Y(Ec)}－${Y(Ed)}）×${rate/100}＝${Y(depE)}<br>新規備品：${Y(Nc)}×${rate/100}×${mon}/12＝${Y(depN)}<br>合計＝<b>${Y(depAll)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});

/* ---- 5. 税効果会計＋包括利益 ---- */
SG({id:'sg-zeikouka-1',t:'税効果会計と包括利益',ch:'税効果会計',g(R){
  const t=30, t7=70;
  const a0=R.int(10,60)*100, a1=R.int(10,60)*100, d0=R.int(10,80)*100, d1=R.int(10,80)*100;
  const dlt=(a1+d1)-(a0+d0); if(dlt===0) throw 0;
  const C=R.int(20,60)*1000, V0=C+R.int(-30,30)*100, V1=V0+R.int(5,40)*100; if(V1===C) throw 0;
  const ent=R.int(5,30)*100, PBT=R.int(80,200)*1000;
  const taxable=PBT+ent+dlt, Tx=pc(taxable,t), adj=pc(dlt,t);   // adj>0: 貸方（費用の減少）
  const NI=PBT-Tx+adj;
  ok(NI===PBT-pc(PBT+ent,t),'NI5');
  const secDTA=V1<C?pc(C-V1,t):0;
  const dta=pc(a1+d1,t)+secDTA;
  const oci=pc(V1-V0,t7), ci=NI+oci;
  const data=P(`当社の当期（X1年4月1日～X2年3月31日）に関する資料は次のとおりである。${NOTE}法定実効税率は${t}％とし，繰延税金資産の回収可能性に問題はないものとする。`)
   +P('1．将来減算一時差異の残高')+tbl([['貸倒引当金繰入限度超過額',a0,a1],['減価償却限度超過額',d0,d1]],['項目','期首','期末'])
   +P(`2．当期の税引前当期純利益は${Y(PBT)}千円である。このほか，交際費の損金不算入額が${Y(ent)}千円ある（永久差異）。当期の課税所得に基づく「法人税，住民税及び事業税」は${Y(Tx)}千円である。`)
   +P(`3．当社は前期よりその他有価証券（取得原価${Y(C)}千円）を保有しており，前期末の時価は${Y(V0)}千円，当期末の時価は${Y(V1)}千円である。全部純資産直入法を採用し，評価差額には税効果会計を適用する。評価差額は毎期洗替処理する。`)
   +P('4．当期の包括利益計算書において，その他の包括利益はその他有価証券評価差額金のみである（組替調整額はない）。');
  const s1=S('問1　当期末の繰延税金資産の金額（繰延税金負債と相殺する前の金額）はいくらか。',dta,
    [pc(a1+d1,t), pc(a1+d1+ent,t)+secDTA, pc(a1+d1,t7)+(V1<C?pc(C-V1,t7):0), Math.abs(adj), pc(a1+d1,t)+pc(Math.abs(V1-C),t)+(V1<C?pc(C-V1,t):0), pc(a0+d0,t)+secDTA],
    `貸倒引当金${Y(a1)}＋減価償却${Y(d1)}${V1<C?`＋その他有価証券評価差損${Y(C-V1)}`:''}＝${Y(a1+d1+(V1<C?C-V1:0))}<br>×${t}％＝<b>${Y(dta)}千円</b>${V1<C?'':'<br>その他有価証券は評価差益のため繰延税金負債となり，繰延税金資産には含まれない。'}<br>交際費は永久差異のため税効果の対象外。`);
  const s2= R.chance(0.5)&&adj>0
   ? S('問2　当期の損益計算書に計上される法人税等調整額（貸方）はいくらか。',adj,
      [pc(a1+d1,t), pc(dlt+ent,t), pc(dlt,t7), pc(dlt+V1-V0,t), pc(a1-a0,t), pc(d1-d0,t)],
      `一時差異の増加額＝（${Y(a1)}＋${Y(d1)}）－（${Y(a0)}＋${Y(d0)}）＝${Y(dlt)}<br>${Y(dlt)}×${t}％＝<b>${Y(adj)}千円</b>（貸方）<br>その他有価証券の評価差額にかかる税効果は評価差額金から直接控除され，法人税等調整額には含めない。`)
   : S('問2　当期の損益計算書に計上される当期純利益はいくらか。',NI,
      [PBT-Tx, PBT-Tx-adj, pc(PBT,t7), PBT-Tx+adj+ent, NI+pc(V1-V0,t)],
      `税引前当期純利益${Y(PBT)}－法人税等${Y(Tx)}${adj>=0?'＋':'－'}法人税等調整額${Y(Math.abs(adj))}＝<b>${Y(NI)}千円</b><br>（検算：${Y(PBT)}－（${Y(PBT)}＋交際費${Y(ent)}）×${t}％＝${Y(NI)}）`);
  const s3= R.chance(0.5)
   ? S('問3　当期の包括利益計算書に計上されるその他の包括利益はいくらか。',oci,
      [V1-V0, pc(V1-V0,t), Math.abs(V1-C)>0?pc(Math.abs(V1-C),t7):0, V1-C>0?V1-C:0, NI+oci],
      `当期末評価差額${Y(V1-C)}－前期末評価差額${Y(V0-C)}＝増加額${Y(V1-V0)}<br>税効果控除後：${Y(V1-V0)}×（1－${t}％）＝<b>${Y(oci)}千円</b>`)
   : S('問3　当期の包括利益計算書に計上される包括利益はいくらか。',ci,
      [NI+(V1-V0), NI, NI+(V1>C?pc(V1-C,t7):0), PBT-Tx+oci, NI+pc(V1-V0,t), pc(PBT,t7)+oci, NI-adj+oci],
      `当期純利益${Y(NI)}＋その他の包括利益${Y(oci)}（（${Y(V1)}－${Y(V0)}）×${t7}％）＝<b>${Y(ci)}千円</b>`);
  return {data,subs:[s1,s2,s3]};
}});
})();

/* ---- 出題の組立て ---- */
function xDraw(fields,kind,n){
  const pool=BANK.filter(i=>fields.includes(i.f)&&i.kind===kind); if(!pool.length) return [];
  const out=[]; let list=R.shuffle(pool);
  while(out.length<n){ if(!list.length) list=R.shuffle(pool); out.push(list.shift()); }
  return out;
}
function xTheory(fields,n){ return xDraw(fields,'theory',n).map(it=>{ const q=buildTheory(it); return {kind:'theory',id:it.id,ch:it.ch,r:it.r,f:it.f,topic:it.t,html:q.html,choices:q.choices,correct:q.correct,ex:q.ex}; }); }
function xCalc(fields,n){ return xDraw(fields,'calc',n).map(it=>{ const q=buildCalc(it); return {kind:'calc',id:it.id,ch:it.ch,r:it.r,f:it.f,topic:it.t,html:q.html,choices:q.choices,correct:q.correct,ex:q.ex}; }); }
function xSogo(n){
  const out=[]; const picks=R.pickN(SOGO,Math.min(n,SOGO.length));
  picks.forEach((d,g)=>{
    for(let t=0;t<60;t++){
      let o; try{ o=d.g(R); }catch(e){ if(e!==0) console.error(d.id,e); continue; }
      try{ const qs=o.subs.map((s,k)=>{ const q=buildCalc({id:d.id+'-'+k,g:()=>s}); return {kind:'calc',id:'sogo:'+d.id,ch:'総合問題（'+d.t.replace(/（.*$/,'')+'）',r:'A',f:'fa-c',topic:d.t,html:String(q.html).replace(/^(<p>)?\s*問\s*[0-9０-９]+\s*/,'$1'),choices:q.choices,correct:q.correct,ex:q.ex,sogo:{g,t:d.t,data:o.data,k}}; });
        out.push(...qs); return; }catch(e){ continue; }
    }
  });
  return out;
}
function xPts(qs,total){
  const n=qs.length, base=Math.floor(total/n); let rem=total-base*n;
  qs.forEach(q=>q.pts=base);
  for(const q of qs.filter(q=>q.kind==='calc').concat(qs.filter(q=>q.kind!=='calc'))){ if(rem<=0) break; q.pts++; rem--; }
  qs.forEach((q,i)=>q.no=i+1); return qs;
}

/* ---- 合格可能性（推定） ---- */
const logi=x=>1/(1+Math.exp(-x));
function xJudge(type,subs){
  const tot=subs.reduce((a,s)=>a+s.score,0), max=subs.reduce((a,s)=>a+s.max,0), ratio=max?tot/max:0;
  const cut=subs.some(s=>s.score<s.max*0.4);
  let p= type==='tanto' ? logi((ratio-0.70)/0.025) : logi((ratio-0.52)/0.03);
  if(cut) p=Math.min(p, type==='tanto'?0.02:0.05);
  p=Math.max(0.01,Math.min(0.99,p));
  const rank= p>=0.8?'A':p>=0.6?'B':p>=0.4?'C':p>=0.2?'D':'E';
  const label={A:'合格圏',B:'合格有望',C:'ボーダー付近',D:'もう一歩',E:'要努力'}[rank];
  return {tot:Math.round(tot*10)/10,max,ratio,cut,p,rank,label};
}


/* ---- 短答式の弱点分析 ---- */
const RW={A:3,B:2,C:1};
function xRefLine(id){ const r=id&&typeof pageRef==='function'?pageRef(String(id)):null; return r?`<p class="xref">テキスト参照：${esc(r.text)}</p>`:''; }
function xAnalyze(S,details){
  const subjects=[], review=[];
  for(const d of (details||[])){
    const items=(d.items||[]).filter(it=>it.ch!==undefined); if(!items.length) continue;
    const s=S.subs.find(x=>x.id===d.id)||{};
    const byKind={calc:[0,0],theory:[0,0],sogo:[0,0]}, chs={}; let blank=0;
    items.forEach(it=>{ const ok=it.mark===it.correct; if(it.mark===null||it.mark===undefined) blank++;
      const k=it.sogo?'sogo':it.kind; if(byKind[k]){ byKind[k][0]+=ok?1:0; byKind[k][1]++; }
      const key=String(it.ch||'その他').replace(/\s+/g,' ').trim();
      const c=chs[key]||(chs[key]={ch:key,n:0,ok:0}); c.n++; if(ok) c.ok++; });
    Object.values(chs).forEach(c=>{ let n=0,k=0; BANK.forEach(b=>{ if(b.ch===c.ch){ const st=Store.data.stats[b.id]; if(st){ n+=st.n; k+=st.c; } } }); c.hist=n?k/n:null; c.rate=c.ok/c.n; });
    const list=Object.values(chs).sort((a,b)=>(a.rate-b.rate)||(b.n-a.n));
    subjects.push({id:d.id,name:d.name,score:s.score,max:s.max,byKind,chs:list,blank,timeUp:s.timeUp});
    items.filter(it=>it.mark!==it.correct).forEach(it=>{ const st=it.h?{n:it.h[0],c:it.h[1]}:null; const hr=st&&st.n?st.c/st.n:null;
      review.push({subj:d.name,id:it.id,topic:it.topic,ch:it.ch,r:it.r||'B',no:it.no,hr,hn:st?st.n:0,blank:it.mark===null||it.mark===undefined,
        pri:(RW[it.r]||2)*(1+(hr===null?0.3:1-hr))*(it.pts||5)/5}); });
  }
  review.sort((a,b)=>(b.pri-a.pri)||((b.blank?1:0)-(a.blank?1:0)));
  const notes=[]; const line=S.max*0.7;
  notes.push(S.tot>=line?`合格ラインの目安（総点の70%＝${Math.round(line)}点）を${Math.round(S.tot-line)}点上回っています。取りこぼしを減らして得点を安定させましょう。`:`合格ラインの目安（総点の70%＝${Math.round(line)}点）まで，あと${Math.ceil(line-S.tot)}点です。`);
  const KN={calc:'計算',theory:'理論',sogo:'総合問題'};
  subjects.forEach(x=>{
    const pr=v=>Math.round(v[0]/v[1]*100)+'%';
    const parts=['calc','theory','sogo'].filter(k=>x.byKind[k][1]).map(k=>`${KN[k]} ${pr(x.byKind[k])}（${x.byKind[k][0]}/${x.byKind[k][1]}）`);
    let t=`${x.name}：${parts.join('・')}。`;
    if(x.max&&x.score<x.max*0.4) t+='40%未満で足切りのおそれがあり，最優先で立て直しが必要です。';
    const ks=['calc','theory','sogo'].filter(k=>x.byKind[k][1]>=3).map(k=>[k,x.byKind[k][0]/x.byKind[k][1]]).sort((a,b)=>a[1]-b[1]);
    if(ks.length>=2 && ks[1][1]-ks[0][1]>=0.2) t+=`${KN[ks[0][0]]}の失点が目立ちます。`;
    const weak=x.chs.filter(c=>c.rate<0.5).slice(0,3).map(c=>c.ch.replace(/^(第\s*\d+\s*章[ⅠⅡ]*\s*[〜～]?\s*)+/,'').slice(0,20));
    if(weak.length) t+=`弱い論点：${weak.join('／')}。`;
    if(x.blank) t+=`未解答が${x.blank}問あります${x.timeUp?'（時間切れ）。解く順番と時間配分を見直しましょう':''}。`;
    else if(x.timeUp) t+='時間切れでした。時間配分を見直しましょう。';
    notes.push(t);
  });
  return {subjects,review:review.slice(0,12),notes};
}

/* ---- 論文式の採点（Claude，使えない環境ではキーワード照合） ---- */
const nrm=s=>String(s||'').replace(/[\s,，、。．.・「」（）()：:]/g,'');
function kwScore(sub,ans){
  const a=nrm(ans); if(a.length<15) return {score:0,fb:'記述が不足しているため採点対象外です。'};
  const hits=sub.kw.filter(k=>a.includes(nrm(k))); const need=Math.max(1,Math.ceil(sub.kw.length*0.7));
  const sc=Math.round(sub.pts*Math.min(1,hits.length/need)*2)/2;
  return {score:sc,fb:`キーワード照合による簡易採点（${hits.length}/${sub.kw.length}語）。`};
}
function rbPrompt(subjName,b,answers){
  const lead=plain(b.q).slice(0,2800);
  const parts=b.subs.map((s,j)=>`【設問${j+1}】（配点${s.pts}点）${plain(s.q)}\n［模範解答］${s.model}\n［採点キーワード］${s.kw.join('／')}\n［受験生答案］${(answers[j]||'').trim()||'（空欄）'}`).join('\n\n');
  return `あなたは公認会計士試験 論文式試験「${subjName}」の採点委員です。次の大問について，設問ごとに受験生答案を模範解答と照らして採点してください。
【採点基準】計算は最終数値と主要な計算過程，理論は論点の指摘・根拠・結論が模範解答と同じ趣旨かを評価し，表現の違いは許容する。空欄や設問と無関係な記述は0点。部分点は配点の範囲内で0.5点刻みで与える。
【問題文】${lead}

${parts}

次のJSONだけを返してください：{"scores":[{"score":数値,"feedback":"日本語100字以内（良い点と不足点）"}]}（scoresは設問の数${b.subs.length}個，設問順）`;
}
async function gradeRBBlock(subjName,b,answers){
  const blank=answers.every(a=>!nrm(a));
  if(blank) return b.subs.map(()=>({score:0,fb:'空欄',mode:'blank'}));
  if(AI.state==='ready'){
    try{ const r=await AI.fn.json(rbPrompt(subjName,b,answers),{modelTier:'default'});
      const arr=r&&Array.isArray(r.scores)?r.scores:null;
      if(arr&&arr.length>=b.subs.length) return b.subs.map((s,j)=>{ let v=Number(arr[j]&&arr[j].score); if(!isFinite(v)) v=0; v=Math.max(0,Math.min(s.pts,Math.round(v*2)/2)); if(!nrm(answers[j])) v=0; return {score:v,fb:String(arr[j].feedback||''),mode:'ai'}; });
    }catch(e){ if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e&&e.code)) AI.state='off'; }
  }
  return b.subs.map((s,j)=>({...kwScore(s,answers[j]),mode:'kw'}));
}

/* ---- 結果の保管（アカウント／端末） ---- */
const Vault={
  enc:new TextEncoder(),
  async put(key,items){
    try{ localStorage.setItem('cpa-x:'+key,JSON.stringify(items)); }catch(e){}
    if(!Store.db||!Store.uid) return;
    const chunks=[]; let cur=[], size=0;
    for(const it of items){ const b=this.enc.encode(JSON.stringify(it)).length; if(cur.length&&size+b>190000){ chunks.push(cur); cur=[]; size=0; } cur.push(it); size+=b; }
    chunks.push(cur);
    for(let i=0;i<chunks.length;i++){ try{ await Store.db.doc(`data/users/${Store.uid}/x_${key}_${i}`).set({i,n:chunks.length,items:chunks[i]}); }catch(e){} }
  },
  async get(key){
    if(Store.db&&Store.uid){ try{ const s0=await Store.db.doc(`data/users/${Store.uid}/x_${key}_0`).get();
      if(s0.exists){ const d0=s0.data(); let items=d0.items||[]; for(let i=1;i<(d0.n||1);i++){ const s=await Store.db.doc(`data/users/${Store.uid}/x_${key}_${i}`).get(); if(s.exists) items=items.concat(s.data().items||[]); } return items; } }catch(e){} }
    try{ const s=localStorage.getItem('cpa-x:'+key); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async drop(key){ try{ localStorage.removeItem('cpa-x:'+key); }catch(e){} if(Store.db&&Store.uid){ for(let i=0;i<4;i++){ try{ await Store.db.doc(`data/users/${Store.uid}/x_${key}_${i}`).delete(); }catch(e){} } } },
};

const fmtT=ms=>{ ms=Math.max(0,ms); const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(x).padStart(2,'0'); };
const fmtD=t=>{ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };

const Exam={

  running(){ return !!(this.X&&(this.X.phase==='run'||this.X.phase==='grading')); },

  /* --- ホーム画面のカード --- */
  homeCard(){
    const rb=Store.data.ronbun; const done=rb?rb.done:[false,false,false]; const next=done.indexOf(false);
    const hist=(Store.data.exams||[]).slice().reverse().slice(0,8);

      <div class="row"><button class="btn pri" data-act="x-start-tanto">短答式を受ける</button></div></div>`;

    return h+'</section><hr class="xsep">';
  },

  /* --- 開始・進行 --- */
  startTanto(){ this.X={type:'tanto',id:'T'+Date.now(),date:Date.now(),subs:TANTO.map(s=>({id:s.id,name:s.name,min:s.min,pts:s.pts,spec:s.spec})),cur:0,qi:0,phase:'intro',modal:null}; App.go('exam'); },
  startRonbun(){
    let rb=Store.data.ronbun; if(!rb){ rb=Store.data.ronbun={id:'R'+Date.now(),created:Date.now(),done:[false,false,false],res:{}}; Store.save(); }
    const k=rb.done.indexOf(false); if(k<0) return;

  },
  begin(){
    const X=this.X, s=this.sub();
    if(X.type==='tanto'){ s.qs=xPts(TANTO.find(t=>t.id===s.id).build(),s.pts); s.marks=s.qs.map(()=>null); s.flags=s.qs.map(()=>false); }
    else { s.blocks=xRonbunBuild(s.id); s.ans=s.blocks.map(b=>b.subs.map(()=>'')); }
    s.start=Date.now(); s.deadline=s.start+s.min*60000; X.qi=0; X.phase='run'; X.modal=null;
    this.startTimer(); App.go('exam');
  },
  startTimer(){ this.stopTimer(); this.timer=setInterval(()=>this.tick(),500); this.tick(); },
  stopTimer(){ if(this.timer) clearInterval(this.timer); this.timer=null; },
  tick(){
    const s=this.sub(); if(!s||this.X.phase!=='run'){ this.stopTimer(); return; }
    const left=s.deadline-Date.now(); const el=document.getElementById('xtimer');
    if(el){ el.textContent=fmtT(left); el.classList.toggle('low',left<5*60000); }
    if(left<=0) this.endSubject(true);
  },
  endSubject(timeUp){
    const X=this.X, s=this.sub(); this.stopTimer(); this.pullDraft();
    s.end=Math.min(Date.now(),s.deadline); s.timeUp=!!timeUp; X.modal=null;
    X.cur++;
    if(X.cur<X.subs.length){ X.phase='break'; X.lastTimeUp=!!timeUp; App.go('exam'); }
    else this.finish(timeUp);
  },
  pullDraft(){ document.querySelectorAll('textarea[data-xa]').forEach(t=>{ const [b,j]=t.dataset.xa.split(',').map(Number); const s=this.sub(); if(s&&s.ans) s.ans[b][j]=t.value; }); },
  quit(){ this.stopTimer(); this.X=null; document.body.classList.remove('in-exam'); App.go('home'); this.toast('模擬試験を中断しました。結果は保存されていません。'); },

  /* --- 終了・採点 --- */
  async finish(timeUp){
    const X=this.X; X.lastTimeUp=!!timeUp;
    if(X.type==='tanto'){
      const subs=X.subs.map(s=>{ let sc=0,ok=0; s.qs.forEach((q,i)=>{ if(s.marks[i]===q.correct){sc+=q.pts;ok++;} }); return {id:s.id,name:s.name,score:sc,max:s.pts,ok,n:s.qs.length,used:s.end-s.start,timeUp:s.timeUp}; });
      const j=xJudge('tanto',subs);
      const details=X.subs.map(s=>({id:s.id,name:s.name,items:s.qs.map((q,i)=>({no:q.no,pts:q.pts,kind:q.kind,topic:q.topic,id:q.id,ch:q.ch,r:q.r,f:q.f,sogo:!!q.sogo,h:(q.id&&Store.data.stats[q.id])?[Store.data.stats[q.id].n,Store.data.stats[q.id].c]:null,mark:s.marks[i],correct:q.correct,choices:q.choices,...(s.marks[i]===q.correct?{}:{html:q.html,ex:q.ex,data:q.sogo?q.sogo.data:null})}))}));
      X.subs.forEach(s=>s.qs.forEach((q,i)=>{ if(q.id&&BYID[q.id]) Store.rec(q.id,s.marks[i]===q.correct); }));
      const sum={id:X.id,type:'tanto',date:X.date,subs,...j};
      X.phase='result'; X.summary=sum; X.details=details; document.body.classList.remove('in-exam'); App.go('exam');
      this.saveHistory(sum,details);
      return;
    }
    // 論文式：この回の2科目を採点して保存（結果の表示は6科目終了後）
    X.phase='grading'; X.gradeDone=0; X.gradeAll=X.subs.reduce((a,s)=>a+s.blocks.length,0); App.go('exam');
    const rb=Store.data.ronbun;
    for(const s of X.subs){
      const res=await this.pool(s.blocks.map((b,k)=>async()=>{ const g=await gradeRBBlock(s.name.replace(/.*（|）/g,''),b,s.ans[k]); X.gradeDone++; const el=document.getElementById('xgp'); if(el) el.textContent=`${X.gradeDone} / ${X.gradeAll}`; return g; }),3);
      const blocks=s.blocks.map((b,k)=>({...b,ans:s.ans[k],grades:res[k]}));
      const got=blocks.reduce((a,b)=>a+b.grades.reduce((x,g)=>x+g.score,0),0), full=blocks.reduce((a,b)=>a+b.subs.reduce((x,t)=>x+t.pts,0),0);
      const mode=blocks.some(b=>b.grades.some(g=>g.mode==='ai'))?'ai':'kw';
      rb.res[s.id]={name:s.name,w:s.w,got,full,pct:full?got/full*100:0,used:s.end-s.start,timeUp:s.timeUp,mode,date:Date.now()};
      await Vault.put(`${rb.id}_${s.id}`,blocks);
    }
    rb.done[X.sit]=true; Store.save();
    if(rb.done.every(Boolean)){
      const subs=RONBUN.flat().map(t=>{ const r=rb.res[t.id]||{pct:0,name:t.name,w:t.w}; return {id:t.id,name:r.name||t.name,score:Math.round(r.pct*t.w/100*10)/10,max:t.w,pct:r.pct,used:r.used,timeUp:r.timeUp,mode:r.mode}; });
      const j=xJudge('ronbun',subs); const sum={id:rb.id,type:'ronbun',date:Date.now(),subs,...j};
      const details=[]; for(const t of RONBUN.flat()){ details.push({id:t.id,name:t.name,blocks:await Vault.get(`${rb.id}_${t.id}`)||[]}); }
      Store.data.ronbun=null; X.phase='result'; X.summary=sum; X.details=details; document.body.classList.remove('in-exam'); App.go('exam');
      this.saveHistory(sum,null);
    } else { X.phase='sitdone'; document.body.classList.remove('in-exam'); App.go('exam'); }
  },
  async pool(tasks,n){ const out=new Array(tasks.length); let i=0; const run=async()=>{ while(i<tasks.length){ const k=i++; out[k]=await tasks[k](); } }; await Promise.all(Array.from({length:Math.min(n,tasks.length)},run)); return out; },
  async saveHistory(sum,details){
    const d=Store.data; d.exams=d.exams||[]; d.exams.push(sum);
    while(d.exams.length>30){ const old=d.exams.shift(); (old.subs||[]).forEach(s=>Vault.drop(`${old.id}_${s.id}`)); }
    Store.save();
    if(details) for(const s of details){ await Vault.put(`${sum.id}_${s.id}`,s.items); }
  },
  async openHist(id){
    const sum=(Store.data.exams||[]).find(e=>e.id===id); if(!sum) return;
    this.X={phase:'result',summary:sum,details:null,hist:true}; App.go('exam');
    const details=[]; for(const s of sum.subs){ const v=await Vault.get(`${sum.id}_${s.id}`); details.push(sum.type==='tanto'?{id:s.id,name:s.name,items:v||[]}:{id:s.id,name:s.name,blocks:v||[]}); }
    if(this.X&&this.X.summary===sum){ this.X.details=details; App.render(); }
  },

  /* --- 描画 --- */
  render(){
    const X=this.X; if(!X) return '<div class="empty">模擬試験は開始されていません。<div style="margin-top:12px"><button class="btn" data-act="home">戻る</button></div></div>';

    if(X.phase==='grading') return `<div class="xwait"><div class="xk">論文式 第${X.sit+1}回</div><h2>答案を採点して保存しています</h2><p class="lead">画面を閉じずにお待ちください（<span id="xgp">${X.gradeDone} / ${X.gradeAll}</span>）。点数は6科目すべて終わってから表示します。</p><div class="xspin"></div></div>`;
    if(X.phase==='sitdone'){ const rb=Store.data.ronbun; const k=rb?rb.done.indexOf(false):-1;
      return `<div class="xwait"><div class="xk">論文式</div><h2>第${X.sit+1}回（${X.subs.map(s=>s.name).join('・')}）を保存しました</h2><p class="lead">${X.lastTimeUp?'制限時間になったため答案を回収しました。':''}答案は保存済みです。6科目すべて終わった時点で採点結果と合格可能性を表示します。</p>
      <ol class="xsched">${RONBUN.map((p,i)=>`<li class="${rb&&rb.done[i]?'done':''}"><b>第${i+1}回</b><span>${p.map(s=>s.name).join('・')}</span>${rb&&rb.done[i]?'<em>済</em>':''}</li>`).join('')}</ol>
      <div class="row">${k>=0?`<button class="btn pri" data-act="x-start-ronbun">続けて第${k+1}回を受ける</button>`:''}<button class="btn" data-act="x-home">ホームへ</button></div></div>`; }
    if(X.phase==='result') return this.vResult();
    return '';
  },
  vIntro(typ){
    const X=this.X;
    const rules= X.type==='tanto'
      ? ['科目は 企業法 → 管理会計論 → 監査論 → 財務会計論 の順で，本試験と同じ制限時間です。','制限時間になると，その科目は自動的に終了し（未解答は0点），次の科目に進みます。科目の間は休憩できます。','解答中は正誤を表示しません。4科目がすべて終わってから答え合わせをし，合格可能性を判定します。','途中で中断・画面を閉じた場合は最初からやり直しとなり，結果は保存されません。','各科目の問題冊子・マークシートは解答中に印刷できます。']
      : [`第${X.sit+1}回は ${X.subs.map(s=>s.name).join(' → ')} の順で，各${RB_MIN}分です。`,'各科目 大問3〜4問の記述式です（経営学は 第1問 経営管理・第2問 財務管理 の2問）。計算問題は計算過程も書いてください。','制限時間になると自動的に答案を回収し，次の科目に進みます。','途中で中断・画面を閉じた場合，この回は最初からやり直しとなり保存されません（終了済みの回の答案は保存されています）。','採点結果と合格可能性は，6科目すべて終わった時点で表示します。'];

      <table class="d xtbl"><tr><th>順</th><th>科目</th><th>出題</th><th>時間</th></tr>${X.subs.map((s,i)=>`<tr><td>${XNUM[i]}</td><td>${s.name}</td><td>${s.spec}</td><td class="r">${s.min}分</td></tr>`).join('')}</table>

  vBreak(typ){

      <ol class="xsched">${X.subs.map((t,i)=>`<li class="${i<X.cur?'done':i===X.cur?'now':''}"><b>${XNUM[i]} ${t.name}</b><span>${t.spec}・${t.min}分</span>${i<X.cur?'<em>済</em>':''}</li>`).join('')}</ol>
      <div class="row"><button class="btn pri" data-act="x-begin">${s.name}を開始する（${s.min}分）</button><button class="btn ghost" data-act="x-quit">中断する</button></div></div>`;
  },
  bar(title){
    const s=this.sub();
    return `<div class="xbar"><div class="xti"><span class="xk">${this.X.type==='tanto'?'短答式':'論文式'}　${XNUM[this.X.cur]}</span><b>${s.name}</b></div><div class="xtime" id="xtimer" role="timer" aria-label="残り時間">${fmtT(s.deadline-Date.now())}</div>
      <div class="xacts"><button class="btn" data-act="x-print" data-what="book">問題<span class="xl">冊子を</span>印刷</button><button class="btn" data-act="x-print" data-what="sheet">答案<span class="xl">用紙を</span>印刷</button><button class="btn pri" data-act="x-submit">解答<span class="xl">を</span>終了</button><button class="btn ghost" data-act="x-quit">中断</button></div></div>`;
  },
  vTanto(){
    const X=this.X, s=this.sub(), q=s.qs[X.qi], m=s.marks[X.qi];
    let data='';
    if(q.sogo){ const grp=s.qs.filter(x=>x.sogo&&x.sogo.g===q.sogo.g); data=`<div class="sogo"><div class="sogo-h">問題${grp[0].no}から問題${grp[grp.length-1].no}までは，次の〔資料〕に基づいて解答しなさい。</div>${q.sogo.data}</div>`; }
