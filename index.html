<!doctype html>
<html lang="ja" data-skin="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E131D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="短答演習">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>会計士 短答マーク演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap">
<style>
:root{
  --paper:#F7F7F2; --sheet:#FFFFFF; --ink:#1E2629; --ink2:#4A5559; --ink3:#7C878B;
  --line:#E4DCD3; --guide:#D0694F; --guide-soft:#F6E3DC; --guide-ink:#A9452E;
  --pencil:#2F3437; --ok:#2E7D5B; --ok-soft:#E1F1E8; --ng:#B0263A; --ng-soft:#F8E1E4;
  --warn:#9A6B00; --chip:#EFEDE6; --focus:#2F6FB0;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15191B; --sheet:#1D2326; --ink:#E9ECEA; --ink2:#B8C0C2; --ink3:#89949A;
  --line:#343C40; --guide:#E08367; --guide-soft:#3A2822; --guide-ink:#F0A48C;
  --pencil:#E9ECEA; --ok:#5FC08F; --ok-soft:#1F3A2D; --ng:#F07A8A; --ng-soft:#43242A;
  --warn:#E0B24A; --chip:#262D30; --focus:#7FB2E8; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#15191B; --sheet:#1D2326; --ink:#E9ECEA; --ink2:#B8C0C2; --ink3:#89949A;
  --line:#343C40; --guide:#E08367; --guide-soft:#3A2822; --guide-ink:#F0A48C;
  --pencil:#E9ECEA; --ok:#5FC08F; --ok-soft:#1F3A2D; --ng:#F07A8A; --ng-soft:#43242A;
  --warn:#E0B24A; --chip:#262D30; --focus:#7FB2E8; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-disp);font-weight:900;text-wrap:balance;margin:0;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-family:var(--f-disp);font-weight:900;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{display:inline-block;width:14px;height:22px;border:2px solid var(--guide);border-radius:50%;position:relative}
.brand i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--pencil)}
.bar .sp{flex:1}
.sync{font-size:12px;color:var(--ink3)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;font-size:14px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.btn.pri:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:default}
/* home */
.lead{color:var(--ink2);font-size:14px;margin:6px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0 28px;padding:14px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.opt label{display:block;font-size:12px;color:var(--ink3);letter-spacing:.06em;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.subj{margin-bottom:26px}
.subj-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.subj-h h2{font-size:21px}
.subj-h .meta{font-size:12px;color:var(--ink3)}
.fields{display:grid;gap:8px}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.field .nm{font-weight:700}
.field .st{font-size:12px;color:var(--ink3);display:flex;gap:12px;flex-wrap:wrap}
.field .acts{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meter{height:4px;border-radius:2px;background:var(--chip);grid-column:1 / -1;overflow:hidden}
.meter b{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;background:var(--chip);color:var(--ink2);letter-spacing:.04em;line-height:1.8}
.tag.a{background:var(--guide-soft);color:var(--guide-ink);font-weight:700}
.tag.adv{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tag.c{background:transparent;border:1px dashed var(--ink3);color:var(--ink2)}
.note{font-size:13px;color:var(--ink2);background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
/* topic picker */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.chips button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:4px 10px;font-size:13px;text-align:left}
.chips button[aria-pressed="true"]{border-color:var(--guide);background:var(--guide-soft);color:var(--guide-ink)}
.chips small{color:var(--ink3);margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* quiz */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:10px}
.qhead .prog{font-weight:700;color:var(--ink)}
.pbar{height:3px;background:var(--chip);border-radius:2px;margin-bottom:16px;overflow:hidden}
.pbar b{display:block;height:100%;background:var(--guide)}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
.qno{font-family:var(--f-disp);font-weight:900;font-size:15px;color:var(--guide-ink);margin-bottom:6px}
.qtext{font-size:15.5px}
.qtext p{margin:0 0 8px}
.tw{overflow-x:auto;margin:8px 0 10px}
table.d{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:280px}
table.d th,table.d td{border:1px solid var(--line);padding:4px 10px;text-align:left;vertical-align:top}
table.d td.r,table.d th.r{text-align:right}
table.d th{background:var(--chip);font-weight:700}
.stmts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.stmts li{display:grid;grid-template-columns:2em 1fr;gap:4px}
.stmts li b{font-family:var(--f-disp);font-size:16px}
/* mark sheet */
.sheet{margin-top:16px;border-top:2px solid var(--guide);padding-top:12px}
.sheet-l{font-size:11px;letter-spacing:.14em;color:var(--guide-ink);margin-bottom:6px}
.choices{display:grid;gap:6px}
.ch{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 12px;min-height:44px}
.ch:hover:not([disabled]){border-color:var(--guide)}
.ch .ov{width:22px;height:30px;border:2px solid var(--guide);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--guide-ink);font-weight:700;justify-self:center;transition:background .12s}
.ch .tx{font-variant-numeric:tabular-nums;font-size:15px}
.ch.sel .ov{background:var(--pencil);border-color:var(--pencil);color:transparent}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.right .ov{border-color:var(--ok)}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ch[disabled]{cursor:default}
.verdict{margin-top:14px;font-family:var(--f-disp);font-weight:900;font-size:20px;display:flex;align-items:center;gap:10px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.ex{margin-top:10px;background:var(--paper);border-radius:10px;padding:12px 14px;font-size:14.5px}
.ex h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;color:var(--ink3);font-weight:700}
.ex p{margin:0 0 6px}
.ex ul{margin:0;padding-left:1.2em}
.ex .jv{display:grid;grid-template-columns:2.2em 1.6em 1fr;gap:2px 6px;margin-bottom:8px}
.ex .jv .o{color:var(--ok);font-weight:700}.ex .jv .x{color:var(--ng);font-weight:700}
.ex .why{grid-column:3;color:var(--ink2);font-size:13.5px}
.ex .src{font-size:12px;color:var(--ink3);margin-top:8px}
.qnav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
/* essay */
textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;line-height:1.7;resize:vertical}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.kw span{font-size:12.5px;border-radius:4px;padding:1px 8px;border:1px solid var(--line)}
.kw span.hit{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.model{white-space:pre-wrap}
.reason{min-height:84px;font-size:14.5px}
.warn{margin:8px 0 0;color:var(--ng);font-weight:700;font-size:14px}
.rv{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--paper)}
.rv.ok b{color:var(--ok)}.rv.ng b{color:var(--ng)}
/* result */
.score{display:flex;align-items:baseline;gap:10px;margin:8px 0 16px}
.score b{font-family:var(--f-disp);font-size:44px;font-weight:900}
.rlist{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:4px}
.rlist li{display:grid;grid-template-columns:1.6em 1fr auto;gap:6px;font-size:14px;padding:6px 10px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.rlist .o{color:var(--ok);font-weight:700}.rlist .x{color:var(--ng);font-weight:700}.rlist .t{color:var(--ink3);font-size:12px}
.empty{padding:24px;text-align:center;color:var(--ink2);background:var(--sheet);border:1px solid var(--line);border-radius:10px}
@media (max-width:520px){
  .field{grid-template-columns:1fr}.field .acts{grid-row:auto;grid-column:1;justify-content:flex-start}
  .qcard{padding:14px 12px}
}

/* ===== デザイン切替（data-skin） ===== */
:root[data-skin="note"]{
  --paper:#EEF2F6; --sheet:#FFFFFF; --ink:#1C2A44; --ink2:#46546E; --ink3:#7A869C;
  --line:#D5DDE8; --guide:#2E5AAC; --guide-soft:#E3ECFA; --guide-ink:#244C94;
  --pencil:#1C2A44; --ok:#1E7A52; --ok-soft:#FFF3B0; --ng:#C23A3A; --ng-soft:#FBE3E3; --chip:#E6ECF3;
  --f-body:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  --f-disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif; --grid:rgba(46,90,172,.07);}
@media (prefers-color-scheme:dark){:root[data-skin="note"]:not([data-theme="light"]){
  --paper:#141A24; --sheet:#1B2330; --ink:#E4E9F2; --ink2:#AEB9CB; --ink3:#8391A8; --line:#2E3A4D;
  --guide:#7FA6EA; --guide-soft:#22314A; --guide-ink:#A9C3F2; --pencil:#E4E9F2; --ok:#7ED3A6; --ok-soft:#3A3620;
  --ng:#F08A8A; --ng-soft:#42242A; --chip:#243042; --grid:rgba(127,166,234,.06);}}
:root[data-skin="note"][data-theme="dark"]{
  --paper:#141A24; --sheet:#1B2330; --ink:#E4E9F2; --ink2:#AEB9CB; --ink3:#8391A8; --line:#2E3A4D;
  --guide:#7FA6EA; --guide-soft:#22314A; --guide-ink:#A9C3F2; --pencil:#E4E9F2; --ok:#7ED3A6; --ok-soft:#3A3620;
  --ng:#F08A8A; --ng-soft:#42242A; --chip:#243042; --grid:rgba(127,166,234,.06);}
:root[data-skin="note"] body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
:root[data-skin="note"] .qcard{border-left:4px solid var(--ng);border-radius:6px}
:root[data-skin="note"] .ch .ov{border-radius:6px;height:26px;width:26px}
:root[data-skin="note"] .ch.right{box-shadow:inset 0 -10px 0 var(--ok-soft);background:var(--sheet)}
:root[data-skin="note"] .sheet{border-top:1px dashed var(--guide)}

:root[data-skin="night"]{
  --paper:#0E131D; --sheet:#161D2B; --ink:#E7EAF0; --ink2:#AEB6C4; --ink3:#7E889A; --line:#273041;
  --guide:#E6A646; --guide-soft:#3A2E17; --guide-ink:#F2C27A; --pencil:#F2C27A; --ok:#6CCB97; --ok-soft:#18342A;
  --ng:#F2808E; --ng-soft:#3E1F27; --warn:#E6B24A; --chip:#20283A; --focus:#F2C27A; color-scheme:dark;
  --f-body:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Kaku Gothic ProN",sans-serif;}
:root[data-skin="night"] body{font-size:16px}
:root[data-skin="night"] .qtext{font-size:17px;line-height:1.9}
:root[data-skin="night"] .qcard{border-color:transparent;box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.35)}
:root[data-skin="night"] .ch .ov{border-radius:50%;width:26px;height:26px}

:root[data-skin="simple"]{
  --paper:#FFFFFF; --sheet:#FFFFFF; --ink:#141414; --ink2:#505050; --ink3:#8A8A8A; --line:#E6E6E6;
  --guide:#0B63CE; --guide-soft:#E8F1FC; --guide-ink:#0A56B3; --pencil:#0B63CE; --chip:#F2F2F2;
  --f-body:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Kaku Gothic ProN",sans-serif; --f-disp:"Zen Kaku Gothic New",sans-serif;}
@media (prefers-color-scheme:dark){:root[data-skin="simple"]:not([data-theme="light"]){
  --paper:#111213; --sheet:#111213; --ink:#EDEDED; --ink2:#B4B4B4; --ink3:#8A8A8A; --line:#2C2D2F;
  --guide:#5EA2F2; --guide-soft:#16273D; --guide-ink:#8DBDF5; --pencil:#5EA2F2; --chip:#1E1F21;}}
:root[data-skin="simple"][data-theme="dark"]{
  --paper:#111213; --sheet:#111213; --ink:#EDEDED; --ink2:#B4B4B4; --ink3:#8A8A8A; --line:#2C2D2F;
  --guide:#5EA2F2; --guide-soft:#16273D; --guide-ink:#8DBDF5; --pencil:#5EA2F2; --chip:#1E1F21;}
:root[data-skin="simple"] .qcard{border:0;padding-inline:0}
:root[data-skin="simple"] .sheet{border-top:1px solid var(--line)}
:root[data-skin="simple"] .ch{border-radius:12px}
:root[data-skin="simple"] .ch .ov{border:0;background:var(--chip);color:var(--ink2);border-radius:8px;width:28px;height:28px}
:root[data-skin="simple"] .ch.sel .ov{background:var(--guide);color:#fff}
:root[data-skin="simple"] .brand i{border-color:var(--guide)}
:root[data-skin="simple"] h1,:root[data-skin="simple"] h2,:root[data-skin="simple"] .qno,:root[data-skin="simple"] .verdict{font-weight:700}
.opt-wide{grid-column:1 / -1}

/* ===== タッチ端末・iPad ===== */
html{-webkit-text-size-adjust:100%}
button,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
textarea,.reason{font-size:16px}
.btn{min-height:44px}
.seg button{min-height:36px;padding:4px 14px}
.ch{min-height:52px}
.chips button{min-height:36px}
@media (hover:none){ .btn:hover{border-color:var(--line)} .btn.pri:hover{border-color:var(--ink)} .ch:hover:not([disabled]){border-color:var(--line)} }
@media (min-width:900px){
  .wrap{max-width:1180px}
  .fields{grid-template-columns:1fr 1fr}
  .qgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr);gap:28px;align-items:start}
  .qside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100dvh - 100px);overflow:auto;overscroll-behavior:contain;padding-right:2px}
  .qside > .sheet:first-child{margin-top:0}
  .qcard{padding:24px 26px 22px}
}

/* ===== 夜の自習室：仕上げ ===== */
:root[data-skin="night"]{ --lamp:rgba(230,166,70,.10); --lamp2:rgba(90,120,200,.06); }
:root[data-skin="night"] body{background:
  radial-gradient(1100px 520px at 50% -140px,var(--lamp),transparent 70%),
  radial-gradient(900px 600px at 100% 100%,var(--lamp2),transparent 70%),var(--paper);background-attachment:fixed;min-height:100vh}
:root[data-skin="night"] ::selection{background:rgba(230,166,70,.35);color:var(--ink)}
:root[data-skin="night"] .bar{background:rgba(14,19,29,.82);-webkit-backdrop-filter:saturate(140%) blur(10px);backdrop-filter:saturate(140%) blur(10px);border-bottom-color:var(--line)}
:root[data-skin="night"] .brand i{border-color:var(--guide)}
:root[data-skin="night"] .brand i::after{background:var(--guide);box-shadow:0 0 10px rgba(230,166,70,.7)}
:root[data-skin="night"] h1{color:var(--ink);letter-spacing:.02em}
:root[data-skin="night"] h1::after{content:"";display:block;width:56px;height:2px;margin-top:10px;background:var(--guide);border-radius:2px}
:root[data-skin="night"] .subj-h h2{color:var(--guide-ink)}
:root[data-skin="night"] .opts,:root[data-skin="night"] .field,:root[data-skin="night"] .note,:root[data-skin="night"] .rlist li,:root[data-skin="night"] .empty{background:rgba(22,29,43,.78);border-color:var(--line)}
:root[data-skin="night"] .meter b{background:linear-gradient(90deg,var(--guide),#F2C27A)}
:root[data-skin="night"] .pbar b{background:var(--guide);box-shadow:0 0 8px rgba(230,166,70,.6)}
:root[data-skin="night"] .btn{background:var(--sheet)}
:root[data-skin="night"] .btn.pri{background:var(--guide);border-color:var(--guide);color:#1A1204}
:root[data-skin="night"] .btn.ghost{background:transparent}
:root[data-skin="night"] .seg button[aria-pressed="true"]{background:var(--guide);border-color:var(--guide);color:#1A1204}
:root[data-skin="night"] .tag.a{background:rgba(230,166,70,.16);color:var(--guide-ink)}
:root[data-skin="night"] .qno{color:var(--guide-ink)}
:root[data-skin="night"] .stmts li b{color:var(--guide-ink)}
:root[data-skin="night"] .ex{background:rgba(9,13,21,.55)}
:root[data-skin="night"] textarea{background:rgba(9,13,21,.6);border-color:var(--line)}
:root[data-skin="night"] textarea:focus{border-color:var(--guide);outline:none;box-shadow:0 0 0 3px rgba(230,166,70,.18)}
:root[data-skin="night"] .ch.sel .ov{background:var(--guide);border-color:var(--guide);box-shadow:0 0 10px rgba(230,166,70,.55)}
:root[data-skin="night"] .verdict.ok{text-shadow:0 0 18px rgba(108,203,151,.25)}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--chip);color:var(--ink2)}
.kbd-hint{display:none;margin:16px 0 0;font-size:12px;color:var(--ink3);line-height:2}

/* ===== MacBook・PC（マウス／トラックパッド） ===== */
@media (hover:hover) and (pointer:fine){
  .kbd-hint{display:block}
  .field{transition:border-color .15s,transform .15s}
  .field:hover{border-color:var(--guide);transform:translateY(-1px)}
  .ch{transition:border-color .12s,background .12s}
  .ch:hover:not([disabled]){border-color:var(--guide);background:rgba(230,166,70,.06)}
  .ch:focus-visible{outline:2px solid var(--guide);outline-offset:2px}
  .btn,.seg button,.chips button{min-height:0}

<body>
<div class="wrap">
  <header class="bar"><button class="brand" data-act="home" aria-label="科目一覧へ"><i aria-hidden="true"></i>会計士 短答マーク演習</button><span class="sp"></span><span class="sync" id="sync">成績はこの端末に保存</span></header>
  <main id="main"></main>
</div>
<script>
"use strict";
/* ============ 登録・共通ヘルパー ============ */
const SUBJECTS = [
  {id:'fa', name:'財務会計論', fields:[
    {id:'fa-c', name:'計算', kind:'calc'},
    {id:'fa-t', name:'理論', kind:'theory'},
    {id:'fa-e', name:'記述（論述・計算）', kind:'essay'}]},
  {id:'mg', name:'管理会計論', fields:[
    {id:'mg-cc', name:'原価計算 ─ 計算', kind:'calc'},
    {id:'mg-ct', name:'原価計算 ─ 理論', kind:'theory'},
    {id:'mg-mc', name:'管理会計 ─ 計算', kind:'calc'},
    {id:'mg-mt', name:'管理会計 ─ 理論', kind:'theory'},
    {id:'mg-e', name:'記述（論述・計算）', kind:'essay'}]},
  {id:'law', name:'企業法', fields:[{id:'law-t', name:'理論', kind:'theory'},{id:'law-e', name:'記述（論述）', kind:'essay'}]},
  {id:'aud', name:'監査論', fields:[{id:'aud-t', name:'理論', kind:'theory'},{id:'aud-e', name:'記述（論述）', kind:'essay'}]},
  {id:'tax', name:'租税法', fields:[{id:'tax-e', name:'記述（文章・計算）', kind:'essay'}]},
  {id:'keiei', name:'経営学', fields:[{id:'keiei-e', name:'記述（経営管理・財務管理）', kind:'essay'}]},
];
const BANK = [];
const BYID = {};
function reg(kind, d){ d.kind = kind; if (BYID[d.id]) throw new Error('dup id '+d.id); BYID[d.id]=d; BANK.push(d); }
/** 計算: {id,f,ch,t,r:'A'|'B',adv?,g:(R)=>({q,a,w:[],u,ex,dp?,neg?})} */
function C(d){ reg('calc', d); }
/** 理論: {id,f,ch,t,r,T:[正しい文...],F:[[誤った文, 理由]...]} */
function T(d){ reg('theory', d); }
/** 記述: {id,f,ch,t,r,q,model,kw:[]} */
function E(d){ reg('essay', d); }

const R = {
  int(a,b,step=1){ const n=Math.floor((b-a)/step); return a+step*Math.floor(Math.random()*(n+1)); },
  pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; },
  shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; },
  pickN(arr,n){ return R.shuffle(arr).slice(0,n); },
  chance(p){ return Math.random()<p; },
};
const rd = (x,u=1)=>Math.round(x/u)*u;            // 四捨五入
const fl = (x,u=1)=>Math.floor(x/u+1e-9)*u;        // 切捨て
const ce = (x,u=1)=>Math.ceil(x/u-1e-9)*u;         // 切上げ
const yen = (n,dp=0)=>{ if(typeof n!=='number') return String(n); const s=Math.abs(n).toLocaleString('ja-JP',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return (n<0?'△':'')+s; };
const Y = n=>yen(n);
/** 表 HTML: rows = [[セル...]...]; 数値セルは右寄せ */
function tbl(rows, head){
  const cell=(c,tag)=>{ const isNum = typeof c==='number'; return `<${tag}${isNum?' class="r"':''}>${isNum?Y(c):c}</${tag}>`; };
  let h='<div class="tw"><table class="d">';
  if(head) h+='<tr>'+head.map(c=>cell(c,'th')).join('')+'</tr>';
  h+=rows.map(r=>'<tr>'+r.map(c=>cell(c,'td')).join('')+'</tr>').join('');
  return h+'</table></div>';
}
const MONTH = m=>`${m}月`;
const ORD = ['①','②','③','④','⑤','⑥'];
const KANA = ['ア','イ','ウ','エ','オ'];

/* ============ 出題の生成 ============ */
function niceStep(a){
  const m=Math.abs(a)||1;
  let g=1; // a の桁の細かさ
  if (Number.isInteger(a)) { while(g<1e9 && a%(g*10)===0 && a!==0) g*=10; }
  let s=Math.pow(10,Math.floor(Math.log10(m))-1);
  s = s*R.pick([1,2,5]);
  if (Number.isInteger(a)) s=Math.max(Math.round(s/g)*g, g);
  return Math.max(s, Number.isInteger(a)?1:0.01);
}
function buildCalc(item){
  for(let tries=0; tries<40; tries++){
    let o;
    try{ o=item.g(R); }catch(e){ if(e!==0) console.error(item.id,e); continue; }
    const dp=o.dp||0;
    const norm=x=> typeof x==='number' ? Number(x.toFixed(dp)) : x;
    const a=norm(o.a);
    if (typeof a==='number' && !isFinite(a)) continue;
    const seen=new Set([String(a)]);
    const ds=[];
    for(const w of (o.w||[])){ const v=norm(w); if(typeof v==='number'&&(!isFinite(v)||(!o.neg&&v<0&&a>=0))) continue; const k=String(v); if(!seen.has(k)){seen.add(k);ds.push(v);} }
    let pool=R.shuffle(ds).slice(0,5);
    if (typeof a==='number'){
      let guard=0;
      while(pool.length<5 && guard++<200){
        const st=niceStep(a); const k=R.pick([-3,-2,-1,1,2,3,4]);
        let v=norm(a+k*st); if(!o.neg && v<=0) continue;
        if(!seen.has(String(v))){seen.add(String(v));pool.push(v);}
      }
    }
    if (pool.length<5) continue;
    let opts=[a,...pool];
    if (typeof a==='number') opts.sort((x,y)=>x-y); else opts=R.shuffle(opts);
    const fmt = v=> typeof v==='number' ? yen(v,dp)+(o.u||'') : v;
    return { item, kind:'calc', html:o.q, choices:opts.map(fmt), correct:opts.indexOf(a), ex:o.ex };
  }
  throw new Error('生成失敗: '+item.id);
}
/* 短答式の理論：ア〜エの4肢から2つを選ぶ組合せ6択（1 アイ 2 アウ 3 アエ 4 イウ 5 イエ 6 ウエ） */
const NST=4; const PAIRS=[]; for(let i=0;i<NST;i++)for(let j=i+1;j<NST;j++)PAIRS.push([i,j]);
/* 理論：可変文 V=[[ "…{正しい語|誤り1|誤り2}…", 補足理由? ], …] は毎回「正しい文」にも「誤った文」にもなる */
function renderV(tpl,asTrue){
  const parts=[]; tpl.replace(/\{([^}]+)\}/g,(m,g)=>{parts.push(g.split('|'));return m;});
  const k=asTrue?-1:R.int(0,parts.length-1); let i=-1, wrong='', right='';
  const s=tpl.replace(/\{([^}]+)\}/g,(m,g)=>{ i++; const o=g.split('|'); if(i===k){ const w=R.pick(o.slice(1)); wrong=w; right=o[0]; return w; } return o[0]; });
  return {s,wrong,right};
}
function theoryCands(item){
  const c=[];
  item.T.forEach((s,i)=>c.push({key:item.id+'T'+i,s,ok:true,topic:item.t}));
  item.F.forEach(([s,why],i)=>c.push({key:item.id+'F'+i,s,ok:false,why,topic:item.t}));
  (item.V||[]).forEach(([tpl,why],i)=>{ const key=item.id+'V'+i;
    c.push({key,ok:true,topic:item.t,lazy:()=>({s:renderV(tpl,true).s})});
    c.push({key,ok:false,topic:item.t,lazy:()=>{const r=renderV(tpl,false); return {s:r.s,why:`「${r.wrong}」ではなく「${r.right}」が正しい。${why||''}`};}}); });
  return c;
}
const STEMS=[
  t=>`${t}に関する次の記述のうち，正しいものの組合せとして最も適切なものを選びなさい。`,
  t=>`${t}に関する次のア～エの記述のうち，正しいものが二つある。その組合せとして最も適切な番号を一つ選びなさい。`,
  t=>`次のア～エの記述は，${t}に関するものである。このうち正しいものの組合せを一つ選びなさい。`,
  t=>`${t}について述べた次の文章のうち，妥当なものの組合せとして最も適切なものを選びなさい。`];
const bigr=s=>{const t=s.replace(/[，。、「」（）\s]/g,'');const b=new Set();for(let i=0;i<t.length-1;i++)b.add(t.slice(i,i+2));return b;};
const simi=(a,b)=>{let n=0;a.forEach(x=>{if(b.has(x))n++;});return n/Math.min(a.size,b.size||1);};
function addV(id,arr){ const it=BYID[id]; if(!it) throw new Error('addV: '+id); it.V=(it.V||[]).concat(arr); }
const NEG_STEMS=[
  t=>`${t}に関する次の記述のうち，誤っているものの組合せとして最も適切なものを選びなさい。`,
  t=>`${t}に関する次のア～エの記述のうち，誤っているものが二つある。その組合せとして最も適切な番号を一つ選びなさい。`,
  t=>`次のア～エの記述は，${t}に関するものである。このうち妥当でないものの組合せを一つ選びなさい。`];
function buildTheory(item){
  // 出題形式（正しいもの／誤っているもの）・問題文・肢・正誤（可変文）を毎回ランダムに組み立てる
  let pool, title=item.t;
  if(item.mix){ pool=[]; BANK.filter(i=>i.kind==='theory'&&i.f===item.mix&&!i.mix).forEach(i=>pool.push(...theoryCands(i))); const fl=SUBJECTS.flatMap(x=>x.fields.map(f=>[f.id,x.name])).find(x=>x[0]===item.mix); title=fl?fl[1]:'この分野'; }
  else pool=theoryCands(item);
  const nT0=pool.filter(c=>c.ok).length, nF0=pool.filter(c=>!c.ok).length;
  const neg = R.chance(0.4);
  const needT=2, needF=NST-needT; // 正しい2・誤り2（「誤っているもの」を問う場合は誤り2つが正答）
  for(let attempt=0; attempt<3; attempt++){
    const chosen=[], keys=new Set(), topics=new Set();
    const take=(list,n,strictTopic)=>{ let got=0; for(const c of list){ if(got>=n) break; if(keys.has(c.key)) continue; if(item.mix&&strictTopic&&topics.has(c.topic)) continue;
        const m=c.lazy?c.lazy():{s:c.s,why:c.why}; const b=bigr(m.s); if(attempt<2 && chosen.some(x=>simi(x.b,b)>0.6)) continue;
        chosen.push({s:m.s,why:m.why,ok:c.ok,topic:c.topic,b}); keys.add(c.key); topics.add(c.topic); got++; } return got; };
    const gT=take(R.shuffle(pool.filter(c=>c.ok)),needT,attempt===0);
    const gF=take(R.shuffle(pool.filter(c=>!c.ok)),needF,attempt===0);
    if(gT<needT||gF<needF) continue;
    const st=R.shuffle(chosen);
    const cor=st.map((x,i)=>(neg?!x.ok:x.ok)?i:-1).filter(i=>i>=0);
    const ci=PAIRS.findIndex(p=>p[0]===cor[0]&&p[1]===cor[1]);
    const idx=PAIRS.map((p,i)=>i);
    const stem=R.pick(neg?NEG_STEMS:STEMS)(title).replace(/(正しいもの|妥当なもの|誤っているもの|妥当でないもの)/,'<b>$1</b>');
    const html=`<p>${stem}</p>`+'<ul class="stmts">'+st.map((x,i)=>`<li><b>${KANA[i]}</b><span>${x.s}</span></li>`).join('')+'</ul>';
    const ex='<div class="jv">'+st.map((x,i)=>`<b>${KANA[i]}</b><span class="${x.ok?'o':'x'}">${x.ok?'○':'×'}</span><span>${item.mix?`<small>［${x.topic}］</small>`:''}${x.ok?'正しい。':x.why}</span>`).join('')+'</div>';
    return { item, kind:'theory', neg, st:st.map(({s,why,ok,topic})=>({s,why,ok,topic})), html, choices:idx.map(i=>PAIRS[i].map(k=>KANA[k]).join('・')), correct:idx.indexOf(ci), ex };
  }
  throw new Error('理論生成失敗: '+item.id);
}
function buildQ(item){ return item.kind==='calc'?buildCalc(item): item.kind==='theory'?buildTheory(item): {item,kind:'essay'}; }

const DB200={5:[0.400,0.500,0.10800],6:[0.333,0.334,0.09911],8:[0.250,0.334,0.07909],10:[0.200,0.250,0.06552]};
C({id:'fa-dep-200db',f:FA,ch:'第2章 有形固定資産',t:'200%定率法（保証率・改定償却率）',r:'A',g(){
  const n=R.pick([5,6,8,10]); const [rate,rev,gr]=DB200[n];
  const C0=R.int(10,60)*100000; const k=R.int(2,n-1);
  let bv=C0, dep=0, switched=false, base=0, noSw=0; const guar=Math.floor(C0*gr);
  for(let y=1;y<=k;y++){
    const d=Math.floor(bv*rate);
    if(!switched && d<guar){ switched=true; base=bv; }
    dep = switched? Math.floor(base*rev) : d;
    if(y===k){ noSw=d; }
    bv-=dep;
  }
  const prev=(()=>{ let b=C0,s=false,bs=0,dd=0; for(let y=1;y<k;y++){const d=Math.floor(b*rate); if(!s&&d<guar){s=true;bs=b;} dd=s?Math.floor(bs*rev):d; b-=dd;} return dd; })();
  return {q:P_(`${FY}機械（取得原価${Y(C0)}円，${k-1===0?'当期首':k-1+'年前の期首'}に取得，耐用年数${n}年）を200%定率法により償却している。償却率${rate.toFixed(3)}，改定償却率${rev.toFixed(3)}，保証率${gr.toFixed(5)}である。当期（取得から${k}年目）の減価償却費はいくらか（円未満切捨て）。`),
    a:dep,u:'円',w:[noSw,prev,Math.floor(bv*rate),Math.floor((bv+dep)*rev),Math.floor(C0/n),guar,Math.floor(C0*rate)],
    ex:`償却保証額＝${Y(C0)}×${gr}＝${Y(guar)}円。各年の「期首帳簿価額×償却率」が償却保証額を下回った年から，その年の期首帳簿価額（改定取得価額）×改定償却率で均等償却する。<br>${switched?`本問では改定償却率へ切り替わっており，改定取得価額${Y(base)}×${rev}＝<b>${Y(dep)}円</b>`:`本問ではまだ切替前であり，期首帳簿価額${Y(bv+dep)}×${rate}＝<b>${Y(dep)}円</b>`}`};
}});

C({id:'fa-software',f:FA,ch:'第15章 研究開発費・ソフトウェア',t:'市場販売目的ソフトウェアの償却',r:'A',adv:false,g(){

      a:rd(a1),u:'円',w:[rd(Math.min(byQ,byT)),rd(S/5),rd(S*q1/(Q-q1)),rd(S/2)],
      ex:`数量基準：${Y(S)}×${Y(q1)}/${Y(Q)}＝${Y(rd(byQ))}<br>均等配分：${Y(S)}÷3年＝${Y(rd(byT))}<br>いずれか大きい額＝<b>${Y(rd(a1))}円</b>`};
  }
  const q2=(Q-q1)*R.pick([0.3,0.4,0.5]); const bv=S-a1; const b2q=bv*q2/(Q-q1), b2t=bv/2; const a2=rd(Math.max(b2q,b2t));
  return {q:P_(`前期首に市場販売目的のソフトウェア${Y(S)}円を計上した（見込有効期間3年，見込販売数量${Y(Q)}個）。前期の販売数量は${Y(q1)}個，当期の販売数量は${Y(q2)}個であった（見込の変更はない）。見込販売数量に基づく償却額と均等配分額のいずれか大きい額を償却する。当期の償却額はいくらか（円未満四捨五入）。`),

    ex:`前期償却額＝max(${Y(rd(byQ))}, ${Y(rd(byT))})＝${Y(rd(a1))} → 当期首未償却残高${Y(rd(bv))}<br>数量基準：${Y(rd(bv))}×${Y(q2)}/(期首見込残${Y(Q-q1)})＝${Y(rd(b2q))}<br>均等配分：${Y(rd(bv))}÷残存2年＝${Y(rd(b2t))}<br>大きい方＝<b>${Y(a2)}円</b>`};

C({id:'fa-allow-general',f:FA,ch:'第12章 貸倒引当金',t:'貸倒引当金（差額補充法）',r:'A',g(){

  const r=R.int(5,30)*1000; const x=R.int(1,Math.floor(r/1000)-1)*1000; // 前期債権の貸倒（引当金充当）

    a:ans,u:'円',w:[need,need-r,need+x,B*p/100-(r-x),(A+B-x)*p/100-(r-x)],
    ex:`設定額：(${Y(A)}＋${Y(B)})×${p}%＝${Y(need)}<br>引当金残高：${Y(r)}－${Y(x)}＝${Y(r-x)}<br>繰入額：${Y(need)}－${Y(r-x)}＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-allow-doubt',f:FA,ch:'第12章 貸倒引当金',t:'貸倒懸念債権（財務内容評価法）',r:'A',g(){

C({id:'fa-allow-cf',f:FA,ch:'第12章 貸倒引当金',t:'貸倒懸念債権（キャッシュ・フロー見積法）',r:'B',adv:true,g(){
  const X=R.int(10,50)*100000; const i=R.pick([4,5,6]); const j=R.pick([1,2]); const n=R.pick([2,3]);
  let pv=0; for(let t=1;t<=n;t++){ pv+=X*j/100/Math.pow(1+i/100,t); } pv+=X/Math.pow(1+i/100,n); pv=rd(pv);
  const ans=X-pv;
  const pvj=(()=>{let s=0;for(let t=1;t<=n;t++)s+=X*j/100/Math.pow(1+j/100,t);return rd(s+X/Math.pow(1+j/100,n));})();
  return {q:P_(`当期末，B社に対する貸付金${Y(X)}円（約定利子率年${i}%，利払日は毎年3月末）について，B社の申し出により，当期末の利払い後に今後${n}年間の利率を年${j}%に引き下げた（元本は${n}年後に一括返済）。キャッシュ・フロー見積法により貸倒引当金を設定する。設定額はいくらか（割引計算の結果の円未満は四捨五入）。`),
    a:ans,u:'円',w:[X-pvj,rd(X*(i-j)/100*n),rd(ans*1.1/1000)*1000,X*(i-j)/100],
    ex:`将来キャッシュ・フロー（利息${Y(X*j/100)}×${n}回＋元本${Y(X)}）を<b>当初の約定利子率${i}%</b>で割り引く。<br>現在価値＝${Y(pv)}<br>貸倒引当金＝${Y(X)}－${Y(pv)}＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-inv-val',f:FA,ch:'第5章 商品売買・棚卸資産',t:'棚卸減耗損と商品評価損',r:'A',g(){

  const ans= ask==='棚卸減耗損'?loss: ask==='商品評価損'?wd:bs;
  const w= ask==='棚卸減耗損'?[(Qb-Qa)*v,Qb*(c-v),loss+wd,Qa*c]: ask==='商品評価損'?[Qb*(c-v),(Qb-Qa)*(c-v),loss+wd,Qa*v]:[Qa*c,Qb*v,Qb*c-loss,Qb*c-wd];
  return {q:P_(`期末商品の帳簿棚卸数量は${Y(Qb)}個，実地棚卸数量は${Y(Qa)}個，取得原価は＠${Y(c)}円，期末の正味売却価額は＠${Y(v)}円であった。${ask}の金額はいくらか。`),

C({id:'fa-cogs-returns',f:FA,ch:'第5章 商品売買・棚卸資産',t:'仕入戻し・値引・割戻・割引',r:'A',g(){

C({id:'fa-moving-avg',f:FA,ch:'第5章 商品売買・棚卸資産',t:'移動平均法',r:'A',g(){
  const c0=R.int(40,80)*10; const a1=c0+R.int(1,5)*10; const c1=2*a1-c0; // q0=q1=100
  const s1=R.int(12,18)*10; const r1=200-s1; let c2=a1+R.int(1,6)*20; const a2=(a1+c2)/2; const s2=R.int(Math.floor(r1*1.2/10),Math.floor(r1*1.8/10))*10;
  const cogs=s1*a1+s2*a2; const end=(2*r1-s2)*a2;
  // FIFO
  let lots=[[100,c0],[100,c1]]; const take=(q)=>{let c=0;while(q>0){const l=lots[0];const t=Math.min(q,l[0]);c+=t*l[1];l[0]-=t;q-=t;if(!l[0])lots.shift();}return c;};
  const f1=take(s1); lots.push([r1,c2]); const f2=take(s2); const fifo=f1+f2;
  const tot=(100*c0+100*c1+r1*c2)/(200+r1); const tavg=rd((s1+s2)*tot);
  const ask=R.pick(['売上原価','期末商品棚卸高']);
  const ans=ask==='売上原価'?cogs:end;
  return {q:P_(`次の商品有高の資料に基づき，移動平均法による${ask}を求めなさい。`)+tbl([['期首残高','100個','＠'+c0],['仕入','100個','＠'+c1],['売上',s1+'個',''],['仕入',r1+'個','＠'+c2],['売上',s2+'個','']],['取引','数量','単価']),
    a:ans,u:'円',w: ask==='売上原価'?[fifo,tavg,end,s1*a1+s2*c2]:[cogs,(2*r1-s2)*c2,100*c0+100*c1+r1*c2-fifo,rd((2*r1-s2)*tot)],
    ex:`1回目仕入後の単価：(100×${c0}＋100×${c1})÷200＝＠${a1}<br>売上${s1}個 → 原価${Y(s1*a1)}，残${r1}個<br>2回目仕入後：(${r1}×${a1}＋${r1}×${c2})÷${2*r1}＝＠${a2}<br>売上${s2}個 → 原価${Y(s2*a2)}<br>売上原価${Y(cogs)}，期末商品${Y(end)}（${2*r1-s2}個×＠${a2}）<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-retail',f:FA,ch:'第5章 商品売買・棚卸資産',t:'売価還元法（平均原価法・低価法）',r:'A',g(){
  const pr=R.pick([[0.72,0.64,1/8],[0.75,0.6,1/4],[0.8,0.75,1/15],[0.7,0.63,1/9]]);
  const k=R.int(2,6); const D1=k*9000000*(pr[2]===1/15?5/3:1); // 平均法の分母
  const Dd=Math.round(D1*pr[2]); // 値下－値下取消
  const cost=Math.round(D1*pr[0]);
  const BS=rd(D1*0.15,10000), BC=rd(BS*pr[0]*0.98,1000), PC=cost-BC;
  const U=R.int(5,20)*10000, UC=R.int(1,4)*10000; const DC=R.int(1,5)*10000; const D=Dd+DC;
  const N=D1-BS-PC-U+UC+D-DC; if(N<=0) throw 0;
  const S=rd(D1*R.pick([0.7,0.75,0.8]),10000); const endS=D1-S;
  const r1=cost/D1, r2=cost/(D1+Dd);
  const ask=R.pick(['期末商品（原価法）','商品評価損']);
  const orig=rd(endS*r1), low=rd(endS*r2);
  const ans= ask==='商品評価損'? orig-low : orig;
  return {q:P_(`売価還元法を採用している。次の資料に基づき，${ask==='商品評価損'?'売価還元低価法（商品評価損を計上する方法）による当期の商品評価損':'売価還元平均原価法による期末商品の原価'}を求めなさい（期末の正味売却価額は考慮しない）。`)+
    tbl([['期首商品',BC,BS],['当期仕入高',PC,''],['原始値入額','',N],['値上額','',U],['値上取消額','',UC],['値下額','',D],['値下取消額','',DC],['当期売上高','',S]],['','原価','売価']),
    a:ans,u:'円',w: ask==='商品評価損'?[orig,low,rd(endS*(r1-r2)*1.1),rd(Dd*r2)]:[low,endS,rd(endS*cost/(D1-Dd)),rd(endS*(cost/(BS+PC+N)))],
    ex:`原価法原価率＝(${Y(BC)}＋${Y(PC)})÷(${Y(BS)}＋${Y(PC)}＋${Y(N)}＋${Y(U)}－${Y(UC)}－${Y(D)}＋${Y(DC)})＝${Y(cost)}÷${Y(D1)}＝${r1}<br>低価法原価率＝${Y(cost)}÷(値下・値下取消を除いた分母${Y(D1+Dd)})＝${r2}<br>期末売価＝${Y(D1)}－${Y(S)}＝${Y(endS)}<br>原価法：${Y(endS)}×${r1}＝${Y(orig)}，低価法：${Y(endS)}×${r2}＝${Y(low)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-branch-profit',f:FA,ch:'第6章 本支店会計',t:'内部利益の消去',r:'A',g(){

C({id:'fa-eps',f:FA,ch:'第7章 1株当たり情報',t:'1株当たり当期純利益',r:'A',g(){
  const N0=R.int(8,30)*10000; const n1=R.int(1,6)*12000; const m1=R.pick([7,10,1]); const rem1= m1>=4?16-m1:4-m1;
  const t=R.int(1,4)*6000; const m2=R.pick([10,1]); const rem2=m2>=4?16-m2:4-m2;
  const NI=R.int(100,600)*100000; const pd=R.chance(0.5)?R.int(5,30)*100000:0;
  const avg=N0+n1*rem1/12-t*rem2/12; const eps=(NI-pd)/avg;
  return {q:P_(`${FY}当期の当期純利益は${Y(NI)}円である。${pd?`当期に係る優先株式への配当額は${Y(pd)}円である（優先株式は普通株式と同等の株式ではない）。`:''}期首の普通株式発行済株式数は${Y(N0)}株であり，当期${m1}月1日に${Y(n1)}株の新株を発行し，${m2}月1日に自己株式${Y(t)}株を取得した（月割で計算する）。1株当たり当期純利益はいくらか（銭未満四捨五入）。`),
    a:eps,dp:2,u:'円',w:[NI/avg,(NI-pd)/(N0+n1-t),(NI-pd)/(N0+n1*rem1/12),(NI-pd)/N0,(NI-pd)/(N0+n1-t*rem2/12)],
    ex:`期中平均株式数＝${Y(N0)}＋${Y(n1)}×${rem1}/12－${Y(t)}×${rem2}/12＝${Y(avg,2)}株<br>普通株式に係る当期純利益＝${Y(NI)}${pd?'－優先配当'+Y(pd):''}＝${Y(NI-pd)}<br>${Y(NI-pd)}÷${Y(avg,2)}＝<b>${yen(eps,2)}円</b>`};
}});

C({id:'fa-eps-diluted',f:FA,ch:'第7章 1株当たり情報',t:'潜在株式調整後1株当たり当期純利益（転換社債）',r:'B',adv:true,g(){
  const N=R.int(10,40)*10000; const NI=R.int(200,800)*100000; const F=R.int(2,10)*10000000; const ci=R.pick([1,2]); const tax=0.3;
  const cp=R.pick([500,800,1000,1250]); const conv=F/cp; const adj=F*ci/100*(1-tax);
  const basic=NI/N; const dil=(NI+adj)/(N+conv); if(dil>=basic) throw 0;
  return {q:P_(`期首から期末まで普通株式${Y(N)}株が発行されており（期中の増減なし），当期純利益は${Y(NI)}円である。前期に発行した転換社債型新株予約権付社債（額面${Y(F)}円，利率年${ci}%，一括法，転換価格＠${Y(cp)}円）が期末まで全額未転換である。法定実効税率は30%とする。潜在株式調整後1株当たり当期純利益はいくらか（銭未満四捨五入）。`),
    a:dil,dp:2,u:'円',w:[basic,(NI+F*ci/100)/(N+conv),NI/(N+conv),(NI+adj)/N,(NI-adj)/(N+conv)],
    ex:`希薄化効果の判定：1株当たり利益調整額＝${Y(adj)}÷${Y(conv)}株＝${yen(adj/conv,2)} ＜ 基本的EPS${yen(basic,2)}なので希薄化効果あり。<br>分子：${Y(NI)}＋支払利息${Y(F*ci/100)}×(1－30%)＝${Y(NI+adj)}<br>分母：${Y(N)}＋${Y(F)}÷＠${cp}＝${Y(N+conv)}株<br>＝<b>${yen(dil,2)}円</b>`};
}});

C({id:'fa-accruals',f:FA,ch:'第8章 経過勘定',t:'経過勘定（前払費用・未払費用）',r:'A',g(){
  if(R.chance(0.5)){
    const P=R.int(1,9)*120000; const m=R.pick([6,7,8,9,10,11,12,1,2]); const used=m>=4?16-m:4-m; const pre=P*(12-used)/12;
    return {q:P_(`${FY}当期${m}月1日に向こう1年分の保険料${Y(P)}円を支払い，全額を支払保険料として処理した。決算にあたり計上すべき前払保険料はいくらか。`),
      a:pre,u:'円',w:[P*used/12,P-pre+P/12,pre+P/12,pre-P/12,P],
      ex:`翌期に属する期間：12か月－当期経過${used}か月＝${12-used}か月<br>${Y(P)}×${12-used}/12＝<b>${Y(pre)}円</b>`};
  }
  const L=R.int(5,50)*1200000/10; const i=R.pick([1.5,2,2.5,3,4]); const m=R.pick([6,8,10,12]); const pm=R.pick([[9,3],[6,12]]);
  // 借入日 m月1日，利払日 毎年 pm に 後払い（半年ごと）→ 単純化：最後の利払日から決算日まで
  const lastPay = m>=4? m : m; const months= m>=4 ? 16-m : 4-m; const acc=L*i/100*months/12;
  return {q:P_(`${FY}当期${m}月1日に，借入金${Y(L)}円（年利率${i}%，利息は元本返済時に一括後払い，返済日は2年後の${m}月末）を借り入れた。決算にあたり計上すべき未払利息はいくらか（月割計算）。`),
    a:acc,u:'円',w:[L*i/100,L*i/100*(months-1)/12,L*i/100*(12-months)/12,acc*2],
    ex:`${m}月1日から3月31日までの${months}か月分を計上する。<br>${Y(L)}×${i}%×${months}/12＝<b>${Y(acc)}円</b>`};
}});

/* ============ 財務会計論・計算 (2) 金融商品〜連結・CF ============ */
C({id:'fa-sec-trading',f:FA,ch:'第9章 有価証券',t:'売買目的有価証券の期末評価',r:'A',g(){
  const rows=[]; let net=0, gains=0, costsNoFee=0;
  ['A社株式','B社株式','C社株式'].forEach(nm=>{
    const n=R.int(1,10)*100, pc=R.int(30,150)*10, fee=R.int(1,5)*1000; const cost=n*pc+fee;
    const v=pc+R.pick([-1,1])*R.int(2,25)*10; const fv=n*v; rows.push([nm,`${n}株`,`＠${Y(pc)}`,Y(fee),`＠${Y(v)}`]);
    net+=fv-cost; gains+=Math.max(0,fv-cost); costsNoFee+=fv-n*pc;
  });
  return {q:P_('当期に取得した売買目的有価証券の資料は次のとおりである。当期の有価証券評価損益（純額）はいくらか（評価益はプラス，評価損は△で表示）。')+tbl(rows,['銘柄','株数','取得単価','購入手数料(総額)','期末時価']),
    a:net,u:'円',neg:true,w:[costsNoFee,gains,-net,net-3000,net+3000],
    ex:`購入手数料は取得原価に含める（付随費用）。各銘柄の(期末時価－取得原価)を合計して<b>${yen(net)}円</b>`};
}});

C({id:'fa-sec-htm-sl',f:FA,ch:'第9章 有価証券',t:'満期保有目的の債券（償却原価法・定額法）',r:'A',g(){
  const n=R.pick([3,4,5]); const F=R.int(1,10)*1000000; const pr=R.pick([95,96,97,97.5,98,98.5]); const P=F*pr/100;
  const m=R.pick([4,7,10,1]); const months=m>=4?16-m:4-m; const am=(F-P)*months/(n*12);
  const ans=P+am;
  return {q:P_(`${FY}当期${m}月1日に，満期保有目的でD社社債（額面${Y(F)}円，償還日は${n}年後の${m===1?12:m-1}月末）を額面100円につき${pr}円で取得した。額面金額と取得価額の差額は金利の調整と認められるため，償却原価法（定額法）を適用する。当期末の貸借対照表価額はいくらか。`),
    a:rd(ans),u:'円',w:[P,F,rd(P+(F-P)/n),rd(P+(F-P)*(months-1)/(n*12)),rd(F-am)],
    ex:`1か月当たり償却額：(${Y(F)}－${Y(P)})÷${n*12}か月＝${Y((F-P)/(n*12))}<br>当期償却額：×${months}か月＝${Y(rd(am))}<br>${Y(P)}＋${Y(rd(am))}＝<b>${Y(rd(ans))}円</b>`};
}});

C({id:'fa-sec-htm-eff',f:FA,ch:'第9章 有価証券',t:'償却原価法（利息法）',r:'A',adv:true,g(){
  const F=R.int(1,5)*1000000; const c=R.pick([1,2,3]); const r=c+R.pick([1,1.5,2]); const n=3;
  let P=0; for(let t=1;t<=n;t++)P+=F*c/100/Math.pow(1+r/100,t); P+=F/Math.pow(1+r/100,n); P=rd(P);
  const int1=rd(P*r/100); const cpn=F*c/100; const bv1=P+int1-cpn; const int2=rd(bv1*r/100); const bv2=bv1+int2-cpn;
  const yr=R.pick([1,2]); const ask=R.pick(['有価証券利息','期末の貸借対照表価額']);
  const ans= yr===1? (ask==='有価証券利息'?int1:bv1) : (ask==='有価証券利息'?int2:bv2);
  const sl=(F-P)/n;
  return {q:P_(`${yr===1?'当期首':'前期首'}に満期保有目的でE社社債（額面${Y(F)}円，クーポン利率年${c}%，利払日は毎年3月末，償還期間3年）を${Y(P)}円で取得した。実効利子率は年${r}%であり，償却原価法（利息法）を適用する。当期の${ask}はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w: ask==='有価証券利息'?[cpn, rd(cpn+sl), yr===1?int2:int1, rd(F*r/100)]:[rd(P+sl*yr), yr===1?bv2:bv1, P+ (yr===1?int1:int1+int2), rd(bv1+sl)],
    ex:`1年目：利息${Y(P)}×${r}%＝${Y(int1)}，償却額${Y(int1-cpn)}（利息－クーポン${Y(cpn)}），期末${Y(bv1)}<br>2年目：利息${Y(bv1)}×${r}%＝${Y(int2)}，期末${Y(bv2)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-sec-afs',f:FA,ch:'第9章 有価証券',t:'その他有価証券（全部純資産直入法・税効果）',r:'A',g(){
  const t=R.pick([30,35]); const rows=[]; let diff=0, gains=0;
  ['F社株式','G社株式','H社株式'].forEach(nm=>{ const c=R.int(10,80)*10000; const v=c+R.pick([-1,1])*R.int(1,20)*10000; rows.push([nm,c,v]); diff+=v-c; gains+=Math.max(0,v-c); });
  const ans=diff*(100-t)/100;
  return {q:P_(`当期末に保有するその他有価証券は次のとおりである（いずれも当期取得）。全部純資産直入法を採用し，税効果会計を適用する（法定実効税率${t}%）。貸借対照表に計上されるその他有価証券評価差額金はいくらか（貸方残高はプラス，借方残高は△）。`)+tbl(rows,['銘柄','取得原価','期末時価']),
    a:ans,u:'円',neg:true,w:[diff,gains*(100-t)/100,diff*t/100,-ans,(gains)*(100-t)/100-((gains-diff))],
    ex:`評価差額の合計＝${yen(diff)}<br>税効果：${yen(diff)}×(1－${t}%)＝<b>${yen(ans)}円</b>（残額${yen(diff*t/100)}は繰延税金資産／負債）`};
}});

C({id:'fa-sec-afs-partial',f:FA,ch:'第9章 有価証券',t:'その他有価証券（部分純資産直入法）',r:'A',g(){
  const rows=[]; let loss=0, diff=0;
  ['I社株式','J社株式','K社株式','L社社債'].forEach(nm=>{ const c=R.int(10,80)*10000; const v=c+R.pick([-1,1])*R.int(1,15)*10000; rows.push([nm,c,v]); if(v<c)loss+=c-v; diff+=v-c; });
  if(!loss) throw 0;
  return {q:P_('部分純資産直入法を採用している。当期末に保有するその他有価証券（いずれも当期取得，時価の著しい下落はない）は次のとおりである。当期の損益計算書に計上される投資有価証券評価損はいくらか（税効果は考慮しない）。')+tbl(rows,['銘柄','取得原価','期末時価']),
    a:loss,u:'円',w:[Math.abs(diff),loss+diff,loss*0.7,loss-diff>0?loss-diff:loss*2],
    ex:`部分純資産直入法では，時価が取得原価を上回る銘柄の評価差額は純資産の部に計上し，下回る銘柄の評価差額は当期の損失とする。<br>評価損の合計＝<b>${Y(loss)}円</b>`};
}});

C({id:'fa-sec-impair',f:FA,ch:'第9章 有価証券',t:'有価証券の減損処理',r:'A',g(){
  const rows=[]; let imp=0; let naive=0, all=0;
  const pats=R.shuffle([[0.4,'回復する見込みがあるとは認められない'],[0.55,'—'],[0.35,'回復する見込みがあると認められる'],[0.8,'—'],[0.45,'回復する見込みがあるとは認められない']]).slice(0,4);
  pats.forEach((p,i)=>{ const c=R.int(10,60)*10000; const v=rd(c*p[0],1000); rows.push([`${'MNOPQ'[i]}社株式`,c,v,p[1]]);
    const decl=1-p[0]; all+=c-v; if(decl>=0.5 || (decl>=0.3 && p[1].startsWith('回復する見込みがあるとは'))) imp+=c-v; if(decl>=0.5) naive+=c-v; });
  if(!imp) throw 0;
  return {q:P_('その他有価証券（市場価格のある株式）の期末の状況は次のとおりである。時価が取得原価に比べて50%程度以上下落した場合には著しい下落とし，30%以上50%未満の下落の場合は回復可能性を個別に判断する。当期に計上すべき減損損失（投資有価証券評価損）の合計はいくらか。')+tbl(rows,['銘柄','取得原価','期末時価','回復可能性の判断']),
    a:imp,u:'円',w:[naive,all,imp+ (all-imp)/2, imp*0.7],
    ex:`下落率50%以上 → 回復する見込みがあると認められる場合を除き減損。下落率30%以上50%未満 → 回復する見込みがないと判断したものを減損。<br>該当銘柄の(取得原価－時価)の合計＝<b>${Y(imp)}円</b>`};
}});

C({id:'fa-sec-sale',f:FA,ch:'第9章 有価証券',t:'有価証券の売却（平均原価法）',r:'A',g(){
  const n1=R.int(2,8)*100, p1=R.int(40,90)*10, n2=n1, p2=p1+R.int(2,20)*10; const f1=R.int(1,4)*1000, f2=R.int(1,4)*1000;
  const tot=n1*p1+f1+n2*p2+f2; const q=n1+n2; const avg=tot/q; const s=R.int(1,Math.floor(q/100)-1)*100; const sp=rd(avg+R.pick([-1,1])*R.int(3,20)*10,10);
  const gain=rd(s*sp - s*avg);
  const noFee=rd(s*sp - s*(n1*p1+n2*p2)/q);
  return {q:P_(`売買目的でR社株式を次のとおり取得した。1回目：${n1}株を＠${Y(p1)}円（手数料${Y(f1)}円），2回目：${n2}株を＠${Y(p2)}円（手数料${Y(f2)}円）。その後，${s}株を＠${Y(sp)}円で売却した。払出単価は平均原価法による。有価証券売却損益はいくらか（益はプラス，損は△。円未満四捨五入）。`),
    a:gain,u:'円',neg:true,w:[noFee, rd(s*sp-s*p1-f1*s/n1), rd(s*sp-s*p2), -gain, rd(s*(sp-p1))],
    ex:`平均単価＝(${Y(n1*p1+f1)}＋${Y(n2*p2+f2)})÷${q}株＝＠${yen(avg,2)}<br>売却損益＝${s}株×(＠${Y(sp)}－＠${yen(avg,2)})＝<b>${yen(gain)}円</b>`};
}});

C({id:'fa-note-discount',f:FA,ch:'第10章 手形取引',t:'手形の割引',r:'A',g(){
  const X=R.int(10,100)*12000*10/10; const r=R.pick([3,4,5,6]); const m=R.pick([2,3,4,5]); const g=R.pick([1,2]);
  const loss=X*r/100*m/12; const gd=X*g/100;
  return {q:P_(`得意先から受け取った約束手形${Y(X)}円を，満期日の${m}か月前に取引銀行で割り引き，割引料を差し引かれた手取額を当座預金とした。割引率は年${r}%（月割計算）である。なお，手形の遡求義務に係る保証債務を額面の${g}%で計上する。手形の割引に関して当期に計上する手形売却損はいくらか。`),
    a:loss,u:'円',w:[loss+gd,X*r/100,gd,X*r/100*(m+1)/12,X*r/100*(12-m)/12],
    ex:`手形売却損＝${Y(X)}×${r}%×${m}/12＝<b>${Y(loss)}円</b><br>保証債務${Y(gd)}円は保証債務費用として別途計上する（手形売却損には含めない）。`};
}});

C({id:'fa-futures',f:FA,ch:'第13章 デリバティブ取引',t:'債券先物取引の期末評価',r:'B',g(){
  const F=R.int(1,10)*100000000; const p0=R.int(14200,15000)/100; const d=R.int(-120,120,10)/100; if(!d) throw 0; const p1=Math.round((p0+d)*100)/100;
  const side=R.pick(['買建','売建']); const pl= Math.round((side==='買建'?(p1-p0):(p0-p1))*F/100);
  return {q:P_(`当期中に国債先物（額面${Y(F)}円）を＠${p0.toFixed(2)}円で${side}てた（売買目的，ヘッジ会計は適用しない）。期末の先物価格は＠${p1.toFixed(2)}円であった。期末に計上する先物損益はいくらか（益はプラス，損は△）。`),
    a:pl,u:'円',neg:true,w:[-pl,Math.round((p1-p0)*F/1000),Math.round(Math.abs(p1-p0)*F/100)*(pl>0?-1:1)*2,Math.round(pl/2)],
    ex:`デリバティブは時価評価し，評価差額は当期の損益とする。<br>${side}：(${side==='買建'?'期末価格－約定価格':'約定価格－期末価格'})÷100×額面＝<b>${yen(pl)}円</b>`};
}});

const DF5=[0.9524,0.9070,0.8638,0.8227,0.7835];
C({id:'fa-impairment',f:FA,ch:'第16章 減損会計',t:'固定資産の減損損失',r:'A',g(){
  const n=R.pick([3,4,5]); const cf=R.int(10,40)*10000; const res=R.int(5,20)*10000;
  const U=cf*n+res; const BV=rd(U*R.pick([1.1,1.25,1.4,0.95]),10000);
  let VU=0; for(let t=0;t<n;t++)VU+=cf*DF5[t]; VU+=res*DF5[n-1]; VU=rd(VU);
  const NV=rd(VU*R.pick([0.85,0.95,1.05]),10000);
  const imp= U<BV? BV-Math.max(NV,VU):0;
  return {q:P_(`減損の兆候がある資産グループ（帳簿価額${Y(BV)}円）について，今後${n}年間の使用により毎年末${Y(cf)}円のキャッシュ・フローが生じ，${n}年後の処分時に${Y(res)}円が見込まれる。正味売却価額は${Y(NV)}円である。割引率5%の現価係数は，1年${DF5[0]}，2年${DF5[1]}，3年${DF5[2]}，4年${DF5[3]}，5年${DF5[4]}とする。計上すべき減損損失はいくらか（円未満四捨五入。認識されない場合は0円）。`),
    a:imp,u:'円',w: imp? [BV-U,BV-Math.min(NV,VU),BV-NV,BV-VU,0].filter(x=>x!==imp&&x>=0):[BV-Math.max(NV,VU)>0?BV-Math.max(NV,VU):10000,Math.abs(BV-NV)||20000,Math.abs(BV-VU)||30000,50000,rd(BV*0.1,10000)],
    ex:`割引前将来CF＝${Y(cf)}×${n}＋${Y(res)}＝${Y(U)} ${U<BV?'＜':'≧'} 帳簿価額${Y(BV)} → 減損損失を${U<BV?'認識する':'認識しない'}。<br>${U<BV?`使用価値＝${Y(VU)}，正味売却価額${Y(NV)}のいずれか高い方＝回収可能価額${Y(Math.max(NV,VU))}<br>減損損失＝${Y(BV)}－${Y(Math.max(NV,VU))}＝<b>${Y(imp)}円</b>`:'よって<b>0円</b>'}`};
}});

C({id:'fa-tax-effect',f:FA,ch:'第17章 税金及び税効果会計',t:'繰延税金資産と法人税等調整額',r:'A',g(){
  const t=R.pick([30,35]); const a0=R.int(1,10)*10000, a1=R.int(1,10)*10000, b0=R.int(5,30)*10000, b1=b0+R.int(1,10)*10000, c0=R.int(10,40)*10000, c1=R.int(10,40)*10000, e=R.int(2,15)*10000;
  const dta1=(a1+b1+c1)*t/100, net=(a1+b1+c1-e)*t/100, adj=-((a1+b1+c1)-(a0+b0+c0))*t/100;
  const ask=R.pick(['bs','pl']);
  return {q:P_(`将来減算一時差異等の残高は次のとおりである（法定実効税率${t}%，繰延税金資産の回収可能性に問題はない）。${ask==='bs'?'当期末の貸借対照表に計上される繰延税金資産（繰延税金負債と相殺後）':'当期の法人税等調整額（借方はプラス，貸方は△で表示）'}はいくらか。`)+
    tbl([['貸倒引当金繰入限度超過額',a0,a1],['減価償却超過額',b0,b1],['賞与引当金',c0,c1],['その他有価証券評価差益（将来加算一時差異）','—',e]],['項目','期首','期末']),
    a: ask==='bs'?net:adj, u:'円', neg:true, w: ask==='bs'?[dta1,(a1+b1+c1+e)*t/100,(a1+b1+c1)-e,((a1+b1+c1)-(a0+b0+c0))*t/100]:[-adj,adj-e*t/100,((a1+b1+c1)-(a0+b0+c0)-e)*t/100*-1,-dta1],
    ex:`繰延税金資産（期末）＝(${Y(a1)}＋${Y(b1)}＋${Y(c1)})×${t}%＝${Y(dta1)}<br>繰延税金負債（その他有価証券）＝${Y(e)}×${t}%＝${Y(e*t/100)} → 相殺後${Y(net)}<br>法人税等調整額＝－(期末一時差異－期首一時差異)×${t}%＝${yen(adj)}（その他有価証券に係る税効果は評価差額金から控除し，法人税等調整額には含めない）<br>よって<b>${yen(ask==='bs'?net:adj)}円</b>`};
}});

C({id:'fa-bond-redeem',f:FA,ch:'第19章 社債',t:'社債の買入償還',r:'A',g(){
  const n=R.pick([5,10]); const F=R.int(2,10)*10000000; const pr=R.pick([96,97,98,98.5]); const P=F*pr/100; const y=R.int(1,n-2);
  const bv=P+(F-P)*y/n; const frac=R.pick([0.2,0.3,0.4,0.5]); const q=R.pick([97.5,98,98.8,99.2,99.5]);
  const paid=F*frac*q/100; const bvp=bv*frac; const gl=rd(bvp-paid);
  return {q:P_(`${y}年前の期首に社債（額面${Y(F)}円，償還期間${n}年）を額面100円につき${pr}円で発行し，償却原価法（定額法）を適用している。当期首に，このうち額面${Y(F*frac)}円を額面100円につき${q}円で買入償還した（利払日は期末のため経過利息はない）。社債償還損益はいくらか（償還益はプラス，償還損は△）。`),
    a:gl,u:'円',neg:true,w:[rd(P*frac-paid),rd(F*frac-paid),-gl,rd((P+(F-P)*(y+1)/n)*frac-paid)],
    ex:`買入時の償却原価（全体）＝${Y(P)}＋(${Y(F)}－${Y(P)})×${y}/${n}＝${Y(bv)}<br>償還部分：${Y(bv)}×${frac*100}%＝${Y(bvp)}，支払額${Y(paid)}<br>損益＝${Y(bvp)}－${Y(paid)}＝<b>${yen(gl)}円</b>`};
}});

C({id:'fa-retire',f:FA,ch:'第21章 退職給付会計',t:'退職給付費用と退職給付引当金',r:'A',g(){
  const PBO=R.int(50,200)*100000, A=R.int(20,Math.floor(PBO/100000)-10)*100000; const d=R.pick([1,1.5,2]); const e=R.pick([2,2.5,3,4]);
  const SC=R.int(10,40)*100000/10; const U=R.int(2,20)*100000; const yrs=10; const am=U/yrs;
  const cost=SC+PBO*d/100-A*e/100+am; const contrib=R.int(5,20)*100000/10;
  const beg=PBO-A-U; const end=beg+cost-contrib;
  const ask=R.pick(['退職給付費用','期末の退職給付引当金']);
  return {q:P_(`期首退職給付債務${Y(PBO)}円，期首年金資産${Y(A)}円，期首未認識数理計算上の差異（前期に発生した退職給付債務の見積差異・不利差異）${Y(U)}円である。割引率${d}%，長期期待運用収益率${e}%，当期勤務費用${Y(SC)}円，数理計算上の差異は発生年度の翌期から${yrs}年の定額法で費用処理する。当期の年金掛金拠出額は${Y(contrib)}円である（個別財務諸表）。${ask}はいくらか。`),
    a: ask==='退職給付費用'?cost:end, u:'円', w: ask==='退職給付費用'?[SC+PBO*d/100-A*e/100, SC+PBO*d/100+A*e/100+am, SC+PBO*e/100-A*d/100+am, cost+U-am, cost-contrib]:[end+U,beg+cost,PBO-A+cost-contrib,end-am,cost],
    ex:`退職給付費用＝勤務費用${Y(SC)}＋利息費用${Y(PBO*d/100)}－期待運用収益${Y(A*e/100)}＋差異の費用処理${Y(am)}＝${Y(cost)}<br>期首引当金＝${Y(PBO)}－${Y(A)}－未認識${Y(U)}＝${Y(beg)}<br>期末引当金＝${Y(beg)}＋${Y(cost)}－掛金${Y(contrib)}＝${Y(end)}<br>よって<b>${Y(ask==='退職給付費用'?cost:end)}円</b>`};
}});

C({id:'fa-aro',f:FA,ch:'第22章 資産除去債務',t:'資産除去債務',r:'A',g(){
  const n=R.pick([3,4,5]); const r=R.pick([1,2,3]); const f=Math.round(1/Math.pow(1+r/100,n)*10000)/10000;
  const Rm=R.int(5,30)*100000; const C0=n*R.int(10,60)*100000; const ARO=rd(Rm*f); const int1=rd(ARO*r/100); const dep=rd((C0+ARO)/n);
  const ask=R.pick(['当期の費用合計（減価償却費と利息費用）','期末の資産除去債務']);
  const ans= ask.startsWith('当期')? dep+int1 : ARO+int1;
  return {q:P_(`当期首に設備（取得原価${Y(C0)}円，耐用年数${n}年，残存価額ゼロ，定額法）を取得し使用を開始した。使用後の除去に${Y(Rm)}円を要すると見積られ，資産除去債務を計上する。割引率は${r}%，${n}年の現価係数は${f}とする。${ask}はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w: ask.startsWith('当期')?[rd(C0/n)+int1, dep, rd((C0+Rm)/n), dep+rd(Rm*r/100)]:[ARO, Rm, Rm+int1, rd(ARO*(1+r/100)*(1+r/100))],
    ex:`資産除去債務（当初）＝${Y(Rm)}×${f}＝${Y(ARO)}（同額を設備の帳簿価額に加算）<br>減価償却費＝(${Y(C0)}＋${Y(ARO)})÷${n}＝${Y(dep)}<br>利息費用＝${Y(ARO)}×${r}%＝${Y(int1)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-div-reserve',f:FA,ch:'第23章 純資産',t:'剰余金の配当と準備金の積立',r:'A',g(){
  const K=R.int(10,50)*1000000; const lim=K/4; const CR=rd(lim*R.pick([0.5,0.6,0.7,0.8]),100000); const LR=rd((lim-CR)*R.pick([0.3,0.5,0.7,0.9]),10000);
  const D=R.int(5,30)*100000; const room=lim-CR-LR; const ans=Math.min(D/10,room);
  return {q:P_(`株主総会でその他利益剰余金を財源とする剰余金の配当${Y(D)}円が決議された。配当直前の資本金は${Y(K)}円，資本準備金は${Y(CR)}円，利益準備金は${Y(LR)}円である。会社法の規定により積み立てるべき利益準備金の額はいくらか。`),
    a:ans,u:'円',w:[D/10,room,Math.max(D/10,room),lim-LR,D/4].filter(x=>x>0),
    ex:`配当額の1/10＝${Y(D/10)}<br>資本金の1/4－(資本準備金＋利益準備金)＝${Y(lim)}－${Y(CR+LR)}＝${Y(room)}<br>いずれか小さい額＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-treasury',f:FA,ch:'第23章 純資産',t:'自己株式の処分',r:'A',g(){
  const n1=R.int(2,8)*100, p1=R.int(50,150)*10, n2=n1, p2=p1+R.pick([-1,1])*R.int(1,4)*20; const avg=(p1+p2)/2; const k=R.int(1,(n1*2)/100-1)*100; const q=avg+R.pick([-1,1])*R.int(2,20)*10;
  const d=k*(q-avg);
  return {q:P_(`自己株式を${n1}株（＠${Y(p1)}円）及び${n2}株（＠${Y(p2)}円）取得した。その後，このうち${k}株を＠${Y(q)}円で処分し，払込金は当座預金とした（処分株式の帳簿価額は平均法による）。この処分によるその他資本剰余金の増減額はいくらか（増加はプラス，減少は△）。`),
    a:d,u:'円',neg:true,w:[k*(q-p1),k*(q-p2),-d,k*q],
    ex:`平均単価＝＠${Y(avg)}<br>自己株式処分差額＝${k}株×(＠${Y(q)}－＠${Y(avg)})＝<b>${yen(d)}円</b>（差益・差損ともその他資本剰余金で処理）`};
}});

C({id:'fa-distributable',f:FA,ch:'第24章 分配可能額',t:'分配可能額',r:'B',g(){
  const OC=R.int(5,40)*100000, OR=R.int(20,100)*100000, T=R.int(2,20)*100000; const ev=R.pick([-1,1])*R.int(1,10)*100000;
  const ans=OC+OR-T-(ev<0?-ev:0);
  return {q:P_(`最終事業年度の末日の貸借対照表（のれん・繰延資産はない）は，その他資本剰余金${Y(OC)}円，その他利益剰余金${Y(OR)}円，自己株式${Y(T)}円，その他有価証券評価差額金${yen(ev)}円（${ev<0?'借方残高':'貸方残高'}）である。最終事業年度の末日後の剰余金の変動及び自己株式の変動はない。分配可能額はいくらか。`),
    a:ans,u:'円',w:[OC+OR-T+(ev>0?ev:0)+(ev<0?0:0)+(ev<0?-ev:ev),OC+OR,OC+OR-T,OR-T-(ev<0?-ev:0),OC+OR-(ev<0?-ev:0)],
    ex:`剰余金＝その他資本剰余金＋その他利益剰余金＝${Y(OC+OR)}<br>－自己株式の帳簿価額${Y(T)}${ev<0?`－その他有価証券評価差額金（借方残高）${Y(-ev)}`:'（評価差額金が貸方残高の場合は加算しない）'}<br>＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-stock-option',f:FA,ch:'第25章 ストック・オプション等',t:'ストック・オプション（失効見込の変更）',r:'A',g(){
  const N=R.int(20,60); const m=R.pick([100,200]); const u=R.int(3,15)*80; const k1=R.int(1,5), k2=k1+R.int(1,4);
  const prior=rd(u*m*(N-k1)*9/24); const cum=rd(u*m*(N-k2)*21/24); const ans=cum-prior;
  return {q:P_(`×1年7月1日に従業員${N}名に対して1名当たり${m}個のストック・オプションを付与した（権利確定日×3年6月30日，公正な評価単価＠${Y(u)}円）。付与日時点の失効見込は${k1}名であったが，×2年度末（×3年3月31日）に失効見込を${k2}名に修正した。会計期間は4月1日から3月31日である。×2年度の株式報酬費用はいくらか。`),
    a:ans,u:'円',w:[rd(u*m*(N-k2)*12/24),rd(u*m*(N-k1)*12/24),cum,rd(u*m*N*12/24),rd(u*m*(N-k2)*12/21)],
    ex:`対象勤務期間は24か月。×1年度：＠${u}×${m}個×(${N}－${k1})名×9/24＝${Y(prior)}<br>×2年度末累計：＠${u}×${m}個×(${N}－${k2})名×21/24＝${Y(cum)}<br>当期費用＝${Y(cum)}－${Y(prior)}＝<b>${Y(ans)}円</b>（見積りの変更の影響は変更期に一括）`};
}});

C({id:'fa-fx-receivable',f:FA,ch:'第18章 外貨建取引',t:'外貨建売掛金の決済と期末換算',r:'A',g(){
  const X=R.int(2,20)*1000; const r1=R.int(130,150); const r2=r1+R.int(-6,6); const r3=r1+R.int(-8,8); const Yp=X*R.pick([0.3,0.5,0.6]);
  const gl=Yp*(r2-r1)+(X-Yp)*(r3-r1);
  return {q:P_(`当期中に商品を${Y(X)}ドルで掛販売した（販売時の直物為替相場1ドル＝${r1}円）。その後，売掛金のうち${Y(Yp)}ドルを回収した（回収時の相場${r2}円）。決算日の相場は${r3}円である。当期に計上される為替差損益はいくらか（差益はプラス，差損は△）。`),
    a:gl,u:'円',neg:true,w:[Yp*(r2-r1),(X-Yp)*(r3-r1),X*(r3-r1),-gl,(X-Yp)*(r3-r2)+Yp*(r2-r1)],
    ex:`決済分：${Y(Yp)}ドル×(${r2}－${r1})＝${yen(Yp*(r2-r1))}<br>期末換算分：${Y(X-Yp)}ドル×(${r3}－${r1})＝${yen((X-Yp)*(r3-r1))}<br>合計<b>${yen(gl)}円</b>`};
}});

C({id:'fa-fx-sub',f:FA,ch:'第18章 外貨建取引',t:'在外子会社の換算（為替換算調整勘定）',r:'A',g(){
  const K=R.int(5,30)*10000; const NI=R.int(1,10)*1000; const h=R.int(100,140); const a=h+R.int(-5,10); const c=h+R.int(-10,15);
  const cta=(K+NI)*c-K*h-NI*a;
  return {q:P_(`当期首に100%出資の在外子会社S社を設立した（資本金${Y(K)}ドル，出資時の為替相場1ドル＝${h}円）。当期のS社の当期純利益は${Y(NI)}ドル（期中平均相場${a}円で換算），配当はない。決算日の相場は${c}円である。連結貸借対照表に計上される為替換算調整勘定はいくらか（貸方残高はプラス，借方残高は△）。`),
    a:cta,u:'円',neg:true,w:[(K+NI)*c-(K+NI)*h,K*(c-h),NI*(c-a),-cta,(K+NI)*(c-a)],
    ex:`純資産の円換算額（資産・負債はCR）：(${Y(K)}＋${Y(NI)})×${c}＝${Y((K+NI)*c)}<br>資本金はHR：${Y(K)}×${h}＝${Y(K*h)}，利益剰余金はAR：${Y(NI)}×${a}＝${Y(NI*a)}<br>差額＝<b>${yen(cta)}円</b>`};
}});

C({id:'fa-rev-return',f:FA,ch:'第28章 収益認識',t:'返品権付きの販売',r:'B',g(){
  const n=R.int(10,50)*100, p=R.int(5,30)*100, c=rd(p*R.pick([0.6,0.7]),10), rate=R.pick([2,3,4,5]); const k=n*rate/100;
  const ask=R.pick(['売上高','返金負債','売上原価']);
  const ans= ask==='売上高'?(n-k)*p: ask==='返金負債'?k*p:(n-k)*c;
  return {q:P_(`商品${Y(n)}個を1個${Y(p)}円（原価${Y(c)}円）で現金販売した。顧客は30日以内であれば未使用の商品を返品できる。過去の実績から販売数量の${rate}%が返品されると見込まれる（変動対価の見積りは適切に行える）。販売時の${ask}はいくらか。`),
    a:ans,u:'円',w: ask==='売上高'?[n*p,(n-k)*(p-c),k*p,n*p-k*c]:ask==='返金負債'?[k*c,k*(p-c),n*p*rate/100/2,(n-k)*p]:[n*c,k*c,(n-k)*p,n*c-k*p],
    ex:`返品見込${k}個分は収益を認識せず返金負債とし，対応する原価は返品資産とする。<br>売上高＝${n-k}個×${p}＝${Y((n-k)*p)}，返金負債＝${k}個×${p}＝${Y(k*p)}，売上原価＝${n-k}個×${c}＝${Y((n-k)*c)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-rev-point',f:FA,ch:'第28章 収益認識',t:'カスタマー・ロイヤルティ・プログラム（ポイント）',r:'B',adv:true,g(){
  const S=R.int(10,50)*100000; const P=S/10; const use=R.pick([80,90]); const ssp=P*use/100;
  const liab=rd(S*ssp/(S+ssp)); const used=rd(ssp*R.pick([0.25,0.4,0.5])); const rec=rd(liab*used/ssp); const ans=S-liab+rec;
  return {q:P_(`当期に商品${Y(S)}円を現金販売し，購入額の10%のポイント（1ポイント＝1円の値引きに利用可能）を付与した。ポイントの使用見込率は${use}%であり，商品とポイントの独立販売価格の比率で取引価格を配分する。当期中に${Y(used)}ポイントが使用された（見込みに変更なし）。当期の売上高（ポイント使用分を含む）はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w:[S,S-liab,S-P+used,S-ssp+used,ans-rec+used],
    ex:`ポイントの独立販売価格＝${Y(P)}×${use}%＝${Y(ssp)}<br>ポイントへの配分（契約負債）＝${Y(S)}×${Y(ssp)}/(${Y(S)}＋${Y(ssp)})＝${Y(liab)}<br>当期使用分の収益＝${Y(liab)}×${Y(used)}/${Y(ssp)}＝${Y(rec)}<br>売上高＝(${Y(S)}－${Y(liab)})＋${Y(rec)}＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-construction',f:FA,ch:'第28章 収益認識',t:'工事契約（原価比例法・見積りの変更）',r:'B',g(){
  const V=R.int(20,80)*1000000; const E1=rd(V*R.pick([0.75,0.8,0.85]),100000); const c1=rd(E1*R.pick([0.2,0.3,0.4]),100000);
  const E2=E1+R.int(1,5)*1000000*R.pick([1,-1]); const c2=rd(E2*R.pick([0.3,0.35,0.4]),100000);

  return {q:P_(`工事契約（請負金額${Y(V)}円）について，一定の期間にわたり充足される履行義務として原価比例法により収益を認識する。前期の見積工事原価総額は${Y(E1)}円，前期発生原価は${Y(c1)}円であった。当期に見積工事原価総額を${Y(E2)}円に変更し，当期発生原価は${Y(c2)}円であった。当期の工事収益はいくらか（円未満四捨五入）。`),
    a:r2,u:'円',w:[rd(V*c2/E2),rd(V*c2/E1),rd(V*(c1+c2)/E2),rd(V*(c1+c2)/E1)-r1,rd(V*(c1+c2)/E2)-rd(V*c1/E2)],
    ex:`前期収益＝${Y(V)}×${Y(c1)}/${Y(E1)}＝${Y(r1)}<br>当期末累計＝${Y(V)}×(${Y(c1)}＋${Y(c2)})/${Y(E2)}＝${Y(r1+r2)}<br>当期収益＝${Y(r1+r2)}－${Y(r1)}＝<b>${Y(r2)}円</b>`};
}});

C({id:'fa-cons-goodwill',f:FA,ch:'第29章 連結会計',t:'資本連結（のれん・非支配株主持分）',r:'A',g(){
  const x=R.pick([60,70,80]); const K=R.int(10,50)*1000000; const RE=R.int(5,30)*1000000; const L=R.int(5,20)*1000000; const up=R.int(1,5)*1000000; const t=30;
  const diff=up*(100-t)/100; const NA=K+RE+diff; const I=rd(NA*x/100*R.pick([1.1,1.2,1.3]),1000000); const gw=I-NA*x/100;
  const NI=R.int(2,10)*1000000; const yrs=10;
  const ask=R.pick(['当期末ののれん','当期末の非支配株主持分','当期の非支配株主に帰属する当期純利益']);
  const ans= ask==='当期末ののれん'? gw-gw/yrs : ask==='当期末の非支配株主持分'? (NA+NI)*(100-x)/100 : NI*(100-x)/100;
  const w= ask==='当期末ののれん'? [gw, I-(K+RE)*x/100-(I-(K+RE)*x/100)/yrs, gw-gw/20, I-(NA)*x/100*1.0-diff*x/100]
     : ask==='当期末の非支配株主持分'? [NA*(100-x)/100,(K+RE+NI)*(100-x)/100,(K+RE+up+NI)*(100-x)/100,(NA+NI)*x/100]
     : [NI*x/100,(NI-gw/yrs)*(100-x)/100,NI,(NI)*(100-x)/100+gw/yrs];
  return {q:P_(`P社は前期末にS社株式の${x}%を${Y(I)}円で取得し，支配を獲得した。前期末のS社の資本金は${Y(K)}円，利益剰余金は${Y(RE)}円であり，S社保有の土地（帳簿価額${Y(L)}円）の時価は${Y(L+up)}円であった（評価差額に税効果30%を適用）。のれんは10年で定額法により償却する。当期のS社の当期純利益は${Y(NI)}円で，配当は行っていない。${ask}はいくらか。`),
    a:ans,u:'円',w,
    ex:`評価差額＝${Y(up)}×(1－30%)＝${Y(diff)}<br>支配獲得時の子会社資本＝${Y(K)}＋${Y(RE)}＋${Y(diff)}＝${Y(NA)}<br>のれん＝${Y(I)}－${Y(NA)}×${x}%＝${Y(gw)}，当期末＝${Y(gw)}－償却${Y(gw/yrs)}＝${Y(gw-gw/yrs)}<br>非支配株主持分（期末）＝(${Y(NA)}＋${Y(NI)})×${100-x}%＝${Y((NA+NI)*(100-x)/100)}<br>非支配株主に帰属する当期純利益＝${Y(NI)}×${100-x}%＝${Y(NI*(100-x)/100)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-cons-unreal',f:FA,ch:'第29章 連結会計',t:'未実現利益の消去（ダウン／アップストリーム）',r:'A',g(){
  const x=R.pick([60,70,80]); const p=R.pick([20,25]); const X=R.int(10,60)*100*(100+p)*10; const U=X*p/(100+p);
  const PN=R.int(30,90)*1000000, SN=R.int(5,30)*1000000; const up=R.chance(0.5);
  const ans= PN+SN*x/100-(up?U*x/100:U);
  return {q:P_(`P社はS社（持分比率${x}%）の親会社である。当期に${up?'S社がP社に':'P社がS社に'}商品を原価の${p}%増しで販売しており，${up?'P社':'S社'}の期末商品のうち${Y(X)}円はこの取引によるものである。当期の個別上の当期純利益はP社${Y(PN)}円，S社${Y(SN)}円である（のれん・税効果・期首未実現利益・配当はない）。連結損益計算書の親会社株主に帰属する当期純利益はいくらか。`),
    a:ans,u:'円',w:[PN+SN*x/100-U,PN+SN*x/100-U*x/100,PN+SN*x/100,PN+SN-U,PN+SN*x/100-X*p/100],
    ex:`未実現利益＝${Y(X)}×${p}/${100+p}＝${Y(U)}<br>${up?`アップストリームのため，未実現利益の消去額は持分比率に応じて親会社株主と非支配株主に負担させる：${Y(U)}×${x}%＝${Y(U*x/100)}`:'ダウンストリームのため全額を親会社株主が負担する。'}<br>${Y(PN)}＋${Y(SN)}×${x}%－${Y(up?U*x/100:U)}＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-equity-method',f:FA,ch:'持分法',t:'持分法による投資損益と投資勘定',r:'A',g(){
  const s=R.pick([20,25,30,40]); const NA=R.int(20,80)*1000000; const gw=R.int(1,5)*1000000; const I=NA*s/100+gw; const NI=R.int(4,20)*1000000; const D=R.int(1,4)*1000000;
  const inc=NI*s/100-gw/10; const end=I+inc-D*s/100;
  const ask=R.pick(['持分法による投資損益','期末の投資有価証券（A社株式）']);
  return {q:P_(`前期末にA社株式の${s}%を${Y(I)}円で取得し，持分法を適用した（取得時のA社の純資産${Y(NA)}円，資産・負債の時価と簿価の差異なし）。のれん相当額は10年で均等償却する。当期のA社の当期純利益は${Y(NI)}円，支払った配当金は${Y(D)}円である。連結財務諸表上の${ask}はいくらか（益はプラス，損は△）。`),
    a: ask.startsWith('持分法')?inc:end, u:'円', neg:true, w: ask.startsWith('持分法')?[NI*s/100,inc-D*s/100,NI*s/100+gw/10,NI*s/100-gw]:[I+NI*s/100-D*s/100,I+inc,I+inc-D,I],
    ex:`のれん相当額＝${Y(I)}－${Y(NA)}×${s}%＝${Y(gw)} → 償却${Y(gw/10)}<br>持分法による投資損益＝${Y(NI)}×${s}%－${Y(gw/10)}＝${Y(inc)}<br>受取配当金${Y(D*s/100)}は投資の払戻しとして投資勘定を減額（受取配当金を消去）<br>期末投資＝${Y(I)}＋${Y(inc)}－${Y(D*s/100)}＝${Y(end)}<br>よって<b>${yen(ask.startsWith('持分法')?inc:end)}円</b>`};
}});

C({id:'fa-merger',f:FA,ch:'企業結合・事業分離',t:'合併（のれんの算定）',r:'A',g(){
  const n=R.int(2,10)*10000; const p=R.int(40,120)*10; const FA_=R.int(50,200)*1000000; const FL=R.int(10,Math.floor(FA_/1000000)-10)*1000000;
  const cons=n*p; const gw=cons-(FA_-FL); const fee=R.int(1,5)*1000000; const bvNA=FA_-FL-R.int(1,8)*1000000;
  return {q:P_(`A社（取得企業）はB社を吸収合併し，B社の株主にA社株式${Y(n)}株（企業結合日の時価＠${Y(p)}円）を交付した。企業結合日のB社の資産の時価は${Y(FA_)}円，負債の時価は${Y(FL)}円（純資産の帳簿価額は${Y(bvNA)}円）である。合併に際し外部のアドバイザーに${Y(fee)}円を支払った。合併により計上されるのれん（負ののれんの場合は△）はいくらか。`),
    a:gw,u:'円',neg:true,w:[gw+fee,cons-bvNA,-gw,cons-FA_,gw-fee],
    ex:`取得原価＝交付株式の時価${Y(n)}×＠${p}＝${Y(cons)}（取得関連費用${Y(fee)}は発生時の費用であり取得原価に含めない）<br>識別可能純資産の時価＝${Y(FA_)}－${Y(FL)}＝${Y(FA_-FL)}<br>のれん＝${Y(cons)}－${Y(FA_-FL)}＝<b>${yen(gw)}円</b>${gw<0?'（負ののれん発生益として特別利益）':''}`};
}});

C({id:'fa-oci',f:FA,ch:'包括利益',t:'包括利益の算定',r:'A',g(){
  const NI=R.int(50,300)*100000; const e0=R.int(-20,40)*100000, e1=R.int(-20,40)*100000; const c0=R.int(-10,20)*100000, c1=R.int(-10,20)*100000;
  const oci=(e1-e0)+(c1-c0); const ask=R.pick(['包括利益','その他の包括利益']);

  return {q:P_(`連結財務諸表における当期純利益は${Y(NI)}円である。その他有価証券評価差額金（税効果控除後）は期首${yen(e0)}円・期末${yen(e1)}円，為替換算調整勘定は期首${yen(c0)}円・期末${yen(c1)}円であった（△は借方残高）。当期中にその他有価証券の一部を売却しており，組替調整額が生じている。${ask}はいくらか（△はマイナス）。`),
    a:ans,u:'円',neg:true,w: ask==='包括利益'?[NI+e1+c1,NI+(e1-e0),NI-oci,NI]:[e1+c1,e1-e0,-oci,NI+oci],
    ex:`その他の包括利益は，その他の包括利益累計額の当期変動額に一致する（組替調整額は変動額の内訳にすぎない）。<br>(${yen(e1)}－${yen(e0)})＋(${yen(c1)}－${yen(c0)})＝${yen(oci)}<br>包括利益＝当期純利益${Y(NI)}＋${yen(oci)}＝${yen(NI+oci)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'fa-cf-sales',f:FA,ch:'キャッシュ・フロー計算書',t:'営業収入（直接法）',r:'B',g(){
  const S=R.int(300,900)*100000; const b0=R.int(20,60)*100000,b1=R.int(20,60)*100000,n0=R.int(5,30)*100000,n1=R.int(5,30)*100000,w=R.int(1,5)*100000,a0=R.int(1,5)*100000,a1=R.int(1,5)*100000;
  const ans=S+(b0+n0)-(b1+n1)-w+(a1-a0);

    a:ans,u:'円',w:[ans+w,S+(b0+n0)-(b1+n1),ans-(a1-a0)*2,S-(b0+n0)+(b1+n1)-w,ans-w],
    ex:`営業収入＝売上高＋売上債権の減少(期首－期末)－貸倒れによる債権の減少＋前受金の増加<br>${Y(S)}＋(${Y(b0+n0)}－${Y(b1+n1)})－${Y(w)}＋(${Y(a1)}－${Y(a0)})＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-cf-indirect',f:FA,ch:'キャッシュ・フロー計算書',t:'営業CFの小計（間接法）',r:'B',g(){
  const X=R.int(50,300)*100000, dep=R.int(10,60)*100000, al=R.int(1,5)*100000, ii=R.int(1,5)*100000, ie=R.int(1,5)*100000, gs=R.int(1,10)*100000, ar=R.int(-20,20)*100000, inv=R.int(-20,20)*100000, ap=R.int(-20,20)*100000;

(()=>{

C({id:'q-fa-cash-overshort',f:FA,ch:'第1章 現金預金',t:'現金過不足（外国通貨・先日付小切手・未記帳の通貨代用証券）',r:'A',g(){
  const J=R.int(30,60)*10000, D=R.int(5,20)*100, HR=R.int(100,125), CR=HR+R.pick([-5,-4,-3,3,4,5,6,8]);
  const a=R.int(1,6)*10000, b=R.int(1,4)*10000, c=R.int(1,3)*5000, s1=R.int(1,5)*1000, s2=R.int(2,15)*1000;
  const d=R.int(5,20)*1000, due=R.int(1,5)*5000, fut=R.int(2,12)*5000, e=due+fut;
  const x=R.int(20,60)*1000, y=x+R.pick([9000,10000,18000,1000*R.int(1,9)]);
  const Z=R.pick([-1,1])*R.int(1,12)*1000, fx=D*(CR-HR);
  const actual=J+D*CR+a+d+due;
  const K=actual-Z-fx+b+c+s1+s2-d-due-(y-x);
  if(K<=0) throw 0;
  const ask=R.pick(['z','bs']);
  const q=P_(`${FY}決算日における現金の帳簿残高は${Y(K)}円である。決算にあたり現金の実際有高を調べたところ，次の事実が判明した。${ask==='z'?'現金過不足のうち原因不明分を雑損または雑益として処理する場合，その金額はいくらか（雑益はプラス，雑損は△で表示）。':'貸借対照表に計上される現金の金額はいくらか。'}`)+
    `<p>(1) 手許の通貨：日本円${Y(J)}円，米ドル${Y(D)}ドル（1ドル＝${HR}円で換算して記帳済み。決算日の為替相場は1ドル＝${CR}円）<br>(2) 現金として記帳済みのもの：得意先A社振出の小切手${Y(a)}円（振出日は3月25日），得意先B社振出の小切手${Y(b)}円（振出日は翌期4月5日），得意先C社から受け取った当社振出の小切手${Y(c)}円，郵便切手${Y(s1)}円，収入印紙${Y(s2)}円<br>(3) 未記帳のもの：株式配当金領収証${Y(d)}円，公社債の利札${Y(e)}円（うち${Y(fut)}円は期限未到来）<br>(4) 期中に販売費${Y(x)}円を現金で支払った際，誤って${Y(y)}円と記帳していた。</p>`;
  const book=K+fx-b-c-s1-s2+d+due+(y-x);
  const ex=`① 修正後の帳簿残高：${Y(K)}＋外貨換算替${sg(fx)}（${Y(D)}ドル×(${CR}－${HR})）－先日付小切手${Y(b)}（受取手形）－自己振出小切手${Y(c)}（当座預金）－切手・印紙${Y(s1+s2)}（貯蔵品）＋配当金領収証${Y(d)}＋期限到来済利札${Y(due)}＋誤記入修正${Y(y-x)}＝${Y(book)}<br>② 現金実査額：${Y(J)}＋${Y(D)}ドル×${CR}＝${Y(D*CR)}＋A社小切手${Y(a)}＋${Y(d)}＋${Y(due)}＝${Y(actual)}<br>③ 雑損益：${Y(actual)}－${Y(book)}＝${sg(Z)}（${Z>0?'雑益':'雑損'}）<br>`+
    (ask==='z'?`よって<b>${sg(Z)}円</b>`:`貸借対照表の現金は実査額の<b>${Y(actual)}円</b>`)+`<br>※期限未到来の利札・先日付小切手・自己振出小切手・切手・印紙は現金に含めない。`;
  return ask==='z'?{q,a:Z,u:'円',neg:true,w:[Z+fx,Z-fx,Z+(y-x),-Z,Z+s1+s2,Z-(y-x)],ex}
    :{q,a:actual,u:'円',w:[actual+b,actual+c,actual+fut,actual+s1+s2,actual-fx,actual-d,book-(y-x)],ex};
}});

C({id:'q-fa-cash-bs',f:FA,ch:'第1章 現金預金',t:'現金及び預金の貸借対照表価額（小口現金・当座借越・長期性預金）',r:'A',g(){
  const C0=R.int(300,900), P=R.int(10,30)*10, u=R.int(2,9)*10, K1=R.int(2000,6000), m=R.int(100,500), p=R.int(20,90), w=R.int(50,300), L=R.int(100,600), T1=R.int(5,20)*100, T2=R.int(5,20)*100;
  const corr=K1+m-p, bank=corr+w; const ans=C0+(P-u)+corr+T1;
  const q=P_(`${FY}次の〔資料〕に基づき，当期末の貸借対照表の流動資産に「現金及び預金」として計上される金額を求めなさい（単位：千円）。`)+
   `<p>1．金庫の現金実査額は${Y(C0)}千円であり，帳簿残高と一致している。<br>2．小口現金は定額資金前渡制（前渡額${Y(P)}千円）を採用している。3月中に用度係が交通費${Y(u)}千円を支払っていたが，決算日までに報告されておらず未処理である。<br>3．X銀行の当座預金の帳簿残高は${Y(K1)}千円，銀行残高証明書の残高は${Y(bank)}千円である。不一致の原因は次のとおり。<br>　(1) 買掛金支払のために作成した小切手${Y(m)}千円が未渡しのまま金庫に保管されていた。<br>　(2) 通信費${Y(p)}千円が当座預金から引き落とされていたが，未通知であった。<br>　(3) 仕入先に振り出した小切手${Y(w)}千円が，銀行に未呈示であった。<br>4．Y銀行の当座預金勘定は${Y(L)}千円の貸方残高となっている（当座借越契約を締結済み）。<br>5．定期預金は2口ある。A口${Y(T1)}千円（満期日は翌年9月30日），B口${Y(T2)}千円（満期日は翌々年6月30日）。</p>`;
  return {q,a:ans,u:'千円',w:[ans+T2,ans-L,ans-corr+bank,ans-m,ans+p,ans+u,ans-T1],
    ex:`現金${Y(C0)}＋小口現金(${Y(P)}－${Y(u)})＝${Y(P-u)}＋X銀行当座預金(${Y(K1)}＋未渡小切手${Y(m)}－未通知引落${Y(p)})＝${Y(corr)}＋定期預金A口${Y(T1)}＝<b>${Y(ans)}千円</b><br>未取付小切手${Y(w)}は銀行側の調整項目（当社の修正不要）。Y銀行の貸方残高は当座借越として短期借入金に表示し相殺しない。B口は1年基準により長期性預金（投資その他の資産）となる。`};
}});

/* ---------- 第2章 金融商品会計 ---------- */
C({id:'q-fa-sec-current',f:FA,ch:'第9章 有価証券',t:'流動資産の有価証券（修正受渡日基準・1年基準）',r:'A',g(){

  const d0=R.int(1500,2500), d1=d0-R.int(100,700), e0=R.int(1000,1800), e1=e0+R.int(-200,400);
