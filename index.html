['信頼性は中立性のみによって支えられており，検証可能性や表現の忠実性はその構成要素ではない。','信頼性は中立性・検証可能性・表現の忠実性によって支えられている。']]});

T({id:'fat-segment',f:FT,ch:'第14章 セグメント情報等の開示',t:'セグメント情報等の開示',r:'A',
T:['セグメント情報の開示は，マネジメント・アプローチに基づき，経営者が経営上の意思決定や業績評価のために設定した事業単位を基礎として行われる。',
'報告セグメントの利益（又は損失）などの額は，最高経営意思決定機関に報告される金額に基づいて開示する。',
'売上高（事業セグメント間の内部売上高等を含む）がすべての事業セグメントの売上高合計の10%以上である事業セグメントは，報告セグメントとしなければならない。',
'報告セグメントの外部顧客への売上高の合計額が連結損益計算書の売上高の75%未満である場合には，75%以上となるまで報告セグメントを追加して識別しなければならない。',
'セグメント情報等の開示において，関連情報として，製品及びサービスに関する情報，地域に関する情報，主要な顧客に関する情報を開示する。'],
F:[['セグメント情報は，財務諸表の作成に用いた会計方針と同一の会計方針で測定した金額でなければならない。','経営者に報告される金額に基づいて開示し，財務諸表計上額との差異は調整表で説明する。'],
['事業セグメントは，製品・サービスの種類や地域など，比較しやすい画一的な基準により区分しなければならない。','マネジメント・アプローチにより，企業の内部組織に基づいて区分する。'],
['量的基準の判定における売上高には，事業セグメント間の内部売上高や振替高は含めない。','量的基準の売上高には内部売上高・振替高を含める。'],
['報告セグメントに含まれない事業セグメントについては，何らの情報も開示する必要はない。','「その他」の区分に一括して開示する。'],
['連結財務諸表でセグメント情報を開示している場合でも，個別財務諸表において同様のセグメント情報を開示しなければならない。','連結財務諸表で開示している場合，個別財務諸表での開示は要しない。']]});

T({id:'fat-related',f:FT,ch:'第15章 関連当事者の開示',t:'関連当事者の開示',r:'A',
T:['関連当事者の開示は，会社と関連当事者との取引が財政状態や経営成績に及ぼす影響を，財務諸表利用者が把握できるようにするために行われる。',
'関連当事者には，親会社，子会社，関連会社のほか，当該会社の役員及びその近親者，主要株主などが含まれる。',
'一般競争入札による取引や，預金利息・配当の受取りなど取引条件が一般の取引と同様であることが明白な取引は，開示対象外とされる。',
'役員に対する報酬・賞与及び退職慰労金の支払いは，関連当事者との取引として開示する必要はない。',
'連結財務諸表の作成にあたって相殺消去した取引は，関連当事者との取引の開示対象外である。'],
F:[['主要株主とは，自己又は他人の名義をもって総株主の議決権の20%以上を保有している株主をいう。','主要株主は議決権の10%以上を保有している株主をいう。'],
['役員の近親者（二親等以内の親族）は関連当事者に含まれない。','役員の近親者も関連当事者に含まれる。'],
['連結財務諸表上相殺消去された連結会社間の取引も，関連当事者との取引として開示しなければならない。','相殺消去した取引は開示対象外である。'],
['親会社が存在していても，当期に親会社との取引がなければ，親会社に関する情報を注記する必要はない。','親会社が存在する場合には，取引の有無にかかわらず親会社の名称等を注記する。'],
['関連当事者との取引であっても，その取引条件が第三者との取引と同様である場合には，すべて開示を要しない。','開示対象外となるのは，取引条件が一般と同様であることが明白な一定の取引に限られる。']]});

T({id:'fat-investprop',f:FT,ch:'第16章 賃貸等不動産の時価等の開示',t:'賃貸等不動産の時価等の開示',r:'B',
T:['賃貸等不動産とは，棚卸資産に分類されている不動産以外のものであって，賃貸収益又はキャピタル・ゲインの獲得を目的として保有されている不動産をいう。',
'賃貸等不動産を保有している場合，その概要，貸借対照表計上額及び期中における主な変動，当期末における時価及びその算定方法等を注記する。',
'将来において賃貸等不動産として使用される予定で開発中の不動産は，賃貸等不動産に含まれる。',
'賃貸等不動産の総額に重要性が乏しい場合には，注記を省略することができる。'],
F:[['賃貸等不動産は，貸借対照表において時価をもって計上し，評価差額は当期の損益とする。','貸借対照表上は取得原価を基礎として計上し，時価は注記で開示する。'],
['棚卸資産に分類されている販売用不動産も，賃貸等不動産の時価等の注記の対象となる。','棚卸資産に分類されている不動産は除かれる。'],
['将来の使用が見込まれていない遊休不動産は，賃貸収益を生んでいないため賃貸等不動産に含まれない。','将来の使用が見込まれていない遊休不動産は賃貸等不動産に含まれる。'],
['賃貸等不動産の時価の注記において，時価の算定方法を記載する必要はない。','時価の算定方法も注記事項である。']]});

T({id:'fat-eps',f:FT,ch:'第20章 1株当たり当期純利益に関する会計基準',t:'1株当たり当期純利益',r:'B',
T:['1株当たり当期純利益は，普通株式に係る当期純利益を普通株式の期中平均株式数で除して算定する。',
'普通株式の期中平均株式数の算定にあたっては，期中平均自己株式数を控除する。',
'当期に株式分割が行われた場合には，表示する財務諸表のうち最も古い期間の期首に株式分割が行われたと仮定して期中平均株式数を算定する。',
'潜在株式が希薄化効果を有する場合には，潜在株式調整後1株当たり当期純利益を開示する。',
'普通株式に係る当期純利益の算定上，優先配当額など普通株主に帰属しない金額は損益計算書上の当期純利益から控除する。'],
F:[['1株当たり当期純損失の場合であっても，潜在株式調整後1株当たり当期純利益を開示しなければならない。','1株当たり当期純損失の場合は，潜在株式調整後1株当たり当期純利益を開示しない。'],
['期中に株式分割が行われた場合は，分割日以降についてのみ株式数を増加させて期中平均株式数を算定する。','表示する最も古い期間の期首に分割が行われたと仮定して算定する。'],
['潜在株式調整後1株当たり当期純利益が1株当たり当期純利益を上回る場合でも，これを開示しなければならない。','その場合は希薄化効果がないため開示しない。'],
['1株当たり当期純利益の算定における株式数は，期末の発行済株式数による。','期中平均株式数による。'],
['1株当たり純資産額は，期中平均の普通株式の発行済株式数を用いて算定する。','1株当たり純資産額は，期末の普通株式の発行済株式数から期末の自己株式数を控除した株式数で算定する。']]});

T({id:'fat-impair',f:FT,ch:'固定資産の減損に係る会計基準',t:'固定資産の減損',r:'A',
T:['減損処理は，資産の収益性の低下により投資額の回収が見込めなくなった場合に，一定の条件の下で回収可能性を反映させるように帳簿価額を減額する会計処理である。',
'減損の兆候がある資産又は資産グループについて，割引前将来キャッシュ・フローの総額が帳簿価額を下回る場合には，減損損失を認識する。',
'回収可能価額とは，資産又は資産グループの正味売却価額と使用価値のいずれか高い方の金額をいう。',
'減損処理を行った資産については，減損損失の戻入れは行わない。',
'減損損失の認識の判定における割引前将来キャッシュ・フローの見積期間は，資産の経済的残存使用年数（又は主要な資産の経済的残存使用年数）と20年のいずれか短い方とする。',
'減損処理を行った資産の減価償却は，減損損失を控除した帳簿価額に基づいて行う。'],
F:[['回収可能価額とは，正味売却価額と使用価値のいずれか低い方の金額をいう。','いずれか高い方の金額である。'],
['減損損失の認識の判定には，将来キャッシュ・フローを割り引いた現在価値を用いる。','認識の判定には割引前将来キャッシュ・フローを用いる（測定には使用価値等を用いる）。'],
['減損処理後に回収可能価額が回復した場合には，減損損失を戻し入れる。','日本基準では減損損失の戻入れは行わない。'],
['減損の兆候の有無にかかわらず，すべての固定資産について毎期減損損失の認識の判定を行わなければならない。','認識の判定は，減損の兆候がある場合に行う。'],
['減損損失は，原則として営業外費用に計上する。','減損損失は原則として特別損失とする。']]});

T({id:'fat-rd',f:FT,ch:'研究開発費等に係る会計基準',t:'研究開発費・ソフトウェア',r:'B',
T:['研究開発費は，すべて発生時に費用として処理しなければならない。',
'市場販売目的のソフトウェアについて，最初に製品化された製品マスターの完成までの費用は研究開発費として処理する。',
'市場販売目的のソフトウェアの製品マスター完成後の機能の改良・強化に要した費用は，著しい改良と認められるものを除き，資産に計上する。',
'自社利用のソフトウェアについて，将来の収益獲得又は費用削減が確実であると認められる場合には，取得に要した費用を無形固定資産として計上する。',
'研究開発費には，人件費，原材料費，固定資産の減価償却費及び間接費の配賦額等，研究開発のために費消されたすべての原価が含まれる。'],
F:[['研究開発費は，将来の収益獲得が確実であると認められる場合には資産計上することができる。','研究開発費はすべて発生時に費用処理する。'],
['市場販売目的のソフトウェアの制作費は，製品マスターの完成前後を問わずすべて研究開発費として処理する。','製品マスター完成後の制作費（著しい改良を除く）は資産計上する。'],
['市場販売目的のソフトウェアの見込有効期間は，原則として5年以内とする。','原則として3年以内とする。'],
['自社利用のソフトウェアの償却は，見込販売数量に基づく方法によらなければならない。','自社利用のソフトウェアは一般に定額法（原則5年以内）で償却する。'],
['研究開発費には，研究開発に使用する固定資産の減価償却費は含まれない。','固定資産の減価償却費も研究開発費に含まれる。']]});

T({id:'fat-retire',f:FT,ch:'第24章 退職給付に関する会計基準',t:'退職給付会計',r:'A',
T:['退職給付債務は，退職給付見込額のうち期末までに発生していると認められる額を割り引いて計算する。',
'退職給付見込額の期間帰属方法として，期間定額基準と給付算定式基準の選択適用が認められている。',
'数理計算上の差異及び過去勤務費用は，原則として平均残存勤務期間以内の一定の年数で按分した額を毎期費用処理する。',
'連結財務諸表上，未認識数理計算上の差異及び未認識過去勤務費用は，税効果を調整のうえ，その他の包括利益累計額（退職給付に係る調整累計額）に計上する。',
'年金資産の額が退職給付債務を超える場合には，個別財務諸表上は前払年金費用，連結財務諸表上は退職給付に係る資産として計上する。',
'割引率は，安全性の高い債券の利回りを基礎として決定する。'],
F:[['連結財務諸表上も個別財務諸表と同様に，未認識数理計算上の差異は貸借対照表に計上されない。','連結上は即時認識し，退職給付に係る負債（資産）とその他の包括利益累計額に反映する。'],
['期待運用収益は，期末の年金資産の額に長期期待運用収益率を乗じて計算する。','期首の年金資産の額に長期期待運用収益率を乗じて計算する。'],
['退職給付見込額の期間帰属方法は，給付算定式基準のみが認められている。','期間定額基準と給付算定式基準の選択適用である。'],
['割引率は，企業の借入利子率を基礎として決定する。','安全性の高い債券の利回りを基礎として決定する。'],
['過去勤務費用とは，年金資産の期待運用収益と実際の運用成果との差異をいう。','それは数理計算上の差異である。過去勤務費用は退職給付水準の改訂等に起因して発生した退職給付債務の増減部分をいう。']]});

T({id:'fat-aro',f:FT,ch:'資産除去債務に関する会計基準',t:'資産除去債務',r:'B',
T:['資産除去債務は，有形固定資産の取得，建設，開発又は通常の使用によって発生した時に負債として計上する。',
'資産除去債務に対応する除去費用は，資産除去債務を負債として計上した時に，当該負債の計上額と同額を関連する有形固定資産の帳簿価額に加える。',
'時の経過による資産除去債務の調整額は，その発生時の費用として処理し，関連する有形固定資産の減価償却費と同じ区分に含めて計上する。',
'資産除去債務の算定に用いる割引率は，貨幣の時間価値を反映した無リスクの税引前の利率とする。',
'割引前将来キャッシュ・フローの見積りの変更による調整額は，資産除去債務の帳簿価額及び関連する有形固定資産の帳簿価額に加減して処理する。'],
F:[['資産除去債務の算定に用いる割引率は，企業の信用リスクを反映した利率とする。','無リスクの税引前の利率を用いる。'],
['除去費用は，有形固定資産の除去時に一括して費用処理する。','除去費用は資産計上し，減価償却を通じて各期に費用配分する。'],
['資産除去債務を合理的に見積ることができない場合でも，概算額で負債計上しなければならない。','合理的に見積ることができない場合は計上せず，その旨等を注記する。'],
['時の経過による資産除去債務の調整額は，営業外費用（支払利息）として処理する。','減価償却費と同じ区分に計上する。'],
['割引前将来キャッシュ・フローが増加した場合，その増加部分には負債計上時の割引率を適用する。','増加部分にはその時点の割引率を，減少部分には負債計上時の割引率を適用する。']]});

T({id:'fat-equity',f:FT,ch:'第26章 資本会計',t:'純資産の部・自己株式',r:'A',
T:['純資産の部は，株主資本と株主資本以外の各項目に区分される。',
'自己株式の取得原価は，純資産の部の株主資本の末尾に控除する形式で表示する。',
'自己株式処分差益は，その他資本剰余金に計上する。',
'自己株式処分差損によりその他資本剰余金の残高が負となった場合には，会計期間末においてその他資本剰余金をゼロとし，負の値をその他利益剰余金（繰越利益剰余金）から減額する。',
'自己株式の取得，処分及び消却に関する付随費用は，損益計算書の営業外費用に計上する。',
'新株予約権は，権利行使の有無が確定するまでの間，純資産の部に株主資本以外の項目として計上する。'],
F:[['自己株式は，有価証券として資産の部に計上する。','自己株式は株主資本から控除する。'],
['自己株式処分差損は，営業外費用として処理する。','その他資本剰余金から減額する。'],
['自己株式の取得に要した付随費用は，自己株式の取得原価に含める。','付随費用は営業外費用とする。'],
['自己株式を消却した場合には，消却の対象となった自己株式の帳簿価額を資本金から減額する。','その他資本剰余金から減額する。'],
['資本準備金を減少させて生じた剰余金は，その他利益剰余金に計上する。','その他資本剰余金に計上する（資本剰余金と利益剰余金の混同の禁止）。']]});

T({id:'fat-so',f:FT,ch:'第27章 ストック・オプション等に関する会計基準',t:'ストック・オプション',r:'A',
T:['従業員等に付与したストック・オプションは，その取得に応じて費用として計上し，対応する金額を，権利の行使又は失効が確定するまでの間，純資産の部に新株予約権として計上する。',
'ストック・オプションの公正な評価単価は付与日現在で算定し，条件変更の場合を除き，その後は見直さない。',
'ストック・オプション数は，権利不確定による失効の見積数を控除して算定し，重要な変動が生じた場合には見直す。',
'権利確定日後に権利不行使による失効が生じた場合には，失効に対応する新株予約権の額を，失効が確定した期の利益として計上する。',
'未公開企業では，公正な評価単価に代えて，単位当たりの本源的価値の見積りに基づいて会計処理を行うことができる。'],
F:[['ストック・オプションの公正な評価単価は，毎期末の株価に基づいて見直す。','付与日現在で算定し，原則として見直さない。'],
['権利不確定による失効の見積数を見直した場合，その影響は将来の期間にわたって配分する。','見直し後の数に基づく累計額と既計上額との差額を，見直した期の損益として計上する。'],
['ストック・オプションに係る費用は，付与日に一括して計上する。','対象勤務期間を基礎とする方法等により各期に配分して計上する。'],
['条件変更により公正な評価単価が付与日の公正な評価単価を下回った場合には，条件変更後の公正な評価単価に基づいて費用を計上する。','下回る場合は，付与日の公正な評価単価に基づく費用計上を継続する。'],
['権利確定日後に権利不行使による失効が生じた場合には，過去に計上した株式報酬費用を戻し入れて修正する。','過去の費用は修正せず，失効に対応する新株予約権の額を失効確定期の利益（新株予約権戻入益）とする。']]});

T({id:'fat-fx',f:FT,ch:'第28章 外貨建取引等会計処理基準',t:'外貨建取引・在外子会社の換算',r:'A',
T:['外貨建取引は，原則として当該取引発生時の為替相場による円換算額をもって記録する。',
'外国通貨及び外貨建金銭債権債務（外貨預金を含む）には，決算時の為替相場による円換算額を付す。',
'外貨建の満期保有目的の債券は決算時の為替相場による円換算額を付し，償却原価法の償却額は期中平均相場により円換算する。',
'外貨建の子会社株式及び関連会社株式には，取得時の為替相場による円換算額を付す。',
'在外子会社の資産及び負債は決算時の為替相場により，親会社による株式取得時における資本に属する項目は株式取得時の為替相場により円換算する。',
'在外子会社の換算によって生じた換算差額は，為替換算調整勘定として純資産の部に記載する。'],
F:[['外貨建の子会社株式には，決算時の為替相場による円換算額を付す。','取得時の為替相場による。'],
['外貨建その他有価証券の換算差額は，すべて当期の為替差損益として処理する。','原則として評価差額に含めて純資産の部に計上する（債券については為替差損益処理も可）。'],
['在外子会社の収益及び費用は，必ず決算時の為替相場により換算しなければならない。','原則として期中平均相場により換算する（決算時の為替相場も可）。'],
['在外子会社の換算によって生じた換算差額は，当期の為替差損益として損益計算書に計上する。','為替換算調整勘定として純資産の部に計上する。'],
['外貨建取引に係る前払金・前受金は，決算時の為替相場で換算替えを行う。','前払金・前受金は非貨幣性項目であり，換算替えを行わない。']]});

T({id:'fat-tax',f:FT,ch:'第29章 税効果会計に係る会計基準',t:'税効果会計',r:'A',
T:['税効果会計は，法人税等の額を適切に期間配分することにより，税引前当期純利益と法人税等を合理的に対応させることを目的とする。',
'一時差異とは，貸借対照表に計上されている資産及び負債の金額と課税所得計算上の資産及び負債の金額との差額をいう。',
'繰延税金資産及び繰延税金負債の金額は，回収又は支払が行われると見込まれる期の税率に基づいて計算する（資産負債法）。',
'繰延税金資産は投資その他の資産の区分に，繰延税金負債は固定負債の区分に表示する。',
'交際費の損金不算入額のような永久差異は，税効果会計の対象とならない。',
'税務上の繰越欠損金は，一時差異と同様に取り扱う（一時差異等）。'],
F:[['繰延税金資産は，関連する資産・負債の分類に基づいて流動資産と固定資産に区分して表示する。','現行基準ではすべて投資その他の資産（負債は固定負債）に表示する。'],
['繰延税金資産及び負債の計算には，一時差異が発生した年度の税率を用いる（繰延法）。','回収・支払が見込まれる期の税率を用いる資産負債法による。'],
['永久差異も将来の課税所得に影響するため，税効果会計の対象となる。','永久差異は将来解消しないため対象外である。'],
['その他有価証券の評価差額に係る税効果額は，法人税等調整額として損益計算書に計上する。','評価差額から直接控除し，法人税等調整額は計上しない。'],
['繰延税金資産と繰延税金負債は，異なる納税主体のものであっても相殺して表示する。','同一納税主体のものは相殺するが，異なる納税主体のものは相殺しない。']]});

T({id:'fat-change',f:FT,ch:'第31章 会計方針の開示，会計上の変更及び誤謬の訂正',t:'会計上の変更及び誤謬の訂正',r:'A',
T:['会計方針の変更を行った場合には，原則として新たな会計方針を過去の期間のすべてに遡及適用する。',
'会計上の見積りの変更は，変更期間のみに影響する場合には当該変更期間に，将来の期間にも影響する場合には将来にわたり会計処理を行う。',
'過去の財務諸表における誤謬が発見された場合には，修正再表示を行う。',
'有形固定資産等の減価償却方法の変更は，会計方針の変更を会計上の見積りの変更と区別することが困難な場合に該当し，遡及適用は行わない。',
'表示方法の変更を行った場合には，原則として表示する過去の財務諸表について，新たな表示方法に従い財務諸表の組替えを行う。'],
F:[['会計上の見積りの変更を行った場合には，過去の財務諸表に遡って処理する。','見積りの変更は遡及せず，当期以降で処理する。'],
['過去の誤謬の修正は，前期損益修正損益として当期の特別損益に計上する。','修正再表示を行い，累積的影響額は表示期間の最も古い期間の期首残高に反映する。'],
['会計方針とは，財務諸表の作成にあたって採用した会計処理の原則及び手続並びに表示方法をいう。','会計方針は会計処理の原則及び手続をいい，表示方法は含まない。'],
['正当な理由による会計方針の変更には，会計基準等の改正に伴う変更は含まれない。','会計基準等の改正に伴う変更と，それ以外の正当な理由による変更の両方がある。'],
['会計方針の変更は，遡及適用が実務上不可能な場合であっても，必ず過去のすべての期間に遡及適用しなければならない。','実務上不可能な場合には，遡及適用が可能な最も古い期間から適用するなどの取扱いがある。']]});

T({id:'fat-fi',f:FT,ch:'第33章 金融商品に関する会計基準',t:'金融商品会計',r:'A',
T:['金融資産の契約上の権利を生じさせる契約を締結したときは，原則として当該金融資産の発生を認識しなければならない。',
'金融資産の消滅の認識は，財務構成要素アプローチに基づき，支配が他に移転したかどうかで判断する。',
'売買目的有価証券は時価をもって貸借対照表価額とし，評価差額は当期の損益として処理する。',
'満期保有目的の債券を債券金額と異なる価額で取得した場合，その差額の性格が金利の調整と認められるときは，償却原価法に基づいて算定された価額をもって貸借対照表価額としなければならない。',
'子会社株式及び関連会社株式は，取得原価をもって貸借対照表価額とする。',
'ヘッジ会計の原則的処理方法は，ヘッジ手段に係る損益又は評価差額を，ヘッジ対象に係る損益が認識されるまで純資産の部において繰り延べる方法である。'],
F:[['満期保有目的の債券は時価をもって貸借対照表価額とし，評価差額は純資産の部に計上する。','取得原価又は償却原価をもって貸借対照表価額とする。'],
['子会社株式は時価をもって貸借対照表価額とする。','取得原価をもって貸借対照表価額とする。'],
['その他有価証券の評価差額の処理方法としては，全部純資産直入法のみが認められている。','継続適用を条件に部分純資産直入法も認められる。'],
['金融資産の消滅の認識は，リスクと経済価値のほとんどすべてが移転した場合にのみ行う（リスク・経済価値アプローチ）。','日本基準は財務構成要素アプローチによる。'],
['市場価格のない株式は，合理的に時価を算定して時価評価しなければならない。','市場価格のない株式等は取得原価をもって貸借対照表価額とする。'],
['時価が著しく下落したその他有価証券は，回復する見込みがあると認められない場合でも，評価差額を純資産の部に計上する。','減損処理を行い，評価差額を当期の損失とする。']]});

T({id:'fat-rev',f:FT,ch:'第34章 収益認識に関する会計基準',t:'収益認識',r:'A',
T:['収益認識の基本となる原則は，約束した財又はサービスの顧客への移転を，当該財又はサービスと交換に企業が権利を得ると見込む対価の額で描写するように収益を認識することである。',
'収益を認識するための5つのステップは，契約の識別，履行義務の識別，取引価格の算定，履行義務への取引価格の配分，履行義務の充足による収益の認識である。',
'取引価格には，消費税等のように第三者のために回収する額は含まれない。',
'変動対価の額の見積りにあたっては，最頻値による方法又は期待値による方法のうち，企業が権利を得ることとなる対価の額をより適切に予測できる方法を用いる。',
'取引価格は，財又はサービスの独立販売価格の比率に基づき，それぞれの履行義務に配分する。',
'企業が代理人に該当する場合は，他の当事者が提供する財又はサービスと交換に受け取る額から当該他の当事者に支払う額を控除した純額を収益として認識する。'],
F:[['一定の期間にわたり充足される履行義務について，進捗度を合理的に見積ることができない場合には，収益を一切認識しない。','発生する費用を回収することが見込まれる場合には，原価回収基準により収益を認識する。'],
['変動対価は，その見積額の全額を必ず取引価格に含めなければならない。','収益の著しい減額が発生しない可能性が高い部分に限り取引価格に含める。'],
['契約負債とは，顧客に移転した財又はサービスと交換に受け取る対価に対する企業の権利のうち，顧客との契約から生じた債権を除いたものをいう。','これは契約資産の定義である。契約負債は，財又はサービスを移転する前に対価を受け取った（又は期限が到来した）ものをいう。'],
['企業が代理人に該当する場合には，顧客から受け取る対価の総額を収益として認識する。','代理人の場合は純額で認識する。'],
['返品権付きの販売では，返品が見込まれる部分も含めて販売時に全額を収益として認識し，返品調整引当金を計上する。','返品が見込まれる部分は収益を認識せず，返金負債を計上する。']]});

T({id:'fat-cons',f:FT,ch:'第35章 連結財務諸表に関する会計基準',t:'連結財務諸表',r:'A',
T:['親会社は，原則としてすべての子会社を連結の範囲に含める。',
'連結にあたって，子会社の資産及び負債は，支配獲得日の時価により評価する（全面時価評価法）。',
'親会社の投資と子会社の資本との相殺消去にあたり生じた差額は，のれん（又は負ののれん）として処理する。',
'支配獲得後に子会社株式を追加取得した場合，追加取得した株式に対応する持分と追加投資額との差額は資本剰余金とする。',
'子会社の決算日と連結決算日の差異が3か月を超えない場合には，子会社の正規の決算を基礎として連結決算を行うことができる。',
'ダウンストリームの取引から生じた未実現損益は，全額消去し，その全額を親会社持分に負担させる。'],
F:[['支配獲得後に子会社株式を追加取得した場合に生じる差額は，のれんとして処理する。','資本剰余金として処理する。'],
['子会社の資産及び負債の評価方法として，部分時価評価法も認められている。','全面時価評価法のみである。'],
['議決権の過半数を所有していない会社は，いかなる場合も子会社に該当しない。','議決権の40%以上を所有し一定の要件を満たす場合など，支配力基準により子会社となることがある。'],
['子会社株式を一部売却し親子関係が継続している場合，売却価額と持分の減少額との差額は，連結上，子会社株式売却損益とする。','支配が継続している場合の差額は資本剰余金とする。'],
['負ののれんが生じた場合には，20年以内の期間で規則的に償却する。','負ののれんは生じた事業年度の利益として処理する。'],
['子会社の欠損のうち非支配株主の負担すべき額を超える部分も，非支配株主持分に負担させる。','超過額は親会社持分に負担させる。']]});

T({id:'fat-equitym',f:FT,ch:'第36章 持分法に関する会計基準',t:'持分法',r:'B',
T:['非連結子会社及び関連会社に対する投資については，原則として持分法を適用する。',
'関連会社とは，出資，人事，資金，技術，取引等の関係を通じて，子会社以外の他の企業の財務及び営業又は事業の方針の決定に対して重要な影響を与えることができる場合における当該他の企業をいう。',
'持分法適用会社から受け取った配当金は，当該会社に対する投資の額から減額する。',
'投資の日における投資とこれに対応する被投資会社の資本との差額のうち，のれん相当額は投資に含めて処理する。',
'持分法による投資損益は，連結損益計算書上，営業外収益又は営業外費用の区分に一括して表示する。'],
F:[['持分法適用会社から受け取った配当金は，連結上も受取配当金として収益計上する。','配当金は投資の額から減額する。'],
['持分法による投資損益は，特別損益の区分に表示する。','営業外収益又は営業外費用に一括表示する。'],
['他の企業の議決権の20%未満を所有している場合には，関連会社となることはない。','15%以上20%未満でも一定の要件を満たせば関連会社となる。'],
['持分法では，被投資会社の資産及び負債を連結財務諸表に合算する。','合算せず，投資勘定の増減として処理する（一行連結）。'],
['持分法適用関連会社へのダウンストリームの取引から生じた未実現損益は，消去する必要がない。','投資会社の持分相当額を消去する。']]});

T({id:'fat-ci',f:FT,ch:'第37章 包括利益の表示に関する会計基準',t:'包括利益の表示',r:'B',
T:['包括利益とは，特定期間の財務諸表において認識された純資産の変動額のうち，当該企業の純資産に対する持分所有者との直接的な取引によらない部分をいう。',
'その他の包括利益には，その他有価証券評価差額金，繰延ヘッジ損益，為替換算調整勘定，退職給付に係る調整額などがある。',
'当期純利益を構成する項目のうち，当期又は過去の期間にその他の包括利益に含まれていた部分は，組替調整額としてその他の包括利益の内訳項目ごとに注記する。',
'包括利益を表示する計算書は，2計算書方式と1計算書方式のいずれかで表示する。'],
F:[['包括利益には，増資や配当など株主との資本取引による純資産の変動も含まれる。','持分所有者との直接的な取引による部分は含まれない。'],
['包括利益の表示は，個別財務諸表においても連結財務諸表と同様に義務付けられている。','当面の間，個別財務諸表には適用しない。'],
['1計算書方式とは，損益計算書と包括利益計算書の2つの計算書で表示する方式をいう。','それは2計算書方式である。'],
['組替調整額はその他の包括利益の合計額に影響しないため，開示は不要である。','組替調整額は注記が求められる。'],
['為替換算調整勘定は当期純利益を構成するため，その他の包括利益には含まれない。','為替換算調整勘定はその他の包括利益に含まれる。']]});

T({id:'fat-bc',f:FT,ch:'第38章 企業結合に関する会計基準',t:'企業結合',r:'A',
T:['共同支配企業の形成及び共通支配下の取引以外の企業結合は取得となり，パーチェス法により会計処理する。',
'取得の対価が株式である場合，取得原価は原則として企業結合日における株式の時価を基礎として算定する。',
'取得関連費用（外部のアドバイザー等に支払った特定の報酬・手数料等）は，発生した事業年度の費用として処理する。',
'のれんは資産に計上し，20年以内のその効果の及ぶ期間にわたって，定額法その他の合理的な方法により規則的に償却する。',
'共通支配下の取引により企業集団内を移転する資産及び負債は，原則として移転直前に付されていた適正な帳簿価額により計上する。'],
F:[['取得関連費用は，取得原価に含めて処理する。','発生した事業年度の費用とする。'],

/* ============ 財務会計論：リース（企業会計基準第34号「リースに関する会計基準」） ============ */
const LCH='リース（企業会計基準第34号）';
const pvA=(r,n)=>{let s=0;for(let t=1;t<=n;t++)s+=1/Math.pow(1+r/100,t);return Math.round(s*10000)/10000;};
const pv1=(r,n)=>Math.round(1/Math.pow(1+r/100,n)*10000)/10000;
const LEASE_PRE='新リース会計基準（企業会計基準第34号）を適用している。会計期間は4月1日から3月31日までの1年間である。';

C({id:'fa-lease-init',f:FA,ch:LCH,t:'借手：リース負債と使用権資産の当初測定',r:'A',g(){
  const n=R.int(3,6), r=R.pick([2,3,4,5]), P=R.int(10,60)*100000, a=R.int(1,5)*100000, pre=R.chance(0.4)?R.int(1,3)*100000:0; const f=pvA(r,n);
  const L=rd(P*f), ROU=L+a+pre; const ask=R.pick(['リース負債','使用権資産']);
  return {q:P_(`${LEASE_PRE}当期首に機械のリース契約（借手のリース期間${n}年，解約不能，リース料は毎年3月末に${Y(P)}円を後払い，所有権移転条項・購入オプションなし）を締結し，使用を開始した。借手の追加借入利子率は年${r}%（貸手の計算利子率は知り得ない），${r}%・${n}年の年金現価係数は${f}である。リース開始時に付随費用${Y(a)}円を支払った${pre?`。また，リース開始日までにリース料${Y(pre)}円を前払いしている（上記のリース料とは別枠）`:''}。リース開始日に計上する${ask}はいくらか（円未満四捨五入）。`),
    a: ask==='リース負債'?L:ROU, u:'円', w: ask==='リース負債'?[P*n,L+a,rd(P*pvA(r,n-1)),rd(P*f*(1+r/100))]:[L,P*n+a+pre,L+a,L+pre,P*n],
    ex:`リース負債＝リース料${Y(P)}×年金現価係数${f}＝${Y(L)}<br>使用権資産＝リース負債${Y(L)}＋付随費用${Y(a)}${pre?`＋前払リース料${Y(pre)}`:''}＝${Y(ROU)}<br>よって<b>${Y(ask==='リース負債'?L:ROU)}円</b><br>借手はファイナンス／オペレーティングの区分を行わず，単一のモデルで使用権資産とリース負債を計上する。`};
}});

C({id:'fa-lease-year1',f:FA,ch:LCH,t:'借手：支払利息・減価償却・期末リース負債',r:'A',g(){
  const n=R.int(3,6), r=R.pick([2,3,4,5]), P=R.int(10,60)*100000; const f=pvA(r,n); const L=rd(P*f);
  const own=R.chance(0.3); const N=own?n+R.int(2,5):n; const int1=rd(L*r/100); const L1=L+int1-P; const dep=rd(L/N);
  const ask=R.pick(['当期の支払利息','当期末のリース負債','当期の費用合計（減価償却費と支払利息）']);
  const ans= ask==='当期の支払利息'?int1: ask==='当期末のリース負債'?L1: dep+int1;
  return {q:P_(`${LEASE_PRE}当期首に設備のリース（借手のリース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い）を開始した。${own?`契約上，リース期間終了時に所有権が借手に移転する（設備の経済的耐用年数${N}年）。`:'所有権移転条項・購入オプションはない（設備の経済的耐用年数はリース期間より長い）。'}割引率は年${r}%，年金現価係数は${f}である。付随費用はなく，使用権資産は残存価額ゼロ・定額法で償却し，利息相当額は利息法により配分する。${ask}はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w: ask==='当期の支払利息'?[rd((P*n-L)/n),rd(P*r/100),rd(P*n*r/100),rd(L1*r/100)]: ask==='当期末のリース負債'?[L-P,L-int1,P*(n-1),L1+int1]:[dep,P,dep+rd((P*n-L)/n),rd(L/(own?n:n+2))+int1,int1+rd(P*n/N)],
    ex:`リース負債（期首）＝${Y(P)}×${f}＝${Y(L)}（＝使用権資産）<br>支払利息＝${Y(L)}×${r}%＝${Y(int1)}<br>期末リース負債＝${Y(L)}＋${Y(int1)}－${Y(P)}＝${Y(L1)}<br>減価償却費＝${Y(L)}÷${N}年＝${Y(dep)}（${own?'所有権が移転するため経済的耐用年数':'所有権が移転しないため借手のリース期間'}で償却）<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-lease-term',f:FA,ch:LCH,t:'借手：リース期間の決定（延長オプション）',r:'A',g(){
  const n=R.int(2,5), m=R.int(1,3), r=R.pick([2,3,4]), P=R.int(10,50)*100000; const sure=R.chance(0.5);
  const f1=pvA(r,n), f2=pvA(r,n+m); const L1=rd(P*f1), L2=rd(P*f2); const ans=sure?L2:L1;
  return {q:P_(`${LEASE_PRE}当期首に店舗の賃貸借契約を締結した。解約不能期間は${n}年であり，借手は同条件で${m}年延長するオプションを有している。${sure?'店舗には多額の内装工事を行っており，その経済的耐用年数は延長後の期間にわたる。借手が延長オプションを行使することは合理的に確実であると判断した。':'延長を行う経済的インセンティブは乏しく，延長オプションを行使することが合理的に確実とはいえない。'}リース料は毎年3月末に${Y(P)}円を後払いする。割引率${r}%の年金現価係数は，${n}年${f1}，${n+m}年${f2}である。リース開始日のリース負債はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w:[sure?L1:L2,P*n,P*(n+m),rd(P*pvA(r,m))],
    ex:`借手のリース期間＝解約不能期間＋行使が合理的に確実な延長オプション期間。<br>本問では${sure?`延長を含めて${n+m}年`:`解約不能期間の${n}年のみ`}。<br>${Y(P)}×${sure?f2:f1}＝<b>${Y(ans)}円</b>`};
}});

C({id:'fa-lease-variable',f:FA,ch:LCH,t:'借手：変動リース料と購入オプション',r:'A',adv:true,g(){
  const n=R.int(3,5), r=R.pick([3,4,5]), P=R.int(10,40)*100000, Q=R.int(1,8)*100000, s=R.int(1,5)*100000; const f=pvA(r,n), g=pv1(r,n);
  const opt=R.chance(0.5); const E=R.int(2,10)*100000;
  const L=rd((P+Q)*f)+(opt?rd(E*g):0);
  return {q:P_(`${LEASE_PRE}当期首に開始したリースの借手のリース料は，毎年3月末に固定額${Y(P)}円と，消費者物価指数に連動する額（リース開始日の指数に基づくと${Y(Q)}円）を支払うほか，店舗売上高の1%（当期見込${Y(s)}円）を支払う（借手のリース期間${n}年）。${opt?`また，リース期間終了時に${Y(E)}円で原資産を購入するオプションを有しており，その行使は合理的に確実である。`:''}割引率${r}%の${n}年の年金現価係数は${f}，現価係数は${g}とする。リース開始日のリース負債はいくらか（円未満四捨五入）。`),
    a:L,u:'円',w:[rd((P+Q+s)*f)+(opt?rd(E*g):0),rd(P*f)+(opt?rd(E*g):0),rd((P+Q)*f)+(opt?0:rd(E*g)),rd((P+Q)*f)+(opt?E:0),rd(P*f)],
    ex:`指数・レートに応じて決まる変動リース料はリース開始日の指数でリース負債に含める。売上高に連動する変動リース料は含めず発生時の費用とする。${opt?'行使が合理的に確実な購入オプションの行使価額もリース料に含める。':''}<br>(${Y(P)}＋${Y(Q)})×${f}${opt?`＋${Y(E)}×${g}`:''}＝<b>${Y(L)}円</b>`};
}});

C({id:'fa-lease-current',f:FA,ch:LCH,t:'借手：リース負債の流動・固定区分',r:'B',adv:true,g(){
  const n=R.int(3,6), r=R.pick([2,3,4,5]), P=R.int(10,60)*100000; const f=pvA(r,n); const L=rd(P*f); const L1=L+rd(L*r/100)-P; const cur=P-rd(L1*r/100);
  const ask=R.pick(['流動負債','固定負債']); const ans=ask==='流動負債'?cur:L1-cur;
  return {q:P_(`${LEASE_PRE}当期首にリース（借手のリース期間${n}年，毎年3月末に${Y(P)}円を後払い，割引率${r}%，年金現価係数${f}）を開始した。当期末の貸借対照表において，リース負債のうち${ask}に表示される金額はいくらか（利息法，円未満四捨五入）。`),
    a:ans,u:'円',w: ask==='流動負債'?[P,L1-cur,rd(L1/(n-1)),rd(L1*r/100)]:[cur,L1,L1-P,L-P],
    ex:`当期末リース負債＝${Y(L)}＋利息${Y(rd(L*r/100))}－${Y(P)}＝${Y(L1)}<br>翌期の支払額${Y(P)}のうち元本部分＝${Y(P)}－${Y(L1)}×${r}%＝${Y(cur)} → 流動負債<br>残り${Y(L1-cur)} → 固定負債<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'fa-lease-lessor',f:FA,ch:LCH,t:'貸手：ファイナンス・リースの利息配分',r:'B',g(){
  const n=R.int(3,6), r=R.pick([3,4,5,6]), P=R.int(10,60)*100000; const f=pvA(r,n); const Cst=rd(P*f); const i1=rd(Cst*r/100); const B1=Cst+i1-P;
  const ask=R.pick(['当期の受取利息相当額','当期末のリース投資資産']);
  return {q:P_(`${LEASE_PRE}当社（リース会社，貸手）は当期首に機械を${Y(Cst)}円で購入し，直ちに所有権移転外ファイナンス・リースとして貸し出した（リース期間${n}年，リース料は毎年3月末に${Y(P)}円を後払い，貸手の計算利子率${r}%）。リース料受取時の処理は売上高を計上せず利息相当額を各期へ配分する方法による。${ask}はいくらか（円未満四捨五入）。`),
    a:ask.includes('受取')?i1:B1,u:'円',w: ask.includes('受取')?[rd((P*n-Cst)/n),rd(P*r/100),P-i1,rd(B1*r/100)]:[Cst-P,Cst-rd((P*n-Cst)/n),P*(n-1),Cst-i1],
    ex:`受取利息相当額＝リース投資資産${Y(Cst)}×${r}%＝${Y(i1)}（利息法）<br>期末リース投資資産＝${Y(Cst)}－元本回収(${Y(P)}－${Y(i1)})＝${Y(B1)}<br>よって<b>${Y(ask.includes('受取')?i1:B1)}円</b>`};
}});

C({id:'fa-lease-short',f:FA,ch:LCH,t:'借手：短期リースの簡便的な取扱い',r:'B',g(){
  const mth=R.pick([6,9,10,12]); const pay=R.int(1,9)*50000; const start=R.pick([7,10,1]); const inFY=Math.min(mth,start>=4?16-start:4-start);
  const ans=pay*inFY;
  return {q:P_(`${LEASE_PRE}当期${start}月1日から，事務所の一部を賃借する契約（契約期間${mth}か月，延長・購入オプションなし，月額${Y(pay)}円を毎月末払い）を締結した。当社は短期リースについて簡便的な取扱いを選択している。当期の損益計算書に計上される費用はいくらか（割引計算は不要）。`),
    a:ans,u:'円',w:[pay*mth,pay*12,pay*(inFY-1),pay*mth/2],
    ex:`借手のリース期間が12か月以内で購入オプションを含まないため短期リースに該当し，使用権資産・リース負債を計上せず，リース料を期間にわたり定額法で費用計上できる。<br>当期分：${Y(pay)}×${inFY}か月＝<b>${Y(ans)}円</b>`};
}});

T({id:'fat-lease',f:FT,ch:LCH,t:'リースに関する会計基準（新リース会計基準）',r:'A',
T:['借手は，リースをファイナンス・リースとオペレーティング・リースに分類せず，原則としてすべてのリースについて使用権資産とリース負債を計上する。',

/* 借手のリース期間（年数）の判定 */
C({id:'fa-lease-term2',f:FA,ch:'リース（企業会計基準第34号）',t:'借手：リース期間の決定（解約オプション・延長オプション）',r:'A',g(){
  const base=R.int(2,6); const ext=R.int(1,5); const hasCancel=R.chance(0.5); const cx=R.int(1,Math.max(1,base-1)); const notCancelSure=R.chance(0.5); const extSure=(hasCancel&&!notCancelSure)?false:R.chance(0.5);
  // 解約オプション：借手は base 年経過後にも解約可能で，その後 cx 年間の使用が可能
  let term=base; if(hasCancel&&notCancelSure) term+=cx; if(extSure) term+=ext;
  const desc=[`解約不能期間は${base}年である。`];
  if(hasCancel) desc.push(`借手は${base}年経過時点で解約できるが，解約しなければさらに${cx}年間使用できる（解約オプション）。借手が解約オプションを行使しないことは${notCancelSure?'合理的に確実である':'合理的に確実とはいえない'}。`);
  desc.push(`${hasCancel?`その後，`:''}借手は契約を${ext}年延長できる（延長オプション）。延長オプションを行使することは，重要な建物附属設備の存在などの経済的インセンティブを考慮すると${extSure?'合理的に確実である':'合理的に確実とはいえない'}。`);
  const all=base+(hasCancel?cx:0)+ext;
  return {q:P_(`店舗の不動産賃貸借契約について，${desc.join('')}借手のリース期間は何年か。`),
    a:term,u:'年',w:[base,all,base+ext,base+(hasCancel?cx:0),term+1,Math.max(1,term-1)],
    ex:`借手のリース期間＝解約不能期間＋行使することが合理的に確実な延長オプションの期間＋行使しないことが合理的に確実な解約オプションの期間<br>${base}年${hasCancel&&notCancelSure?`＋${cx}年`:''}${extSure?`＋${ext}年`:''}＝<b>${term}年</b>`};
}});


/* ============ 管理会計論・計算（原価計算分野／管理会計分野） ============ */
const MC='mg-cc', MM='mg-mc';
const fav=(x)=>x>=0?'有利差異':'不利差異';

C({id:'mg-mat-price',f:MC,ch:'第3章 材料費',t:'材料消費価格差異',r:'A',g(){
  const p=R.int(40,120)*10; const c0=p+R.int(-8,8)*10; let c1=p+R.int(-8,8)*10; if((c0+c1)%20) c1+=10;
  const q0=R.int(2,8)*100, q1=q0; const avg=(c0+c1)/2; const Q=R.int(Math.ceil(q0*1.1/100),Math.floor(q0*1.9/100))*100;
  const d=(p-avg)*Q;
  return {q:P_(`材料の消費額は予定価格＠${Y(p)}円で計算している。当月の資料は，月初有高${Y(q0)}kg（＠${Y(c0)}円），当月購入${Y(q1)}kg（＠${Y(c1)}円），当月消費量${Y(Q)}kgであり，実際消費単価は総平均法による。材料消費価格差異はいくらか（有利差異はプラス，不利差異は△）。`),
    a:d,u:'円',neg:true,w:[-d,(p-c1)*Q,(p-c0)*Q,(p-avg)*(q0+q1),(p-avg)*(q0+q1-Q)],
    ex:`実際消費単価＝(${Y(q0*c0)}＋${Y(q1*c1)})÷${Y(q0+q1)}kg＝＠${Y(avg)}<br>差異＝(予定＠${p}－実際＠${avg})×${Y(Q)}kg＝<b>${yen(d)}円</b>（${fav(d)}）`};
}});

C({id:'mg-labor-rate',f:MC,ch:'第4章 労務費',t:'賃率差異',r:'A',g(){
  const r=R.int(10,25)*100; const h=R.int(20,60)*100; const act=r*h+R.int(-20,20)*10000; const u0=R.int(20,60)*10000, u1=R.int(20,60)*10000; const W=act+u0-u1;
  const d=r*h-act;
  return {q:P_(`直接工の賃金は予定賃率＠${Y(r)}円/時間で消費額を計算している。当月の実際作業時間（直接作業・間接作業・手待時間の合計）は${Y(h)}時間であった。当月の賃金支給総額は${Y(W)}円，前月末未払賃金は${Y(u0)}円，当月末未払賃金は${Y(u1)}円である。賃率差異はいくらか（有利差異はプラス，不利差異は△）。`),
    a:d,u:'円',neg:true,w:[r*h-W,r*h-(W+u0-u1),-d,r*h-(W-u0-u1),r*h-(W+u0+u1)],
    ex:`実際消費賃金＝支給額${Y(W)}－前月未払${Y(u0)}＋当月未払${Y(u1)}＝${Y(act)}<br>予定消費額＝＠${r}×${Y(h)}時間＝${Y(r*h)}<br>差異＝${Y(r*h)}－${Y(act)}＝<b>${yen(d)}円</b>（${fav(d)}）`};
}});

C({id:'mg-oh-var',f:MC,ch:'第6章 製造間接費',t:'製造間接費の予算差異・操業度差異（公式法変動予算）',r:'A',g(){
  const N=R.int(20,60)*100; const v=R.int(3,12)*100; const f=R.int(4,15)*100; const F=f*N; const A=N+R.int(-8,4)*100;
  const X=v*A+F+R.int(-30,30)*10000; const bd=(v*A+F)-X, vd=(A-N)*f;
  const ask=R.pick(['予算差異','操業度差異','製造間接費配賦差異（総差異）']);
  const ans= ask==='予算差異'?bd: ask==='操業度差異'?vd: bd+vd;
  return {q:P_(`製造間接費は直接作業時間を基準に予定配賦しており，公式法変動予算を用いている。月間の基準操業度${Y(N)}時間，変動費率＠${Y(v)}円，固定費予算額${Y(F)}円である。当月の実際直接作業時間は${Y(A)}時間，製造間接費の実際発生額は${Y(X)}円であった。${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w: ask==='予算差異'?[(v*N+F)-X,(v+f)*A-X,-bd,bd+vd]: ask==='操業度差異'?[(A-N)*(v+f),(N-A)*f,(A-N)*v,bd]:[bd,vd,-(bd+vd),(v+f)*N-X],
    ex:`予定配賦率＝＠${v}＋${Y(F)}÷${Y(N)}＝＠${v+f}<br>予算差異＝(＠${v}×${Y(A)}＋${Y(F)})－${Y(X)}＝${yen(bd)}<br>操業度差異＝(${Y(A)}－${Y(N)})×固定費率＠${f}＝${yen(vd)}<br>総差異＝予定配賦額${Y((v+f)*A)}－${Y(X)}＝${yen(bd+vd)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-dept-direct',f:MC,ch:'第7章 部門別計算',t:'補助部門費の配賦（直接配賦法）',r:'A',g(){
  const a1=R.int(2,8)*100, b1=R.int(2,8)*100, m1=R.int(1,3)*100; const a2=R.int(2,8)*10, b2=R.int(2,8)*10, m2=R.int(1,4)*10;
  const X=(a1+b1)*R.int(2,8)*100, Yv=(a2+b2)*R.int(20,80)*100; const A0=R.int(100,400)*10000;
  const ans=A0+X*a1/(a1+b1)+Yv*a2/(a2+b2);
  return {q:P_('補助部門費を直接配賦法により製造部門に配賦する。第1製造部門の部門費（補助部門費配賦後）はいくらか。')+
    tbl([['部門個別費・共通費配賦後',A0,R.int(100,400)*10000,X,Yv],['動力供給量(kWh)',a1,b1,'—',m1],['修繕作業時間',a2,b2,m2,'—']],['','第1製造部門','第2製造部門','動力部','修繕部']),
    a:rd(ans),u:'円',w:[rd(A0+X*a1/(a1+b1+m1)+Yv*a2/(a2+b2+m2)),rd(A0+X*a1/(a1+b1)),rd(A0+Yv*a2/(a2+b2)),rd(A0+(X+Yv)*a1/(a1+b1)),rd(A0+X*a2/(a2+b2)+Yv*a1/(a1+b1))],
    ex:`直接配賦法では補助部門相互間の用役授受を無視し，製造部門の用役消費量の比で配賦する。<br>動力部費：${Y(X)}×${a1}/${a1+b1}＝${Y(rd(X*a1/(a1+b1)))}<br>修繕部費：${Y(Yv)}×${a2}/${a2+b2}＝${Y(rd(Yv*a2/(a2+b2)))}<br>${Y(A0)}＋上記＝<b>${Y(rd(ans))}円</b>`};
}});

C({id:'mg-dept-recip',f:MC,ch:'第7章 部門別計算',t:'補助部門費の配賦（相互配賦法・連立方程式法）',r:'B',adv:true,g(){
  const X=R.int(20,80)*10000, Yv=R.int(20,80)*10000;
  const s1=R.pick([[50,40,10],[40,40,20],[60,30,10],[45,35,20]]), s2=R.pick([[40,40,20],[50,30,20],[30,50,20],[45,45,10]]); // [A,B,他補助]
  const al=s1[2]/100, be=s2[2]/100; const S1=(X+be*Yv)/(1-al*be), S2=Yv+al*S1;
  const toA=rd(S1*s1[0]/100+S2*s2[0]/100);
  const direct=rd(X*s1[0]/(s1[0]+s1[1])+Yv*s2[0]/(s2[0]+s2[1]));
  return {q:P_(`補助部門費を相互配賦法（連立方程式法）により配賦する。動力部費は${Y(X)}円，修繕部費は${Y(Yv)}円である。用役の提供割合は，動力部：第1製造部門${s1[0]}%・第2製造部門${s1[1]}%・修繕部${s1[2]}%，修繕部：第1製造部門${s2[0]}%・第2製造部門${s2[1]}%・動力部${s2[2]}%である。第1製造部門に配賦される補助部門費の合計はいくらか（円未満四捨五入）。`),
    a:toA,u:'円',w:[direct,rd(X*s1[0]/100+Yv*s2[0]/100),rd(S1*s1[0]/100+Yv*s2[0]/100),rd((X+Yv)*s1[0]/100),rd(S1*s1[0]/(s1[0]+s1[1])+S2*s2[0]/(s2[0]+s2[1]))],
    ex:`動力部の配賦総額をx，修繕部をyとすると x＝${Y(X)}＋${be}y，y＝${Y(Yv)}＋${al}x<br>x＝${Y(rd(S1))}，y＝${Y(rd(S2))}<br>第1製造部門：x×${s1[0]}%＋y×${s2[0]}%＝<b>${Y(toA)}円</b>`};
}});

C({id:'mg-process',f:MC,ch:'第10章 単純総合原価計算',t:'月末仕掛品原価（平均法・先入先出法）',r:'A',g(){
  const q0=R.int(2,6)*100, p0=R.pick([0.4,0.5,0.6]), q1=R.int(2,6)*100, p1=R.pick([0.3,0.5,0.6,0.8]); const Q=R.int(15,40)*100; const qin=Q+q1-q0;
  const meth=R.pick(['平均法','先入先出法']);
  let DM0,CC0,DM,CC,wip,other;
  const u=R.int(20,80)*10, v=R.int(20,80)*10;
  DM0=q0*R.int(20,80)*10; CC0=q0*p0*R.int(20,80)*10;
  if(meth==='平均法'){ DM=u*(Q+q1)-DM0; CC=v*(Q+q1*p1)-CC0; if(DM<=0||CC<=0) throw 0; wip=q1*u+q1*p1*v; other=rd(DM*q1/(Q-q0+q1)+CC*q1*p1/(Q-q0*p0+q1*p1)); }
  else { DM=u*(Q-q0+q1); CC=v*(Q-q0*p0+q1*p1); wip=q1*u+q1*p1*v; other=rd((DM0+DM)*q1/(Q+q1)+(CC0+CC)*q1*p1/(Q+q1*p1)); }
  const tot=DM0+CC0+DM+CC;
  const ask=R.pick(['月末仕掛品原価','完成品総合原価']);
  const ans= ask==='月末仕掛品原価'?wip:tot-wip;
  return {q:P_(`単純総合原価計算を行っている。材料はすべて工程の始点で投入し，加工費は工程の進捗に応じて発生する。原価配分方法は${meth}による。${ask}はいくらか（円未満四捨五入）。`)+
    tbl([['月初仕掛品',`${q0}個（進捗度${p0*100}%）`,DM0,CC0],['当月投入',`${qin}個`,DM,CC],['完成品',`${Q}個`,'',''],['月末仕掛品',`${q1}個（進捗度${p1*100}%）`,'','']],['','数量','直接材料費','加工費']),
    a:ans,u:'円',w: ask==='月末仕掛品原価'?[other,rd(q1*u+q1*v),rd((DM0+DM)*q1/(Q+q1)+(CC0+CC)*q1/(Q+q1)),wip+rd(q1*p1*v*0.2)]:[tot-other,tot,tot-rd(q1*u+q1*v),DM+CC-wip],
    ex:`${meth==='平均法'?`平均法：(月初＋当月)の原価を(完成品＋月末仕掛品換算量)で按分。<br>直接材料費単価＝${Y(DM0+DM)}÷${Q+q1}＝＠${u}，加工費単価＝${Y(CC0+CC)}÷${Q+q1*p1}＝＠${v}`:`先入先出法：当月投入原価を(完成品－月初仕掛品換算量＋月末仕掛品換算量)で按分。<br>直接材料費単価＝${Y(DM)}÷${Q-q0+q1}＝＠${u}，加工費単価＝${Y(CC)}÷${Q-q0*p0+q1*p1}＝＠${v}`}<br>月末仕掛品＝${q1}×＠${u}＋${q1*p1}×＠${v}＝${Y(wip)}<br>完成品＝総原価${Y(tot)}－${Y(wip)}＝${Y(tot-wip)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'mg-spoilage',f:MC,ch:'第10章 単純総合原価計算',t:'正常仕損（度外視法）',r:'A',g(){
  const Q=R.int(15,40)*100, L=R.int(1,4)*50, q1=R.int(2,6)*100, p1=R.pick([0.4,0.5,0.6]); const where=R.pick(['終点','始点']);
  const u=R.int(20,80)*10, v=R.int(20,80)*10;
  let DM,CC,wip,alt;
  if(where==='終点'){ DM=u*(Q+L+q1); CC=v*(Q+L+q1*p1); wip=q1*u+q1*p1*v; alt=rd(DM*q1/(Q+q1)+CC*q1*p1/(Q+q1*p1)); }
  else { DM=u*(Q+q1); CC=v*(Q+q1*p1); wip=q1*u+q1*p1*v; alt=rd(DM*q1/(Q+L+q1)+CC*q1*p1/(Q+L+q1*p1)); }
  const tot=DM+CC; const ans=tot-wip;
  return {q:P_(`当月，材料${Q+L+q1}個を工程の始点で投入し（月初仕掛品なし），完成品${Y(Q)}個，正常仕損${L}個（工程の${where}で発生，評価額ゼロ），月末仕掛品${q1}個（進捗度${p1*100}%）であった。当月製造費用は直接材料費${Y(DM)}円，加工費${Y(CC)}円である。正常仕損費は度外視法により処理する。完成品総合原価はいくらか（円未満四捨五入）。`),
    a:ans,u:'円',w:[tot-alt,tot,wip,rd(tot*Q/(Q+L+q1)),tot-rd(q1*u+q1*v)],
    ex:`${where==='終点'?'終点発生の仕損は月末仕掛品（進捗度が終点未満）に負担させず，完成品のみが負担する。月末仕掛品の計算では仕損品数量を分母に含める。':'始点発生の仕損は完成品と月末仕掛品の両者に負担させる（度外視法では仕損品数量を分母から除いて按分する）。'}<br>月末仕掛品＝${Y(wip)}，完成品＝${Y(tot)}－${Y(wip)}＝<b>${Y(ans)}円</b>`};
}});

C({id:'mg-grade',f:MC,ch:'第13章 等級別総合原価計算',t:'等級別総合原価計算（等価係数）',r:'A',g(){
  const k=[1,R.pick([0.8,0.7,0.6]),R.pick([0.5,0.4])]; const n=[R.int(10,40)*100,R.int(10,40)*100,R.int(10,40)*100];
  const pts=n.map((x,i)=>x*k[i]); const tp=pts.reduce((a,b)=>a+b); const T0=tp*R.int(5,30)*10; const i=R.int(0,2); const nm=['A','B','C'];
  const ans=T0*pts[i]/tp;
  return {q:P_(`等級製品A・B・Cを製造している。当月の完成品総合原価は${Y(T0)}円であり，完成品数量はA ${Y(n[0])}個，B ${Y(n[1])}個，C ${Y(n[2])}個，等価係数はA ${k[0]}，B ${k[1]}，C ${k[2]}である。製品${nm[i]}の完成品原価はいくらか。`),
    a:rd(ans),u:'円',w:[rd(T0*n[i]/(n[0]+n[1]+n[2])),rd(T0*k[i]/(k[0]+k[1]+k[2])),rd(T0*pts[(i+1)%3]/tp),rd(T0*pts[i]/tp*1.1)],
    ex:`積数＝数量×等価係数：A ${Y(pts[0])}，B ${Y(pts[1])}，C ${Y(pts[2])}（合計${Y(tp)}）<br>${nm[i]}：${Y(T0)}×${Y(pts[i])}/${Y(tp)}＝<b>${Y(rd(ans))}円</b>`};
}});

C({id:'mg-joint',f:MC,ch:'第14章 連産品',t:'連産品（正常市価基準）',r:'A',g(){
  const pr=[]; for(const nm of ['X','Y','Z']){ const q=R.int(2,10)*100, p=R.int(10,50)*10, add=R.chance(0.6)?q*R.int(1,5)*10:0; pr.push({nm,q,p,add,nrv:q*p-add}); }
  const tot=pr.reduce((a,b)=>a+b.nrv,0); const J=tot*R.pick([0.5,0.6,0.7]); const i=R.int(0,2);
  const ans=J*pr[i].nrv/tot; const qsum=pr.reduce((a,b)=>a+b.q,0); const msum=pr.reduce((a,b)=>a+b.q*b.p,0);
  return {q:P_(`連産品X・Y・Zの結合原価${Y(J)}円を，分離点における見積正常市価の比で配賦する。製品${pr[i].nm}への結合原価配賦額はいくらか（円未満四捨五入）。`)+tbl(pr.map(o=>[o.nm,`${o.q}kg`,`＠${o.p}`,o.add]),['製品','生産量','最終製品の単位当たり正常市価','分離後の追加加工費']),
    a:rd(ans),u:'円',w:[rd(J*pr[i].q/qsum),rd(J*pr[i].q*pr[i].p/msum),rd(J*pr[(i+1)%3].nrv/tot),rd(ans+pr[i].add)],
    ex:`見積正常市価＝最終製品の正常市価－分離後の追加加工費：${pr.map(o=>`${o.nm} ${Y(o.nrv)}`).join('，')}（合計${Y(tot)}）<br>${pr[i].nm}：${Y(J)}×${Y(pr[i].nrv)}/${Y(tot)}＝<b>${Y(rd(ans))}円</b>`};
}});

C({id:'mg-std-dm',f:MC,ch:'第15章 標準原価計算',t:'直接材料費差異（価格差異・数量差異）',r:'A',g(){
  const ps=R.int(20,80)*10, qs=R.int(2,6); const N=R.int(5,20)*100; const Qa=qs*N+R.int(-15,15)*10; const pa=ps+R.int(-6,6)*10;
  const pv=(ps-pa)*Qa, qv=ps*(qs*N-Qa); const ask=R.pick(['価格差異','数量差異']);
  const ans= ask==='価格差異'?pv:qv;
  return {q:P_(`製品1個当たりの標準直接材料費は，標準単価＠${Y(ps)}円×標準消費量${qs}kgである。当月の実際生産量は${Y(N)}個（月初・月末仕掛品なし），直接材料の実際消費量は${Y(Qa)}kg，実際単価は＠${Y(pa)}円であった。直接材料費の${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w: ask==='価格差異'?[(ps-pa)*qs*N,-pv,pa*(qs*N-Qa),pv+qv]:[pa*(qs*N-Qa),-qv,(ps-pa)*Qa,pv+qv],
    ex:`価格差異＝(標準単価－実際単価)×実際消費量＝(${ps}－${pa})×${Y(Qa)}＝${yen(pv)}<br>数量差異＝標準単価×(標準消費量${Y(qs*N)}－実際消費量${Y(Qa)})＝${yen(qv)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-std-dl',f:MC,ch:'第15章 標準原価計算',t:'直接労務費差異（賃率差異・作業時間差異）',r:'A',g(){
  const rs=R.int(10,25)*100, hs=R.pick([0.5,1,1.5,2]); const N=R.int(5,30)*100; const S=hs*N; const Ha=S+R.int(-20,20)*10; const ra=rs+R.int(-10,10)*10;
  const rv=(rs-ra)*Ha, tv=rs*(S-Ha); const ask=R.pick(['賃率差異','作業時間差異']);
  const ans= ask==='賃率差異'?rv:tv;
  return {q:P_(`製品1個当たりの標準直接労務費は，標準賃率＠${Y(rs)}円×標準直接作業時間${hs}時間である。当月の完成品換算量は${Y(N)}個，実際直接作業時間は${Y(Ha)}時間，実際賃率は＠${Y(ra)}円であった。${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w: ask==='賃率差異'?[(rs-ra)*S,-rv,rv+tv,ra*(S-Ha)]:[ra*(S-Ha),-tv,rv+tv,(rs-ra)*Ha],
    ex:`標準作業時間＝${hs}×${Y(N)}＝${Y(S)}時間<br>賃率差異＝(${rs}－${ra})×実際${Y(Ha)}時間＝${yen(rv)}<br>作業時間差異＝${rs}×(${Y(S)}－${Y(Ha)})＝${yen(tv)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-std-oh',f:MC,ch:'第15章 標準原価計算',t:'製造間接費差異（四分法）',r:'A',g(){
  const N=R.int(20,60)*100; const v=R.int(3,10)*100, f=R.int(4,12)*100; const F=f*N; const S=N+R.int(-6,2)*100; const A=S+R.int(-3,3)*100; const X=v*A+F+R.int(-20,20)*10000;
  const bd=v*A+F-X, ve=v*(S-A), fe=f*(S-A), od=f*(A-N);
  const opts=[['予算差異',bd],['変動費能率差異',ve],['固定費能率差異',fe],['操業度差異',od]]; const [ask,ans]=R.pick(opts);
  return {q:P_(`製造間接費の標準配賦率は直接作業時間当たり＠${Y(v+f)}円（変動費率＠${v}円，固定費率＠${f}円），月間基準操業度は${Y(N)}時間（公式法変動予算）である。当月の標準直接作業時間は${Y(S)}時間，実際直接作業時間は${Y(A)}時間，製造間接費実際発生額は${Y(X)}円であった。四分法による${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w:[bd,ve,fe,od,(v+f)*(S-A),f*(S-N),-ans,(v+f)*S-X].filter(x=>x!==ans),
    ex:`予算差異＝(＠${v}×${Y(A)}＋${Y(F)})－${Y(X)}＝${yen(bd)}<br>変動費能率差異＝＠${v}×(${Y(S)}－${Y(A)})＝${yen(ve)}<br>固定費能率差異＝＠${f}×(${Y(S)}－${Y(A)})＝${yen(fe)}<br>操業度差異＝＠${f}×(${Y(A)}－${Y(N)})＝${yen(od)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-dc-ac',f:MC,ch:'第17章 直接原価計算',t:'全部原価計算と直接原価計算の営業利益の差（固定費調整）',r:'A',g(){
  const P=R.int(8,20)*100, S=P+R.int(-6,4)*100; const b=R.int(0,5)*100; const e=b+P-S; if(e<0) throw 0;
  const f=R.int(5,20)*10; const F=f*P; const f0=f+R.int(-4,4)*10; const DC=R.int(50,300)*10000;
  const AC=DC+e*f-b*f0;
  return {q:P_(`当期の直接原価計算による営業利益は${Y(DC)}円である。当期の生産量は${Y(P)}個，販売量は${Y(S)}個，期首製品在庫は${Y(b)}個（前期の固定製造間接費は1個当たり${Y(f0)}円），期末製品在庫は${Y(e)}個であった。当期の固定製造間接費は${Y(F)}円である。仕掛品はなく，製品の払出しは先入先出法による。全部原価計算による営業利益はいくらか。`),
    a:AC,u:'円',neg:true,w:[DC,DC-e*f+b*f0,DC+(e-b)*f,DC+e*f,DC+F-S*f],
    ex:`全部原価計算の営業利益＝直接原価計算の営業利益＋期末在庫に含まれる固定製造間接費－期首在庫に含まれる固定製造間接費<br>${Y(DC)}＋${Y(e)}×${f}－${Y(b)}×${f0}＝<b>${yen(AC)}円</b>`};
}});

C({id:'mg-job',f:MC,ch:'第9章 個別原価計算',t:'個別原価計算（完成品原価）',r:'A',g(){
  const rate=R.int(8,20)*100; const o=[];
  for(const no of ['#101','#102','#103']){ o.push({no,dm:R.int(10,60)*10000,dl:R.int(10,50)*10000,h:R.int(5,30)*10}); }
  const beg=R.int(10,40)*10000; const done=[0,1];

  return {q:P_(`個別原価計算を採用している。製造間接費は直接作業時間当たり＠${Y(rate)}円で予定配賦する。#101は前月から繰り越された仕掛品（前月までの原価${Y(beg)}円）である。当月末に#101と#102が完成し，#103は未完成である。当月の完成品原価はいくらか。`)+tbl(o.map(x=>[x.no,x.dm,x.dl,x.h+'時間']),['指図書','当月直接材料費','当月直接労務費','当月直接作業時間']),
    a:ans,u:'円',w:[ans-beg,ans+cost(2),cost(0)+cost(2),ans-o[0].h*rate-o[1].h*rate,ans+beg],

}});

C({id:'mg-cvp',f:MM,ch:'第19章 短期利益計画（CVP分析）',t:'損益分岐点・安全余裕率・経営レバレッジ',r:'A',g(){
  const cmr=R.pick([0.25,0.3,0.4,0.5]); const p=R.int(10,50)*100; const v=p*(1-cmr); const F=cmr*R.int(10,60)*1000000; const bep=F/cmr;
  const S=bep*R.pick([1.25,1.5,2,1.6]); const G=cmr*R.int(2,20)*1000000; const cm=S*cmr, oi=cm-F;
  const opts=[['損益分岐点売上高',bep,'円',0],['目標営業利益'+Y(G)+'円を達成する売上高',(F+G)/cmr,'円',0],['安全余裕率',(S-bep)/S*100,'%',1],['経営レバレッジ係数',cm/oi,'',2]];
  const [ask,ans,u,dp]=R.pick(opts);
  const w= ask==='損益分岐点売上高'?[F/(1-cmr),F/cmr*1.2,bep+G/cmr,F*cmr]: ask.startsWith('目標')?[G/cmr,F/cmr,(F+G)/(1-cmr),(F-G)/cmr]: ask==='安全余裕率'?[bep/S*100,(S-bep)/bep*100,cmr*100,100-cmr*100]:[oi/cm,S/oi,cm/F,oi/F];
  return {q:P_(`製品の販売単価は${Y(p)}円，単位当たり変動費は${Y(v)}円，年間固定費は${Y(F)}円である。当期の売上高は${Y(S)}円であった。${ask}はいくらか${dp?`（小数点以下第${dp}位を四捨五入）`:''}。`),
    a:ans,u,dp,w,
    ex:`貢献利益率＝(${Y(p)}－${Y(v)})÷${Y(p)}＝${cmr}<br>損益分岐点売上高＝${Y(F)}÷${cmr}＝${Y(bep)}<br>目標利益達成売上高＝(固定費＋目標利益)÷貢献利益率<br>安全余裕率＝(売上高－損益分岐点売上高)÷売上高<br>経営レバレッジ係数＝貢献利益${Y(cm)}÷営業利益${Y(oi)}<br>よって<b>${yen(ans,dp)}${u}</b>`};
}});

C({id:'mg-cvp-mix',f:MM,ch:'第19章 短期利益計画（CVP分析）',t:'複数製品の損益分岐点（セールス・ミックス一定）',r:'A',g(){
  const pA=R.int(10,40)*100, vA=pA*R.pick([0.5,0.6,0.7]), pB=R.int(10,40)*100, vB=pB*R.pick([0.4,0.5,0.6]); const a=R.int(1,4), b=R.int(1,4);
  const cmSet=a*(pA-vA)+b*(pB-vB); const sets=R.int(2,20)*100; const F=cmSet*sets; const ans=sets*(a*pA+b*pB);
  return {q:P_(`製品Aの販売単価${Y(pA)}円・単位当たり変動費${Y(vA)}円，製品Bの販売単価${Y(pB)}円・単位当たり変動費${Y(vB)}円である。販売数量の比率はA：B＝${a}：${b}で一定とし，共通固定費は${Y(F)}円である。損益分岐点における売上高（A・B合計）はいくらか。`),
    a:ans,u:'円',w:[rd(F/(((pA-vA)/pA+(pB-vB)/pB)/2)),rd(F/((pA-vA)/pA)),rd(F/((pB-vB)/pB)),sets*(pA+pB),rd(F/((a*(pA-vA)+b*(pB-vB))/(a*pA+b*pB))*1.1)],
    ex:`1セット（A${a}個＋B${b}個）の貢献利益＝${a}×${Y(pA-vA)}＋${b}×${Y(pB-vB)}＝${Y(cmSet)}<br>損益分岐点セット数＝${Y(F)}÷${Y(cmSet)}＝${Y(sets)}セット<br>売上高＝${Y(sets)}×(${a}×${Y(pA)}＋${b}×${Y(pB)})＝<b>${Y(ans)}円</b>`};
}});

C({id:'mg-opt-mix',f:MM,ch:'第24章 戦術的意思決定',t:'最適セールス・ミックス（制約条件が1つ）',r:'A',g(){
  const cA=R.int(10,40)*100, hA=R.int(2,6), cB=R.int(10,40)*100, hB=R.int(2,6); if(cA/hA===cB/hB) throw 0;
  const DA=R.int(5,20)*100, DB=R.int(5,20)*100; const H=Math.round((DA*hA+DB*hB)*R.pick([0.6,0.7,0.8])); const F=R.int(10,50)*100000;
  const plan=(order)=>{ let h=H, cm=0; for(const [c,hh,D] of order){ const q=Math.min(D,Math.floor(h/hh)); cm+=q*c; h-=q*hh; } return cm; };
  const A=[cA,hA,DA], B=[cB,hB,DB];
  const best=cA/hA>cB/hB?plan([A,B]):plan([B,A]); const byUnit=cA>cB?plan([A,B]):plan([B,A]); const worst=cA/hA>cB/hB?plan([B,A]):plan([A,B]);
  if(best===byUnit && best===worst) throw 0;
  return {q:P_(`製品A（単位当たり貢献利益${Y(cA)}円，機械作業時間${hA}時間/個，最大需要量${Y(DA)}個）と製品B（単位当たり貢献利益${Y(cB)}円，機械作業時間${hB}時間/個，最大需要量${Y(DB)}個）を製造販売している。月間の機械作業時間は${Y(H)}時間が上限であり，固定費は${Y(F)}円である。営業利益を最大にするセールス・ミックスのときの営業利益はいくらか。`),
    a:best-F,u:'円',neg:true,w:[byUnit-F,worst-F,best,DA*cA+DB*cB-F],
    ex:`制約条件である機械作業時間1時間当たりの貢献利益で優先順位を決める。A：${Y(cA)}÷${hA}＝${yen(cA/hA,1)}，B：${Y(cB)}÷${hB}＝${yen(cB/hB,1)}<br>優先製品を需要量まで生産し，残りの時間で他方を生産すると貢献利益${Y(best)}<br>営業利益＝${Y(best)}－${Y(F)}＝<b>${yen(best-F)}円</b>`};
}});

C({id:'mg-special',f:MM,ch:'第24章 戦術的意思決定',t:'特別注文の引受可否（差額原価収益分析）',r:'A',g(){
  const v=R.int(20,60)*100; const fu=R.int(5,20)*100; const q=v+R.int(-4,12)*100; const n=R.int(2,10)*100; const E=R.int(0,6)*50000;
  const d=n*(q-v)-E;
  return {q:P_(`当社は遊休生産能力を有している。製品の単位当たり製造原価は変動費${Y(v)}円，固定費配賦額${Y(fu)}円（固定費総額は注文の引受けにより変化しない）である。顧客から${Y(n)}個を1個${Y(q)}円で購入したいとの特別注文があり，引き受ける場合は専用治具の購入費${Y(E)}円が追加で発生する。この注文を引き受けた場合の差額利益はいくらか（増加はプラス，減少は△）。`),
    a:d,u:'円',neg:true,w:[n*(q-v-fu)-E,n*(q-v),n*(q-v)+E,n*(q-v-fu)],
    ex:`固定費配賦額は注文の有無で変わらない埋没原価であり無関連。<br>差額収益${Y(n*q)}－差額原価(変動費${Y(n*v)}＋治具${Y(E)})＝<b>${yen(d)}円</b>`};
}});

C({id:'mg-make-buy',f:MM,ch:'第24章 戦術的意思決定',t:'部品の自製か購入か',r:'A',g(){
  const n=R.int(10,50)*100; const dm=R.int(5,20)*100, dl=R.int(5,20)*100, voh=R.int(2,8)*100, foh=R.int(3,10)*100; const FA=R.int(0,10)*100000; const p=dm+dl+voh+R.int(-3,8)*100;
  const make=n*(dm+dl+voh)+FA, buy=n*p; const d=buy-make;
  return {q:P_(`部品${Y(n)}個を自製するか外部から購入するかを検討している。自製する場合の単位当たり原価は直接材料費${Y(dm)}円，直接労務費${Y(dl)}円，変動製造間接費${Y(voh)}円，固定製造間接費配賦額${Y(foh)}円である。固定製造間接費は購入しても発生するが，自製する場合に限り設備の賃借料${Y(FA)}円が追加で発生する。購入単価は${Y(p)}円である。購入原価と自製原価の差額（購入原価－自製原価）はいくらか（△はマイナス）。`),
    a:d,u:'円',neg:true,w:[buy-n*(dm+dl+voh+foh)-FA,buy-n*(dm+dl+voh),-d,buy-n*(dm+dl)-FA],
    ex:`自製の差額原価＝${Y(n)}×(${dm}＋${dl}＋${voh})＋賃借料${Y(FA)}＝${Y(make)}（固定製造間接費配賦額は無関連原価）<br>購入原価＝${Y(n)}×${p}＝${Y(buy)}<br>差額＝<b>${yen(d)}円</b>（${d>0?'自製が有利':d<0?'購入が有利':'同額'}）`};
}});

const annuity=(r,n)=>{let s=0;for(let t=1;t<=n;t++)s+=1/Math.pow(1+r/100,t);return Math.round(s*10000)/10000;};
C({id:'mg-npv',f:MM,ch:'第25章 戦略的意思決定（設備投資）',t:'設備投資の正味現在価値（税引後CF）',r:'A',g(){
  const n=R.pick([3,4,5]); const r=R.pick([6,8,10]); const t=R.pick([30,40]); const I=n*R.int(5,30)*1000000; const D=I/n;
  const Rv=R.int(20,80)*1000000, E=rd(Rv*R.pick([0.5,0.6,0.7]),100000); const cf=(Rv-E-D)*(1-t/100)+D; const fac=annuity(r,n);
  const npv=rd(cf*fac)-I; const ask=R.pick(['正味現在価値','各年度の税引後キャッシュ・フロー']);
  return {q:P_(`設備投資案を検討している。設備の取得原価は${Y(I)}円（耐用年数${n}年，残存価額ゼロ，定額法），毎年の売上収入は${Y(Rv)}円，現金支出費用は${Y(E)}円である。法人税率は${t}%，資本コストは${r}%，${r}%・${n}年の年金現価係数は${fac}とする。キャッシュ・フローは各年度末に生じるものとする。この投資案の${ask}はいくらか（円未満四捨五入）。`),
    a: ask==='正味現在価値'?npv:cf, u:'円', neg:true, w: ask==='正味現在価値'?[rd((Rv-E)*fac)-I,rd((Rv-E)*(1-t/100)*fac)-I,rd(cf*n)-I,rd((Rv-E-D)*(1-t/100)*fac)-I]:[(Rv-E)*(1-t/100),Rv-E-D,(Rv-E-D)*(1-t/100),(Rv-E)*(1-t/100)-D*t/100],
    ex:`税引後CF＝(収入${Y(Rv)}－現金支出${Y(E)})×(1－${t}%)＋減価償却費${Y(D)}×${t}%＝${Y(cf)}（タックス・シールドを加える）<br>正味現在価値＝${Y(cf)}×${fac}－${Y(I)}＝${yen(npv)}<br>よって<b>${yen(ask==='正味現在価値'?npv:cf)}円</b>`};
}});

C({id:'mg-payback',f:MM,ch:'第25章 戦略的意思決定（設備投資）',t:'回収期間法',r:'B',g(){
  const cfs=[R.int(10,40),R.int(10,40),R.int(10,40),R.int(10,40),R.int(10,40)].map(x=>x*1000000); const k=R.int(2,4);
  let cum=0; for(let i=0;i<k-1;i++)cum+=cfs[i]; const frac=R.pick([0.2,0.25,0.4,0.5,0.6,0.75,0.8]); const I=cum+cfs[k-1]*frac;
  const ans=(k-1)+frac; const avg=cfs.reduce((a,b)=>a+b)/5;
  return {q:P_(`投資額${Y(I)}円の投資案の各年度末のキャッシュ・インフローは，1年目${Y(cfs[0])}円，2年目${Y(cfs[1])}円，3年目${Y(cfs[2])}円，4年目${Y(cfs[3])}円，5年目${Y(cfs[4])}円である。累積法による回収期間は何年か（年度内のキャッシュ・フローは均等に生じると仮定し，小数点以下第3位を四捨五入）。`),
    a:ans,u:'年',dp:2,w:[I/avg,k,k-1,ans+0.5,I/cfs[0]],
    ex:`${k-1}年目までの累積回収額＝${Y(cum)}，未回収額＝${Y(I-cum)}<br>${k}年目：${Y(I-cum)}÷${Y(cfs[k-1])}＝${frac}年<br>回収期間＝${k-1}＋${frac}＝<b>${ans.toFixed(2)}年</b>`};
}});

C({id:'mg-sales-var',f:MM,ch:'第20章 予算管理',t:'売上高差異・販売数量差異の分析',r:'A',g(){
  const pb=R.int(10,40)*100, vb=pb*R.pick([0.5,0.6,0.7]); const qb=R.int(10,50)*100; const pa=pb+R.int(-5,5)*20; const qa=qb+R.int(-10,10)*50;
  const pv=(pa-pb)*qa, qvS=(qa-qb)*pb, qvC=(qa-qb)*(pb-vb);
  const opts=[['販売価格差異',pv],['販売数量差異（売上高の分析）',qvS],['販売数量差異（貢献利益の分析，予算の単位当たり貢献利益による）',qvC]]; const [ask,ans]=R.pick(opts);
  return {q:P_(`予算：販売単価${Y(pb)}円，販売数量${Y(qb)}個，単位当たり変動費${Y(vb)}円。実績：販売単価${Y(pa)}円，販売数量${Y(qa)}個。${ask}はいくらか（有利差異はプラス，不利差異は△）。`),
    a:ans,u:'円',neg:true,w:[pv,qvS,qvC,(pa-pb)*qb,(qa-qb)*pa,-ans].filter(x=>x!==ans),
    ex:`販売価格差異＝(実際単価－予算単価)×実際数量＝${yen(pv)}<br>販売数量差異（売上高）＝(実際数量－予算数量)×予算単価＝${yen(qvS)}<br>販売数量差異（貢献利益）＝(実際数量－予算数量)×予算単位貢献利益${Y(pb-vb)}＝${yen(qvC)}<br>よって<b>${yen(ans)}円</b>`};
}});

C({id:'mg-ri',f:MM,ch:'事業部の業績評価',t:'事業部の投資利益率と残余利益',r:'A',g(){
  const I=R.int(10,50)*10000000; const roi=R.pick([12,15,18,20]); const P=I*roi/100; const c=R.pick([8,10]); const dI=R.int(2,10)*10000000; const r2=R.pick([c+1,c+2,roi-1]); const dP=dI*r2/100;
  const ri=P+dP-(I+dI)*c/100; const roiAfter=(P+dP)/(I+dI)*100;
  const ask=R.pick(['新規投資後の残余利益','新規投資後の投資利益率']);
  return {q:P_(`A事業部の投資額は${Y(I)}円，事業部利益は${Y(P)}円である。新規投資（投資額${Y(dI)}円，追加利益${Y(dP)}円）を検討している。資本コスト率は${c}%である。${ask}はいくらか${ask.includes('率')?'（%，小数点以下第2位を四捨五入）':''}。`),
    a: ask.includes('率')?roiAfter:ri, u: ask.includes('率')?'%':'円', dp: ask.includes('率')?1:0, neg:true,
    w: ask.includes('率')?[roi,r2,(roi+r2)/2,(P+dP)/I*100]:[P-I*c/100,dP-dI*c/100,P+dP-I*c/100,(P+dP)*(1-c/100)],
    ex:`残余利益＝事業部利益－投資額×資本コスト率＝${Y(P+dP)}－${Y(I+dI)}×${c}%＝${yen(ri)}<br>投資利益率＝${Y(P+dP)}÷${Y(I+dI)}＝${roiAfter.toFixed(1)}%<br>（新規投資の利益率${r2}%が資本コスト${c}%を上回るため残余利益は増加するが，現状の投資利益率${roi}%を下回る場合は事業部の投資利益率は低下する＝部分最適化の問題）`};
}});

C({id:'mg-eoq',f:MM,ch:'在庫管理',t:'経済的発注量',r:'B',g(){
  const Q=R.pick([100,200,300,400,500,600,800]); const H=R.pick([100,200,250,400,500]); const S=R.pick([1000,2000,2500,5000,8000]); const D=Q*Q*H/(2*S);
  if(!Number.isInteger(D)) throw 0;
  const ask=R.pick(['経済的発注量','経済的発注量で発注した場合の年間の発注費と保管費の合計']);
  const tc=H*Q/2+S*D/Q;
  return {q:P_(`材料の年間需要量は${Y(D)}個，1回当たりの発注費は${Y(S)}円，材料1個当たりの年間保管費は${Y(H)}円である。${ask}はいくらか。`),
    a: ask==='経済的発注量'?Q:tc, u: ask==='経済的発注量'?'個':'円', w: ask==='経済的発注量'?[Math.round(Math.sqrt(D*S/H)),Math.round(Math.sqrt(2*D*H/S)),Q*2,Math.round(Q/Math.SQRT2)]:[H*Q,S*D/Q,tc*2,H*Q/2],
    ex:`経済的発注量＝√(2×年間需要量×1回の発注費÷1個当たり年間保管費)＝√(2×${Y(D)}×${Y(S)}÷${Y(H)})＝${Y(Q)}個<br>このとき保管費＝${Y(H)}×${Q}/2＝${Y(H*Q/2)}，発注費＝${Y(S)}×${Y(D)}/${Q}＝${Y(S*D/Q)}（両者が等しくなる）<br>よって<b>${Y(ask==='経済的発注量'?Q:tc)}${ask==='経済的発注量'?'個':'円'}</b>`};
}});

C({id:'mg-hilo',f:MM,ch:'第19章 短期利益計画（原価予測）',t:'高低点法による原価分解',r:'A',g(){
  const v=R.int(2,15)*10; const F=R.int(20,80)*10000; const acts=R.shuffle([R.int(30,40),R.int(41,50),R.int(51,60),R.int(61,70),R.int(71,80),R.int(81,95)].map(x=>x*100));
  const mx=Math.max(...acts), mn=Math.min(...acts);
  const rows=acts.map((a,i)=>[`${i+1}月`,a+'時間',F+v*a+((a===mx||a===mn)?0:R.int(-5,5)*1000)]);
  const X=R.int(50,90)*100; const ask=R.pick(['月間固定費',`操業度${Y(X)}時間における原価の予測額`]);
  const ans= ask==='月間固定費'?F:F+v*X;
  return {q:P_(`過去6か月の機械稼働時間と製造間接費の実績は次のとおりである（異常値はない）。高低点法により原価分解したときの${ask}はいくらか。`)+tbl(rows,['月','機械稼働時間','製造間接費']),
    a:ans,u:'円',w: ask==='月間固定費'?[F+v*mn,F-v*100,(F+v*mx)-(v+10)*mx,Math.round(rows.reduce((s,r)=>s+r[2],0)/6)]:[F+v*mx,v*X,F+v*X+v*100,Math.round((F+v*mn)/mn*X)],
    ex:`変動費率＝(最高点原価－最低点原価)÷(最高操業度${mx}－最低操業度${mn})＝＠${v}<br>固定費＝最高点原価${Y(F+v*mx)}－＠${v}×${mx}＝${Y(F)}<br>よって<b>${Y(ans)}円</b>`};
}});

C({id:'mg-ratio',f:MM,ch:'第21章 経営分析',t:'財務比率の計算',r:'B',g(){
  const TA=R.int(50,200)*1000000; const EQ=rd(TA*R.pick([0.3,0.4,0.5,0.6]),1000000); const CA=rd(TA*R.pick([0.4,0.5,0.6]),1000000); const CL=rd(CA*R.pick([0.5,0.6,0.8]),1000000);
  const S=TA*R.pick([1.2,1.5,2]); const OP=rd(S*R.pick([0.05,0.08,0.1]),100000); const OR=OP-R.int(-5,5)*100000; const NI=rd(OR*0.65,100000);
  const opts=[['流動比率',CA/CL*100,'%',1],['自己資本比率',EQ/TA*100,'%',1],['自己資本利益率（ROE，当期純利益ベース）',NI/EQ*100,'%',1],['総資本経常利益率',OR/TA*100,'%',1],['総資本回転率',S/TA,'回',2],['売上高営業利益率',OP/S*100,'%',1]];
  const [ask,ans,u,dp]=R.pick(opts);
  return {q:P_(`期末の貸借対照表と当期の損益計算書から，${ask}を求めなさい（期末残高を用い，小数点以下第${dp+1}位を四捨五入）。`)+tbl([['総資産',TA],['流動資産',CA],['流動負債',CL],['純資産（自己資本）',EQ],['売上高',S],['営業利益',OP],['経常利益',OR],['当期純利益',NI]],['項目','金額']),
    a:ans,u,dp,w:opts.filter(o=>o[0]!==ask&&o[2]===u).map(o=>o[1]).concat([ans*1.1,ans*0.9]),
    ex:`流動比率＝流動資産÷流動負債，自己資本比率＝自己資本÷総資本，ROE＝当期純利益÷自己資本，総資本経常利益率＝経常利益÷総資本，総資本回転率＝売上高÷総資本，売上高営業利益率＝営業利益÷売上高<br>よって<b>${yen(ans,dp)}${u}</b>`};
}});

C({id:'mg-abc',f:MM,ch:'第28章 活動基準原価計算',t:'活動基準原価計算（ABC）',r:'B',g(){
  const pools=[['段取活動','段取回数',R.int(20,60)],['検査活動','検査回数',R.int(20,80)],['機械運転活動','機械時間',R.int(200,800)*10]];
  const rows=[]; let abc=0, tot=0; let mhA=0, mhT=0;
  for(const [nm,drv,n] of pools){ const rate=R.int(5,50)*100; const cost=rate*n; const a=Math.round(n*R.pick([0.2,0.3,0.4,0.6])); abc+=rate*a; tot+=cost; rows.push([nm,cost,drv,`${n}（うちA ${a}）`]); if(drv==='機械時間'){mhA=a;mhT=n;} }
  const trad=rd(tot*mhA/mhT);
  return {q:P_('活動基準原価計算により製品Aに配賦される製造間接費はいくらか。')+tbl(rows,['活動','活動原価','コスト・ドライバー','ドライバー総量']),
    a:abc,u:'円',w:[trad,rd(tot/2),rd(abc*1.15),rd(abc*0.85),trad+rd(abc-trad)*2],
    ex:`各活動のコスト・ドライバー・レート（活動原価÷ドライバー総量）×製品Aのドライバー量を合計して<b>${Y(abc)}円</b><br>（参考：機械時間のみを基準とする伝統的配賦では${Y(trad)}円）`};
}});

C({id:'mg-ccc',f:MM,ch:'第22章 資金管理とキャッシュ・フロー管理',t:'キャッシュ・コンバージョン・サイクル',r:'B',g(){
  const k=R.int(2,10); const S=365*k*1000000; const ar=R.int(30,90), inv=R.int(20,80), ap=R.int(20,70);
  const AR=ar*k*1000000, INV=inv*k*1000000, AP=ap*k*1000000; const ans=ar+inv-ap;

    a:ans,u:'日',neg:true,w:[ar+inv+ap,ar-inv+ap,ar+inv,inv-ap+ar/2],
    ex:`売上債権回転日数${ar}日＋棚卸資産回転日数${inv}日－仕入債務回転日数${ap}日＝<b>${ans}日</b>`};
}});

const MT='mg-ct', MN='mg-mt';
T({id:'mgt-essence',f:MT,ch:'第1章 原価計算の目的と一般的基準',t:'原価計算の目的と原価の本質',r:'A',
T:['原価計算基準は，原価計算の目的として，財務諸表作成目的，価格計算目的，原価管理目的，予算管理目的，基本計画設定目的を掲げている。',
'原価とは，経営における一定の給付にかかわらせて把握された財貨又は用役の消費を，貨幣価値的に表したものである。',
'原価は経営目的に関連したものであるため，支払利息などの財務活動に伴う費用は原則として原価に算入しない。',

'原価計算制度は財務会計機構と有機的に結びつき常時継続的に行われる計算体系であり，特殊原価調査はこれに含まれない。'],
F:[['原価計算基準が掲げる原価計算の目的には，経営の基本計画の設定は含まれない。','基本計画設定目的も含まれる。'],
['支払利息などの財務費用は，製品の製造に必要な資金に係るものであるため原価に含める。','財務費用は非原価項目である。'],
['異常な仕損や火災による損失も，製品の製造に関連する限り原価に算入する。','異常な状態に基づく価値の減少は非原価項目である。'],
['法人税や配当金も，経営活動に伴う価値の消費であるため原価に含まれる。','利益剰余金に課する税額や配当金は非原価項目である。'],

T({id:'mgt-concepts',f:MT,ch:'第1章 原価計算の目的と一般的基準',t:'原価の諸概念と原価要素の分類',r:'A',
T:['原価を予定価格等をもって計算しても，消費量を実際によって計算する限り，それは実際原価の計算である。',
'標準原価とは，財貨の消費量を科学的，統計的調査に基づいて能率の尺度となるように予定し，かつ予定価格又は正常価格をもって計算した原価をいう。',
'製品原価とは一定単位の製品に集計された原価をいい，期間原価とは一定期間における発生額を当期の収益に直接対応させて把握した原価をいう。',
'原価要素は，操業度との関連において固定費と変動費とに分類される。',
'原価要素は，製品との関連において直接費と間接費とに分類される。'],
F:[['予定価格を用いて計算した原価は，消費量が実際であっても実際原価には該当しない。','消費量が実際であれば実際原価の計算である。'],
['標準原価は，財貨の消費量を過去の実績の平均として予定したものであり，能率の尺度とはならない。','科学的・統計的調査に基づき能率の尺度となるように予定したものである。'],
['準変動費とは，ある範囲内の操業度の変化では固定的であり，これを超えると急増し，再び固定化する原価要素をいう。','それは準固定費の説明である。準変動費は操業度ゼロでも一定額が発生し，操業度に比例して増加する原価要素である。'],

T({id:'mgt-elements',f:MT,ch:'第3章〜第5章 材料費・労務費・経費',t:'材料費・労務費・経費の計算',r:'A',
T:['材料の購入原価は，購入代価に引取運賃，荷役費，保険料，関税など材料買入に要した引取費用を加算した金額とする。',
'材料の消費価格は，必要ある場合には予定価格等をもって計算することができる。',

'経費は原則として当該原価計算期間の実際発生額をもって計算するが，必要ある場合には予定価格又は予定額をもって計算することができる。'],

T({id:'mgt-overhead',f:MT,ch:'第6章 製造間接費',t:'製造間接費の配賦と基準操業度',r:'A',
T:['個別原価計算において，部門間接費は原則として予定配賦率をもって各指図書に配賦する。',
'予定配賦率は，一定期間における部門間接費予定額を，同期間における当該部門の予定配賦基準の総数で除して算定する。',
'基準操業度には，実際的生産能力，平均操業度（正常操業度），期待実際操業度（予定操業度）などがある。',
'実際的生産能力とは，理論的生産能力から機械の故障や段取替えなど不可避的な作業休止による減少分を差し引いた操業度である。',
'変動予算とは，予算期間に予期される範囲内の種々の操業度に対応して算定した予算をいう。'],
F:[['製造間接費の予定配賦によって生じた配賦差異は，原則として期末の仕掛品と製品に配賦しなければならない。','原則として当年度の売上原価に賦課する。'],
['理論的生産能力とは，機械の故障や段取替えなどの不可避的な作業休止を考慮した現実的な最大操業度である。','それは実際的生産能力の説明である。理論的生産能力は作業休止を考慮しない理論上の最大操業度である。'],
['公式法変動予算において，操業度差異は変動費の予算許容額と実際発生額との差額として把握される。','操業度差異は固定費率×(実際操業度－基準操業度)で把握される。'],
['期待実際操業度（予定操業度）は，数年間の平均的な販売量に基づいて決定される操業度である。','それは平均操業度（正常操業度）の説明である。期待実際操業度は次の1年間に予想される操業度である。'],
['予算差異は，製造間接費の実際発生額と予定配賦額との差額である。','それは配賦差異（総差異）である。予算差異は実際操業度における予算許容額と実際発生額との差額である。']]});

T({id:'mgt-dept',f:MT,ch:'第7章 部門別計算',t:'部門別計算',r:'A',

'直接配賦法は，補助部門間の用役の授受を無視し，補助部門費を製造部門にのみ配賦する方法である。',
'階梯式配賦法は，補助部門に順位を付け，上位の補助部門費を下位の補助部門と製造部門に配賦していく方法である。',
'部門個別費は原価部門に直課し，部門共通費は適当な配賦基準によって関係部門に配賦する。'],
F:[['補助部門費の配賦方法として原価計算基準が規定しているのは，相互配賦法のみである。','直接配賦法・階梯式配賦法・相互配賦法などがある。'],
['直接配賦法は，補助部門間相互の用役の授受を計算上すべて考慮するため，最も正確な方法である。','直接配賦法は補助部門間の用役授受を無視する方法である。'],
['階梯式配賦法では，他の補助部門への用役提供が少ない補助部門から先に配賦する。','他の補助部門へ用役を多く提供している補助部門を上位（先）とする。'],
['部門共通費は，特定の部門での発生が認識できるため，すべて直課しなければならない。','部門共通費は適当な配賦基準によって配賦する。'],
['単一基準配賦法とは，補助部門費を変動費と固定費に分け，それぞれ異なる配賦基準で配賦する方法である。','それは複数基準配賦法の説明である。']]});

T({id:'mgt-job',f:MT,ch:'第9章 個別原価計算',t:'個別原価計算',r:'A',
T:['個別原価計算は，種類を異にする製品を個別的に生産する生産形態に適用される。',
'個別原価計算では，特定製造指図書について個別的に直接費及び間接費を集計し，製品原価は指図書に集計された製造原価をもって計算する。',
'仕損が補修によって回復でき，補修指図書を発行する場合には，補修指図書に集計された製造原価を仕損費とする。',
'軽微な仕損については，仕損費を計上せず，単に仕損品の見積売却価額又は見積利用価額を当該指図書に集計された製造原価から控除するにとどめることができる。',
'仕損費は，当該指図書に賦課するほか，間接費として仕損の発生部門に賦課する方法もある。'],
F:[['個別原価計算は，標準規格製品を連続生産する生産形態に適用される。','それは総合原価計算の適用対象である。'],
['個別原価計算では，直接費・間接費の区別を行わず，すべてを期間原価として処理する。','直接費は指図書に直課し，間接費は配賦して製品原価とする。'],
['作業くずの評価額は，必ず雑益として処理しなければならない。','原則として発生部門の部門費から控除する（指図書の直接材料費・製造原価から控除することもある）。'],
['個別原価計算において，部門間接費は原則として実際配賦率をもって各指図書に配賦する。','原則は予定配賦率である。']]});

T({id:'mgt-process',f:MT,ch:'第10章 単純総合原価計算',t:'総合原価計算と仕損・減損',r:'A',
T:['総合原価計算は，同種製品を反復連続的に生産する生産形態に適用される。',
'加工費について月末仕掛品の完成品換算量を算定する場合には，進捗度を用いる。',
'正常な仕損が工程の終点で発生した場合，その仕損費は完成品のみに負担させる。',
'正常な仕損が工程の始点で発生した場合，その仕損費は完成品と月末仕掛品の数量の割合で両者に負担させる。',
'度外視法では，正常仕損費を別個に計算せず，良品に自動的に負担させる。'],
F:[['先入先出法では，月初仕掛品原価と当月製造費用の合計額を完成品と月末仕掛品に按分する。','それは平均法の説明である。先入先出法では当月製造費用を按分する。'],
['正常な仕損が工程の終点で発生した場合でも，月末仕掛品に仕損費を負担させなければならない。','終点発生の仕損費は完成品のみに負担させる。'],
['異常仕損費は，正常仕損費と同様に良品の原価に含める。','異常仕損費は非原価項目である。'],
['平均法では，月初仕掛品から優先的に完成したものとみなして計算する。','それは先入先出法の考え方である。平均法は月初分と当月投入分を区別せず平均単価で計算する。'],
['仕損品に評価額がある場合でも，その評価額は仕損費の計算上考慮しない。','仕損品の評価額は控除する。']]});

T({id:'mgt-special',f:MT,ch:'第11章〜第14章 工程別・組別・等級別・連産品',t:'工程別・組別・等級別総合原価計算と連産品',r:'B',
T:['工程別総合原価計算の累加法では，前工程の完成品原価を次工程の前工程費として次工程の製造費用に加算する。',
'組別総合原価計算では，組直接費は各組に直課し，組間接費は適当な配賦基準により各組に配賦する。',
'等級別総合原価計算は，同一工程において同種製品を連続生産するが，その製品を形状，大きさ，品位等によって等級に区別する場合に適用される。',
'連産品とは，同一工程において同一原料から生産される異種の製品であって，相互に主副を明確に区別できないものをいう。',
'副産物の価額は，原則として主産物の総合原価から控除する。'],
F:[['連産品の結合原価は，各連産品の生産量の割合でのみ按分しなければならない。','正常市価等を基準として定めた等価係数に基づき按分する。'],
['副産物の評価額は，主産物の総合原価に加算する。','主産物の総合原価から控除する。'],
['非累加法では，各工程の完成品原価を順次次工程に振り替えて計算する。','それは累加法の説明である。'],
['等級別総合原価計算は，異種製品を組別に連続生産する場合に適用される。','それは組別総合原価計算の説明である。'],
['連産品の按分に用いる正常市価は，分離後に追加加工を要する場合でも最終製品の市価をそのまま用いる。','分離後の加工費を控除した見積正常市価を用いる。']]});

T({id:'mgt-standard',f:MT,ch:'第15章 標準原価計算',t:'標準原価計算',r:'A',
T:['標準原価計算の目的には，原価管理，真実の原価としての棚卸資産価額及び売上原価の算定，予算編成への資料提供，記帳の簡略化・迅速化がある。',
'原価管理のために理想標準原価が用いられることがあるが，これは原価計算基準にいう制度としての標準原価ではない。',
'標準原価は，生産の基本条件や材料価格・賃率等に重大な変化が生じた場合には，現状に即するように改訂する。',
'標準原価計算制度における原価差異は，原則として当年度の売上原価に賦課する。',
'数量差異，作業時間差異，能率差異等であって異常な状態に基づくと認められるものは，非原価項目として処理する。'],
F:[['原価計算制度における標準原価には，理想標準原価も含まれる。','理想標準原価は制度としての標準原価ではない。'],
['標準原価は，いったん設定したら生産条件に重大な変化が生じても改訂してはならない。','重大な変化が生じた場合には改訂する。'],
['正常原価とは，比較的短期における予定操業度及び予定価格を前提として決定された原価をいう。','正常原価は，比較的長期の過去の実際数値を統計的に平準化し，将来のすう勢を加味した正常能率・正常操業度・正常価格に基づく原価である。'],
['標準原価計算制度において生じた原価差異は，すべて期末の仕掛品・製品に配賦しなければならない。','原則として当年度の売上原価に賦課する。'],
['直接材料費の価格差異は，材料の消費時にしか把握することができない。','材料の受入時に把握する方法（材料受入価格差異）もある。']]});

T({id:'mgt-variance',f:MT,ch:'第15章 標準原価計算',t:'原価差異の会計処理',r:'B',

'異常な状態に基づく原価差異は，非原価項目として処理する。'],

['原価差異は，すべて営業外損益として処理する。','原則として売上原価に賦課し，異常なものは非原価項目とする。'],
['標準が不適当なため比較的多額の原価差異が生じた場合は，その差異を非原価項目とする。','売上原価と期末棚卸資産に配賦する。']]});

/* ---- 管理会計分野 ---- */
T({id:'mgt-dc',f:MN,ch:'第17章 直接原価計算',t:'直接原価計算',r:'A',
T:['直接原価計算は，原価を変動費と固定費に分解し，変動費のみで製品原価を計算し，固定費は期間原価として処理する計算方法である。',
'直接原価計算では，営業利益は販売量に応じて変化し，生産量の増減の影響を受けない。',
'直接原価計算はCVP関係を明らかにするため，短期利益計画に有用な情報を提供する。',
'直接原価計算を外部報告に用いる場合には，固定費調整を行い全部原価計算による利益に修正する必要がある。',
'全部原価計算では，販売量が一定でも生産量を増加させて在庫を積み増すことで，営業利益を増加させることができる。'],
F:[['直接原価計算では，固定製造間接費を製品原価に含め，販売時に費用化する。','固定製造間接費は期間原価として発生期に全額費用処理する。'],
['直接原価計算では，販売量が一定であっても生産量が増えると営業利益が増加する。','それは全部原価計算の特徴である。'],
['期末在庫量が期首在庫量より多い場合（単位当たり固定費一定），直接原価計算の営業利益は全部原価計算の営業利益より大きくなる。','固定費の一部が在庫に繰り越される全部原価計算の方が大きくなる。'],
['直接原価計算は，原価計算基準において財務諸表作成のための原価計算として原則的に認められている。','原価計算基準は全部原価計算を原則としている。'],
['直接原価計算における貢献利益とは，売上高から全部製造原価を差し引いた利益をいう。','貢献利益は売上高から変動費を差し引いた利益である。']]});

T({id:'mgt-cvp',f:MN,ch:'第19章 短期利益計画のための管理会計',t:'CVP分析',r:'A',
T:['損益分岐点売上高は，固定費を貢献利益率で除して算定する。',
'安全余裕率は，売上高が損益分岐点売上高をどれだけ上回っているかを示す比率であり，高いほど安全性が高い。',
'経営レバレッジ係数は貢献利益を営業利益で除して算定され，売上高の変化率に対する営業利益の変化率の倍率を示す。',
'損益分岐点比率と安全余裕率の合計は100%となる。',
'原価の固変分解の方法には，費目別精査法，高低点法，スキャッター・チャート法，最小自乗法などがある。'],
F:[['損益分岐点売上高は，固定費を変動費率で除して算定する。','貢献利益率（1－変動費率）で除す。'],
['安全余裕率が高いほど，売上高の減少に対する抵抗力は弱い。','安全余裕率が高いほど抵抗力は強い。'],
['経営レバレッジ係数は，営業利益を貢献利益で除して算定する。','貢献利益を営業利益で除す。'],
['高低点法では，最高点と最低点の実績に加え，全データの平均値も用いて変動費率を算定する。','最高操業度と最低操業度の2点のみを用いる。'],
['他の条件が一定であれば，変動費率が上昇すると損益分岐点売上高は低下する。','貢献利益率が低下するため損益分岐点売上高は上昇する。']]});

T({id:'mgt-budget',f:MN,ch:'第20章 予算管理',t:'予算管理',r:'A',
T:['予算は企業の総合的な利益計画を貨幣額で表示したものであり，計画・調整・統制の機能を有する。',
'総合予算は，経常予算と資本予算から構成され，経常予算はさらに損益予算と資金予算に分けられる。',
'参加型予算は，予算編成に下位の管理者を参加させる方式であり，予算目標に対する動機付けを高める効果が期待される。',
'予算スラックとは，管理者が予算を達成しやすくするため，収益を過小に，費用を過大に見積ることにより生じる予算の余裕をいう。',
'販売価格差異は，（実際販売価格－予算販売価格）×実際販売数量で算定する。'],
F:[['参加型予算では，予算スラックが生じる余地はないとされる。','参加型予算では下位管理者が情報を操作できるため，予算スラックが生じやすい。'],
['割当型（トップダウン型）予算は，下位管理者の動機付けを最も高める方式とされる。','下位管理者の受容性が低くなりやすく，動機付けの面では参加型予算が優れるとされる。'],
['販売数量差異は，（実際販売数量－予算販売数量）×実際販売価格で算定する。','予算販売価格（又は予算単位貢献利益）を乗じる。'],
['予算は計画機能を有するが，統制機能は有しない。','予算は統制機能も有する。'],
['ゼロベース予算は，前年度の予算額を基礎に増減を調整して予算を編成する方式である。','それは増分予算の説明である。ゼロベース予算は既存の活動も含めてゼロから見直す。']]});

T({id:'mgt-decision',f:MN,ch:'第23章〜第24章 意思決定',t:'意思決定のための原価概念',r:'A',
T:['差額原価とは，特定の意思決定の代替案の間で異なる原価をいい，意思決定にとって関連原価となる。',
'埋没原価とは，過去の意思決定によって既に発生し，いずれの代替案を選択しても変わらない原価であり，意思決定には無関連である。',
'機会原価とは，ある代替案を選択したことによって断念された他の代替案から得られたであろう最大の利益をいう。',
'遊休生産能力がある場合の特別注文の受諾の判断では，固定費の配賦額は原則として無関連原価となる。',
'制約条件が一つの場合の最適セールス・ミックスは，制約資源単位当たりの貢献利益が大きい製品を優先して決定する。'],
F:[['埋没原価は過去に支出した金額であるため，将来の意思決定において必ず考慮しなければならない。','埋没原価は意思決定に無関連である。'],
['機会原価は実際の支出を伴うため，会計帳簿に記録される。','機会原価は支出を伴わず，帳簿には記録されない。'],
['制約条件が一つの場合，製品単位当たりの貢献利益が最も大きい製品を優先して生産すべきである。','制約資源単位当たりの貢献利益で判断する。'],
['自製か購入かの意思決定では，自製を中止しても回避できない固定費も差額原価として考慮する。','回避不能な固定費は無関連原価である。'],
['戦略的（構造的）意思決定とは，経営の基本構造を所与として日常的・反復的に行われる意思決定である。','それは戦術的（業務的）意思決定の説明である。']]});

T({id:'mgt-capex',f:MN,ch:'第25章 戦略的意思決定（設備投資の経済性計算）',t:'設備投資の経済性計算',r:'A',
T:['正味現在価値法は，将来キャッシュ・フローの現在価値合計から投資額を差し引き，正であれば投資案を採用する方法である。',
'内部利益率法は，キャッシュ・インフローの現在価値合計と投資額が等しくなる割引率を求め，それが資本コストを上回る場合に投資案を採用する方法である。',
'単純回収期間法は貨幣の時間価値を考慮せず，回収後のキャッシュ・フローも評価に反映されないという欠点がある。',
'減価償却費は現金支出を伴わないが，法人税を節約する効果（タックス・シールド）を通じてキャッシュ・フローに影響する。',
'相互排他的な投資案について正味現在価値法と内部利益率法の結論が異なる場合には，一般に正味現在価値法の結論が優先される。'],
F:[['内部利益率法は投資規模の違いを正しく反映できるため，相互排他的投資案の順位付けで常に正味現在価値法より優れている。','内部利益率は比率であり規模の違いを反映できないため，順位付けでは正味現在価値法が優れるとされる。'],
['設備投資の経済性計算では，キャッシュ・フローではなく会計上の利益を用いることが原則である。','キャッシュ・フローを用いるのが原則である。'],
['減価償却費は非現金支出費用であるため，税引後キャッシュ・フローの計算には一切影響しない。','タックス・シールドを通じて影響する。'],
['会計的利益率法は，貨幣の時間価値を考慮した割引計算を行う方法である。','会計上の利益を用い，貨幣の時間価値は考慮しない。'],
['回収期間法は，回収期間後のキャッシュ・フローまで考慮して収益性を評価する方法である。','回収期間後のキャッシュ・フローは考慮されない。']]});

T({id:'mgt-division',f:MN,ch:'事業部制と業績評価',t:'事業部の業績評価',r:'A',
T:['投資利益率（ROI）による事業部の業績評価では，事業部長が全社的には有利な投資案を棄却するという部分最適化の問題が生じることがある。',
'残余利益（RI）は，事業部利益から投資額に資本コスト率を乗じた額を差し引いて算定する。',
'事業部長の業績評価には，事業部長にとって管理可能な項目から算定される管理可能利益を用いることが望ましい。',
'経済的付加価値（EVA）は，税引後営業利益から投下資本に加重平均資本コストを乗じた資本費用を差し引いて算定される。',
'振替価格の設定方法には，市価基準，原価基準，交渉価格基準などがある。'],
F:[['残余利益は比率で表示されるため，規模の異なる事業部の比較に最も適している。','残余利益は金額であり，規模の影響を受ける。比率で表示されるのは投資利益率である。'],
['投資利益率による業績評価では，部分最適化の問題が生じることはない。','現在の投資利益率を下回る投資案を棄却するなど，部分最適化の問題が生じうる。'],
['事業部長の業績評価には，本社費配賦後の事業部純利益を用いることが最も望ましい。','事業部長には管理不能な本社費配賦額を含むため，管理可能利益が望ましい。'],
['市価基準による振替価格は，外部市場が存在しない中間製品についても容易に適用できる。','外部市場がなければ市価基準の適用は困難である。'],
['EVAは，税引前当期純利益から支払利息のみを差し引いて算定する。','税引後営業利益から株主資本コストを含む資本費用を差し引いて算定する。']]});

T({id:'mgt-strategic',f:MN,ch:'戦略的管理会計',t:'BSC・原価企画・ABC・品質原価計算',r:'A',
T:['バランスト・スコアカードは，財務の視点，顧客の視点，社内ビジネス・プロセスの視点，学習と成長の視点の4つの視点から業績を評価する。',
'戦略マップは，4つの視点の戦略目標間の因果関係を図示したものである。',
'原価企画は，製品の企画・設計段階から目標原価を設定し，その作り込みを図る活動である。',
'目標原価の設定方法には，控除法，積上法，統合法（折衷法）がある。',
'活動基準原価計算（ABC）では，資源を活動に，活動をコスト・ドライバーに基づいて原価計算対象に割り当てる。',
'品質原価計算では，品質コストを予防原価，評価原価，内部失敗原価，外部失敗原価に分類する。'],
F:[['バランスト・スコアカードは，財務的指標のみで業績を評価する手法である。','非財務的指標も含めた4つの視点で評価する。'],
['原価企画は，主として製造段階で標準原価との差異を分析して原価低減を図る活動である。','原価企画は企画・設計段階での源流管理である。'],
['品質原価計算において，予防原価と評価原価を増加させると，一般に失敗原価も増加する。','一般に失敗原価は減少する（トレードオフ関係）。'],
['ABCでは，すべての製造間接費を直接作業時間という単一の配賦基準で製品に配賦する。','複数のコスト・ドライバーを用いる。'],
['目標原価の設定方法のうち控除法は，現在の原価を積み上げて目標原価とする方法である。','それは積上法の説明である。控除法は予定販売価格から目標利益を控除する。'],
['原価企画が行われる企画・設計段階は，製造段階に比べて原価低減の余地が小さい。','企画・設計段階で原価の大部分が決まるため，原価低減の余地は大きい。']]});

T({id:'mgt-finance',f:MN,ch:'第21章〜第22章 経営分析・資金管理',t:'経営分析と資金管理',r:'B',
T:['キャッシュ・コンバージョン・サイクルは，売上債権回転日数と棚卸資産回転日数の合計から仕入債務回転日数を差し引いて算定される。',
'流動比率は流動資産を流動負債で除した比率であり，短期的な支払能力を示す。',
'当座比率の計算に用いる当座資産には，棚卸資産は含まれない。',
'ROEは，売上高当期純利益率×総資本回転率×財務レバレッジ（総資本÷自己資本）に分解できる。',
'固定長期適合率は，固定資産を自己資本と固定負債の合計で除した比率であり，100%以下が望ましいとされる。'],
F:[['キャッシュ・コンバージョン・サイクルは，仕入債務回転日数が長くなるほど長くなる。','仕入債務回転日数が長いほど短くなる。'],
['当座比率の計算では，当座資産に棚卸資産を含める。','棚卸資産は含めない。'],
['固定比率（固定資産÷自己資本）は，低いほど長期的な財務の安全性が低いことを示す。','固定比率は低いほど安全性が高い。'],
['ROEは，売上高営業利益率と総資本回転率の積として求められる。','その積は総資本営業利益率である。ROEには財務レバレッジを乗じる。'],
['財務レバレッジ（総資本÷自己資本）が高いほど，自己資本比率も高くなる。','財務レバレッジが高いほど自己資本比率は低い。']]});

/* ============ 企業法 ============ */
const LW='law-t';
T({id:'law-mochibun',f:LW,ch:'第9章 持分会社',t:'持分会社',r:'B',
T:['合名会社の社員は，全員が会社の債務について直接・無限・連帯の責任を負う。',
'合資会社は，無限責任社員と有限責任社員とで構成される。',
'合同会社の社員になろうとする者は，定款の作成後，合同会社の設立の登記をする時までに，その出資に係る金銭の全額を払い込み，又は金銭以外の財産の全部を給付しなければならない。',
'持分会社の業務は，定款に別段の定めがある場合を除き，社員の過半数をもって決定する。',
'持分会社の定款の変更は，定款に別段の定めがある場合を除き，総社員の同意によってしなければならない。'],
F:[['合同会社の社員は，会社の債務について直接・無限の責任を負う。','合同会社の社員は全員が有限責任社員である。'],
['合資会社の有限責任社員は，労務や信用を出資の目的とすることができる。','有限責任社員の出資は金銭等に限られる。'],
['持分会社の定款の変更は，定款に別段の定めがない限り，社員の過半数の同意で行うことができる。','原則として総社員の同意が必要である。'],
['株式会社は持分会社へ組織変更できるが，持分会社が株式会社へ組織変更することはできない。','持分会社から株式会社への組織変更も可能である。'],
['持分会社の社員は，定款に別段の定めがない限り，業務を執行する権限を有しない。','定款に別段の定めがない限り，各社員が業務を執行する。']]});

T({id:'law-kk',f:LW,ch:'第2章 株式会社',t:'株式会社の特質と基本概念',r:'A',
T:['株主の責任は，その有する株式の引受価額を限度とする。',
'公開会社とは，その発行する全部又は一部の株式の内容として，譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない株式会社をいう。',
'大会社とは，最終事業年度に係る貸借対照表に資本金として計上した額が5億円以上であるか，又は負債の部に計上した額の合計額が200億円以上である株式会社をいう。',
'株式会社は，株主を，その有する株式の内容及び数に応じて，平等に取り扱わなければならない。',
'公開会社でない株式会社は，剰余金の配当，残余財産の分配，株主総会における議決権について，株主ごとに異なる取扱いを行う旨を定款で定めることができる。'],
F:[['大会社とは，資本金5億円以上かつ負債総額200億円以上の株式会社をいう。','「かつ」ではなく「又は」である。'],
['大会社に該当するかどうかは，当該事業年度の末日の資本金の額によって判定する。','最終事業年度に係る貸借対照表の計上額によって判定する。'],
['公開会社とは，その発行する株式が金融商品取引所に上場されている株式会社をいう。','公開会社かどうかは定款上の譲渡制限の定めの有無で決まり，上場の有無とは関係がない。'],
['公開会社であっても，剰余金の配当について株主ごとに異なる取扱いを行う旨を定款で定めることができる。','属人的な定めができるのは公開会社でない株式会社に限られる。'],
['株主は，会社債権者に対して，出資額を超えて直接に責任を負う。','株主は間接有限責任を負うにとどまる。']]});

T({id:'law-classes',f:LW,ch:'第4章 株式',t:'株式の内容と種類株式',r:'A',
T:['株式会社は，剰余金の配当や残余財産の分配について内容の異なる2以上の種類の株式を発行することができる。',
'公開会社において，議決権制限株式の数が発行済株式の総数の2分の1を超えるに至ったときは，直ちに2分の1以下にするための必要な措置をとらなければならない。',
'取得条項付株式とは，一定の事由が生じたことを条件として株式会社がその株式を取得することができる株式をいう。',
'全部取得条項付種類株式の全部の取得は，株主総会の特別決議によって行う。',
'拒否権付種類株式は，株主総会等の決議事項について，その決議のほか当該種類株主総会の決議を必要とする旨を定めた種類株式である。'],
F:[['公開会社において，議決権制限株式の数が発行済株式総数の3分の1を超えた場合には，直ちに是正措置をとらなければならない。','基準は2分の1である。'],
['取締役・監査役の選任に関する種類株式は，公開会社でも発行することができる。','公開会社及び指名委員会等設置会社は発行できない。'],
['全部取得条項付種類株式の取得は，取締役会の決議のみで行うことができる。','株主総会の特別決議が必要である。'],
['剰余金の配当を受ける権利と残余財産の分配を受ける権利の全部を与えない株式を発行する旨の定款の定めも有効である。','両方の権利を全部与えない旨の定款の定めは効力を有しない。'],
['取得請求権付株式とは，一定の事由の発生により会社が株主の同意なく取得できる株式をいう。','それは取得条項付株式の説明である。']]});

T({id:'law-transfer',f:LW,ch:'第4章 株式',t:'株式の譲渡と譲渡制限',r:'A',
T:['株券発行会社の株式の譲渡は，当該株式に係る株券を交付しなければ，その効力を生じない（自己株式の処分による場合を除く）。',
'株券発行会社以外の会社における株式の譲渡は，株主名簿の名義書換えをしなければ，株式会社その他の第三者に対抗することができない。',
'譲渡制限株式の譲渡承認の決定機関は，定款に別段の定めがある場合を除き，取締役会設置会社では取締役会，それ以外の会社では株主総会である。',
'株式会社が譲渡承認請求の日から2週間（定款で短縮可）以内に決定の内容を通知しなかった場合には，譲渡を承認したものとみなされる。',
'株式会社が譲渡を承認しない旨の決定をする場合，承認請求者の請求により，株式会社又は指定買取人が当該株式を買い取らなければならない。'],
F:[['株券発行会社における株式の譲渡は当事者の意思表示のみで効力を生じ，株券の交付は対抗要件にすぎない。','株券の交付は効力発生要件である。'],
['株券発行会社以外の会社における株式の譲渡は，名義書換えがなければ当事者間でも効力を生じない。','当事者間では意思表示で効力を生じ，名義書換えは対抗要件である。'],
['取締役会設置会社であっても，譲渡制限株式の譲渡承認の決定機関は常に株主総会である。','原則として取締役会である。'],
['株式会社は，定款で株式の譲渡を全面的に禁止することができる。','譲渡に会社の承認を要するとすることはできるが，禁止はできない。'],
['株式会社が2週間以内に決定の通知をしなかったときは，譲渡を承認しなかったものとみなされる。','承認したものとみなされる。']]});

T({id:'law-treasury',f:LW,ch:'第4章 株式',t:'自己株式の取得',r:'A',
T:['株主との合意による自己株式の有償取得は，原則として株主総会の普通決議により，取得する株式の数，対価の内容及び総額，取得期間（1年以内）を定めて行う。',
'特定の株主から自己株式を取得する場合には株主総会の特別決議が必要であり，他の株主は自己を売主に追加するよう請求することができる。',
'自己株式の有償取得は，原則として分配可能額の範囲内で行わなければならない。',
'株式会社は，その保有する自己株式について議決権を有しない。',
'取締役会設置会社における自己株式の消却は，取締役会の決議によって行う。'],
F:[['株式会社は，保有する自己株式について剰余金の配当を受けることができる。','自己株式には剰余金の配当をすることができない。'],
['特定の株主から自己株式を取得する場合でも，株主総会の普通決議で足りる。','特別決議が必要である。'],
['自己株式の取得には，財源規制が一切及ばない。','原則として分配可能額による財源規制が及ぶ。'],
['株主との合意による自己株式の取得の決議で定める取得期間は，最長2年とすることができる。','取得期間は1年以内である。'],
['子会社は，いかなる場合であっても親会社株式を取得することができない。','組織再編に際して取得する場合など例外がある（相当の時期に処分する必要がある）。']]});

T({id:'law-gm',f:LW,ch:'第3章 機関（株主総会）',t:'株主総会の招集と決議',r:'A',
T:['公開会社における株主総会の招集通知は，株主総会の日の2週間前までに発しなければならない。',
'普通決議は，定款に別段の定めがある場合を除き，議決権を行使できる株主の議決権の過半数を有する株主が出席し，出席した株主の議決権の過半数をもって行う。',
'特別決議の定足数は，定款で議決権を行使できる株主の議決権の3分の1以上の割合まで引き下げることができる。',
'株主総会の決議の方法が著しく不公正な場合には，決議の日から3か月以内に決議取消しの訴えを提起することができる。',
'株主総会の目的である事項について議決権を行使できる株主の全員が書面等で提案に同意したときは，当該提案を可決する旨の株主総会決議があったものとみなされる。'],
F:[['公開会社における株主総会の招集通知は，株主総会の日の1週間前までに発すれば足りる。','公開会社では2週間前までである。'],
['特別決議は，出席した株主の議決権の過半数をもって行う。','出席した株主の議決権の3分の2以上の多数が必要である。'],
['株主総会決議取消しの訴えは，決議の日から1年以内であれば提起することができる。','3か月以内である。'],
['株主総会の決議の内容が定款に違反する場合は，決議無効確認の訴えの対象となる。','決議内容の定款違反は取消事由である（法令違反が無効事由）。'],
['取締役会設置会社の株主総会は，株式会社の組織・運営・管理その他一切の事項について決議することができる。','それは取締役会非設置会社の株主総会である。取締役会設置会社では法令・定款に定める事項に限られる。']]});

T({id:'law-proposal',f:LW,ch:'第3章 機関（株主総会）',t:'株主提案権と議決権の行使',r:'A',
T:['公開会社である取締役会設置会社において議題提案権を行使するには，総株主の議決権の100分の1以上又は300個以上の議決権を6か月前から引き続き有していることが必要である。',
'取締役会設置会社における株主提案権は，株主総会の日の8週間前（定款で短縮可）までに行使しなければならない。',
'取締役会設置会社の株主が議案の要領の通知を請求する場合，提案する議案の数が10を超えるときは，会社は10を超える部分について請求を拒絶することができる。',
'株主は，代理人によってその議決権を行使することができる。',
'議決権を行使することができる株主の数が1,000人以上である株式会社は，原則として書面による議決権行使を認めなければならない。'],
F:[['公開会社である取締役会設置会社の議題提案権は，1株でも保有していれば行使できる。','持株要件と6か月の保有期間要件がある。'],
['取締役会設置会社における株主提案権は，株主総会の日の2週間前までに行使すれば足りる。','8週間前までである。'],
['議決権の代理行使は，定款で全面的に禁止することができる。','代理行使の権利は定款でも奪えない（代理人資格の制限は判例上認められている）。'],
['議決権の不統一行使は，いかなる場合も認められない。','一定の手続により不統一行使が認められる。'],
['取締役会設置会社であっても，株主が提案できる議案の数に制限はない。','10を超える部分は拒絶できる。']]});

T({id:'law-board',f:LW,ch:'第3章 機関（取締役・取締役会）',t:'取締役と取締役会',r:'A',
T:['取締役会設置会社においては，取締役は3人以上でなければならない。',
'取締役の任期は，原則として選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。',
'公開会社でない株式会社（監査等委員会設置会社・指名委員会等設置会社を除く）は，定款により取締役の任期を選任後10年以内に終了する事業年度に関する定時株主総会の終結の時まで伸長することができる。',
'取締役会は，重要な財産の処分及び譲受け，多額の借財，支配人その他の重要な使用人の選任及び解任などの決定を取締役に委任することができない。',
'決議について特別の利害関係を有する取締役は，取締役会の議決に加わることができない。',
'取締役は，いつでも，株主総会の決議によって解任することができる。'],
F:[['取締役会設置会社の取締役は2人以上いれば足りる。','3人以上必要である。'],
['取締役会の決議要件は，定款により軽減することができる。','定款で加重することはできるが軽減はできない。'],
['取締役は，取締役会の決議について代理人により議決権を行使することができる。','取締役会での代理行使は認められない。'],
['公開会社である取締役会設置会社は，定款で取締役の任期を10年まで伸長することができる。','任期の伸長は公開会社でない会社に限られる。'],
['取締役会は，多額の借財の決定を代表取締役に委任することができる。','多額の借財は取締役会の専決事項である。'],
['正当な理由なく解任された取締役であっても，会社に対して損害賠償を請求することはできない。','解任に正当な理由がない場合には損害賠償を請求できる。']]});

T({id:'law-duty',f:LW,ch:'第3章 機関（取締役の義務）',t:'競業取引・利益相反取引',r:'A',
T:['取締役が自己又は第三者のために株式会社の事業の部類に属する取引をしようとするときは，取締役会設置会社では取締役会において重要な事実を開示し，その承認を受けなければならない。',
'取締役会設置会社において，競業取引や利益相反取引をした取締役は，当該取引後遅滞なく，重要な事実を取締役会に報告しなければならない。',
'利益相反取引によって株式会社に損害が生じたときは，当該取引をした取締役等は，その任務を怠ったものと推定される。',
'自己のために株式会社と直接取引をした取締役の責任は，任務を怠ったことが当該取締役の責めに帰することができない事由によるものであっても免れることができない。',
'取締役は，法令及び定款並びに株主総会の決議を遵守し，株式会社のため忠実にその職務を行わなければならない。'],
F:[['取締役会設置会社において，競業取引の承認は株主総会の普通決議によって行う。','取締役会設置会社では取締役会の承認による。'],
['承認を受けた利益相反取引によって会社に損害が生じた場合には，取締役は一切責任を負わない。','承認を受けていても任務懈怠が推定される。'],
['自己のために会社と直接取引をした取締役も，帰責事由がないことを証明すれば責任を免れる。','無過失責任であり，帰責事由がないことをもって責任を免れない。'],
['競業取引について事前に承認を受けた場合には，事後に取締役会へ報告する必要はない。','取締役会設置会社では事後報告も必要である。'],
['取締役会の承認を受けない利益相反取引であっても，会社との関係では当然に有効である。','承認を欠く取引は無効である（善意の第三者には無効を主張できない相対的無効）。']]});

T({id:'law-kansayaku',f:LW,ch:'第3章 機関（監査役・監査役会）',t:'監査役と監査役会',r:'A',
T:['監査役は，取締役（会計参与設置会社では取締役及び会計参与）の職務の執行を監査し，監査報告を作成しなければならない。',
'監査役の任期は選任後4年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までであり，定款によっても短縮することはできない。',
'監査役会設置会社においては，監査役は3人以上で，そのうち半数以上は社外監査役でなければならない。',
'監査役会は，監査役の中から常勤の監査役を選定しなければならない。',
'監査役の解任は，株主総会の特別決議によらなければならない。',
'公開会社である大会社（監査等委員会設置会社及び指名委員会等設置会社を除く）は，監査役会及び会計監査人を置かなければならない。'],
F:[['監査役会設置会社において，監査役の過半数は社外監査役でなければならない。','半数以上である。'],
['監査役の任期は，定款によって2年に短縮することができる。','監査役の任期は短縮できない。'],
['監査役の解任は，株主総会の普通決議によって行うことができる。','特別決議が必要である。'],
['監査役会の決議があれば，個々の監査役の権限行使を制限することができる。','監査役は独任制の機関であり，監査役会は各監査役の権限の行使を妨げることはできない。'],
['監査役は，子会社の取締役を兼任することができる。','子会社の取締役・使用人等との兼任は禁止されている。'],
['監査役会設置会社や会計監査人設置会社であっても，定款で監査役の監査の範囲を会計に関するものに限定することができる。','監査範囲の限定ができるのは，公開会社でない会社のうち監査役会設置会社・会計監査人設置会社以外の会社である。']]});

T({id:'law-auditor',f:LW,ch:'第3章 機関（会計監査人・会計参与）',t:'会計監査人と会計参与',r:'A',
T:['会計監査人は，公認会計士又は監査法人でなければならない。',
'会計監査人の任期は選任後1年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までであり，当該総会で別段の決議がなければ再任されたものとみなされる。',
'監査役設置会社では，株主総会に提出する会計監査人の選任・解任・不再任に関する議案の内容は，監査役（監査役会設置会社では監査役会）が決定する。',
'取締役は，会計監査人の報酬等を定める場合には，監査役（監査役会）の同意を得なければならない。',
'会計参与は，公認会計士若しくは監査法人又は税理士若しくは税理士法人でなければならない。'],
F:[['会計監査人の任期は2年であり，定款で1年に短縮することができる。','任期は1年である。'],
['会計監査人の選任議案の内容は取締役会が決定し，監査役の同意を得れば足りる。','議案の内容は監査役（監査役会）が決定する。'],
['会計参与には，弁護士もなることができる。','公認会計士・監査法人・税理士・税理士法人に限られる。'],
['会計監査人は役員ではないため，株主代表訴訟の対象とならない。','会計監査人は「役員等」に含まれ，代表訴訟の対象となる。'],
['大会社であっても，公開会社でなければ会計監査人を置く必要はない。','大会社は公開会社であるか否かを問わず会計監査人を置かなければならない。']]});

T({id:'law-committee',f:LW,ch:'第3章 機関（委員会型）',t:'指名委員会等設置会社・監査等委員会設置会社',r:'A',
T:['指名委員会等設置会社の各委員会は委員3人以上で組織し，各委員会の委員の過半数は社外取締役でなければならない。',
'指名委員会等設置会社の業務執行は執行役が行い，取締役は，法令に別段の定めがある場合を除き，業務を執行することができない。',
'監査等委員会設置会社の監査等委員である取締役は3人以上で，その過半数は社外取締役でなければならない。',
'監査等委員である取締役の任期は2年であり，定款等によって短縮することはできない。',
'監査等委員会設置会社及び指名委員会等設置会社は，監査役を置くことができず，会計監査人を置かなければならない。'],
F:[['指名委員会等設置会社の各委員会は，委員の半数以上が社外取締役であれば足りる。','過半数が社外取締役でなければならない。'],
['指名委員会等設置会社の取締役の任期は2年である。','1年である。'],
['監査等委員である取締役の任期は1年である。','2年である（監査等委員以外の取締役は1年）。'],
['監査等委員会設置会社は，監査役を置くこともできる。','監査役を置くことはできない。'],
['指名委員会等設置会社において，監査委員は執行役を兼ねることができる。','監査委員は執行役・業務執行取締役等を兼ねることができない。']]});

T({id:'law-liability',f:LW,ch:'第3章 機関（役員等の責任）',t:'役員等の責任と株主代表訴訟',r:'A',
T:['役員等は，その任務を怠ったときは，株式会社に対し，これによって生じた損害を賠償する責任を負う。',
'役員等の株式会社に対する任務懈怠責任の全部の免除には，総株主の同意が必要である。',
'役員等がその職務を行うについて悪意又は重大な過失があったときは，これによって第三者に生じた損害を賠償する責任を負う。',
'株主が責任追及等の訴えの提起を請求した日から60日以内に株式会社が訴えを提起しないときは，当該株主は株式会社のために責任追及等の訴えを提起することができる。',
'株式会社は，定款の定めに基づき，非業務執行取締役等との間で責任限定契約を締結することができる。'],
F:[['役員等の株式会社に対する任務懈怠責任は，取締役会の決議によっていつでも全部免除することができる。','全部免除には総株主の同意が必要である。'],
['役員等の第三者に対する責任は，軽過失の場合にも生じる。','悪意又は重大な過失が要件である。'],
['株主代表訴訟を提起するには，あらかじめ裁判所の許可を得なければならない。','裁判所の許可は不要であり，会社への提訴請求が前提となる。'],
['株主が提訴請求した日から30日以内に会社が訴えを提起しない場合，株主は代表訴訟を提起できる。','60日である。'],
['責任限定契約は，代表取締役との間でも締結することができる。','責任限定契約は非業務執行取締役等に限られる。']]});

T({id:'law-setup',f:LW,ch:'第5章 設立',t:'株式会社の設立',r:'A',
T:['株式会社の設立の方法には，発起設立と募集設立がある。',
'発起人は，株式会社の設立に際し，設立時発行株式を1株以上引き受けなければならない。',
'現物出資，財産引受け，発起人の報酬その他の特別の利益，設立費用は変態設立事項であり，定款に記載又は記録しなければ効力を生じない。',
'現物出資財産等について定款に記載された価額の総額が500万円を超えない場合には，検査役の調査は不要である。',
'株式会社は，その本店の所在地において設立の登記をすることによって成立する。',
'募集設立においては，創立総会を開催しなければならない。'],
F:[['発起人は，設立時発行株式を引き受けなくてもよい。','発起人は1株以上引き受けなければならない。'],
['変態設立事項は，定款に記載しなくても，発起人全員の同意があれば効力を生じる。','定款に記載しなければ効力を生じない。'],
['現物出資財産の定款記載価額の総額が1,000万円以下の場合には，検査役の調査は不要である。','基準額は500万円である。'],
['株式会社は，定款の認証を受けた時に成立する。','設立の登記によって成立する。'],
['発起設立においても，創立総会を開催しなければならない。','創立総会は募集設立の場合に開催する。']]});

T({id:'law-issue',f:LW,ch:'第6章 資金調達',t:'募集株式の発行等',r:'A',
T:['公開会社においては，払込金額が特に有利な金額である場合を除き，募集事項は取締役会の決議によって定める。',
'公開会社でない株式会社においては，募集事項の決定は株主総会の特別決議による（取締役・取締役会への委任が可能）。',
'公開会社が取締役会の決議により募集事項を定めた場合，払込期日（又は払込期間の初日）の2週間前までに株主に対し募集事項を通知又は公告しなければならない。',
'株式の発行が法令・定款に違反する場合や著しく不公正な方法による場合において，株主が不利益を受けるおそれがあるときは，株主は発行の差止めを請求することができる。',
'公開会社における新株発行無効の訴えは，株式の発行の効力が生じた日から6か月以内に提起しなければならない。'],
F:[['公開会社において株主以外の者に特に有利な払込金額で募集株式を発行する場合でも，取締役会の決議で足りる。','有利発行には株主総会の特別決議が必要である。'],
['公開会社でない会社では，募集事項の決定は常に取締役会の決議のみで行う。','原則として株主総会の特別決議による。'],
['公開会社における新株発行無効の訴えは，効力発生日から1年以内であれば提起できる。','公開会社は6か月以内（公開会社でない会社は1年以内）である。'],
['募集株式の発行の差止めを請求できるのは会社債権者に限られる。','差止請求権者は株主である。'],
['募集株式の引受人は，出資の履行をしなかった場合でも株主となる権利を失わない。','出資の履行をしないときは株主となる権利を失う（失権）。']]});

T({id:'law-bond',f:LW,ch:'第6章 資金調達',t:'新株予約権と社債',r:'B',
T:['新株予約権とは，株式会社に対して行使することにより当該株式会社の株式の交付を受けることができる権利をいう。',

T({id:'law-calc',f:LW,ch:'第7章 株式会社の計算等',t:'計算書類と剰余金の配当',r:'A',

'取締役会設置会社は，一事業年度の途中において1回に限り，取締役会の決議により金銭による中間配当をすることができる旨を定款で定めることができる。',
'純資産額が300万円を下回る場合には，剰余金の配当をすることができない。'],

['中間配当は，金銭以外の財産による配当として行うこともできる。','中間配当は金銭に限られる。'],
['純資産額が500万円を下回る場合には，剰余金の配当をすることができない。','300万円である。'],
['資本金の額の減少は，常に取締役会の決議のみで行うことができる。','原則として株主総会の特別決議が必要である。'],
['資本金の額を減少する場合でも，債権者異議手続を行う必要はない。','債権者異議手続が必要である。']]});

T({id:'law-reorg',f:LW,ch:'第10章 組織再編行為等',t:'組織再編（合併・分割・株式交換等）',r:'A',

F:[['簡易組織再編の要件は，交付する対価の額が存続会社の純資産額の3分の1を超えないことである。','5分の1である。'],
['略式組織再編は，特別支配会社が被支配会社の総株主の議決権の3分の2以上を有する場合に認められる。','10分の9以上である。'],
['合併無効の訴えは，効力発生日から1年以内であれば提起することができる。','6か月以内である。'],
['吸収合併の消滅会社の債権者は，債権者異議手続の対象とならない。','消滅会社の債権者も対象となる。'],
['株式交付は，他の株式会社を完全子会社とする場合にのみ利用することができる。','株式交付は子会社化のための制度であり，完全子会社化は株式交換による。'],
['新設合併の設立会社は，合併契約の締結日に成立する。','設立の登記によって成立する。']]});

['株式の分割には，常に株主総会の特別決議が必要である。','取締役会設置会社では取締役会，それ以外は株主総会の普通決議である。'],

['特別支配株主の株式等売渡請求には，対象会社の株主総会の特別決議による承認が必要である。','対象会社の承認（取締役会設置会社では取締役会の決議）による。'],

T({id:'law-shoho',f:LW,ch:'商法',t:'商人と商行為',r:'B',

/* ============ 監査論 ============ */
const AU='aud-t';
T({id:'aud-purpose',f:AU,ch:'第1章 監査総論',t:'財務諸表監査の目的と二重責任の原則',r:'A',
T:['財務諸表監査の目的は，経営者の作成した財務諸表が，一般に公正妥当と認められる企業会計の基準に準拠して，すべての重要な点において適正に表示しているかどうかについて，監査人が自ら入手した監査証拠に基づいて判断した結果を意見として表明することにある。',
'財務諸表の表示が適正である旨の監査人の意見は，財務諸表には全体として重要な虚偽の表示がないということについて，合理的な保証を得たとの監査人の判断を含んでいる。',
'合理的な保証とは，絶対的ではないが高い水準の保証をいう。',
'経営者は財務諸表の作成責任を負い，監査人は財務諸表に対する意見表明の責任を負う（二重責任の原則）。',
'監査人の意見は，財務諸表の信頼性を担保するものであり，企業の将来の存続可能性や経営の効率性を保証するものではない。'],
F:[['合理的な保証とは，財務諸表に虚偽の表示が全く存在しないことを絶対的に保証することをいう。','絶対的ではないが高い水準の保証である。'],
['二重責任の原則のもとでは，監査人が財務諸表を作成し，経営者がそれを確認する責任を負う。','財務諸表の作成責任は経営者にある。'],
['監査人の意見表明は，財務諸表の適正性に加えて，経営の効率性や将来の業績についての保証も含む。','経営の効率性や将来の業績は保証の対象ではない。'],
['監査人は，財務諸表の重要な虚偽表示の有無にかかわらず，すべての不正を発見する責任を負う。','重要な虚偽表示がないことについて合理的な保証を得る責任を負う。'],
['監査人は，経営者から提供された情報のみに依拠して意見を形成し，自ら監査証拠を入手する必要はない。','監査人は自ら入手した監査証拠に基づいて判断する。']]});

T({id:'aud-general',f:AU,ch:'第2章 監査主体論',t:'一般基準（専門能力・独立性・正当な注意・守秘義務）',r:'A',

'監査人は，常に公正不偏の態度を保持し，独立の立場を損なう利害や独立の立場に疑いを招く外観を有してはならない。',
'監査人は，職業的専門家としての正当な注意を払い，懐疑心を保持して監査を行わなければならない。',
'監査人は，業務上知り得た事項を正当な理由なく他に漏らし，又は窃用してはならない。',
'監査人は，不正な財務報告や資産の流用等の不正な行為が財務諸表に重要な虚偽の表示をもたらす場合があることにも留意して監査を行わなければならない。'],
F:[['監査人の独立性は精神的独立性のみが求められ，外観的独立性は求められない。','外観的独立性も求められる。'],
['職業的懐疑心とは，経営者が不誠実であることを前提として監査を行う姿勢をいう。','経営者が誠実であるとも不誠実であるとも想定せず，批判的に評価する姿勢である。'],
['監査人は，業務上知り得た秘密について，いかなる理由があっても開示することはできない。','正当な理由があれば開示できる。'],
['監査人は，監査事務所の品質管理の方針と手続に従う必要はなく，自らの判断のみで監査を行えばよい。','品質管理の方針と手続に従って監査を実施しなければならない。']]});

T({id:'aud-risk',f:AU,ch:'第3章 監査実施論',t:'リスク・アプローチと監査リスク',r:'A',
T:['監査リスクとは，監査人が，財務諸表の重要な虚偽表示を看過して誤った意見を形成する可能性をいう。',
'監査リスクは，重要な虚偽表示リスクと発見リスクから構成される。',
'重要な虚偽表示リスクは，固有リスクと統制リスクを結合したものである。',
'監査人は，重要な虚偽表示リスクが高いと評価した場合には，発見リスクを低く設定し，より多くの又は証明力の強い監査証拠を入手する必要がある。',
'財務諸表項目レベルの重要な虚偽表示リスクを評価する際には，固有リスクと統制リスクを分けて評価しなければならない。'],
F:[['固有リスクは，監査人が実施する監査手続によって低減させることができる。','固有リスクは企業側のリスクであり，監査人は評価するのみで低減させることはできない。'],
['統制リスクとは，監査人が監査手続を実施しても重要な虚偽表示を発見できないリスクをいう。','それは発見リスクの説明である。'],
['重要な虚偽表示リスクが高いと評価した場合には，発見リスクを高く設定することができる。','発見リスクを低く設定する必要がある。'],
['監査リスクは，監査手続を十分に増やすことによってゼロにすることができる。','監査には固有の限界があり，ゼロにはできない。'],
['特別な検討を必要とするリスクについては，内部統制の運用評価手続のみを実施すれば足り，実証手続は不要である。','特別な検討を必要とするリスクには，個別に対応する実証手続を実施しなければならない。']]});

T({id:'aud-materiality',f:AU,ch:'第3章 監査実施論',t:'重要性と虚偽表示の評価',r:'A',
T:['監査人は，監査計画の策定に当たり，財務諸表全体としての重要性の基準値を決定しなければならない。',
'監査人は，未修正の虚偽表示の合計が重要性の基準値を上回る可能性を適切な低い水準に抑えるため，重要性の基準値より低い金額で手続実施上の重要性を設定する。',
'重要性は，金額的側面だけでなく質的側面も考慮して判断する。',
'監査人は，明らかに僅少なものを除き，監査の過程で識別した虚偽表示を集計しなければならない。',
'監査人は，監査の過程で識別した虚偽表示を適切な階層の経営者に適時に報告し，修正を求めなければならない。'],
F:[['重要性の基準値は，監査計画の策定時に一度決定したら，監査の過程で改訂することはできない。','監査の過程で新たな情報を入手した場合には改訂する。'],
['手続実施上の重要性は，重要性の基準値よりも高い金額に設定する。','重要性の基準値より低い金額に設定する。'],
['重要性の判断は金額的側面のみで行い，質的側面は考慮しない。','質的側面も考慮する。'],
['監査の過程で識別した虚偽表示のうち，個々に重要でないものは集計する必要はない。','明らかに僅少なもの以外は集計する。']]});

T({id:'aud-evidence',f:AU,ch:'第3章 監査実施論',t:'監査証拠と監査手続',r:'A',
T:['監査人は，意見表明の基礎となる十分かつ適切な監査証拠を入手しなければならない。',
'監査証拠の適切性とは監査証拠の質的な尺度であり，適合性と証明力から構成される。',
'一般に，企業から独立した外部の情報源から入手した監査証拠は，企業内部で作成された監査証拠よりも証明力が強い。',
'監査手続には，リスク評価手続，運用評価手続及び実証手続がある。',
'実証手続は，詳細テストと分析的実証手続から構成される。'],
F:[['監査証拠の十分性とは，監査証拠の質的な尺度をいう。','十分性は量的な尺度であり，質的な尺度は適切性である。'],
['質問のみによって，内部統制の運用状況の有効性について十分な監査証拠を入手できる。','質問だけでは十分でなく，他の手続と組み合わせる必要がある。'],
['口頭による証拠は，文書化された証拠よりも一般に証明力が強い。','文書化された証拠の方が一般に証明力が強い。'],
['監査証拠の量を増やせば，監査証拠の質の低さを常に補うことができる。','量を増やしても質の低さを補えないことがある。'],
['再実施とは，記録や文書の計算の正確性を確かめることをいう。','それは再計算の説明である。再実施は企業が実施する手続や内部統制を監査人が独自に実施することをいう。']]});

T({id:'aud-confirm',f:AU,ch:'第3章 監査実施論',t:'確認・分析的手続・実地棚卸の立会',r:'A',
T:['確認とは，監査人が確認の相手先である第三者から文書による回答を直接入手する監査手続をいう。',
'積極的確認とは，確認回答者に確認依頼の情報に同意するか不同意であるかの回答，又は情報の提供を求める方法をいう。',
'経営者が確認依頼の送付に同意しない場合には，監査人は，その理由の妥当性を検討し，代替的な監査手続を実施しなければならない。',
'分析的手続は，リスク評価手続として実施するほか，実証手続として，また監査の最終段階で全般的な結論を形成するためにも実施する。',
'棚卸資産が財務諸表において重要である場合には，監査人は，実務的に不可能でない限り，実地棚卸の立会を実施しなければならない。'],
F:[['消極的確認は，同意しない場合にのみ回答を求める方法であり，通常，積極的確認よりも証明力が強い。','消極的確認は積極的確認よりも証明力が弱い。'],
['確認の回答は，被監査会社を経由して入手してもよい。','監査人が直接入手しなければならない。'],
['分析的手続は，監査の最終段階においてのみ実施が求められる。','リスク評価手続としても実施が求められる。'],
['経営者が確認依頼の送付に同意しない場合には，監査人は直ちに意見不表明としなければならない。','理由を検討し，代替的な手続を実施する。']]});

T({id:'aud-ic',f:AU,ch:'第3章 監査実施論',t:'内部統制の理解と運用評価',r:'A',
T:['監査人は，重要な虚偽表示リスクを識別し評価するため，企業及び企業環境（内部統制を含む）を理解しなければならない。',
'運用評価手続は，内部統制が有効に運用されていると想定する場合や，実証手続のみでは十分かつ適切な監査証拠を入手できない場合に実施する。',
'内部統制には，経営者による内部統制の無効化のリスクなどの固有の限界がある。',
'監査人は，内部統制のデザインを評価し，それが業務に適用されているかどうかを判断する。',
'監査人は，評価した重要な虚偽表示リスクの程度にかかわらず，重要な取引種類・勘定残高・注記事項に対して実証手続を立案し実施しなければならない。'],
F:[['監査人は，すべての内部統制について運用評価手続を実施しなければならない。','依拠する予定の内部統制などについて実施する。'],
['内部統制が有効に運用されていれば，実証手続を一切実施する必要はない。','重要な取引種類等には実証手続が必要である。'],
['前年度に運用評価手続を実施した内部統制は，変更がなくても毎年度必ず運用評価手続を実施しなければならない。','変更がない場合には，一定の条件のもと過年度の証拠を利用できる（少なくとも3年に1度は実施）。'],
['経営者の誠実性が高い企業では，経営者による内部統制の無効化のリスクは存在しない。','無効化のリスクはすべての企業に存在する。']]});

T({id:'aud-rep-letter',f:AU,ch:'第3章 監査実施論',t:'経営者確認書・監査調書・会計上の見積り',r:'A',
T:['経営者確認書は必要な監査証拠であるが，それ自体では記載事項について十分かつ適切な監査証拠とはならない。',
'経営者確認書の日付は，監査報告書日より後であってはならない。',
'監査人は，経験豊富な監査人が以前に当該監査に関与していなくても，実施した監査手続や入手した監査証拠，結論を理解できるように監査調書を作成しなければならない。',
'監査ファイルの最終的な整理が完了した後は，保存期間が終了するまで，監査調書を削除又は廃棄してはならない。',
'監査人は，会計上の見積りに関する重要な虚偽表示リスクを評価する際，見積りの不確実性，複雑性，主観性などの固有リスク要因を考慮する。'],
F:[['経営者確認書を入手すれば，確認事項について他の監査証拠を入手する必要はない。','経営者確認書だけでは十分かつ適切な監査証拠とはならない。'],
['経営者確認書の日付は，監査報告書日より後の日付とする。','監査報告書日より後であってはならない。'],
['監査調書には，最終的な結論のみを記載すれば足り，判断の過程を記録する必要はない。','重要な判断とその過程も記録する。'],
['経営者が要請された確認事項の確認を拒否した場合でも，監査意見に影響を及ぼすことはない。','経営者の誠実性を再評価し，意見不表明等を検討する。'],
['監査ファイルの最終的な整理が完了した後であっても，不要となった監査調書は自由に廃棄できる。','保存期間が終了するまで廃棄してはならない。']]});

T({id:'aud-opinion',f:AU,ch:'第4章 監査報告論',t:'監査意見の類型',r:'A',
T:['除外事項付意見には，限定付適正意見，不適正意見及び意見不表明がある。',
'会計方針の選択・適用等に不適切なものがあり，その影響が重要ではあるが財務諸表全体として虚偽の表示に当たるとするほどではない場合には，限定付適正意見を表明する。',
'重要な監査手続を実施できなかったことにより無限定適正意見を表明できないが，その影響が財務諸表全体に対する意見表明ができないほどではない場合には，限定付適正意見を表明する。',
'重要な監査手続を実施できず，財務諸表全体に対する意見表明のための基礎を得ることができなかったときは，意見を表明してはならない。',
'監査報告書では，冒頭に「監査意見」区分を記載し，続けて「監査意見の根拠」区分を記載する。'],
F:[['監査範囲の制約の影響が財務諸表全体に及ぶほど広範な場合には，不適正意見を表明する。','その場合は意見不表明とする。'],
['会計方針の選択・適用の不適切による影響が重要かつ広範な場合には，意見不表明とする。','その場合は不適正意見を表明する。'],
['限定付適正意見を表明する場合，監査意見の根拠区分に除外事項の内容を記載する必要はない。','除外した事項とその影響等を記載する。'],
['監査報告書では，冒頭に「監査意見の根拠」区分を記載し，その後に「監査意見」区分を記載する。','「監査意見」区分が冒頭である。'],
['強調事項区分に記載した事項は，除外事項として監査意見に影響を及ぼす。','強調事項は監査意見に影響しない。']]});

T({id:'aud-kam',f:AU,ch:'第4章 監査報告論',t:'監査上の主要な検討事項（KAM）',r:'A',
T:['監査上の主要な検討事項とは，当年度の財務諸表の監査において，監査人が職業的専門家として特に重要であると判断した事項をいう。',
'監査上の主要な検討事項は，監査役等とコミュニケーションを行った事項の中から決定する。',
'監査上の主要な検討事項の記載は，監査意見とは明確に区別され，監査意見に代わるものではない。',
'監査上の主要な検討事項の記載に当たっては，その内容，特に重要であると判断した理由及び監査上の対応を記載する。',
'意見不表明の場合には，監査上の主要な検討事項は記載しない。'],
F:[['除外事項付意見の根拠となる事項は，監査上の主要な検討事項として記載することで除外事項の記載に代えることができる。','除外事項は監査意見の根拠区分に記載し，KAMで代替することはできない。'],
['監査上の主要な検討事項は，監査役等とのコミュニケーションの有無にかかわらず決定される。','監査役等とコミュニケーションを行った事項から選定する。'],
['監査上の主要な検討事項の記載は，会社法に基づく監査においても義務付けられている。','記載が求められるのは主として金融商品取引法に基づく監査である。'],
['意見不表明の場合であっても，監査上の主要な検討事項を記載しなければならない。','意見不表明の場合は記載しない。'],
['監査人は，監査上の主要な検討事項として記載した事項について，個別に意見を表明する。','KAMについて個別の意見は表明しない。']]});

T({id:'aud-other',f:AU,ch:'第4章 監査報告論',t:'その他の記載内容・強調事項・その他の事項',r:'A',
T:['その他の記載内容とは，監査した財務諸表を含む開示書類のうち，当該財務諸表と監査報告書とを除いた部分の記載内容をいう。',
'監査人は，その他の記載内容を通読し，財務諸表や監査の過程で得た知識との間に重要な相違があるかどうかを検討する。',
'強調事項とは，財務諸表に適切に表示又は開示されている事項のうち，利用者の注意を喚起する必要があると監査人が判断した事項をいう。',
'その他の事項とは，財務諸表に表示又は開示されていない事項について，監査や監査報告書に関する利用者の理解に関連するため説明する必要があると監査人が判断した事項をいう。'],
F:[['監査人は，その他の記載内容について監査を実施し，その適正性について意見を表明する。','その他の記載内容に対して意見は表明しない。'],
['強調事項は，財務諸表に表示又は開示されていない事項について記載する。','それはその他の事項である。'],
['その他の記載内容に重要な誤りがあると結論付けた場合でも，監査報告書に記載することはない。','未修正の重要な誤りがある場合にはその内容を記載する。'],
['強調事項区分は，限定付適正意見の根拠を示すために用いられる。','強調事項は意見に影響しない。']]});

T({id:'aud-gc',f:AU,ch:'第5章 継続企業の前提',t:'継続企業の前提に関する監査人の検討',r:'A',
T:['監査人は，継続企業を前提として経営者が財務諸表を作成することが適切であるかどうかを検討しなければならない。',
'継続企業の前提に関する重要な不確実性が認められる場合でも，財務諸表に適切な注記がなされていれば無限定適正意見を表明し，監査報告書に「継続企業の前提に関する重要な不確実性」区分を設けて記載する。',
'重要な不確実性が認められるにもかかわらず適切な注記がなされていない場合には，限定付適正意見又は不適正意見を表明する。',
'継続企業を前提として財務諸表を作成することが適切でない場合に，継続企業を前提として財務諸表が作成されているときは，不適正意見を表明する。',
'経営者が継続企業の前提に関する評価を行う期間は，少なくとも期末日の翌日から12か月間である。'],
F:[['継続企業の前提に関する重要な不確実性が認められる場合には，適切な注記がなされていても限定付適正意見を表明しなければならない。','適切な注記があれば無限定適正意見である。'],
['継続企業の前提に関する重要な不確実性についての記載は，強調事項区分に記載する。','独立した「継続企業の前提に関する重要な不確実性」区分に記載する。'],
['監査人は，企業が将来にわたって存続することを保証する責任を負う。','企業の存続を保証するものではない。'],
['経営者が行う継続企業の前提に関する評価の期間は，期末日から6か月間で足りる。','少なくとも期末日の翌日から12か月間である。'],
['継続企業の前提に重要な疑義を生じさせる事象又は状況が存在すれば，対応策の内容にかかわらず直ちに注記が必要となる。','対応策を講じてもなお重要な不確実性が認められる場合に注記する。']]});

T({id:'aud-fraud',f:AU,ch:'第6章 その他の諸論点（不正）',t:'不正リスク対応基準',r:'A',
T:['不正リスク対応基準は，主として金融商品取引法に基づいて開示を行っている企業（非上場企業のうち資本金5億円未満又は売上高10億円未満かつ負債総額200億円未満の企業は除く）の財務諸表監査に適用される。',
'監査人は，経営者等の誠実性に関するこれまでの認識にかかわらず，不正リスクに常に留意し，監査の全過程を通じて職業的懐疑心を保持しなければならない。',
'監査人は，不正による重要な虚偽の表示を示唆する状況を識別した場合には，経営者に質問し説明を求めるとともに，追加的な監査手続を実施しなければならない。',
'監査人は，不正による重要な虚偽の表示の疑義があると判断した場合には，想定される不正の態様等に直接対応した監査手続を立案し，監査計画を修正しなければならない。',
'監査人は，不正リスクに対応するため，企業が想定しない要素を監査計画に組み込むことを検討しなければならない。'],
F:[['不正リスク対応基準は，会社法監査を含むすべての監査に一律に適用される。','主として金融商品取引法監査に適用される。'],
